50(0.2)(0.8)$.","h":["$np(1-p)$.","$10\\times0.8$.","Compute."]},{"topic":"Phrase","q":"$P(X\\ge2)$ for $\\text{Bin}(n,p)$ equals $1-P(X\\le\\ ?)$. Enter the number.","a":"1","alt":[],"ad":"$1$","sol":"Complement of $X\\ge2$ is $X\\le1$.","h":["Complement.","Integers.","$X\\le1$."]},{"topic":"Exact","q":"$X\\sim\\text{Bin}(2,0.3)$. $P(X=1)$.","a":"0.42","alt":[],"ad":"$0.42$","sol":"$2(0.3)(0.7)$.","h":["$\\binom21=2$.","$0.3\\cdot0.7$.","Multiply."]},{"topic":"Least n","q":"Least $n$ with $0.5^n\u003c0.1$?","a":"4","alt":[],"ad":"$4$","sol":"$0.5^3=0.125$, $0.5^4=0.0625$.","h":["Try values.","$0.5^3$.","$0.5^4$."]},{"topic":"Model","q":"A multiple-choice test has 10 questions with 4 options each. Guessing, what is the mean score?","a":"2.5","alt":[],"ad":"$2.5$","sol":"$np=10\\times\\frac14$.","h":["$p=\\frac14$.","$np$.","Compute."]},{"topic":"Sd","q":"$\\text{Bin}(100,0.5)$ standard deviation?","a":"5","alt":[],"ad":"$5$","sol":"$\\sqrt{25}$.","h":["Variance is $25$.","Square root.","Done."]}],"comets":[{"topic":"Extension: How many trials?","q":"$X\\sim\\text{Bin}(n,0.5)$. What is the smallest $n$ with $P(X\\ge1)>0.99$?","a":"7","alt":["n=7"],"ad":"$n=7$","sol":"Need $1-0.5^n>0.99$, so $0.5^n\u003c0.01$. $0.5^6=0.0156$ (no), $0.5^7=0.0078$ (yes), so $n=7$.","h":["Use the complement.","Need $0.5^n\u003c0.01$.","Test $n=6,7$."]},{"topic":"Extension: Most likely value","q":"For $X\\sim\\text{Bin}(10,0.3)$ which value of $k$ is most likely (the mode)?","a":"3","alt":["k=3"],"ad":"$k=3$","sol":"$P(3)=0.2668$, $P(2)=0.2335$, $P(4)=0.2001$. So $k=3$.","h":["Mean is 3.","Compare neighbours.","Calculate $P(2)$, $P(3)$, $P(4)$."]},{"topic":"Extension: Most likely value","q":"For $X\\sim\\text{Bin}(10,0.5)$, which value of $X$ is most likely?","a":"5","alt":[],"ad":"$5$","sol":"The distribution is symmetric about the mean $5$.","h":["Symmetry.","Mean $np=5$.","Mode."]}],"hours":3},"ms3-c01":{"id":"ms3-c01","interactive":"complex","summary":"Complex numbers extend the reals so that every polynomial has roots. This chapter reviews Cartesian form, introduces polar form $r\\,\\text{cis}\\,\\theta$, multiplies and divides by adding and subtracting angles, uses De Moivre's theorem for powers and roots, and factorises polynomials over the complex numbers.","videos":[{"src":"B","title":"Euler's formula with introductory group theory (3Blue1Brown)","url":"https://www.youtube.com/watch?v=mvmuCPvRoWQ","kind":"video"},{"src":"J","title":"Complex numbers: polar form","url":"https://www.youtube.com/results?search_query=Joel+Speranza+complex+numbers+polar+form","kind":"search"},{"src":"J","title":"De Moivre's theorem and roots","url":"https://www.youtube.com/results?search_query=Joel+Speranza+De+Moivre%27s+theorem+roots+of+complex+numbers","kind":"search"},{"src":"J","title":"Factorising polynomials with complex roots","url":"https://www.youtube.com/results?search_query=Joel+Speranza+complex+polynomial+factorisation+conjugate+root+theorem","kind":"search"}],"sections":[{"id":"ms3-c01-s1","code":"1.2","title":"Review of complex numbers","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: complex numbers review","url":"https://www.youtube.com/results?search_query=Joel+Speranza+complex+numbers+review","kind":"search"}]},{"t":"p","x":"The imaginary unit satisfies $i^2=-1$. A complex number is $z=a+bi$ with real part $\\operatorname{Re}(z)=a$ and imaginary part $\\operatorname{Im}(z)=b$. Plot it on the **Argand plane** at $(a,b)$."},{"t":"p","x":"The **conjugate** is $\\bar z=a-bi$. Then $z\\bar z=a^2+b^2$ is real and positive, and this is how you divide: multiply top and bottom by the conjugate of the denominator."},{"t":"key","x":"$|z|=\\sqrt{a^2+b^2}$ (modulus); $\\bar{z_1z_2}=\\bar z_1\\bar z_2$; $|z_1z_2|=|z_1||z_2|$; the roots of a real polynomial come in **conjugate pairs**."},{"t":"ex","title":"Dividing","q":"Write $\\dfrac{3+i}{1-2i}$ in the form $a+bi$.","s":["Multiply by $\\frac{1+2i}{1+2i}$: numerator $(3+i)(1+2i)=3+6i+i+2i^2=1+7i$.","Denominator: $(1-2i)(1+2i)=1+4=5$."],"a":"$\\frac15+\\frac75i$"},{"t":"ex","title":"Solving a quadratic","q":"Solve $z^2-4z+13=0$.","s":["$z=\\frac{4\\pm\\sqrt{16-52}}2=\\frac{4\\pm6i}{2}$."],"a":"$z=2\\pm3i$"},{"t":"warn","x":"$\\sqrt{-36}=6i$, not $\\pm6i$. The $\\pm$ comes from the quadratic formula, not from the root."},{"t":"tb","rec":"1,2,5,6,7,8,10,11,12","ext":"13,15,16,18,19,20","x":"Exercise 1.2 revises arithmetic, conjugates, modulus and quadratic equations with complex roots.","code":"1.2"},{"t":"ex","title":"Division","q":"Write $\\dfrac{3+2i}{1-i}$ in the form $a+bi$.","s":["Multiply top and bottom by the conjugate $1+i$.","Numerator $(3+2i)(1+i)=3+3i+2i+2i^2=1+5i$; denominator $1+1=2$."],"a":"$\\frac12+\\frac52i$"}]},{"id":"ms3-c01-s2","code":"1.3","title":"Polar form and arithmetic","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: complex numbers polar form cis","url":"https://www.youtube.com/results?search_query=Joel+Speranza+complex+numbers+polar+form+cis","kind":"search"}]},{"t":"p","x":"Write $z=r(\\cos\\theta+i\\sin\\theta)=r\\operatorname{cis}\\theta$, where $r=|z|$ and $\\theta=\\operatorname{Arg}z\\in(-\\pi,\\pi]$ is the **principal argument**. Find $\\theta$ from the quadrant, using $\\tan^{-1}\\left|\\frac ba\\right|$ as the reference angle."},{"t":"key","x":"**Multiplication:** $r_1\\operatorname{cis}\\theta_1\\cdot r_2\\operatorname{cis}\\theta_2=r_1r_2\\operatorname{cis}(\\theta_1+\\theta_2)$. **Division:** $\\dfrac{r_1}{r_2}\\operatorname{cis}(\\theta_1-\\theta_2)$. Multiplying by $\\operatorname{cis}\\phi$ **rotates** by $\\phi$."},{"t":"ex","title":"To polar form","q":"Write $z=-1+i$ in polar form.","s":["$r=\\sqrt2$. In quadrant 2, reference angle $\\frac\\pi4$, so $\\theta=\\pi-\\frac\\pi4=\\frac{3\\pi}4$."],"a":"$\\sqrt2\\operatorname{cis}\\frac{3\\pi}4$"},{"t":"ex","title":"Multiplying in polar form","q":"$z_1=2\\operatorname{cis}\\frac\\pi3$, $z_2=3\\operatorname{cis}\\frac\\pi2$. Find $z_1z_2$ in Cartesian form.","s":["$6\\operatorname{cis}\\frac{5\\pi}6=6\\left(-\\frac{\\sqrt3}2+\\frac12i\\right)$."],"a":"$-3\\sqrt3+3i$"},{"t":"warn","x":"Check the quadrant. Using $\\tan^{-1}\\frac ba$ blindly gives the wrong angle for $-1+i$ (it returns $-\\frac\\pi4$)."},{"t":"int","name":"complex","cap":"Drag $z_1$ and $z_2$ on the Argand plane and watch $z_1z_2$ rotate and scale."},{"t":"tb","rec":"1,2,3,6,8,11,14","ext":"16,17,18,20","x":"Exercise 1.3 converts between forms and multiplies and divides in polar form.","code":"1.3"},{"t":"ex","title":"To polar form","q":"Write $z=-1+\\sqrt3\\,i$ in polar form.","s":["$|z|=\\sqrt{1+3}=2$.","Second quadrant: $\\theta=\\pi-\\frac\\pi3=\\frac{2\\pi}3$."],"a":"$2\\,\\text{cis}\\frac{2\\pi}3$"},{"t":"ex","title":"Multiplying in polar","q":"$z_1=2\\,\\text{cis}\\frac\\pi6$, $z_2=3\\,\\text{cis}\\frac\\pi3$. Find $z_1z_2$.","s":["Multiply moduli, add arguments."],"a":"$6\\,\\text{cis}\\frac\\pi2=6i$"},{"t":"int","name":"complex","cap":"Move the two numbers and watch the green product: its length is the product of the lengths and its angle is the sum of the angles."}]},{"id":"ms3-c01-s3","code":"1.4","title":"De Moivre's theorem and roots","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: De Moivre theorem and roots of complex numbers","url":"https://www.youtube.com/results?search_query=Joel+Speranza+De+Moivre+theorem+and+roots+of+complex+numbers","kind":"search"},{"src":"B","title":"3Blue1Brown: Euler's formula with introductory group theory","url":"https://www.youtube.com/watch?v=mvmuCPvRoWQ","kind":"video"}]},{"t":"key","x":"$$\\big[r\\operatorname{cis}\\theta\\big]^n=r^n\\operatorname{cis}(n\\theta)$$"},{"t":"p","x":"To find the **$n$th roots** of $w=R\\operatorname{cis}\\alpha$: write $w=R\\operatorname{cis}(\\alpha+2k\\pi)$, take $z=R^{1/n}\\operatorname{cis}\\frac{\\alpha+2k\\pi}n$ for $k=0,1,\\dots,n-1$. The roots lie on a circle of radius $R^{1/n}$, evenly spaced by $\\frac{2\\pi}n$, forming a regular $n$-gon. For $z^n=1$ these are the **roots of unity**."},{"t":"ex","title":"Power","q":"Evaluate $(1+i)^8$.","s":["$1+i=\\sqrt2\\operatorname{cis}\\frac\\pi4$. So $(1+i)^8=(\\sqrt2)^8\\operatorname{cis}2\\pi=16$."],"a":"$16$"},{"t":"ex","title":"Roots","q":"Solve $z^3=8$.","s":["$8=8\\operatorname{cis}(2k\\pi)$, so $z=2\\operatorname{cis}\\frac{2k\\pi}3$ for $k=0,1,2$.","$z=2,\\ 2\\operatorname{cis}\\frac{2\\pi}3=-1+\\sqrt3i,\\ 2\\operatorname{cis}\\frac{4\\pi}3=-1-\\sqrt3i$."],"a":"$z=2,\\ -1\\pm\\sqrt3i$"},{"t":"warn","x":"Give exactly $n$ roots. Dropping $2k\\pi$ gives only one of them."},{"t":"tb","rec":"1,6,7,8,10,11,14,15","ext":"16,18,20","x":"Exercise 1.4 uses De Moivre for powers, then finds roots and plots them.","code":"1.4"},{"t":"ex","title":"De Moivre","q":"Evaluate $(1+i)^8$.","s":["$1+i=\\sqrt2\\,\\text{cis}\\frac\\pi4$.","$(\\sqrt2)^8=16$, angle $8\\cdot\\frac\\pi4=2\\pi$."],"a":"$16$"},{"t":"ex","title":"Roots","q":"Solve $z^3=8$.","s":["$8=8\\,\\text{cis}\\,0$, so $z=2\\,\\text{cis}\\frac{2k\\pi}3$ for $k=0,1,2$."],"a":"$z=2,\\ 2\\,\\text{cis}\\frac{2\\pi}3=-1+\\sqrt3 i,\\ 2\\,\\text{cis}\\frac{4\\pi}3=-1-\\sqrt3 i$"}]},{"id":"ms3-c01-s4","code":"1.5","title":"Factorising polynomials","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: factorising polynomials complex roots conjugate root theorem","url":"https://www.youtube.com/results?search_query=Joel+Speranza+factorising+polynomials+complex+roots+conjugate+root+theorem","kind":"search"}]},{"t":"p","x":"**Factor theorem:** $z=a$ is a root of $P(z)$ if and only if $(z-a)$ is a factor. **Conjugate root theorem:** if $P$ has real coefficients and $a+bi$ is a root, so is $a-bi$, giving the real quadratic factor $z^2-2az+(a^2+b^2)$. A degree-$n$ polynomial has exactly $n$ complex roots (counted with multiplicity)."},{"t":"ex","title":"Using the conjugate pair","q":"$P(z)=z^3-5z^2+17z-13$ has root $z=2+3i$. Factorise fully.","s":["$2-3i$ is also a root. The quadratic factor is $z^2-4z+13$.","Divide: $P(z)=(z^2-4z+13)(z-1)$."],"a":"$(z-1)(z-2-3i)(z-2+3i)$"},{"t":"tb","rec":"1,3,4,6,8,10,12","ext":"13,14,15,16,17,18,19","x":"Exercise 1.5 divides polynomials, uses factor and conjugate root theorems and solves polynomial equations.","code":"1.5"},{"t":"ex","title":"Polynomial with a complex root","q":"$z^3-2z^2+4z-8=0$ has root $2i$. Find all roots.","s":["Real coefficients so $-2i$ is also a root; $(z^2+4)$ is a factor.","Divide: $z^3-2z^2+4z-8=(z^2+4)(z-2)$."],"a":"$z=2,\\ 2i,\\ -2i$"},{"t":"warn","x":"The conjugate root theorem needs **real** coefficients. A polynomial with $i$ in its coefficients need not have conjugate pairs of roots."}]},{"id":"ms3-c01-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Choosing a form.** Add and subtract in Cartesian form. Multiply, divide and take powers or roots in polar form. For division in Cartesian form, multiply by the conjugate."},{"t":"p","x":"**Arguments.** Always state the principal argument in $(-\\pi,\\pi]$ unless told otherwise. Sketch the Argand diagram to place the quadrant before using $\\tan^{-1}$."}]}],"quiz":[{"topic":"Divide","q":"Write $\\dfrac{1}{2-i}$ as $a+bi$. Enter as $2/5+1/5i$ style: fractions then i.","a":"2/5+1/5i","alt":["2/5+(1/5)i","0.4+0.2i"],"ad":"$\\tfrac25+\\tfrac15i$","sol":"$\\frac{2+i}{5}$.","h":["Multiply by the conjugate.","Denominator becomes 5.","Numerator is $2+i$."]},{"topic":"Modulus","q":"Find $|3-4i|$.","a":"5","alt":["5."],"ad":"$5$","sol":"$\\sqrt{9+16}=5$.","h":["Pythagoras.","$9+16$.","Square root."]},{"topic":"Quadratic","q":"Solve $z^2+9=0$ (answer as $\\pm$ something).","a":"\u00b13i","alt":["+-3i","3i,-3i","z=\u00b13i"],"ad":"$z=\\pm3i$","sol":"$z^2=-9$.","h":["$z^2=-9$.","$\\sqrt{-9}=3i$.","Two roots."]},{"topic":"Argument","q":"Find the principal argument of $-1-i$ (exact, in radians).","a":"-3pi/4","alt":["-3\u03c0/4","(-3pi)/4"],"ad":"$-\\dfrac{3\\pi}4$","sol":"Quadrant 3, reference angle $\\frac\\pi4$: $-\\pi+\\frac\\pi4=-\\frac{3\\pi}4$.","h":["Which quadrant?","Reference angle $\\frac\\pi4$.","Principal arg is in $(-\\pi,\\pi]$."]},{"topic":"Polar","q":"Find the modulus of $\\sqrt3+i$.","a":"2","alt":["2."],"ad":"$2$","sol":"$\\sqrt{3+1}=2$.","h":["$\\sqrt{a^2+b^2}$.","$3+1$.","Root."]},{"topic":"Product","q":"$z_1=2\\operatorname{cis}\\frac\\pi6$, $z_2=5\\operatorname{cis}\\frac\\pi3$. Give $|z_1z_2|$.","a":"10","alt":["10."],"ad":"$10$","sol":"$|z_1||z_2|=10$.","h":["Multiply moduli.","$2\\times5$.","The angle adds."]},{"topic":"De Moivre","q":"Evaluate $(\\sqrt3+i)^6$.","a":"-64","alt":["-64."],"ad":"$-64$","sol":"$2^6\\operatorname{cis}\\pi=64(-1)=-64$.","h":["Polar form: $2\\operatorname{cis}\\frac\\pi6$.","Raise to 6: angle $\\pi$.","$\\operatorname{cis}\\pi=-1$."]},{"topic":"Roots count","q":"How many distinct complex solutions does $z^5=1$ have?","a":"5","alt":["five"],"ad":"$5$","sol":"There are $n$ distinct $n$th roots.","h":["Degree 5 polynomial.","Fundamental theorem.","Five."]},{"topic":"Conjugate pair","q":"A real cubic has roots $1$ and $3+2i$. What is the third root? (as $a+bi$)","a":"3-2i","alt":["3-2i."],"ad":"$3-2i$","sol":"Complex roots of real polynomials come in conjugate pairs.","h":["Conjugate root theorem.","Conjugate of $3+2i$.","Flip the sign."]},{"topic":"Argument","q":"Find $\\operatorname{Arg}(i)$.","a":"pi/2","alt":["\u03c0/2"],"ad":"$\\frac\\pi2$","sol":"$i$ lies on the positive imaginary axis.","h":["Plot it.","Straight up.","Quarter turn."]},{"topic":"Modulus","q":"$|3-4i|$.","a":"5","alt":[],"ad":"$5$","sol":"$\\sqrt{9+16}$.","h":["$\\sqrt{a^2+b^2}$.","$9+16$.","Root."]},{"topic":"Conjugate product","q":"$(2+3i)(2-3i)$.","a":"13","alt":[],"ad":"$13$","sol":"$4+9$.","h":["$|z|^2$.","$4+9$.","Add."]},{"topic":"Argument","q":"Principal argument of $-1-i$ (in terms of $\\pi$).","a":"-3pi/4","alt":["-3\u03c0/4"],"ad":"$-\\frac{3\\pi}4$","sol":"Third quadrant, reference $\\frac\\pi4$.","h":["Sketch.","Third quadrant.","Use $(-\\pi,\\pi]$."]},{"topic":"Polar multiply","q":"$2\\,\\text{cis}\\frac\\pi3\\times4\\,\\text{cis}\\frac\\pi6$ has modulus?","a":"8","alt":[],"ad":"$8$","sol":"$2\\times4$.","h":["Multiply.","Moduli.","Compute."]},{"topic":"De Moivre","q":"$\\left(\\text{cis}\\frac\\pi6\\right)^{12}$.","a":"1","alt":[],"ad":"$1$","sol":"Angle $2\\pi$.","h":["Multiply angle.","$12\\cdot\\frac\\pi6=2\\pi$.","$\\text{cis}\\,2\\pi=1$."]},{"topic":"Roots","q":"How many distinct solutions has $z^5=1$?","a":"5","alt":[],"ad":"$5$","sol":"$n$ roots for $z^n$.","h":["Degree.","Five.","Spread evenly."]},{"topic":"Conjugate root","q":"A real polynomial has root $3-2i$. State another root.","a":"3+2i","alt":[],"ad":"$3+2i$","sol":"Conjugate.","h":["Real coefficients.","Conjugate pairs.","Flip the sign of $i$."]},{"topic":"Powers","q":"$i^{13}$.","a":"i","alt":[],"ad":"$i$","sol":"$13=4\\cdot3+1$.","h":["Cycle length 4.","Remainder 1.","$i^1$."]},{"topic":"Square","q":"$(1-i)^2$.","a":"-2i","alt":[],"ad":"$-2i$","sol":"$1-2i+i^2$.","h":["Expand.","$i^2=-1$.","Simplify."]},{"topic":"Sum of roots","q":"Roots of $z^2-6z+13=0$ add to?","a":"6","alt":[],"ad":"$6$","sol":"Sum of roots $=-\\frac ba$.","h":["Vieta.","$-b/a$.","Compute."]}],"comets":[{"topic":"Extension: Sum of roots of unity","q":"The three cube roots of 1 add to a real number. Find it.","a":"0","alt":["0."],"ad":"$0$","sol":"$z^3-1=0$ has no $z^2$ term, so the sum of roots is $0$.","h":["Write $z^3-1=0$.","Sum of roots is minus the $z^2$ coefficient.","No $z^2$ term."]},{"topic":"Extension: Powers of i","q":"Evaluate $\\left(\\dfrac{1+i}{1-i}\\right)^{2026}$.","a":"-1","alt":["-1."],"ad":"$-1$","sol":"$\\frac{1+i}{1-i}=i$. $i^{2026}=i^{2}=-1$ (since $2026\\equiv2\\bmod4$).","h":["Simplify the fraction first.","It equals $i$.","Powers of $i$ cycle every 4."]},{"topic":"Extension: Sum of the n-th roots","q":"The sum of all solutions of $z^7=1$ is?","a":"0","alt":[],"ad":"$0$","sol":"The roots are symmetric about the origin; the coefficient of $z^6$ is zero.","h":["Vieta.","No $z^6$ term.","Sum is $0$."]}],"hours":5.5},"ms3-c02":{"id":"ms3-c02","interactive":"none","summary":"Proof turns \"looks true\" into \"is true\". This chapter covers proof by mathematical induction for sums and divisibility, and uses De Moivre's theorem to prove trigonometric identities.","videos":[{"src":"B","title":"Euler's formula with introductory group theory (3Blue1Brown)","url":"https://www.youtube.com/watch?v=mvmuCPvRoWQ","kind":"video"},{"src":"J","title":"Mathematical induction","url":"https://www.youtube.com/results?search_query=Joel+Speranza+mathematical+induction+proof","kind":"search"},{"src":"J","title":"Induction divisibility","url":"https://www.youtube.com/results?search_query=Joel+Speranza+induction+divisibility+proof","kind":"search"},{"src":"J","title":"Trig identities using De Moivre","url":"https://www.youtube.com/results?search_query=Joel+Speranza+De+Moivre+trig+identities+multiple+angle","kind":"search"}],"sections":[{"id":"ms3-c02-s1","code":"2.2","title":"Mathematical induction","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: mathematical induction","url":"https://www.youtube.com/results?search_query=Joel+Speranza+mathematical+induction","kind":"search"}]},{"t":"p","x":"Induction proves a statement $P(n)$ for all integers $n\\ge n_0$ in four steps: **(1) Basis:** show $P(n_0)$ is true. **(2) Assume** $P(k)$ is true for some integer $k\\ge n_0$. **(3) Inductive step:** use the assumption to show $P(k+1)$ is true. **(4) Conclude:** \"Since $P(n_0)$ is true and $P(k)\\Rightarrow P(k+1)$, by induction $P(n)$ is true for all integers $n\\ge n_0$.\""},{"t":"ex","title":"Sum of integers","q":"Prove $1+2+\\dots+n=\\frac{n(n+1)}2$ for all $n\\ge1$.","s":["Basis: $n=1$: LHS $=1$, RHS $=\\frac{1\\cdot2}2=1$ \u2713.","Assume $1+\\dots+k=\\frac{k(k+1)}2$.","Then $1+\\dots+k+(k+1)=\\frac{k(k+1)}2+(k+1)=\\frac{(k+1)(k+2)}2$, which is $P(k+1)$.","Conclude as in step 4."],"a":"Proved by induction."},{"t":"warn","x":"You must use the assumption in the inductive step. If your working never uses $P(k)$, it is not an induction proof."},{"t":"tb","rec":"1,3,5,6,8,13,14,15","ext":"16,19,22,24,27","x":"Exercise 2.2 proves sum formulas, inequalities and recurrence results by induction.","code":"2.2"},{"t":"ex","title":"Sum formula","q":"Prove $1+3+5+\\dots+(2n-1)=n^2$.","s":["Basis: $n=1$: $1=1^2$.","Assume true for $n=k$: sum $=k^2$.","Then $k^2+(2k+1)=(k+1)^2$."],"a":"True for all $n\\in\\mathbb N$ by induction."},{"t":"p","x":"**Layout of every induction proof.** (1) Statement $P(n)$. (2) Basis: show $P(1)$ true. (3) Assumption: assume $P(k)$ true. (4) Inductive step: use it to prove $P(k+1)$. (5) Conclusion sentence. Marks are allocated to each of these labelled parts."}]},{"id":"ms3-c02-s2","code":"2.3","title":"Induction and divisibility","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: induction divisibility proofs","url":"https://www.youtube.com/results?search_query=Joel+Speranza+induction+divisibility+proofs","kind":"search"}]},{"t":"p","x":"To prove \"$d$ divides $f(n)$\", assume $f(k)=d\\,m$ for an integer $m$, and show that $f(k+1)$ is a multiple of $d$ by rewriting $f(k+1)$ in terms of $f(k)$."},{"t":"ex","title":"Divisibility","q":"Prove $7^n-1$ is divisible by 6 for $n\\ge1$.","s":["Basis: $7-1=6$ \u2713.","Assume $7^k-1=6m$, so $7^k=6m+1$.","$7^{k+1}-1=7(6m+1)-1=42m+6=6(7m+1)$ \u2713."],"a":"Proved."},{"t":"tb","rec":"1,3,5,6,7,8","ext":"9,11,14,18,19,20","x":"Exercise 2.3 proves divisibility statements by induction.","code":"2.3"},{"t":"ex","title":"Divisibility","q":"Prove $5^n-1$ is divisible by $4$ for $n\\ge1$.","s":["Basis: $5-1=4$.","Assume $5^k-1=4m$.","$5^{k+1}-1=5(5^k)-1=5(4m+1)-1=20m+4=4(5m+1)$."],"a":"Divisible by 4 for all $n\\ge1$."}]},{"id":"ms3-c02-s3","code":"2.4","title":"Trigonometric proofs with De Moivre","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: De Moivre trig identities","url":"https://www.youtube.com/results?search_query=Joel+Speranza+De+Moivre+trig+identities","kind":"search"}]},{"t":"p","x":"De Moivre says $(\\cos\\theta+i\\sin\\theta)^n=\\cos n\\theta+i\\sin n\\theta$. Expand the left with the binomial theorem and equate **real** and **imaginary** parts to get multiple-angle identities."},{"t":"ex","title":"Triple angle","q":"Show $\\cos3\\theta=4\\cos^3\\theta-3\\cos\\theta$.","s":["$(c+is)^3=c^3+3ic^2s-3cs^2-is^3$, with $c=\\cos\\theta$, $s=\\sin\\theta$.","Real part: $c^3-3cs^2=c^3-3c(1-c^2)=4c^3-3c$."],"a":"$\\cos3\\theta=4\\cos^3\\theta-3\\cos\\theta$"},{"t":"tb","rec":"1,2,4,5,6,8,9","ext":"10,12,13,15","x":"Exercise 2.4 expands powers of $\\cos\\theta+i\\sin\\theta$ to prove identities.","code":"2.4"},{"t":"ex","title":"Double angle from De Moivre","q":"Use $(\\cos\\theta+i\\sin\\theta)^2$ to derive $\\cos2\\theta$.","s":["Expand: $\\cos^2\\theta-\\sin^2\\theta+2i\\sin\\theta\\cos\\theta$.","De Moivre says it equals $\\cos2\\theta+i\\sin2\\theta$. Equate real parts."],"a":"$\\cos2\\theta=\\cos^2\\theta-\\sin^2\\theta$"}]},{"id":"ms3-c02-s4","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Typical inductive tricks.** For sums, add the next term to $k$ terms. For divisibility, rewrite $a^{k+1}$ using the assumption. For inequalities, build from the assumption and compare. Each must end by matching the $P(k+1)$ statement exactly."}]}],"quiz":[{"topic":"Basis","q":"In an induction proof that $\\sum_{i=1}^n(2i-1)=n^2$, what is the left side when $n=1$?","a":"1","alt":["1."],"ad":"$1$","sol":"Only $i=1$: $2(1)-1=1$.","h":["One term.","$i=1$.","$2-1$."]},{"topic":"Inductive step","q":"Assuming $\\sum_{i=1}^k(2i-1)=k^2$, what is $\\sum_{i=1}^{k+1}(2i-1)$ in terms of $k$ (simplified, expanded)?","a":"k^2+2k+1","alt":["(k+1)^2","k\u00b2+2k+1"],"ad":"$k^2+2k+1=(k+1)^2$","sol":"$k^2+(2k+1)$.","h":["Add the $(k+1)$th term.","That is $2(k+1)-1=2k+1$.","Add to $k^2$."]},{"topic":"Divisibility","q":"If $5^k-1=4m$, write $5^{k+1}-1$ in terms of $m$.","a":"20m+4","alt":["4(5m+1)"],"ad":"$20m+4=4(5m+1)$","sol":"$5(4m+1)-1=20m+4$.","h":["$5^k=4m+1$.","Multiply by 5.","Subtract 1."]},{"topic":"Trig","q":"The real part of $(\\cos\\theta+i\\sin\\theta)^2$ is $\\cos2\\theta$. Which identity does that give? Write $\\cos2\\theta$ in terms of $\\cos\\theta$ only.","a":"2cos^2(theta)-1","alt":["2cos^2\u03b8-1","2cos\u00b2\u03b8-1","2cos^2theta-1"],"ad":"$\\cos2\\theta=2\\cos^2\\theta-1$","sol":"Real part: $c^2-s^2=c^2-(1-c^2)=2c^2-1$.","h":["Expand the square.","Real part $c^2-s^2$.","Replace $s^2$."]},{"topic":"Sum","q":"Using $\\sum_{i=1}^ni=\\frac{n(n+1)}2$, find $\\sum_{i=1}^{10}i$.","a":"55","alt":["55."],"ad":"$55$","sol":"$\\frac{10\\cdot11}2=55$.","h":["Substitute $n=10$.","$10\\times11=110$.","Halve."]},{"topic":"Divisibility","q":"What is the smallest $n\\ge1$ for which the claim \"$3^n+1$ is divisible by 4\" is false? Try $n=1,2,3$ and give the smallest failing $n$.","a":"2","alt":["n=2"],"ad":"$n=2$","sol":"$3+1=4$ \u2713, $9+1=10$ \u2717.","h":["Test $n=1$.","Test $n=2$.","10 is not a multiple of 4."]},{"topic":"Conclusion","q":"True or false: checking $P(n)$ for $n=1,2,3,4,5$ proves it by induction.","a":"false","alt":["False"],"ad":"false","sol":"Examples do not prove a general statement; the inductive step is required.","h":["Do examples prove general claims?","You need the step $k\\to k+1$.","No."]},{"topic":"Binomial","q":"Find the coefficient of $i$ (imaginary part) in $(1+i)^2$.","a":"2","alt":["2."],"ad":"$2$","sol":"$(1+i)^2=1+2i-1=2i$.","h":["Expand.","$i^2=-1$.","$2i$."]},{"topic":"Induction","q":"$7^k-1=6m$ implies $7^{k+1}-1=$ ? (in terms of $m$)","a":"42m+6","alt":["6(7m+1)"],"ad":"$42m+6$","sol":"$7(6m+1)-1=42m+6$.","h":["$7^k=6m+1$.","Multiply by 7.","Subtract 1."]},{"topic":"Trig","q":"Use $\\cos3\\theta=4\\cos^3\\theta-3\\cos\\theta$ to find $\\cos\\frac{\\pi}{2}$ via $\\theta=\\frac\\pi6$? Evaluate $4\\cos^3\\frac\\pi6-3\\cos\\frac\\pi6$.","a":"0","alt":["0."],"ad":"$0$","sol":"$\\cos\\frac\\pi2=0$. Check: $4\\cdot\\frac{3\\sqrt3}8-\\frac{3\\sqrt3}2=\\frac{3\\sqrt3}2-\\frac{3\\sqrt3}2=0$.","h":["$\\cos\\frac\\pi6=\\frac{\\sqrt3}2$.","Cube it.","Substitute."]},{"topic":"Basis","q":"In the proof of $\\sum_{i=1}^n i=\\frac{n(n+1)}2$, what is the value of the right side when $n=1$?","a":"1","alt":[],"ad":"$1$","sol":"$\\frac{1\\cdot2}2$.","h":["Substitute.","$1\\cdot2$.","Divide."]},{"topic":"Sum","q":"$1+2+\\dots+10$.","a":"55","alt":[],"ad":"$55$","sol":"$\\frac{10\\cdot11}2$.","h":["Formula.","$10\\cdot11$.","Halve."]},{"topic":"Step","q":"If $S_k=k^2$, what is $S_{k+1}$ in expanded form?","a":"k^2+2k+1","alt":[],"ad":"$k^2+2k+1$","sol":"$(k+1)^2$.","h":["Substitute.","Expand.","Simplify."]},{"topic":"Divisibility","q":"If $7^k-1=6m$, then $7^{k+1}-1=7(6m)+6=6(\\ ?)$. Enter the expression in $m$.","a":"7m+1","alt":[],"ad":"$7m+1$","sol":"$7\\cdot6m+6=6(7m+1)$.","h":["Rewrite.","Factor 6.","Finish."]},{"topic":"Identity","q":"$\\cos^2\\theta-\\sin^2\\theta=\\cos\\ ?\\,\\theta$. Enter the number.","a":"2","alt":[],"ad":"$2$","sol":"Double angle.","h":["Identity.","Double.","2."]},{"topic":"Principle","q":"Induction proves a statement for all integers $n\\ge$ what, given basis $n=1$?","a":"1","alt":[],"ad":"$1$","sol":"Basis starts the chain.","h":["Basis.","$n=1$.","All $n\\ge1$."]},{"topic":"Sum","q":"$1^2+2^2+3^2$.","a":"14","alt":[],"ad":"$14$","sol":"$1+4+9$.","h":["Squares.","Add.","14."]},{"topic":"Divisible","q":"$n^2+n$ for $n=3$ is divisible by?","a":"12","alt":[],"ad":"$12$ (and by $2$)","sol":"$9+3=12$.","h":["Compute.","12.","Done."]},{"topic":"Counterexample","q":"Is $2^n>n^2$ true for $n=3$? Yes or no.","a":"no","alt":["No"],"ad":"No","sol":"$8>9$ is false.","h":["$2^3$.","$3^2$.","Compare."]},{"topic":"Sum","q":"$\\sum_{i=1}^{4}(2i-1)$.","a":"16","alt":[],"ad":"$16$","sol":"$1+3+5+7$.","h":["Terms.","Add.","16."]}],"comets":[{"topic":"Extension: Prove an inequality","q":"For which smallest integer $n\\ge1$ is $2^n>n^2$ true for all $n$ from there on? (Check $n=1,\\dots,5$.)","a":"5","alt":["n=5"],"ad":"$n=5$","sol":"$n=1:2>1$ \u2713; $n=2:4>4$ \u2717; $n=3:8>9$ \u2717; $n=4:16>16$ \u2717; $n=5:32>25$ \u2713 and it holds for all $n\\ge5$ by induction.","h":["Test small values.","Watch for equality.","First $n$ after which it always holds."]},{"topic":"Extension: Double angle with De Moivre","q":"Use $(\\cos\\theta+i\\sin\\theta)^2$ to find $\\sin2\\theta$ in terms of $\\sin\\theta$ and $\\cos\\theta$.","a":"2sin(theta)cos(theta)","alt":["2sin\u03b8cos\u03b8","2sin(x)cos(x)","2sinthetacostheta","2 sin theta cos theta"],"ad":"$2\\sin\\theta\\cos\\theta$","sol":"Imaginary part of $c^2+2ics-s^2$ is $2cs$.","h":["Expand the square.","Imaginary part.","Compare with $\\sin2\\theta$."]},{"topic":"Extension: Inequality","q":"For which smallest integer $n$ does $2^n>n^2$ hold for all larger $n$ too?","a":"5","alt":[],"ad":"$5$","sol":"$n=5$: $32>25$; $n=3$ and $4$ fail ($8\u003c9$, $16=16$).","h":["Test small $n$.","$n=4$ ties.","$n=5$ works."]}],"hours":3},"ms3-c03":{"id":"ms3-c03","interactive":"vec3d","summary":"Vectors describe quantities with direction in two and three dimensions. This chapter extends 2D vectors to 3D, uses the dot product for angles and projections, proves geometric results, writes lines in vector, parametric and Cartesian form, uses the cross product, and finds planes and distances.","videos":[{"src":"B","title":"Dot products and duality (3Blue1Brown, linear algebra ch. 9)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Dot+products+and+duality+essence+of+linear+algebra+chapter+9","kind":"search"},{"src":"B","title":"Cross products (3Blue1Brown, linear algebra ch. 10)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Cross+products+essence+of+linear+algebra+chapter+10","kind":"search"},{"src":"B","title":"Vectors, what even are they? (3Blue1Brown, linear algebra ch. 1)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Vectors+what+even+are+they+essence+of+linear+algebra+chapter+1","kind":"search"},{"src":"J","title":"Vectors in 3D","url":"https://www.youtube.com/results?search_query=Joel+Speranza+vectors+three+dimensions","kind":"search"},{"src":"J","title":"Dot product and angle between vectors","url":"https://www.youtube.com/results?search_query=Joel+Speranza+dot+product+vectors+angle","kind":"search"},{"src":"J","title":"Cross product","url":"https://www.youtube.com/results?search_query=Joel+Speranza+cross+product+vectors","kind":"search"},{"src":"J","title":"Vector equation of a line and plane","url":"https://www.youtube.com/results?search_query=Joel+Speranza+vector+equation+line+plane","kind":"search"}],"sections":[{"id":"ms3-c03-s1","code":"3.2","title":"Vectors in three dimensions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: vectors in three dimensions","url":"https://www.youtube.com/results?search_query=Joel+Speranza+vectors+in+three+dimensions","kind":"search"},{"src":"B","title":"3Blue1Brown: Vectors, what even are they","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Vectors+what+even+are+they+essence+of+linear+algebra","kind":"search"}]},{"t":"p","x":"A 3D vector is $\\mathbf v=a\\mathbf i+b\\mathbf j+c\\mathbf k=\\begin{pmatrix}a\\\\b\\\\c\\end{pmatrix}$. Its **magnitude** is $|\\mathbf v|=\\sqrt{a^2+b^2+c^2}$ and a **unit vector** is $\\hat{\\mathbf v}=\\frac{\\mathbf v}{|\\mathbf v|}$. The vector from $A$ to $B$ is $\\overrightarrow{AB}=\\mathbf b-\\mathbf a$."},{"t":"ex","title":"Vector between points","q":"$A(1,2,3)$ and $B(4,-2,5)$. Find $\\overrightarrow{AB}$, $|\\overrightarrow{AB}|$ and a unit vector in its direction.","s":["$\\overrightarrow{AB}=\\begin{pmatrix}3\\\\-4\\\\2\\end{pmatrix}$.","$|\\overrightarrow{AB}|=\\sqrt{9+16+4}=\\sqrt{29}$."],"a":"$\\overrightarrow{AB}=3\\mathbf i-4\\mathbf j+2\\mathbf k$, $|\\overrightarrow{AB}|=\\sqrt{29}$, $\\hat{\\mathbf u}=\\frac1{\\sqrt{29}}(3,-4,2)$."},{"t":"warn","x":"$\\overrightarrow{AB}=\\mathbf b-\\mathbf a$ (end minus start). Reversing the order gives $\\overrightarrow{BA}$, which points the other way."},{"t":"tb","rec":"1,2,4,5,7,8,10,11,12","ext":"13,15,16,18,20","x":"Exercise 3.2 uses components, magnitude, unit vectors and linear combinations in 3D.","code":"3.2"},{"t":"ex","title":"Magnitude and unit vector","q":"$\\mathbf a=2\\mathbf i-2\\mathbf j+\\mathbf k$. Find $|\\mathbf a|$ and $\\hat{\\mathbf a}$.","s":["$|\\mathbf a|=\\sqrt{4+4+1}=3$."],"a":"$3$ and $\\frac13(2\\mathbf i-2\\mathbf j+\\mathbf k)$"}]},{"id":"ms3-c03-s2","code":"3.3","title":"Vector algebra and the dot product","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: dot product of vectors","url":"https://www.youtube.com/results?search_query=Joel+Speranza+dot+product+of+vectors","kind":"search"},{"src":"B","title":"3Blue1Brown: Dot products and duality","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Dot+products+and+duality","kind":"search"}]},{"t":"key","x":"$$\\mathbf a\\cdot\\mathbf b=a_1b_1+a_2b_2+a_3b_3=|\\mathbf a||\\mathbf b|\\cos\\theta$$"},{"t":"p","x":"Two vectors are **perpendicular** exactly when $\\mathbf a\\cdot\\mathbf b=0$ and **parallel** when one is a scalar multiple of the other. The **scalar projection** of $\\mathbf a$ on $\\mathbf b$ is $\\frac{\\mathbf a\\cdot\\mathbf b}{|\\mathbf b|}$ and the **vector projection** is $\\frac{\\mathbf a\\cdot\\mathbf b}{|\\mathbf b|^2}\\mathbf b$. Also $\\mathbf a\\cdot\\mathbf a=|\\mathbf a|^2$."},{"t":"ex","title":"Angle between vectors","q":"Find the angle between $\\mathbf a=(1,2,2)$ and $\\mathbf b=(2,-1,2)$.","s":["$\\mathbf a\\cdot\\mathbf b=2-2+4=4$; $|\\mathbf a|=3$; $|\\mathbf b|=3$.","$\\cos\\theta=\\frac49$, so $\\theta=\\cos^{-1}\\frac49\\approx63.6^\\circ$."],"a":"$\\approx63.6^\\circ$"},{"t":"ex","title":"Perpendicular","q":"Find $t$ so that $(t,2,-1)\\perp(3,1,t)$.","s":["$3t+2-t=0\\Rightarrow2t=-2\\Rightarrow t=-1$."],"a":"$t=-1$"},{"t":"warn","x":"The dot product gives a **number**, not a vector. Never write $\\mathbf a\\cdot\\mathbf b=\\mathbf c$."},{"t":"int","name":"vec3d","cap":"Rotate two vectors in 3D and read off $\\mathbf a\\cdot\\mathbf b$, the angle and the projection."},{"t":"tb","rec":"2,3,5,6,7,8,10,11","ext":"13,15,17,20","x":"Exercise 3.3 uses the dot product for angles, perpendicularity and projections.","code":"3.3"},{"t":"ex","title":"Angle","q":"Angle between $\\mathbf a=(1,2,2)$ and $\\mathbf b=(2,0,1)$.","s":["$\\mathbf a\\cdot\\mathbf b=2+0+2=4$; $|\\mathbf a|=3$; $|\\mathbf b|=\\sqrt5$.","$\\cos\\theta=\\frac4{3\\sqrt5}$, $\\theta\\approx0.93$ rad ($53.4^\\circ$)."],"a":"about $53.4^\\circ$"},{"t":"ex","title":"Perpendicular","q":"Find $t$ so that $(t,2,-1)\\perp(3,1,t)$.","s":["Dot product $=3t+2-t=2t+2=0$."],"a":"$t=-1$"}]},{"id":"ms3-c03-s3","code":"3.4","title":"Vector proofs in geometry","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: vector proofs in geometry","url":"https://www.youtube.com/results?search_query=Joel+Speranza+vector+proofs+in+geometry","kind":"search"}]},{"t":"p","x":"Choose position vectors for key points, express the sides as vector differences, and use the dot product (perpendicular) or scalar multiples (parallel). Classic results: the diagonals of a rhombus are perpendicular; the angle in a semicircle is $90^\\circ$; the midpoint of $AB$ has position vector $\\frac12(\\mathbf a+\\mathbf b)$."},{"t":"ex","title":"Angle in a semicircle","q":"$AB$ is a diameter of a circle with centre $O$, and $P$ is on the circle. Show $\\angle APB=90^\\circ$.","s":["Let $\\overrightarrow{OA}=\\mathbf a$, $\\overrightarrow{OB}=-\\mathbf a$, $\\overrightarrow{OP}=\\mathbf p$ with $|\\mathbf p|=|\\mathbf a|$.","$\\overrightarrow{PA}\\cdot\\overrightarrow{PB}=(\\mathbf a-\\mathbf p)\\cdot(-\\mathbf a-\\mathbf p)=-|\\mathbf a|^2+|\\mathbf p|^2=0$."],"a":"Perpendicular, so $\\angle APB=90^\\circ$."},{"t":"tb","rec":"1,3,5,6,7,8,9,10,11","ext":"13,17,20","x":"Exercise 3.4 proves geometric properties using vector methods.","code":"3.4"},{"t":"ex","title":"Collinear points","q":"Show $A(1,2,3)$, $B(3,6,7)$, $C(4,8,9)$ are collinear.","s":["$\\vec{AB}=(2,4,4)$, $\\vec{AC}=(3,6,6)$.","$\\vec{AC}=\\frac32\\vec{AB}$, so they are parallel and share $A$."],"a":"Collinear."}]},{"id":"ms3-c03-s4","code":"3.5","title":"Vector, parametric and Cartesian equations","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: vector equation of a line in 3D","url":"https://www.youtube.com/results?search_query=Joel+Speranza+vector+equation+of+a+line+in+3D","kind":"search"}]},{"t":"p","x":"A **line** through point $\\mathbf a$ with direction $\\mathbf d$ is $\\mathbf r=\\mathbf a+\\lambda\\mathbf d$. In 3D, eliminating $\\lambda$ gives the Cartesian form $\\frac{x-x_0}{d_1}=\\frac{y-y_0}{d_2}=\\frac{z-z_0}{d_3}$. Two lines in 3D can be **parallel**, **intersecting**, or **skew** (neither). To test: equate components, solve two equations, and check the third."},{"t":"ex","title":"Do the lines meet?","q":"$L_1:\\ \\mathbf r=(1,0,2)+\\lambda(1,1,1)$ and $L_2:\\ \\mathbf r=(0,1,3)+\\mu(2,1,0)$.","s":["$1+\\lambda=2\\mu$, $\\lambda=1+\\mu$, $2+\\lambda=3$.","Third: $\\lambda=1$, then $\\mu=0$; first: $2=0$? \u2717."],"a":"They do not intersect and are not parallel, so they are skew."},{"t":"tb","rec":"1,4,5,7,9,10,12,15","ext":"16,17,18,20,23","x":"Exercise 3.5 writes lines in all three forms and tests intersection, skewness and parallelism.","code":"3.5"},{"t":"ex","title":"Line through two points","q":"Vector equation of the line through $(1,0,2)$ and $(3,2,1)$.","s":["Direction $(2,2,-1)$."],"a":"$\\mathbf r=(1,0,2)+\\lambda(2,2,-1)$"},{"t":"ex","title":"Intersection","q":"Do $\\mathbf r=(0,0,0)+s(1,1,1)$ and $\\mathbf r=(1,0,0)+t(0,1,1)$ intersect?","s":["$s=1$ (x), $s=t$ (y), $s=t$ (z): $t=1$, consistent."],"a":"Yes, at $(1,1,1)$."}]},{"id":"ms3-c03-s5","code":"3.6","title":"The cross product","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: cross product","url":"https://www.youtube.com/results?search_query=Joel+Speranza+cross+product","kind":"search"},{"src":"B","title":"3Blue1Brown: Cross products","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Cross+products+essence+of+linear+algebra","kind":"search"}]},{"t":"key","x":"$$\\mathbf a\\times\\mathbf b=\\begin{pmatrix}a_2b_3-a_3b_2\\\\a_3b_1-a_1b_3\\\\a_1b_2-a_2b_1\\end{pmatrix},\\qquad|\\mathbf a\\times\\mathbf b|=|\\mathbf a||\\mathbf b|\\sin\\theta$$"},{"t":"p","x":"The result is **perpendicular to both** $\\mathbf a$ and $\\mathbf b$ (right-hand rule), so it is a **normal** to the plane they span. $|\\mathbf a\\times\\mathbf b|$ is the **area of the parallelogram**; half of it is the area of the triangle. Order matters: $\\mathbf b\\times\\mathbf a=-\\mathbf a\\times\\mathbf b$."},{"t":"ex","title":"Cross product and area","q":"$\\mathbf a=(1,2,3)$, $\\mathbf b=(0,1,4)$. Find $\\mathbf a\\times\\mathbf b$ and the triangle area.","s":["$(2\\cdot4-3\\cdot1,\\ 3\\cdot0-1\\cdot4,\\ 1\\cdot1-2\\cdot0)=(5,-4,1)$.","$|\\mathbf a\\times\\mathbf b|=\\sqrt{25+16+1}=\\sqrt{42}$, so the triangle area is $\\frac{\\sqrt{42}}{2}$."],"a":"$(5,-4,1)$; area $\\frac{\\sqrt{42}}2$"},{"t":"tb","rec":"1,2,5,6,8,9","ext":"13,16,17,19","x":"Exercise 3.6 computes cross products, areas and normals, and the scalar triple product.","code":"3.6"},{"t":"ex","title":"Cross product","q":"$(1,2,3)\\times(0,1,4)$.","s":["$(2\\cdot4-3\\cdot1,\\ 3\\cdot0-1\\cdot4,\\ 1\\cdot1-2\\cdot0)$."],"a":"$(5,\\,-4,\\,1)$"},{"t":"ex","title":"Triangle area","q":"Area of the triangle with $\\vec{AB}=(1,1,0)$, $\\vec{AC}=(0,1,1)$.","s":["Cross $=(1,-1,1)$, magnitude $\\sqrt3$."],"a":"$\\frac{\\sqrt3}2$"}]},{"id":"ms3-c03-s6","code":"3.7","title":"Applications: planes and distances","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: vector equation of a plane","url":"https://www.youtube.com/results?search_query=Joel+Speranza+vector+equation+of+a+plane","kind":"search"}]},{"t":"p","x":"A plane with normal $\\mathbf n=(a,b,c)$ through $\\mathbf p_0$ has equation $\\mathbf n\\cdot\\mathbf r=\\mathbf n\\cdot\\mathbf p_0$, which expands to $ax+by+cz=d$. Get a normal from a cross product of two vectors in the plane. A line is parallel to the plane when its direction is perpendicular to $\\mathbf n$."},{"t":"ex","title":"Equation of a plane","q":"Find the plane through $A(1,0,0)$, $B(0,2,0)$, $C(0,0,3)$.","s":["$\\overrightarrow{AB}=(-1,2,0)$, $\\overrightarrow{AC}=(-1,0,3)$. Cross: $(6,3,2)$.","Plane: $6x+3y+2z=6\\cdot1=6$."],"a":"$6x+3y+2z=6$"},{"t":"tb","rec":"1,2,4,5,6,7,9","ext":"12,13,15,17,21","x":"Exercise 3.7 applies vectors to planes, intersections and shortest distances.","code":"3.7"},{"t":"ex","title":"Plane","q":"Plane through $(1,0,0)$ with normal $(2,1,-1)$.","s":["$2x+y-z=2$."],"a":"$2x+y-z=2$"}]},{"id":"ms3-c03-s7","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Plan.** Angle or perpendicular: dot product. Area, normal to a plane, or perpendicular to two directions: cross product. Line questions: write $\\mathbf r=\\mathbf a+\\lambda\\mathbf d$ and equate components. Always state both **vector** and **parametric** form if asked."},{"t":"p","x":"**Notation.** Vectors are bold or underlined in writing. Do not mix up $|\\mathbf a|$ (scalar) and $\\mathbf a$ (vector). Write final angles in degrees or radians as the question asks."}]}],"quiz":[{"topic":"Magnitude","q":"Find $|(2,-3,6)|$.","a":"7","alt":["7."],"ad":"$7$","sol":"$\\sqrt{4+9+36}=7$.","h":["Sum of squares.","$4+9+36=49$.","Square root."]},{"topic":"Between points","q":"$A(1,1,1)$, $B(3,4,1)$. Find $|\\overrightarrow{AB}|$ exactly.","a":"sqrt13","alt":["sqrt(13)","\u221a13"],"ad":"$\\sqrt{13}$","sol":"$(2,3,0)$, $\\sqrt{4+9}=\\sqrt{13}$.","h":["$B-A$.","$(2,3,0)$.","Magnitude."]},{"topic":"Dot product","q":"Find $(1,2,3)\\cdot(4,-1,2)$.","a":"8","alt":["8."],"ad":"$8$","sol":"$4-2+6=8$.","h":["Multiply matching components.","$4,-2,6$.","Add."]},{"topic":"Perpendicular","q":"Find $k$ so that $(k,3,1)\\perp(2,1,-5)$.","a":"1","alt":["k=1"],"ad":"$k=1$","sol":"$2k+3-5=0\\Rightarrow k=1$.","h":["Dot product is 0.","$2k+3-5=0$.","Solve."]},{"topic":"Angle","q":"Find the angle between $(1,0,0)$ and $(1,1,0)$ in degrees.","a":"45","alt":["45 degrees","45\u00b0"],"ad":"$45^\\circ$","sol":"$\\cos\\theta=\\frac{1}{\\sqrt2}$.","h":["Dot product $=1$.","Magnitudes $1$ and $\\sqrt2$.","$\\cos^{-1}\\frac1{\\sqrt2}$."]},{"topic":"Cross","q":"Find $(1,0,0)\\times(0,1,0)$ as a vector $(x,y,z)$.","a":"(0,0,1)","alt":["0,0,1","k"],"ad":"$(0,0,1)=\\mathbf k$","sol":"$\\mathbf i\\times\\mathbf j=\\mathbf k$.","h":["Use the formula.","Only the last component is non-zero.","$1\\cdot1-0\\cdot0$."]},{"topic":"Area","q":"Find the area of the parallelogram spanned by $(3,0,0)$ and $(0,4,0)$.","a":"12","alt":["12."],"ad":"$12$","sol":"$|\\mathbf a\\times\\mathbf b|=|(0,0,12)|=12$.","h":["Cross product.","$(0,0,12)$.","Magnitude."]},{"topic":"Plane","q":"A plane has normal $(2,1,-1)$ and passes through $(1,1,1)$. Find $d$ in $2x+y-z=d$.","a":"2","alt":["d=2"],"ad":"$d=2$","sol":"$2+1-1=2$.","h":["Substitute the point.","$2(1)+1-1$.","Compute."]},{"topic":"Projection","q":"Find the scalar projection of $(3,4,0)$ onto $(1,0,0)$.","a":"3","alt":["3."],"ad":"$3$","sol":"$\\frac{3}{1}=3$.","h":["$\\frac{\\mathbf a\\cdot\\mathbf b}{|\\mathbf b|}$.","$\\mathbf a\\cdot\\mathbf b=3$.","$|\\mathbf b|=1$."]},{"topic":"Lines","q":"Lines $\\mathbf r=(0,0,0)+\\lambda(1,2,3)$ and $\\mathbf r=(1,1,1)+\\mu(2,4,6)$ are (parallel, intersecting or skew)?","a":"parallel","alt":["Parallel"],"ad":"parallel","sol":"Directions are multiples. Check: $(1,1,1)$ is not on line 1 (needs $(t,2t,3t)$), so they are parallel and distinct.","h":["Compare directions.","$(2,4,6)=2(1,2,3)$.","Same direction."]},{"topic":"Magnitude","q":"$|(2,3,6)|$.","a":"7","alt":[],"ad":"$7$","sol":"$\\sqrt{4+9+36}$.","h":["Square each.","Sum 49.","Root."]},{"topic":"Dot","q":"$(1,2,3)\\cdot(4,-5,6)$.","a":"12","alt":[],"ad":"$12$","sol":"$4-10+18$.","h":["Multiply parts.","Add.","12."]},{"topic":"Perpendicular","q":"$(2,k,1)\\cdot(1,2,-4)=0$. Find $k$.","a":"1","alt":[],"ad":"$k=1$","sol":"$2+2k-4=0$.","h":["Dot.","Set zero.","Solve."]},{"topic":"Cross","q":"$\\mathbf i\\times\\mathbf j$ equals which of $\\mathbf i,\\mathbf j,\\mathbf k$?","a":"k","alt":["K","k"],"ad":"$\\mathbf k$","sol":"Right hand rule.","h":["Right hand.","Perpendicular to both.","Axis."]},{"topic":"Area","q":"Area of the parallelogram with sides $(3,0,0)$ and $(0,2,0)$.","a":"6","alt":[],"ad":"$6$","sol":"$|(0,0,6)|$.","h":["Cross.","$(0,0,6)$.","Magnitude."]},{"topic":"Line","q":"Direction of the line through $(1,1,1)$ and $(2,3,5)$: enter its third component.","a":"4","alt":[],"ad":"$4$","sol":"$(1,2,4)$.","h":["Subtract.","$5-1$.","4."]},{"topic":"Plane","q":"Normal $(1,2,3)$ through the origin: value of the constant $d$ in $x+2y+3z=d$.","a":"0","alt":[],"ad":"$0$","sol":"Origin satisfies it.","h":["Substitute $(0,0,0)$.","$0$.","Done."]},{"topic":"Unit","q":"$|\\hat{\\mathbf a}|$ for any non-zero $\\mathbf a$.","a":"1","alt":[],"ad":"$1$","sol":"Unit vector.","h":["Definition.","Length.","1."]},{"topic":"Projection","q":"Scalar projection of $(3,4,0)$ onto $(1,0,0)$.","a":"3","alt":[],"ad":"$3$","sol":"$\\frac{\\mathbf a\\cdot\\mathbf b}{|\\mathbf b|}$.","h":["Dot.","$3$.","Divide by 1."]},{"topic":"Angle","q":"$\\cos\\theta$ for $(1,0,0)$ and $(1,1,0)$. Exact.","a":"sqrt2/2","alt":["1/sqrt2","sqrt(2)/2","\u221a2/2"],"ad":"$\\frac{\\sqrt2}2$","sol":"$\\frac{1}{\\sqrt2}$.","h":["Dot.","Magnitudes.","Divide."]}],"comets":[{"topic":"Extension: Shortest distance idea","q":"$|\\mathbf a\\times\\mathbf b|$ gives the area of a parallelogram. Find $|(1,1,0)\\times(0,1,1)|$ exactly.","a":"sqrt3","alt":["sqrt(3)","\u221a3"],"ad":"$\\sqrt3$","sol":"$(1,-1,1)$, magnitude $\\sqrt3$.","h":["Compute the cross product.","$(1\\cdot1-0,\\ 0-1\\cdot1,\\ 1-0)$.","Magnitude."]},{"topic":"Extension: Triple product","q":"Find the volume of the parallelepiped with edges $(1,0,0)$, $(0,2,0)$, $(0,0,3)$.","a":"6","alt":["6."],"ad":"$6$","sol":"$|\\mathbf a\\cdot(\\mathbf b\\times\\mathbf c)|=|(1,0,0)\\cdot(6,0,0)|=6$.","h":["Triple product.","$\\mathbf b\\times\\mathbf c=(6,0,0)$.","Dot with $\\mathbf a$."]},{"topic":"Extension: Distance point to plane","q":"Distance from the origin to the plane $2x-y+2z=9$.","a":"3","alt":[],"ad":"$3$","sol":"$\\frac{|9|}{\\sqrt{4+1+4}}=3$.","h":["Normal $(2,-1,2)$.","Magnitude 3.","Divide."]}],"hours":5},"ms3-c04":{"id":"ms3-c04","interactive":"none","summary":"Vector calculus describes motion in a plane or space. Position, velocity and acceleration are vectors of functions of time. This chapter covers position vectors for circles and ellipses, collisions, differentiating and integrating vectors, straight-line motion, and applications including projectiles and circular motion.","videos":[{"src":"B","title":"Derivative formulas through geometry (3Blue1Brown, ch. 3)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Derivative+formulas+through+geometry+Essence+of+calculus+chapter+3","kind":"search"},{"src":"J","title":"Vector calculus: position, velocity, acceleration","url":"https://www.youtube.com/results?search_query=Joel+Speranza+vector+calculus+position+velocity+acceleration","kind":"search"},{"src":"J","title":"Projectile motion with vectors","url":"https://www.youtube.com/results?search_query=Joel+Speranza+projectile+motion+vector+calculus","kind":"search"},{"src":"J","title":"Circular motion with vectors","url":"https://www.youtube.com/results?search_query=Joel+Speranza+circular+motion+vectors+specialist","kind":"search"}],"sections":[{"id":"ms3-c04-s1","code":"4.2","title":"Position vectors as functions of time","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: position vector parametric equations","url":"https://www.youtube.com/results?search_query=Joel+Speranza+position+vector+parametric+equations","kind":"search"}]},{"t":"p","x":"A **position vector** $\\mathbf r(t)=x(t)\\mathbf i+y(t)\\mathbf j$ traces a **path**. To find the Cartesian equation, eliminate $t$. Circle: $\\mathbf r=(a\\cos t,\\ a\\sin t)$ gives $x^2+y^2=a^2$. Ellipse: $\\mathbf r=(a\\cos t,\\ b\\sin t)$ gives $\\frac{x^2}{a^2}+\\frac{y^2}{b^2}=1$. Hyperbola: $\\mathbf r=(a\\sec t,\\ b\\tan t)$ gives $\\frac{x^2}{a^2}-\\frac{y^2}{b^2}=1$."},{"t":"ex","title":"Eliminating the parameter","q":"Find the Cartesian equation of $\\mathbf r(t)=(2\\cos t+1,\\ 3\\sin t-2)$.","s":["$\\cos t=\\frac{x-1}2$, $\\sin t=\\frac{y+2}3$.","$\\sin^2t+\\cos^2t=1\\Rightarrow\\frac{(x-1)^2}4+\\frac{(y+2)^2}9=1$."],"a":"Ellipse centred at $(1,-2)$ with semi-axes 2 and 3."},{"t":"warn","x":"Use $\\sin^2t+\\cos^2t=1$ on the isolated terms, not on the coefficients. Isolate $\\cos t$ and $\\sin t$ first."},{"t":"tb","rec":"1,3,6,7,8,9,11,12,13,14","ext":"15,16,21,22,24","x":"Exercise 4.2 sketches paths, eliminates $t$ and finds direction of motion.","code":"4.2"},{"t":"ex","title":"Circle parametric","q":"Convert $\\mathbf r=(3\\cos t,\\ 3\\sin t)$ to Cartesian.","s":["$x^2+y^2=9\\cos^2t+9\\sin^2t=9$."],"a":"$x^2+y^2=9$"}]},{"id":"ms3-c04-s2","code":"4.3","title":"Collisions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: vectors collision","url":"https://www.youtube.com/results?search_query=Joel+Speranza+vectors+collision","kind":"search"}]},{"t":"p","x":"Two particles with position vectors $\\mathbf r_1(t)$ and $\\mathbf r_2(t)$ **collide** at time $t$ when $\\mathbf r_1(t)=\\mathbf r_2(t)$ for the **same** $t$. Two paths can cross without a collision if the particles arrive at the intersection at different times. Equate $\\mathbf i$ and $\\mathbf j$ components and solve; the **same** $t$ must satisfy both."},{"t":"ex","title":"Collision?","q":"$\\mathbf r_1=(2t,\\ t^2)$, $\\mathbf r_2=(t+2,\\ 4)$. Do they collide?","s":["$2t=t+2\\Rightarrow t=2$. $t^2=4\\Rightarrow t=\\pm2$.","$t=2$ satisfies both."],"a":"Collision at $t=2$, at position $(4,4)$."},{"t":"tb","rec":"1,2,3,4,5,9,11","ext":"12,14,15","x":"Exercise 4.3 tests for collisions and closest approach.","code":"4.3"},{"t":"ex","title":"Collision","q":"$\\mathbf r_1=(t,\\,2t)$ and $\\mathbf r_2=(4-t,\\,3)$. Do they meet?","s":["$t=4-t\\Rightarrow t=2$ and $2t=3\\Rightarrow t=1.5$.","Times differ, so the paths cross but the objects do not collide."],"a":"No collision."}]},{"id":"ms3-c04-s3","code":"4.4","title":"Differentiating and integrating vectors","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: differentiating and integrating vectors","url":"https://www.youtube.com/results?search_query=Joel+Speranza+differentiating+and+integrating+vectors","kind":"search"}]},{"t":"key","x":"$$\\mathbf v(t)=\\mathbf r'(t)=(x'(t),\\,y'(t)),\\qquad\\mathbf a(t)=\\mathbf v'(t)=(x''(t),\\,y''(t))$$"},{"t":"p","x":"Differentiate and integrate **component by component**. **Speed** is $|\\mathbf v|=\\sqrt{x'^2+y'^2}$. To integrate, add a **vector** constant, found from an initial condition: $\\mathbf r(t)=\\int\\mathbf v\\,dt+\\mathbf c$."},{"t":"ex","title":"From acceleration to position","q":"$\\mathbf a=(0,-10)$, $\\mathbf v(0)=(6,8)$, $\\mathbf r(0)=(0,0)$. Find $\\mathbf r(t)$.","s":["$\\mathbf v=(6,\\ -10t+8)$.","$\\mathbf r=(6t,\\ -5t^2+8t)$."],"a":"$\\mathbf r(t)=(6t,\\ 8t-5t^2)$"},{"t":"tb","rec":"1,2,3,5,7,10,14","ext":"15,18,19,20","x":"Exercise 4.4 differentiates and integrates vector functions, including finding speed.","code":"4.4"},{"t":"ex","title":"Differentiate","q":"$\\mathbf r=(t^2,\\ e^{t})$. Find $\\dot{\\mathbf r}$ and $\\ddot{\\mathbf r}$.","s":["$\\dot{\\mathbf r}=(2t,e^t)$; $\\ddot{\\mathbf r}=(2,e^t)$."],"a":"As above."},{"t":"ex","title":"Integrate","q":"$\\mathbf v=(2t,\\,3)$, $\\mathbf r(0)=(1,0)$.","s":["$\\mathbf r=(t^2+1,\\ 3t)$."],"a":"$\\mathbf r=(t^2+1,\\ 3t)$"}]},{"id":"ms3-c04-s4","code":"4.5","title":"Straight-line (rectilinear) motion","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: rectilinear motion calculus","url":"https://www.youtube.com/results?search_query=Joel+Speranza+rectilinear+motion+calculus","kind":"search"}]},{"t":"p","x":"On a line, $x(t)$ is position, $v=\\frac{dx}{dt}$, $a=\\frac{dv}{dt}=v\\frac{dv}{dx}$. The particle is **at rest** when $v=0$. **Displacement** is $x(b)-x(a)$; **distance** needs $\\int|v|\\,dt$. **Speeding up** when $v$ and $a$ have the same sign."},{"t":"ex","title":"Rectilinear","q":"$x=t^3-6t^2+9t$. Find when the particle is at rest, and its acceleration then.","s":["$v=3t^2-12t+9=3(t-1)(t-3)=0$, so $t=1$ or $3$.","$a=6t-12$: $a(1)=-6$, $a(3)=6$."],"a":"At rest at $t=1$ (a $=-6$) and $t=3$ ($a=6$)."},{"t":"tb","rec":"2,4,6,10,14","ext":"15,17,19","x":"Exercise 4.5 uses calculus for straight-line motion, including speed and distance.","code":"4.5"},{"t":"ex","title":"Speed","q":"Speed at $t=1$ for $\\mathbf r=(t^2,\\ t^3)$.","s":["$\\dot{\\mathbf r}=(2t,3t^2)=(2,3)$.","Speed $=\\sqrt{13}$."],"a":"$\\sqrt{13}$"}]},{"id":"ms3-c04-s5","code":"4.6","title":"Applications: projectiles and circular motion","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: projectile motion with vectors","url":"https://www.youtube.com/results?search_query=Joel+Speranza+projectile+motion+with+vectors","kind":"search"}]},{"t":"p","x":"**Projectile:** $\\mathbf a=(0,-g)$, so with launch speed $u$ at angle $\\alpha$, $\\mathbf r=(ut\\cos\\alpha,\\ ut\\sin\\alpha-\\frac12gt^2)$. The **flight time** is when $y=0$ again; the **range** is $x$ at that time. **Circular motion:** $\\mathbf r=(R\\cos\\omega t,\\ R\\sin\\omega t)$; speed is $R\\omega$ (constant), and acceleration points to the centre with magnitude $R\\omega^2$."},{"t":"ex","title":"Projectile","q":"A ball is launched at $20\\text{ m/s}$ at $30^\\circ$ with $g=10$. Find the time of flight.","s":["$y=20t\\sin30^\\circ-5t^2=10t-5t^2=0\\Rightarrow t=2$."],"a":"$2$ seconds"},{"t":"tb","rec":"1,2,4,7,9,11,12","ext":"13,15,16,19","x":"Exercise 4.6 applies vector calculus to projectiles and circular motion.","code":"4.6"},{"t":"ex","title":"Projectile","q":"Launch at $20$ m/s at $30^\\circ$. Position $(20\\cos30^\\circ\\,t,\\ 20\\sin30^\\circ\\,t-5t^2)$. When does it land?","s":["$10t-5t^2=0\\Rightarrow t=2$."],"a":"$t=2$ s"}]},{"id":"ms3-c04-s6","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Eliminate the parameter** by solving one equation for $t$ and substituting, or by using an identity like $\\cos^2+\\sin^2=1$. State the domain implied by the parameter range."},{"t":"p","x":"**Rates.** Velocity is $\\dot{\\mathbf r}$, speed is $|\\dot{\\mathbf r}|$, acceleration is $\\ddot{\\mathbf r}$. Speed is a scalar; velocity is a vector."}]}],"quiz":[{"topic":"Path","q":"$\\mathbf r=(3\\cos t,\\ 3\\sin t)$ traces which Cartesian curve? Give $x^2+y^2=$ ?","a":"9","alt":["x^2+y^2=9","9."],"ad":"$x^2+y^2=9$","sol":"$\\cos^2+\\sin^2=1$ so $x^2+y^2=9$.","h":["$x=3\\cos t$.","Square and add.","$9(\\cos^2t+\\sin^2t)$."]},{"topic":"Velocity","q":"$\\mathbf r=(t^2,\\ 3t)$. Find $\\mathbf v(2)$ as $(x,y)$.","a":"(4,3)","alt":["4,3"],"ad":"$(4,3)$","sol":"$\\mathbf v=(2t,3)$; $\\mathbf v(2)=(4,3)$.","h":["Differentiate each component.","$(2t,3)$.","Substitute $t=2$."]},{"topic":"Speed","q":"$\\mathbf v=(4,3)$. Find the speed.","a":"5","alt":["5."],"ad":"$5$","sol":"$\\sqrt{16+9}=5$.","h":["Magnitude.","$16+9$.","Root."]},{"topic":"Acceleration","q":"$\\mathbf r=(t^3,\\ 2t^2)$. Find $\\mathbf a(1)$.","a":"(6,4)","alt":["6,4"],"ad":"$(6,4)$","sol":"$\\mathbf v=(3t^2,4t)$, $\\mathbf a=(6t,4)$, $\\mathbf a(1)=(6,4)$.","h":["Differentiate twice.","$(6t,4)$.","Substitute."]},{"topic":"Integrate","q":"$\\mathbf v=(2t,\\ 6t^2)$ and $\\mathbf r(0)=(1,0)$. Find $\\mathbf r(1)$.","a":"(2,2)","alt":["2,2"],"ad":"$(2,2)$","sol":"$\\mathbf r=(t^2+1,\\ 2t^3)$; $\\mathbf r(1)=(2,2)$.","h":["Integrate each component.","Add the constant vector.","Substitute."]},{"topic":"Collision","q":"$\\mathbf r_1=(t,\\ 2t)$ and $\\mathbf r_2=(3-t,\\ 3)$. At what $t$ do they collide?","a":"1.5","alt":["3/2","t=1.5"],"ad":"$t=\\tfrac32$","sol":"$t=3-t\\Rightarrow t=1.5$; $2t=3\\Rightarrow t=1.5$ \u2713.","h":["Equate $\\mathbf i$.","$t=1.5$.","Check $\\mathbf j$."]},{"topic":"Rest","q":"$x=t^2-4t$. When is the particle at rest?","a":"2","alt":["t=2"],"ad":"$t=2$","sol":"$v=2t-4=0$.","h":["Differentiate.","Set to 0.","Solve."]},{"topic":"Projectile","q":"Time of flight for $y=15t-5t^2$ (positive time when $y=0$).","a":"3","alt":["3 s","t=3"],"ad":"$3$","sol":"$5t(3-t)=0\\Rightarrow t=3$.","h":["Set $y=0$.","Factor $5t$.","Take the positive root."]},{"topic":"Circular","q":"$\\mathbf r=(5\\cos2t,\\ 5\\sin2t)$. Find the speed.","a":"10","alt":["10."],"ad":"$10$","sol":"Speed $=R\\omega=5\\times2=10$.","h":["$R=5$.","$\\omega=2$.","Multiply."]},{"topic":"Displacement","q":"$v=2t$ on $0\\le t\\le3$. Find the displacement.","a":"9","alt":["9."],"ad":"$9$","sol":"$\\int_0^32t\\,dt=9$.","h":["Integrate $v$.","$[t^2]_0^3$.","Evaluate."]},{"topic":"Derivative","q":"$\\mathbf r=(t^3,\\,2t)$. $\\dot{\\mathbf r}$ at $t=1$: enter the first component.","a":"3","alt":[],"ad":"$3$","sol":"$3t^2$.","h":["Differentiate.","$3t^2$.","At 1."]},{"topic":"Speed","q":"$\\dot{\\mathbf r}=(3,4)$. Speed?","a":"5","alt":[],"ad":"$5$","sol":"$\\sqrt{9+16}$.","h":["Magnitude.","$\\sqrt{25}$.","5."]},{"topic":"Integrate","q":"$\\mathbf v=(4t,0)$, $\\mathbf r(0)=(0,0)$. $x(2)$?","a":"8","alt":[],"ad":"$8$","sol":"$x=2t^2$.","h":["Integrate.","$2t^2$.","At 2."]},{"topic":"Acceleration","q":"$\\mathbf r=(t^2,t^2)$. Magnitude of acceleration?","a":"2sqrt2","alt":["2\u221a2","sqrt8"],"ad":"$2\\sqrt2$","sol":"$\\ddot{\\mathbf r}=(2,2)$.","h":["Differentiate twice.","$(2,2)$.","Magnitude."]},{"topic":"Eliminate","q":"$x=t$, $y=t^2$. Write $y$ in terms of $x$: enter the power.","a":"2","alt":[],"ad":"$y=x^2$","sol":"Substitute.","h":["$x=t$.","$y=x^2$.","Power 2."]},{"topic":"Time","q":"Projectile height $10t-5t^2$. Maximum height?","a":"5","alt":[],"ad":"$5$","sol":"At $t=1$: $10-5=5$.","h":["Vertex.","$t=1$.","Substitute."]},{"topic":"Stationary","q":"$\\mathbf v=(t-2,\\ t-2)$ is zero when $t=$?","a":"2","alt":[],"ad":"$2$","sol":"Both components vanish.","h":["Set zero.","$t-2=0$.","2."]},{"topic":"Distance","q":"Position $(3t,4t)$. Distance from origin at $t=2$?","a":"10","alt":[],"ad":"$10$","sol":"$(6,8)$, length $10$.","h":["Position.","$(6,8)$.","Magnitude."]},{"topic":"Direction","q":"$\\mathbf v=(0,5)$. Is the object moving in the $x$ or $y$ direction?","a":"y","alt":["Y"],"ad":"$y$","sol":"Only $y$ changes.","h":["Components.","$x$ speed zero.","$y$."]},{"topic":"Constant","q":"If $\\ddot{\\mathbf r}=(0,-10)$ and the initial velocity is $(5,0)$, the $x$-component of velocity at $t=3$?","a":"5","alt":[],"ad":"$5$","sol":"No horizontal acceleration.","h":["$\\ddot x=0$.","Constant.","5."]}],"comets":[{"topic":"Extension: Closest approach idea","q":"$\\mathbf r_1=(t,0)$, $\\mathbf r_2=(0,t-2)$. Find the squared distance $d^2$ in terms of $t$, then find the minimum value of $d^2$.","a":"2","alt":["2."],"ad":"$d^2_{\\min}=2$","sol":"$d^2=t^2+(t-2)^2=2t^2-4t+4$, minimum at $t=1$ is $2$.","h":["Distance formula.","Expand.","Minimise the quadratic."]},{"topic":"Extension: Speed maximum","q":"$\\mathbf r=(\\cos t,\\ 2\\sin t)$. Find the maximum speed.","a":"2","alt":["2."],"ad":"$2$","sol":"$\\mathbf v=(-\\sin t,\\ 2\\cos t)$, $|\\mathbf v|^2=\\sin^2t+4\\cos^2t=1+3\\cos^2t$, max $4$ so speed $2$.","h":["Differentiate.","Square the speed.","Use $\\cos^2t\\le1$."]},{"topic":"Extension: Maximum range","q":"For speed $v$ at angle $\\theta$ with $g=10$, the range is $\\frac{v^2\\sin2\\theta}{10}$. For $v=20$, the maximum range is?","a":"40","alt":[],"ad":"$40$ m at $45^\\circ$","sol":"$\\sin2\\theta=1$: $\\frac{400}{10}$.","h":["Maximise $\\sin2\\theta$.","It is 1.","Compute."]}],"hours":4},"ms3-c05":{"id":"ms3-c05","interactive":"matrix","summary":"Matrices store and transform data. This chapter covers matrix algebra, determinants and inverses, solving systems by Gaussian elimination, the three solution cases, dominance and Leslie matrices, and applications such as Markov chains and cryptography.","videos":[{"src":"B","title":"Linear transformations and matrices (3Blue1Brown, ch. 3)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Linear+transformations+and+matrices+essence+of+linear+algebra+chapter+3","kind":"search"},{"src":"B","title":"Matrix multiplication as composition (3Blue1Brown, ch. 4)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Matrix+multiplication+as+composition+essence+of+linear+algebra+chapter+4","kind":"search"},{"src":"B","title":"The determinant (3Blue1Brown, ch. 6)","url":"https://www.youtube.com/watch?v=Ip3X9LOh2dk","kind":"video"},{"src":"B","title":"Inverse matrices, column space and null space (3Blue1Brown, ch. 7)","url":"https://www.youtube.com/watch?v=uQhTuRlWMxw","kind":"video"},{"src":"J","title":"Matrix operations","url":"https://www.youtube.com/results?search_query=Joel+Speranza+matrices+operations","kind":"search"},{"src":"J","title":"Gaussian elimination","url":"https://www.youtube.com/results?search_query=Joel+Speranza+Gaussian+elimination","kind":"search"},{"src":"J","title":"Leslie matrices and Markov chains","url":"https://www.youtube.com/results?search_query=Joel+Speranza+Leslie+matrix+Markov+chain","kind":"search"}],"sections":[{"id":"ms3-c05-s1","code":"5.2","title":"Matrix algebra, determinants and inverses","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: matrix inverse and determinant","url":"https://www.youtube.com/results?search_query=Joel+Speranza+matrix+inverse+and+determinant","kind":"search"},{"src":"B","title":"3Blue1Brown: The determinant","url":"https://www.youtube.com/watch?v=Ip3X9LOh2dk","kind":"video"}]},{"t":"p","x":"**Addition** is entry by entry (same size). **Scalar multiple** scales every entry. **Product** $AB$ requires columns of $A$ = rows of $B$; entry $(i,j)$ is row $i$ of $A$ dotted with column $j$ of $B$. Multiplication is **not commutative**: $AB\\ne BA$ in general."},{"t":"key","x":"For $A=\\begin{pmatrix}a&b\\\\c&d\\end{pmatrix}$: $\\det A=ad-bc$ and $A^{-1}=\\dfrac{1}{ad-bc}\\begin{pmatrix}d&-b\\\\-c&a\\end{pmatrix}$ when $\\det A\\ne0$. For any invertible matrices, $(AB)^{-1}=B^{-1}A^{-1}$."},{"t":"ex","title":"Inverse","q":"Find the inverse of $A=\\begin{pmatrix}2&1\\\\5&3\\end{pmatrix}$.","s":["$\\det A=6-5=1$.","$A^{-1}=\\begin{pmatrix}3&-1\\\\-5&2\\end{pmatrix}$."],"a":"$A^{-1}=\\begin{pmatrix}3&-1\\\\-5&2\\end{pmatrix}$"},{"t":"ex","title":"Solving $AX=B$","q":"Solve $A\\mathbf x=\\begin{pmatrix}4\\\\9\\end{pmatrix}$ for $A$ above.","s":["$\\mathbf x=A^{-1}\\mathbf b=\\begin{pmatrix}3(4)-9\\\\-5(4)+2(9)\\end{pmatrix}=\\begin{pmatrix}3\\\\-2\\end{pmatrix}$."],"a":"$x=3,\\ y=-2$"},{"t":"warn","x":"Multiply by the inverse on the **same side** on both sides. If $AX=B$ then $X=A^{-1}B$, not $BA^{-1}$."},{"t":"int","name":"matrix","cap":"Apply a 2x2 matrix to a unit square and watch the area scale by the determinant."},{"t":"tb","rec":"1,2,3,5,7,9,10,11,16","ext":"18,19,21,23","x":"Exercise 5.2 covers matrix arithmetic, determinants, inverses and matrix equations.","code":"5.2"},{"t":"ex","title":"Inverse","q":"Inverse of $\\begin{pmatrix}2&1\\\\5&3\\end{pmatrix}$.","s":["$\\det=6-5=1$.","$\\frac1{1}\\begin{pmatrix}3&-1\\\\-5&2\\end{pmatrix}$."],"a":"$\\begin{pmatrix}3&-1\\\\-5&2\\end{pmatrix}$"},{"t":"int","name":"matrix","cap":"Drag the four entries: the green and blue arrows show where the two basis vectors land; the determinant is the area scale factor."}]},{"id":"ms3-c05-s2","code":"5.3","title":"Gaussian elimination","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: Gaussian elimination","url":"https://www.youtube.com/results?search_query=Joel+Speranza+Gaussian+elimination","kind":"search"}]},{"t":"p","x":"Write the system as an **augmented matrix** and use row operations (swap rows, scale a row, add a multiple of one row to another) to reach **row echelon form**, then **back-substitute**. Keep track of each operation, for example $R_2\\to R_2-2R_1$."},{"t":"ex","title":"Solving a 3\u00d73 system","q":"Solve $x+y+z=6$, $2y+5z=-4$, $2x+5y-z=27$.","s":["Eliminate $x$ from row 3: $R_3\\to R_3-2R_1$: $3y-3z=15\\Rightarrow y-z=5$.","Now $2y+5z=-4$ and $y-z=5$. $2(5+z)+5z=-4\\Rightarrow7z=-14\\Rightarrow z=-2$.","$y=3$, $x=6-3+2=5$."],"a":"$(x,y,z)=(5,3,-2)$"},{"t":"tb","rec":"4,5,6,9,12","ext":"13,16","x":"Exercise 5.3 solves systems by elimination and with technology.","code":"5.3"},{"t":"ex","title":"Gaussian elimination","q":"$x+y=3$, $2x-y=0$.","s":["Add the equations: $3x=3\\Rightarrow x=1$, then $y=2$."],"a":"$x=1,\\ y=2$"}]},{"id":"ms3-c05-s3","code":"5.4","title":"The three cases","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: systems of equations number of solutions parameter","url":"https://www.youtube.com/results?search_query=Joel+Speranza+systems+of+equations+number+of+solutions+parameter","kind":"search"},{"src":"B","title":"3Blue1Brown: Inverse matrices, column space and null space","url":"https://www.youtube.com/watch?v=uQhTuRlWMxw","kind":"video"}]},{"t":"p","x":"A system of linear equations has **one** solution, **no** solution, or **infinitely many**. After elimination, a row $0=k$ with $k\\ne0$ means **no solution** (inconsistent). A row $0=0$ leaves a free variable: let it be a parameter $t$ to describe the **infinite** solution set. For a square system, $\\det A=0$ means it is **not** the unique case."},{"t":"ex","title":"Parameter","q":"$x+y+z=3$ and $x-y+z=1$. Describe all solutions.","s":["Adding: $2x+2z=4$, so $x=2-z$. Subtracting: $2y=2$, so $y=1$.","Let $z=t$: $x=2-t$."],"a":"$(2-t,\\ 1,\\ t)$, a line of solutions."},{"t":"ex","title":"Finding the parameter","q":"For what $k$ does $x+2y=3$, $2x+4y=k$ have no solution?","s":["Second $-2\\times$ first: $0=k-6$."],"a":"No solution when $k\\ne6$; infinitely many when $k=6$."},{"t":"tb","rec":"1,2,3","ext":"5,8,10,12,15,17,22","x":"Exercise 5.4 classifies systems with parameters.","code":"5.4"},{"t":"ex","title":"Parameter","q":"For which $k$ does $x+y=1$, $2x+2y=k$ have no solution?","s":["Parallel lines unless $k=2$."],"a":"$k\\ne2$"}]},{"id":"ms3-c05-s4","code":"5.5","title":"Dominance and Leslie matrices","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: Leslie matrices","url":"https://www.youtube.com/results?search_query=Joel+Speranza+Leslie+matrices","kind":"search"}]},{"t":"p","x":"A **dominance matrix** has entry $1$ if $i$ beats $j$ (else $0$). One-step dominance counts direct wins; $A+A^2$ counts one- and two-step wins. A **Leslie matrix** models age-structured populations: the top row holds **fertility** rates and the sub-diagonal holds **survival** rates. If $\\mathbf x_n$ is the population vector, $\\mathbf x_{n+1}=L\\mathbf x_n$ and $\\mathbf x_n=L^n\\mathbf x_0$."},{"t":"ex","title":"Leslie matrix","q":"$L=\\begin{pmatrix}0&2\\\\0.5&0\\end{pmatrix}$ and $\\mathbf x_0=\\begin{pmatrix}100\\\\40\\end{pmatrix}$. Find $\\mathbf x_1$.","s":["$\\mathbf x_1=\\begin{pmatrix}0(100)+2(40)\\\\0.5(100)+0\\end{pmatrix}=\\begin{pmatrix}80\\\\50\\end{pmatrix}$."],"a":"$\\begin{pmatrix}80\\\\50\\end{pmatrix}$"},{"t":"tb","rec":"1,3,6,7","ext":"9,11,13,14","x":"Exercise 5.5 builds dominance and Leslie matrices and iterates them.","code":"5.5"},{"t":"ex","title":"Leslie matrix","q":"$L=\\begin{pmatrix}0&2\\\\0.5&0\\end{pmatrix}$, population $(10,\\ 6)$ next generation.","s":["$(0\\cdot10+2\\cdot6,\\ 0.5\\cdot10+0)=(12,\\ 5)$."],"a":"$(12,\\ 5)$"}]},{"id":"ms3-c05-s5","code":"5.6","title":"Applications","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: Markov chains transition matrix","url":"https://www.youtube.com/results?search_query=Joel+Speranza+Markov+chains+transition+matrix","kind":"search"}]},{"t":"p","x":"A **transition matrix** $T$ (columns sum to 1) takes a state vector forward: $\\mathbf s_{n+1}=T\\mathbf s_n$. The **steady state** satisfies $T\\mathbf s=\\mathbf s$ with entries summing to 1. Matrices also encode and decode messages: encode with $E$, decode with $E^{-1}$."},{"t":"ex","title":"Steady state","q":"$T=\\begin{pmatrix}0.8&0.3\\\\0.2&0.7\\end{pmatrix}$. Find the steady state.","s":["$0.8s_1+0.3s_2=s_1\\Rightarrow0.3s_2=0.2s_1\\Rightarrow s_1=1.5s_2$, with $s_1+s_2=1$.","$s_2=0.4$, $s_1=0.6$."],"a":"$\\begin{pmatrix}0.6\\\\0.4\\end{pmatrix}$"},{"t":"tb","rec":"1,3,4,5","ext":"9,11,13,15,18","x":"Exercise 5.6 applies matrices to Markov chains, cryptography and networks.","code":"5.6"},{"t":"ex","title":"Steady state","q":"Transition matrix $\\begin{pmatrix}0.9&0.2\\\\0.1&0.8\\end{pmatrix}$. Find the steady state.","s":["$0.1a=0.2b\\Rightarrow a=2b$; with $a+b=1$, $b=\\frac13$."],"a":"$\\left(\\frac23,\\ \\frac13\\right)$"}]},{"id":"ms3-c05-s6","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Check inverses.** Multiply $AA^{-1}$ and confirm you get $I$. A singular matrix has $\\det=0$ and no inverse. Remember $(AB)^{-1}=B^{-1}A^{-1}$ and $(AB)^T=B^TA^T$."},{"t":"p","x":"**Markov chains.** Columns sum to 1. State vector next step $=T\\mathbf s$. Steady state solves $T\\mathbf s=\\mathbf s$ with components summing to 1."}]}],"quiz":[{"topic":"Determinant","q":"Find $\\det\\begin{pmatrix}3&1\\\\2&4\\end{pmatrix}$.","a":"10","alt":["10."],"ad":"$10$","sol":"$12-2=10$.","h":["$ad-bc$.","$3\\cdot4-1\\cdot2$.","Compute."]},{"topic":"Product","q":"If $A=\\begin{pmatrix}1&2\\\\0&1\\end{pmatrix}$ and $B=\\begin{pmatrix}1&0\\\\3&1\\end{pmatrix}$, find the top-left entry of $AB$.","a":"7","alt":["7."],"ad":"$7$","sol":"$1\\cdot1+2\\cdot3=7$.","h":["Row 1 of $A$ times column 1 of $B$.","$(1,2)\\cdot(1,3)$.","Add."]},{"topic":"Inverse","q":"Find the inverse of $\\begin{pmatrix}1&2\\\\1&3\\end{pmatrix}$. Give the entries row by row as (a,b;c,d).","a":"(3,-2;-1,1)","alt":["3,-2;-1,1","(3,-2,-1,1)","3,-2,-1,1"],"ad":"$\\begin{pmatrix}3&-2\\\\-1&1\\end{pmatrix}$","sol":"$\\det=3-2=1$, so the inverse is $\\begin{pmatrix}3&-2\\\\-1&1\\end{pmatrix}$.","h":["Find the determinant.","Swap $a,d$ and negate $b,c$.","Divide by the determinant (here 1)."]},{"topic":"Singular","q":"For which $k$ is $\\begin{pmatrix}1&2\\\\3&k\\end{pmatrix}$ not invertible?","a":"6","alt":["k=6"],"ad":"$k=6$","sol":"$k-6=0$.","h":["Determinant is 0.","$k-6$.","Solve."]},{"topic":"Solve","q":"$\\begin{pmatrix}2&0\\\\0&5\\end{pmatrix}\\mathbf x=\\begin{pmatrix}6\\\\10\\end{pmatrix}$. Find $\\mathbf x$ as $(x,y)$.","a":"(3,2)","alt":["3,2"],"ad":"$(3,2)$","sol":"$x=3$, $y=2$.","h":["Each row separately.","$2x=6$.","$5y=10$."]},{"topic":"Cases","q":"$x+y=2$ and $2x+2y=5$ has how many solutions? (none, one, or infinite)","a":"none","alt":["no solution","0"],"ad":"none","sol":"Second $-2\\times$ first gives $0=1$.","h":["Eliminate.","$0=1$.","Contradiction."]},{"topic":"Cases","q":"$x+y=2$ and $2x+2y=4$ has how many solutions? (none, one, or infinite)","a":"infinite","alt":["infinitely many"],"ad":"infinite","sol":"Second equation is double the first.","h":["Is one a multiple of the other?","Yes.","A free parameter."]},{"topic":"Leslie","q":"$L=\\begin{pmatrix}1&3\\\\0.4&0\\end{pmatrix}$, $\\mathbf x_0=\\begin{pmatrix}10\\\\20\\end{pmatrix}$. Find the first entry of $\\mathbf x_1$.","a":"70","alt":["70."],"ad":"$70$","sol":"$1(10)+3(20)=70$.","h":["Row 1 times $\\mathbf x_0$.","$10+60$.","Add."]},{"topic":"Steady state","q":"$T=\\begin{pmatrix}0.9&0.2\\\\0.1&0.8\\end{pmatrix}$. Find the first entry of the steady state (exact fraction).","a":"2/3","alt":["0.667","0.6667"],"ad":"$\\tfrac23$","sol":"$0.1s_1=0.2s_2$, so $s_1=2s_2$; with sum 1, $s_1=\\frac23$.","h":["$0.9s_1+0.2s_2=s_1$.","$s_1=2s_2$.","$s_1+s_2=1$."]},{"topic":"Properties","q":"True or false: $AB=BA$ for all square matrices.","a":"false","alt":["False"],"ad":"false","sol":"Matrix multiplication is not commutative.","h":["Try a small example.","Order matters.","Not always."]},{"topic":"Determinant","q":"$\\begin{vmatrix}3&1\\\\4&2\\end{vmatrix}$.","a":"2","alt":[],"ad":"$2$","sol":"$6-4$.","h":["$ad-bc$.","$3\\cdot2-1\\cdot4$.","Compute."]},{"topic":"Inverse","q":"Determinant of $\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}$.","a":"-2","alt":[],"ad":"$-2$","sol":"$4-6$.","h":["$ad-bc$.","$4-6$.","$-2$."]},{"topic":"Product","q":"$\\begin{pmatrix}1&0\\\\0&2\\end{pmatrix}\\begin{pmatrix}3\\\\4\\end{pmatrix}$: second component.","a":"8","alt":[],"ad":"$8$","sol":"$2\\cdot4$.","h":["Row 2.","$0\\cdot3+2\\cdot4$.","8."]},{"topic":"Singular","q":"For which $k$ is $\\begin{pmatrix}1&2\\\\3&k\\end{pmatrix}$ singular?","a":"6","alt":[],"ad":"$k=6$","sol":"$k-6=0$.","h":["det.","$k-6$.","Set zero."]},{"topic":"Solve","q":"$2x=6$ in matrix form: $x=?$","a":"3","alt":[],"ad":"$3$","sol":"Divide.","h":["Divide.","$6/2$.","3."]},{"topic":"Markov","q":"Each column of a transition matrix sums to?","a":"1","alt":[],"ad":"$1$","sol":"Probabilities.","h":["Probabilities.","Total.","1."]},{"topic":"Steady","q":"$\\begin{pmatrix}0.5&0.5\\\\0.5&0.5\\end{pmatrix}$ steady state first component.","a":"0.5","alt":["1/2"],"ad":"$0.5$","sol":"Symmetric.","h":["Equal.","Sum 1.","0.5."]},{"topic":"Leslie","q":"$L=\\begin{pmatrix}1&1\\\\1&0\\end{pmatrix}$ applied to $(2,1)$: first component.","a":"3","alt":[],"ad":"$3$","sol":"$2+1$.","h":["Row 1.","$1\\cdot2+1\\cdot1$.","3."]},{"topic":"Trace","q":"Trace of $\\begin{pmatrix}2&5\\\\7&3\\end{pmatrix}$.","a":"5","alt":[],"ad":"$5$","sol":"$2+3$.","h":["Diagonal.","Add.","5."]},{"topic":"Reflect","q":"Image of $(2,3)$ under $\\begin{pmatrix}1&0\\\\0&-1\\end{pmatrix}$: second component.","a":"-3","alt":[],"ad":"$-3$","sol":"Reflect in the $x$-axis.","h":["Multiply.","Row 2.","$-3$."]}],"comets":[{"topic":"Extension: Eigen idea","q":"$A=\\begin{pmatrix}2&0\\\\0&3\\end{pmatrix}$. Find $A\\begin{pmatrix}1\\\\0\\end{pmatrix}$ and say what scalar it multiplies the vector by.","a":"2","alt":["2."],"ad":"$2$","sol":"$A(1,0)^T=(2,0)^T=2(1,0)^T$.","h":["Multiply.","Compare to the original.","A scalar multiple."]},{"topic":"Extension: Parameter problem","q":"For what value of $k$ does $x+y+z=1,\\ x+2y+3z=2,\\ x+3y+kz=3$ have infinitely many solutions?","a":"5","alt":["k=5"],"ad":"$k=5$","sol":"$R_2-R_1$: $y+2z=1$; $R_3-R_1$: $2y+(k-1)z=2$. Then $R_3-2R_2$: $(k-5)z=0$. Infinite when $k=5$.","h":["Eliminate $x$.","Then eliminate $y$.","Look for $0=0$."]},{"topic":"Extension: Eigen idea","q":"For $\\begin{pmatrix}2&0\\\\0&3\\end{pmatrix}$, what is the larger scale factor along an axis?","a":"3","alt":[],"ad":"$3$","sol":"Diagonal entries.","h":["Axes.","Diagonal.","Larger is 3."]}],"hours":4},"ph3-c01":{"id":"ph3-c01","interactive":"projectile","summary":"A projectile is any object moving only under gravity. The key idea is that horizontal and vertical motion are independent: horizontally the velocity is constant, vertically the acceleration is $9.8\\ \\text{m s}^{-2}$ downward. This chapter covers splitting a velocity into components, horizontal launches, angled launches, and launches from a height.","videos":[{"src":"F","title":"Projectile motion, horizontal and angled launches","url":"https://www.youtube.com/results?search_query=Flipping+Physics+projectile+motion+physics","kind":"search"},{"src":"K","title":"Two-dimensional projectile motion","url":"https://www.youtube.com/results?search_query=Khan+Academy+two+dimensional+projectile+motion","kind":"search"},{"src":"V","title":"Veritasium: Which ball wins the race on a curved track?","url":"https://www.youtube.com/results?search_query=Veritasium+monkey+and+the+hunter+projectile","kind":"search"}],"sections":[{"id":"ph3-c01-s1","code":"1.1","title":"Components and independence","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: projectile motion components independence","url":"https://www.youtube.com/results?search_query=Flipping+Physics+projectile+motion+components+independence","kind":"search"}]},{"t":"p","x":"**Split every vector into two perpendicular parts.** A velocity $v$ at angle $\\theta$ above the horizontal has components $v_x=v\\cos\\theta$ and $v_y=v\\sin\\theta$. Gravity acts only downward, so it changes $v_y$ and never touches $v_x$. This is the whole chapter in one sentence: the two directions are independent and are linked only by **time**."},{"t":"key","x":"$$v_x=v\\cos\\theta,\\qquad v_y=v\\sin\\theta,\\qquad a_x=0,\\qquad a_y=-g=-9.8\\ \\text{m s}^{-2}$$"},{"t":"p","x":"**Kinematic equations for constant acceleration** (used separately in each direction): $v=u+at$, $s=ut+\\tfrac12at^2$, $v^2=u^2+2as$, $s=\\tfrac12(u+v)t$. Choose **up as positive** and keep your signs consistent. Time $t$ is the same in both directions, so it is the number you solve for in one direction and substitute into the other."},{"t":"ex","title":"Components","q":"A ball is thrown at $20\\ \\text{m s}^{-1}$ at $30^\\circ$ above the horizontal. Find its velocity components.","s":["$v_x=20\\cos30^\\circ=17.3\\ \\text{m s}^{-1}$.","$v_y=20\\sin30^\\circ=10.0\\ \\text{m s}^{-1}$ (upward)."],"a":"$17.3\\ \\text{m s}^{-1}$ horizontally and $10.0\\ \\text{m s}^{-1}$ vertically."},{"t":"warn","x":"In the absence of air resistance the **horizontal velocity never changes** and the acceleration is $9.8\\ \\text{m s}^{-2}$ downward **at every point**, including the very top of the flight where the vertical velocity is zero."},{"t":"int","name":"projectile","cap":"Change the launch speed, angle and height. Watch the range, time and maximum height change, and see that $45^\\circ$ gives the longest range from level ground."}]},{"id":"ph3-c01-s2","code":"1.2","title":"Horizontal launches","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: horizontal projectile launch","url":"https://www.youtube.com/results?search_query=Flipping+Physics+horizontal+projectile+launch","kind":"search"}]},{"t":"p","x":"When an object leaves a table or cliff **horizontally**, $u_y=0$. The fall time depends only on the height: $h=\\tfrac12gt^2$ so $t=\\sqrt{2h/g}$. The horizontal distance is then $x=v_xt$. An object dropped and one thrown horizontally from the same height **land at the same time**."},{"t":"ex","title":"Horizontal launch","q":"A ball is kicked horizontally at $12\\ \\text{m s}^{-1}$ from the edge of a $20\\ \\text{m}$ cliff. Find the time of flight, horizontal range, and impact speed.","s":["$t=\\sqrt{2(20)/9.8}=2.02\\ \\text{s}$.","Range $=12\\times2.02=24.2\\ \\text{m}$.","$v_y=gt=19.8\\ \\text{m s}^{-1}$ downward, so $v=\\sqrt{12^2+19.8^2}=23.2\\ \\text{m s}^{-1}$ at $\\tan^{-1}(19.8/12)=58.8^\\circ$ below the horizontal."],"a":"$2.02\\ \\text{s}$, $24.2\\ \\text{m}$, and $23.2\\ \\text{m s}^{-1}$ at $58.8^\\circ$ below horizontal."},{"t":"p","x":"**Impact speed uses Pythagoras and impact angle uses inverse tan** of the final components. State the angle relative to the horizontal and the direction (below horizontal) so the examiner can award the mark."}]},{"id":"ph3-c01-s3","code":"1.3","title":"Angled launches on level ground","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: projectile motion angled launch level ground","url":"https://www.youtube.com/results?search_query=Flipping+Physics+projectile+motion+angled+launch+level+ground","kind":"search"}]},{"t":"p","x":"For a launch at angle $\\theta$ from and back to the same height: time of flight $T=\\dfrac{2v\\sin\\theta}{g}$, maximum height $H=\\dfrac{v^2\\sin^2\\theta}{2g}$, range $R=\\dfrac{v^2\\sin2\\theta}{g}$. These are quick checks, but in an exam **derive from the kinematic equations** unless the question is routine. At the top, $v_y=0$."},{"t":"ex","title":"Angled launch","q":"A ball is launched at $25\\ \\text{m s}^{-1}$ at $40^\\circ$ above the horizontal from level ground. Find the time of flight, maximum height and range.","s":["$v_y=25\\sin40^\\circ=16.07$, $v_x=25\\cos40^\\circ=19.15$.","$T=\\frac{2(16.07)}{9.8}=3.28\\ \\text{s}$; $H=\\frac{16.07^2}{2(9.8)}=13.2\\ \\text{m}$.","$R=19.15\\times3.28=62.8\\ \\text{m}$."],"a":"$3.28\\ \\text{s}$, $13.2\\ \\text{m}$, $62.8\\ \\text{m}$."},{"t":"key","x":"**Complementary angles** ($\\theta$ and $90^\\circ-\\theta$) give the **same range** on level ground, because $\\sin2\\theta=\\sin(180^\\circ-2\\theta)$. The maximum range is at $45^\\circ$."}]},{"id":"ph3-c01-s4","code":"1.4","title":"Launches from a height","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: projectile launched from a height","url":"https://www.youtube.com/results?search_query=Flipping+Physics+projectile+launched+from+a+height","kind":"search"}]},{"t":"p","x":"If the landing point is **not** at the launch height, use $s_y=u_yt+\\tfrac12a_yt^2$ with $s_y$ equal to the net vertical displacement. This gives a quadratic in $t$; choose the physically sensible (positive) root."},{"t":"ex","title":"From a height","q":"A ball is thrown at $15\\ \\text{m s}^{-1}$ at $30^\\circ$ above the horizontal from a $10\\ \\text{m}$ high balcony. Find the time to reach the ground and the horizontal distance travelled.","s":["$u_y=7.5$, $u_x=12.99$. Taking up as positive, $s_y=-10$: $-10=7.5t-4.9t^2$.","$4.9t^2-7.5t-10=0\\Rightarrow t=\\dfrac{7.5+\\sqrt{56.25+196}}{9.8}=2.39\\ \\text{s}$.","$x=12.99\\times2.39=31.0\\ \\text{m}$."],"a":"$2.39\\ \\text{s}$ and $31.0\\ \\text{m}$."},{"t":"warn","x":"Discard the negative root of the quadratic: it corresponds to a time before launch."}]},{"id":"ph3-c01-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Method that earns marks.** (1) Draw the path and label components. (2) Choose up as positive. (3) Write the equation with symbols, then substitute with units. (4) Solve for time in the direction where you know most, then use it in the other. (5) Give answers to 2 or 3 significant figures with units."},{"t":"p","x":"**Air resistance** is ignored unless stated. If asked how air resistance changes the path, say the range and maximum height decrease and the path becomes asymmetric (steeper descent)."},{"t":"p","x":"**Common errors.** Using $g=+9.8$ for u
