pward motion; mixing degrees and radians; applying $R=v^2\\sin2\\theta/g$ when the landing height differs; forgetting that $v_x$ is constant."}]}],"quiz":[{"topic":"Component","q":"A ball is thrown at $20\\ \\text{m s}^{-1}$ at $30^\\circ$ above the horizontal. Find its horizontal velocity component in $\\text{m s}^{-1}$ (1 decimal place).","a":"17.3","alt":[],"ad":"$17.3\\ \\text{m s}^{-1}$","sol":"$v_x=20\\cos30^\\circ=17.3$.","h":["Horizontal uses cosine.","$v_x=v\\cos\\theta$.","Substitute $20\\cos30^\\circ$."]},{"topic":"Fall time","q":"An object is dropped from rest from $45\\ \\text{m}$. Find the time to fall (seconds, 2 decimal places, $g=9.8$).","a":"3.03","alt":[],"ad":"$3.03\\ \\text{s}$","sol":"$t=\\sqrt{2(45)/9.8}=3.03\\ \\text{s}$.","h":["Use $s=\\frac12gt^2$.","$t=\\sqrt{2h/g}$.","Substitute."]},{"topic":"Horizontal range","q":"A ball is rolled horizontally off a $5.0\\ \\text{m}$ high table at $8.0\\ \\text{m s}^{-1}$. Find the horizontal distance travelled (metres, 1 decimal place).","a":"8.1","alt":[],"ad":"$8.1\\ \\text{m}$","sol":"$t=\\sqrt{2(5)/9.8}=1.01\\ \\text{s}$; $x=8.0\\times1.01=8.1\\ \\text{m}$.","h":["Find the fall time first.","$t=1.01$ s.","$x=v_xt$."]},{"topic":"Maximum height","q":"A projectile has initial vertical velocity $14.7\\ \\text{m s}^{-1}$. Find its maximum height above the launch point (metres, 1 decimal place).","a":"11.0","alt":["11"],"ad":"$11.0\\ \\text{m}$","sol":"$H=\\frac{14.7^2}{2(9.8)}=11.0$.","h":["At the top $v_y=0$.","$v^2=u^2+2as$.","$H=u^2/(2g)$."]},{"topic":"Time of flight","q":"Initial vertical velocity is $14.7\\ \\text{m s}^{-1}$ and the projectile lands at the launch height. Find the time of flight (seconds).","a":"3.0","alt":["3","3.00"],"ad":"$3.0\\ \\text{s}$","sol":"$T=\\frac{2(14.7)}{9.8}=3.0$.","h":["Up time equals down time.","$t_{up}=u_y/g$.","Double it."]},{"topic":"Best angle","q":"For a given launch speed on level ground, what launch angle (degrees) gives the maximum range?","a":"45","alt":[],"ad":"$45^\\circ$","sol":"$R=v^2\\sin2\\theta/g$ is maximum when $\\sin2\\theta=1$.","h":["Range depends on $\\sin2\\theta$.","The maximum of sine is 1.","$2\\theta=90^\\circ$."]},{"topic":"Top of flight","q":"What is the magnitude of the acceleration of a projectile at the very top of its path ($\\text{m s}^{-2}$, no air resistance)?","a":"9.8","alt":[],"ad":"$9.8\\ \\text{m s}^{-2}$ downward","sol":"Gravity acts throughout the flight.","h":["Is gravity switched off at the top?","Only the vertical velocity is zero.","Acceleration is $g$."]},{"topic":"Landing speed","q":"A ball is dropped from $20\\ \\text{m}$. Find its speed just before landing ($\\text{m s}^{-1}$, 1 decimal place).","a":"19.8","alt":[],"ad":"$19.8\\ \\text{m s}^{-1}$","sol":"$v=\\sqrt{2gh}=\\sqrt{2(9.8)(20)}=19.8$.","h":["$v^2=u^2+2as$.","$u=0$.","$v=\\sqrt{2gh}$."]},{"topic":"Range","q":"Find the range of a projectile launched at $20\\ \\text{m s}^{-1}$ at $30^\\circ$ from level ground (metres, 1 decimal place).","a":"35.3","alt":["35.4","35.35"],"ad":"$35.3\\ \\text{m}$","sol":"$R=\\frac{400\\sin60^\\circ}{9.8}=35.3$.","h":["$R=v^2\\sin2\\theta/g$.","$\\sin60^\\circ=0.866$.","Divide by 9.8."]},{"topic":"Vertical velocity","q":"An object falls from rest for $2.0\\ \\text{s}$. Find its speed at that time ($\\text{m s}^{-1}$).","a":"19.6","alt":["20"],"ad":"$19.6\\ \\text{m s}^{-1}$","sol":"$v=gt=9.8\\times2.0$.","h":["$v=u+at$.","$u=0$.","Multiply by 2.0."]}],"comets":[{"topic":"Extension: Complementary launch","q":"A ball is launched at $20\\ \\text{m s}^{-1}$ at $60^\\circ$ from level ground. Find its range in metres (1 decimal place).","a":"35.3","alt":["35.4","35.35"],"ad":"$35.3\\ \\text{m}$","sol":"$R=\\frac{400\\sin120^\\circ}{9.8}=35.3$, the same as at $30^\\circ$.","h":["$\\sin120^\\circ=\\sin60^\\circ$.","Complementary angles give equal ranges.","Compute."]},{"topic":"Extension: Maximum height","q":"Find the maximum height of a $20\\ \\text{m s}^{-1}$ projectile launched at $30^\\circ$ from level ground (metres, 1 decimal place).","a":"5.1","alt":[],"ad":"$5.1\\ \\text{m}$","sol":"$v_y=10$; $H=\\frac{100}{19.6}=5.1$.","h":["$v_y=20\\sin30^\\circ$.","$H=v_y^2/2g$.","$100/19.6$."]}],"hours":3.5},"ph3-c02":{"id":"ph3-c02","interactive":"incline","summary":"Forces on a slope are solved by splitting weight into a component along the slope and a component into it. This chapter covers free-body diagrams, Newton's second law, components on an incline, normal force, and static and kinetic friction.","videos":[{"src":"F","title":"Inclined planes and friction","url":"https://www.youtube.com/results?search_query=Flipping+Physics+inclined+plane+physics+friction+Newton+second+law","kind":"search"},{"src":"K","title":"Forces on inclined planes","url":"https://www.youtube.com/results?search_query=Khan+Academy+forces+on+inclined+planes","kind":"search"},{"src":"V","title":"Veritasium: Friction","url":"https://www.youtube.com/results?search_query=Veritasium+friction","kind":"search"}],"sections":[{"id":"ph3-c02-s1","code":"2.1","title":"Free-body diagrams and Newton's laws","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: free body diagrams Newton laws","url":"https://www.youtube.com/results?search_query=Flipping+Physics+free+body+diagrams+Newton+laws","kind":"search"}]},{"t":"p","x":"**Newton's second law:** $\\Sigma F=ma$. The net force is the vector sum of all forces. A **free-body diagram** shows only the forces acting **on** the object: weight $mg$ (down), normal force $N$ (perpendicular to the surface), friction $f$ (along the surface), applied forces and tension. **Constant velocity** means $\\Sigma F=0$, not \"no forces\"."},{"t":"key","x":"$$\\Sigma F=ma,\\qquad W=mg,\\qquad f_k=\\mu_kN,\\qquad f_s\\le\\mu_sN$$"},{"t":"ex","title":"Resultant force","q":"A $3.0\\ \\text{kg}$ trolley is pushed with a net force of $12\\ \\text{N}$. Find its acceleration.","s":["$a=\\frac{\\Sigma F}{m}=\\frac{12}{3.0}=4.0\\ \\text{m s}^{-2}$."],"a":"$4.0\\ \\text{m s}^{-2}$"},{"t":"warn","x":"Weight and normal force are **not** a Newton's third-law pair. A third-law pair acts on **different objects**: the Earth pulls the block down, and the block pulls the Earth up."}]},{"id":"ph3-c02-s2","code":"2.2","title":"Forces on a slope","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: forces on an inclined plane","url":"https://www.youtube.com/results?search_query=Flipping+Physics+forces+on+an+inclined+plane","kind":"search"}]},{"t":"p","x":"On a slope of angle $\\theta$, choose axes **along** and **perpendicular** to the surface. The weight splits into $mg\\sin\\theta$ (down the slope) and $mg\\cos\\theta$ (into the slope). With no acceleration perpendicular to the surface, $N=mg\\cos\\theta$. Down the slope, the net force is $mg\\sin\\theta-f$."},{"t":"key","x":"$$F_{\\parallel}=mg\\sin\\theta,\\qquad F_{\\perp}=mg\\cos\\theta=N$$"},{"t":"ex","title":"Frictionless slope","q":"A $5.0\\ \\text{kg}$ block sits on a frictionless $30^\\circ$ slope. Find its acceleration and the normal force.","s":["$a=g\\sin30^\\circ=4.9\\ \\text{m s}^{-2}$ down the slope.","$N=mg\\cos30^\\circ=5.0(9.8)(0.866)=42.4\\ \\text{N}$."],"a":"$4.9\\ \\text{m s}^{-2}$ down the slope and $42.4\\ \\text{N}$."},{"t":"int","name":"incline","cap":"Change the slope angle and the friction coefficient. The block slides only when the down-slope component beats the maximum friction."},{"t":"warn","x":"The normal force on a slope is **less than** $mg$ (it equals $mg\\cos\\theta$). Using $N=mg$ on a slope is one of the most common errors."}]},{"id":"ph3-c02-s3","code":"2.3","title":"Friction","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: friction coefficient physics","url":"https://www.youtube.com/results?search_query=Flipping+Physics+friction+coefficient+physics","kind":"search"}]},{"t":"p","x":"**Static friction** adjusts up to a maximum $\\mu_sN$ to stop sliding. **Kinetic friction** acts on a sliding object and equals $\\mu_kN$ in the direction opposing motion. A block just on the point of sliding on a slope has $\\tan\\theta=\\mu_s$."},{"t":"ex","title":"Sliding with friction","q":"A block slides down a $30^\\circ$ slope with $\\mu_k=0.30$. Find its acceleration.","s":["$mg\\sin\\theta-\\mu_kmg\\cos\\theta=ma$.","$a=9.8(\\sin30^\\circ-0.30\\cos30^\\circ)=9.8(0.500-0.260)=2.35\\ \\text{m s}^{-2}$."],"a":"$2.35\\ \\text{m s}^{-2}$ down the slope."},{"t":"ex","title":"Critical angle","q":"A block is on a slope with $\\mu_s=0.60$. Find the greatest angle before it slides.","s":["$\\tan\\theta=\\mu_s=0.60$."],"a":"$\\theta=31.0^\\circ$"},{"t":"ex","title":"Pushed up a slope at constant speed","q":"A $2.0\\ \\text{kg}$ block is pushed up a $20^\\circ$ slope at constant speed with $\\mu_k=0.20$. Find the force parallel to the slope.","s":["$F=mg\\sin\\theta+\\mu_kmg\\cos\\theta=19.6(0.342+0.2\\times0.940)=10.4\\ \\text{N}$."],"a":"$10.4\\ \\text{N}$ up the slope."}]},{"id":"ph3-c02-s4","code":"2.4","title":"Pulleys and connected objects","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: pulleys Atwood machine connected objects","url":"https://www.youtube.com/results?search_query=Flipping+Physics+pulleys+Atwood+machine+connected+objects","kind":"search"}]},{"t":"p","x":"Treat the system as one object when the string is taut and does not stretch, so both masses share the same acceleration. For two masses over a light pulley, $a=\\dfrac{(m_1-m_2)g}{m_1+m_2}$. Then use one mass alone to find the tension."},{"t":"ex","title":"Atwood machine","q":"Masses of $5.0\\ \\text{kg}$ and $3.0\\ \\text{kg}$ hang from a light string over a pulley. Find the acceleration and the tension.","s":["$a=\\frac{(5.0-3.0)(9.8)}{8.0}=2.45\\ \\text{m s}^{-2}$.","For the lighter mass, $T-mg=ma\\Rightarrow T=3.0(9.8+2.45)=36.8\\ \\text{N}$."],"a":"$2.45\\ \\text{m s}^{-2}$ and $36.8\\ \\text{N}$."}]},{"id":"ph3-c02-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Always draw the free-body diagram.** Label every force with its name and direction, show the axes along and perpendicular to the slope, and write $\\Sigma F=ma$ for each axis. A correct diagram earns marks even if the arithmetic goes wrong."},{"t":"p","x":"**Units and figures.** Forces in newtons, acceleration in $\\text{m s}^{-2}$, 2 or 3 significant figures. Do not round until the final line."}]}],"quiz":[{"topic":"Normal","q":"A $10\\ \\text{kg}$ object rests on level ground. Find the normal force (N).","a":"98","alt":[],"ad":"$98\\ \\text{N}$","sol":"$N=mg=10(9.8)$.","h":["On level ground $N=mg$.","$10\\times9.8$.","Compute."]},{"topic":"Slope component","q":"A $4.0\\ \\text{kg}$ block is on a $20^\\circ$ slope. Find the component of its weight down the slope (N, 1 decimal place).","a":"13.4","alt":[],"ad":"$13.4\\ \\text{N}$","sol":"$mg\\sin20^\\circ=39.2(0.342)=13.4$.","h":["Along the slope uses sine.","$mg=39.2$.","$39.2\\sin20^\\circ$."]},{"topic":"Slope normal","q":"A $4.0\\ \\text{kg}$ block is on a $20^\\circ$ slope. Find the normal force (N, 1 decimal place).","a":"36.8","alt":[],"ad":"$36.8\\ \\text{N}$","sol":"$mg\\cos20^\\circ=39.2(0.940)=36.8$.","h":["Perpendicular uses cosine.","$mg=39.2$.","$39.2\\cos20^\\circ$."]},{"topic":"Frictionless acceleration","q":"Find the acceleration of a block on a frictionless $40^\\circ$ slope ($\\text{m s}^{-2}$, 2 decimal places).","a":"6.30","alt":["6.3"],"ad":"$6.30\\ \\text{m s}^{-2}$","sol":"$a=g\\sin40^\\circ=9.8(0.643)=6.30$.","h":["Mass cancels.","$a=g\\sin\\theta$.","$9.8\\sin40^\\circ$."]},{"topic":"Friction force","q":"$N=40\\ \\text{N}$ and $\\mu_k=0.25$. Find the kinetic friction (N).","a":"10","alt":["10.0"],"ad":"$10\\ \\text{N}$","sol":"$f=\\mu N=0.25\\times40$.","h":["$f=\\mu N$.","$0.25\\times40$.","Compute."]},{"topic":"Constant speed","q":"A block slides down a $20^\\circ$ slope at constant speed. Find $\\mu_k$ (2 decimal places).","a":"0.36","alt":[],"ad":"$0.36$","sol":"Net force zero: $mg\\sin\\theta=\\mu mg\\cos\\theta$, so $\\mu=\\tan20^\\circ=0.364$.","h":["Constant speed means zero net force.","$\\sin\\theta=\\mu\\cos\\theta$.","$\\mu=\\tan\\theta$."]},{"topic":"Critical angle","q":"A block just begins to slide when the slope is $\\theta$ and $\\mu_s=1.0$. Find $\\theta$ (degrees).","a":"45","alt":[],"ad":"$45^\\circ$","sol":"$\\tan\\theta=1.0$.","h":["$\\tan\\theta=\\mu_s$.","$\\tan^{-1}1$.","Compute."]},{"topic":"With friction","q":"Find the acceleration of a block on a $30^\\circ$ slope with $\\mu_k=0.20$ ($\\text{m s}^{-2}$, 2 decimal places).","a":"3.20","alt":["3.2"],"ad":"$3.20\\ \\text{m s}^{-2}$","sol":"$a=9.8(0.5-0.2\\cos30^\\circ)=9.8(0.327)=3.20$.","h":["$a=g(\\sin\\theta-\\mu\\cos\\theta)$.","$\\cos30^\\circ=0.866$.","Compute."]},{"topic":"Weight","q":"Find the weight of a $3.0\\ \\text{kg}$ object (N).","a":"29.4","alt":["29"],"ad":"$29.4\\ \\text{N}$","sol":"$W=mg=3.0(9.8)$.","h":["$W=mg$.","$3.0\\times9.8$.","Compute."]},{"topic":"Newton's second law","q":"Net force $12\\ \\text{N}$ acts on $3.0\\ \\text{kg}$. Find $a$ ($\\text{m s}^{-2}$).","a":"4.0","alt":["4"],"ad":"$4.0\\ \\text{m s}^{-2}$","sol":"$a=F/m$.","h":["$a=F/m$.","$12/3$.","Compute."]}],"comets":[{"topic":"Extension: Atwood","q":"Masses of $5.0\\ \\text{kg}$ and $3.0\\ \\text{kg}$ hang over a light pulley. Find the acceleration ($\\text{m s}^{-2}$, 2 decimal places).","a":"2.45","alt":[],"ad":"$2.45\\ \\text{m s}^{-2}$","sol":"$a=\\frac{(5-3)(9.8)}{8}=2.45$.","h":["Treat the system as one object.","Net driving force $(m_1-m_2)g$.","Total mass $8$ kg."]}],"hours":3},"ph3-c03":{"id":"ph3-c03","interactive":"none","summary":"Objects moving in a circle accelerate toward the centre even at constant speed. This chapter covers uniform circular motion, centripetal acceleration and force, horizontal circles including flat and banked curves, and vertical circles.","videos":[{"src":"F","title":"Centripetal acceleration and force","url":"https://www.youtube.com/results?search_query=Flipping+Physics+centripetal+force+circular+motion+physics","kind":"search"},{"src":"K","title":"Uniform circular motion","url":"https://www.youtube.com/results?search_query=Khan+Academy+uniform+circular+motion+centripetal+acceleration","kind":"search"},{"src":"V","title":"Veritasium: Why does the water stay in the bucket","url":"https://www.youtube.com/results?search_query=Veritasium+centrifugal+force","kind":"search"}],"sections":[{"id":"ph3-c03-s1","code":"3.1","title":"Uniform circular motion","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: uniform circular motion","url":"https://www.youtube.com/results?search_query=Flipping+Physics+uniform+circular+motion","kind":"search"}]},{"t":"p","x":"In **uniform circular motion** the speed is constant but the **direction changes**, so the velocity changes and the object **accelerates toward the centre**. For a radius $r$ and period $T$ (time for one revolution): $v=\\dfrac{2\\pi r}{T}=2\\pi rf$ where $f=\\frac1T$ is the frequency in hertz. Angular speed $\\omega=\\dfrac{2\\pi}{T}$ in $\\text{rad s}^{-1}$ and $v=\\omega r$."},{"t":"key","x":"$$v=\\frac{2\\pi r}{T},\\qquad a_c=\\frac{v^2}{r}=\\frac{4\\pi^2r}{T^2}=\\omega^2r$$"},{"t":"ex","title":"Speed and acceleration","q":"A stone on a $0.80\\ \\text{m}$ string is whirled at $2.0$ revolutions per second. Find its speed and centripetal acceleration.","s":["$T=0.50\\ \\text{s}$; $v=\\frac{2\\pi(0.80)}{0.50}=10.1\\ \\text{m s}^{-1}$.","$a_c=\\frac{v^2}{r}=\\frac{10.05^2}{0.80}=126\\ \\text{m s}^{-2}$."],"a":"$10.1\\ \\text{m s}^{-1}$ and $126\\ \\text{m s}^{-2}$ toward the centre."},{"t":"warn","x":"\"Centrifugal force\" is not a real force on the object. The object would move in a straight line at a tangent if the inward force vanished. Always name the real force providing the centripetal force (tension, friction, normal force, gravity)."}]},{"id":"ph3-c03-s2","code":"3.2","title":"Centripetal force","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: centripetal force","url":"https://www.youtube.com/results?search_query=Flipping+Physics+centripetal+force","kind":"search"}]},{"t":"p","x":"**Centripetal force** is the **net** force toward the centre: $F_c=ma_c=\\dfrac{mv^2}{r}$. It is not a new force; it is the resultant of the real forces. On a flat curve it is **friction**; on a string it is **tension**; for a planet it is **gravity**."},{"t":"ex","title":"Car on a flat curve","q":"A $1200\\ \\text{kg}$ car goes around a flat curve of radius $50\\ \\text{m}$ at $15\\ \\text{m s}^{-1}$. Find the friction force needed and the minimum coefficient of friction.","s":["$F=\\frac{mv^2}{r}=\\frac{1200(225)}{50}=5400\\ \\text{N}$.","$\\mu mg=\\frac{mv^2}{r}\\Rightarrow\\mu=\\frac{v^2}{rg}=\\frac{225}{50(9.8)}=0.46$."],"a":"$5400\\ \\text{N}$ and $\\mu\\ge0.46$."}]},{"id":"ph3-c03-s3","code":"3.3","title":"Banked curves and horizontal circles","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: banked curves circular motion","url":"https://www.youtube.com/results?search_query=Flipping+Physics+banked+curves+circular+motion","kind":"search"}]},{"t":"p","x":"On a **frictionless banked curve**, the horizontal component of the normal force provides the centripetal force: $N\\sin\\theta=\\frac{mv^2}{r}$ and $N\\cos\\theta=mg$. Dividing gives $\\tan\\theta=\\dfrac{v^2}{rg}$. The same method works for a conical pendulum (tension has horizontal and vertical components)."},{"t":"ex","title":"Banked road","q":"At what angle should a frictionless curve of radius $80\\ \\text{m}$ be banked for $20\\ \\text{m s}^{-1}$?","s":["$\\tan\\theta=\\frac{v^2}{rg}=\\frac{400}{80(9.8)}=0.510$."],"a":"$\\theta=27.0^\\circ$"},{"t":"p","x":"**Method:** resolve forces vertically (no acceleration) and horizontally toward the centre ($F=mv^2/r$), then combine."}]},{"id":"ph3-c03-s4","code":"3.4","title":"Vertical circles","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: vertical circle circular motion","url":"https://www.youtube.com/results?search_query=Flipping+Physics+vertical+circle+circular+motion","kind":"search"}]},{"t":"p","x":"In a vertical circle, speed changes and the net inward force changes with position. **Top:** $T+mg=\\frac{mv^2}{r}$. **Bottom:** $T-mg=\\frac{mv^2}{r}$. The minimum speed at the top for a string to stay taut is when $T=0$: $v_{\\min}=\\sqrt{gr}$. On a hill or bridge, $mg-N=\\frac{mv^2}{r}$ at the top, so you feel lighter."},{"t":"ex","title":"Bottom of a swing","q":"A $2.0\\ \\text{kg}$ mass moves at $3.0\\ \\text{m s}^{-1}$ at the bottom of a vertical circle of radius $1.5\\ \\text{m}$. Find the tension.","s":["$T-mg=\\frac{mv^2}{r}$, so $T=2.0\\left(9.8+\\frac{9.0}{1.5}\\right)=31.6\\ \\text{N}$."],"a":"$31.6\\ \\text{N}$"},{"t":"ex","title":"Minimum speed","q":"Find the minimum speed at the top of a vertical circle of radius $0.50\\ \\text{m}$.","s":["$T=0\\Rightarrow mg=\\frac{mv^2}{r}\\Rightarrow v=\\sqrt{gr}=\\sqrt{4.9}=2.21\\ \\text{m s}^{-1}$."],"a":"$2.21\\ \\text{m s}^{-1}$"}]},{"id":"ph3-c03-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Say which force.** Examiners want the real force supplying the centripetal force, and its direction toward the centre. \"Centripetal force\" alone as a labelled arrow on a free-body diagram is usually wrong."},{"t":"p","x":"**Check your signs.** Take the direction toward the centre as positive for circular-motion equations. At the top of a circle gravity points toward the centre; at the bottom it points away."}]}],"quiz":[{"topic":"Speed","q":"A stone moves in a circle of radius $2.0\\ \\text{m}$ with period $4.0\\ \\text{s}$. Find its speed ($\\text{m s}^{-1}$, 2 decimal places).","a":"3.14","alt":[],"ad":"$3.14\\ \\text{m s}^{-1}$","sol":"$v=\\frac{2\\pi(2.0)}{4.0}=3.14$.","h":["$v=2\\pi r/T$.","$2\\pi\\times2.0=12.57$.","Divide by 4.0."]},{"topic":"Acceleration","q":"$v=6.0\\ \\text{m s}^{-1}$ and $r=3.0\\ \\text{m}$. Find the centripetal acceleration ($\\text{m s}^{-2}$).","a":"12","alt":["12.0"],"ad":"$12\\ \\text{m s}^{-2}$","sol":"$a=v^2/r=36/3.0$.","h":["$a=v^2/r$.","$36\\div3$.","Compute."]},{"topic":"Force","q":"A $0.50\\ \\text{kg}$ mass moves at $4.0\\ \\text{m s}^{-1}$ on a radius of $2.0\\ \\text{m}$. Find the centripetal force (N).","a":"4.0","alt":["4"],"ad":"$4.0\\ \\text{N}$","sol":"$F=mv^2/r=0.50(16)/2.0$.","h":["$F=mv^2/r$.","$16/2$.","Multiply by 0.50."]},{"topic":"Period","q":"A motor turns at $5.0\\ \\text{Hz}$. Find the period (s).","a":"0.20","alt":["0.2"],"ad":"$0.20\\ \\text{s}$","sol":"$T=1/f$.","h":["$T=1/f$.","$1/5.0$.","Compute."]},{"topic":"Minimum speed","q":"Find the minimum speed at the top of a vertical circle of radius $2.5\\ \\text{m}$ ($\\text{m s}^{-1}$, 2 decimal places).","a":"4.95","alt":[],"ad":"$4.95\\ \\text{m s}^{-1}$","sol":"$v=\\sqrt{gr}=\\sqrt{24.5}=4.95$.","h":["Tension is zero at the minimum.","$mg=mv^2/r$.","$v=\\sqrt{gr}$."]},{"topic":"Banking","q":"A frictionless curve of radius $50\\ \\text{m}$ is designed for $14\\ \\text{m s}^{-1}$. Find the banking angle (degrees, 1 decimal place).","a":"21.8","alt":[],"ad":"$21.8^\\circ$","sol":"$\\tan\\theta=\\frac{196}{490}=0.40$, $\\theta=21.8^\\circ$.","h":["$\\tan\\theta=v^2/rg$.","$196/490$.","$\\tan^{-1}0.40$."]},{"topic":"Accelerating?","q":"A satellite orbits at constant speed in a circle. Is it accelerating? Answer yes or no.","a":"yes","alt":["Yes"],"ad":"Yes","sol":"Direction of velocity changes, so acceleration is non-zero toward the centre.","h":["Acceleration is change in velocity.","Velocity is a vector.","Direction changes."]},{"topic":"Bottom tension","q":"$m=2.0\\ \\text{kg}$, $v=3.0\\ \\text{m s}^{-1}$, $r=1.5\\ \\text{m}$ at the bottom of a vertical circle. Find the tension (N, 1 decimal place).","a":"31.6","alt":[],"ad":"$31.6\\ \\text{N}$","sol":"$T=m(g+v^2/r)=2.0(9.8+6.0)$.","h":["Tension minus weight gives centripetal force.","$T=mg+mv^2/r$.","Substitute."]},{"topic":"Hill","q":"A $1000\\ \\text{kg}$ car crosses the top of a hill of radius $40\\ \\text{m}$ at $10\\ \\text{m s}^{-1}$. Find the normal force (N).","a":"7300","alt":[],"ad":"$7300\\ \\text{N}$","sol":"$N=m(g-v^2/r)=1000(9.8-2.5)=7300$.","h":["Weight minus normal gives the inward force.","$mg-N=mv^2/r$.","Substitute."]},{"topic":"Angular speed","q":"A wheel turns at $60\\ \\text{rpm}$. Find $\\omega$ ($\\text{rad s}^{-1}$, 2 decimal places).","a":"6.28","alt":[],"ad":"$6.28\\ \\text{rad s}^{-1}$","sol":"$f=1\\ \\text{Hz}$, $\\omega=2\\pi f$.","h":["Convert to revolutions per second.","$\\omega=2\\pi f$.","$2\\pi\\times1$."]}],"comets":[{"topic":"Extension: Lifting off","q":"A car crosses the top of a hill of radius $40\\ \\text{m}$. At what speed does the normal force become zero ($\\text{m s}^{-1}$, 1 decimal place)?","a":"19.8","alt":[],"ad":"$19.8\\ \\text{m s}^{-1}$","sol":"$N=0\\Rightarrow mg=\\frac{mv^2}{r}\\Rightarrow v=\\sqrt{gr}=\\sqrt{392}=19.8$.","h":["Set $N=0$.","$mg=mv^2/r$.","$v=\\sqrt{gr}$."]},{"topic":"Extension: Flat curve limit","q":"The maximum speed on a flat curve of radius $40\\ \\text{m}$ with $\\mu=0.50$ is?","a":"14","alt":["14.0"],"ad":"$14\\ \\text{m s}^{-1}$","sol":"$\\mu mg=\\frac{mv^2}{r}\\Rightarrow v=\\sqrt{\\mu gr}=\\sqrt{196}=14$.","h":["Friction provides the inward force.","$\\mu g=v^2/r$.","$v=\\sqrt{\\mu gr}$."]}],"hours":4},"ph3-c04":{"id":"ph3-c04","interactive":"orbit","summary":"Every mass attracts every other mass. This chapter covers Newton's law of universal gravitation, gravitational field strength and the inverse-square law, orbital speed and period, Kepler's laws, geostationary satellites and apparent weightlessness.","videos":[{"src":"F","title":"Newton's law of universal gravitation","url":"https://www.youtube.com/results?search_query=Flipping+Physics+Newton+law+of+gravitation+physics+orbits","kind":"search"},{"src":"K","title":"Orbits and Kepler's laws","url":"https://www.youtube.com/results?search_query=Khan+Academy+Kepler+laws+orbits+physics","kind":"search"},{"src":"V","title":"Veritasium: Gravity visualized","url":"https://www.youtube.com/results?search_query=Veritasium+gravity+orbits","kind":"search"}],"sections":[{"id":"ph3-c04-s1","code":"4.1","title":"Newton's law of gravitation","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: Newton law of gravitation","url":"https://www.youtube.com/results?search_query=Flipping+Physics+Newton+law+of+gravitation","kind":"search"}]},{"t":"p","x":"Any two masses attract each other with equal and opposite forces along the line joining their centres. The force depends on the product of the masses and falls with the **square of the distance** between centres. $G=6.67\\times10^{-11}\\ \\text{N m}^2\\text{kg}^{-2}$."},{"t":"key","x":"$$F=\\frac{Gm_1m_2}{r^2}$$"},{"t":"ex","title":"Two cars","q":"Two $1.0\\times10^3\\ \\text{kg}$ cars are $2.0\\ \\text{m}$ apart. Find the gravitational force between them.","s":["$F=\\frac{6.67\\times10^{-11}(1000)(1000)}{2.0^2}=1.67\\times10^{-5}\\ \\text{N}$."],"a":"$1.67\\times10^{-5}\\ \\text{N}$, far too small to notice."},{"t":"warn","x":"$r$ is the distance between **centres of mass**, not surfaces. For an object at height $h$ above a planet of radius $R$, use $r=R+h$."}]},{"id":"ph3-c04-s2","code":"4.2","title":"Gravitational field strength","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: gravitational field strength","url":"https://www.youtube.com/results?search_query=Flipping+Physics+gravitational+field+strength","kind":"search"}]},{"t":"p","x":"The **gravitational field strength** is the force per unit mass: $g=\\dfrac{F}{m}=\\dfrac{GM}{r^2}$ (in $\\text{N kg}^{-1}$, the same as $\\text{m s}^{-2}$). It points toward the centre of the mass, and **doubling the distance divides it by 4**. Near Earth's surface $g\\approx9.8\\ \\text{N kg}^{-1}$, which can be confirmed from $G$, $M_E=5.97\\times10^{24}\\ \\text{kg}$ and $R_E=6.37\\times10^6\\ \\text{m}$."},{"t":"ex","title":"Field strength","q":"Find $g$ at the surface of Mars ($M=6.4\\times10^{23}\\ \\text{kg}$, $R=3.4\\times10^6\\ \\text{m}$).","s":["$g=\\frac{GM}{R^2}=\\frac{6.67\\times10^{-11}(6.4\\times10^{23})}{(3.4\\times10^6)^2}=3.69\\ \\text{N kg}^{-1}$."],"a":"$3.69\\ \\text{N kg}^{-1}$"},{"t":"ex","title":"At altitude","q":"Find $g$ at $400\\ \\text{km}$ above Earth's surface.","s":["$r=6.37\\times10^6+4.0\\times10^5=6.77\\times10^6\\ \\text{m}$.","$g=\\frac{6.67\\times10^{-11}(5.97\\times10^{24})}{(6.77\\times10^6)^2}=8.69\\ \\text{N kg}^{-1}$."],"a":"$8.69\\ \\text{N kg}^{-1}$, only slightly less than at the surface."},{"t":"int","name":"orbit","cap":"Move the orbital radius. See how field strength, speed and period change with radius."}]},{"id":"ph3-c04-s3","code":"4.3","title":"Orbits and Kepler's laws","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: Kepler laws orbits satellites","url":"https://www.youtube.com/results?search_query=Flipping+Physics+Kepler+laws+orbits+satellites","kind":"search"}]},{"t":"p","x":"For a satellite in a circular orbit, **gravity is the centripetal force**: $\\dfrac{GMm}{r^2}=\\dfrac{mv^2}{r}$ so $v=\\sqrt{\\dfrac{GM}{r}}$ (independent of the satellite's mass). With $v=\\frac{2\\pi r}{T}$ this gives **Kepler's third law**: $\\dfrac{T^2}{r^3}=\\dfrac{4\\pi^2}{GM}$, a constant for all orbits around the same central mass."},{"t":"key","x":"$$v=\\sqrt{\\frac{GM}{r}},\\qquad \\frac{r^3}{T^2}=\\frac{GM}{4\\pi^2}$$"},{"t":"ex","title":"Space station","q":"Find the orbital speed and period of a satellite $400\\ \\text{km}$ above Earth.","s":["$r=6.77\\times10^6$; $v=\\sqrt{\\frac{GM}{r}}=\\sqrt{\\frac{3.98\\times10^{14}}{6.77\\times10^6}}=7.67\\times10^3\\ \\text{m s}^{-1}$.","$T=\\frac{2\\pi r}{v}=5.55\\times10^3\\ \\text{s}=92.4\\ \\text{min}$."],"a":"$7.67\\ \\text{km s}^{-1}$ and $92\\ \\text{min}$."},{"t":"p","x":"**Kepler's laws.** (1) Orbits are ellipses with the central body at one focus. (2) A line from the central body sweeps equal areas in equal times, so orbiting bodies move fastest when closest. (3) $T^2\\propto r^3$. Higher orbits are **slower** and take **longer**."}]},{"id":"ph3-c04-s4","code":"4.4","title":"Geostationary satellites and weightlessness","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: geostationary satellite weightlessness","url":"https://www.youtube.com/results?search_query=Flipping+Physics+geostationary+satellite+weightlessness","kind":"search"}]},{"t":"p","x":"A **geostationary** satellite has a period of 24 hours, orbits above the equator in the same direction as Earth's rotation, and so stays above one point. Its radius is found from $r^3=\\frac{GMT^2}{4\\pi^2}\\approx4.22\\times10^7\\ \\text{m}$ from Earth's centre, about $3.59\\times10^7\\ \\text{m}$ above the surface."},{"t":"p","x":"**Apparent weightlessness.** An astronaut in orbit is in **free fall** around Earth. Gravity still acts (about $90\\%$ of surface value at ISS altitude), but there is no contact force from the floor, so no sensation of weight."},{"t":"warn","x":"Orbiting astronauts do not float because gravity is absent. They float because they and the spacecraft fall together."}]},{"id":"ph3-c04-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Constants and rounding.** Use $G=6.67\\times10^{-11}$, $M_E=5.97\\times10^{24}\\ \\text{kg}$, $R_E=6.37\\times10^6\\ \\text{m}$. Keep full precision until the end. Convert km to m before substituting."},{"t":"p","x":"**Proportional reasoning.** Many questions are asked as ratios. If $r$ doubles, $F$ and $g$ become $\\frac14$, $v$ becomes $\\frac1{\\sqrt2}$ and $T$ becomes $2\\sqrt2$ times larger. Writing the proportion with symbols is quicker and safer than recalculating."}]}],"quiz":[{"topic":"Doubling","q":"If the distance between two masses doubles, by what factor does the gravitational force change (as a decimal)?","a":"0.25","alt":["1/4"],"ad":"$\\frac14$","sol":"$F\\propto1/r^2$.","h":["Inverse square law.","$(1/2)^2$.","Compute."]},{"topic":"Field at 2R","q":"Find $g$ at a distance $2R_E$ from Earth's centre ($\\text{N kg}^{-1}$), using $g=9.8$ at the surface.","a":"2.45","alt":[],"ad":"$2.45\\ \\text{N kg}^{-1}$","sol":"$g\\propto1/r^2$, so $9.8/4$.","h":["Distance doubles.","Field falls by a factor of 4.","Divide 9.8 by 4."]},{"topic":"Mars","q":"Find $g$ at the surface of a planet with $M=6.4\\times10^{23}\\ \\text{kg}$ and $R=3.4\\times10^6\\ \\text{m}$ ($\\text{N kg}^{-1}$, 2 decimal places).","a":"3.69","alt":[],"ad":"$3.69\\ \\text{N kg}^{-1}$","sol":"$g=\\frac{GM}{R^2}=3.69$.","h":["$g=GM/R^2$.","Square the radius.","Compute."]},{"topic":"Weight","q":"Find the weight of a $60\\ \\text{kg}$ person where $g=3.7\\ \\text{N kg}^{-1}$ (N).","a":"222","alt":[],"ad":"$222\\ \\text{N}$","sol":"$W=mg=60(3.7)$.","h":["$W=mg$.","$60\\times3.7$.","Compute."]},{"topic":"Orbital speed","q":"A satellite orbits at $r=7.0\\times10^6\\ \\text{m}$ from Earth's centre. Find its speed in $\\text{km s}^{-1}$ (1 decimal place).","a":"7.5","alt":[],"ad":"$7.5\\ \\text{km s}^{-1}$","sol":"$v=\\sqrt{GM/r}=\\sqrt{3.98\\times10^{14}/7.0\\times10^6}=7.54\\times10^3$.","h":["Gravity is the centripetal force.","$v=\\sqrt{GM/r}$.","Convert to km/s."]},{"topic":"Period","q":"A satellite orbits at $r=7.0\\times10^6\\ \\text{m}$ with speed $7.54\\times10^3\\ \\text{m s}^{-1}$. Find its period in minutes (1 decimal place).","a":"97.2","alt":[],"ad":"$97.2\\ \\text{min}$","sol":"$T=\\frac{2\\pi r}{v}=5.83\\times10^3\\ \\text{s}=97.2\\ \\text{min}$.","h":["$T=2\\pi r/v$.","$2\\pi\\times7.0\\times10^6=4.40\\times10^7$.","Divide by $v$ and convert."]},{"topic":"Kepler","q":"If an orbital radius is multiplied by 4, by what factor is the period multiplied?","a":"8","alt":[],"ad":"$8$","sol":"$T\\propto r^{3/2}$, so $4^{3/2}=8$.","h":["$T^2\\propto r^3$.","$T\\propto r^{1.5}$.","$4^{1.5}$."]},{"topic":"Weightless?","q":"An astronaut in a stable orbit has no gravity acting on them. True or false?","a":"false","alt":["False"],"ad":"False","sol":"Gravity acts and provides the centripetal force; they are in free fall.","h":["What keeps the satellite in orbit?","Gravity is the centripetal force.","So it is not zero."]},{"topic":"Geostationary period","q":"What is the period of a geostationary satellite in hours?","a":"24","alt":[],"ad":"$24\\ \\text{h}$","sol":"It matches Earth's rotation.","h":["Stays above a point.","Matches rotation.","One day."]},{"topic":"Far field","q":"Find $g$ at a height $3R_E$ above Earth's surface (so $r=4R_E$), in $\\text{N kg}^{-1}$ (2 decimal places).","a":"0.61","alt":[],"ad":"$0.61\\ \\text{N kg}^{-1}$","sol":"$9.8/16=0.6125$.","h":["$r=4R_E$.","Field falls with $r^2$.","$9.8/16$."]}],"comets":[{"topic":"Extension: Period ratio","q":"Satellite A has a period 8 times that of satellite B around the same planet. Find $r_A/r_B$.","a":"4","alt":[],"ad":"$4$","sol":"$r^3\\propto T^2$, so $r\\propto T^{2/3}=8^{2/3}=4$.","h":["$T^2\\propto r^3$.","$r\\propto T^{2/3}$.","$8^{2/3}=4$."]},{"topic":"Extension: Planet scaling","q":"Two planets have the same density but one has twice the radius. Find the ratio of surface $g$ (large to small).","a":"2","alt":[],"ad":"$2$","sol":"$M\\propto R^3$, so $g=\\frac{GM}{R^2}\\propto R$.","h":["Same density means $M\\propto R^3$.","$g=GM/R^2$.","$g\\propto R$."]}],"hours":4.5},"ph3-c05":{"id":"ph3-c05","interactive":"none","summary":"Electric charges exert forces on each other through electric fields. This chapter covers Coulomb's law, electric field strength, field lines, uniform fields between parallel plates, and the motion and energy of charges in a field.","videos":[{"src":"F","title":"Coulomb's law and electric fields","url":"https://www.youtube.com/results?search_query=Flipping+Physics+Coulomb+law+electric+field+physics","kind":"search"},{"src":"K","title":"Electric field and potential","url":"https://www.youtube.com/results?search_query=Khan+Academy+electric+field+electric+potential+physics","kind":"search"},{"src":"V","title":"Veritasium: Electric fields","url":"https://www.youtube.com/results?search_query=Veritasium+electricity+energy+flows","kind":"search"}],"sections":[{"id":"ph3-c05-s1","code":"5.1","title":"Charge and Coulomb's law","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: Coulomb law electric charge","url":"https://www.youtube.com/results?search_query=Flipping+Physics+Coulomb+law+electric+charge","kind":"search"}]},{"t":"p","x":"There are two kinds of charge. **Like charges repel and unlike charges attract.** Charge is measured in coulombs; the elementary charge is $1.6\\times10^{-19}\\ \\text{C}$ (the data book lists the electron's charge as $e=-1.6\\times10^{-19}\\ \\text{C}$). **Coulomb's law** gives the force between two point charges, with $k=9\\times10^9\\ \\text{N m}^2\\text{C}^{-2}$ (the value in the QCAA data book)."},{"t":"key","x":"$$F=\\frac{kq_1q_2}{r^2}$$"},{"t":"ex","title":"Two charges","q":"Charges $+3.0\\ \\mu\\text{C}$ and $-2.0\\ \\mu\\text{C}$ are $0.20\\ \\text{m}$ apart. Find the force between them.","s":["$F=\\frac{(9\\times10^9)(3.0\\times10^{-6})(2.0\\times10^{-6})}{0.20^2}=1.35\\ \\text{N}$.","Opposite charges, so it is attractive."],"a":"$1.35\\ \\text{N}$ attractive."},{"t":"warn","x":"Use the **magnitudes** of the charges to find the size of the force, then decide the direction from the signs. Convert $\\mu\\text{C}$ to C ($\\times10^{-6}$) before substituting."}]},{"id":"ph3-c05-s2","code":"5.2","title":"Electric field strength","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: electric field strength","url":"https://www.youtube.com/results?search_query=Flipping+Physics+electric+field+strength","kind":"search"}]},{"t":"p","x":"The **electric field strength** at a point is the force per unit **positive** charge: $E=\\dfrac{F}{q}$ (units $\\text{N C}^{-1}=\\text{V m}^{-1}$). For a point charge $Q$: $E=\\dfrac{kQ}{r^2}$. The field points **away from positive** charges and **toward negative** charges. Field lines show direction; closer lines mean a stronger field."},{"t":"ex","title":"Point charge","q":"Find the field strength $0.50\\ \\text{m}$ from a $+4.0\\ \\mu\\text{C}$ point charge.","s":["$E=\\frac{(9\\times10^9)(4.0\\times10^{-6})}{0.50^2}=1.44\\times10^5\\ \\text{N C}^{-1}$."],"a":"$1.44\\times10^5\\ \\text{N C}^{-1}$ directed away from the charge."},{"t":"p","x":"**Superposition.** The total field is the **vector sum** of the fields from each charge. Between two equal like charges the fields cancel at the midpoint."},{"t":"warn","x":"A **negative** charge in a field feels a force **opposite** to the field direction."}]},{"id":"ph3-c05-s3","code":"5.3","title":"Uniform fields and charged particles","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: charged particle in uniform electric field","url":"https://www.youtube.com/results?search_query=Flipping+Physics+charged+particle+in+uniform+electric+field","kind":"search"}]},{"t":"p","x":"Between two parallel plates with potential difference $V$ and separation $d$, the field is **uniform**: $E=\\dfrac Vd$. A charge $q$ feels force $F=qE$ and acceleration $a=\\dfrac{qE}{m}$. Starting from rest, work done by the field becomes kinetic energy: $qV=\\tfrac12mv^2$."},{"t":"key","x":"$$E=\\frac Vd,\\qquad F=qE,\\qquad qV=\\tfrac12mv^2$$"},{"t":"ex","title":"Electron in a field","q":"An electron is in a uniform field of $2.5\\times10^4\\ \\text{V m}^{-1}$. Find its force and acceleration.","s":["$F=qE=(1.60\\times10^{-19})(2.5\\times10^4)=4.0\\times10^{-15}\\ \\text{N}$.","$a=\\frac Fm=\\frac{4.0\\times10^{-15}}{9.11\\times10^{-31}}=4.4\\times10^{15}\\ \\text{m s}^{-2}$."],"a":"$4.0\\times10^{-15}\\ \\text{N}$ and $4.4\\times10^{15}\\ \\text{m s}^{-2}$."},{"t":"ex","title":"Speed from potential","q":"An electron accelerates from rest through $500\\ \\text{V}$. Find its final speed.","s":["$v=\\sqrt{\\frac{2qV}{m}}=\\sqrt{\\frac{2(1.60\\times10^{-19})(500)}{9.11\\times10^{-31}}}=1.33\\times10^7\\ \\text{m s}^{-1}$."],"a":"$1.33\\times10^7\\ \\text{m s}^{-1}$"},{"t":"p","x":"**Electron-volt.** An electron accelerated through $1\\ \\text{V}$ gains $1\\ \\text{eV}=1.60\\times10^{-19}\\ \\text{J}$. A proton accelerated through $1000\\ \\text{V}$ gains $1000\\ \\text{eV}$."}]},{"id":"ph3-c05-s4","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Gravity versus electric force.** For an electron the electric force is enormously larger than its weight, so ignore gravity unless a particle is stationary (such as an oil drop held in balance). When stationary, $qE=mg$."},{"t":"p","x":"**Direction answers.** Describe field directions with words such as \"toward the negative plate\" and always state the sign of the charge when explaining which way a force acts."}]}],"quiz":[{"topic":"Field strength","q":"A force of $6.0\\times10^{-3}\\ \\text{N}$ acts on $2.0\\ \\mu\\text{C}$. Find $E$ ($\\text{N C}^{-1}$).","a":"3000","alt":["3.0e3","3.0x10^3"],"ad":"$3.0\\times10^3\\ \\text{N C}^{-1}$","sol":"$E=F/q=\\frac{6.0\\times10^{-3}}{2.0\\times10^{-6}}$.","h":["$E=F/q$.","Convert $\\mu$C to C.","Divide."]},{"topic":"Plates","q":"$240\\ \\text{V}$ is applied across plates $0.030\\ \\text{m}$ apart. Find $E$ ($\\text{V m}^{-1}$).","a":"8000","alt":[],"ad":"$8.0\\times10^3\\ \\text{V m}^{-1}$","sol":"$E=V/d=240/0.030$.","h":["$E=V/d$.","$d=0.030$.","Divide."]},{"topic":"Distance","q":"If the distance between two point charges doubles, by what factor does the electric force change (decimal)?","a":"0.25","alt":["1/4"],"ad":"$\\frac14$","sol":"Inverse square.","h":["$F\\propto1/r^2$.","$(1/2)^2$.","Compute."]},{"topic":"Force","q":"A $5.0\\ \\mu\\text{C}$ charge is in a field of $4000\\ \\text{N C}^{-1}$. Find the force (N).","a":"0.020","alt":["0.02"],"ad":"$0.020\\ \\text{N}$","sol":"$F=qE=5.0\\times10^{-6}\\times4000$.","h":["$F=qE$.","Convert $\\mu$C to C.","Multiply."]},{"topic":"Negative charge","q":"Does a negative charge accelerate in the same direction as the electric field? Answer yes or no.","a":"no","alt":["No"],"ad":"No","sol":"A negative charge is pushed opposite to the field.","h":["Field direction is defined by positive charges.","Negative is opposite.","Opposite direction."]},{"topic":"Work","q":"A $2.0\\ \\mu\\text{C}$ charge moves through $150\\ \\text{V}$. Find the work done in millijoules.","a":"0.30","alt":["0.3"],"ad":"$0.30\\ \\text{mJ}$","sol":"$W=qV=2.0\\times10^{-6}(150)=3.0\\times10^{-4}\\ \\text{J}$.","h":["$W=qV$.","Convert $\\mu$C to C.","$3.0\\times10^{-4}\\ \\text{J}$."]},{"topic":"Energy","q":"A proton is accelerated through $1000\\ \\text{V}$. Find its kinetic energy gain in eV.","a":"1000","alt":[],"ad":"$1000\\ \\text{eV}$","sol":"One electron-volt per volt for a single elementary charge.","h":["Definition of eV.","$q=e$.","$qV$ in eV."]},{"topic":"Midpoint","q":"Two identical positive charges are $1.0\\ \\text{m}$ apart. What is the net field strength at the midpoint?","a":"0","alt":[],"ad":"$0$","sol":"The fields are equal and opposite.","h":["Fields point away from each charge.","Equal magnitude.","They cancel."]},{"topic":"Acceleration","q":"An electron in a $1.0\\times10^4\\ \\text{N C}^{-1}$ field accelerates at what rate, in units of $10^{15}\\ \\text{m s}^{-2}$ (2 decimal places)?","a":"1.76","alt":[],"ad":"$1.76\\times10^{15}\\ \\text{m s}^{-2}$","sol":"$a=\\frac{eE}{m}=\\frac{1.60\\times10^{-19}\\times10^4}{9.11\\times10^{-31}}=1.76\\times10^{15}$.","h":["$a=qE/m$.","Use the electron mass $9.11\\times10^{-31}$.","Compute."]},{"topic":"Field scaling","q":"The field strength at distance $r$ from a point charge is $E$. What is it at $2r$ (as a multiple of $E$)?","a":"0.25","alt":["1/4"],"ad":"$\\frac E4$","sol":"$E\\propto1/r^2$.","h":["Inverse square.","$(1/2)^2$.","Compute."]}],"comets":[{"topic":"Extension: Zero-field point","q":"Charges $+q$ and $+4q$ are $3.0\\ \\text{m}$ apart. How far from $+q$ (along the line between them) is the field zero (metres)?","a":"1.0","alt":["1"],"ad":"$1.0\\ \\text{m}$","sol":"$\\frac{kq}{x^2}=\\frac{4kq}{(3-x)^2}\\Rightarrow3-x=2x\\Rightarrow x=1.0$.","h":["Fields cancel: set magnitudes equal.","$\\frac1{x^2}=\\frac4{(3-x)^2}$.","Take square roots."]},{"topic":"Extension: Oil drop","q":"An oil drop of mass $1.6\\times10^{-15}\\ \\text{kg}$ is held stationary between plates $1.0\\ \\text{cm}$ apart at $490\\ \\text{V}$. How many elementary charges does it carry?","a":"2","alt":[],"ad":"$2$","sol":"$qE=mg\\Rightarrow q=\\frac{mgd}{V}=3.2\\times10^{-19}\\ \\text{C}=2e$.","h":["Balance: $qE=mg$.","$E=V/d$.","Divide $q$ by $e$."]}],"hours":4},"ph3-c06":{"id":"ph3-c06","interactive":"lorentz","summary":"Moving charges and currents create and feel magnetic fields. This chapter covers magnetic field lines, fields of wires and solenoids, the force on a current-carrying conductor, the force on a moving charge, circular paths in magnetic fields, and the idea of the motor.","videos":[{"src":"F","title":"Magnetic fields and forces","url":"https://www.youtube.com/results?search_query=Flipping+Physics+magnetic+force+on+moving+charge+physics","kind":"search"},{"src":"K","title":"Magnetic force on a current-carrying wire","url":"https://www.youtube.com/results?search_query=Khan+Academy+magnetic+force+current+carrying+wire","kind":"search"},{"src":"V","title":"Veritasium: How magnets work","url":"https://www.youtube.com/results?search_query=Veritasium+magnets+how+they+work","kind":"search"}],"sections":[{"id":"ph3-c06-s1","code":"6.1","title":"Magnetic fields","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: magnetic fields and field lines","url":"https://www.youtube.com/results?search_query=Flipping+Physics+magnetic+fields+and+field+lines","kind":"search"}]},{"t":"p","x":"Magnetic field lines leave the **north** pole and enter the **south** pole outside a magnet, and they never cross. A magnetic field is measured in **tesla (T)**. **Right-hand grip rule for a straight wire:** thumb along the conventional current, fingers curl in the direction of the field. **Solenoid:** curl fingers in the direction of the current in the coils and the thumb points to the **north** end; the field inside is nearly uniform."},{"t":"p","x":"The field around a long wire is $B=\\dfrac{\\mu_0I}{2\\pi r}$ with $\\mu_0=4\\pi\\times10^{-7}\\ \\text{T m A}^{-1}$, so it falls with distance. A solenoid's field increases with current and with the number of turns per metre."},{"t":"warn","x":"Conventional current flows from **positive to negative**, opposite to electron flow. Use conventional current for every right-hand rule unless a question tells you otherwise."}]},{"id":"ph3-c06-s2","code":"6.2","title":"Force on a current-carrying conductor","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: force on a current carrying wire magnetic field","url":"https://www.youtube.com/results?search_query=Flipping+Physics+force+on+a+current+carrying+wire+magnetic+field","kind":"search"}]},{"t":"p","x":"A wire carrying current $I$ in a perpendicular field $B$ experiences a force $F=BIL\\sin\\theta$, where $\\theta$ is the angle between the current and the field. **Right-hand palm (or slap) rule:** fingers along the field, thumb along the conventional current, and the force comes out of the palm. The force is perpendicular to **both** the field and the current."},{"t":"key","x":"$$F=BIL\\sin\\theta$$"},{"t":"ex","title":"Wire in a field","q":"A $0.30\\ \\text{m}$ wire carries $5.0\\ \\text{A}$ at right angles to a $0.40\\ \\text{T}$ field. Find the force.","s":["$F=BIL=0.40(5.0)(0.30)=0.60\\ \\text{N}$."],"a":"$0.60\\ \\text{N}$"},{"t":"p","x":"**Parallel wires.** Currents in the **same** direction attract; opposite directions repel. This is how the ampere is defined."}]},{"id":"ph3-c06-s3","code":"6.3","title":"Force on a moving charge","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: force on a moving charge magnetic field","url":"https://www.youtube.com/results?search_query=Flipping+Physics+force+on+a+moving+charge+magnetic+field","kind":"search"}]},{"t":"p","x":"A charge $q$ moving at speed $v$ at angle $\\theta$ to a magnetic field feels $F=qvB\\sin\\theta$. The force is **perpendicular to the velocity**, so it does **no work** and changes direction, not speed. For a negative charge reverse the direction from the right-hand rule."},{"t":"key","x":"$$F=qvB\\sin\\theta,\\qquad r=\\frac{mv}{qB},\\qquad T=\\frac{2\\pi m}{qB}$$"},{"t":"ex","title":"Path of a proton","q":"A proton moves at $2.0\\times10^6\\ \\text{m s}^{-1}$ perpendicular to a $0.50\\ \\text{T}$ field. Find the radius of its circular path.","s":["$\\frac{mv^2}{r}=qvB\\Rightarrow r=\\frac{mv}{qB}=\\frac{(1.67\\times10^{-27})(2.0\\times10^6)}{(1.60\\times10^{-19})(0.50)}=4.2\\times10^{-2}\\ \\text{m}$."],"a":"$4.2\\ \\text{cm}$"},{"t":"int","name":"lorentz","cap":"Change the speed and the field strength and see the circular path of a proton."},{"t":"p","x":"**Velocity selector.** With electric and magnetic fields perpendicular to each other and to the velocity, a charge passes undeflected when $qE=qvB$, so $v=\\dfrac EB$."},{"t":"warn","x":"The magnetic force does **no work** on a moving charge. It cannot speed a particle up; only an electric field can."}]},{"id":"ph3-c06-s4","code":"6.4","title":"Motors and applications","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: electric motor physics","url":"https://www.youtube.com/results?search_query=Flipping+Physics+electric+motor+physics","kind":"search"}]},{"t":"p","x":"In a **DC motor** a current-carrying coil sits in a magnetic field. The forces on opposite sides of the coil are in opposite directions, producing a **torque**. A **split-ring commutator** reverses the current every half turn so the coil keeps turning in the same direction. Increasing the current, the field strength, the number of turns or the coil area increases the torque."},{"t":"p","x":"**Mass spectrometer.** Ions are accelerated through a known potential, then enter a magnetic field. They move in circles of radius $r=\\frac{mv}{qB}$, so heavier ions travel on larger circles and are separated by mass."}]},{"id":"ph3-c06-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Hand rules.** Name the rule you use and state the three directions (field, current or velocity, force). Draw a 3D sketch using the dot and cross notation for out of and into the page."},{"t":"p","x":"**Common errors.** Using electron flow for a right-hand rule; forgetting $\\sin\\theta$; using $B$ in gauss instead of tesla; thinking the magnetic force changes speed."}]}],"quiz":[{"topic":"Wire force","q":"A $0.20\\ \\text{m}$ wire carries $4.0\\ \\text{A}$ at $30^\\circ$ to a $0.50\\ \\text{T}$ field. Find the force (N).","a":"0.20","alt":["0.2"],"ad":"$0.20\\ \\text{N}$","sol":"$F=BIL\\sin\\theta=0.50(4.0)(0.20)(0.50)$.","h":["$F=BIL\\sin\\theta$.","$\\sin30^\\circ=0.50$.","Multiply."]},{"topic":"Moving charge","q":"An electron moves at $5.0\\times10^6\\ \\text{m s}^{-1}$ perpendicular to a $0.20\\ \\text{T}$ field. Find the force in units of $10^{-13}\\ \\text{N}$.","a":"1.6","alt":[],"ad":"$1.6\\times10^{-13}\\ \\text{N}$","sol":"$F=qvB=1.60\\times10^{-19}(5.0\\times10^6)(0.20)=1.6\\times10^{-13}$.","h":["$F=qvB$.","Use $q=1.60\\times10^{-19}$.","Multiply."]},{"topic":"Parallel","q":"What is the magnetic force on a charge moving parallel to a field (N)?","a":"0","alt":[],"ad":"$0$","sol":"$\\sin0^\\circ=0$.","h":["$F=qvB\\sin\\theta$.","$\\theta=0$.","$\\sin0=0$."]},{"topic":"Radius","q":"A proton moves at $1.0\\times10^6\\ \\text{m s}^{-1}$ perpendicular to a $0.10\\ \\text{T}$ field. Find the radius in cm (1 decimal place).","a":"10.5","alt":["10.4"],"ad":"$10.5\\ \\text{cm}$","sol":"$r=\\frac{mv}{qB}=\\frac{1.6726219\\times10^{-27}(10^6)}{1.6\\times10^{-19}(0.10)}=0.1045\\ \\text{m}\\approx10.5\\ \\text{cm}$. (Rounding $m_p$ to $1.67\\times10^{-27}$ gives $10.4$, which is also accepted.)","h":["$r=mv/(qB)$.","Use $m_p=1.6726219\\times10^{-27}$ kg from the data book.","Convert metres to cm."]},{"topic":"Speed doubling","q":"If the speed of a charge in a magnetic field doubles, by what factor does the radius change?","a":"2","alt":[],"ad":"$2$","sol":"$r\\propto v$.","h":["$r=mv/qB$.","Radius is proportional to $v$.","Factor 2."]},{"topic":"Velocity selector","q":"$E=1.0\\times10^4\\ \\text{V m}^{-1}$ and $B=0.050\\ \\text{T}$. Find the selected speed in units of $10^5\\ \\text{m s}^{-1}$.","a":"2.0","alt":["2"],"ad":"$2.0\\times10^5\\ \\text{m s}^{-1}$","sol":"$v=E/B=\\frac{1.0\\times10^4}{0.050}$.","h":["Forces balance: $qE=qvB$.","$v=E/B$.","Divide."]},{"topic":"Solenoid","q":"If the current in a solenoid is doubled, by what factor does its field change?","a":"2","alt":[],"ad":"$2$","sol":"$B\\propto I$.","h":["Field is proportional to current.","Double current.","Factor 2."]},{"topic":"Parallel wires","q":"Do two parallel wires carrying current in the same direction attract? Answer yes or no.","a":"yes","alt":["Yes"],"ad":"Yes","sol":"Same-direction currents attract.","h":["Same direction currents.","Fields add between them... they pull together.","Attract."]},{"topic":"Period","q":"Find the cyclotron period of a proton in a $1.0\\ \\text{T}$ field in nanoseconds (1 decimal place).","a":"65.7","alt":["65.6"],"ad":"$65.7\\ \\text{ns}$","sol":"$T=\\frac{2\\pi m}{qB}=\\frac{2\\pi(1.6726219\\times10^{-27})}{1.6\\times10^{-19}(1.0)}=6.57\\times10^{-8}\\ \\text{s}$. (Rounding $m_p$ gives $65.6$, also accepted.)","h":["$T=2\\pi m/qB$.","Speed cancels.","Convert to ns."]},{"topic":"Work","q":"How much work does a magnetic field do on a moving charge in one revolution (J)?","a":"0","alt":[],"ad":"$0$","sol":"Force is perpendicular to motion.","h":["$W=Fd\\cos\\theta$.","The angle is $90^\\circ$.","Zero."]}],"comets":[{"topic":"Extension: Isotopes","q":"Two ions with the same charge and speed enter the same magnetic field. One has mass $4\\ \\text{u}$ and the other $2\\ \\text{u}$. Find the ratio of the larger radius to the smaller.","a":"2","alt":[],"ad":"$2$","sol":"$r\\propto m$.","h":["$r=mv/qB$.","Same $q$, $v$, $B$.","Ratio of masses."]}],"hours":4.5},"ph3-c07":{"id":"ph3-c07","interactive":"none","summary":"A changing magnetic flux induces an emf. This chapter covers magnetic flux, Faraday's and Lenz's laws, the emf of a moving conductor, generators, and the meaning of RMS values.","videos":[{"src":"F","title":"Electromagnetic induction, Faraday and Lenz","url":"https://www.youtube.com/results?search_query=Flipping+Physics+Faraday+law+Lenz+law+electromagnetic+induction+physics","kind":"search"},{"src":"K","title":"Magnetic flux and induction","url":"https://www.youtube.com/results?search_query=Khan+Academy+magnetic+flux+Faraday+law+induction","kind":"search"},{"src":"V","title":"Veritasium: Induction and the magnet in a tube","url":"https://www.youtube.com/results?search_query=Veritasium+Lenz+law+magnet+falling+tube","kind":"search"}],"sections":[{"id":"ph3-c07-s1","code":"7.1","title":"Magnetic flux","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: magnetic flux","url":"https://www.youtube.com/results?search_query=Flipping+Physics+magnetic+flux","kind":"search"}]},{"t":"p","x":"**Magnetic flux** measures how much field passes through a surface: $\\Phi=BA\\cos\\theta$ in **webers (Wb)**, where $A$ is the area and $\\theta$ is the angle between the field and the **normal** (perpendicular) to the surface. Flux is largest when the field is perpendicular to the loop's plane and zero when the field runs parallel to the plane."},{"t":"key","x":"$$\\Phi=BA\\cos\\theta$$"},{"t":"ex","title":"Flux","q":"A $0.020\\ \\text{m}^2$ coil is perpendicular to a $0.50\\ \\text{T}$ field. Find the flux, and the flux after turning $60^\\circ$.","s":["$\\Phi=BA\\cos0^\\circ=0.50(0.020)=0.010\\ \\text{Wb}$.","At $60^\\circ$: $\\Phi=0.010\\cos60^\\circ=0.0050\\ \\text{Wb}$."],"a":"$0.010\\ \\text{Wb}$ and $0.0050\\ \\text{Wb}$."},{"t":"warn","x":"$\\theta$ is measured from the **normal**, not from the plane of the coil. If a question gives the angle to the plane, subtract it from $90^\\circ$."}]},{"id":"ph3-c07-s2","code":"7.2","title":"Faraday's and Lenz's laws","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: Faraday law Lenz law","url":"https://www.youtube.com/results?search_query=Flipping+Physics+Faraday+law+Lenz+law","kind":"search"}]},{"t":"p","x":"**Faraday's law:** the induced emf equals the rate of change of flux linkage: $\\varepsilon=-N\\dfrac{\\Delta\\Phi}{\\Delta t}$. **Lenz's law** (the minus sign): the induced current's own field **opposes the change** in flux that caused it. This is conservation of energy: if induced fields helped the change, energy would appear from nothing."},{"t":"key","x":"$$\\varepsilon=-N\\frac{\\Delta\\Phi}{\\Delta t}$$"},{"t":"ex","title":"Changing flux","q":"A $200$-turn coil has flux falling from $0.010\\ \\text{Wb}$ to zero in $0.050\\ \\text{s}$. Find the average emf.","s":["$|\\varepsilon|=N\\frac{\\Delta\\Phi}{\\Delta t}=200\\times\\frac{0.010}{0.050}=40\\ \\text{V}$."],"a":"$40\\ \\text{V}$"},{"t":"p","x":"**Using Lenz.** A north pole approaching a loop increases flux through it, so the loop develops a current whose field also points toward the approaching magnet (a north face) to repel it. A magnet pulled away is attracted. In both cases the induced current makes the motion **harder**."}]},{"id":"ph3-c07-s3","code":"7.3","title":"Moving conductors","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: moving conductor in a magnetic field emf","url":"https://www.youtube.com/results?search_query=Flipping+Physics+moving+conductor+in+a+magnetic+field+emf","kind":"search"}]},{"t":"p","x":"A conductor of length $L$ moving at speed $v$ perpendicular to a field $B$ has emf $\\varepsilon=BLv$. If connected to a circuit of resistance $R$ the current is $I=\\frac{\\varepsilon}{R}$, and the magnetic force on it is $BIL$, opposing the motion."},{"t":"ex","title":"Sliding rod","q":"A $0.50\\ \\text{m}$ rod moves at $4.0\\ \\text{m s}^{-1}$ perpendicular to a $0.30\\ \\text{T}$ field. Find the emf.","s":["$\\varepsilon=BLv=0.30(0.50)(4.0)=0.60\\ \\text{V}$."],"a":"$0.60\\ \\text{V}$"},{"t":"p","x":"**Eddy currents.** A conductor moving through a changing field has circulating currents induced in it. Lenz's law means they oppose the motion, which is used for braking and cause heating in transformer cores (reduced by laminating the core)."}]},{"id":"ph3-c07-s4","code":"7.4","title":"Generators and AC","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: AC generator physics","url":"https://www.youtube.com/results?search_query=Flipping+Physics+AC+generator+physics","kind":"search"}]},{"t":"p","x":"In an **AC generator** a coil rotates in a magnetic field and the flux changes sinusoidally. The emf is **greatest when the coil's plane is parallel to the field** (the flux is zero but changing fastest) and **zero when the plane is perpendicular to the field** (maximum flux, zero rate of change). A split-ring commutator would give DC; slip rings give AC."},{"t":"p","x":"**RMS values.** For a sinusoidal supply $V_{\\text{rms}}=\\dfrac{V_{\\text{peak}}}{\\sqrt2}$ and $I_{\\text{rms}}=\\dfrac{I_{\\text{peak}}}{\\sqrt2}$. The RMS value is the equivalent steady value that would deliver the same power: $P=V_{\\text{rms}}I_{\\text{rms}}=\\dfrac{V_{\\text{rms}}^2}{R}$."},{"t":"ex","title":"RMS","q":"The mains supply has $V_{\\text{rms}}=240\\ \\text{V}$. Find the peak voltage.","s":["$V_{\\text{peak}}=\\sqrt2\\times240=339\\ \\text{V}$."],"a":"$339\\ \\text{V}$"},{"t":"warn","x":"Household \"240 V\" is an RMS value, so the voltage actually swings between about $-339\\ \\text{V}$ and $+339\\ \\text{V}$."}]},{"id":"ph3-c07-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Explaining induction.** A complete answer has three parts: (1) the flux through the circuit is changing, (2) so an emf is induced (Faraday), (3) and the direction is such as to oppose the change (Lenz). Use the word **flux** and the word **change**."},{"t":"p","x":"**Graph questions.** Flux against time is a cosine for a rotating coil; the emf is the gradient of the flux graph (negative), which gives a sine curve."}]}],"quiz":[{"topic":"Flux","q":"$B=0.20\\ \\text{T}$ is perpendicular to an area of $0.050\\ \\text{m}^2$. Find the flux (Wb).","a":"0.010","alt":["0.01"],"ad":"$0.010\\ \\text{Wb}$","sol":"$\\Phi=BA=0.20(0.050)$.","h":["$\\Phi=BA\\cos\\theta$.","$\\theta=0^\\circ$.","Multiply."]},{"topic":"Zero flux","q":"What is the flux when the field is parallel to the plane of a loop (Wb)?","a":"0","alt":[],"ad":"$0$","sol":"The normal is perpendicular to the field, so $\\cos90^\\circ=0$.","h":["Angle to the normal.","$\\theta=90^\\circ$.","$\\cos90^\\circ=0$."]},{"topic":"Faraday","q":"A $50$-turn coil has $\\Delta\\Phi=0.040\\ \\text{Wb}$ in $0.20\\ \\text{s}$. Find the average emf (V).","a":"10","alt":["10.0"],"ad":"$10\\ \\text{V}$","sol":"$\\varepsilon=N\\Delta\\Phi/\\Delta t=50\\times0.20$.","h":["$\\varepsilon=N\\Delta\\Phi/\\Delta t$.","$\\Delta\\Phi/\\Delta t=0.20$.","Multiply by 50."]},{"topic":"Rod","q":"$B=0.50\\ \\text{T}$, $L=0.40\\ \\text{m}$, $v=3.0\\ \\text{m s}^{-1}$. Find the emf (V).","a":"0.60","alt":["0.6"],"ad":"$0.60\\ \\text{V}$","sol":"$\\varepsilon=BLv$.","h":["$\\varepsilon=BLv$.","Multiply the three.","Compute."]},{"topic":"RMS","q":"A supply has peak voltage $170\\ \\text{V}$. Find $V_{\\text{rms}}$ (V, nearest whole number).","a":"120","alt":["120.2","120.21"],"ad":"$120\\ \\text{V}$","sol":"$170/\\sqrt2=120$.","h":["$V_{\\text{rms}}=V_{\\text{peak}}/\\sqrt2$.","$\\sqrt2=1.414$.","Divide."]},{"topic":"Lenz","q":"A north pole moves toward a coil. Does the induced current produce a field opposing the magnet's approach? Answer yes or no.","a":"yes","alt":["Yes"],"ad":"Yes","sol":"Lenz's law: induced effects oppose the change.","h":["Lenz's law.","Opposes the change.","Yes."]},{"topic":"Frequency","q":"A generator coil makes $50$ rotations each second. What is the frequency of the AC output (Hz)?","a":"50","alt":[],"ad":"$50\\ \\text{Hz}$","sol":"One cycle per rotation.","h":["One rotation, one cycle.","Same count per second.","50."]},{"topic":"Maximum emf","q":"At the instant a generator's emf is a maximum, is the flux through the coil zero? Answer yes or no.","a":"yes","alt":["Yes"],"ad":"Yes","sol":"The emf is greatest when the flux is changing fastest, which is when the flux is zero.","h":["The emf is the gradient of the flux graph.","Gradient is steepest at zero flux.","Yes."]},{"topic":"Power","q":"A $60\\ \\Omega$ heater runs on $240\\ \\text{V}_{\\text{rms}}$. Find its power (W).","a":"960","alt":[],"ad":"$960\\ \\text{W}$","sol":"$P=V^2/R=\\frac{240^2}{60}$.","h":["$P=V^2/R$.","$240^2=57600$.","Divide by 60."]},{"topic":"Speed","q":"If a generator's coil turns twice as fast, by what factor does the peak emf change?","a":"2","alt":[],"ad":"$2$","sol":"Flux changes twice as fast.","h":["Rate of change of flux doubles.","Emf is proportional to that rate.","Factor 2."]}],"comets":[{"topic":"Extension: Rod on rails","q":"A $0.20\\ \\text{m}$ rod slides at $2.0\\ \\text{m s}^{-1}$ on rails in a $0.50\\ \\text{T}$ field. The circuit resistance is $0.10\\ \\Omega$. Find the current (A).","a":"2.0","alt":["2"],"ad":"$2.0\\ \\text{A}$","sol":"$\\varepsilon=BLv=0.20\\ \\text{V}$; $I=\\varepsilon/R=2.0$.","h":["Find the emf first.","$\\varepsilon=0.50(0.20)(2.0)$.","$I=\\varepsilon/R$."]},{"topic":"Extension: Force on the rod","q":"For the same rod and circuit, find the force needed to keep it moving at constant speed (N).","a":"0.20","alt":["0.2"],"ad":"$0.20\\ \\text{N}$","sol":"$F=BIL=0.50(2.0)(0.20)=0.20$.","h":["Constant speed: applied force balances magnetic force.","$F=BIL$.","Use $I=2.0\\ \\text{A}$."]}],"hours":4},"ph3-c08":{"id":"ph3-c08","interactive":"transformer","summary":"Transformers change AC voltages and make long-distance power transmission efficient. This chapter covers the ideal transformer equations, energy losses, transmission-line power loss, and why electricity is transmitted at high voltage.","videos":[{"src":"F","title":"Transformers and power transmission","url":"https://www.youtube.com/results?search_query=Flipping+Physics+transformers+step+up+step+down+power+transmission+physics","kind":"search"},{"src":"K","title":"Transformers","url":"https://www.youtube.com/results?search_query=Khan+Academy+transformer+physics+ideal+transformer","kind":"search"},{"src":"V","title":"Veritasium: The grid","url":"https://www.youtube.com/results?search_query=Veritasium+AC+DC+power+grid","kind":"search"}],"sections":[{"id":"ph3-c08-s1","code":"8.1","title":"The ideal transformer","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: ideal transformer","url":"https://www.youtube.com/results?search_query=Flipping+Physics+ideal+transformer","kind":"search"}]},{"t":"p","x":"A transformer has a **primary** and **secondary** coil wound on a soft-iron core. An alternating current in the primary produces a changing flux in the core, which induces an emf in the secondary. **It works only with AC**, because a DC current produces a steady flux and no induction."},{"t":"key","x":"$$\\frac{V_s}{V_p}=\\frac{N_s}{N_p},\\qquad V_pI_p=V_sI_s\\ (\\text{ideal})$$"},{"t":"ex","title":"Step-down","q":"A transformer has $500$ primary and $100$ secondary turns with a $240\\ \\text{V}$ input. Find the output voltage.","s":["$V_s=V_p\\frac{N_s}{N_p}=240\\times\\frac{100}{500}=48\\ \\text{V}$."],"a":"$48\\ \\text{V}$"},{"t":"p","x":"$N_s>N_p$ is a **step-up** transformer (raises voltage, lowers current). $N_s\u003cN_p$ is **step-down**. The power is not increased: voltage up means current down."},{"t":"ex","title":"Currents","q":"An ideal transformer delivers $12\\ \\text{W}$ at $48\\ \\text{V}$ from a $240\\ \\text{V}$ primary. Find the secondary and primary currents.","s":["$I_s=\\frac PV=\\frac{12}{48}=0.25\\ \\text{A}$.","$I_p=\\frac{12}{240}=0.050\\ \\text{A}$."],"a":"$0.25\\ \\text{A}$ and $0.050\\ \\text{A}$."},{"t":"int","name":"transformer","cap":"Change the turns and the load. Check that the ideal power in equals the power out."}]},{"id":"ph3-c08-s2","code":"8.2","title":"Real transformers and energy losses","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: transformer energy losses","url":"https://www.youtube.com/results?search_query=Flipping+Physics+transformer+energy+losses","kind":"search"}]},{"t":"p","x":"Real transformers are not perfectly efficient. **Efficiency** $=\\dfrac{P_{\\text{out}}}{P_{\\text{in}}}\\times100\\%$. Losses include **resistive heating** in the windings, **eddy currents** in the core (reduced by using a **laminated** core), **hysteresis** (reversing magnetisation of the core, reduced by soft iron) and **flux leakage** (reduced by winding the coils on a shared core)."},{"t":"ex","title":"Efficiency","q":"A transformer takes $300\\ \\text{W}$ and delivers $285\\ \\text{W}$. Find its efficiency.","s":["$\\frac{285}{300}\\times100=95\\%$."],"a":"$95\\%$"}]},{"id":"ph3-c08-s3","code":"8.3","title":"Power transmission","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: power transmission transformers","url":"https://www.youtube.com/results?search_query=Flipping+Physics+power+transmission+transformers","kind":"search"}]},{"t":"p","x":"The power lost in a cable is $P_{\\text{loss}}=I^2R$. For a given transmitted power $P=VI$, a **higher voltage means a lower current**, and the loss falls with the **square** of the current. That is why electricity is **stepped up** at the power station for transmission and **stepped down** near the user."},{"t":"ex","title":"Transmission loss","q":"A power station sends $100\\ \\text{kW}$ through cables with resistance $5.0\\ \\Omega$. Compare the power lost at $10\\ \\text{kV}$ and at $1.0\\ \\text{kV}$.","s":["At $10\\ \\text{kV}$: $I=\\frac{100\\times10^3}{10\\times10^3}=10\\ \\text{A}$; $P_{\\text{loss}}=10^2(5.0)=500\\ \\text{W}$ (0.5%).","At $1.0\\ \\text{kV}$: $I=100\\ \\text{A}$; $P_{\\text{loss}}=100^2(5.0)=50\\ \\text{kW}$ (50%)."],"a":"$500\\ \\text{W}$ at $10\\ \\text{kV}$ versus $50\\ \\text{kW}$ at $1.0\\ \\text{kV}$."},{"t":"warn","x":"The voltage in $P_{\\text{loss}}=V^2/R$ is the voltage **across the cable**, not the transmission voltage. Use $I^2R$ for line loss."}]},{"id":"ph3-c08-s4","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Explain, do not just calculate.** A typical question: \"Explain why power is transmitted at high voltage.\" Answer: for a fixed power, higher voltage means lower current ($I=P/V$), and heat loss in the cables is $I^2R$, so far less energy is wasted."},{"t":"p","x":"**Reasons a transformer is not 100% efficient** should name the cause and the fix: eddy currents (laminated core), resistive heating (thick copper wire), hysteresis (soft iron core) and leakage (shared core)."}]}],"quiz":[{"topic":"Output voltage","q":"A transformer has $N_p/N_s=10$ and $V_p=240\\ \\text{V}$. Find $V_s$ (V).","a":"24","alt":["24.0"],"ad":"$24\\ \\text{V}$","sol":"$V_s=240/10$.","h":["$V_s/V_p=N_s/N_p$.","$N_s/N_p=0.10$.","Multiply."]},{"topic":"Turns","q":"Find $N_s$ to step $240\\ \\text{V}$ down to $12\\ \\text{V}$ with $N_p=1000$.","a":"50","alt":[],"ad":"$50$","sol":"$N_s=1000\\times\\frac{12}{240}$.","h":["$N_s/N_p=V_s/V_p$.","$12/240=0.05$.","Multiply."]},{"topic":"Current","q":"An ideal transformer has $V_p=240\\ \\text{V}$, $I_p=0.50\\ \\text{A}$ and $V_s=12\\ \\text{V}$. Find $I_s$ (A).","a":"10","alt":["10.0"],"ad":"$10\\ \\text{A}$","sol":"$V_pI_p=V_sI_s\\Rightarrow I_s=\\frac{120}{12}$.","h":["Ideal means power in equals power out.","$V_pI_p=120\\ \\text{W}$.","Divide by $V_s$."]},{"topic":"Line loss","q":"A cable of resistance $2.0\\ \\Omega$ carries $20\\ \\text{A}$. Find the power lost (W).","a":"800","alt":[],"ad":"$800\\ \\text{W}$","sol":"$P=I^2R=400(2.0)$.","h":["$P=I^2R$.","$20^2=400$.","Multiply by 2.0."]},{"topic":"Line current","q":"$50\\ \\text{kW}$ is sent at $5000\\ \\text{V}$. Find the current (A).","a":"10","alt":[],"ad":"$10\\ \\text{A}$","sol":"$I=P/V=\\frac{50000}{5000}$.","h":["$P=VI$.","$I=P/V$.","Divide."]},{"topic":"Higher voltage","q":"If the transmission voltage rises by a factor of 10 for the same power, by what factor does the line loss fall?","a":"100","alt":[],"ad":"$100$","sol":"Current falls by 10, loss $\\propto I^2$.","h":["$I\\propto1/V$.","Loss $\\propto I^2$.","$10^2$."]},{"topic":"Efficiency","q":"A transformer takes $300\\ \\text{W}$ in and gives $285\\ \\text{W}$ out. Find the efficiency (%).","a":"95","alt":[],"ad":"$95\\%$","sol":"$285/300\\times100$.","h":["Output over input.","$285/300=0.95$.","Convert to %."]},{"topic":"DC","q":"Can a transformer step up a steady DC voltage? Answer yes or no.","a":"no","alt":["No"],"ad":"No","sol":"DC gives a constant flux, so no emf is induced.","h":["Induction needs a changing flux.","DC flux does not change.","No."]},{"topic":"Step-up","q":"A transformer has more secondary turns than primary turns. Is it a step-up transformer? Answer yes or no.","a":"yes","alt":["Yes"],"ad":"Yes","sol":"$V_s>V_p$ when $N_s>N_p$.","h":["$V_s/V_p=N_s/N_p$.","$N_s>N_p$ means $V_s>V_p$.","Step-up."]},{"topic":"Ratio","q":"$V_p=11000\\ \\text{V}$ and $V_s=240\\ \\text{V}$. Find $N_p/N_s$ (1 decimal place).","a":"45.8","alt":[],"ad":"$45.8$","sol":"$\\frac{N_p}{N_s}=\\frac{11000}{240}=45.8$.","h":["$N_p/N_s=V_p/V_s$.","$11000/240$.","Compute."]}],"comets":[{"topic":"Extension: Line loss percentage","q":"$2.0\\ \\text{MW}$ is sent at $20\\ \\text{kV}$ through lines with resistance $10\\ \\Omega$. What percentage of the power is lost?","a":"5","alt":["5.0"],"ad":"$5\\%$","sol":"$I=\\frac{2.0\\times10^6}{20\\times10^3}=100\\ \\text{A}$; $P_{\\text{loss}}=100^2(10)=100\\ \\text{kW}$, which is $5\\%$ of $2.0\\ \\text{MW}$.","h":["Find the current.","$P_{\\text{loss}}=I^2R$.","Divide by the total power."]},{"topic":"Extension: Cutting the loss","q":"To reduce the line loss in the previous question to $1.25\\%$, by what factor must the transmission voltage increase?","a":"2","alt":[],"ad":"$2$","sol":"Loss $\\propto1/V^2$; a quarter of the loss needs $V$ doubled.","h":["$P_{\\text{loss}}\\propto I^2\\propto1/V^2$.","The loss must fall by a factor of 4.","Square root of 4."]}],"hours":3.5}}</script>
<script id="app-script">
(function(){
'use strict';
var SHELL=document.getElementById('shell').outerHTML;
var S=JSON.parse(document.getElementById('state').textContent);
S.log=S.log||[];S.mistakes=S.mistakes||[];S.progress=S.progress||{};S.lessons=S.lessons||{};S.practice=S.practice||{};S.bank=S.bank||{};S.time=S.time||{};S.comets=S.comets||{};S.exams=S.exams||{};S.xp=S.xp||0;
const DIRTY=new Set();

var MJCFG='{tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]],processEscapes:true},svg:{fontCache:"global"},options:{enableMenu:false},startup:{typeset:false}}';
var HEAD='<scr'+'ipt>window.MathJax='+MJCFG+';</scr'+'ipt><scr'+'ipt async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></scr'+'ipt><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Galaxy</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap">';

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=864e5, REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches||((S.set||{}).motion==='minimal');
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL={new:cssv('--new'),learning:cssv('--learn'),revise:cssv('--revise'),solid:cssv('--solid'),due:cssv('--solid'),risk:cssv('--risk'),gold:cssv('--gold'),ink:cssv('--ink'),mute:cssv('--mute')};
const LABEL={new:'Not started',learning:'Learning',revise:'Needs revision',solid:'Solid',due:'Due for review'};
const fmtDate=t=>new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'});

/* ---------- data helpers ---------- */
const subj=id=>S.subjects.find(s=>s.id===id);
const VS=()=>S.subjects.filter(s=>!s.hidden);

function findCh(id){for(const s of S.subjects)for(const u of UNITS){const l=chaptersOf(s,u),i=l.findIndex(c=>c.id===id);if(i>=0)return{s,u,ch:l[i],i,list:l};}return null;}
function effStatus(id){const p=S.progress[id];if(!p)return'new';if(p.status==='solid'&&p.due&&Date.now()>=p.due)return'due';return p.status||'new';}
const solidCount=l=>l.filter(c=>effStatus(c.id)==='solid').length;
const nextOf=l=>l.find(c=>effStatus(c.id)!=='solid');

function subjectTotals(s){let t=0,d=0;for(const u of UNITS){const l=chaptersOf(s,u);t+=l.length;d+=solidCount(l);}return{t,d};}

/* ---------- view state ---------- */
const V={view:'galaxy',subj:null,unit:'3',sel:null,add:false,insights:false,exam:false,hover:null};
let sess=null, SAMPLE, tr=null, unitT0=-9999, hits=[], shiftX=0;

/* ---------- canvas ---------- */
const cv=$('#sky'), ctx=cv.getContext('2d');
let W=0,H=0;
let QUAL=1;try{QUAL=Math.min(1,Math.max(.5,+localStorage.getItem('sg_q')||((window.devicePixelRatio||1)>1.5?.75:1)));}catch(e){}
function qd(){return Math.max(.75,Math.min(window.devicePixelRatio||1,2)*QUAL);}
const QM={s:0,n:0,bad:0,l:0};

  const dt=now-QM.l;QM.l=now;
  if(now<5000||document.hidden||dt<=0||dt>250)return;
  QM.s+=dt;QM.n++;
  if(QM.n<90)return;
  const avg=QM.s/QM.n;QM.s=0;QM.n=0;
  if(avg>30&&QUAL>.5){if(++QM.bad>=2){QM.bad=0;QUAL=Math.max(.5,QUAL-.25);try{localStorage.setItem('sg_q',String(QUAL));}catch(e){}resize();}}else QM.bad=0;
}
function resize(){const d=qd();W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);}
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const stars=Array.from({length:430},()=>({x:rnd(),y:rnd(),r:rnd()*1.3+.2,p:rnd()*6.28,s:rnd()*.0015+.0004,d:rnd()*.7+.3}));
function hex(c){const n=parseInt(c.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function mix(c,t){const[r,g,b]=hex(c),k=t>0?255:0,a=Math.abs(t);return'rgb('+Math.round(r+(k-r)*a)+','+Math.round(g+(k-g)*a)+','+Math.round(b+(k-b)*a)+')';}

/* ---------- star-to-star journey + name reveal ---------- */
let JR=null,REV=null;
const easeIO=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
function startJourney(prevId,id){
  const s=subj(V.subj);if(!s)return;const list=chaptersOf(s,V.unit),ti=list.findIndex(c=>c.id===id);if(ti<0)return;
  if(REDUCE){JR=null;REV={id:id,t0:performance.now()-9000};return;}
  let fi=prevId?list.findIndex(c=>c.id===prevId):-1;
  if(fi<0)fi=0;
  if(fi===ti)fi=ti>0?ti-1:(list.length>1?1:ti);
  const m=Math.abs(ti-fi);if(m>(S.cnt.journeyMax||0))S.cnt.journeyMax=m;
  JR={id:id,fi:fi,ti:ti,t0:performance.now(),dur:m?clamp(1000+m*520,1300,4200):500,passed:{}};REV=null;

function pathPt(J,pts,u){const sg=J.ti>=J.fi?1:-1,j=Math.min(Math.floor(u),Math.abs(J.ti-J.fi)-1),f=u-j,a=pts[J.fi+sg*j],b=pts[J.fi+sg*(j+1)];if(!b)return pts[J.ti];return partial(a,b,clamp(f,0,1));}

  if(!JR)return null;
  if(JR.id!==V.sel||!pts[JR.ti]||list[JR.ti].id!==JR.id){JR=null;return null;}
  if(ku<1){JR.t0=performance.now();}
  const now=performance.now(),k=clamp((now-JR.t0)/JR.dur,0,1),m=Math.abs(JR.ti-JR.fi),u=easeIO(k)*m,sg=JR.ti>=JR.fi?1:-1;
  for(let q=0;q<=m;q++){const idx=JR.fi+sg*q;if(u>=q-.02&&!JR.passed[idx])JR.passed[idx]=now;}
  if(k>=1){REV={id:JR.id,t0:now};const P=JR.passed;JR=null;JRP={passed:P};return null;}

}
let JRP=null;

/* slow drifting mist and a breathing dark edge */
const MIST=Array.from({length:7},(_,i)=>({x:rnd(),y:rnd(),r:.35+rnd()*.4,s:.4+rnd()*.8,p:rnd()*6.28}));
/* Tint, mist and vignette are soft, nearly invisible and drift very slowly. Painting them
   full-screen every frame was the main cause of lag, so they are painted small a few times
   a second and stretched up in a single cheap copy. */
const LAYS={k:'',t:-1e9,a:null};
function layersPaint(t){
  const sc=.25,w=Math.max(8,Math.round(W*sc)),h=Math.max(8,Math.round(H*sc)),k=w+'x'+h;
  if(LAYS.k!==k){LAYS.k=k;LAYS.t=-1e9;{const c=document.createElement('canvas');c.width=w;c.height=h;LAYS.a=c;}}
  if(t>=LAYS.t&&t-LAYS.t<130)return;
  LAYS.t=t;
  const A=LAYS.a.getContext('2d');A.setTransform(sc,0,0,sc,0,0);A.clearRect(0,0,W,H);
  const sj=V.view==='subject'?subj(V.subj):null;
  const tint=[[.18,.22,.55,'#2a2c36',.04],[.86,.78,.6,'#24262e',.035]];
  if(sj)tint.push([.5,.5,.55,sj.hue,.03]);
  tint.forEach((b,i)=>{const x=W*b[0]+Math.sin(t*.00004+i*1.3)*40-PX*30,y=H*b[1]+Math.cos(t*.00003+i*2.1)*30-PY*20,r=Math.max(W,H)*b[2];
    const g=A.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,b[3]+hexA(b[4]));g.addColorStop(1,b[3]+'00');A.fillStyle=g;A.fillRect(0,0,W,H);});
  const B=A;
  const tt=REDUCE?0:t;
  MIST.forEach(m=>{const x=(((m.x+tt*.0000045*m.s)%1.4)-.2)*W,y=(m.y+.06*Math.sin(tt*.00007*m.s+m.p))*H,r=Math.max(W,H)*m.r;
    const g=B.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(120,125,145,.028)');g.addColorStop(.6,'rgba(90,95,115,.012)');g.addColorStop(1,'rgba(90,95,115,0)');B.fillStyle=g;B.fillRect(0,0,W,H);});
  const bb=REDUCE?.5:.5+.5*Math.sin(tt*.00045),g=B.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.78);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+(.45+.2*bb).toFixed(3)+')');B.fillStyle=g;B.fillRect(0,0,W,H);
