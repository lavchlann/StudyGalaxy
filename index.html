:root{

  --hair:rgba(255,255,255,.07); --hair2:rgba(255,255,255,.12); --line:rgba(255,255,255,.09);

#units button,#insightsBtn,#streak,.pillbtn{border:1px solid transparent;background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;color:var(--ink2);transition:background .25s,color .25s,border-color .25s,box-shadow .25s}
#units button small{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:7px}
#units button[aria-selected="true"]{background:rgba(217,184,120,.14);border-color:rgba(217,184,120,.35);color:var(--goldhi);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
#units button[aria-selected="true"] small{color:var(--gold)}
#insightsBtn,#streak,.pillbtn{background:var(--glass);border-color:var(--hair);backdrop-filter:blur(16px) saturate(140%)}
#insightsBtn:hover,#streak:hover,.pillbtn:hover,#units button:hover{border-color:var(--hair2);color:var(--ink)}
#insightsBtn[aria-pressed="true"]{background:rgba(217,184,120,.14);border-color:rgba(217,184,120,.35);color:var(--goldhi)}
#streak b,#lvl b{color:var(--goldhi);font-family:var(--mono);font-weight:500}
#legBtn{width:34px;height:34px;font-family:var(--display);font-size:18px;font-weight:400}

/* ---------- glass surfaces ---------- */
#panel,#chlist,#legend,.tdc,#toast{background:var(--glass);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);
  border:1px solid var(--hair);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 30px 80px -20px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.25)}
#panel{top:84px;right:18px;bottom:70px;border-radius:24px;padding:26px 28px 34px;width:min(540px,calc(100% - 36px));
  background:linear-gradient(180deg,rgba(14,19,34,.86),rgba(8,11,21,.9));transition:transform .7s var(--ease),opacity .45s var(--ease)}
#panel::before{content:'';position:sticky;display:block;top:-26px;height:0;margin:0}
#panel.wide{background:linear-gradient(180deg,rgba(10,14,26,.94),rgba(6,9,17,.96))}
#panel.fresh>*{animation:rise .6s var(--ease) both}
#panel.fresh>*:nth-child(2){animation-delay:.04s}#panel.fresh>*:nth-child(3){animation-delay:.08s}#panel.fresh>*:nth-child(4){animation-delay:.12s}#panel.fresh>*:nth-child(5){animation-delay:.16s}#panel.fresh>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.x{width:34px;height:34px;border-color:var(--hair);background:var(--glass2);color:var(--ink2);transition:all .2s;display:grid;place-items:center}
.x:hover{border-color:var(--hair2);color:#fff;background:rgba(255,255,255,.07)}

/* ---------- type ---------- */
.eyebrow{font:500 10.5px/1.4 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
#panel h2{font:400 34px/1.04 var(--display);letter-spacing:-.015em;margin:10px 0 16px;color:#fff}
#panel.wide h2{font-size:48px}
.sech{font:400 32px/1.1 var(--display);letter-spacing:-.012em;margin:22px 0 10px;color:#fff}
#panel.wide .sech{font-size:42px}
.lesson{font-size:16px;line-height:1.72;color:var(--ink2)}
.lesson b,.lesson strong{color:#fff;font-weight:600}
#panel.wide .lesson{font-size:18px;line-height:1.75}
.lesson h4,.lesson h4.eyebrow{font:500 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:2em 0 .8em}
.sub,.muted{color:var(--mute)}
.big{font:400 64px/1 var(--display);letter-spacing:-.02em;color:#fff}

/* ---------- pills / status ---------- */
.pill{padding:4px 12px 4px 10px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;border-color:color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent)}
.pill i{box-shadow:0 0 10px var(--c)}

/* ---------- stats ---------- */
.stats{gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:18px;overflow:hidden;margin:20px 0}
.stats div{background:rgba(9,13,24,.92);border-radius:0;padding:16px 18px 14px}
.stats b{font:400 36px/1 var(--display);letter-spacing:-.01em;color:#fff;margin-bottom:8px}
.stats span{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}

/* ---------- buttons ---------- */
.btn{position:relative;border-radius:999px;padding:11px 22px;font-weight:600;font-size:14px;letter-spacing:-.005em;border:1px solid rgba(255,235,190,.35);
  background:linear-gradient(180deg,#efd9a6 0%,#d9b878 55%,#c4a15f 100%);color:#1a1206;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.15),0 10px 30px -10px rgba(217,184,120,.55);transition:transform .2s var(--ease),box-shadow .25s,filter .2s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 14px 36px -10px rgba(217,184,120,.7)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:var(--glass2);color:var(--ink);border-color:var(--hair2);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.btn.ghost:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2);filter:none}
.btn.link{box-shadow:none;background:none;border:0;color:var(--mute)}
.btn.link:hover{color:var(--ink);transform:none}
.btn.sm{padding:5px 12px;font-size:12px;border-radius:999px;font-weight:500}
.btn[disabled]{transform:none;filter:grayscale(.4)}
.row{gap:10px;margin:16px 0}

/* ---------- tabs: segmented control ---------- */
.tabs{display:inline-flex;gap:2px;padding:4px;margin:18px 0 14px;background:rgba(255,255,255,.035);border:1px solid var(--hair);border-radius:999px;flex-wrap:nowrap}
.tabs button{border:0;border-radius:999px;padding:7px 16px;font-size:13px;color:var(--mute);transition:all .25s var(--ease)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:rgba(255,255,255,.09);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 10px rgba(0,0,0,.35);border:0}
.prog{height:3px;background:rgba(255,255,255,.06);margin:10px 0 6px}
.prog i{background:linear-gradient(90deg,var(--solid),#b7e0cb);box-shadow:0 0 12px rgba(134,191,166,.6)}

/* ---------- section nav (sticky) ---------- */
.secnav{top:-26px;padding:12px 0 12px;margin:10px 0 4px;gap:4px;background:rgba(11,15,28,.96);
  box-shadow:0 0 0 100vmax rgba(11,15,28,.97);clip-path:inset(0 -100vmax -14px);border-bottom:0}
.secnav::after{content:'';position:absolute;left:-60px;right:-60px;top:100%;height:14px;background:linear-gradient(rgba(11,15,28,.97),rgba(11,15,28,0));pointer-events:none}
#panel.wide .secnav{background:rgba(8,11,21,.97);box-shadow:0 0 0 100vmax rgba(8,11,21,.97)}#panel.wide .secnav::after{background:linear-gradient(rgba(8,11,21,.97),rgba(8,11,21,0))}
.sc{border:1px solid transparent;background:transparent;border-radius:999px;padding:5px 11px;font:500 12px var(--mono);color:var(--mute);transition:all .2s}
.sc:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.sc.cur{background:rgba(217,184,120,.14);border-color:rgba(217,184,120,.35);color:var(--goldhi)}
.sc.ok{color:var(--solid)}.sc.ok::after{content:' ✓'}
.sc em{font-family:var(--body)}

/* ---------- lesson blocks ---------- */
.sumbox{background:transparent;border:0;border-left:2px solid var(--gold);border-radius:0;padding:4px 0 4px 18px;margin:16px 0 8px;font:400 21px/1.42 var(--display);color:#e9e3d4;letter-spacing:-.003em}
#panel.wide .sumbox{font-size:26px}
.key{position:relative;background:radial-gradient(120% 140% at 50% 0%,rgba(217,184,120,.10),rgba(217,184,120,.02) 70%);border:1px solid rgba(217,184,120,.24);border-radius:16px;padding:18px 20px;margin:18px 0;color:#f3ead7;box-shadow:inset 0 1px 0 rgba(255,235,190,.06)}
.key::before{content:'Key idea';display:block;margin:0 0 6px;font:500 9.5px/1.4 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);opacity:.85}
.warn{position:relative;background:rgba(201,133,133,.06);border:1px solid rgba(201,133,133,.18);border-left:0;border-radius:14px;padding:14px 18px 14px 50px;margin:16px 0;font-size:14.5px;color:#e8d6d6}
.warn::before{content:'!';position:absolute;left:16px;top:14px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--mono);color:#1a0c0c;background:var(--risk);box-shadow:0 0 14px rgba(201,133,133,.45)}
.warn b{color:#ffdede}
.ex{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid var(--hair);border-radius:18px;padding:18px 20px 16px;margin:20px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.exh{font:500 10.5px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.exq{color:#fff;font-size:1.02em;margin:4px 0 12px}
.steps{list-style:none;margin:0;padding:0;counter-reset:st}
.steps li{position:relative;counter-increment:st;padding:2px 0 10px 38px;margin:0}
.steps li::before{content:counter(st);position:absolute;left:0;top:3px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:500 11px var(--mono);color:var(--gold);border:1px solid rgba(217,184,120,.35);background:rgba(217,184,120,.06)}
.steps li:not(:last-child)::after{content:'';position:absolute;left:11.5px;top:29px;bottom:0;width:1px;background:linear-gradient(rgba(217,184,120,.3),rgba(217,184,120,.05))}
.exa{border-top:1px solid var(--hair);margin-top:6px;padding-top:12px;color:#fff}
.exa b:first-child{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--solid);margin-right:6px}
.tb{background:rgba(134,191,166,.05);border:1px solid rgba(134,191,166,.18);border-radius:16px;padding:14px 18px}
.tbl span{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em}
.tbrow{background:transparent;border-bottom:1px solid var(--hair);border-radius:0;padding:10px 4px;margin:0;font-size:13.5px}
.tbrow b{font-family:var(--mono);font-weight:500;color:var(--goldhi)}
.tbrow span{font-family:var(--mono);font-size:12.5px}

/* videos */
.vid{gap:14px;background:rgba(255,255,255,.025);border:1px solid var(--hair);border-radius:16px;padding:12px 14px;margin:8px 0;transition:transform .25s var(--ease),border-color .25s,background .25s}
.vid:hover{transform:translateY(-1px);border-color:rgba(217,184,120,.4);background:rgba(217,184,120,.05)}
.vid b{font-weight:500;color:#fff;font-size:14px;line-height:1.35}
.vi{font-size:16px;width:38px;height:38px;background:linear-gradient(180deg,#efd9a6,#c4a15f);color:#1a1206;font-size:13px;box-shadow:0 6px 18px -6px rgba(217,184,120,.6)}
.bd{font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-color:var(--hair2)}

/* widgets */
.wg{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));border:1px solid var(--hair);border-radius:20px;padding:16px 16px 14px;margin:20px 0}
.wgt{font:400 22px/1.2 var(--display);color:#fff;margin-bottom:4px}
.wg>svg{background:radial-gradient(120% 100% at 50% 0%,#0b1226,#05080f);border:1px solid var(--hair);border-radius:14px}
.ctl{gap:10px;margin:14px 0 8px}
.ctl label{grid-template-columns:150px 1fr;font:500 11px var(--mono);letter-spacing:.04em;color:var(--mute)}
input[type=range]{-webkit-appearance:none;appearance:none;height:22px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:9px;background:linear-gradient(90deg,var(--gold),rgba(217,184,120,.2))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;margin-top:-6.5px;background:#fff7e6;border:0;box-shadow:0 0 0 4px rgba(217,184,120,.22),0 2px 8px rgba(0,0,0,.5);transition:box-shadow .2s}
input[type=range]:hover::-webkit-slider-thumb{box-shadow:0 0 0 7px rgba(217,184,120,.25),0 2px 8px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:3px;border-radius:9px;background:rgba(217,184,120,.35)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff7e6;border:0;box-shadow:0 0 0 4px rgba(217,184,120,.22)}
.wgr{font-size:13.5px;line-height:1.6;color:var(--ink2);padding:12px 14px;margin-top:10px;background:rgba(0,0,0,.25);border-radius:12px;border:1px solid var(--hair)}

/* questions */
.qhead{font:500 10.5px var(--mono);letter-spacing:.14em}
.tag{border-color:var(--hair2);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:2px 10px}
.qtext{background:transparent;border:0;padding:6px 0;font:400 23px/1.4 var(--display);color:#fff;white-space:pre-wrap}
textarea,input[type=text]{background:rgba(0,0,0,.28);border:1px solid var(--hair2);border-radius:14px;padding:12px 14px;transition:border-color .2s,box-shadow .2s;font-family:var(--mono);font-size:14px}
textarea:focus,input[type=text]:focus{outline:none;border-color:rgba(217,184,120,.55);box-shadow:0 0 0 4px rgba(217,184,120,.12)}
.chip:focus-visible,button:focus-visible{outline:2px solid rgba(217,184,120,.7);outline-offset:2px}
.fb{border-radius:14px;padding:12px 16px;background:rgba(255,255,255,.03);border-color:var(--hair2)}
.fb.ok{background:rgba(134,191,166,.07);border-color:rgba(134,191,166,.35)}
.fb.no{background:rgba(201,133,133,.07);border-color:rgba(201,133,133,.35)}
.hint{background:rgba(143,168,200,.06);border-left:2px solid var(--learn);border-radius:0 12px 12px 0;padding:10px 14px}
.sol{background:rgba(134,191,166,.06);border-left:2px solid var(--solid);border-radius:0 12px 12px 0;padding:10px 14px}
.res div{background:rgba(255,255,255,.03);border:1px solid var(--hair);border-radius:12px}
.wk{background:rgba(255,255,255,.025);border-color:var(--hair);border-radius:14px;padding:12px 14px;transition:border-color .2s,background .2s}
.wk:hover{border-color:rgba(217,184,120,.35);background:rgba(217,184,120,.04)}
.wk::before{background:rgba(255,255,255,.06);font-family:var(--mono);font-size:11px}
.wk .n{font:400 22px var(--display)}
.lvlbar{background:rgba(255,255,255,.03);border:1px solid var(--hair);border-radius:14px;padding:12px 14px}
.lvlbar i{background:linear-gradient(90deg,rgba(217,184,120,.28),rgba(217,184,120,.08))}
.badge{border-radius:14px;border-color:var(--hair2)}
.badge.on{background:rgba(217,184,120,.08);border-color:rgba(217,184,120,.4)}
.clock{font:500 13px var(--mono)}
.hc{width:12px;height:12px;border-radius:3px;background:rgba(255,255,255,.05)}
.heat{grid-template-rows:repeat(7,12px)}
.hc.l1{background:rgba(217,184,120,.25)}.hc.l2{background:rgba(217,184,120,.45)}.hc.l3{background:rgba(217,184,120,.7)}.hc.l4{background:var(--goldhi);box-shadow:0 0 6px rgba(241,220,174,.5)}
.mini{height:3px;background:rgba(255,255,255,.07)}.mini i{background:var(--solid)}
code{background:rgba(0,0,0,.3);border-color:var(--hair2);font-family:var(--mono)}

/* ---------- chapters list ---------- */
#chlist{top:68px;left:18px;border-radius:20px;padding:10px;width:min(400px,calc(100% - 36px))}
.chr{border-radius:14px;padding:11px 12px;transition:background .2s}
.chr:hover,.chr[aria-current="true"]{background:rgba(255,255,255,.05)}
.chr b{font-weight:500;color:#fff}
.chr small{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em}
.cp:hover{background:rgba(255,255,255,.04)}
.cp b{font-family:var(--mono);font-weight:500}

/* ---------- bottom chips ---------- */
#chips{padding:12px 18px 18px;gap:8px}
.chip{background:var(--glass);backdrop-filter:blur(16px) saturate(140%);border-color:var(--hair);padding:8px 15px;color:var(--ink2);transition:all .25s var(--ease);box-shadow:0 10px 30px -12px rgba(0,0,0,.6)}
.chip:hover{border-color:var(--hair2);color:#fff;transform:translateY(-1px)}
.chip[aria-current="true"]{border-color:rgba(217,184,120,.45);color:var(--goldhi)}
.chip .dot{box-shadow:0 0 8px var(--c)}
.chip.add{background:transparent;backdrop-filter:none;border-style:dashed;box-shadow:none}

/* ---------- legend + toast ---------- */
#legend{top:62px;right:22px;border-radius:18px;padding:16px 20px;gap:10px}
#toast{top:76px;border-radius:999px;padding:10px 20px;border-color:rgba(217,184,120,.35)}

/* ---------- home hero ---------- */
#today{left:40px;top:118px;bottom:auto;transform:none;width:330px}
.hero{animation:rise .9s var(--ease) both}
.hero .eyebrow{margin-bottom:14px;color:var(--gold)}
.heroT{font:400 58px/.98 var(--display);letter-spacing:-.025em;margin:0;color:#fff;text-wrap:balance}
.heroT em{font-style:italic;color:var(--goldhi);background:linear-gradient(100deg,#f6e6c2,#d9b878 60%,#b08a4c);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
.heroS{display:flex;gap:22px;margin:24px 0 26px;padding:16px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.heroS span{display:flex;flex-direction:column;gap:6px;font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.heroS b{font:400 30px/1 var(--display);letter-spacing:-.01em;color:#fff;text-transform:none}
.tdc{min-width:0;max-width:none;border-radius:20px;padding:18px 20px;gap:6px;animation:rise .9s .12s var(--ease) both}
.tdc .eyebrow{display:flex;align-items:center;gap:8px;color:var(--gold)}
.tdc .eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(217,184,120,.6);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,184,120,.55)}70%{box-shadow:0 0 0 9px rgba(217,184,120,0)}100%{box-shadow:0 0 0 0 rgba(217,184,120,0)}}
.tdc b{font:400 24px/1.15 var(--display);color:#fff;letter-spacing:-.01em;margin:4px 0 2px}
.tdc span{font-size:13px}
.tdc .btn{margin-top:12px}
@media (max-width:1100px){#today{display:none}}
@media (prefers-reduced-motion:reduce){#panel.fresh>*,.hero,.tdc{animation:none}}
/* refinements */
.tabs{display:flex;width:max-content;max-width:100%}
.qhead{margin-top:16px}
.stats span{display:block;line-height:1.6}
#askbox{font-family:var(--body);font-size:14.5px}
#panel{background:rgba(10,14,26,.9)}
#panel.wide{background:rgba(8,11,21,.95)}
.secnav{background:rgba(10,14,26,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 0 100vmax rgba(10,14,26,.86)}
.secnav::after{background:linear-gradient(rgba(10,14,26,.86),rgba(10,14,26,0))}
#panel.wide .secnav{background:rgba(8,11,21,.9);box-shadow:0 0 0 100vmax rgba(8,11,21,.9)}
#panel.wide .secnav::after{background:linear-gradient(rgba(8,11,21,.9),rgba(8,11,21,0))}
.sumbox{font-size:19px}
.lesson>p:first-child{margin-top:0}

#today{transition:opacity .45s var(--ease),transform .6s var(--ease)}#today.out{opacity:0;transform:translateX(-24px);pointer-events:none}

/* ===== Minimal pass: one typeface, near-black neutral palette ===== */
:root{
  --display:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist',ui-sans-serif,system-ui,sans-serif;
  --bg:#000; --ink:#ededed; --ink2:#bdbdc2; --mute:#86868c; --faint:#5a5a60;
  --hair:rgba(255,255,255,.07); --hair2:rgba(255,255,255,.12); --line:rgba(255,255,255,.08);
  --glass:rgba(10,10,12,.88); --glass2:rgba(255,255,255,.03); --panel2:rgba(255,255,255,.035);
  --gold:#c9b38a; --goldhi:#e4d6b8;
}
html,body{background:#000;font-feature-settings:"tnum"}
#shell::after{background:radial-gradient(120% 90% at 50% 45%,transparent 50%,rgba(0,0,0,.6) 100%)}
#bar{background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,0))}
/* surfaces */
#panel,#panel.wide{background:#0a0a0c;backdrop-filter:none;-webkit-backdrop-filter:none;border-color:var(--hair);box-shadow:0 30px 80px -20px rgba(0,0,0,.8)}
#chlist,#legend,.tdc,#toast,#units,#insightsBtn,#streak,.pillbtn,.chip{background:rgba(10,10,12,.92);backdrop-filter:none;-webkit-backdrop-filter:none;border-color:var(--hair);box-shadow:none}
.chip.add{background:transparent}
.secnav,#panel.wide .secnav{background:#0a0a0c;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 0 0 100vmax #0a0a0c}
.secnav::after,#panel.wide .secnav::after{background:linear-gradient(#0a0a0c,rgba(10,10,12,0))}
.stats{background:var(--hair)}.stats div{background:#0a0a0c}
/* type: one family, simple weights */
h1{font:600 15px/1 var(--body);letter-spacing:-.01em}
.eyebrow,.lesson h4,.lesson h4.eyebrow,.stats span,.exh,.key::before,.pill,.qhead,.tbl span,.bd,.ctl label,.chr small,.heroS span,.tag,.clock,.sc,#units button small,.tbrow b,.tbrow span,.cp b,.wk::before{font-family:var(--body);letter-spacing:.04em}
.eyebrow,.lesson h4,.stats span,.exh,.key::before,.heroS span{font-size:11px;font-weight:500}
.lesson h4{color:var(--mute)}
#panel h2{font:600 24px/1.2 var(--body);letter-spacing:-.02em}
#panel.wide h2{font-size:32px}
.sech{font:600 21px/1.25 var(--body);letter-spacing:-.015em}
#panel.wide .sech{font-size:26px}
.heroT{font:600 40px/1.1 var(--body);letter-spacing:-.03em}
.heroT em{font-style:normal;background:none;-webkit-background-clip:initial;background-clip:initial;color:var(--mute)}
.heroS b,.stats b{font:600 24px/1 var(--body);letter-spacing:-.02em}
.big{font:600 44px/1 var(--body);letter-spacing:-.03em}
.sumbox,#panel.wide .sumbox{font:400 15.5px/1.65 var(--body);color:var(--ink2);border-left-color:var(--hair2)}
.qtext{font:500 18px/1.5 var(--body)}
.wgt{font:600 15px/1.3 var(--body)}
.tdc b{font:600 17px/1.3 var(--body);letter-spacing:-.01em}
.wk .n{font:600 17px var(--body)}
#legBtn{font:600 14px var(--body)}
textarea,input[type=text]{font-family:var(--body)}
.lesson{color:var(--ink2)}
/* colour: neutral, single muted accent */
.btn{background:#ededed;color:#0a0a0a;border:1px solid #ededed;box-shadow:none}
.btn:hover{background:#fff;box-shadow:none;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--hair2)}
.btn.ghost:hover{background:rgba(255,255,255,.05)}
#units button[aria-selected="true"],#insightsBtn[aria-pressed="true"],.sc.cur,.tabs button[aria-selected="true"]{background:rgba(255,255,255,.1);border-color:transparent;color:#fff;box-shadow:none}
#units button[aria-selected="true"] small{color:var(--ink2)}
.tabs{background:rgba(255,255,255,.03)}
.chip[aria-current="true"]{border-color:var(--hair2);color:#fff}
#streak b,#lvl b{color:var(--ink)}
.hero .eyebrow,.tdc .eyebrow{color:var(--mute)}
.tdc .eyebrow::before{background:var(--mute);animation:none}
.key{background:rgba(255,255,255,.025);border-color:var(--hair2);color:var(--ink);box-shadow:none}
.key::before{color:var(--mute)}
.ex{background:rgba(255,255,255,.02);box-shadow:none}
.exh{color:var(--mute)}
.steps li::before{color:var(--ink2);border-color:var(--hair2);background:transparent}
.steps li:not(:last-child)::after{background:var(--hair)}
.exa b:first-child{color:var(--mute)}
.warn{background:rgba(201,133,133,.04);border-color:rgba(201,133,133,.15);color:var(--ink2)}
.warn::before{box-shadow:none}.warn b{color:var(--ink)}
.tb{background:rgba(255,255,255,.02);border-color:var(--hair)}
.tbrow b{color:var(--ink)}
.vid:hover{border-color:var(--hair2);background:rgba(255,255,255,.04)}
.vi{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:none}
.wg,.wg>svg{background:#060607}
.wgr{background:rgba(255,255,255,.02)}
input[type=range]::-webkit-slider-runnable-track{background:rgba(255,255,255,.18)}
input[type=range]::-webkit-slider-thumb{background:#ededed;box-shadow:0 0 0 4px rgba(255,255,255,.08)}
input[type=range]::-moz-range-track{background:rgba(255,255,255,.18)}
input[type=range]::-moz-range-thumb{background:#ededed;box-shadow:none}
.ctl input{accent-color:#ededed}
textarea:focus,input[type=text]:focus{border-color:rgba(255,255,255,.3);box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.chip:focus-visible,button:focus-visible{outline-color:rgba(255,255,255,.5)}
.prog i{background:var(--solid);box-shadow:none}
.pill i{box-shadow:none}.chip .dot{box-shadow:none}
.hc.l1{background:rgba(255,255,255,.15)}.hc.l2{background:rgba(255,255,255,.3)}.hc.l3{background:rgba(255,255,255,.55)}.hc.l4{background:#ededed;box-shadow:none}
.lvlbar i{background:rgba(255,255,255,.08)}
.badge.on{background:rgba(255,255,255,.05);border-color:var(--hair2)}
.wk:hover{border-color:var(--hair2);background:rgba(255,255,255,.03)}
.crumb:hover{color:var(--ink)}
.brand .mark{background:#ededed;box-shadow:none;width:10px;height:10px}
::selection{background:rgba(255,255,255,.2)}

/* ===== Opening quote ===== */
#intro{position:fixed;inset:0;z-index:60;display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(80% 70% at 50% 50%,rgba(0,0,0,.72),#000 85%);transition:opacity 2.2s cubic-bezier(.4,0,.2,1),filter 2.2s,transform 2.6s}
#intro.gone{opacity:0;filter:blur(14px);transform:scale(1.04)}#intro.gone.off{pointer-events:none}
#intro .q{max-width:760px;padding:0 36px;text-align:center}
#intro .qt{font:500 clamp(22px,3vw,34px)/1.4 var(--body);letter-spacing:-.02em;color:#e6e6ea;margin:0}
#intro .qt span{display:inline-block;opacity:0;filter:blur(12px);transform:translateY(8px);animation:qw 1.6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes qw{60%{opacity:.85;filter:blur(1px)}to{opacity:1;filter:blur(0);transform:none}}
#intro .qa{display:block;margin-top:26px;font:500 11px var(--body);letter-spacing:.28em;text-transform:uppercase;color:#6c6c73;opacity:0;animation:qf 2s ease forwards}
#intro .qa::before{content:'';display:block;width:1px;height:28px;margin:0 auto 18px;background:linear-gradient(transparent,#55555c)}
#intro .qh{position:absolute;bottom:42px;left:0;right:0;text-align:center;font:500 11px var(--body);letter-spacing:.22em;text-transform:uppercase;color:#4a4a50;opacity:0;animation:qf 2s ease forwards,qp 3.4s ease-in-out infinite}
@keyframes qf{to{opacity:1}}@keyframes qp{50%{color:#7a7a82}}
@media (prefers-reduced-motion:reduce){#intro .qt span,#intro .qa,#intro .qh{animation:none;opacity:1;filter:none;transform:none}}

/* ===== Features ===== */
/* settings-driven sizing */
html[data-text="s"] .lesson,html[data-text="s"] .fc-body{font-size:14.5px}
html[data-text="l"] .lesson,html[data-text="l"] .fc-body{font-size:18px}
html[data-text="xl"] .lesson,html[data-text="xl"] .fc-body{font-size:20px}
html[data-text="l"] #panel.wide .lesson{font-size:20px}html[data-text="xl"] #panel.wide .lesson{font-size:22px}
html[data-width="narrow"] #panel.wide{--rw:640px}html[data-width="wide"] #panel.wide{--rw:1100px}
/* top bar tools */
#fxbar{display:flex;gap:4px;align-items:center;padding:3px;border-radius:999px;background:rgba(10,10,12,.92);border:1px solid var(--hair)}
.fxb{display:inline-flex;align-items:center;gap:6px;height:30px;min-width:30px;justify-content:center;padding:0 8px;border-radius:999px;border:0;background:transparent;color:var(--ink2);cursor:pointer;transition:background .2s,color .2s;font:500 12.5px var(--body)}
.fxb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.fxb:hover{background:rgba(255,255,255,.07);color:#fff}
.fxb.star svg path:first-child{fill:currentColor;stroke:none;opacity:.9}
.fxb.star:hover svg{filter:drop-shadow(0 0 6px rgba(255,255,255,.6))}
.fxb.wide{padding:0 11px 0 9px;position:relative}
.fxb.wide span{font-variant-numeric:tabular-nums;min-width:34px;text-align:left}
.fxb.run{color:#fff;background:conic-gradient(rgba(255,255,255,.14) calc(var(--p)*1%),rgba(255,255,255,.03) 0)}
.fxb.brk{color:#9fd0b8;background:conic-gradient(rgba(159,208,184,.16) calc(var(--p)*1%),rgba(255,255,255,.03) 0)}
#fx-pop{position:fixed;z-index:40;width:260px;padding:12px;border-radius:14px;background:#0c0c0e;border:1px solid var(--hair2);box-shadow:0 20px 50px rgba(0,0,0,.7);display:flex;flex-direction:column;gap:6px}
#fx-pop button{text-align:left;padding:9px 11px;border-radius:10px;border:1px solid var(--hair);background:rgba(255,255,255,.02);color:var(--ink);font:500 13px var(--body);cursor:pointer}
#fx-pop button:hover{background:rgba(255,255,255,.06)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);cursor:pointer}
.chk input{accent-color:#ededed}
/* focus mode: dim everything but the lesson */
body.fx-focus #chips,body.fx-focus #today,body.fx-focus #crumbs,body.fx-focus #units,body.fx-focus #insightsBtn,body.fx-focus #streak{opacity:.18;transition:opacity .8s}
body.fx-focus #sky{opacity:.35;transition:opacity 1.2s}
body.fx-focus #chips:hover,body.fx-focus #today:hover{opacity:1}
/* overlays */
.fxov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.86);opacity:0;transition:opacity .45s ease;overflow:hidden}
.fxov.open{opacity:1}
.fxov .fxbg{position:absolute;inset:0;width:100%;height:100%}
.fxov .fxin{position:relative;height:100%;overflow:auto;padding:70px 6vw 60px}
.fx-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px}
.fx-head h2{font:600 26px/1.2 var(--body);letter-spacing:-.02em;margin:6px 0 0;color:#fff}
.k-trophy .fxin{max-width:980px;margin:0 auto;padding-left:32px;padding-right:32px}
/* trophy room */
.fx-lvl{display:flex;gap:22px;align-items:center;margin:18px 0 22px;padding:18px;border:1px solid var(--hair);border-radius:18px;background:rgba(255,255,255,.02)}
.fx-lvl>div:last-child{display:flex;flex-direction:column;gap:4px}.fx-lvl>div:last-child b{font:600 20px var(--body);color:#fff}.fx-lvl span{font-size:13px;color:var(--ink2)}
.fx-lvl .ring{--p:0;width:86px;height:86px;border-radius:50%;flex:none;display:grid;place-items:center;align-content:center;background:radial-gradient(#0a0a0c 60%,transparent 61%),conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.07) 0)}
.fx-lvl .ring b{font:600 26px/1 var(--body);color:#fff}.fx-lvl .ring span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.fx-titles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:22px}
.fx-titles div{position:relative;padding:12px 14px 14px;border:1px solid var(--hair);border-radius:14px;overflow:hidden}
.fx-titles span{font-size:11px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}.fx-titles b{display:block;font:600 16px var(--body);color:#fff;margin-top:4px}
.fx-titles i{position:absolute;left:0;bottom:0;height:2px;background:var(--c)}
.fx-chal{display:grid;gap:6px;margin:8px 0 18px}
.fx-chal div{position:relative;display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border:1px solid var(--hair);border-radius:12px;font-size:13.5px;color:var(--ink2);overflow:hidden}
.fx-chal div b{color:var(--ink);font-weight:600}.fx-chal div i{position:absolute;left:0;bottom:0;height:2px;background:rgba(255,255,255,.35)}
.fx-chal div.ok{border-color:rgba(159,208,184,.35)}.fx-chal div.ok i{background:#9fd0b8}.fx-chal div.ok b{color:#9fd0b8}
.fx-cons{display:grid;gap:8px;margin-top:6px}
.fx-con{padding:10px 14px 4px;border:1px solid var(--hair);border-radius:16px;background:rgba(255,255,255,.015);overflow-x:auto}
.fx-con svg line{stroke:rgba(255,255,255,.1);stroke-width:1}.fx-con svg line.on{stroke:rgba(232,201,138,.55)}
.fx-con .st{cursor:pointer}.fx-con .st circle{fill:#2a2c34;transition:all .3s}.fx-con .st text{font:500 9.5px var(--body);fill:#6e7080;text-anchor:middle}
.fx-con .st.on circle{fill:#fff}.fx-con .st.on.t1 circle{fill:#c49a6c;filter:drop-shadow(0 0 4px #c49a6c)}.fx-con .st.on.t2 circle{fill:#d8dce6;filter:drop-shadow(0 0 5px #c8ccd6)}
.fx-con .st.on.t3 circle{fill:#f0d39a;filter:drop-shadow(0 0 7px #e8c98a)}.fx-con .st.on.t4 circle{fill:#efe6ff;filter:drop-shadow(0 0 9px #cdb8ff)}
.fx-con .st.on text{fill:#d8d8de}.fx-con .st:hover circle{transform-box:fill-box;transform-origin:center;transform:scale(1.4)}
.fx-achd{margin-top:14px;padding:12px 14px;border:1px solid var(--hair);border-radius:12px;font-size:13.5px}
/* achievement toasts and celebrations */
.fx-ach{position:fixed;left:50%;bottom:28px;z-index:70;display:flex;gap:14px;align-items:center;padding:14px 20px 14px 16px;min-width:300px;border-radius:16px;background:#0c0c0e;border:1px solid var(--hair2);box-shadow:0 20px 60px rgba(0,0,0,.7);transform:translate(-50%,30px);opacity:0;transition:all .6s cubic-bezier(.2,.8,.2,1)}
.fx-ach.in{transform:translate(-50%,0);opacity:1}
.fx-ach p{margin:0;font:500 10.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}.fx-ach b{display:block;font:600 16px var(--body);color:#fff;margin:2px 0}.fx-ach span{font-size:12.5px;color:var(--ink2)}
.fx-burst{width:34px;height:34px;flex:none;border-radius:50%;position:relative;background:radial-gradient(#fff 0 18%,var(--tc,#c49a6c) 30%,transparent 70%)}
.fx-ach.t1 .fx-burst{--tc:#c49a6c}.fx-ach.t2 .fx-burst{--tc:#c8ccd6}
.fx-burst::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--tc,#c49a6c);animation:fxring 1.4s ease-out 2}
@keyframes fxring{from{transform:scale(.5);opacity:1}to{transform:scale(1.6);opacity:0}}
.fx-cel{position:fixed;inset:0;z-index:80;cursor:pointer}
.fx-cel canvas{position:absolute;inset:0;width:100%;height:100%}
.fx-celt{position:absolute;left:0;right:0;top:56%;text-align:center;opacity:0;transform:translateY(12px);transition:all 1s cubic-bezier(.2,.8,.2,1)}
.fx-cel.in .fx-celt{opacity:1;transform:none}.fx-cel.out{opacity:0;transition:opacity .6s}
.fx-celt p{margin:0;font:500 11px var(--body);letter-spacing:.3em;text-transform:uppercase;color:#bdb6a6}
.fx-celt h2{margin:10px 0 8px;font:600 clamp(30px,5vw,54px)/1.05 var(--body);letter-spacing:-.03em;color:#fff}
.fx-celt span{font-size:15px;color:#c9c9cf}
/* flashcards */
.fc-panel{max-width:620px;padding:22px 24px;border:1px solid var(--hair);border-radius:22px;background:rgba(8,8,10,.86);backdrop-filter:blur(8px)}
.fc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.fc-grid label,.fc-add label{display:flex;flex-direction:column;gap:6px;font:500 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.fxov select,.fx-set select,.fc-add input,.fc-add textarea{background:#101013;color:var(--ink);border:1px solid var(--hair2);border-radius:10px;padding:9px 10px;font:400 13.5px var(--body);text-transform:none;letter-spacing:0}
.fc-types{display:flex;flex-wrap:wrap;gap:8px 16px;margin:6px 0 14px}
.fc-stat{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:14px;overflow:hidden;margin:14px 0}
.fc-stat div{background:#0a0a0c;padding:12px 14px}.fc-stat b{display:block;font:600 22px var(--body);color:#fff}.fc-stat span{font-size:11px;color:var(--mute);letter-spacing:.04em}
.fc-bars{display:flex;gap:10px;align-items:flex-end;height:96px;margin:6px 0 4px}
.fc-bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mute)}
.fc-bars i{width:100%;border-radius:4px 4px 0 0;background:#3c4152}.fc-bars b{color:var(--ink2);font-weight:500}
.fc-bars .c1 i{background:#c98585}.fc-bars .c2 i{background:#d6a372}.fc-bars .c3 i{background:#cdbf8c}.fc-bars .c4 i{background:#9fc0f0}.fc-bars .c5 i{background:#fff2d6}
.fc-add{display:grid;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--hair)}
.fc-run{max-width:720px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:4vh}
.fc-top{width:100%;display:flex;align-items:center;gap:16px;font-size:13px;color:var(--ink2)}
.fc-top .x{margin-right:auto}
.fc-timer{font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:999px;border:1px solid var(--hair2)}
.fc-combo{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 8px;border-radius:999px;border:1px solid var(--hair);transition:all .3s}
.fc-combo i{width:8px;height:8px;border-radius:50%;background:#555}
.fc-combo b{font:600 15px var(--body);color:#fff;font-variant-numeric:tabular-nums}
.fc-combo.hot{border-color:rgba(232,201,138,.45);box-shadow:0 0 18px rgba(232,201,138,.18)}.fc-combo.hot i{background:#e8c98a;box-shadow:0 0 10px #e8c98a;animation:fxpulse 1.2s infinite}
.fc-combo.blaze{border-color:rgba(255,236,200,.7);box-shadow:0 0 26px rgba(255,220,160,.35)}.fc-combo.blaze i{background:#fff2d6}
@keyframes fxpulse{50%{transform:scale(1.5)}}
.fc-card{position:relative;width:min(640px,90vw);min-height:300px;perspective:1400px;cursor:pointer}
.fc-card .face{position:absolute;inset:0;padding:30px 34px;border-radius:22px;border:1px solid var(--hair2);background:linear-gradient(180deg,rgba(18,18,22,.94),rgba(10,10,12,.96));backface-visibility:hidden;transition:transform .7s cubic-bezier(.3,.7,.2,1);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:auto}
.fc-card .back{transform:rotateY(180deg)}.fc-card.flip .front{transform:rotateY(-180deg)}.fc-card.flip .back{transform:rotateY(0)}
.fc-body{flex:1;display:flex;flex-direction:column;justify-content:center;font-size:17px;line-height:1.6;color:var(--ink);margin-top:10px}
.fc-body strong{color:#fff}
.fc-hint{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:center}
.fc-rate{display:flex;gap:8px;opacity:.25;transition:opacity .4s;width:min(640px,90vw)}
.fc-rate.on{opacity:1}
.fc-rate button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:14px;border:1px solid var(--hair2);background:rgba(10,10,12,.9);color:var(--ink2);cursor:pointer;transition:all .2s}
.fc-rate button b{font:600 18px var(--body);color:#fff}.fc-rate button span{font-size:11px}
.fc-rate button:not([disabled]):hover{transform:translateY(-2px)}
.fc-rate .r1:hover{border-color:#c98585}.fc-rate .r2:hover{border-color:#d6a372}.fc-rate .r3:hover{border-color:#cdbf8c}.fc-rate .r4:hover{border-color:#9fc0f0}.fc-rate .r5:hover{border-color:#fff2d6}
.fc-burst{position:absolute;left:50%;top:44%;z-index:5;transform:translate(-50%,-50%);text-align:center;pointer-events:none;animation:fcb 1.8s cubic-bezier(.2,.8,.2,1) forwards}
.fc-burst b{display:block;font:700 96px/1 var(--body);color:#fff;text-shadow:0 0 40px rgba(255,220,160,.7)}.fc-burst span{font-size:13px;letter-spacing:.4em;text-transform:uppercase;color:#e8c98a}
@keyframes fcb{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
/* search */
#fx-search{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:flex-start;padding-top:12vh;opacity:0;transition:opacity .25s}
#fx-search.open{opacity:1}
.fx-sbox{width:min(640px,92vw);border-radius:18px;background:#0c0c0e;border:1px solid var(--hair2);box-shadow:0 30px 90px rgba(0,0,0,.8);overflow:hidden}
.fx-sin{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--hair)}
.fx-sin svg{width:18px;height:18px;fill:none;stroke:#ededed;stroke-width:1.6}.fx-sin svg path:first-child{fill:#ededed;stroke:none}
.fx-sin input{flex:1;background:none;border:0;outline:none;color:#fff;font:500 16px var(--body)}
.fx-sin kbd{font:500 11px var(--body);color:var(--mute);border:1px solid var(--hair2);border-radius:6px;padding:2px 6px}
#fx-res{max-height:56vh;overflow:auto;padding:6px}
#fx-res button{display:flex;gap:12px;width:100%;text-align:left;padding:10px 12px;border:0;border-radius:10px;background:none;color:var(--ink);cursor:pointer}
#fx-res button:hover,#fx-res button:first-child{background:rgba(255,255,255,.05)}
#fx-res .k{flex:none;width:64px;font:500 10.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding-top:2px}
#fx-res .b{display:flex;flex-direction:column;gap:2px;min-width:0}#fx-res b{font-weight:500}#fx-res small{color:var(--mute);font-size:12px}#fx-res em{font-style:normal;color:var(--ink2);font-size:13px;overflow:hidden}
.fx-sh{padding:12px}
/* panel views */
.fx-ftabs{margin-top:6px}
.fx-ftab{width:100%;border-collapse:collapse;margin:4px 0 16px}

.fx-sectools{display:flex;gap:4px;margin:-4px 0 8px}

.fxt:hover{opacity:1;color:var(--ink);border-color:var(--hair)}.fxt.on{opacity:1;color:var(--gold)}.fxt.on svg{fill:currentColor;fill-opacity:.25}

.fx-note{width:100%;margin:0 0 14px;background:rgba(255,255,255,.02);border:1px solid var(--hair2);border-radius:12px;padding:10px 12px;color:var(--ink);font:400 14px/1.5 var(--body);resize:vertical}
/* home extras */
.fx-tx{margin-top:12px;gap:10px}
.fx-cd{display:flex;gap:8px;flex-wrap:wrap}

.fx-setd{padding:0;text-align:left;font-size:13px}

.fx-mini span i{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.06)}
.fx-mini span.ok{color:#9fd0b8}.fx-mini span.ok i{background:rgba(159,208,184,.12)}

/* mistake nebula */
.k-mg .fxin{position:absolute;right:0;top:0;bottom:0;width:420px;padding:70px 24px 40px;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(6,4,6,.92) 14%);overflow:auto}
.mg-side .fx-head h2{font-size:22px}

    <nav id="crumbs" aria-label="Where you are"></nav>

    <button id="insightsBtn" data-insights="1" aria-pressed="false">Progress and weak spots</button>
    <span id="streak"></span><span id="lvl"></span>
<button id="legBtn" class="pillbtn" aria-expanded="false" aria-controls="legend" title="Colour key" aria-label="Colour key">?</button>
    <ul id="legend" aria-label="Colour key">
      <li><span class="sw" style="--c:var(--new)"></span>Not started</li>

<script type="application/json" id="content">{"mm3-c01":{"id":"mm3-c01","interactive":"expfun","summary":"This chapter builds the two functions that run the rest of Unit 3: $e^x$ and its inverse $\\ln x$. You learn what a limit is, why $e$ is special, how to sketch and solve with exponentials and logarithms, how to differentiate them, and how to use them to model growth, decay and cooling.","videos":[{"src":"B","title":"What's so special about Euler's number e? (3Blue1Brown, Essence of calculus ch. 5)","url":"https://www.youtube.com/watch?v=m2MIpDrF7Es","kind":"video"},{"src":"B","title":"The paradox of the derivative (3Blue1Brown, Essence of calculus ch. 2)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+The+paradox+of+the+derivative+Essence+of+calculus+chapter+2","kind":"search"},{"src":"B","title":"Limits, L'Hopital's rule and epsilon delta (3Blue1Brown, ch. 7)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Limits%2C+L%27Hopital%27s+rule%2C+and+epsilon+delta+definitions","kind":"search"},{"src":"J","title":"Limits and derivatives from first principles","url":"https://www.youtube.com/results?search_query=Joel+Speranza+limits+first+principles","kind":"search"},{"src":"J","title":"Exponential functions and their graphs","url":"https://www.youtube.com/results?search_query=Joel+Speranza+exponential+functions+graphs","kind":"search"},{"src":"J","title":"Logarithm laws and solving log equations","url":"https://www.youtube.com/results?search_query=Joel+Speranza+logarithm+laws","kind":"search"},{"src":"J","title":"Differentiating exponential and logarithmic functions","url":"https://www.youtube.com/results?search_query=Joel+Speranza+differentiation+exponential+logarithmic","kind":"search"}],"sections":[{"id":"mm3-c01-s1","code":"1.2","title":"Limits","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: limits and differentiation from first principles","url":"https://www.youtube.com/results?search_query=Joel+Speranza+limits+and+differentiation+from+first+principles","kind":"search"},{"src":"B","title":"3Blue1Brown: The paradox of the derivative","url":"https://www.youtube.com/results?search_query=3Blue1Brown+The+paradox+of+the+derivative","kind":"search"}]},{"t":"p","x":"A **limit** describes the value a function approaches as the input gets close to a point, even if the function never actually reaches it. We write $\\lim_{x\\to a} f(x)=L$. For most nice functions the limit is just the value, so $\\lim_{x\\to 2}(x^2+1)=5$. Limits become interesting when direct substitution gives $\\tfrac{0}{0}$, because then you must simplify first."},{"t":"p","x":"Because $x$ can approach $a$ from the left ($x\\to a^-$) or the right ($x\\to a^+$), a limit only exists when both sides agree. Limits obey the usual laws: the limit of a sum, product or quotient is the sum, product or quotient of the limits (as long as you do not divide by a limit of zero)."},{"t":"ex","title":"Limit that needs factorising","q":"Evaluate $\\displaystyle\\lim_{x\\to 3}\\frac{x^2-9}{x-3}$.","s":["Substituting $x=3$ gives $\\tfrac{0}{0}$, so factorise the numerator: $\\dfrac{(x-3)(x+3)}{x-3}$.","For $x\\neq 3$ the factor $x-3$ cancels, leaving $x+3$.","Now substitute: $3+3=6$."],"a":"$6$"},{"t":"p","x":"The idea behind all of calculus is the **derivative as a limit**. The gradient of the tangent at $x$ is the limit of the gradient of a chord as the chord shrinks to a point:"},{"t":"key","x":"$$f'(x)=\\lim_{h\\to 0}\\frac{f(x+h)-f(x)}{h}$$"},{"t":"ex","title":"Derivative from first principles","q":"Use first principles to find $f'(x)$ for $f(x)=x^2$.","s":["$\\dfrac{f(x+h)-f(x)}{h}=\\dfrac{(x+h)^2-x^2}{h}=\\dfrac{2xh+h^2}{h}$.","Divide by $h$: $2x+h$.","Let $h\\to 0$: $f'(x)=2x$."],"a":"$f'(x)=2x$"},{"t":"p","x":"You can also **estimate** a limit numerically. Evaluate the function at values closer and closer to the point on both sides and watch where the outputs head. This is how the number $e$ is first met: the values of $\\left(1+\\tfrac1n\\right)^n$ climb towards $2.71828\\ldots$ as $n$ grows, and we define that limit to be $e$."},{"t":"warn","x":"A limit of $\\tfrac00$ does not mean the limit does not exist, and it does not mean the answer is $0$. It means you have not simplified enough yet."},{"t":"tb","rec":"1,2,3,5,8","ext":"11,13","x":"Textbook Exercise 1.2 practises evaluating limits by substitution and factorising, then differentiating from first principles, then estimating limits with technology.","code":"1.2"},{"t":"p","x":"**One-sided limits.** Write $\\lim_{x\\to a^-}f(x)$ for the value approached from the left and $\\lim_{x\\to a^+}f(x)$ from the right. The two-sided limit exists only when they are equal. A graph with a jump, such as $f(x)=\\frac{|x|}{x}$ at $0$ (left limit $-1$, right limit $+1$), has no limit there."},{"t":"ex","title":"A limit that does not exist","q":"Does $\\displaystyle\\lim_{x\\to0}\\frac{|x|}{x}$ exist?","s":["For $x>0$, $\\frac{|x|}x=1$, so the right-hand limit is $1$.","For $x\u003c0$, $\\frac{|x|}x=-1$, so the left-hand limit is $-1$.","The two sides disagree."],"a":"The limit does not exist."},{"t":"ex","title":"First principles with a cubic","q":"Use first principles to differentiate $f(x)=x^3$.","s":["$\\dfrac{(x+h)^3-x^3}{h}=\\dfrac{3x^2h+3xh^2+h^3}{h}=3x^2+3xh+h^2$.","As $h\\to0$, the terms with $h$ vanish."],"a":"$f'(x)=3x^2$"},{"t":"p","x":"**Continuity and differentiability.** A function is **continuous** at $x=a$ when $\\lim_{x\\to a}f(x)=f(a)$ (you can draw it without lifting your pen). It is **differentiable** at $a$ when the first-principles limit exists, which also needs the left and right gradients to match. A sharp corner, such as $y=|x|$ at $0$, is continuous but not differentiable."},{"t":"int","name":"tangent","cap":"Move the point and shrink the gap $h$: the blue secant gradient closes in on the green tangent gradient. That is the definition of the derivative."}]},{"id":"mm3-c01-s2","code":"1.3","title":"The exponential function","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: exponential functions and graphs","url":"https://www.youtube.com/results?search_query=Joel+Speranza+exponential+functions+and+graphs","kind":"search"},{"src":"B","title":"3Blue1Brown: What is special about Euler's number e","url":"https://www.youtube.com/watch?v=m2MIpDrF7Es","kind":"video"}]},{"t":"p","x":"An exponential function has the variable in the **index**: $y=a^x$ with $a>0$, $a\\neq 1$. Every such graph passes through $(0,1)$, has the horizontal asymptote $y=0$, and is always positive. If $a>1$ it grows (the graph rises to the right). If $0\u003ca\u003c1$ it decays (the graph falls to the right)."},{"t":"p","x":"The special base is **Euler's number** $e\\approx 2.71828$. It is the unique base for which the gradient of the curve at every point equals the height of the curve. That is why $y=e^x$ is the star of calculus."},{"t":"key","x":"For $y=ae^{b(x-h)}+k$: the **horizontal asymptote** is $y=k$; $a$ stretches vertically (negative $a$ reflects in the $x$-axis); $b$ stretches horizontally (negative $b$ reflects in the $y$-axis); $h$ shifts right and $k$ shifts up."},{"t":"ex","title":"Sketching a transformed exponential","q":"Sketch $y=2e^{-x}+1$. State the asymptote, the $y$-intercept and the range.","s":["The base graph $y=e^x$ is reflected in the $y$-axis (because of $-x$), stretched by 2 vertically, then shifted up by 1.","Horizontal asymptote: $y=1$.","$y$-intercept: $x=0$ gives $y=2e^0+1=3$, so the point is $(0,3)$.","The graph is always above the asymptote, so the range is $y>1$. There is no $x$-intercept."],"a":"Asymptote $y=1$, $y$-intercept $(0,3)$, range $(1,\\infty)$."},{"t":"p","x":"To find an **$x$-intercept**, set $y=0$ and solve. Since $e^{\\text{anything}}>0$, you must be able to isolate $e^{\\ldots}$ equal to a positive number or the graph has no $x$-intercept."},{"t":"warn","x":"$e^{x+2}$ is not $e^x+2$. A shift inside the index moves the graph left or right. A number added outside moves it up or down, and only the second one moves the asymptote."},{"t":"int","name":"expfun","cap":"Slide $a$ and watch the gradient of $y=a^x$ at $x=0$. When $a=e$ the gradient equals the height."},{"t":"tb","rec":"1,3,4,7,11,12","ext":"13,15,16,18","x":"Exercise 1.3 covers sketching $y=a^x$ and $y=e^x$ with transformations, then finding intercepts and domain and range.","code":"1.3"},{"t":"p","x":"**Finding an exponential from information.** Substitute known points into $y=ae^{bx}+k$. A horizontal asymptote gives $k$ directly; a $y$-intercept gives $a+k$; a second point gives $b$."},{"t":"ex","title":"Exponential through two points","q":"$y=ae^{bx}$ passes through $(0,3)$ and $(1,3e^2)$. Find $a$ and $b$.","s":["$x=0$: $a=3$.","$x=1$: $3e^{b}=3e^2\\Rightarrow b=2$."],"a":"$y=3e^{2x}$"},{"t":"p","x":"**Index laws you need all the time:** $a^m a^n=a^{m+n}$, $\\frac{a^m}{a^n}=a^{m-n}$, $(a^m)^n=a^{mn}$, $a^{-n}=\\frac1{a^n}$, $a^{1/n}=\\sqrt[n]{a}$. For $e$: $e^xe^y=e^{x+y}$ and $\\frac1{e^{x}}=e^{-x}$."},{"t":"warn","x":"$e^x\\cdot e^y=e^{x+y}$, but $e^x+e^y$ cannot be combined. Many \"simplify\" errors come from treating a sum like a product."}]},{"id":"mm3-c01-s3","code":"1.4","title":"Differentiation of exponential functions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: differentiating e^x","url":"https://www.youtube.com/results?search_query=Joel+Speranza+differentiating+e%5Ex","kind":"search"},{"src":"B","title":"3Blue1Brown: What is special about Euler's number e","url":"https://www.youtube.com/watch?v=m2MIpDrF7Es","kind":"video"}]},{"t":"key","x":"$$\\frac{d}{dx}\\left(e^x\\right)=e^x\\qquad\\text{and}\\qquad \\frac{d}{dx}\\left(e^{f(x)}\\right)=f'(x)\\,e^{f(x)}$$"},{"t":"p","x":"The second rule is the chain rule in action: differentiate the **inside** and multiply by the original exponential. So $\\frac{d}{dx}e^{3x}=3e^{3x}$, $\\frac{d}{dx}e^{x^2}=2xe^{x^2}$ and $\\frac{d}{dx}e^{-2x+1}=-2e^{-2x+1}$."},{"t":"ex","title":"Differentiating exponentials","q":"Differentiate $y=5e^{4x}-e^{-x^2}$.","s":["First term: $5\\times 4e^{4x}=20e^{4x}$.","Second term: the inside is $-x^2$ with derivative $-2x$, so $\\frac{d}{dx}e^{-x^2}=-2xe^{-x^2}$. Because of the minus sign in front, this term contributes $+2xe^{-x^2}$.","$y'=20e^{4x}+2xe^{-x^2}$."],"a":"$y'=20e^{4x}+2xe^{-x^2}$"},{"t":"ex","title":"Equation of a tangent","q":"Find the equation of the tangent to $y=e^{2x}$ at $x=0$.","s":["$y'=2e^{2x}$, so at $x=0$ the gradient is $2$.","The point is $(0,e^0)=(0,1)$.","Tangent: $y-1=2(x-0)$, so $y=2x+1$."],"a":"$y=2x+1$"},{"t":"warn","x":"Do not write $\\frac{d}{dx}e^{3x}=3xe^{3x-1}$. The power rule does not apply to $e^x$, because $x$ is in the index, not the base."},{"t":"tb","rec":"1,2,5,6,7,10","ext":"13,16,17,19,20","x":"Exercise 1.4 starts with direct derivatives of $e^{f(x)}$, then tangents and stationary points.","code":"1.4"},{"t":"ex","title":"Stationary point of an exponential","q":"Find and classify the stationary point of $y=e^x-2x$.","s":["$y'=e^x-2=0\\Rightarrow x=\\ln2$. Then $y=2-2\\ln2\\approx0.614$.","$y''=e^x>0$ everywhere, so it is a minimum."],"a":"Minimum at $\\left(\\ln2,\\ 2-2\\ln2\\right)$."},{"t":"p","x":"**Rate of change in context.** If $N=N_0e^{kt}$ then $\\frac{dN}{dt}=kN$: the rate is proportional to the amount. This single idea underlies population growth, radioactive decay and compound interest, so a statement like \"the rate of change is proportional to the size\" should immediately suggest an exponential."}]},{"id":"mm3-c01-s4","code":"1.5","title":"The logarithmic function","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: logarithm laws and the natural logarithm","url":"https://www.youtube.com/results?search_query=Joel+Speranza+logarithm+laws+and+the+natural+logarithm","kind":"search"}]},{"t":"p","x":"A **logarithm** answers the question \"what power?\". $\\log_a(x)=y$ means $a^y=x$. The **natural logarithm** is the log to base $e$: $\\ln x=\\log_e x$. It is the inverse of $e^x$, so $\\ln(e^x)=x$ and $e^{\\ln x}=x$."},{"t":"key","x":"**Log laws** (any base): $\\log(xy)=\\log x+\\log y$; $\\log\\!\\left(\\tfrac xy\\right)=\\log x-\\log y$; $\\log(x^n)=n\\log x$; $\\log_a 1=0$; $\\log_a a=1$."},{"t":"p","x":"Because $\\ln x$ is the inverse of $e^x$, its graph is the reflection of $y=e^x$ in the line $y=x$. So $y=\\ln x$ has domain $x>0$, range all reals, a **vertical asymptote** at $x=0$, and passes through $(1,0)$."},{"t":"ex","title":"Simplifying with log laws","q":"Write $2\\ln 3+\\ln 5-\\ln 15$ as a single logarithm and simplify.","s":["$2\\ln 3=\\ln 9$, so the expression is $\\ln 9+\\ln 5-\\ln 15$.","$\\ln 9+\\ln 5=\\ln 45$, and $\\ln 45-\\ln 15=\\ln\\frac{45}{15}=\\ln 3$."],"a":"$\\ln 3$"},{"t":"ex","title":"Sketching a transformed log graph","q":"Describe $y=\\ln(x-2)+1$.","s":["Shift $y=\\ln x$ right by 2 and up by 1.","Vertical asymptote $x=2$, domain $x>2$.","$x$-intercept: $\\ln(x-2)=-1\\Rightarrow x-2=e^{-1}\\Rightarrow x=2+e^{-1}\\approx 2.37$."],"a":"Asymptote $x=2$, domain $x>2$, $x$-intercept $2+e^{-1}$."},{"t":"warn","x":"$\\ln(x+y)$ is not $\\ln x+\\ln y$. The log of a sum has no simple rule, and $\\ln(x)\\ln(y)$ is not $\\ln(xy)$."},{"t":"int","name":"logfun","cap":"Move the point on $y=e^x$ and watch its mirror image on $y=\\ln x$ across the line $y=x$."},{"t":"tb","rec":"1,2,3,6,10,12","ext":"13,15,17,20","x":"Exercise 1.5 covers index and log laws, then graphs of $y=\\ln x$ and its transformations.","code":"1.5"},{"t":"key","x":"**Change of base:** $\\log_a x=\\dfrac{\\ln x}{\\ln a}$. Use it to evaluate logs on a calculator and to solve $a^x=b$ as $x=\\dfrac{\\ln b}{\\ln a}$."},{"t":"ex","title":"Solving $a^x=b$","q":"Solve $2^x=7$ to 3 decimal places.","s":["Take $\\ln$ of both sides: $x\\ln2=\\ln7$.","$x=\\frac{\\ln7}{\\ln2}\\approx2.807$."],"a":"$x\\approx2.807$"},{"t":"p","x":"**Domain and range, summary.** $y=e^x$: domain $\\mathbb R$, range $(0,\\infty)$. $y=\\ln x$: domain $(0,\\infty)$, range $\\mathbb R$. For $y=\\ln(ax+b)$ the domain is where $ax+b>0$."}]},{"id":"mm3-c01-s5","code":"1.6","title":"Solving equations","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: solving exponential and logarithmic equations","url":"https://www.youtube.com/results?search_query=Joel+Speranza+solving+exponential+and+logarithmic+equations","kind":"search"}]},{"t":"p","x":"**Equations with $e$.** Isolate the exponential, then take $\\ln$ of both sides. For $3e^{2x}=18$: divide to get $e^{2x}=6$, take $\\ln$: $2x=\\ln 6$, so $x=\\tfrac12\\ln 6$."},{"t":"p","x":"**Quadratics in $e^x$.** If you see $e^{2x}$ and $e^x$ together, substitute $u=e^x$ and solve the quadratic. Remember $u=e^x$ must be positive, so reject any $u\\le 0$."},{"t":"ex","title":"A quadratic in $e^x$","q":"Solve $e^{2x}-5e^x+6=0$.","s":["Let $u=e^x$, so $u^2-5u+6=0$, giving $(u-2)(u-3)=0$.","$e^x=2\\Rightarrow x=\\ln 2$ and $e^x=3\\Rightarrow x=\\ln 3$."],"a":"$x=\\ln 2$ or $x=\\ln 3$"},{"t":"p","x":"**Equations with $\\ln$.** Combine logs into one, rewrite in index form, then solve. Always **check the domain**: any solution that makes a log argument zero or negative is rejected."},{"t":"ex","title":"A log equation with a domain check","q":"Solve $\\ln(x)+\\ln(x-2)=\\ln 3$.","s":["Combine: $\\ln\\big(x(x-2)\\big)=\\ln 3$, so $x^2-2x=3$.","$x^2-2x-3=0\\Rightarrow (x-3)(x+1)=0$.","$x=-1$ makes $\\ln x$ undefined, so reject it."],"a":"$x=3$"},{"t":"warn","x":"Rejecting solutions is part of the answer. In an exam, write \"reject, since $\\ln$ is undefined for negative arguments\" and you keep the mark."},{"t":"tb","rec":"1,4,6,8,11,12","ext":"14,16,17,19,20","x":"Exercise 1.6 mixes equations in $e$, quadratics in $e^x$, and log equations with domain checks. Technology is used for equations that cannot be solved by hand.","code":"1.6"},{"t":"ex","title":"Equation with log bases","q":"Solve $\\log_2x+\\log_2(x-2)=3$.","s":["Combine: $\\log_2\\big(x(x-2)\\big)=3\\Rightarrow x(x-2)=2^3=8$.","$x^2-2x-8=0\\Rightarrow(x-4)(x+2)=0$.","$x=-2$ makes $\\log_2x$ undefined, so reject."],"a":"$x=4$"},{"t":"ex","title":"Index form","q":"Solve $\\ln(2x-1)=2$.","s":["Rewrite in index form: $2x-1=e^2$.","$x=\\frac{e^2+1}2\\approx4.19$."],"a":"$x=\\dfrac{e^2+1}{2}$"},{"t":"p","x":"**Strategy.** (1) Is the unknown in an index? Isolate the exponential, then take $\\ln$. (2) Is it inside a log? Combine to one log, convert to index form. (3) Is there an $e^{2x}$ and $e^x$? Substitute $u=e^x$. (4) Always check the domain."}]},{"id":"mm3-c01-s6","code":"1.7","title":"Differentiation of logarithmic functions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: differentiating ln x","url":"https://www.youtube.com/results?search_query=Joel+Speranza+differentiating+ln+x","kind":"search"}]},{"t":"key","x":"$$\\frac{d}{dx}\\big(\\ln x\\big)=\\frac1x\\quad(x>0)\\qquad\\text{and}\\qquad \\frac{d}{dx}\\big(\\ln f(x)\\big)=\\frac{f'(x)}{f(x)}$$"},{"t":"p","x":"The second rule says: derivative of the inside **over** the inside. So $\\frac{d}{dx}\\ln(3x+1)=\\frac{3}{3x+1}$ and $\\frac{d}{dx}\\ln(x^2+4)=\\frac{2x}{x^2+4}$."},{"t":"p","x":"A useful shortcut is to simplify with log laws **before** differentiating. $\\ln(x^5)=5\\ln x$, so its derivative is $\\tfrac5x$, much quicker than using the chain rule."},{"t":"ex","title":"Differentiating logs","q":"Differentiate $y=\\ln\\!\\big((2x+1)^3\\big)$ in two ways.","s":["Chain rule: $\\frac{f'}{f}=\\frac{3(2x+1)^2\\cdot 2}{(2x+1)^3}=\\frac{6}{2x+1}$.","Log law first: $y=3\\ln(2x+1)$, so $y'=3\\cdot\\frac{2}{2x+1}=\\frac{6}{2x+1}$."],"a":"$\\dfrac{6}{2x+1}$"},{"t":"warn","x":"$\\frac{d}{dx}\\ln(3x)=\\frac1x$, not $\\frac{1}{3x}$. The inside derivative is $3$, so the answer is $\\frac{3}{3x}=\\frac1x$."},{"t":"tb","rec":"1,4,6,10,11","ext":"14,16,17,19","x":"Exercise 1.7 practises $\\ln f(x)$ derivatives, tangents to log curves, and using log laws first.","code":"1.7"},{"t":"ex","title":"Log of a trig function","q":"Differentiate $y=\\ln(\\sin x)$ for $0\u003cx\u003c\\pi$.","s":["$\\frac{f'}f=\\frac{\\cos x}{\\sin x}$."],"a":"$\\cot x$"},{"t":"ex","title":"Tangent to a log curve","q":"Find the tangent to $y=\\ln x$ at $x=e$.","s":["$y'=\\frac1x$, so the gradient is $\\frac1e$; the point is $(e,1)$.","$y-1=\\frac1e(x-e)\\Rightarrow y=\\frac xe$."],"a":"$y=\\dfrac{x}{e}$ (it passes through the origin)"}]},{"id":"mm3-c01-s7","code":"1.8","title":"Modelling and solving with exponential and logarithmic functions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: exponential growth and decay modelling","url":"https://www.youtube.com/results?search_query=Joel+Speranza+exponential+growth+and+decay+modelling","kind":"search"}]},{"t":"p","x":"**Growth and decay.** A quantity that changes at a rate proportional to its size follows $N=N_0e^{kt}$. If $k>0$ it grows; if $k\u003c0$ it decays. $N_0$ is the starting amount (at $t=0$). The rate of change is $\\frac{dN}{dt}=kN$."},{"t":"p","x":"**Half-life.** The time for a decaying quantity to halve. Solve $\\tfrac12N_0=N_0e^{kt}$ to get $t=\\dfrac{\\ln 2}{-k}$."},{"t":"p","x":"**Decay to a limit.** Many real models approach a constant, such as cooling to room temperature: $T=T_\\infty+Ae^{kt}$ with $k\u003c0$. The horizontal asymptote $T=T_\\infty$ is the long-term value."},{"t":"ex","title":"Exponential decay","q":"A drug amount is $A=80e^{-0.2t}$ mg after $t$ hours. Find the amount after 3 hours and how fast it is changing then.","s":["$A(3)=80e^{-0.6}\\approx 43.9$ mg.","$\\frac{dA}{dt}=-0.2A$, so at $t=3$ the rate is $-0.2\\times 43.9\\approx -8.78$ mg/h."],"a":"About $43.9$ mg, decreasing at about $8.78$ mg per hour."},{"t":"ex","title":"Time to reach a value","q":"When does $A=80e^{-0.2t}$ fall to $10$ mg?","s":["$10=80e^{-0.2t}\\Rightarrow e^{-0.2t}=\\tfrac18$.","$-0.2t=\\ln\\tfrac18=-\\ln 8\\Rightarrow t=5\\ln 8\\approx 10.4$ hours."],"a":"$t=5\\ln 8\\approx 10.4$ hours"},{"t":"warn","x":"Always state units and interpret the sign. A negative rate of change means the quantity is decreasing, not that the answer is \"wrong\"."},{"t":"tb","rec":"1,3,5,7,10,12","ext":"13,16,17,19","x":"Exercise 1.8 is word-problem modelling: growth, decay, half-life, rates and tangents to log curves.","code":"1.8"},{"t":"ex","title":"Cooling model","q":"A drink cools as $T=20+60e^{-0.1t}$ (\u00b0C, $t$ in minutes). Find its starting temperature, the long-term temperature, and when it reaches $40^\\circ$C.","s":["$T(0)=80$. As $t\\to\\infty$, $T\\to20$ (room temperature).","$20+60e^{-0.1t}=40\\Rightarrow e^{-0.1t}=\\frac13\\Rightarrow t=10\\ln3\\approx11.0$ min."],"a":"$80^\\circ$C, $20^\\circ$C, and about $11.0$ minutes."},{"t":"ex","title":"Doubling time","q":"A population doubles every 8 hours. Write it as $P=P_0e^{kt}$ and find $k$.","s":["$2P_0=P_0e^{8k}\\Rightarrow8k=\\ln2$."],"a":"$k=\\frac{\\ln2}8\\approx0.0866$ per hour"},{"t":"warn","x":"A model is only valid in a sensible domain. Exponential growth cannot continue forever (limited food, space or money). In extended-response questions, comment on this limitation when asked to evaluate a model."}]},{"id":"mm3-c01-s8","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**What the exam rewards.** Marks are awarded for the correct method, accurate answers, and clear communication. Always write the **rule you use** (for example \"chain rule\"), show the substitution, and give **exact answers** unless told to round. Use your CAS to check, not to replace working in the non-technology paper."},{"t":"p","x":"**Command words.** *Determine/find*: show working to a result. *Show that*: you must reach the stated result, so every line must follow; do not work backwards. *Hence*: you must use the previous part. *Evaluate the model*: comment on accuracy and limitations."},{"t":"p","x":"**CAS reminders.** Set radians when angles use $\\pi$. Use `solve`, `d/dx` (or `diff`) and `ln` for natural logs. When a solve returns many solutions, read the domain in the question."},{"t":"ex","title":"Mixed exam-style problem","q":"A hot metal cools as $T(t)=25+75e^{-kt}$. After 5 minutes it is $55^\\circ$C. (a) Find $k$. (b) Find the rate of cooling at $t=5$.","s":["(a) $25+75e^{-5k}=55\\Rightarrow e^{-5k}=\\frac25\\Rightarrow k=\\frac15\\ln\\frac52\\approx0.183$.","(b) $T'(t)=-75ke^{-kt}$. At $t=5$, $75e^{-5k}=30$, so $T'(5)=-30k\\approx-5.50$."],"a":"$k\\approx0.183$; cooling at about $5.5^\\circ$C per minute."},{"t":"warn","x":"Common losses in this chapter: forgetting $+c$ is a later chapter, but here it is forgetting to reject a log solution, mixing $\\ln(a+b)$ with $\\ln a+\\ln b$, and answering in a decimal when exact form was asked."}]}],"quiz":[{"topic":"Chain rule with e","q":"Differentiate $y=3e^{5x}$.","a":"15e^(5x)","alt":[],"ad":"$15e^{5x}$","sol":"The inside $5x$ has derivative $5$, so $y'=3\\cdot 5e^{5x}=15e^{5x}$.","h":["Which part is the \"inside\" of the exponential?","Differentiate the inside and multiply by the whole exponential.","The constant 3 stays as a multiplier: $3\\times 5\\times e^{5x}$."]},{"topic":"Chain rule with e","q":"Differentiate $y=e^{x^2-3x}$.","a":"(2x-3)e^(x^2-3x)","alt":[],"ad":"$(2x-3)e^{x^2-3x}$","sol":"The inside $x^2-3x$ has derivative $2x-3$, so $y'=(2x-3)e^{x^2-3x}$.","h":["Name the inside function.","Its derivative is $2x-3$.","Multiply it by $e^{x^2-3x}$."]},{"topic":"Log law","q":"Simplify $\\ln 8-\\ln 2$ to a single power of $\\ln 2$ (write the answer as a multiple of $\\ln 2$).","a":"2ln2","alt":["2ln(2)","ln4","ln(4)"],"ad":"$2\\ln 2$","sol":"$\\ln 8-\\ln 2=\\ln 4=\\ln 2^2=2\\ln 2$.","h":["Use $\\ln a-\\ln b=\\ln\\frac ab$.","That gives $\\ln 4$.","Write $4$ as $2^2$."]},{"topic":"Solve in e","q":"Solve $2e^{3x}=14$. Give an exact answer.","a":"(1/3)ln7","alt":["ln(7)/3","ln7/3","(ln7)/3","1/3ln7","(1/3)ln(7)"],"ad":"$x=\\tfrac13\\ln 7$","sol":"$e^{3x}=7\\Rightarrow 3x=\\ln 7\\Rightarrow x=\\tfrac13\\ln 7$.","h":["Divide both sides by 2 first.","Take $\\ln$ of both sides.","Divide by 3."]},{"topic":"Quadratic in e^x","q":"Solve $e^{2x}-4e^x-5=0$.","a":"ln5","alt":["x=ln5","ln(5)","x=ln(5)"],"ad":"$x=\\ln 5$","sol":"Let $u=e^x$: $u^2-4u-5=0$, $(u-5)(u+1)=0$. $u=-1$ is impossible, so $e^x=5$ and $x=\\ln 5$.","h":["Substitute $u=e^x$.","Factorise the quadratic in $u$.","Which root is impossible and why?"]},{"topic":"Log equation","q":"Solve $\\ln(x+1)+\\ln(x-1)=\\ln 8$.","a":"3","alt":["x=3"],"ad":"$x=3$","sol":"$\\ln\\big((x+1)(x-1)\\big)=\\ln 8\\Rightarrow x^2-1=8\\Rightarrow x=\\pm3$. Reject $x=-3$ because $\\ln(x-1)$ is undefined there. So $x=3$.","h":["Combine the left side into one log.","Equate the arguments.","Check each solution in the original domain."]},{"topic":"Differentiate ln","q":"Differentiate $y=\\ln(x^2+1)$.","a":"2x/(x^2+1)","alt":["(2x)/(x^2+1)"],"ad":"$\\dfrac{2x}{x^2+1}$","sol":"Derivative of the inside is $2x$, over the inside $x^2+1$.","h":["Use $\\frac{f'}{f}$.","$f=x^2+1$.","$f'=2x$."]},{"topic":"Tangent","q":"Find the gradient of the tangent to $y=e^{2x}+x$ at $x=0$.","a":"3","alt":["m=3"],"ad":"$3$","sol":"$y'=2e^{2x}+1$; at $x=0$, $y'=2+1=3$.","h":["Differentiate first.","Differentiate $e^{2x}$ by the chain rule.","Substitute $x=0$."]},{"topic":"Growth model","q":"A population is $P=500e^{0.04t}$. Find $P$ when $t=10$ (nearest whole number).","a":"746","alt":["745.9","746 people"],"ad":"$\\approx 746$","sol":"$P(10)=500e^{0.4}\\approx 500\\times1.49182=745.9\\approx 746$.","h":["Substitute $t=10$.","You need $e^{0.4}$.","Multiply by 500 and round."]},{"topic":"Half-life","q":"A substance decays by $A=A_0e^{-0.1t}$. Find its half-life to 2 decimal places.","a":"6.93","alt":["6.931","10ln2"],"ad":"$10\\ln 2\\approx 6.93$","sol":"$\\tfrac12=e^{-0.1t}\\Rightarrow -0.1t=-\\ln 2\\Rightarrow t=10\\ln 2\\approx 6.93$.","h":["Set $A=\\tfrac12A_0$.","Take $\\ln$ of both sides.","Divide by $-0.1$."]},{"topic":"Limit","q":"Evaluate $\\displaystyle\\lim_{x\\to2}\\frac{x^2-4}{x-2}$.","a":"4","alt":[],"ad":"$4$","sol":"$\\frac{(x-2)(x+2)}{x-2}=x+2\\to4$.","h":["Substituting gives $0/0$.","Factorise the numerator.","Cancel and substitute."]},{"topic":"First principles","q":"Using first principles, $f(x)=x^2+3x$ gives $\\frac{f(x+h)-f(x)}{h}=2x+h+3$. Find $f'(x)$.","a":"2x+3","alt":[],"ad":"$2x+3$","sol":"Let $h\\to0$ in $2x+h+3$.","h":["What happens to $h$?","It tends to 0.","Remove $h$."]},{"topic":"Exponential through points","q":"$y=ae^{bx}$ passes through $(0,5)$ and $(1,5e^{-3})$. Find $b$.","a":"-3","alt":["b=-3"],"ad":"$b=-3$","sol":"$a=5$ and $5e^{b}=5e^{-3}$.","h":["Use $x=0$ first.","$a=5$.","Equate the exponents at $x=1$."]},{"topic":"Change of base","q":"Solve $3^x=20$ to 2 decimal places.","a":"2.73","alt":["2.727"],"ad":"$x=\\frac{\\ln20}{\\ln3}\\approx2.73$","sol":"$x=\\frac{\\ln20}{\\ln3}=2.7268$.","h":["Take $\\ln$ of both sides.","$x\\ln3=\\ln20$.","Divide and round."]},{"topic":"Stationary","q":"Find the $x$-value of the minimum of $y=e^x-3x$. Give an exact answer.","a":"ln3","alt":["ln(3)","x=ln3"],"ad":"$x=\\ln3$","sol":"$y'=e^x-3=0\\Rightarrow x=\\ln3$; $y''=e^x>0$.","h":["Differentiate.","Set to zero.","Solve with $\\ln$."]},{"topic":"Log equation","q":"Solve $\\log_3x+\\log_3(x-8)=2$.","a":"9","alt":["x=9"],"ad":"$x=9$","sol":"$x(x-8)=9\\Rightarrow x^2-8x-9=0\\Rightarrow x=9$ or $-1$; reject $-1$.","h":["Combine the logs.","Convert to index form.","Check the domain."]},{"topic":"Log derivative","q":"Differentiate $y=\\ln(\\cos x)$ for $0\u003cx\u003c\\frac\\pi2$.","a":"-tanx","alt":["-tan(x)"],"ad":"$-\\tan x$","sol":"$\\frac{-\\sin x}{\\cos x}=-\\tan x$.","h":["Use $\\frac{f'}f$.","$f'=-\\sin x$.","Simplify."]},{"topic":"Tangent","q":"The tangent to $y=\\ln x$ at $x=1$ has what $y$-intercept?","a":"-1","alt":[],"ad":"$-1$","sol":"Gradient $1$ at $(1,0)$: $y=x-1$.","h":["Gradient is $\\frac1x$ at $x=1$.","Point is $(1,0)$.","Write $y=mx+c$."]},{"topic":"Cooling","q":"$T=20+60e^{-0.1t}$. Find $T$ when $t=10$ (1 decimal place).","a":"42.1","alt":["42.07"],"ad":"$\\approx42.1$","sol":"$20+60e^{-1}=20+22.07=42.07$.","h":["Substitute $t=10$.","$e^{-1}\\approx0.3679$.","Multiply and add."]},{"topic":"Doubling","q":"$P=P_0e^{kt}$ triples in 6 years. Find $k$ exactly.","a":"ln3/6","alt":["(ln3)/6","(1/6)ln3","ln(3)/6"],"ad":"$k=\\dfrac{\\ln3}{6}$","sol":"$3=e^{6k}\\Rightarrow k=\\frac{\\ln3}6$.","h":["$3P_0=P_0e^{6k}$.","Cancel $P_0$.","Take $\\ln$."]}],"comets":[{"topic":"Extension: a tangent that passes through the origin","q":"Find the value of $a$ so that the tangent to $y=e^{x}$ at $x=a$ passes through the origin.","a":"1","alt":["a=1"],"ad":"$a=1$","sol":"The tangent at $x=a$ is $y-e^a=e^a(x-a)$. It passes through $(0,0)$ when $-e^a=-ae^a$, so $a=1$.","h":["Write the tangent at $x=a$.","Substitute $(0,0)$ into it.","Cancel $e^a$, which is never zero."]},{"topic":"Extension: solving a hidden quadratic","q":"Solve $\\ln(x)^2=\\ln(x^3)-2$ for $x$ given $\\ln(x)^2$ means $(\\ln x)^2$. Give exact answers.","a":"e and e^2","alt":["e,e^2","x=e,x=e^2","e^2,e"],"ad":"$x=e$ or $x=e^2$","sol":"Let $u=\\ln x$. Then $u^2=3u-2$, so $u^2-3u+2=0$, giving $u=1$ or $u=2$. So $x=e$ or $x=e^2$.","h":["Let $u=\\ln x$.","Use the log law on $\\ln(x^3)$.","Solve the quadratic in $u$."]},{"topic":"Extension: Where does $e^x$ equal its tangent from the origin?","q":"The line $y=mx$ touches $y=e^x$ exactly once. Find $m$ exactly.","a":"e","alt":["m=e"],"ad":"$m=e$","sol":"A tangent at $x=a$ is $y=e^ax+e^a(1-a)$; it passes through the origin when $a=1$, so $m=e$.","h":["Write the tangent at $x=a$.","Force it through $(0,0)$.","Then $m=e^a$."]}],"hours":5},"mm3-c02":{"id":"mm3-c02","interactive":"trigfun","summary":"Trigonometric functions are periodic, so they model tides, temperature and anything that repeats. This chapter works in radians, uses the unit circle for exact values, sketches transformed sine and cosine graphs, differentiates them, and models real cycles.","videos":[{"src":"B","title":"Euler's formula with introductory group theory (3Blue1Brown)","url":"https://www.youtube.com/watch?v=mvmuCPvRoWQ","kind":"video"},{"src":"B","title":"Derivative formulas through geometry (3Blue1Brown, ch. 3)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Derivative+formulas+through+geometry+Essence+of+calculus+chapter+3","kind":"search"},{"src":"J","title":"Unit circle and exact values","url":"https://www.youtube.com/results?search_query=Joel+Speranza+unit+circle+exact+values","kind":"search"},{"src":"J","title":"Trig graphs and transformations","url":"https://www.youtube.com/results?search_query=Joel+Speranza+trigonometric+graphs+transformations","kind":"search"},{"src":"J","title":"Differentiating sin and cos","url":"https://www.youtube.com/results?search_query=Joel+Speranza+differentiation+sin+cos","kind":"search"}],"sections":[{"id":"mm3-c02-s1","code":"2.2","title":"The unit circle and radians","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: radians and the unit circle exact values","url":"https://www.youtube.com/results?search_query=Joel+Speranza+radians+and+the+unit+circle+exact+values","kind":"search"}]},{"t":"p","x":"One **radian** is the angle at the centre of a circle subtended by an arc equal in length to the radius. A full turn is $2\\pi$ radians, so $\\pi$ rad $=180^\\circ$. To convert: degrees $\\times\\frac{\\pi}{180}$ gives radians, and radians $\\times\\frac{180}{\\pi}$ gives degrees."},{"t":"p","x":"On the **unit circle** (radius 1), the point at angle $\\theta$ is $(\\cos\\theta,\\sin\\theta)$. So $\\cos$ is the $x$-coordinate, $\\sin$ is the $y$-coordinate, and $\\tan\\theta=\\frac{\\sin\\theta}{\\cos\\theta}$ is the gradient of the radius."},{"t":"key","x":"Exact values: $\\sin\\frac\\pi6=\\tfrac12$, $\\cos\\frac\\pi6=\\tfrac{\\sqrt3}2$; $\\sin\\frac\\pi4=\\cos\\frac\\pi4=\\tfrac{\\sqrt2}2$; $\\sin\\frac\\pi3=\\tfrac{\\sqrt3}2$, $\\cos\\frac\\pi3=\\tfrac12$. Always: $\\sin^2\\theta+\\cos^2\\theta=1$."},{"t":"p","x":"Use the quadrant to find the sign. In quadrant 1 all are positive; 2 only $\\sin$; 3 only $\\tan$; 4 only $\\cos$. Reduce an angle to its **reference angle** in the first quadrant, then apply the sign."},{"t":"ex","title":"An exact value outside the first quadrant","q":"Find the exact value of $\\sin\\frac{5\\pi}{6}$ and $\\cos\\frac{7\\pi}{6}$.","s":["$\\frac{5\\pi}{6}$ is in quadrant 2 with reference angle $\\frac\\pi6$; $\\sin$ is positive there, so $\\sin\\frac{5\\pi}6=\\frac12$.","$\\frac{7\\pi}{6}$ is in quadrant 3 with reference angle $\\frac\\pi6$; $\\cos$ is negative there, so $\\cos\\frac{7\\pi}6=-\\frac{\\sqrt3}2$."],"a":"$\\tfrac12$ and $-\\tfrac{\\sqrt3}{2}$"},{"t":"ex","title":"Using the Pythagorean identity","q":"If $\\sin\\theta=\\tfrac35$ and $\\theta$ is in quadrant 2, find $\\cos\\theta$ and $\\tan\\theta$.","s":["$\\cos^2\\theta=1-\\tfrac9{25}=\\tfrac{16}{25}$, so $\\cos\\theta=\\pm\\tfrac45$.","Quadrant 2 has negative $\\cos$, so $\\cos\\theta=-\\tfrac45$.","$\\tan\\theta=\\frac{3/5}{-4/5}=-\\tfrac34$."],"a":"$\\cos\\theta=-\\frac45$, $\\tan\\theta=-\\frac34$"},{"t":"warn","x":"Calculator in the wrong mode is the most common lost mark. If the question uses $\\pi$, your CAS or calculator must be in **radians**."},{"t":"tb","rec":"1,2,3,4,5,6,7,9,11","ext":"13,14,16,17,19","x":"Exercise 2.2 covers radian conversion, exact values and the unit circle, arc length and sector area.","code":"2.2"},{"t":"p","x":"**Arc length and sector area.** For a circle of radius $r$ and angle $\\theta$ in radians: arc length $s=r\\theta$ and sector area $A=\\frac12r^2\\theta$. These are only this simple in radians, which is the whole reason radians exist."},{"t":"ex","title":"Sector","q":"A sector has radius $6$ cm and angle $\\frac{2\\pi}3$. Find the arc length and area.","s":["$s=6\\cdot\\frac{2\\pi}3=4\\pi$.","$A=\\frac12\\cdot36\\cdot\\frac{2\\pi}3=12\\pi$."],"a":"$4\\pi$ cm and $12\\pi\\ \\text{cm}^2$"},{"t":"key","x":"**Symmetry identities:** $\\sin(\\pi-\\theta)=\\sin\\theta$, $\\cos(\\pi-\\theta)=-\\cos\\theta$, $\\sin(-\\theta)=-\\sin\\theta$, $\\cos(-\\theta)=\\cos\\theta$, $\\sin\\!\\left(\\tfrac\\pi2-\\theta\\right)=\\cos\\theta$."},{"t":"ex","title":"Using symmetry","q":"Given $\\sin\\theta=0.3$, write $\\sin(\\pi+\\theta)$ and $\\cos\\left(\\frac\\pi2-\\theta\\right)$.","s":["$\\sin(\\pi+\\theta)=-\\sin\\theta=-0.3$.","$\\cos\\left(\\frac\\pi2-\\theta\\right)=\\sin\\theta=0.3$."],"a":"$-0.3$ and $0.3$"}]},{"id":"mm3-c02-s2","code":"2.3","title":"Trigonometric functions and their graphs","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: trigonometric graphs amplitude period","url":"https://www.youtube.com/results?search_query=Joel+Speranza+trigonometric+graphs+amplitude+period","kind":"search"}]},{"t":"p","x":"For $y=a\\sin\\big(b(x-c)\\big)+d$ (and likewise cosine): **amplitude** $|a|$; **period** $\\frac{2\\pi}{b}$; **horizontal shift** $c$; **vertical shift** $d$, with the **midline** $y=d$. The maximum is $d+|a|$ and the minimum is $d-|a|$."},{"t":"p","x":"The graph of $y=\\tan x$ has period $\\pi$ and vertical asymptotes at $x=\\frac\\pi2+n\\pi$. It has no amplitude."},{"t":"ex","title":"Reading a graph","q":"State the amplitude, period, and range of $y=3\\sin(2x)+1$.","s":["Amplitude $=3$. Period $=\\frac{2\\pi}{2}=\\pi$.","Midline $y=1$, so the range is $1-3\\le y\\le 1+3$."],"a":"Amplitude 3, period $\\pi$, range $[-2,4]$."},{"t":"p","x":"**Solving trig equations** on a given domain: find the reference angle from the inverse trig function, then use symmetry for every solution in the domain. For $\\sin$ the two solutions are $\\theta$ and $\\pi-\\theta$; for $\\cos$ they are $\\theta$ and $2\\pi-\\theta$; for $\\tan$ add $\\pi$. If the argument is $2x$, the domain for $2x$ is twice as long, so list more solutions before dividing."},{"t":"ex","title":"Solving on a domain","q":"Solve $2\\sin(2x)=\\sqrt3$ for $0\\le x\\le\\pi$.","s":["$\\sin(2x)=\\frac{\\sqrt3}2$, and $0\\le 2x\\le 2\\pi$.","$2x=\\frac\\pi3$ or $\\frac{2\\pi}3$.","$x=\\frac\\pi6$ or $\\frac\\pi3$."],"a":"$x=\\frac\\pi6,\\ \\frac\\pi3$"},{"t":"warn","x":"Change the domain **first**. For $\\sin(2x)$ on $0\\le x\\le\\pi$ you need $0\\le 2x\\le 2\\pi$. Forgetting that doubling the argument doubles the interval loses half the solutions."},{"t":"int","name":"trigfun","cap":"Change amplitude, period and shifts and see the equation and key features update."},{"t":"tb","rec":"1,3,6,8,10,12","ext":"13,15,16,17,19","x":"Exercise 2.3 covers graphs of $\\sin$, $\\cos$, $\\tan$ with transformations and solving equations on a domain.","code":"2.3"},{"t":"ex","title":"Reading an equation from a graph","q":"A sine curve has maximum $5$ at $x=\\frac\\pi6$, minimum $-1$, and period $\\pi$. Find a cosine model.","s":["Midline $d=\\frac{5+(-1)}2=2$; amplitude $a=3$; $b=\\frac{2\\pi}\\pi=2$.","A maximum at $x=\\frac\\pi6$ means the cosine is shifted right by $\\frac\\pi6$."],"a":"$y=3\\cos\\left(2\\left(x-\\frac\\pi6\\right)\\right)+2$"},{"t":"ex","title":"Tan equation","q":"Solve $\\tan x=-1$ for $0\\le x\\le2\\pi$.","s":["Reference angle $\\frac\\pi4$; tangent is negative in quadrants 2 and 4."],"a":"$x=\\frac{3\\pi}4,\\ \\frac{7\\pi}4$"},{"t":"p","x":"**Equations with a quadratic.** For $2\\sin^2x-\\sin x=0$, factorise: $\\sin x(2\\sin x-1)=0$, so $\\sin x=0$ or $\\sin x=\\frac12$. Never divide by $\\sin x$, because you lose solutions."},{"t":"ex","title":"Trig quadratic","q":"Solve $2\\sin^2x-\\sin x=0$ for $0\\le x\\le2\\pi$.","s":["$\\sin x=0\\Rightarrow x=0,\\pi,2\\pi$.","$\\sin x=\\frac12\\Rightarrow x=\\frac\\pi6,\\frac{5\\pi}6$."],"a":"$x=0,\\ \\frac\\pi6,\\ \\frac{5\\pi}6,\\ \\pi,\\ 2\\pi$"}]},{"id":"mm3-c02-s3","code":"2.4","title":"Differentiating trigonometric functions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: differentiating sin and cos","url":"https://www.youtube.com/results?search_query=Joel+Speranza+differentiating+sin+and+cos","kind":"search"},{"src":"B","title":"3Blue1Brown: Derivative formulas through geometry","url":"https:/
