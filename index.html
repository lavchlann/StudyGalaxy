/www.youtube.com/results?search_query=3Blue1Brown+Derivative+formulas+through+geometry","kind":"search"}]},{"t":"key","x":"$$\\frac{d}{dx}\\sin x=\\cos x,\\qquad\\frac{d}{dx}\\cos x=-\\sin x,\\qquad\\frac{d}{dx}\\tan x=\\sec^2x=\\frac1{\\cos^2x}$$"},{"t":"p","x":"With the chain rule: $\\frac{d}{dx}\\sin(f(x))=f'(x)\\cos(f(x))$ and $\\frac{d}{dx}\\cos(f(x))=-f'(x)\\sin(f(x))$. These only hold when $x$ is in **radians**."},{"t":"ex","title":"Chain rule with trig","q":"Differentiate $y=\\sin(3x)+\\cos(x^2)$.","s":["$\\frac{d}{dx}\\sin(3x)=3\\cos(3x)$.","$\\frac{d}{dx}\\cos(x^2)=-2x\\sin(x^2)$."],"a":"$y'=3\\cos(3x)-2x\\sin(x^2)$"},{"t":"ex","title":"Stationary points of a trig graph","q":"Find where $y=\\sin x+\\cos x$ has stationary points on $0\\le x\\le 2\\pi$.","s":["$y'=\\cos x-\\sin x=0\\Rightarrow\\tan x=1$.","$x=\\frac\\pi4$ or $\\frac{5\\pi}{4}$."],"a":"$x=\\frac\\pi4$ and $x=\\frac{5\\pi}4$"},{"t":"warn","x":"$\\frac{d}{dx}\\sin(x^2)\\neq\\cos(x^2)$. You must multiply by the derivative of the inside. Also, $\\frac{d}{dx}\\cos x$ is **negative** sine."},{"t":"tb","rec":"1,2,4,5,6,9,11,12","ext":"14,15,17,19","x":"Exercise 2.4 differentiates $\\sin$, $\\cos$, $\\tan$ with the chain rule, then finds tangents, normals and stationary points.","code":"2.4"},{"t":"ex","title":"Tangent to a sine curve","q":"Find the equation of the tangent to $y=\\sin x$ at $x=\\frac\\pi3$.","s":["$y'=\\cos x$, gradient $\\frac12$; point $\\left(\\frac\\pi3,\\frac{\\sqrt3}2\\right)$.","$y-\\frac{\\sqrt3}2=\\frac12\\left(x-\\frac\\pi3\\right)$."],"a":"$y=\\frac12x+\\frac{\\sqrt3}2-\\frac\\pi6$"},{"t":"ex","title":"Product with trig","q":"Differentiate $y=x\\sin x$.","s":["Product rule: $1\\cdot\\sin x+x\\cos x$."],"a":"$\\sin x+x\\cos x$"},{"t":"ex","title":"Differentiating tan","q":"Differentiate $y=\\tan(3x)$.","s":["$\\frac d{dx}\\tan u=u'\\sec^2u$ with $u=3x$."],"a":"$3\\sec^2(3x)$"}]},{"id":"mm3-c02-s4","code":"2.5","title":"Modelling with trigonometric functions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: trigonometric modelling tides","url":"https://www.youtube.com/results?search_query=Joel+Speranza+trigonometric+modelling+tides","kind":"search"}]},{"t":"p","x":"A periodic situation like tides, daylight hours or a Ferris wheel is modelled by $y=a\\sin\\big(b(t-c)\\big)+d$ or a cosine. Steps: find the midline from $\\frac{\\max+\\min}2$; the amplitude from $\\frac{\\max-\\min}2$; the period from the time between peaks; then use $b=\\frac{2\\pi}{\\text{period}}$."},{"t":"ex","title":"Building a model","q":"Water depth varies between 2 m and 6 m with a period of 12 hours, and is at its maximum at $t=0$. Find a model.","s":["Midline $=\\frac{2+6}2=4$; amplitude $=2$; $b=\\frac{2\\pi}{12}=\\frac\\pi6$.","Max at $t=0$ suggests cosine with no shift."],"a":"$D=2\\cos\\left(\\frac{\\pi t}6\\right)+4$"},{"t":"ex","title":"Using the model","q":"When is the depth first equal to 5 m?","s":["$2\\cos\\left(\\frac{\\pi t}{6}\\right)+4=5\\Rightarrow\\cos\\left(\\frac{\\pi t}6\\right)=\\frac12$.","$\\frac{\\pi t}{6}=\\frac\\pi3\\Rightarrow t=2$."],"a":"$t=2$ hours"},{"t":"p","x":"Rate of change is the derivative. $\\frac{dD}{dt}=-\\frac\\pi3\\sin\\left(\\frac{\\pi t}6\\right)$, which is zero at the highest and lowest tide and most negative halfway down."},{"t":"tb","rec":"1,2,4,6,8,9,12","ext":"13,15,17,20","x":"Exercise 2.5 is context modelling: tides, temperature, Ferris wheels and rates of change.","code":"2.5"},{"t":"ex","title":"Ferris wheel","q":"A wheel of radius $10$ m has its lowest point $2$ m above ground and turns once every $40$ s. Starting at the lowest point, model the height $h(t)$.","s":["Midline $12$, amplitude $10$, $b=\\frac{2\\pi}{40}=\\frac\\pi{20}$.","Starting at the minimum suggests $-\\cos$."],"a":"$h(t)=12-10\\cos\\left(\\frac{\\pi t}{20}\\right)$"},{"t":"ex","title":"Temperature model","q":"$T=18+6\\sin\\left(\\frac{\\pi}{12}(t-9)\\right)$. Find the maximum, when it occurs in the first 24 hours, and the rate of change at $t=9$.","s":["Max is $24$ when $\\frac\\pi{12}(t-9)=\\frac\\pi2\\Rightarrow t=15$.","$T'=\\frac\\pi2\\cos\\left(\\frac\\pi{12}(t-9)\\right)$; at $t=9$ it is $\\frac\\pi2\\approx1.57$."],"a":"$24^\\circ$C at $t=15$; rising at about $1.57^\\circ$C per hour."}]},{"id":"mm3-c02-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Radians first.** Check mode before any trig calculation. Unit-circle exact values must be exact; do not leave $0.866$ when $\\frac{\\sqrt3}2$ is asked."},{"t":"p","x":"**Solving trig equations, a routine.** (1) Isolate the trig function. (2) Find the reference angle. (3) Use quadrants for all solutions. (4) For $\\sin(bx)$, extend the domain to $b$ times its length before solving. (5) Divide by $b$ at the end."},{"t":"p","x":"**Modelling routine.** Max and min give midline and amplitude; the time between peaks gives the period; a known point (for example a max at $t=0$) selects sine or cosine and the shift. Check by substituting a point."},{"t":"ex","title":"Mixed problem","q":"Find the maximum value of $f(x)=3\\sin x+4\\cos x$ by differentiating, on $0\\le x\\le\\frac\\pi2$.","s":["$f'=3\\cos x-4\\sin x=0\\Rightarrow\\tan x=\\frac34$, $x\\approx0.6435$.","$\\sin x=\\frac35$, $\\cos x=\\frac45$, so $f=\\frac95+\\frac{16}5=5$."],"a":"Maximum value $5$ at $x\\approx0.644$."},{"t":"warn","x":"Frequent errors: using degrees, forgetting the negative in $\\frac d{dx}\\cos$, missing solutions when the argument is $2x$, and writing $\\sin^2x$ as $\\sin x^2$."}]}],"quiz":[{"topic":"Radians","q":"Convert $150^\\circ$ to radians. Give an exact answer.","a":"5pi/6","alt":["(5pi)/6","5\u03c0/6","5/6pi"],"ad":"$\\dfrac{5\\pi}{6}$","sol":"$150\\times\\frac{\\pi}{180}=\\frac{5\\pi}6$.","h":["Multiply by $\\frac{\\pi}{180}$.","Simplify $\\frac{150}{180}$.","$\\frac{150}{180}=\\frac56$."]},{"topic":"Exact value","q":"Find the exact value of $\\cos\\frac{2\\pi}{3}$.","a":"-1/2","alt":["-0.5","-(1/2)"],"ad":"$-\\tfrac12$","sol":"Reference angle $\\frac\\pi3$, quadrant 2 so cosine is negative: $-\\frac12$.","h":["Find the reference angle.","Which quadrant is $\\frac{2\\pi}3$ in?","Cosine is negative in quadrant 2."]},{"topic":"Amplitude and period","q":"State the period of $y=4\\cos(3x)-2$ as an exact value.","a":"2pi/3","alt":["(2pi)/3","2\u03c0/3"],"ad":"$\\dfrac{2\\pi}{3}$","sol":"Period $=\\frac{2\\pi}{b}=\\frac{2\\pi}3$.","h":["Period formula.","$b=3$.","Divide $2\\pi$ by 3."]},{"topic":"Range","q":"State the maximum value of $y=4\\cos(3x)-2$.","a":"2","alt":["y=2","max=2"],"ad":"$2$","sol":"Max $=d+|a|=-2+4=2$.","h":["Midline is $y=-2$.","Amplitude is 4.","Add them."]},{"topic":"Derivative","q":"Differentiate $y=\\sin(5x)$.","a":"5cos(5x)","alt":["5cos5x"],"ad":"$5\\cos(5x)$","sol":"Chain rule: inside derivative 5, times $\\cos(5x)$.","h":["Identify the inside.","Derivative of sin is cos.","Multiply by 5."]},{"topic":"Derivative","q":"Differentiate $y=\\cos(x^2)$.","a":"-2xsin(x^2)","alt":["-2x sin(x^2)","-2xsin(x\u00b2)"],"ad":"$-2x\\sin(x^2)$","sol":"$\\frac{d}{dx}\\cos u=-u'\\sin u$ with $u=x^2$, $u'=2x$.","h":["Cosine differentiates to negative sine.","Inside is $x^2$.","Multiply by $2x$."]},{"topic":"Solve","q":"Solve $2\\cos x=1$ for $0\\le x\\le 2\\pi$. List the solutions separated by commas, in order.","a":"pi/3,5pi/3","alt":["pi/3 and 5pi/3","\u03c0/3,5\u03c0/3","x=pi/3,5pi/3"],"ad":"$x=\\frac\\pi3,\\ \\frac{5\\pi}{3}$","sol":"$\\cos x=\\frac12$ gives reference angle $\\frac\\pi3$; cosine positive in quadrants 1 and 4: $\\frac\\pi3$ and $2\\pi-\\frac\\pi3=\\frac{5\\pi}3$.","h":["Isolate $\\cos x$.","Reference angle is $\\frac\\pi3$.","The second solution is $2\\pi-\\frac\\pi3$."]},{"topic":"Identity","q":"If $\\cos\\theta=\\frac{5}{13}$ and $\\theta$ is in quadrant 4, find $\\sin\\theta$.","a":"-12/13","alt":["-(12/13)"],"ad":"$-\\tfrac{12}{13}$","sol":"$\\sin^2\\theta=1-\\frac{25}{169}=\\frac{144}{169}$; quadrant 4 has negative sine, so $-\\frac{12}{13}$.","h":["Use $\\sin^2+\\cos^2=1$.","$\\sin^2\\theta=\\frac{144}{169}$.","Check the sign for quadrant 4."]},{"topic":"Model","q":"A model is $T=8\\sin\\left(\\frac{\\pi t}{12}\\right)+20$. Find the maximum temperature.","a":"28","alt":["28 degrees","T=28"],"ad":"$28$","sol":"Max $=20+8=28$.","h":["Midline is 20.","Amplitude is 8.","Add them."]},{"topic":"Stationary","q":"Find the first positive $x$ with $\\frac{d}{dx}\\sin x=0$. Give an exact value.","a":"pi/2","alt":["\u03c0/2","x=pi/2"],"ad":"$\\dfrac\\pi2$","sol":"$\\cos x=0$ first at $x=\\frac\\pi2$.","h":["Differentiate.","Set $\\cos x=0$.","Smallest positive solution."]},{"topic":"Sector","q":"Find the arc length of a sector with radius $5$ and angle $\\frac{3\\pi}{5}$.","a":"3pi","alt":["3\u03c0"],"ad":"$3\\pi$","sol":"$s=r\\theta=5\\cdot\\frac{3\\pi}5=3\\pi$.","h":["$s=r\\theta$.","Substitute.","Cancel the 5."]},{"topic":"Symmetry","q":"If $\\cos\\theta=\\frac13$, find $\\cos(\\pi-\\theta)$.","a":"-1/3","alt":[],"ad":"$-\\tfrac13$","sol":"$\\cos(\\pi-\\theta)=-\\cos\\theta$.","h":["Symmetry identity.","Negative.","Substitute."]},{"topic":"Model","q":"A curve has max $7$ and min $1$. Find its midline value $d$.","a":"4","alt":[],"ad":"$4$","sol":"$\\frac{7+1}2=4$.","h":["Average of max and min.","$8\\div2$.","Compute."]},{"topic":"Tan","q":"Solve $\\tan x=\\sqrt3$ for $0\\le x\\le\\pi$.","a":"pi/3","alt":["\u03c0/3"],"ad":"$x=\\frac\\pi3$","sol":"Reference angle $\\frac\\pi3$; the next solution $\\frac{4\\pi}3$ is outside the domain.","h":["$\\tan\\frac\\pi3=\\sqrt3$.","Period is $\\pi$.","Check the domain."]},{"topic":"Trig quadratic","q":"Solve $2\\cos^2x=\\cos x$ for $0\\le x\\le\\frac\\pi2$.","a":"pi/3,pi/2","alt":["pi/3 and pi/2","\u03c0/3,\u03c0/2","x=pi/3,pi/2"],"ad":"$x=\\frac\\pi3,\\ \\frac\\pi2$","sol":"$\\cos x(2\\cos x-1)=0$: $\\cos x=0\\Rightarrow x=\\frac\\pi2$; $\\cos x=\\frac12\\Rightarrow x=\\frac\\pi3$.","h":["Factorise.","Two cases.","Check the domain."]},{"topic":"Derivative","q":"Differentiate $y=x\\cos x$.","a":"cosx-xsinx","alt":["cos(x)-xsin(x)","cos x - x sin x"],"ad":"$\\cos x-x\\sin x$","sol":"Product rule: $\\cos x+x(-\\sin x)$.","h":["Product rule.","$u=x$, $v=\\cos x$.","Combine."]},{"topic":"Derivative","q":"Differentiate $y=\\tan(2x)$.","a":"2sec^2(2x)","alt":["2/cos^2(2x)"],"ad":"$2\\sec^2(2x)$","sol":"Chain rule with $\\frac d{dx}\\tan u=u'\\sec^2u$.","h":["Inside is $2x$.","Derivative of $\\tan$.","Multiply by 2."]},{"topic":"Ferris wheel","q":"$h=12-10\\cos\\left(\\frac{\\pi t}{20}\\right)$. Find $h$ when $t=20$.","a":"22","alt":[],"ad":"$22$","sol":"$\\cos\\pi=-1$, so $12+10=22$.","h":["$\\frac{\\pi\\cdot20}{20}=\\pi$.","$\\cos\\pi=-1$.","Compute."]},{"topic":"Gradient","q":"Find the gradient of $y=\\sin(2x)$ at $x=0$.","a":"2","alt":[],"ad":"$2$","sol":"$y'=2\\cos2x$; at $0$ it is $2$.","h":["Chain rule.","$2\\cos2x$.","$\\cos0=1$."]},{"topic":"Max value","q":"Maximum of $y=5\\cos x+12$?","a":"17","alt":[],"ad":"$17$","sol":"$12+5=17$.","h":["Amplitude 5.","Midline 12.","Add."]}],"comets":[{"topic":"Extension: Maximum of a sum","q":"Show that the greatest value of $y=\\sin x+\\cos x$ is $\\sqrt{2}$, by evaluating it at the stationary point $x=\\frac\\pi4$. Enter the value at $x=\\frac\\pi4$ as an exact number.","a":"sqrt2","alt":["sqrt(2)","\u221a2","2^(1/2)"],"ad":"$\\sqrt2$","sol":"$\\sin\\frac\\pi4+\\cos\\frac\\pi4=\\frac{\\sqrt2}2+\\frac{\\sqrt2}2=\\sqrt2$.","h":["Substitute $x=\\frac\\pi4$.","Both exact values equal $\\frac{\\sqrt2}{2}$.","Add."]},{"topic":"Extension: Where is the tide rising fastest?","q":"For $D=2\\cos\\left(\\frac{\\pi t}6\\right)+4$ on $0\\le t\\le12$, find the greatest rate of change of $D$ (a positive number, in m/h). Give it exactly.","a":"pi/3","alt":["\u03c0/3","(pi)/3"],"ad":"$\\dfrac\\pi3$","sol":"$D'=-\\frac\\pi3\\sin\\left(\\frac{\\pi t}6\\right)$, whose greatest magnitude is $\\frac\\pi3$.","h":["Differentiate $D$.","The largest $|\\sin|$ is 1.","Read off the coefficient."]},{"topic":"Extension: Maximum of a combined wave","q":"For $f(x)=3\\sin x+4\\cos x$, the maximum value over all $x$ is?","a":"5","alt":[],"ad":"$5$","sol":"Write as $R\\sin(x+\\alpha)$ with $R=\\sqrt{3^2+4^2}=5$.","h":["Find the stationary point.","$\\tan x=\\frac34$.","Use the 3-4-5 triangle."]}],"hours":4},"mm3-c03":{"id":"mm3-c03","interactive":"tangent","summary":"Three rules (chain, product, quotient) let you differentiate almost any function you will meet. This chapter drills each rule, shows how to combine them, and applies them to tangents, normals, kinematics and optimisation.","videos":[{"src":"B","title":"Visualizing the chain rule and product rule (3Blue1Brown, ch. 4)","url":"https://www.youtube.com/watch?v=YG15m2VwSjA","kind":"video"},{"src":"J","title":"Chain rule","url":"https://www.youtube.com/results?search_query=Joel+Speranza+chain+rule+differentiation","kind":"search"},{"src":"J","title":"Product rule","url":"https://www.youtube.com/results?search_query=Joel+Speranza+product+rule+differentiation","kind":"search"},{"src":"J","title":"Quotient rule","url":"https://www.youtube.com/results?search_query=Joel+Speranza+quotient+rule+differentiation","kind":"search"}],"sections":[{"id":"mm3-c03-s1","code":"3.2","title":"The chain rule","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: chain rule","url":"https://www.youtube.com/results?search_query=Joel+Speranza+chain+rule","kind":"search"},{"src":"B","title":"3Blue1Brown: Visualizing the chain rule and product rule","url":"https://www.youtube.com/watch?v=YG15m2VwSjA","kind":"video"}]},{"t":"p","x":"A **composite function** is a function inside a function, $y=f(g(x))$. Let $u=g(x)$. Then $y=f(u)$ and"},{"t":"key","x":"$$\\frac{dy}{dx}=\\frac{dy}{du}\\cdot\\frac{du}{dx}\\qquad\\text{equivalently}\\qquad \\big[f(g(x))\\big]'=f'(g(x))\\,g'(x)$$"},{"t":"p","x":"In words: differentiate the outside (leaving the inside alone), then multiply by the derivative of the inside. Special case: $\\frac{d}{dx}(ax+b)^n=na(ax+b)^{n-1}$."},{"t":"ex","title":"Chain rule","q":"Differentiate $y=(3x^2+1)^5$.","s":["Let $u=3x^2+1$, so $y=u^5$. $\\frac{dy}{du}=5u^4$, $\\frac{du}{dx}=6x$.","$\\frac{dy}{dx}=5(3x^2+1)^4\\cdot6x=30x(3x^2+1)^4$."],"a":"$30x(3x^2+1)^4$"},{"t":"ex","title":"Chain rule with a root","q":"Differentiate $y=\\sqrt{2x-1}$.","s":["Write $y=(2x-1)^{1/2}$. Then $y'=\\frac12(2x-1)^{-1/2}\\cdot2$.","$y'=\\frac{1}{\\sqrt{2x-1}}$."],"a":"$\\dfrac1{\\sqrt{2x-1}}$"},{"t":"warn","x":"Forgetting to multiply by the inside derivative is the number one chain rule error. After you differentiate, ask: \"did I multiply by $u'$?\""},{"t":"tb","rec":"1,3,4,7,12","ext":"12,16,17,20","x":"Exercise 3.2 practises chain rule with powers, roots, exponentials, logs and trig, including nested compositions.","code":"3.2"},{"t":"ex","title":"Chain rule, three layers","q":"Differentiate $y=\\sin^3(2x)$.","s":["Treat as $u^3$ with $u=\\sin(2x)$: $3u^2\\cdot u'$.","$u'=2\\cos(2x)$."],"a":"$6\\sin^2(2x)\\cos(2x)$"},{"t":"ex","title":"Chain rule with e","q":"Differentiate $y=e^{\\sin x}$.","s":["Outside $e^u$ gives $e^u$, inside $u=\\sin x$ gives $\\cos x$."],"a":"$\\cos x\\,e^{\\sin x}$"},{"t":"p","x":"**Why it works.** Rates multiply: if $y$ changes $\\frac{dy}{du}$ times as fast as $u$, and $u$ changes $\\frac{du}{dx}$ times as fast as $x$, then $y$ changes $\\frac{dy}{du}\\cdot\\frac{du}{dx}$ times as fast as $x$. Say the rule out loud: \"derivative of the outside, leave the inside alone, times derivative of the inside\"."}]},{"id":"mm3-c03-s2","code":"3.3","title":"The product rule","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: product rule","url":"https://www.youtube.com/results?search_query=Joel+Speranza+product+rule","kind":"search"},{"src":"B","title":"3Blue1Brown: Visualizing the chain rule and product rule","url":"https://www.youtube.com/watch?v=YG15m2VwSjA","kind":"video"}]},{"t":"key","x":"$$\\frac{d}{dx}(uv)=u'v+uv'$$"},{"t":"p","x":"Use it when two functions containing $x$ are **multiplied**. Choose $u$ and $v$, find $u'$ and $v'$ separately, assemble, then **factorise** the answer."},{"t":"ex","title":"Product rule","q":"Differentiate $y=x^2e^{3x}$.","s":["$u=x^2$, $u'=2x$; $v=e^{3x}$, $v'=3e^{3x}$.","$y'=2xe^{3x}+x^2\\cdot3e^{3x}=xe^{3x}(2+3x)$."],"a":"$y'=xe^{3x}(3x+2)$"},{"t":"ex","title":"Stationary point using the product rule","q":"Find the stationary point of $y=x\\ln x$ for $x>0$.","s":["$y'=1\\cdot\\ln x+x\\cdot\\frac1x=\\ln x+1$.","$\\ln x+1=0\\Rightarrow x=e^{-1}$, and $y=e^{-1}\\ln e^{-1}=-e^{-1}$."],"a":"$\\left(e^{-1},-e^{-1}\\right)$"},{"t":"warn","x":"$(uv)'$ is **not** $u'v'$. Check with $x\\cdot x$: the derivative of $x^2$ is $2x$, but $u'v'$ would give $1$."},{"t":"tb","rec":"1,5,6,8,10,11,12","ext":"14,16,17,19","x":"Exercise 3.3 uses the product rule alone and combined with chain rule, then finds tangents and turning points.","code":"3.3"},{"t":"ex","title":"Product of three pieces","q":"Differentiate $y=x^2e^{x}\\sin x$.","s":["Differentiate one factor at a time, keeping the others: $2xe^x\\sin x+x^2e^x\\sin x+x^2e^x\\cos x$."],"a":"$xe^x\\left(2\\sin x+x\\sin x+x\\cos x\\right)$"},{"t":"ex","title":"Product with chain","q":"Differentiate $y=x\\,e^{-2x}$ and find its stationary point.","s":["$y'=e^{-2x}-2xe^{-2x}=e^{-2x}(1-2x)$.","$e^{-2x}>0$, so $y'=0\\Rightarrow x=\\frac12$."],"a":"$y'=e^{-2x}(1-2x)$; stationary at $x=\\frac12$."}]},{"id":"mm3-c03-s3","code":"3.4","title":"The quotient rule","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: quotient rule","url":"https://www.youtube.com/results?search_query=Joel+Speranza+quotient+rule","kind":"search"}]},{"t":"key","x":"$$\\frac{d}{dx}\\left(\\frac uv\\right)=\\frac{u'v-uv'}{v^2}$$"},{"t":"p","x":"The numerator order matters: it is \"bottom times derivative of top **minus** top times derivative of bottom\", all over bottom squared. If the denominator is a single power of $x$, rewrite as a product with a negative index instead."},{"t":"ex","title":"Quotient rule","q":"Differentiate $y=\\dfrac{x}{x^2+1}$.","s":["$u=x$, $u'=1$; $v=x^2+1$, $v'=2x$.","$y'=\\frac{1\\cdot(x^2+1)-x\\cdot2x}{(x^2+1)^2}=\\frac{1-x^2}{(x^2+1)^2}$."],"a":"$\\dfrac{1-x^2}{(x^2+1)^2}$"},{"t":"ex","title":"Quotient rule with e","q":"Differentiate $y=\\dfrac{e^{2x}}{x}$.","s":["$u=e^{2x}$, $u'=2e^{2x}$; $v=x$, $v'=1$.","$y'=\\frac{2xe^{2x}-e^{2x}}{x^2}=\\frac{e^{2x}(2x-1)}{x^2}$."],"a":"$\\dfrac{e^{2x}(2x-1)}{x^2}$"},{"t":"warn","x":"Swapping the numerator terms flips the sign of your answer. Memorise the order, then check it with a simple case like $\\frac{x}{1}$."},{"t":"tb","rec":"1,3,5,7,11","ext":"13,14,17,20","x":"Exercise 3.4 practises quotient rule with every function type learned so far.","code":"3.4"},{"t":"ex","title":"Quotient with logs","q":"Differentiate $y=\\dfrac{\\ln x}{x}$ and find where it is stationary.","s":["$y'=\\dfrac{\\frac1x\\cdot x-\\ln x\\cdot1}{x^2}=\\dfrac{1-\\ln x}{x^2}$.","Zero when $\\ln x=1$, so $x=e$."],"a":"$y'=\\dfrac{1-\\ln x}{x^2}$; stationary at $x=e$."},{"t":"warn","x":"Many quotient problems are easier as products: $\\frac{e^x}{x^2}=e^xx^{-2}$. Choose whichever you trust under pressure."}]},{"id":"mm3-c03-s4","code":"3.5","title":"Applications of differentiation","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: tangents normals and optimisation","url":"https://www.youtube.com/results?search_query=Joel+Speranza+tangents+normals+and+optimisation","kind":"search"}]},{"t":"p","x":"**Tangent:** at $x=a$ the gradient is $f'(a)$, so $y-f(a)=f'(a)(x-a)$. **Normal:** perpendicular to the tangent, gradient $-\\frac1{f'(a)}$."},{"t":"p","x":"**Kinematics:** if $x(t)$ is position, velocity is $v=\\frac{dx}{dt}$ and acceleration is $a=\\frac{dv}{dt}$. The particle is at rest when $v=0$."},{"t":"p","x":"**Optimisation (preview):** to maximise or minimise a quantity, write it as a function of one variable, set the derivative to zero, then confirm it is a max or min."},{"t":"ex","title":"Normal to a curve","q":"Find the equation of the normal to $y=\\ln x$ at $x=1$.","s":["$y'=\\frac1x$, so at $x=1$ the tangent gradient is $1$. The normal gradient is $-1$.","Point $(1,0)$. Normal: $y-0=-1(x-1)$."],"a":"$y=-x+1$"},{"t":"ex","title":"Kinematics","q":"A particle has $x=t^2e^{-t}$ for $t\\ge0$. When is it at rest?","s":["$v=2te^{-t}-t^2e^{-t}=te^{-t}(2-t)$.","$v=0\\Rightarrow t=0$ or $t=2$."],"a":"$t=0$ and $t=2$"},{"t":"tb","rec":"1,5,7,10,11,12","ext":"13,15,19,20","x":"Exercise 3.5 applies the rules to tangents and normals, rates of change, kinematics and optimisation.","code":"3.5"},{"t":"ex","title":"Normal line","q":"Find the normal to $y=e^{2x}$ at $x=0$.","s":["$y'=2e^{2x}$, tangent gradient $2$; normal gradient $-\\frac12$; point $(0,1)$."],"a":"$y=-\\frac12x+1$"},{"t":"ex","title":"Optimisation by differentiation","q":"A rectangle has perimeter $40$. Find the maximum area.","s":["Sides $x$ and $20-x$, area $A=x(20-x)=20x-x^2$.","$A'=20-2x=0\\Rightarrow x=10$; $A''=-2\u003c0$ so a maximum."],"a":"$100$ square units (a square, $10\\times10$)."}]},{"id":"mm3-c03-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Spotting the rule.** Sum or difference: differentiate each term. Product of two functions of $x$: product rule. Fraction with $x$ in the denominator: quotient rule (or a product with a negative power). Function inside a function: chain rule. Many questions need two of these at once."},{"t":"p","x":"**Verification habit.** After differentiating, test at one value. For $y=x e^{-2x}$ at $x=0$: $y'=e^0(1-0)=1$, and the curve visibly rises from the origin. A thirty second sanity check catches sign errors."}]}],"quiz":[{"topic":"Chain rule","q":"Differentiate $y=(4x-1)^3$.","a":"12(4x-1)^2","alt":[],"ad":"$12(4x-1)^2$","sol":"$3(4x-1)^2\\cdot4=12(4x-1)^2$.","h":["Outside: power 3.","Inside derivative is 4.","Multiply them."]},{"topic":"Chain rule","q":"Differentiate $y=\\sqrt{x^2+9}$.","a":"x/sqrt(x^2+9)","alt":["x/(x^2+9)^(1/2)","x/\u221a(x^2+9)"],"ad":"$\\dfrac{x}{\\sqrt{x^2+9}}$","sol":"$\\frac12(x^2+9)^{-1/2}\\cdot2x=\\frac{x}{\\sqrt{x^2+9}}$.","h":["Rewrite as a power of $\\frac12$.","Inside derivative is $2x$.","Simplify the $\\frac12\\times2$."]},{"topic":"Product rule","q":"Differentiate $y=xe^{x}$.","a":"(x+1)e^x","alt":["e^x(x+1)","e^x+xe^x","xe^x+e^x"],"ad":"$(x+1)e^x$","sol":"$1\\cdot e^x+x\\cdot e^x=(x+1)e^x$.","h":["$u=x$, $v=e^x$.","Product rule.","Factorise."]},{"topic":"Product rule","q":"Differentiate $y=x^3\\ln x$.","a":"x^2(3ln x+1)","alt":["x^2(3lnx+1)","3x^2lnx+x^2","x^2+3x^2ln(x)"],"ad":"$x^2(3\\ln x+1)$","sol":"$3x^2\\ln x+x^3\\cdot\\frac1x=3x^2\\ln x+x^2=x^2(3\\ln x+1)$.","h":["$u=x^3$, $v=\\ln x$.","$v'=\\frac1x$.","Factorise $x^2$."]},{"topic":"Quotient","q":"Differentiate $y=\\dfrac{x}{x+1}$.","a":"1/(x+1)^2","alt":["(x+1)^(-2)"],"ad":"$\\dfrac{1}{(x+1)^2}$","sol":"$\\frac{1(x+1)-x(1)}{(x+1)^2}=\\frac1{(x+1)^2}$.","h":["Quotient rule.","Numerator: $(x+1)-x$.","Simplify."]},{"topic":"Quotient","q":"Differentiate $y=\\dfrac{\\sin x}{x}$.","a":"(xcosx-sinx)/x^2","alt":["(x cos x - sin x)/x^2","(xcos(x)-sin(x))/x^2"],"ad":"$\\dfrac{x\\cos x-\\sin x}{x^2}$","sol":"$\\frac{x\\cos x-\\sin x\\cdot1}{x^2}$.","h":["$u=\\sin x$, $v=x$.","Quotient rule.","Keep the order."]},{"topic":"Tangent","q":"Find the gradient of $y=x^2e^{-x}$ at $x=1$. Give an exact answer.","a":"1/e","alt":["e^(-1)","1e^-1"],"ad":"$e^{-1}$","sol":"$y'=2xe^{-x}-x^2e^{-x}$; at $x=1$: $2e^{-1}-e^{-1}=e^{-1}$.","h":["Product rule.","Substitute $x=1$.","Collect terms."]},{"topic":"Stationary","q":"Find the positive $x$ where $y=x^2e^{-x}$ has a stationary point.","a":"2","alt":["x=2"],"ad":"$x=2$","sol":"$y'=xe^{-x}(2-x)=0\\Rightarrow x=2$ (positive).","h":["Product rule.","Factorise.","Set each factor to 0."]},{"topic":"Kinematics","q":"$x=t^3-6t^2$. Find the velocity when $t=1$.","a":"-9","alt":["v=-9"],"ad":"$-9$","sol":"$v=3t^2-12t$; $v(1)=3-12=-9$.","h":["Velocity is the derivative.","Differentiate.","Substitute."]},{"topic":"Normal","q":"Find the gradient of the normal to $y=e^{x}$ at $x=0$.","a":"-1","alt":["m=-1"],"ad":"$-1$","sol":"Tangent gradient is $e^0=1$, so normal gradient is $-1$.","h":["Tangent gradient first.","Normal is perpendicular.","Negative reciprocal."]},{"topic":"Chain rule","q":"Differentiate $y=(3x^2+1)^4$.","a":"24x(3x^2+1)^3","alt":[],"ad":"$24x(3x^2+1)^3$","sol":"$4(3x^2+1)^3\\cdot6x$.","h":["Outer power.","Inner derivative is $6x$.","Multiply."]},{"topic":"Chain with exp","q":"Differentiate $y=e^{x^2+1}$.","a":"2xe^(x^2+1)","alt":["2x*e^(x^2+1)"],"ad":"$2xe^{x^2+1}$","sol":"$e^{u}\\cdot u'$ with $u'=2x$.","h":["Inside is $x^2+1$.","Derivative $2x$.","Keep $e^u$."]},{"topic":"Product","q":"Differentiate $y=x^2\\ln x$.","a":"2xlnx+x","alt":["x(2lnx+1)","2xln(x)+x"],"ad":"$2x\\ln x+x$","sol":"$2x\\ln x+x^2\\cdot\\frac1x$.","h":["Product rule.","$u=x^2$, $v=\\ln x$.","Simplify $x^2\\cdot\\frac1x$."]},{"topic":"Quotient","q":"Differentiate $y=\\dfrac{e^x}{x}$.","a":"e^x(x-1)/x^2","alt":["(xe^x-e^x)/x^2","(e^x(x-1))/x^2"],"ad":"$\\dfrac{e^x(x-1)}{x^2}$","sol":"$\\frac{e^x x-e^x}{x^2}$.","h":["Quotient rule.","$u=e^x$, $v=x$.","Factor $e^x$."]},{"topic":"Gradient","q":"Find $f'(1)$ for $f(x)=xe^{x}$. Exact.","a":"2e","alt":[],"ad":"$2e$","sol":"$f'=e^x+xe^x=e^x(1+x)$, so $2e$.","h":["Product rule.","$e^x(1+x)$.","Substitute 1."]},{"topic":"Optimisation","q":"Maximise $A=x(30-x)$. What is the maximum area?","a":"225","alt":[],"ad":"$225$","sol":"$x=15$, $A=225$.","h":["Differentiate.","$30-2x=0$.","$A(15)$."]},{"topic":"Normal","q":"The tangent to $y=e^{2x}$ at $x=0$ has gradient 2. State the normal's gradient.","a":"-1/2","alt":["-0.5"],"ad":"$-\\frac12$","sol":"Perpendicular gradients multiply to $-1$.","h":["$m_1m_2=-1$.","$2m=-1$.","Solve."]},{"topic":"Chain","q":"Differentiate $y=\\cos(x^2)$.","a":"-2xsin(x^2)","alt":[],"ad":"$-2x\\sin(x^2)$","sol":"$-\\sin(u)\\cdot u'$.","h":["Outer is cos.","Inner derivative $2x$.","Combine."]},{"topic":"Chain","q":"Differentiate $y=\\ln(5x-2)$.","a":"5/(5x-2)","alt":[],"ad":"$\\frac5{5x-2}$","sol":"$\\frac{f'}{f}$.","h":["$\\frac{d}{dx}\\ln f=\\frac{f'}f$.","$f'=5$.","Write it."]},{"topic":"Stationary","q":"Where is $y=xe^{-x}$ stationary?","a":"1","alt":["x=1"],"ad":"$x=1$","sol":"$y'=e^{-x}(1-x)=0$.","h":["Product rule.","Factor $e^{-x}$.","Solve $1-x=0$."]}],"comets":[{"topic":"Extension: Both rules at once","q":"Differentiate $y=\\dfrac{xe^{x}}{x+1}$. Enter your answer as a single fraction.","a":"e^x(x^2+x+1)/(x+1)^2","alt":["(e^x(x^2+x+1))/(x+1)^2","e^x*(x^2+x+1)/(x+1)^2"],"ad":"$\\dfrac{e^x(x^2+x+1)}{(x+1)^2}$","sol":"Let $u=xe^x$, so $u'=(x+1)e^x$, and $v=x+1$. Then $y'=\\frac{(x+1)e^x(x+1)-xe^x}{(x+1)^2}=\\frac{e^x\\left(x^2+2x+1-x\\right)}{(x+1)^2}=\\frac{e^x(x^2+x+1)}{(x+1)^2}$.","h":["Use the product rule to get $u'$.","Then the quotient rule.","Factor out $e^x$ in the numerator."]},{"topic":"Extension: Nth derivative","q":"If $f(x)=xe^x$, find $f^{(10)}(0)$.","a":"10","alt":[],"ad":"$10$","sol":"$f^{(n)}(x)=(x+n)e^x$, so $f^{(10)}(0)=10$.","h":["Compute $f'$, $f''$.","Pattern: $(x+n)e^x$.","Substitute."]}],"hours":4},"mm3-c04":{"id":"mm3-c04","interactive":"concavity","summary":"The first derivative tells you where a graph rises and falls; the second derivative tells you how it bends. This chapter uses both to classify stationary points, find points of inflection, sketch curves, and solve optimisation problems.","videos":[{"src":"B","title":"Higher order derivatives (3Blue1Brown, ch. 10)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Higher+order+derivatives+Essence+of+calculus+chapter+10","kind":"search"},{"src":"J","title":"Second derivative and concavity","url":"https://www.youtube.com/results?search_query=Joel+Speranza+second+derivative+concavity","kind":"search"},{"src":"J","title":"Curve sketching","url":"https://www.youtube.com/results?search_query=Joel+Speranza+curve+sketching+calculus","kind":"search"},{"src":"J","title":"Optimisation problems","url":"https://www.youtube.com/results?search_query=Joel+Speranza+optimisation+calculus","kind":"search"}],"sections":[{"id":"mm3-c04-s1","code":"4.2","title":"The second derivative","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: second derivative","url":"https://www.youtube.com/results?search_query=Joel+Speranza+second+derivative","kind":"search"},{"src":"B","title":"3Blue1Brown: Higher order derivatives","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Higher+order+derivatives","kind":"search"}]},{"t":"p","x":"The **second derivative** is the derivative of the derivative: $f''(x)=\\frac{d^2y}{dx^2}$. It is the **rate of change of the gradient**. If $f''(x)>0$ the gradient is increasing (the curve bends upward, **concave up**); if $f''(x)\u003c0$ the gradient is decreasing (**concave down**)."},{"t":"p","x":"In kinematics, if $x$ is position then $x'$ is velocity and $x''$ is acceleration."},{"t":"ex","title":"Second derivative","q":"Find $f''(x)$ for $f(x)=x^3e^{-x}$.","s":["$f'(x)=3x^2e^{-x}-x^3e^{-x}=e^{-x}(3x^2-x^3)$.","$f''(x)=-e^{-x}(3x^2-x^3)+e^{-x}(6x-3x^2)=e^{-x}(x^3-6x^2+6x)$."],"a":"$f''(x)=e^{-x}(x^3-6x^2+6x)$"},{"t":"tb","rec":"1,2,4,8,11,12","ext":"13,14,16,17,19","x":"Exercise 4.2 computes second derivatives for every function type and interprets them in context.","code":"4.2"},{"t":"ex","title":"Reading derivatives from a graph","q":"The graph of $y=f(x)$ has a maximum at $x=2$ and crosses the $x$-axis at $x=5$. Describe $f'$ and $f''$ at $x=2$.","s":["At a maximum the tangent is flat: $f'(2)=0$.","The curve bends down: $f''(2)\u003c0$."],"a":"$f'(2)=0$ and $f''(2)\u003c0$."}]},{"id":"mm3-c04-s2","code":"4.3","title":"Concavity and points of inflection","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: concavity and points of inflection","url":"https://www.youtube.com/results?search_query=Joel+Speranza+concavity+and+points+of+inflection","kind":"search"}]},{"t":"key","x":"**Stationary point test.** At $f'(a)=0$: if $f''(a)>0$ it is a **local minimum**; if $f''(a)\u003c0$ a **local maximum**; if $f''(a)=0$ the test fails, so check the sign of $f'$ either side."},{"t":"key","x":"A **point of inflection** is where concavity changes: $f''(x)=0$ **and** $f''$ changes sign. A **stationary** point of inflection also has $f'(x)=0$."},{"t":"ex","title":"Classifying stationary points","q":"Classify the stationary points of $f(x)=x^3-3x^2$.","s":["$f'(x)=3x^2-6x=3x(x-2)$, so $x=0$ or $x=2$.","$f''(x)=6x-6$. At $x=0$: $-6\u003c0$, max, point $(0,0)$. At $x=2$: $6>0$, min, point $(2,-4)$."],"a":"Max at $(0,0)$, min at $(2,-4)$."},{"t":"ex","title":"Point of inflection","q":"Find the point of inflection of $f(x)=x^3-3x^2$.","s":["$f''(x)=6x-6=0\\Rightarrow x=1$.","$f''$ is negative for $x\u003c1$ and positive for $x>1$, so concavity changes. $f(1)=-2$."],"a":"$(1,-2)$"},{"t":"warn","x":"$f''(a)=0$ does not guarantee an inflection point. Compare $y=x^4$: $f''(0)=0$ but $x=0$ is a minimum and concavity never changes. Always check the sign change."},{"t":"int","name":"concavity","cap":"Drag the point along a cubic and watch the gradient, the sign of $f''$ and the concavity shading."},{"t":"tb","rec":"1,4,6,8,10,12","ext":"14,16,18,20","x":"Exercise 4.3 classifies stationary points with the second derivative and finds inflection points.","code":"4.3"},{"t":"ex","title":"Inflection of a cubic","q":"Find the point of inflection of $f(x)=x^3-6x^2+9x$.","s":["$f'=3x^2-12x+9$, $f''=6x-12=0\\Rightarrow x=2$.","$f''$ changes sign (negative to positive) so it is a genuine inflection; $f(2)=2$."],"a":"$(2,\\ 2)$"},{"t":"warn","x":"$f''(a)=0$ is necessary but not sufficient. For $y=x^4$, $f''(0)=0$ but there is no inflection (it is a minimum). Always check the sign change."}]},{"id":"mm3-c04-s3","code":"4.4","title":"Curve sketching","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: curve sketching with calculus","url":"https://www.youtube.com/results?search_query=Joel+Speranza+curve+sketching+with+calculus","kind":"search"}]},{"t":"p","x":"Checklist for sketching $y=f(x)$: (1) intercepts ($y$-int at $x=0$; $x$-int at $y=0$); (2) stationary points from $f'=0$ and their nature; (3) inflection points from $f''=0$; (4) asymptotes and end behaviour; (5) join smoothly, respecting concavity."},{"t":"ex","title":"Sketching","q":"Sketch $f(x)=xe^{-x}$ for $x\\ge0$ by finding its key features.","s":["Intercept: $(0,0)$. $f'(x)=e^{-x}(1-x)=0\\Rightarrow x=1$, $f(1)=e^{-1}$.","$f''(x)=e^{-x}(x-2)$. At $x=1$: $-e^{-1}\u003c0$, so a local max at $(1,e^{-1})$.","$f''=0$ at $x=2$ with a sign change: inflection at $\\left(2,2e^{-2}\\right)$.","As $x\\to\\infty$, $f\\to0$, so the $x$-axis is a horizontal asymptote."],"a":"Rises to a max $(1,e^{-1})$, inflects at $(2,2e^{-2})$, then decays to $0$."},{"t":"tb","rec":"1,2,5,8,12","ext":"14,16,17,20","x":"Exercise 4.4 sketches polynomials, exponentials, logs and trig curves with all key features labelled.","code":"4.4"},{"t":"ex","title":"Full sketch","q":"Sketch $y=x^3-3x^2$: intercepts, stationary points, inflection.","s":["Intercepts: $x^2(x-3)=0\\Rightarrow x=0,3$; $y$-intercept $0$.","$y'=3x^2-6x=0\\Rightarrow x=0,2$; $y''=6x-6$: $y''(0)=-6$ max at $(0,0)$; $y''(2)=6$ min at $(2,-4)$.","Inflection at $x=1$, $y=-2$."],"a":"Max $(0,0)$, min $(2,-4)$, inflection $(1,-2)$, $x$-intercepts $0$ and $3$."}]},{"id":"mm3-c04-s4","code":"4.5","title":"Optimisation","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: optimisation problems calculus","url":"https://www.youtube.com/results?search_query=Joel+Speranza+optimisation+problems+calculus","kind":"search"}]},{"t":"p","x":"Optimisation problems ask for the greatest or least value of something. **Method:** (1) draw and define variables; (2) write the quantity to optimise in terms of **one** variable using the constraint; (3) state the domain; (4) differentiate and set to zero; (5) confirm max or min with $f''$ or a sign test, and check the **endpoints** of the domain; (6) answer in context with units."},{"t":"ex","title":"Open box","q":"A square-based open box has volume $32\\ \\text{cm}^3$. Find the dimensions that minimise surface area.","s":["Base side $x$, height $h$: $x^2h=32\\Rightarrow h=\\frac{32}{x^2}$. Area $A=x^2+4xh=x^2+\\frac{128}{x}$, $x>0$.","$A'=2x-\\frac{128}{x^2}=0\\Rightarrow x^3=64\\Rightarrow x=4$.","$A''=2+\\frac{256}{x^3}>0$, so a minimum. $h=\\frac{32}{16}=2$."],"a":"Base $4\\text{ cm}\\times4\\text{ cm}$, height $2$ cm; area $48\\text{ cm}^2$."},{"t":"warn","x":"Finding $x$ is rarely the final answer. Re-read the question: it may want the minimum area, the dimension, or a time."},{"t":"tb","rec":"1,2,3,5,7,10,12","ext":"13,14,16,17,18,19,20","x":"Exercise 4.5 covers area, volume, cost and distance optimisation problems.","code":"4.5"},{"t":"ex","title":"Open box","q":"A box has square base side $x$ and no lid. Volume $32$. Find $x$ minimising the surface area.","s":["Height $h=\\frac{32}{x^2}$; $S=x^2+4xh=x^2+\\frac{128}{x}$.","$S'=2x-\\frac{128}{x^2}=0\\Rightarrow x^3=64\\Rightarrow x=4$; $S''>0$ so minimum."],"a":"$x=4$, giving $S=48$."},{"t":"p","x":"**Optimisation recipe.** (1) Draw and name variables. (2) Write the quantity to optimise. (3) Use the constraint to eliminate to one variable. (4) Differentiate, solve. (5) Prove max/min with $f''$ or a sign table. (6) Check the end points of the domain. (7) Answer the question with units."}]},{"id":"mm3-c04-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Endpoints.** On a closed interval $[a,b]$ the absolute maximum may be at an end point. List: end points, stationary points, and any non-differentiable points, then compare function values."},{"t":"p","x":"**Describing graphs.** Use full sentences with evidence: \"$f''(x)>0$ for $x>1$, so the graph is concave up there\". Mentioning only the sign of $f'$ for concavity is a classic lost mark."}]}],"quiz":[{"topic":"Second derivative","q":"Find $f''(x)$ for $f(x)=x^4-2x^2$.","a":"12x^2-4","alt":["12x\u00b2-4"],"ad":"$12x^2-4$","sol":"$f'=4x^3-4x$, $f''=12x^2-4$.","h":["Differentiate once.","$4x^3-4x$.","Differentiate again."]},{"topic":"Nature","q":"For $f(x)=x^3-12x$ the stationary point at $x=2$ is a (type \"min\" or \"max\").","a":"min","alt":["minimum","local min","local minimum"],"ad":"minimum","sol":"$f'=3x^2-12=0\\Rightarrow x=\\pm2$. $f''=6x$; at $x=2$: $12>0$, so min.","h":["Find $f''$.","Substitute $x=2$.","Positive means min."]},{"topic":"Inflection","q":"Find the $x$-coordinate of the point of inflection of $f(x)=x^3-6x^2+1$.","a":"2","alt":["x=2"],"ad":"$x=2$","sol":"$f''=6x-12=0\\Rightarrow x=2$, with a sign change.","h":["Find $f''$.","Set to 0.","Solve."]},{"topic":"Second derivative","q":"Find $f''(x)$ for $f(x)=e^{3x}$.","a":"9e^(3x)","alt":["9e^3x"],"ad":"$9e^{3x}$","sol":"$f'=3e^{3x}$, $f''=9e^{3x}$.","h":["First derivative: chain rule.","$3e^{3x}$.","Differentiate again."]},{"topic":"Concavity","q":"For $f(x)=\\ln x$, is the graph concave up or concave down? (answer \"up\" or \"down\")","a":"down","alt":["concave down"],"ad":"concave down","sol":"$f''(x)=-\\frac1{x^2}\u003c0$ for all $x>0$.","h":["Find $f'$.","Then $f''$.","Check its sign."]},{"topic":"Optimisation","q":"Two numbers add to 20. Find the greatest possible product.","a":"100","alt":["100."],"ad":"$100$","sol":"$P=x(20-x)$, $P'=20-2x=0\\Rightarrow x=10$, $P=100$ (max since $P''=-2\u003c0$).","h":["Let the numbers be $x$ and $20-x$.","Write $P$.","Differentiate and set 0."]},{"topic":"Optimisation","q":"A rectangle has perimeter 40 m. Find its maximum area in $\\text{m}^2$.","a":"100","alt":["100 m^2"],"ad":"$100\\ \\text{m}^2$","sol":"Sides $x$ and $20-x$, area $x(20-x)$, maximised at $x=10$: $100$.","h":["Half the perimeter is 20.","Area $=x(20-x)$.","Maximise."]},{"topic":"Stationary","q":"Find the minimum value of $f(x)=x^2-4x+9$.","a":"5","alt":["f=5","min=5"],"ad":"$5$","sol":"$f'=2x-4=0\\Rightarrow x=2$, $f(2)=4-8+9=5$.","h":["Differentiate.","$x=2$.","Substitute back."]},{"topic":"Sketch feature","q":"$f(x)=xe^{-x}$ has a local maximum at $x=1$. What is its $y$-value? Give an exact answer.","a":"1/e","alt":["e^(-1)"],"ad":"$e^{-1}$","sol":"$f(1)=1\\cdot e^{-1}=e^{-1}$.","h":["Substitute $x=1$.","$e^{-1}$.","Same as $\\frac1e$."]},{"topic":"Second derivative test","q":"$f''(x)=-5$ at a stationary point. Is it a max or min?","a":"max","alt":["maximum","local max","local maximum"],"ad":"maximum","sol":"Negative second derivative means concave down: a maximum.","h":["Sign of $f''$.","Negative.","Concave down."]},{"topic":"Second derivative","q":"If $f(x)=x^4-2x^2$, find $f''(1)$.","a":"8","alt":[],"ad":"$8$","sol":"$f''=12x^2-4$, so $8$.","h":["Differentiate twice.","$f'=4x^3-4x$.","Substitute."]},{"topic":"Concavity","q":"For $f(x)=x^3$, what is $f''(x)$ at $x=-1$?","a":"-6","alt":[],"ad":"$-6$","sol":"$f''=6x$.","h":["Differentiate twice.","$6x$.","Substitute."]},{"topic":"Inflection","q":"Find the $x$-coordinate of the inflection of $y=x^3-9x^2$.","a":"3","alt":[],"ad":"$x=3$","sol":"$y''=6x-18=0$.","h":["Second derivative.","Set to zero.","Solve."]},{"topic":"Max","q":"The maximum of $y=-x^2+6x$ is?","a":"9","alt":[],"ad":"$9$","sol":"$x=3$, $y=9$.","h":["Vertex.","$x=3$.","Substitute."]},{"topic":"Exponential","q":"Classify the stationary point of $y=xe^{-x}$.","a":"max","alt":["maximum","local max"],"ad":"maximum at $x=1$","sol":"$y'=e^{-x}(1-x)$; $y''=e^{-x}(x-2)$, which is $-e^{-1}\u003c0$ at $x=1$.","h":["$x=1$.","Second derivative.","Sign."]},{"topic":"Box","q":"Open box volume 32, base $x$. Surface area $S=x^2+\\frac{128}{x}$. Find the minimum value of $S$.","a":"48","alt":[],"ad":"$48$","sol":"$x=4$: $16+32=48$.","h":["Find stationary point.","$x=4$.","Substitute."]},{"topic":"Inflection","q":"Is there an inflection point for $y=x^4$ at $x=0$? Answer yes or no.","a":"no","alt":["No"],"ad":"No","sol":"$y''=12x^2\\ge0$ never changes sign.","h":["Compute $y''$.","Check sign either side.","No change."]},{"topic":"Rate","q":"$y=e^{3x}$. Find $y''$ at $x=0$.","a":"9","alt":[],"ad":"$9$","sol":"$y''=9e^{3x}$.","h":["Differentiate twice.","Factor 3 each time.","Substitute."]},{"topic":"Domain","q":"Maximum of $f(x)=x^2$ on $[-1,3]$?","a":"9","alt":[],"ad":"$9$","sol":"Evaluate at the end points: $1$ and $9$; the stationary point gives $0$.","h":["Check end points.","$f(3)$.","Compare."]},{"topic":"Sketch","q":"The curve $y=x^3-3x^2$ has a local minimum at $x=$?","a":"2","alt":[],"ad":"$x=2$","sol":"$y'=3x(x-2)$ and $y''(2)=6>0$.","h":["Solve $y'=0$.","Test $x=2$.","Sign."]}],"comets":[{"topic":"Extension: Cheapest cylinder","q":"A closed cylinder has volume $54\\pi\\ \\text{cm}^3$. With radius $r$, its surface area is $A=2\\pi r^2+\\dfrac{108\\pi}{r}$. Find the radius $r$ that minimises $A$.","a":"3","alt":["r=3"],"ad":"$r=3$","sol":"$A'=4\\pi r-\\frac{108\\pi}{r^2}=0\\Rightarrow r^3=27\\Rightarrow r=3$.","h":["Differentiate $A$.","Set to zero.","$r^3=27$."]},{"topic":"Extension: Inflection of a normal curve shape","q":"For $f(x)=e^{-x^2}$, find the positive $x$ where $f''(x)=0$. Give an exact answer.","a":"1/sqrt2","alt":["sqrt2/2","1/\u221a2","\u221a2/2","sqrt(2)/2"],"ad":"$\\dfrac{1}{\\sqrt2}$","sol":"$f'=-2xe^{-x^2}$, $f''=(4x^2-2)e^{-x^2}=0\\Rightarrow x^2=\\frac12$.","h":["Differentiate twice (product rule on the second).","Factor $e^{-x^2}$.","Solve $4x^2-2=0$."]},{"topic":"Extension: Shortest path","q":"The point on $y=\\sqrt x$ closest to $(4,0)$ has $x$-coordinate?","a":"3.5","alt":["7/2"],"ad":"$x=\\frac72$","sol":"Minimise $D^2=(x-4)^2+x$: $2(x-4)+1=0\\Rightarrow x=\\frac72$.","h":["Minimise distance squared.","$(x-4)^2+x$.","Differentiate."]}],"hours":4.5},"mm3-c05":{"id":"mm3-c05","interactive":"antideriv","summary":"Anti-differentiation undoes differentiation. This chapter collects the integration rules for powers, $e^x$, $\\frac1x$ and trig functions, handles linear inside functions, uses initial conditions to find the constant, and applies integrals to motion and area.","videos":[{"src":"B","title":"What does area have to do with slope? (3Blue1Brown, ch. 9)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+What+does+area+have+to+do+with+slope+Essence+of+calculus+chapter+9","kind":"search"},{"src":"B","title":"Integration and the fundamental theorem of calculus (3Blue1Brown, ch. 8)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Integration+and+the+fundamental+theorem+of+calculus","kind":"search"},{"src":"J","title":"Anti-differentiation","url":"https://www.youtube.com/results?search_query=Joel+Speranza+antidifferentiation+integration","kind":"search"},{"src":"J","title":"Integrating exponentials and trig","url":"https://www.youtube.com/results?search_query=Joel+Speranza+integration+exponential+trigonometric","kind":"search"}],"sections":[{"id":"mm3-c05-s1","code":"5.2","title":"Anti-differentiation of rational functions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: anti-differentiation powers of x","url":"https://www.youtube.com/results?search_query=Joel+Speranza+anti-differentiation+powers+of+x","kind":"search"}]},{"t":"key","x":"$$\\int x^n\\,dx=\\frac{x^{n+1}}{n+1}+c\\ (n\\neq-1)\\qquad\\int\\frac1x\\,dx=\\ln|x|+c$$"},{"t":"p","x":"Rewrite roots and fractions as powers first: $\\frac1{x^3}=x^{-3}$ and $\\sqrt x=x^{1/2}$. Split sums term by term and expand products before integrating. **Always include $+c$.**"},{"t":"ex","title":"Integrating powers","q":"Find $\\displaystyle\\int\\left(4x^3-\\frac{2}{x^2}+\\sqrt x\\right)dx$.","s":["Rewrite: $4x^3-2x^{-2}+x^{1/2}$.","Integrate each: $x^4+2x^{-1}+\\frac23x^{3/2}+c$."],"a":"$x^4+\\dfrac2x+\\dfrac23x^{3/2}+c$"},{"t":"p","x":"For $f(ax+b)$ forms: $\\int(ax+b)^n\\,dx=\\frac{(ax+b)^{n+1}}{a(n+1)}+c$ and $\\int\\frac1{ax+b}\\,dx=\\frac1a\\ln|ax+b|+c$."},{"t":"warn","x":"$\\int\\frac1x\\,dx$ is $\\ln|x|$, not $\\frac{x^0}{0}$. The power rule fails at $n=-1$."},{"t":"tb","rec":"1,2,4,7,8,12","ext":"13,15,16,17,19","x":"Exercise 5.2 integrates polynomials, powers and $\\frac1{ax+b}$ forms.","code":"5.2"},{"t":"ex","title":"Splitting terms","q":"Find $\\int\\left(3x^2-\\frac4{x^3}+\\sqrt x\\right)dx$.","s":["Rewrite: $3x^2-4x^{-3}+x^{1/2}$.","Integrate each: $x^3+2x^{-2}+\\frac23x^{3/2}+c$."],"a":"$x^3+\\dfrac2{x^2}+\\dfrac23x^{3/2}+c$"},{"t":"ex","title":"Finding $c$","q":"$f'(x)=6x-2$ and $f(1)=5$. Find $f$.","s":["$f=3x^2-2x+c$; $f(1)=1+c=5\\Rightarrow c=4$."],"a":"$f(x)=3x^2-2x+4$"}]},{"id":"mm3-c05-s2","code":"5.3","title":"Anti-differentiation of exponential functions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: integrating e^x","url":"https://www.youtube.com/results?search_query=Joel+Speranza+integrating+e%5Ex","kind":"search"}]},{"t":"key","x":"$$\\int e^x\\,dx=e^x+c\\qquad\\int e^{ax+b}\\,dx=\\frac1ae^{ax+b}+c$$"},{"t":"p","x":"The $\\frac1a$ undoes the chain-rule factor of $a$ you would get when differentiating. Check by differentiating your answer."},{"t":"ex","title":"Integrating exponentials","q":"Find $\\int\\left(6e^{2x}+e^{-x}\\right)dx$.","s":["$6\\cdot\\frac12e^{2x}=3e^{2x}$ and $\\frac1{-1}e^{-x}=-e^{-x}$."],"a":"$3e^{2x}-e^{-x}+c$"},{"t":"tb","rec":"1,3,5,9,11,12","ext":"13,15,16,17,20","x":"Exercise 5.3 integrates $e^{ax+b}$ and uses initial conditions.","code":"5.3"},{"t":"ex","title":"Linear inside","q":"$\\int\\left(e^{3x}+e^{-x}\\right)dx$.","s":["$\\frac13e^{3x}-e^{-x}+c$."],"a":"$\\frac13e^{3x}-e^{-x}+c$"}]},{"id":"mm3-c05-s3","code":"5.4","title":"Anti-differentiation of logarithmic functions (via $\\frac1x$)","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: integrating 1/x and f prime over f","url":"https://www.youtube.com/results?search_query=Joel+Speranza+integrating+1%2Fx+and+f+prime+over+f","kind":"search"}]},{"t":"p","x":"The key rule is $\\frac{d}{dx}\\ln|f(x)|=\\frac{f'(x)}{f(x)}$, so $\\int\\frac{f'(x)}{f(x)}\\,dx=\\ln|f(x)|+c$. If the numerator is the derivative of the denominator (up to a constant) the answer is a log."},{"t":"ex","title":"Recognising $\\frac{f'}{f}$","q":"Find $\\displaystyle\\int\\frac{2x}{x^2+1}\\,dx$.","s":["The numerator $2x$ is the derivative of $x^2+1$."],"a":"$\\ln(x^2+1)+c$"},{"t":"tb","rec":"1,4,5,8,11,12","ext":"13,15,16,19,20","x":"Exercise 5.4 uses $\\int\\frac1{ax+b}$ and $\\frac{f'}{f}$ forms.","code":"5.4"},{"t":"ex","title":"Reverse chain rule","q":"$\\int\\dfrac{2x}{x^2+1}dx$.","s":["Numerator is the derivative of the denominator."],"a":"$\\ln(x^2+1)+c$"},{"t":"ex","title":"$\\frac{1}{ax+b}$","q":"$\\int\\dfrac{5}{2x+3}dx$.","s":["$\\frac52\\ln|2x+3|+c$ (divide by the inner derivative 2)."],"a":"$\\frac52\\ln|2x+3|+c$"}]},{"id":"mm3-c05-s4","code":"5.5","title":"Anti-differentiation of trigonometric functions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: integrating sin and cos","url":"https://www.youtube.com/results?search_query=Joel+Speranza+integrating+sin+and+cos","kind":"search"}]},{"t":"key","x":"$$\\int\\sin x\\,dx=-\\cos x+c\\qquad\\int\\cos x\\,dx=\\sin x+c$$"},{"t":"p","x":"With a linear inside: $\\int\\sin(ax+b)\\,dx=-\\frac1a\\cos(ax+b)+c$ and $\\int\\cos(ax+b)\\,dx=\\frac1a\\sin(ax+b)+c$."},{"t":"ex","title":"Integrating trig","q":"Find $\\int\\left(3\\cos2x-\\sin\\frac x2\\right)dx$.","s":["$3\\cdot\\frac12\\sin2x=\\frac32\\sin2x$.","$-\\left(-2\\cos\\frac x2\\right)=+2\\cos\\frac x2$."],"a":"$\\frac32\\sin2x+2\\cos\\frac x2+c$"},{"t":"warn","x":"The sign: $\\int\\sin x=-\\cos x$ but $\\int\\cos x=+\\sin x$. Differentiate your answer to be sure."},{"t":"tb","rec":"1,3,6,9,10,12","ext":"14,16,17,18,20","x":"Exercise 5.5 integrates $\\sin$ and $\\cos$ with linear arguments.","code":"5.5"},{"t":"ex","title":"Trig mix","q":"$\\int(\\sin 2x+4\\cos x)dx$.","s":["$-\\frac12\\cos2x+4\\sin x+c$."],"a":"$-\\frac12\\cos 2x+4\\sin x+c$"}]},{"id":"mm3-c05-s5","code":"5.6","title":"Further integration and initial conditions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: definite integrals and area","url":"https://www.youtube.com/results?search_query=Joel+Speranza+definite+integrals+and+area","kind":"search"},{"src":"B","title":"3Blue1Brown: Integration and the fundamental theorem of calculus","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Integration+and+the+fundamental+theorem+of+calculus","kind":"search"}]},{"t":"p","x":"An **indefinite integral** has $+c$. An **initial condition** such as $f(0)=3$ fixes $c$. Substitute after integrating."},{"t":"p","x":"The **definite integral** gives net area: $\\int_a^bf'(x)\\,dx=f(b)-f(a)$. Use it for change in a quantity and for area under a curve (area below the axis counts as negative, so split at the roots for total area)."},{"t":"ex","title":"Initial condition","q":"$f'(x)=6x^2-4$ and $f(1)=5$. Find $f(x)$.","s":["$f(x)=2x^3-4x+c$.","$2-4+c=5\\Rightarrow c=7$."],"a":"$f(x)=2x^3-4x+7$"},{"t":"ex","title":"Definite integral","q":"Evaluate $\\int_0^{\\pi}\\sin x\\,dx$.","s":["$[-\\cos x]_0^{\\pi}=-\\cos\\pi+\\cos0=1+1=2$."],"a":"$2$"},{"t":"tb","rec":"1,5,6,9,10,11,12","ext":"13,15,16,17,19","x":"Exercise 5.6 uses definite integrals, areas and initial-condition problems.","code":"5.6"},{"t":"ex","title":"Area between curves","q":"Area between $y=x$ and $y=x^2$.","s":["Intersect at $x=0,1$; line is above.","$\\int_0^1(x-x^2)dx=\\left[\\frac{x^2}2-\\frac{x^3}3\\right]_0^1=\\frac16$."],"a":"$\\frac16$"},{"t":"int","name":"riemann","cap":"Add rectangles and watch the estimate close in on the exact integral. A definite integral is the limit of such sums."},{"t":"warn","x":"For area, $\\int_a^b f$ gives *signed* area. If the graph crosses the axis, split at the crossing and add the absolute values."}]},{"id":"mm3-c05-s6","code":"5.7","title":"Applications: motion and rates","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: integration kinematics velocity to position","url":"https://www.youtube.com/results?search_query=Joel+Speranza+integration+kinematics+velocity+to+position","kind":"search"}]},{"t":"p","x":"If $v=\\frac{dx}{dt}$ then $x=\\int v\\,dt$, and the **displacement** from $t=a$ to $b$ is $\\int_a^bv\\,dt$. **Distance** travelled needs $\\int|v|\\,dt$, so split where $v$ changes sign."},{"t":"ex","title":"Velocity to position","q":"$v=3t^2-6t$, $x(0)=2$. Find $x(t)$ and the displacement over $0\\le t\\le3$.","s":["$x=t^3-3t^2+2$.","Displacement: $x(3)-x(0)=(27-27+2)-2=0$."],"a":"$x=t^3-3t^2+2$; displacement is $0$."},{"t":"tb","rec":"1,3,5,6,9,12","ext":"14,16,17,20","x":"Exercise 5.7 links rate of change to total change, and velocity to position.","code":"5.7"},{"t":"ex","title":"Velocity to position","q":"$v=3t^2-4$, $x(0)=2$. Find $x(t)$ and the displacement over $0\\le t\\le2$.","s":["$x=t^3-4t+c$, $c=2$.","Displacement $=x(2)-x(0)=(8-8+2)-2=0$."],"a":"$x=t^3-4t+2$; displacement $0$."}]},{"id":"mm3-c05-s7","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Check by differentiating.** Every antiderivative can be verified in seconds. Do it whenever you have spare time. If you differentiate your answer and do not recover the integrand, find the mistake."},{"t":"p","x":"**Presentation.** Indefinite integrals need $+c$. Definite integrals show the bracket $[\\;]_a^b$ and both substitutions. When a question says \"exact\", leave $e$ and $\\ln$ unevaluated."}]}],"quiz":[{"topic":"Powers","q":"Find $\\int(6x^2-4x)\\,dx$ (include $+c$).","a":"2x^3-2x^2+c","alt":["2x\u00b3-2x\u00b2+c"],"ad":"$2x^3-2x^2+c$","sol":"$6\\cdot\\frac{x^3}3-4\\cdot\\frac{x^2}2=2x^3-2x^2$.","h":["Add 1 to each power.","Divide by the new power.","Add $c$."]},{"topic":"Exponential","q":"Find $\\int e^{4x}\\,dx$ (include $+c$).","a":"(1/4)e^(4x)+c","alt":["e^(4x)/4+c","1/4e^(4x)+c"],"ad":"$\\tfrac14e^{4x}+c$","sol":"Divide by the inside coefficient 4.","h":["Differentiating $e^{4x}$ gives $4e^{4x}$.","So divide by 4.","Add $c$."]},{"topic":"Reciprocal","q":"Find $\\int\\frac{3}{x}\\,dx$ for $x>0$ (include $+c$).","a":"3ln(x)+c","alt":["3lnx+c","3ln|x|+c"],"ad":"$3\\ln x+c$","sol":"$3\\int\\frac1x=3\\ln x+c$.","h":["Constants come out.","$\\int\\frac1x=\\ln x$.","Include $c$."]},{"topic":"Trig","q":"Find $\\int\\cos(3x)\\,dx$ (include $+c$).","a":"(1/3)sin(3x)+c","alt":["sin(3x)/3+c","1/3sin(3x)+c"],"ad":"$\\tfrac13\\sin(3x)+c$","sol":"Divide by 3 for the inside.","h":["$\\int\\cos=\\sin$.","Divide by the coefficient.","Add $c$."]},{"topic":"Trig","q":"Find $\\int\\sin(2x)\\,dx$ (include $+c$).","a":"-(1/2)cos(2x)+c","alt":["-cos(2x)/2+c","-1/2cos(2x)+c"],"ad":"$-\\tfrac12\\cos(2x)+c$","sol":"$\\int\\sin=-\\cos$, divided by 2.","h":["$\\int\\sin=-\\cos$.","Divide by 2.","Add $c$."]},{"topic":"Initial condition","q":"$f'(x)=4x-1$, $f(0)=3$. Find $f(2)$.","a":"9","alt":["f(2)=9"],"ad":"$9$","sol":"$f=2x^2-x+3$, $f(2)=8-2+3=9$.","h":["Integrate.","$c=3$.","Substitute $x=2$."]},{"topic":"Definite","q":"Evaluate $\\int_0^2(3x^2)\\,dx$.","a":"8","alt":["8."],"ad":"$8$","sol":"$[x^3]_0^2=8$.","h":["Antiderivative of $3x^2$.","Evaluate at 2 and 0.","Subtract."]},{"topic":"Definite","q":"Evaluate $\\int_0^1e^{2x}\\,dx$. Give an exact answer.","a":"(e^2-1)/2","alt":["(1/2)(e^2-1)","(e^2-1)/2.","e^2/2-1/2"],"ad":"$\\dfrac{e^2-1}{2}$","sol":"$\\left[\\tfrac12e^{2x}\\right]_0^1=\\tfrac12(e^2-1)$.","h":["Antiderivative $\\frac12e^{2x}$.","Evaluate at 1 and 0.","Subtract."]},{"topic":"Motion","q":"$v=2t+1$ and $x(0)=0$. Find $x(3)$.","a":"12","alt":["x=12"],"ad":"$12$","sol":"$x=t^2+t$; $x(3)=9+3=12$.","h":["Integrate $v$.","$c=0$.","Substitute."]},{"topic":"Recognise","q":"Find $\\int\\frac{2x}{x^2+3}\\,dx$ (include $+c$).","a":"ln(x^2+3)+c","alt":["ln|x^2+3|+c"],"ad":"$\\ln(x^2+3)+c$","sol":"Numerator is the derivative of the denominator.","h":["Differentiate $x^2+3$.","Compare with numerator.","Use $\\frac{f'}{f}$."]},{"topic":"Power","q":"Find $\\int\\left(4x^3-6x\\right)dx$.","a":"x^4-3x^2+c","alt":[],"ad":"$x^4-3x^2+c$","sol":"Raise power and divide.","h":["$x^{n+1}/(n+1)$.","Each term.","Add $c$."]},{"topic":"Exponential","q":"$\\int 5e^{5x}dx$.","a":"e^(5x)+c","alt":[],"ad":"$e^{5x}+c$","sol":"Divide by 5.","h":["Inner derivative 5.","$5\\div5=1$.","Add $c$."]},{"topic":"Log","q":"$\\int\\frac{3}{x}dx$ for $x>0$.","a":"3lnx+c","alt":["3ln(x)+c"],"ad":"$3\\ln x+c$","sol":"$\\int\\frac1x=\\ln x$.","h":["Constant multiple.","$\\ln x$.","Add $c$."]},{"topic":"Reverse chain","q":"$\\int\\frac{e^x}{e^x+1}dx$.","a":"ln(e^x+1)+c","alt":[],"ad":"$\\ln(e^x+1)+c$","sol":"Numerator is the derivative of the denominator.","h":["$f'/f$.","$f=e^x+1$.","Add $c$."]},{"topic":"Definite","q":"$\\int_0^1 3x^2dx$.","a":"1","alt":[],"ad":"$1$","sol":"$[x^3]_0^1$.","h":["Antiderivative.","$x^3$.","Substitute."]},{"topic":"Definite","q":"$\\int_0^{\\pi}\\sin x\\,dx$.","a":"2","alt":[],"ad":"$2$","sol":"$[-\\cos x]_0^\\pi=1+1$.","h":["$-\\cos x$.","At $\\pi$: $1$.","At $0$: $-1$."]},{"topic":"Area","q":"Area under $y=e^x$ from $0$ to $\\ln3$.","a":"2","alt":[],"ad":"$2$","sol":"$[e^x]_0^{\\ln3}=3-1$.","h":["Antiderivative.","$e^{\\ln3}=3$.","Subtract."]},{"topic":"Initial value","q":"$f'(x)=4x$, $f(0)=3$. Find $f(2)$.","a":"11","alt":[],"ad":"$11$","sol":"$f=2x^2+3$, $f(2)=11$.","h":["Integrate.","$c=3$.","Substitute."]},{"topic":"Between curves","q":"Area between $y=x$ and $y=x^2$ from $0$ to $1$ (exact).","a":"1/6","alt":[],"ad":"$\\frac16$","sol":"$\\int_0^1(x-x^2)dx$.","h":["Which is on top?","Integrate difference.","Evaluate."]},{"topic":"Velocity","q":"$v=2t$, $x(0)=1$. Find $x(3)$.","a":"10","alt":[],"ad":"$10$","sol":"$x=t^2+1$, $x(3)=10$.","h":["Integrate.","$c=1$.","Substitute."]}],"comets":[{"topic":"Extension: Area under a curve between roots","q":"Find the exact area enclosed between $y=\\sin x$ and the $x$-axis for $0\\le x\\le2\\pi$.","a":"4","alt":["4 units^2","4 square units"],"ad":"$4$","sol":"$\\int_0^{\\pi}\\sin x\\,dx=2$ and the part below the axis has area $2$, so total area is $4$ (not $0$).","h":["Where does $\\sin x$ cross the axis?","Split the integral at $\\pi$.","Take the area, not the signed value."]},{"topic":"Extension: Find the function","q":"$f'(x)=\\dfrac{1}{x}+e^{x}$, $f(1)=e$. Find $f(e)$ in exact form.","a":"e^e+1","alt":["1+e^e"],"ad":"$e^{e}+1$","sol":"$f=\\ln x+e^x+c$, $0+e+c=e\\Rightarrow c=0$. So $f(e)=\\ln e+e^e=1+e^e$.","h":["Integrate.","Use $f(1)=e$ to get $c$.","Substitute $x=e$."]},{"topic":"Extension: Average value","q":"The average value of $f(x)=x^2$ on $[0,3]$ is?","a":"3","alt":[],"ad":"$3$","sol":"$\\frac1{3}\\int_0^3x^2dx=\\frac13\\cdot9=3$.","h":["$\\frac1{b-a}\\int f$.","$\\int_0^3x^2=9$.","Divide by 3."]}],"hours":4.5},"mm3-c06":{"id":"mm3-c06","interactive":"discrete","summary":"A discrete random variable takes countable values, each with a probability. This chapter builds probability distributions, then summarises them with the expected value, variance and standard deviation, and models real situations such as games and fair prices.","videos":[{"src":"J","title":"Discrete random variables and probability distributions","url":"https://www.youtube.com/results?search_query=Joel+Speranza+discrete+random+variables","kind":"search"},{"src":"J","title":"Expected value and variance","url":"https://www.youtube.com/results?search_query=Joel+Speranza+expected+value+variance+discrete","kind":"search"},{"src":"B","title":"Binomial distributions, probabilities of probabilities (3Blue1Brown)","url":"https://www.youtube.com/watch?v=8idr1WZ1A7Q","kind":"video"}],"sections":[{"id":"mm3-c06-s1","code":"6.2","title":"Discrete random variables","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: discrete random variables probability distribution","url":"https://www.youtube.com/results?search_query=Joel+Speranza+discrete+random+variables+probability+distribution","kind":"search"}]},{"t":"p","x":"A **random variable** $X$ assigns a number to each outcome of a random process. It is **discrete** if it takes separate values, like the number of heads in 3 tosses. Its **probability distribution** lists each value $x$ with $P(X=x)$, usually as a table or a rule."},{"t":"key","x":"Every valid distribution satisfies two conditions: $0\\le P(X=x)\\le1$ for each $x$, and $\\sum P(X=x)=1$."},{"t":"ex","title":"Finding an unknown probability","q":"$X$ has $P(X=x)=kx$ for $x=1,2,3,4$. Find $k$ and $P(X\\ge3)$.","s":["$k(1+2+3+4)=1\\Rightarrow k=\\frac1{10}$.","$P(X\\ge3)=\\frac3{10}+\\frac4{10}=\\frac7{10}$."],"a":"$k=\\frac1{10}$, $P(X\\ge3)=\\frac7{10}$"},{"t":"p","x":"The **cumulative** probability $P(X\\le x)$ adds up the values to the left. Complement rule: $P(X\\ge x)=1-P(X\u003cx)$."},{"t":"warn","x":"A distribution must sum to exactly 1. If your fractions do not, recheck the arithmetic before moving on, because every later answer depends on it."},{"t":"tb","rec":"1,2,4,5,6,7,8,11,12","ext":"13,15,16,18,20","x":"Exercise 6.2 builds distributions from experiments, finds unknown constants and cumulative probabilities.","code":"6.2"},{"t":"ex","title":"Finding an unknown","q":"$X$ takes values $1,2,3,4$ with $P(X=x)=kx$. Find $k$ and $P(X\\ge3)$.","s":["$k(1+2+3+4)=1\\Rightarrow k=\\frac1{10}$.","$P(X\\ge3)=\\frac3{10}+\\frac4{10}=\\frac7{10}$."],"a":"$k=0.1$ and $P(X\\ge3)=0.7$"},{"t":"p","x":"**Two rules for any probability distribution:** every probability is between 0 and 1, and the probabilities add to exactly 1. Use the second to solve for unknowns, then check the first."}]},{"id":"mm3-c06-s2","code":"6.3","title":"Expected value","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: expected value discrete random variable","url":"https://www.youtube.com/results?search_query=Joel+Speranza+expected+value+discrete+random+variable","kind":"search"}]},{"t":"key","x":"$$E(X)=\\mu=\\sum x\\,P(X=x)$$"},{"t":"p","x":"The **expected value** is the long-run average, not necessarily a value $X$ can take. For a function: $E(aX+b)=aE(X)+b$."},{"t":"ex","title":"Expected value","q":"$X$: $0,1,2$ with $P=0.2,0.5,0.3$. Find $E(X)$ and $E(3X+1)$.","s":["$E(X)=0(0.2)+1(0.5)+2(0.3)=1.1$.","$E(3X+1)=3(1.1)+1=4.3$."],"a":"$1.1$ and $4.3$"},{"t":"ex","title":"Fair game","q":"You pay \\$2 to roll a die and win \\$6 for a six, else nothing. Is it fair?","s":["Net gain $G$: $+4$ with prob $\\frac16$; $-2$ with prob $\\frac56$.","$E(G)=\\frac46-\\frac{10}6=-1$, so you lose \\$1 on average. Not fair."],"a":"Not fair; expected loss \\$1 per game."},{"t":"warn","x":"A **fair game** has $E(\\text{net gain})=0$. Remember to subtract the cost to play."},{"t":"tb","rec":"1,3,5,8,11,12","ext":"13,15,17,19,20","x":"Exercise 6.3 computes expected value and applies it to games and decisions.","code":"6.3"},{"t":"ex","title":"Expected value","q":"$x=0,1,2$ with $p=0.5,0.3,0.2$. Find $E(X)$.","s":["$0(0.5)+1(0.3)+2(0.2)=0.7$."],"a":"$0.7$"},{"t":"ex","title":"Linear change","q":"$E(X)=4$. Find $E(3X-2)$.","s":["$E(aX+b)=aE(X)+b=3(4)-2=10$."],"a":"$10$"}]},{"id":"mm3-c06-s3","code":"6.4","title":"Variance and standard deviation","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: variance and standard deviation discrete random variable","url":"https://www.youtube.com/results?search_query=Joel+Speranza+variance+and+standard+deviation+discrete+random+variable","kind":"search"}]},{"t":"key","x":"$$\\operatorname{Var}(X)=E\\big[(X-\\mu)^2\\big]=E(X^2)-\\mu^2,\\qquad\\sigma=\\sqrt{\\operatorname{Var}(X)}$$"},{"t":"p","x":"Here $E(X^2)=\\sum x^2P(X=x)$. For linear transformations: $\\operatorname{Var}(aX+b)=a^2\\operatorname{Var}(X)$ and $\\sigma(aX+b)=|a|\\sigma$. Adding a constant shifts the mean but does not change the spread."},{"t":"ex","title":"Variance","q":"Find $\\operatorname{Var}(X)$ for the distribution above ($0,1,2$ with $0.2,0.5,0.3$).","s":["$E(X^2)=0+1(0.5)+4(0.3)=1.7$.","$\\operatorname{Var}=1.7-1.1^2=1.7-1.21=0.49$, so $\\sigma=0.7$."],"a":"$\\operatorname{Var}(X)=0.49$, $\\sigma=0.7$"},{"t":"warn","x":"$E(X^2)\\ne\\big(E(X)\\big)^2$. The difference between them is exactly the variance."},{"t":"tb","rec":"1,2,4,5,7,9,10","ext":"13,15,16,18,19","x":"Exercise 6.4 practises variance, standard deviation and their linear transformations.","code":"6.4"},{"t":"ex","title":"Variance two ways","q":"Using the table above, find $\\text{Var}(X)$.","s":["$E(X^2)=0(0.5)+1(0.3)+4(0.2)=1.1$.","$\\text{Var}=1.1-0.7^2=0.61$."],"a":"$0.61$, so $\\sigma\\approx0.781$"},{"t":"key","x":"**Linear change of variance:** $\\text{Var}(aX+b)=a^2\\text{Var}(X)$. Adding a constant does not change spread; multiplying by $a$ scales the standard deviation by $|a|$."}]},{"id":"mm3-c06-s4","code":"6.5","title":"Modelling with discrete random variables","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: expected value decisions and fair games","url":"https://www.youtube.com/results?search_query=Joel+Speranza+expected+value+decisions+and+fair+games","kind":"search"}]},{"t":"p","x":"Build a model by listing outcomes, assigning probabilities, and checking they sum to 1. Use $E(X)$ to compare decisions, and $\\sigma$ to compare risk: same mean, higher $\\sigma$ means a riskier option."},{"t":"ex","title":"Comparing options","q":"Game A pays \\$1 or \\$9 equally likely; game B pays \\$4 or \\$6 equally likely. Compare.","s":["Both have $E=5$.","Game A has $\\operatorname{Var}=\\frac12(1+81)-25=16$; game B $\\operatorname{Var}=\\frac12(16+36)-25=1$."],"a":"Same average, but A is much riskier ($\\sigma=4$ vs $\\sigma=1$)."},{"t":"tb","rec":"1,2,5,6,7,10,12","ext":"14,15,17","x":"Exercise 6.5 is context modelling with decisions and expected profit.","code":"6.5"},{"t":"ex","title":"Fair game","q":"Pay $\\$2$ to roll a die; win $\\$6$ if you roll a 6, else nothing. Expected profit?","s":["$E(\\text{win})=6\\cdot\\frac16=1$; profit $=1-2=-1$."],"a":"$-\\$1$ per game, so it is not fair."}]},{"id":"mm3-c06-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Table method.** Add a row for $xp$ and a row for $x^2p$. Sums give $E(X)$ and $E(X^2)$. This avoids arithmetic slips and shows method marks."},{"t":"p","x":"**Interpreting.** $E(X)$ is the long-run average, not a value you expect on one trial. Say \"in the long run\" in context. A game is fair when expected profit is zero."}]}],"quiz":[{"topic":"Valid distribution","q":"$P(X=x)=\\frac{x}{15}$ for $x=1,\\dots,5$. Is this a valid distribution? (yes or no)","a":"yes","alt":["Yes"],"ad":"yes","sol":"$\\frac{1+2+3+4+5}{15}=1$.","h":["Add the probabilities.","$1+2+3+4+5=15$.","Compare with 1."]},{"topic":"Unknown","q":"$P(X=x)$: $0.1,\\ k,\\ 0.4,\\ 0.2$. Find $k$.","a":"0.3","alt":[".3","3/10"],"ad":"$0.3$","sol":"$1-(0.1+0.4+0.2)=0.3$.","h":["They sum to 1.","Add the known.","Subtract from 1."]},{"topic":"Expected value","q":"$X=1,2,3$ with $P=0.5,0.3,0.2$. Find $E(X)$.","a":"1.7","alt":["1.70"],"ad":"$1.7$","sol":"$0.5+0.6+0.6=1.7$.","h":["$\\sum xP(x)$.","$1(0.5)+2(0.3)+3(0.2)$.","Add."]},{"topic":"Linear","q":"$E(X)=4$. Find $E(5X-3)$.","a":"17","alt":["17."],"ad":"$17$","sol":"$5(4)-3=17$.","h":["$E(aX+b)=aE(X)+b$.","$a=5$, $b=-3$.","Compute."]},{"topic":"Variance","q":"$\\operatorname{Var}(X)=9$. Find $\\operatorname{Var}(2X+7)$.","a":"36","alt":["36."],"ad":"$36$","sol":"$2^2\\times9=36$; the 7 does not matter.","h":["Constants added do not change spread.","Multiply by $a^2$.","$4\\times9$."]},{"topic":"Standard deviation","q":"$\\operatorname{Var}(X)=16$. Find $\\sigma(3X)$.","a":"12","alt":["12."],"ad":"$12$","sol":"$\\sigma=4$, so $\\sigma(3X)=3\\times4=12$.","h":["Find $\\sigma$ first.","$\\sigma=4$.","Multiply by 3."]},{"topic":"Variance","q":"$X=0,1$ with $P=0.6,0.4$. Find $\\operatorname{Var}(X)$.","a":"0.24","alt":[".24"],"ad":"$0.24$","sol":"$E=0.4$, $E(X^2)=0.4$, $\\operatorname{Var}=0.4-0.16=0.24$.","h":["$E(X)=0.4$.","$E(X^2)=0.4$.","Subtract $0.4^2$."]},{"topic":"Fair game","q":"Pay \\$3 to play; win \\$10 with probability 0.2, else nothing. Find the expected net gain in dollars.","a":"-1","alt":["-1.00","-$1"],"ad":"$-1$","sol":"$E=0.2(10)-3=-1$.","h":["Expected winnings first.","$0.2\\times10=2$.","Subtract the \\$3 cost."]},{"topic":"Cumulative","q":"$P(X=1)=0.2$, $P(X=2)=0.3$, $P(X=3)=0.5$. Find $P(X\\ge2)$.","a":"0.8","alt":[".8"],"ad":"$0.8$","sol":"$0.3+0.5=0.8$.","h":["List values $\\ge2$.","Add.","Or $1-P(X=1)$."]},{"topic":"Risk","q":"Two options have the same mean; option 1 has $\\sigma=2$ and option 2 has $\\sigma=5$. Which is riskier? (1 or 2)","a":"2","alt":["option 2"],"ad":"option 2","sol":"Larger standard deviation means more spread, so more risk.","h":["$\\sigma$ measures spread.","Compare values.","Bigger is riskier."]},{"topic":"Unknown","q":"$P(X=x)=\\frac{x}{15}$ for $x=1,\\dots,5$. Find $P(X\\le2)$.","a":"1/5","alt":["0.2","3/15"],"ad":"$\\frac15$","sol":"$\\frac1{15}+\\frac2{15}=\\frac3{15}$.","h":["Add the first two.","$\\frac{1+2}{15}$.","Simplify."]},{"topic":"Expected","q":"$x=1,2,3$; $p=0.2,0.5,0.3$. Find $E(X)$.","a":"2.1","alt":[],"ad":"$2.1$","sol":"$0.2+1.0+0.9$.","h":["Multiply each pair.","Add.","Check."]},{"topic":"Linear","q":"$E(X)=5$. Find $E(2X+1)$.","a":"11","alt":[],"ad":"$11$","sol":"$2(5)+1$.","h":["$E(aX+b)$.","Substitute.","Compute."]},{"topic":"Variance","q":"$\\text{Var}(X)=4$. Find $\\text{Var}(3X+1)$.","a":"36","alt":[],"ad":"$36$","sol":"$3^2\\cdot4$.","h":["Square the multiplier.","Ignore $+1$.","Compute."]},{"topic":"Standard deviation","q":"$\\text{Var}(X)=9$. Find $\\text{sd}(X)$.","a":"3","alt":[],"ad":"$3$","sol":"$\\sqrt9$.","h":["Square root.","$\\sqrt9$.","Done."]},{"topic":"Fair game","q":"A game costs $\\$3$ and pays $\\$9$ with probability $\\frac13$. Expected profit?","a":"0","alt":[],"ad":"$0$","sol":"$9\\cdot\\frac13-3=0$.","h":["$E(\\text{win})$.","$3$.","Subtract the cost."]},{"topic":"Variance","q":"$E(X)=2$, $E(X^2)=7$. Find $\\text{Var}(X)$.","a":"3","alt":[],"ad":"$3$","sol":"$7-4$.","h":["$E(X^2)-[E(X)]^2$.","Square 2.","Subtract."]},{"topic":"Unknown","q":"$P(X=x)=k(5-x)$ for $x=1,2,3,4$. Find $k$.","a":"1/10","alt":["0.1"],"ad":"$\\frac1{10}$","sol":"$k(4+3+2+1)=1$.","h":["Sum the terms.","$10k=1$.","Solve."]},{"topic":"Median","q":"$x=1,2,3$; $p=0.1,0.4,0.5$. Find $P(X\\le2)$.","a":"0.5","alt":["1/2"],"ad":"$0.5$","sol":"$0.1+0.4$.","h":["Cumulative.","Add.","Check."]},{"topic":"Mean","q":"$P(X=0)=0.4$, $P(X=5)=0.6$. Find $E(X)$.","a":"3","alt":[],"ad":"$3$","sol":"$5(0.6)$.","h":["Only $x=5$ contributes.","$5\\times0.6$.","Compute."]}],"comets":[{"topic":"Extension: Unknown constants","q":"$X=1,2,3$ with $P=a,\\ 2a,\\ a+0.2$ and $E(X)=2.2$. Find $a$.","a":"0.2","alt":[".2","1/5"],"ad":"$a=0.2$","sol":"$a+2a+a+0.2=1\\Rightarrow a=0.2$. Check: $E=0.2+0.8+1.2=2.2$ \u2713.","h":["Sum of probabilities is 1.","Solve for $a$.","Verify with $E(X)=2.2$."]},{"topic":"Extension: Variance of a transformed game","q":"A game's winnings $W$ have $E(W)=3$ and $\\operatorname{Var}(W)=4$. A player's profit is $P=5W-8$. Find $E(P)$ and $\\sigma(P)$ as two numbers separated by a comma.","a":"7,10","alt":["7 and 10","7, 10"],"ad":"$E(P)=7$, $\\sigma(P)=10$","sol":"$E(P)=15-8=7$; $\\operatorname{Var}(P)=25\\cdot4=100$ so $\\sigma=10$.","h":["Use $E(aX+b)$.","Use $\\operatorname{Var}(aX+b)=a^2\\operatorname{Var}$.","Take the square root."]},{"topic":"Extension: Shifted variance","q":"$X$ has mean $3$ and variance $2$. Find $E\\left(X^2\\right)$.","a":"11","alt":[],"ad":"$11$","sol":"$E(X^2)=\\text{Var}+[E(X)]^2=2+9$.","h":["Rearrange the variance formula.","$E(X^2)=\\text{Var}+\\mu^2$.","Substitute."]}],"hours":3.5},"mm3-c07":{"id":"mm3-c07","interactive":"binom","summary":"The Bernoulli and binomial distributions model repeated success/failure trials, like free throws or defective parts. You learn when a situation is binomial, how to calculate $P(X=k)$, how to use the mean $np$ and variance $np(1-p)$, and how to model with the binomial in context.","videos":[{"src":"B","title":"Binomial distributions, probabilities of probabilities (3Blue1Brown)","url":"https://www.youtube.com/watch?v=8idr1WZ1A7Q","kind":"video"},{"src":"J","title":"Bernoulli and binomial distributions","url":"https://www.youtube.com/results?search_query=Joel+Speranza+binomial+distribution","kind":"search"},{"src":"J","title":"Binomial with CAS and mean variance","url":"https://www.youtube.com/results?search_query=Joel+Speranza+binomial+mean+variance","kind":"search"}],"sections":[{"id":"mm3-c07-s1","code":"7.2","title":"Bernoulli distributions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: Bernoulli distribution","url":"https://www.youtube.com/results?search_query=Joel+Speranza+Bernoulli+distribution","kind":"search"}]},{"t":"p","x":"A **Bernoulli trial** has exactly two outcomes, \"success\" with probability $p$ and \"failure\" with probability $q=1-p$. Let $X=1$ for success and $0$ for failure. Then $E(X)=p$ and $\\operatorname{Var}(X)=p(1-p)$."},{"t":"ex","title":"Bernoulli","q":"A bolt is defective with probability $0.04$. Find $E(X)$ and $\\operatorname{Var}(X)$ where $X=1$ if defective.","s":["$E(X)=0.04$.","$\\operatorname{Var}(X)=0.04\\times0.96=0.0384$."],"a":"$0.04$ and $0.0384$"},{"t":"tb","rec":"1,2,4,6,7,9","ext":"10,12,13,14","x":"Exercise 7.2 introduces Bernoulli trials and the mean and variance of $X$.","code":"7.2"},{"t":"p","x":"**Bernoulli conditions:** one trial, exactly two outcomes (success or failure), fixed success probability $p$. Then $E(X)=p$ and $\\text{Var}(X)=p(1-p)$."},{"t":"ex","title":"Bernoulli","q":"A free throw succeeds with $p=0.7$. State $E(X)$ and $\\text{Var}(X)$.","s":["$E=0.7$; $\\text{Var}=0.7\\times0.3=0.21$."],"a":"$0.7$ and $0.21$"}]},{"id":"mm3-c07-s2","code":"7.3","title":"The binomial distribution","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: binomial distribution","url":"https://www.youtube.com/results?search_query=Joel+Speranza+binomial+distribution","kind":"search"},{"src":"B","title":"3Blue1Brown: Binomial distributions","url":"https://www.youtube.com/watch?v=8idr1WZ1A7Q","kind":"video"}]},{"t":"p","x":"Count the successes in $n$ **independent** Bernoulli trials with constant $p$: $X\\sim\\text{Bin}(n,p)$."},{"t":"key","x":"$$P(X=k)=\\binom nk p^k(1-p)^{n-k},\\qquad k=0,1,\\dots,n$$"},{"t":"p","x":"$\\binom nk=\\frac{n!}{k!(n-k)!}$ counts the arrangements. **Conditions for a binomial:** fixed $n$; two outcomes; constant $p$; independent trials. Use `binomPdf` for $P(X=k)$ and `binomCdf` for $P(X\\le k)$ on your CAS."},{"t":"ex","title":"Binomial probability","q":"$X\\sim\\text{Bin}(5,0.3)$. Find $P(X=2)$ and $P(X\\ge1)$.","s":["$P(X=2)=\\binom52(0.3)^2(0.7)^3=10(0.09)(0.343)=0.3087$.","$P(X\\ge1)=1-P(X=0)=1-0.7^5=1-0.16807=0.83193$."],"a":"$0.3087$ and $0.8319$"},{"t":"ex","title":"At least one","q":"A shooter hits 70% of shots. In 6 shots find $P(\\text{at least 4 hits})$.","s":["$P(X\\ge4)=P(4)+P(5)+P(6)$ with $X\\sim\\text{Bin}(6,0.7)$.","$=0.3241+0.3025+0.1176=0.7443$."],"a":"$0.7443$"},{"t":"warn","x":"\"At least\" means $\\ge$; \"more than\" means $>$. Rewrite the inequality and choose the right complement. $P(X\\ge1)=1-P(X=0)$, not $1-P(X=1)$."},{"t":"int","name":"binom","cap":"Change $n$ and $p$ and watch the bars, the mean and the spread move."},{"t":"tb","rec":"1,3,5,6,8,9,12","ext":"13,15,17,19,20","x":"Exercise 7.3 calculates binomial probabilities by formula and CAS, including cumulative and \"at least\" questions.","code":"7.3"},{"t":"ex","title":"Binomial probabilities","q":"$X\\sim\\text{Bin}(5,0.4)$. Find $P(X=2)$ and $P(X\\ge1)$.","s":["$P(X=2)=\\binom52(0.4)^2(0.6)^3=10(0.16)(0.216)=0.3456$.","$P(X\\ge1)=1-0.6^5=1-0.07776=0.92224$."],"a":"$0.3456$ and $0.9222$"},{"t":"warn","x":"Always justify a binomial model: fixed number of independent trials, two outcomes, constant $p$. Sampling without replacement from a small group breaks independence."}]},{"id":"mm3-c07-s3","code":"7.4","title":"The mean and variance of a binomial","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: mean and variance of the binomial","url":"https://www.youtube.com/results?search_query=Joel+Speranza+mean+and+variance+of+the+binomial","kind":"search"}]},{"t":"key","x":"$$E(X)=np,\\qquad\\operatorname{Var}(X)=np(1-p),\\qquad\\sigma=\\sqrt{np(1-p)}$$"},{"t":"p","x":"These come from adding up $n$ Bernoulli variables. The distribution is symmetric when $p=0.5$, skewed right when $p\u003c0.5$ and left when $p>0.5$."},{"t":"ex","title":"Mean and spread","q":"$X\\sim\\text{Bin}(50,0.2)$. Find $E(X)$ and $\\sigma$.","s":["$E=50(0.2)=10$.","$\\operatorname{Var}=50(0.2)(0.8)=8$, $\\sigma=\\sqrt8=2\\sqrt2\\approx2.83$."],"a":"$10$ and $2\\sqrt2$"},{"t":"ex","title":"Finding $n$ or $p$","q":"$X\\sim\\text{Bin}(n,p)$ has mean $12$ and variance $9$. Find $n$ and $p$.","s":["$np=12$, $np(1-p)=9\\Rightarrow1-p=\\frac34\\Rightarrow p=\\frac14$.","$n=\\frac{12}{1/4}=48$."],"a":"$n=48$, $p=\\frac14$"},{"t":"tb","rec":"1,2,5,8,10,12","ext":"13,15,16,18","x":"Exercise 7.4 uses $np$ and $np(1-p)$, including solving for $n$ and $p$.","code":"7.4"},{"t":"ex","title":"Mean and standard deviation","q":"$X\\sim\\text{Bin}(20,0.25)$. Find mean, variance and sd.","s":["$np=5$; $np(1-p)=3.75$; $\\sqrt{3.75}\\approx1.936$."],"a":"$5$, $3.75$, $1.94$"}]},{"id":"mm3-c07-s4","code":"7.5","title":"Modelling with binomials","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: binomial modelling","url":"https://www.youtube.com/results?search_query=Joel+Speranza+binomial+modelling","kind":"search"}]},{"t":"p","x":"Check the four binomial conditions, define $X$ and its parameters in words, calculate, then **comment** on whether the model is reasonable. Independence often fails in real life (for instance, family members sharing a disease), so say so."},{"t":"ex","title":"Modelling","q":"A call centre resolves 80% of calls first time. Of 20 calls, find the probability that at least 18 are resolved first time.","s":["$X\\sim\\text{Bin}(20,0.8)$. $P(X\\ge18)=P(18)+P(19)+P(20)\\approx0.1369+0.0576+0.0115=0.2060$."],"a":"$\\approx0.206$"},{"t":"tb","rec":"1,3,4,5","ext":"7,9,12,14,15,16","x":"Exercise 7.5 applies binomials to context, with checking of assumptions.","code":"7.5"},{"t":"ex","title":"Modelling","q":"8% of parts are faulty. In a batch of 12, find the probability that at most one is faulty.","s":["$P(0)=0.92^{12}=0.3677$; $P(1)=12(0.08)(0.92)^{11}=0.3837$.","Sum $=0.7514$."],"a":"about $0.751$"},{"t":"ex","title":"Smallest n","q":"Find the least $n$ so that $P(\\text{at least one success})>0.9$ with $p=0.2$.","s":["$1-0.8^n>0.9\\Rightarrow0.8^n\u003c0.1\\Rightarrow n>\\frac{\\ln0.1}{\\ln0.8}\\approx10.3$."],"a":"$n=11$"}]},{"id":"mm3-c07-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**CAS commands.** Use `binomPdf(n,p,k)` for $P(X=k)$ and `binomCdf(n,p,k)` for $P(X\\le k)$. Write the setup in words and symbols, such as $P(X\\le3)$, so marks do not depend on a bare calculator answer."},{"t":"p","x":"**Phrases to convert.** \"At least 2\" is $1-P(X\\le1)$. \"More than 2\" is $1-P(X\\le2)$. \"Fewer than 4\" is $P(X\\le3)$. \"Between 2 and 5 inclusive\" is $P(X\\le5)-P(X\\le1)$."}]}],"quiz":[{"topic":"Binomial","q":"$X\\sim\\text{Bin}(4,0.5)$. Find $P(X=2)$ as a fraction.","a":"3/8","alt":["0.375"],"ad":"$\\tfrac38$","sol":"$\\binom42(0.5)^4=6\\times\\frac1{16}=\\frac38$.","h":["$\\binom42=6$.","$(0.5)^4=\\frac1{16}$.","Multiply."]},{"topic":"Binomial","q":"$X\\sim\\text{Bin}(3,0.2)$. Find $P(X=0)$.","a":"0.512","alt":[".512"],"ad":"$0.512$","sol":"$0.8^3=0.512$.","h":["All failures.","Probability of failure is 0.8.","Cube it."]},{"topic":"Mean","q":"$X\\sim\\text{Bin}(40,0.15)$. Find $E(X)$.","a":"6","alt":["6."],"ad":"$6$","sol":"$np=6$.","h":["$np$.","$40\\times0.15$.","Compute."]},{"topic":"Variance","q":"$X\\sim\\text{Bin}(40,0.15)$. Find $\\operatorname{Var}(X)$.","a":"5.1","alt":["5.10"],"ad":"$5.1$","sol":"$40(0.15)(0.85)=5.1$.","h":["$np(1-p)$.","$6\\times0.85$.","Compute."]},{"topic":"At least one","q":"$X\\sim\\text{Bin}(5,0.1)$. Find $P(X\\ge1)$ to 4 decimal places.","a":"0.4095","alt":[".4095"],"ad":"$0.4095$","sol":"$1-0.9^5=1-0.59049=0.40951$.","h":["Complement.","$P(X=0)=0.9^5$.","Subtract from 1."]},{"topic":"Find p","q":"$X\\sim\\text{Bin}(30,p)$ has mean $6$. Find $p$.","a":"0.2","alt":["1/5",".2"],"ad":"$0.2$","sol":"$30p=6\\Rightarrow p=0.2$.","h":["Mean is $np$.","$30p=6$.","Divide."]},{"topic":"Conditions","q":"A card is drawn from a deck without replacement, 5 times, and $X$ counts the aces. Is $X$ binomial? (yes or no)","a":"no","alt":["No"],"ad":"no","sol":"Without replacement the trials are not independent and $p$ changes.","h":["Check independence.","Does $p$ stay constant?","No replacement."]},{"topic":"Binomial","q":"$X\\sim\\text{Bin}(6,0.5)$. Find $P(X=3)$ to 4 decimal places.","a":"0.3125","alt":[".3125","5/16"],"ad":"$0.3125$","sol":"$\\binom63(0.5)^6=\\frac{20}{64}=0.3125$.","h":["$\\binom63=20$.","$(0.5)^6=\\frac1{64}$.","Multiply."]},{"topic":"Standard deviation","q":"$X\\sim\\text{Bin}(100,0.5)$. Find $\\sigma$.","a":"5","alt":["5."],"ad":"$5$","sol":"$\\sqrt{100(0.5)(0.5)}=\\sqrt{25}=5$.","h":["$\\sqrt{np(1-p)}$.","$100\\times0.25=25$.","Square root."]},{"topic":"Bernoulli","q":"A Bernoulli trial has $p=0.3$. Find its variance.","a":"0.21","alt":[".21"],"ad":"$0.21$","sol":"$p(1-p)=0.3\\times0.7=0.21$.","h":["Variance formula.","$0.3\\times0.7$.","Compute."]},{"topic":"Bernoulli","q":"Variance of a Bernoulli trial with $p=0.4$.","a":"0.24","alt":[],"ad":"$0.24$","sol":"$0.4\\times0.6$.","h":["$p(1-p)$.","$0.4\\cdot0.6$.","Compute."]},{"topic":"Binomial","q":"$X\\sim\\text{Bin}(4,0.5)$. $P(X=2)$.","a":"3/8","alt":["0.375"],"ad":"$\\frac38$","sol":"$6\\cdot\\frac1{16}$.","h":["$\\binom42=6$.","$(0.5)^4$.","Multiply."]},{"topic":"Complement","q":"$X\\sim\\text{Bin}(3,0.5)$. $P(X\\ge1)$.","a":"7/8","alt":["0.875"],"ad":"$\\frac78$","sol":"$1-0.5^3$.","h":["Use the complement.","$P(0)=\\frac18$.","Subtract."]},{"topic":"Mean","q":"$X\\sim\\text{Bin}(50,0.2)$. Mean?","a":"10","alt":[],"ad":"$10$","sol":"$np$.","h":["$np$.","$50(0.2)$.","Compute."]},{"topic":"Variance","q":"$X\\sim\\text{Bin}(50,0.2)$. Variance?","a":"8","alt":[],"ad":"$8$","sol":"$
