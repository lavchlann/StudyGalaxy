let FLASH0=performance.now();
let LASTD=0,LPO=false,SETTLE=0;
function frame(now){
  requestAnimationFrame(frame);qualityWatch(now);
  /* behind a lesson panel or a full-screen view the sky is mostly hidden and blurred, so animate it at a lower rate */
  {const po=panelOpen();if(po!==LPO){LPO=po;SETTLE=now+1300;}
   if(!tr&&!REDUCE&&now>SETTLE&&(typeof FXOVER!=='undefined'&&FXOVER&&now-LASTD<33))return;}
  LASTD=now;
  if(cv.clientWidth&&(cv.clientWidth!==W||cv.clientHeight!==H))resize();if(!W||!H)return;
  const t=REDUCE?0:now;
  const target=panelOpen()?255:0;
  shiftX+=(target-shiftX)*(REDUCE?1:.09);{const ht=(V.view==='galaxy'&&W>1100&&!panelOpen())?Math.min(200,W*.13):0;heroX+=(ht-heroX)*(REDUCE?1:.07);}
  ctx.clearRect(0,0,W,H);
  drawBackdrop(now);
  hits=[];fxCamStep();ctx.save();ctx.translate(W/2+CAM.x,H/2+CAM.y);ctx.scale(CAM.z,CAM.z);ctx.translate(-W/2,-H/2);
  if(tr){
    const k=Math.min(1,(now-tr.t0)/tr.dur);
    if(tr.kind==='in'){
      if(k<.5){const e=ease(k*2);drawGalaxy(now,{zoomOn:tr.subj,z:1+e*9,alpha:1-e*.92});}
      else{if(V.view!=='subject'){V.view='subject';V.subj=tr.subj;unitT0=performance.now();chrome();}const e=ease((k-.5)*2);drawSubject(now,{scale:.35+.65*e,alpha:e});}
    }else{
      if(k<.5){const e=ease(k*2);drawSubject(now,{scale:1-.65*e,alpha:1-e});}
      else{if(V.view!=='galaxy'){V.view='galaxy';galT0=performance.now()-900;chrome();}const e=ease((k-.5)*2);drawGalaxy(now,{zoomOn:tr.subj,z:10-9*e,alpha:.08+.92*e});}
    }
    if(k>=1)tr=null;
    ctx.restore();return;
  }
  if(V.view==='galaxy')drawGalaxy(now);else drawSubject(now);
  ctx.restore();
}
function go(kind,id){fxCamReset();
  if(REDUCE){if(kind==='in'){V.view='subject';V.subj=id;}else{V.view='galaxy';}chrome();return;}
  tr={kind:kind,subj:id,t0:performance.now(),dur:1300};{const td=$('#today');if(td){if(kind==='in')td.classList.add('out');else setTimeout(()=>td.classList.remove('out'),700);}}
}

/* ---------- pointer ---------- */
function hitAt(e){
  const b=cv.getBoundingClientRect(),x=(e.clientX-b.left-W/2-CAM.x)/CAM.z+W/2,y=(e.clientY-b.top-H/2-CAM.y)/CAM.z+H/2;
  for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(Math.hypot(x-h.x,y-h.y)<=h.r)return h;}
  return null;
}
cv.addEventListener('pointermove',e=>{const h=hitAt(e);V.hover=h?h.id:null;cv.style.cursor=h?'pointer':'default';});
cv.addEventListener('pointerleave',()=>{V.hover=null;});
cv.addEventListener('click',e=>{const h=hitAt(e);if(!h||tr)return;if(h.kind==='sun')enterSubject(h.id);else if(h.kind==='station')openExam();else openChapter(h.id);});

/* ---------- navigation ---------- */

async function commit(){
  if(window.SG_WEB){fxMirror();return;}
  let art=null;
  try{art=window.claude&&window.claude.use?await window.claude.use('artifact'):null;}catch(e){}
  if(!art){toast('Progress is kept in this view only. Open the saved page in Claude to keep it.');chrome();renderPanel();return;}

async function getSample(){
  if(SAMPLE!==undefined)return SAMPLE;
  if(window.SG_WEB){SAMPLE=fxWebSample();return SAMPLE;}
  try{SAMPLE=window.claude&&window.claude.use?await window.claude.use('sample'):null;}catch(e){SAMPLE=null;}

}
function errText(e){
  if(!e)return'Something went wrong.';
  if(e.code==='nokey')return'Add your Claude API key in Settings (the gear icon) to use this.';
  if(e.code==='badkey'||e.code==='network')return e.message;
  if(e.code==='unavailable')return'Lessons and quizzes need this page to be open in Claude.';
  if(e.code==='not_granted')return'Claude access was not allowed for this page.';
  if(e.code==='rate_limited')return'Too many requests just now. Wait a moment and try again.';
  return e.message||'Something went wrong. Try again.';
}
async function askText(prompt,onText,signal){
  const s=await getSample();if(!s)throw{code:'unavailable'};
  const r=await s(prompt,{onText:onText,signal:signal,modelTier:'default',cache:false});
  return r.text;
}
async function askJSON(prompt,signal){
  const s=await getSample();if(!s)throw{code:'unavailable'};
  return s.json(prompt,{signal:signal,modelTier:'default',cache:false});
}

/* ---------- text formatting ---------- */
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
function md(t){
  let out='',ul=false;
  for(const raw of String(t).split('\n')){
    const l=raw.trimEnd();
    if(/^\s*[-•*]\s+/.test(l)){if(!ul){out+='<ul>';ul=true;}out+='<li>'+inl(l.replace(/^\s*[-•*]\s+/,''))+'</li>';continue;}
    if(ul){out+='</ul>';ul=false;}
    if(/^#{1,4}\s/.test(l))out+='<h4>'+inl(l.replace(/^#+\s*/,''))+'</h4>';
    else if(l.trim())out+='<p>'+inl(l)+'</p>';
  }
  return out+(ul?'</ul>':'');
}

const dayKey=t=>new Date(t).toLocaleDateString('en-CA');
function streakInfo(){
  const days=fxStreakDays(),d=new Date(),today=days.has(dayKey(d));
  if(!today)d.setDate(d.getDate()-1);
  let n=0;while(days.has(dayKey(d))){n++;d.setDate(d.getDate()-1);}
  return{n:n,today:today};
}
function weekInfo(){
  const now=Date.now(),w=S.log.filter(e=>now-e.t<7*DAY),pv=S.log.filter(e=>now-e.t>=7*DAY&&now-e.t<14*DAY);
  const avg=l=>{const r=l.filter(e=>e.k==='revise');return r.length?Math.round(r.reduce((a,e)=>a+e.pct,0)/r.length):null;};
  return{days:new Set(w.map(e=>dayKey(e.t))).size,checks:w.filter(e=>e.k==='revise').length,learns:w.filter(e=>e.k==='learn').length,avg:avg(w),prevAvg:avg(pv),newSolid:w.filter(e=>e.after==='solid'&&e.before!=='solid').length,fixed:w.reduce((a,e)=>a+(e.fixed||0),0)};
}
function weakTopics(){
  const g={};
  for(const m of S.mistakes){
    if(m.rights.length>=2)continue;
    const k=m.ch+'|'+(m.topic||'General'),o=g[k]||(g[k]={ch:m.ch,topic:m.topic||'General',n:0,cw:0,types:{},t:0});
    o.n++;if(m.conf===3)o.cw++;o.types[m.type]=(o.types[m.type]||0)+1;o.t=Math.max(o.t,m.t);
  }
  return Object.values(g).sort((a,b)=>b.n-a.n||b.t-a.t).slice(0,8);
}

  const sum=summarize(),o=outcome(sum),pct=Math.round(sum.score*100);
  return'<p class="big" style="color:'+COL[o]+'">'+pct+'%</p><p class="muted">'+(o==='solid'?'This star lights up. I will bring it back for review in a few days.':o==='revise'?'This star turns amber: you have most of it, but there are gaps to close.':'Back to learning for this chapter. Try the Learn mode again, then another checkpoint.')+'</p>'+
   '<div class="res">'+sess.qs.map((q,i)=>'<div><span>'+(i+1)+'. '+esc(q.topic||'Question')+(q.st.conf===3&&q.st.firstWrong?' (certain, but wrong)':'')+'</span><b>'+(q.st.void?'void':q.st.credit===1?'✓':q.st.credit>0?'½':'✗')+'</b></div>').join('')+'</div>'+
   '<p class="sub">Hints used: '+sum.hints+'. Confident-but-wrong answers: '+sum.cw+'.</p><div class="row"><button class="btn" data-act="saverev">Save to map</button><button class="btn ghost" data-act="back">Discard</button></div>';
}

/* ---------- prompts ---------- */
function ctxLine(c){return'Subject: '+c.s.name+'. Unit '+c.u+' of Queensland senior secondary (QCE Units 3 and 4, Year 12). Textbook chapter: "'+c.ch.title+'".';}
const MATHSTYLE='Write maths in LaTeX: $...$ for inline maths and $$...$$ for display maths (for example $\\frac{d}{dx}e^{2x}=2e^{2x}$).';
function lessonPrompt(c){
  const maths=/math/i.test(c.s.name);
  return'You are a warm, clear, patient tutor teaching a Year 12 student.\n'+ctxLine(c)+'\nTeach this chapter from scratch using these markdown headings: ## What this chapter is about, ## Key ideas (short bullets with the key formulas), ## Worked example 1 (a standard question with every step shown), ## Worked example 2 (harder, exam-style), ## Common mistakes. About 500 to 700 words.\n'+(maths?MATHSTYLE+' Put each key equation or step on its own line wrapped in backticks. ':'')+'Check every calculation by substituting back before you write it. You are working from the chapter title and the usual curriculum, not from the textbook text, so do not claim to quote the textbook.';
}
function qPrompt(c,n,strict,re){
  const maths=/math/i.test(c.s.name);
  return'You are writing '+n+' '+(strict?'exam-style checkpoint':'guided practice')+' questions for a Year 12 student.\n'+ctxLine(c)+'\n'+
   (maths?'Each question must have one short final answer that can be typed as plain text (a number, an expression, an interval or a probability). No graphs or diagrams, and nothing that needs more than simple arithmetic by hand. '+MATHSTYLE:'Each question should be answerable in one to three sentences. Write in plain text.')+
   '\nCover different sub-topics of the chapter and ramp up in difficulty ('+(strict?'start with a standard skill and finish with a harder multi-step question':'easy, then medium, then slightly harder')+'). Work every question out fully and verify each answer by substituting back or re-deriving it before you write it down.\n'+
   (re.length?'The first '+re.length+' question(s) must be fresh variants of questions the student previously got wrong (same skill, changed numbers or wording), in this order:\n'+re.map((m,i)=>(i+1)+'. '+m.q).join('\n')+'\n':'')+
   'Return only JSON: an array of '+n+' objects {"q": question text, "answer": final answer, "solution": numbered steps as one string, "topic": 2 to 4 word sub-topic, "hints": [a small nudge, an outline of the method, the full first step]}. No hint may state the final answer.';
}
function gradePrompt(c,q,ans,strict){
  const maths=/math/i.test(c.s.name);
  return'You are marking a Year 12 answer.\nQuestion: '+q.q+'\nReference answer: '+q.answer+'\nReference solution: '+q.solution+'\nStudent answer: '+ans+'\n'+
   (maths?'Accept mathematically equivalent forms (simplified or not, reasonable rounding, equal expressions, equivalent intervals). ':'Accept answers that make the same key points in different words. ')+
   'Reply only as JSON: {"correct": true or false, "errorType": "none" or "concept" or "method" or "arithmetic" or "misread" or "incomplete", "note": "at most two sentences. '+(strict?'If wrong, say what kind of error it looks like and roughly where, WITHOUT giving the correct answer or the solution.':'If wrong, explain the likely error kindly and point toward the fix.')+'"}';
}

/* ---------- sessions ---------- */
function mkQs(arr,n,re){
  if(arr&&!Array.isArray(arr)&&Array.isArray(arr.questions))arr=arr.questions;
  if(!Array.isArray(arr))throw{message:'Claude sent back something unexpected. Try again.'};
  const g=['Think about which rule or definition applies first.','Write down what you are given, then pick the method that uses it.','Start with the first step of that method and apply it carefully.'];
  const qs=arr.slice(0,n).filter(o=>o&&o.q&&o.answer).map((o,i)=>({q:String(o.q),answer:String(o.answer),solution:String(o.solution||''),topic:String(o.topic||''),hints:[0,1,2].map(k=>String((o.hints||[])[k]||g[k])),retestOf:re[i]?re[i].id:null,st:{conf:null,text:'',attempts:0,hints:0,credit:0,done:false,void:false,note:'',errorType:'',firstWrong:false,wrong:false,busy:false,err:'',revealed:false}}));
  if(!qs.length)throw{message:'No usable questions came back. Try again.'};
  return qs;
}
async function startLearn(force){
  const c=findCh(V.sel),cid=c.ch.id;
  if(force!==true&&S.lessons[cid]){sess={kind:'learn',ch:c,phase:'lesson',text:S.lessons[cid],qa:[],abort:new AbortController(),retry:startLearn};renderPanel();return;}
  sess={kind:'learn',ch:c,phase:'loading',msg:'Writing your lesson…',text:'',qa:[],abort:new AbortController(),retry:startLearn};renderPanel();
  const me=sess;
  try{
    const t=await askText(lessonPrompt(c),x=>{if(sess!==me)return;me.text=x.text;const b=$('#lessonBody');if(b)b.innerHTML=md(x.text);else renderPanel();},me.abort.signal);
    if(sess!==me)return;me.text=t;me.phase='lesson';S.lessons[cid]=t;DIRTY.add(cid);renderPanel();
  }catch(e){if(sess!==me)return;me.err=errText(e);renderPanel();}
}
async function startQuizAI(strict,force){
  const c=findCh(V.sel),cid=c.ch.id;
  const keep=sess&&sess.kind==='learn'?sess:null;
  const re=strict?openMistakes(c.ch.id).slice(0,3):[];
  const me=sess={kind:strict?'revise':'learn',ch:c,phase:'loading',msg:strict?'Building your checkpoint…':'Building practice questions…',qa:[],text:keep?keep.text:'',abort:new AbortController(),retry:()=>startQuizAI(strict)};
  me.practice=!strict;
  const n=strict?8:3;
  try{
    if(force!==true){
      if(!strict&&S.practice[cid]){me.qs=mkQs(S.practice[cid],n,[]);me.i=0;me.phase='q';renderPanel();return;}
      if(strict&&S.bank[cid]){const re2=(S.bank[cid].re||[]).map(i=>S.mistakes.find(m=>m.id===i)).filter(Boolean);me.qs=mkQs(S.bank[cid].arr,n,re2);me.i=0;me.phase='q';renderPanel();return;}
    }
  }catch(e){}
  renderPanel();
  try{
    const arr=await askJSON(qPrompt(c,n,strict,re),me.abort.signal);
    if(sess!==me)return;
    me.qs=mkQs(arr,n,re);
    const raw=Array.isArray(arr)?arr:arr.questions;
    if(strict)S.bank[cid]={arr:raw,re:re.map(m=>m.id)};else S.practice[cid]=raw;
    me.i=0;me.phase='q';renderPanel();
  }catch(e){if(sess!==me)return;me.err=errText(e);renderPanel();}
}
async function submit(){
  const q=sess.qs[sess.i],st=q.st;
  const box=$('#abox');if(box)st.text=box.value;
  if(!st.text.trim()){toast('Type an answer first.');return;}
  if(!q.keys)return submitAI();
  st.attempts++;
  if(q.keys.some(k=>sameAns(k,st.text))){st.note='';st.errorType='none';st.wrong=false;st.err='';st.done=true;st.credit=(st.attempts===1&&st.hints===0)?1:(st.hints<3?.5:0);QOK(q,st);}
  else{if(st.attempts===1)st.firstWrong=true;st.wrong=true;st.note=errHint(q.keys[0],st.text);st.errorType='method';}
  renderPanel();
}
async function claudeCheck(){
  const q=sess.qs[sess.i],st=q.st,me=sess;
  st.busy=true;st.err='';renderPanel();
  try{
    const r=await askJSON(gradePrompt(sess.ch,q,st.text,STRICT()),me.abort.signal);
    if(sess!==me)return;
    st.busy=false;st.note=String(r.note||'');st.errorType=String(r.errorType||st.errorType||'');
    if(r.correct===true||r.correct==='true'){st.wrong=false;st.done=true;st.credit=(st.attempts<=1&&st.hints===0)?1:(st.hints<3?.5:0);}
  }catch(e){if(sess!==me)return;st.busy=false;st.err=errText(e)+' You can mark this one yourself.';}
  renderPanel();
}
async function submitAI(){
  const q=sess.qs[sess.i],st=q.st,strict=STRICT();
  const box=$('#abox');if(box)st.text=box.value;
  if(!st.text.trim()){toast('Type an answer first.');return;}
  if(norm(st.text)===norm(q.answer)){st.attempts++;st.note='';st.errorType='none';st.wrong=false;st.err='';st.done=true;st.credit=(st.attempts===1&&st.hints===0)?1:(st.hints<3?.5:0);renderPanel();return;}
  st.busy=true;st.err='';st.wrong=false;renderPanel();
  const me=sess;
  try{
    const r=await askJSON(gradePrompt(sess.ch,q,st.text,strict),me.abort.signal);
    if(sess!==me)return;
    st.busy=false;st.attempts++;st.note=String(r.note||'');st.errorType=String(r.errorType||'');
    if(r.correct===true||r.correct==='true'){st.done=true;st.credit=(st.attempts===1&&st.hints===0)?1:(st.hints<3?.5:0);}
    else{if(st.attempts===1)st.firstWrong=true;st.wrong=true;}
  }catch(e){if(sess!==me)return;st.busy=false;st.err=errText(e)+' You can mark this one yourself.';}
  renderPanel();
}
function settleSelf(ok){
  const q=sess.qs[sess.i],st=q.st;st.err='';st.attempts++;
  if(ok){st.done=true;st.credit=(st.attempts===1&&st.hints===0)?1:(st.hints<3?.5:0);}else{if(st.attempts===1)st.firstWrong=true;st.wrong=true;}
}
function nextQ(){
  if(sess.i+1<sess.qs.length){sess.i++;sess.phase='q';}
  else sess.phase=STRICT()?'results':'learndone';
}
function applyRevise(c,sum){
  const id=c.ch.id,p=S.progress[id]||(S.progress[id]={status:'new',attempts:0,history:[],streak:0,due:0}),before=effStatus(id);let fixed=0;
  delete S.bank[id];
  p.attempts=(p.attempts||0)+1;p.history=(p.history||[]).concat([{t:Date.now(),pct:Math.round(sum.score*100),hints:sum.hints,mode:'revise'}]).slice(-12);
  p.risky=sum.cw>0;
  if(sum.score>=.8&&sum.hints<=1){p.status='solid';p.streak=(p.streak||0)+1;p.due=Date.now()+[7,21,60][Math.min(p.streak-1,2)]*DAY;}
  else if(sum.score>=.5){p.status='revise';p.streak=0;p.due=Date.now()+2*DAY;}
  else{p.status='learning';p.streak=0;p.due=0;}
  for(const q of sess.qs){
    if(q.st.void)continue;
    if(q.retestOf){const m=S.mistakes.find(m=>m.id===q.retestOf);if(m&&q.st.credit===1){const d=new Date().toDateString();if(!m.rights.includes(d)){m.rights.push(d);if(m.rights.length===2)fixed++;}}}
    else if(q.st.credit<1)S.mistakes.push({id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),ch:id,qid:q.qid,topic:q.topic,q:q.q,a:q.answer,type:q.st.errorType||'method',conf:q.st.conf,t:Date.now(),rights:[]});
  }
  S.mistakes=S.mistakes.slice(-200);
  S.flash={id:id,t:Date.now(),to:effStatus(id)};
  S.log=S.log.concat([{t:Date.now(),k:'revise',ch:id,pct:Math.round(sum.score*100),before:before,after:effStatus(id),fixed:fixed}]).slice(-300);
}
function applyLearn(c){
  const id=c.ch.id,p=S.progress[id]||(S.progress[id]={status:'new',attempts:0,history:[],streak:0,due:0});
  const before=effStatus(id);
  if(!p.status||p.status==='new')p.status='learning';
  p.learned=Date.now();S.flash={id:id,t:Date.now(),to:effStatus(id)};
  S.log=S.log.concat([{t:Date.now(),k:'learn',ch:id,before:before,after:effStatus(id)}]).slice(-300);
}

$('#panel').addEventListener('input',e=>{if(!sess||sess.phase!=='q')return;if(e.target.id==='abox')sess.qs[sess.i].st.text=e.target.value;});
$('#panel').addEventListener('keydown',e=>{

async function ask(){
  const b=$('#askbox');if(!b||!b.value.trim()||sess.askBusy)return;
  const q=b.value.trim(),item={q:q,a:''};sess.qa.push(item);sess.askBusy=true;renderPanel();const me=sess;
  try{

    const prompt='You are a warm, clear tutor for a Year 12 student. '+ctxLine(sess.ch)+'\nLesson already given:\n'+sess.text.slice(0,3500)+'\n'+(prev?'Earlier questions:\n'+prev+'\n':'')+'Student question: '+q+'\n'+(S.set.socratic?'Use the Socratic method. Do not give the final answer or the full solution. Ask one or two short guiding questions that lead the student to their next step, and add a small hint only if they seem stuck. If their message shows they have reached the right answer, confirm it and say briefly why it is right. Under 120 words. ':'Answer in under 200 words. ')+MATHSTYLE;

$('#panel').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  RESET=!['secdone','hint','conf','submit','self','iwasright','keybad','giveup','claudecheck','wgreset','wgpre','solnext','solall','wide','hidepanel'].includes(a);
  const q=sess&&sess.qs&&sess.phase==='q'?sess.qs[sess.i]:null;
  switch(a){
    case'close':closePanel();return;
    case'keep':commit();return;
    case'regen':{const rid=sess.ch.ch.id;delete S.lessons[rid];delete S.practice[rid];DIRTY.delete(rid);startLearn(true);return;}
    case'learn':startLearn();return;
    case'revise':startQuiz(true);return;
    case'back':endSess();renderPanel();return;
    case'retry':if(sess&&sess.retry)sess.retry();return;
    case'practice':startQuiz(false);return;

    case'finishlearn':sess.phase='learndone';renderPanel();return;
    case'savelearn':if(sess.kind==='comet')applyComet(sess.ch);else applyPractice(sess.ch);endSess();chrome();renderPanel();commit();return;
    case'saverev':if(sess.kind==='exam')applyExam();else{const sm=summarize();applyRevise(sess.ch,sm);const pp=S.progress[sess.ch.ch.id];pp.rc=(pp.rc||0)+1;addXP(20+(outcome(sm)==='solid'?30:0));}endSess();chrome();renderPanel();commit();return;
    case'conf':q.st.conf=+v;break;
    case'submit':submit();return;
    case'hint':if(q.st.hints<3)q.st.hints++;break;
    case'giveup':q.st.done=true;q.st.credit=0;q.st.revealed=true;q.st.attempts++;if(q.st.attempts===1)q.st.firstWrong=true;break;
    case'iwasright':q.st.wrong=false;q.st.done=true;q.st.credit=(q.st.hints===0&&q.st.attempts===1)?1:.5;q.st.note='Marked correct by you.';q.st.firstWrong=false;break;
    case'keybad':q.st.void=true;q.st.done=true;q.st.credit=0;q.st.wrong=false;q.st.note='Question removed from your score.';break;
    case'self':settleSelf(v==='1');break;
    case'next':nextQ();break;
    case'read':{const c=findCh(V.sel),ct=CT[c.ch.id];sess={kind:'read',ch:c,phase:'read',tab:'lesson',sec:null,qa:[],text:ct.sections.map(s=>s.title+': '+s.blocks.map(x=>x.x||x.q||'').join(' ')).join('\n'),abort:new AbortController()};break;}
    case'tab':sess.tab=v;break;

    case'secdone':{

      if(!secs[v]){secs[v]=Date.now();addXP(5);if(!p.status||p.status==='new')p.status='learning';
        S.log=S.log.concat([{t:Date.now(),k:'learn',ch:id,before:'new',after:effStatus(id)}]).slice(-300);
        if(ct.sections.every(s=>secs[s.id])){p.learned=Date.now();addXP(10);toast('Whole chapter read. Now try the practice questions.');}
        UNSAVED=true;chrome();}
      const i=ct.sections.findIndex(s=>s.id===v);if(i<ct.sections.length-1)sess.sec=i+1;RESET=true;break;}
    case'wide':V.wide=!V.wide;break;
    case'hidepanel':V.hidden=true;break;
    case'wgreset':case'wgpre':{const w=b.closest('.wg');if(!w)return;if(a==='wgreset')w.querySelectorAll('input').forEach(i=>{i.value=i.defaultValue;});else{const o=JSON.parse(v);w.querySelectorAll('input').forEach(i=>{if(o[i.name]!=null)i.value=o[i.name];});}wgUpdate(w);return;}
    case'solnext':{const st=sess.qs[sess.i].st;st.sol=(st.sol||1)+1;break;}
    case'solall':{sess.qs[sess.i].st.sol=99;break;}
    case'selfcheck':{const par=sess,id=par.ch.ch.id,ct=CT[id],p=S.progress[id]||{},si=Math.max(0,ct.sections.findIndex(s=>s.id===v));
      const idx=rot(ct.quiz.length,0,(p.pc||0)+si*3+1).slice(0,3);
      sess={kind:'check',ch:par.ch,phase:'q',qa:[],text:'',abort:new AbortController(),qs:idx.map(i=>qObj(ct.quiz[i],id+'-q'+i,id)),i:0,parent:par,secid:v};break;}
    case'checkdone':{const par=sess.parent,sid=sess.secid;sess=par;markSec(par.ch.ch.id,sid);break;}
    case'checkback':sess=sess.parent;break;
    case'comet':startComet();return;
    case'startexam':startExam();return;
    case'claudecheck':claudeCheck();return;
    case'addch':{
      const box=$('#addbox'),lines=(box?box.value:'').split('\n').map(x=>x.trim()).filter(Boolean);
      if(!lines.length){toast('Type at least one chapter name.');return;}

/* ---------- local answer checking ---------- */
function cleanA(s){
  return String(s).toLowerCase().replace(/\$/g,'').replace(/\\(left|right|,|;|!)/g,'').replace(/\\(?:d|t)?frac\{([^{}]*)\}\{([^{}]*)\}/g,'($1)/($2)').replace(/\\(pi|theta|sqrt|ln|sin|cos|tan|cdot|times)/g,'$1').replace(/[{}]/g,'')
   .replace(/\s+/g,'').replace(/[·×]/g,'*').replace(/−/g,'-').replace(/π/g,'pi').replace(/√/g,'sqrt').replace(/²/g,'^2').replace(/³/g,'^3').replace(/θ/g,'theta').replace(/±/g,'+-')
   .replace(/°|degrees|units|square/g,'').replace(/and/g,',').replace(/\.$/,'');
}
function forms(s){
  const c=cleanA(s),out=new Set([c]);
  const m=c.match(/^[a-z]{1,3}(\([a-z0-9]+\))?=(.+)$/);if(m&&c.split('=').length===2)out.add(m[2]);
  if(c.indexOf(',')>0&&!/[()]/.test(c))out.add(c.split(',').sort().join(','));
  [...out].forEach(x=>{if(/^\(.*\)$/.test(x)&&x.indexOf('(',1)<0)out.add(x.slice(1,-1));});
  return out;
}
const numOfA=s=>{s=cleanA(s);let m=s.match(/^(-?\d*\.?\d+)$/);if(m)return{v:parseFloat(m[1]),dp:(m[1].split('.')[1]||'').length,frac:false};m=s.match(/^(-?\d+)\/(\d+)$/);if(m&&+m[2])return{v:+m[1]/+m[2],dp:0,frac:true};return null;};
function sameAns(key,given){
  const kn=numOfA(key),gn=numOfA(given);
  if(kn&&gn){const tol=kn.frac?.00051:kn.dp?0.5*Math.pow(10,-kn.dp)+1e-12:1e-9;return Math.abs(kn.v-gn.v)<=tol;}
  const sq=f=>{const o=new Set();f.forEach(x=>{o.add(x);o.add(x.replace(/\(([a-z0-9.]+)\)/g,'$1'));});return o;};
  const a=sq(forms(key)),b=sq(forms(given));for(const x of a)if(b.has(x))return true;return false;
}

function errHint(key,given){
  const k=numOfA(key),g=numOfA(given),base='That does not match the answer key. Check the form (exact values, simplified, brackets); if yours is equivalent, tap “I was right”.';
  if(k&&g){
    if(k.v!==0&&Math.abs(g.v+k.v)<1e-9)return'Sign error: your answer is the negative of the key. Recheck the sign on each step.';
    if(k.v!==0&&Math.abs(g.v/k.v-1)<.02)return'Very close: this looks like a rounding difference. Keep full decimals until the last step.';
    if(k.v!==0&&g.v!==0){const r=g.v/k.v;if((Math.abs(r)>=2&&Math.abs(r-Math.round(r))<1e-6)||(Math.abs(1/r)>=2&&Math.abs(1/r-Math.round(1/r))<1e-6))return'Factor error: your answer is a whole-number multiple or fraction of the key. Look for a missed chain-rule factor or a missed division.';}
    return'Wrong value. Redo the working line by line and compare with the worked example in the lesson.';
  }
  const ck=cleanA(key),cg=cleanA(given);
  if(/\+c$/.test(ck)&&!/\+c$/.test(cg)&&sameAns(ck.replace(/\+c$/,''),cg))return'Missing + c: an indefinite integral needs the constant of integration.';
  if(cg==='-'+ck||'-'+cg===ck)return'Sign error: your expression is the negative of the key. Recheck the signs.';
  return base;
}

function markSec(id,sid){
  const p=S.progress[id]||(S.progress[id]={status:'new',attempts:0,history:[],streak:0,due:0}),secs=p.secs||(p.secs={}),ct=CT[id];
  if(!secs[sid]){secs[sid]=Date.now();addXP(5);if(!p.status||p.status==='new')p.status='learning';
    S.log=S.log.concat([{t:Date.now(),k:'learn',ch:id,before:'new',after:effStatus(id)}]).slice(-300);
    if(ct.sections.every(s=>secs[s.id])){p.learned=Date.now();addXP(10);toast('Whole chapter read. Now try the practice questions.');}
    UNSAVED=true;chrome();}
  const i=ct.sections.findIndex(s=>s.id===sid);if(i<ct.sections.length-1)sess.sec=i+1;
}
function checkDoneHTML(){
  const ok=sess.qs.filter(q=>q.st.done&&!q.st.revealed&&q.st.credit>0).length,n=sess.qs.length,pass=ok>=2;
  return'<p class="big">'+ok+' of '+n+'</p><p class="muted">'+(pass?'Nice. You can mark this section as understood.':'Not solid yet. Re-read the worked examples, then try again, or move on and come back.')+'</p><div class="row">'+(pass?'<button class="btn" data-act="checkdone">Mark section understood</button><button class="btn ghost" data-act="checkback">Back to lesson</button>':'<button class="btn" data-act="checkback">Back to lesson</button><button class="btn link" data-act="checkdone">Mark understood anyway</button>')+'</div>';
}
function panelState(){
  const p=$('#panel'),open=p.classList.contains('open');
  if(!open)V.hidden=false;
  p.classList.toggle('hid',open&&!!V.hidden);p.classList.toggle('wide',open&&!!V.wide);
  $('#showpanel').hidden=!(open&&V.hidden);
  const w=$('#panel .top .x[data-act="wide"]');if(w)w.textContent=V.wide?'⤡':'⤢';
}
$('#showpanel').addEventListener('click',()=>{V.hidden=false;panelState();});
$('#legBtn').addEventListener('click',()=>{const l=$('#legend'),o=!l.classList.contains('open');l.classList.toggle('open',o);$('#legBtn').setAttribute('aria-expanded',String(o));});
function chapBtn(l,nx){
  const st=nx?effStatus(nx.id):'solid';
  return'<button class="chip" role="listitem" data-chaps="1" aria-expanded="'+(!!V.chaps)+'"><i class="dot" style="--c:'+COL[st]+'"></i><span class="t">Chapters · '+solidCount(l)+'/'+l.length+' solid '+(V.chaps?'▴':'▾')+'</span></button>';
}
function renderChlist(l,nx){
  const el=$('#chlist');el.hidden=!V.chaps;
  if(!V.chaps){el.innerHTML='';return;}
  el.innerHTML=l.map((c,i)=>{
    const st=effStatus(c.id),ct=CT[c.id],p=S.progress[c.id]||{},d=Object.keys(p.secs||{}).length,tot=ct?ct.sections.length:0;
    return'<button class="chr" data-ch="'+c.id+'" aria-current="'+(V.sel===c.id)+'"><i class="dot" style="--c:'+COL[st]+'"></i><span style="flex:1"><b>'+numOf(c,i)+' · '+esc(c.title)+(nx&&nx.id===c.id?' (next)':'')+'</b><small>'+LABEL[st]+(tot?' · '+d+'/'+tot+' sections':' · no lesson yet')+(ct&&ct.hours?' · about '+ct.hours+' h':'')+'</small><span class="mini"><i style="width:'+(tot?Math.round(d/tot*100):0)+'%"></i></span></span></button>';
  }).join('');
}
function todayPick(){
  let due=null,rev=null,nxt=null;
  for(const s of VS())for(const u of UNITS){for(const c of chaptersOf(s,u)){
    const st=effStatus(c.id);
    if(st==='due'&&!due)due={s:s,c:c,why:'Due for review: bring it back before it fades'};
    if(st==='revise'&&!rev)rev={s:s,c:c,why:'Needs revision: you had most of it, close the gaps'};
    if((st==='new'||st==='learning')&&CT[c.id]&&!nxt)nxt={s:s,c:c,why:st==='new'?'Next chapter to start':'Keep going where you left off'};
  }}
  return due||rev||nxt;
}
function heroHTML(){
  const d=new Date(),hr=d.getHours(),g=hr<5?'Still up':hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
  let t=0,s=0;VS().forEach(x=>{const o=subjectTotals(x);t+=o.t;s+=o.d;});
  const hrs=Object.values(S.time||{}).reduce((a,b)=>a+b,0)/3600,L=lvlInfo();
  return'<div class="hero"><p class="eyebrow">'+d.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'})+'</p><h2 class="heroT">'+g+'.<br><em>'+(new Date().getHours()<17&&new Date().getHours()>=5?'Where to today?':'Where to tonight?')+'</em></h2><div class="heroS"><span><b>'+s+'<small style="font-size:.5em;color:var(--mute)"> / '+t+'</small></b>Chapters solid</span><span><b>'+(hrs<10?hrs.toFixed(1):Math.round(hrs))+'h</b>Studied</span><span><b>'+L.L+'</b>Level</span></div></div>';
}
function todayHTML(){
  const pk=todayPick(),wt=weakTopics(),w=weekInfo();
  if(!pk)return heroHTML();
  return heroHTML()+'<div class="tdc"><p class="eyebrow">Today</p><b>'+esc(pk.s.name)+' · '+esc(pk.c.title)+'</b><span>'+esc(pk.why)+'</span>'+(wt.length?'<span>'+wt.length+' weak topic'+(wt.length>1?'s':'')+' open</span>':'')+'<button class="btn" data-today="'+pk.s.id+'|'+pk.c.id+'">Start</button></div>';
}
function studyHTML(){
  const T=S.time||{},now=Date.now(),days=[];
  for(let i=83;i>=0;i--)days.push(dayKey(now-i*DAY));
  const ld={};(S.log||[]).forEach(l=>{const k=dayKey(l.t);ld[k]=(ld[k]||0)+300;});
  const mins=d=>Math.round((T[d]?T[d]:(ld[d]||0))/60);
  const total=Object.values(T).reduce((a,b)=>a+b,0)/3600,wk=days.slice(-7).reduce((a,d)=>a+(T[d]||0),0)/3600;
  const plan=Object.values(CT).reduce((a,c)=>a+(c.hours||0),0);
  let cells='';const first=new Date(now-83*DAY).getDay();for(let i=0;i<first;i++)cells+='<i class="hc pad"></i>';
  days.forEach(d=>{const m=mins(d),lv=m===0?0:m<15?1:m<45?2:m<90?3:4;cells+='<i class="hc l'+lv+'" title="'+d+': '+m+' min"></i>';});
  let rows='';
  VS().forEach(s=>{const l=allChapters(s).filter(c=>CT[c.id]);if(!l.length)return;
    rows+='<h4 class="eyebrow" style="margin:12px 0 4px">'+esc(s.name)+'</h4>'+l.map(c=>{const ct=CT[c.id],p=S.progress[c.id]||{},d=Object.keys(p.secs||{}).length,st=effStatus(c.id),f=findCh(c.id);
      return'<button class="cp" data-ch="'+c.id+'"><i class="dot" style="--c:'+COL[st]+'"></i><span class="cpn">'+(f?numOf(f.ch,f.i):'')+' · '+esc(c.title)+'</span><span class="mini"><i style="width:'+Math.round(d/ct.sections.length*100)+'%"></i></span><b>'+d+'/'+ct.sections.length+'</b></button>';}).join('');});
  return'<h4 class="eyebrow" style="margin:18px 0 6px">Study time</h4><div class="stats"><div><b>'+total.toFixed(1)+' h</b><span>Tracked on this page (of about '+plan+' h planned)</span></div><div><b>'+wk.toFixed(1)+' h</b><span>Last 7 days</span></div></div>'+
   '<div class="prog"><i style="width:'+Math.min(100,Math.round(total/Math.max(plan,1)*100))+'%"></i></div><p class="sub">Time counts only while this page is open and you are active.</p>'+
   '<h4 class="eyebrow" style="margin:14px 0 6px">Last 12 weeks</h4><div class="heat" aria-label="Study heat map">'+cells+'</div>'+
   '<h4 class="eyebrow" style="margin:14px 0 4px">Chapter progress (sections understood)</h4>'+rows;
}

/* ---------- boot ---------- */
function start(d){
  d=d||{};
  if(d.view==='subject'&&subj(d.subj)){V.view='subject';V.subj=d.subj;V.unit=d.unit||'3';if(d.sel&&findCh(d.sel))V.sel=d.sel;}
  if(S.flash&&Date.now()-S.flash.t<120000){
    const f=findCh(S.flash.id);
    if(f){V.view='subject';V.subj=f.s.id;V.unit=f.u;V.sel=f.ch.id;toast(f.s.name+' · chapter '+numOf(f.ch,f.i)+' is now: '+LABEL[effStatus(f.ch.id)]);}
  }
  FLASH0=performance.now();
  resize();chrome();renderPanel();
  window.addEventListener('resize',resize);
  if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({view:V.view,subj:V.subj,unit:V.unit,sel:V.sel,resume:fxResumeData()}));
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
  requestAnimationFrame(frame);
  fxResumeRestore(d);
}

const USERKEYS=['progress','mistakes','log','flash','lessons','practice','bank','time','comets','exams','xp','set','ach','cnt','daily','fc','cards','notes','bm','dates','visited','flags','recap','xpb','papers','boss','shield','drill','genex','savedAt'];
/* ---- never lose progress: local mirror + newest-wins restore ---- */
let FX_RESTORED=false;
(function(){try{const raw=localStorage.getItem('sg_state_v1');if(!raw)return;const L=JSON.parse(raw);
  if((L.savedAt||0)>(S.savedAt||0)){const keepXP=Math.max(S.xp||0,L.xp||0);USERKEYS.forEach(k=>{if(L[k]!==undefined)S[k]=L[k];});S.xp=keepXP;FX_RESTORED=true;}
  for(const k in FXDEF){if(S[k]==null)S[k]=JSON.parse(JSON.stringify(FXDEF[k]));}
}catch(e){}})();
function fxMirror(){S.savedAt=Date.now();try{const o={};USERKEYS.forEach(k=>o[k]=S[k]);localStorage.setItem('sg_state_v1',JSON.stringify(o));}catch(e){}}
function fxDirty(){UNSAVED=true;fxMirror();}
setInterval(()=>{if(UNSAVED||TIMEDIRTY)fxMirror();},15000);
setInterval(()=>{if(UNSAVED||TIMEDIRTY)flushSave();},90000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){fxMirror();flushSave();}});
addEventListener('pagehide',()=>fxMirror());
const fxToday=()=>dayKey(Date.now());
function fxDay(k){k=k||fxToday();return S.daily[k]||(S.daily[k]={xp:0,q:0,fc:0,focus:0,combo:0,done:{}});}

function fxWebSample(){
  const call=async(prompt,o,json)=>{

    let content=prompt;

    if(json)body.system='Reply with valid JSON only. No commentary and no code fences.';
    let res;
    try{res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:o.signal,
      headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});}
    catch(e){if(e&&e.name==='AbortError')throw e;throw{code:'network',message:'Could not reach Claude. Check your internet connection and try again.'};}
    if(!res.ok){let m='';try{const j=await res.json();m=(j.error&&j.error.message)||'';}catch(e){}
      if(res.status===401||res.status===403)throw{code:'badkey',message:'Anthropic did not accept your API key. Check it in Settings (the gear icon).'};
      if(res.status===429)throw{code:'rate_limited'};
      if(res.status===529||res.status>=500)throw{message:'Claude is busy right now. Try again in a moment.'};
      throw{message:m||'The request failed ('+res.status+').'};}

        const ev=buf.slice(0,i);buf=buf.slice(i+2);

        let d=null;try{d=JSON.parse(line.slice(5));}catch(e){}
        if(!d)continue;

  return s;
}

  const topics=new Set(S.mistakes.map(m=>m.topic));let g=0;
  while(items.length<6&&studied.length&&g<60){const c=studied[g%studied.length],ct=CT[c.id];const cand=ct.quiz.map((q,i)=>i).filter(i=>!items.some(x=>x.ch===c.id&&x.i===i));
    const pref=cand.filter(i=>topics.has(ct.quiz[i].topic));const pool=pref.length?pref:cand;if(pool.length)items.push({ch:c.id,i:pool[(hashS(c.id+fxWeekKey())+g)%pool.length]});g++;}

function fxBossLoop(el){
  const cv2=el.querySelector('canvas.fxbg'),c2=cv2.getContext('2d');let d=1;
  function size(){d=Math.min(devicePixelRatio||1,1.5);cv2.width=innerWidth*d;cv2.height=innerHeight*d;c2.setTransform(d,0,0,d,0,0);}size();addEventListener('resize',size);

  function loop(now){

    const w=innerWidth,h=innerHeight,side=Math.min(480,w*.42),cx=(w-side)/2,cy=h/2,b=S.boss||{hp:0,max:1,miss:0};
    const life=b.beaten?Math.max(0,1-(Date.now()-b.beaten)/2500):1;

    let shake=0,flash=0;BH.fx=BH.fx.filter(f=>now-f.t<1400);BH.fx.forEach(f=>{const k=(now-f.t)/1400;if(f.k==='hit'){flash=Math.max(flash,1-k);shake=Math.max(shake,(1-k)*8);}else R*=1+.25*Math.sin(Math.min(1,k*2)*Math.PI);});
    const ox=cx+(Math.random()-.5)*shake,oy=cy+(Math.random()-.5)*shake;
    c2.clearRect(0,0,w,h);

    c2.save();c2.translate(ox,oy);c2.globalCompositeOperation='lighter';
    const rot=REDUCE?0:now*.00035;
    parts.forEach(p=>{const a=p.a+rot*p.s*(2.2/p.r),rr=R*p.r*1.45,x=Math.cos(a)*rr,y=Math.sin(a)*rr*.32,front=Math.sin(a)>0;if(life<1&&!front)return;
      const col=p.r<1.6?'255,190,120':'190,120,230';c2.fillStyle='rgba('+col+','+(.25+.5*(1-p.z))*life+')';c2.fillRect(x,y,1.6,1.6);});
    for(let k=0;k<3;k++){c2.strokeStyle='rgba(255,'+(170-k*30)+','+(100+k*40)+','+(.35-k*.09)*life+')';c2.lineWidth=R*(.12-k*.03);c2.beginPath();c2.ellipse(0,0,R*(1.55+k*.35),R*(1.55+k*.35)*.3,0,Math.PI,0,true);c2.stroke();}
    c2.globalCompositeOperation='source-over';c2.fillStyle='#000';c2.beginPath();c2.arc(0,0,R,0,6.283);c2.fill();
    {const lg=c2.createLinearGradient(0,-R*1.4,0,0);lg.addColorStop(0,'rgba(255,200,140,'+(.55*life)+')');lg.addColorStop(1,'rgba(190,120,230,0)');c2.strokeStyle=lg;c2.lineWidth=R*.14;c2.beginPath();c2.ellipse(0,0,R*1.32,R*1.18,0,Math.PI,0,false);c2.stroke();}
    c2.strokeStyle='rgba(255,210,150,'+(.55+.4*flash)*life+')';c2.lineWidth=2;c2.beginPath();c2.arc(0,0,R*1.04,0,6.283);c2.stroke();
    c2.globalCompositeOperation='lighter';
    for(let k=0;k<3;k++){c2.strokeStyle='rgba(255,'+(170-k*30)+','+(100+k*40)+','+(.5-k*.12)*life+')';c2.lineWidth=R*(.12-k*.03);c2.beginPath();c2.ellipse(0,0,R*(1.55+k*.35),R*(1.55+k*.35)*.3,0,0,Math.PI);c2.stroke();}
    BH.fx.forEach(f=>{const k=(now-f.t)/1400;if(f.k==='hit'){c2.strokeStyle='rgba(255,240,210,'+(1-k)+')';c2.lineWidth=3;c2.beginPath();c2.arc(0,0,R*(1+k*3),0,6.283);c2.stroke();}
      else{for(let i=0;i<14;i++){const a=i*.45,r1=R*(4-3*k),r2=r1-R*.6;c2.strokeStyle='rgba(200,140,255,'+(.5*(1-k))+')';c2.lineWidth=1.2;c2.beginPath();c2.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);c2.lineTo(Math.cos(a+.15)*r2,Math.sin(a+.15)*r2);c2.stroke();}}});
    c2.restore();
    c2.font='600 12px Geist,system-ui,sans-serif';c2.textAlign='center';c2.fillStyle='rgba(255,220,180,.7)';c2.fillText(b.beaten?'COLLAPSED':'HP '+b.hp+' / '+b.max,cx,cy+R*2.2+30);
    requestAnimationFrame(loop);}
  requestAnimationFrame(loop);
}

/* =================== formula drills =================== */
const DRC=['2','3','4','5'];
function drFrac(a){return'\\frac{1}{'+a+'}';}
function drCalcQ(){
  const a=DRC[Math.floor(Math.random()*4)],n=3+Math.floor(Math.random()*5),b=1+Math.floor(Math.random()*5),r=Math.random,f=drFrac(a);
  const D=[
    ['e^{'+a+'x}',a+'e^{'+a+'x}',['e^{'+a+'x}',f+'e^{'+a+'x}',a+'xe^{'+a+'x-1}']],
    ['\\sin('+a+'x)',a+'\\cos('+a+'x)',['-'+a+'\\cos('+a+'x)','\\cos('+a+'x)',f+'\\cos('+a+'x)']],
    ['\\cos('+a+'x)','-'+a+'\\sin('+a+'x)',[a+'\\sin('+a+'x)','-\\sin('+a+'x)',f+'\\sin('+a+'x)']],
    ['\\ln('+a+'x)','\\frac{1}{x}',['\\frac{'+a+'}{x}','\\frac{1}{'+a+'x}',a+'\\ln x']],
    ['x^{'+n+'}',n+'x^{'+(n-1)+'}',['x^{'+(n-1)+'}',n+'x^{'+(n+1)+'}','\\frac{x^{'+(n+1)+'}}{'+(n+1)+'}']],
    ['\\tan('+a+'x)',a+'\\sec^2('+a+'x)',['\\sec^2('+a+'x)','-'+a+'\\sec^2('+a+'x)',f+'\\sec^2('+a+'x)']],
    ['\\ln('+a+'x+'+b+')','\\frac{'+a+'}{'+a+'x+'+b+'}',['\\frac{1}{'+a+'x+'+b+'}',f+'\\ln('+a+'x+'+b+')','\\frac{'+a+'x}{'+a+'x+'+b+'}']],
    ['('+a+'x+'+b+')^{'+n+'}',(n*+a)+'('+a+'x+'+b+')^{'+(n-1)+'}',[n+'('+a+'x+'+b+')^{'+(n-1)+'}',(n*+a)+'('+a+'x+'+b+')^{'+n+'}','\\frac{('+a+'x+'+b+')^{'+(n+1)+'}}{'+(n+1)+'}']]];
  const I=[
    ['e^{'+a+'x}',f+'e^{'+a+'x}+c',[a+'e^{'+a+'x}+c','e^{'+a+'x}+c',a+'xe^{'+a+'x}+c']],
    ['\\sin('+a+'x)','-'+f+'\\cos('+a+'x)+c',[f+'\\cos('+a+'x)+c','-'+a+'\\cos('+a+'x)+c',a+'\\cos('+a+'x)+c']],
    ['\\cos('+a+'x)',f+'\\sin('+a+'x)+c',['-'+f+'\\sin('+a+'x)+c',a+'\\sin('+a+'x)+c','-'+a+'\\sin('+a+'x)+c']],
    ['x^{'+n+'}','\\frac{x^{'+(n+1)+'}}{'+(n+1)+'}+c',[n+'x^{'+(n-1)+'}+c','\\frac{x^{'+n+'}}{'+n+'}+c','\\frac{x^{'+(n+1)+'}}{'+n+'}+c']],
    ['\\frac{1}{'+a+'x+'+b+'}',f+'\\ln|'+a+'x+'+b+'|+c',['\\ln|'+a+'x+'+b+'|+c',a+'\\ln|'+a+'x+'+b+'|+c','-\\frac{1}{('+a+'x+'+b+')^2}+c']],
    ['\\sec^2('+a+'x)',f+'\\tan('+a+'x)+c',[a+'\\tan('+a+'x)+c','\\tan('+a+'x)+c','-'+f+'\\tan('+a+'x)+c']]];
  const isD=r()<.55,t=isD?D[Math.floor(r()*D.length)]:I[Math.floor(r()*I.length)];
  return{q:isD?'\\dfrac{d}{dx}\\left['+t[0]+'\\right]':'\\displaystyle\\int '+t[0]+'\\,dx',a:t[1],o:fxShuffle([t[1]].concat(t[2])),lab:isD?'Differentiate':'Integrate'};
}
function drSheetQ(sid){
  const all=[];(FORMULAS[sid]||[]).forEach(sec=>sec[1].forEach(r=>all.push({n:r[0],t:r[1],s:sec[0]})));
  const pool=all.filter((x,i)=>all.findIndex(y=>y.t===x.t)===i&&x.t.length<90);if(pool.length<4)return null;
  const x=pool[Math.floor(Math.random()*pool.length)],same=fxShuffle(pool.filter(y=>y!==x&&y.s===x.s)),other=fxShuffle(pool.filter(y=>y!==x&&y.s!==x.s));
  const wrong=same.concat(other).slice(0,3);return{q:null,name:x.n,sec:x.s,a:x.t,o:fxShuffle([x.t].concat(wrong.map(w=>w.t))),lab:'Which formula is this?'};
}
var DRT=null;
function fxDrill(){const D=MS.dr;if(!D.s||!subj(D.s))D.s=fmSubj();D.phase='setup';fxOpenOverlay('drill',fxDrillHTML);}
function drKey(){const D=MS.dr;return D.mode==='calc'?'calc':D.s+'|'+D.mode;}
function drNew(){const D=MS.dr;D.cur=D.mode==='calc'?drCalcQ():drSheetQ(D.s);D.pick=null;}
function fxDrillHTML(){
  const D=MS.dr,subs=VS(),best=(S.drill||{})[drKey()]||0;
  if(D.phase==='setup'){const calcOk=['mm','ms'].includes(D.s);if(D.mode==='calc'&&!calcOk)D.mode='sheet';
    return'<div class="fm-panel">'+fmH('Formula drills','60-second rounds')+'<div class="fc-grid"><label>Subject'+fmSel('dr.s',D.s,subs.map(s=>[s.id,s.name]))+'</label><label>Drill'+fmSel('dr.mode',D.mode,[['sheet','Formula sheet: name to formula']].concat(calcOk?[['calc','Derivatives and integrals']]:[]))+'</label><label>Length'+fmSel('dr.len',D.len,[[30,'30 seconds'],[60,'60 seconds'],[120,'2 minutes']])+'</label></div>'+
      '<p class="sub">Pick the right option as fast as you can. Wrong picks cost two seconds. Best for this drill: <b>'+best+'</b>.</p><div class="row"><button class="btn" data-fx="drgo">Start</button></div></div>';}
  if(D.phase==='run'){const c=D.cur;if(!c)return'<div class="fm-panel">'+fmH('Not enough formulas','Formula drills')+'</div>';

      '<p class="eyebrow">'+esc(c.lab)+(c.sec?' · '+esc(c.sec):'')+'</p><div class="dr-q">'+(c.q?'$$'+c.q+'$$':'<b>'+esc(c.name)+'</b>')+'</div><div class="dr-o">'+c.o.map((o,i)=>'<button class="'+(D.pick!=null?(o===c.a?'ok':i===D.pick?'no':''):'')+'" data-fx="drpick" data-v="'+i+'">$$'+o+'$$</button>').join('')+'</div></div>';}
  return'<div class="fm-panel">'+fmH(D.score+' correct','Round over')+'<div class="fc-stat"><div><b>'+D.score+'</b><span>score</span></div><div><b>'+D.bestStreak+'</b><span>best streak</span></div><div><b>'+best+'</b><span>personal best</span></div></div>'+(D.newBest?'<p class="fb ok">New personal best.</p>':'')+'<div class="row"><button class="btn" data-fx="drgo">Go again</button><button class="btn ghost" data-fx="drsetup">Change drill</button><button class="btn ghost" data-fx="close">Close</button></div></div>';
}
function drStart(){const D=MS.dr;Object.assign(D,{phase:'run',score:0,streak:0,bestStreak:0,end:Date.now()+D.len*1000,newBest:false});drNew();fxRerender();
  clearInterval(DRT);DRT=setInterval(()=>{if(!FXOVER||FXOVER.kind!=='drill'||D.phase!=='run'){clearInterval(DRT);return;}const left=D.end-Date.now(),el=document.getElementById('dr-t');if(el)el.textContent=Math.max(0,Math.ceil(left/1000))+'s';if(left<=0)drEnd();},250);}
function drEnd(){const D=MS.dr;clearInterval(DRT);D.phase='done';S.drill=S.drill||{};const k=drKey();if(D.score>(S.drill[k]||0)){S.drill[k]=D.score;D.newBest=D.score>0;}S.cnt.drillBest=Math.max(S.cnt.drillBest||0,D.score);fxGain(Math.min(20,D.score));fxDirty();fxRerender();setTimeout(fxCheckAll,60);}
function drPick(i){const D=MS.dr,c=D.cur;if(D.phase!=='run'||D.pick!=null)return;D.pick=i;const ok=c.o[i]===c.a;
  if(ok){D.score++;D.streak++;D.bestStreak=Math.max(D.bestStreak,D.streak);}else{D.streak=0;D.end-=2000;}
  fxRerender();setTimeout(()=>{if(D.phase!=='run')return;if(Date.now()>=D.end)return drEnd();drNew();fxRerender();},ok?280:900);}

    case'exprint':{const x=(S.genex||[]).find(z=>z.id===MS.ex.cur);if(x)fxPrint(fxPaperHTML(x.title,x.qs,x.min,v==='guide','l'),x.title);return true;}
    case'exlog':{const x=(S.genex||[]).find(z=>z.id===MS.ex.cur);if(x)fxPapers({s:x.s,name:x.title,date:fxToday(),score:'',out:String(x.qs.reduce((a,q)=>a+(q.marks||0),0))});return true;}
    case'exphoto':{const x=(S.genex||[]).find(z=>z.id===MS.ex.cur);if(x){const q=x.qs[+v];fxPhoto({q:q.q,ch:'',imgs:[]});}return true;}
    case'photo':fxPhoto();return true;
    case'phgo':fxPhotoGo();return true;
    case'phdel':MS.ph.imgs.splice(+v,1);fxRerender();return true;
    case'phclear':Object.assign(MS.ph,{imgs:[],res:null,err:'',saved:false});fxRerender();return true;
    case'phsave':fxPhotoSave();return true;
    case'expl':fxExpl(v);return true;
    case'explx':delete EXPL[v];renderPanel();return true;
    case'tl':fxTimelapse();return true;
    case'tlplay':MS.tl.play=!MS.tl.play;if(MS.tl.play&&MS.tl.p>=1)MS.tl.p=0;b.textContent=MS.tl.play?'Pause':'Play';return true;
    case'tlre':MS.tl.p=0;MS.tl.play=true;MS.tl.flash={};const pb=document.querySelector('[data-fx="tlplay"]');if(pb)pb.textContent='Pause';return true;
    case'mixer':if(FXOVER)fxCloseOverlay();setTimeout(fxMixer,FXOVER?0:0);return true;
    case'mixpre':Object.assign(S.set.mix,MIXP[v]);if(!S.set.sound){S.set.sound=true;}fxDirty();fxSoundStart();fxMixStart();fxMixApply();{const p=document.getElementById('fx-pop');if(p)p.innerHTML=fxMixerHTML();const sb=document.getElementById('fx-snd');if(sb)sb.innerHTML=IC.snd;}return true;
  }
  return false;
}
addEventListener('pointerdown',()=>{const m=S.set.mix||{};if(S.set.sound&&['rain','brown','keys','drums','crackle'].some(k=>m[k]>0)){fxMixStart();fxMixApply();}},{once:true,capture:true});

/* opening quote */
(function(){
  if(S.set&&S.set.quote===false){galT0=performance.now();return;}
  let seen=!!window.__sgIntro;window.__sgIntro=1;
  try{if(sessionStorage.getItem('sg_intro'))seen=true;sessionStorage.setItem('sg_intro','1');}
  catch(e){try{const t=+localStorage.getItem('sg_intro_t')||0;if(Date.now()-t<6*3600e3)seen=true;localStorage.setItem('sg_intro_t',Date.now());}catch(e2){}}
  if(seen){galT0=performance.now();return;}
  const Q=[['The important thing is not to stop questioning.','Albert Einstein'],
  ['We are all in the gutter, but some of us are looking at the stars.','Oscar Wilde'],
  ['The cosmos is within us. We are made of star-stuff.','Carl Sagan'],
  ['Look up at the stars and not down at your feet.','Stephen Hawking'],
  ['Nothing in life is to be feared, it is only to be understood.','Marie Curie'],
  ['Per aspera ad astra. Through hardship, to the stars.','Latin proverb'],
  ['I have no special talents. I am only passionately curious.','Albert Einstein'],
  ['If I have seen further it is by standing on the shoulders of Giants.','Isaac Newton'],
  ['The universe is under no obligation to make sense to you.','Neil deGrasse Tyson'],
  ['Success is the sum of small efforts, repeated day in and day out.','Robert Collier'],
  ['Pure mathematics is, in its way, the poetry of logical ideas.','Albert Einstein'],
  ['It is always darkest just before the day dawneth.','Thomas Fuller'],
  ['Genius is one per cent inspiration, ninety-nine per cent perspiration.','Thomas Edison'],
  ['Equipped with his five senses, man explores the universe around him and calls the adventure Science.','Edwin Hubble']];
  let last=-1;try{last=+localStorage.getItem('sg_lastq');}catch(e){}
  let i=Math.floor(Math.random()*Q.length);if(i===last)i=(i+1+Math.floor(Math.random()*(Q.length-1)))%Q.length;
  try{localStorage.setItem('sg_lastq',i);}catch(e){}
  const q=Q[i],words=q[0].split(' '),el=document.createElement('div');el.id='intro';el.setAttribute('role','dialog');el.setAttribute('aria-label','Opening quote');
  const d0=600,step=170,end=d0+words.length*step;
  el.innerHTML='<div class="q"><p class="qt">'+words.map((w,k)=>'<span style="animation-delay:'+(d0+k*step)+'ms">'+esc(w)+'</span>').join(' ')+'</p><span class="qa" style="animation-delay:'+(end+500)+'ms">'+esc(q[1])+'</span></div><div class="qh" style="animation-delay:'+(end+1600)+'ms,'+(end+3600)+'ms">Click anywhere to enter</div>';
  document.body.appendChild(el);
  const td=document.getElementById('today');if(td)td.classList.add('out');
  galT0=performance.now()+1e9;
  let done=false;
  function go(){if(done)return;done=true;el.classList.add('gone');setTimeout(()=>el.classList.add('off'),700);galT0=performance.now()+500;
    setTimeout(()=>{if(td)td.classList.remove('out');},1400);setTimeout(()=>el.remove(),2700);
    removeEventListener('keydown',go);}
  el.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();go();});el.addEventListener('click',e=>e.stopPropagation());addEventListener('keydown',go);
  setTimeout(go,REDUCE?1500:end+4200);
})();
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start(window.claude&&window.claude.hot&&window.claude.hot.data?window.claude.hot.data:{});
})();
