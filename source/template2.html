zontal and vertical motion?","b":"Time of flight $t$. It is the same for both directions."},{"type":"def","topic":"Components and independence","f":"Components of a velocity $v$ at angle $\\theta$ to the horizontal.","b":"$v_x=v\\cos\\theta$, $v_y=v\\sin\\theta$"},{"type":"def","topic":"Components and independence","f":"The four constant-acceleration (SUVAT) equations.","b":"$v=u+at$; $s=ut+\\frac12at^2$; $v^2=u^2+2as$; $s=\\frac{u+v}{2}t$"},{"type":"word","topic":"Horizontal launches","f":"A ball rolls off a 1.25 m table at 3.0 m/s. How far from the table does it land?","b":"$t=\\sqrt{2(1.25)/9.8}\\approx0.505$ s, so $x=3.0\\times0.505\\approx1.5$ m."},{"type":"word","topic":"Horizontal launches","f":"A plane at height $h$ moving at $v$ drops a package. Where is the plane when the package lands?","b":"Directly above it (ignoring air resistance), because both have the same horizontal velocity."},{"type":"def","topic":"Angled launches on level ground","f":"Launch angle for maximum range on level ground.","b":"$45^\\circ$ (because $R=\\frac{v^2\\sin2\\theta}{g}$ is largest when $\\sin2\\theta=1$)."},{"type":"def","topic":"Angled launches on level ground","f":"Velocity at the top of a projectile's path.","b":"Only the horizontal component $v\\cos\\theta$ remains; the vertical velocity is zero. Acceleration is still $g$ downward."},{"type":"word","topic":"Angled launches on level ground","f":"Which angle gives the same range as $30^\\circ$ for the same launch speed?","b":"$60^\\circ$ (complementary angles give equal ranges on level ground)."},{"type":"word","topic":"Angled launches on level ground","f":"A ball is kicked at 20 m/s at $40^\\circ$. Time to the top?","b":"$t=\\frac{20\\sin40^\\circ}{9.8}\\approx1.31$ s."},{"type":"word","topic":"Launches from a height","f":"A projectile lands 30 m below its launch point. What is $s_y$ if up is positive?","b":"$s_y=-30$ m."},{"type":"word","topic":"Launches from a height","f":"Why do you reject one root of the time quadratic?","b":"The negative root is a time before the launch, which is not physical."},{"type":"def","topic":"Launches from a height","f":"Effect of air resistance on a projectile's path.","b":"Lower maximum height, shorter range, and a steeper, asymmetrical descent."}],"hours":3.5},"ph3-c02":{"id":"ph3-c02","interactive":"incline","summary":"Forces on a slope are solved by splitting weight into a component along the slope and a component into it. This chapter covers free-body diagrams, Newton's second law, components on an incline, normal force, and static and kinetic friction.","videos":[{"src":"F","title":"Inclined planes and friction","url":"https://www.youtube.com/results?search_query=Flipping+Physics+inclined+plane+physics+friction+Newton+second+law","kind":"search"},{"src":"K","title":"Forces on inclined planes","url":"https://www.youtube.com/results?search_query=Khan+Academy+forces+on+inclined+planes","kind":"search"},{"src":"V","title":"Veritasium: Friction","url":"https://www.youtube.com/results?search_query=Veritasium+friction","kind":"search"}],"sections":[{"id":"ph3-c02-s1","code":"2.1","title":"Free-body diagrams and Newton's laws","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: free body diagrams Newton laws","url":"https://www.youtube.com/results?search_query=Flipping+Physics+free+body+diagrams+Newton+laws","kind":"search"}]},{"t":"p","x":"**Newton's second law:** $\\Sigma F=ma$. The net force is the vector sum of all forces. A **free-body diagram** shows only the forces acting **on** the object: weight $mg$ (down), normal force $N$ (perpendicular to the surface), friction $f$ (along the surface), applied forces and tension. **Constant velocity** means $\\Sigma F=0$, not \"no forces\"."},{"t":"key","x":"$$\\Sigma F=ma,\\qquad W=mg,\\qquad f_k=\\mu_kN,\\qquad f_s\\le\\mu_sN$$"},{"t":"ex","title":"Resultant force","q":"A $3.0\\ \\text{kg}$ trolley is pushed with a net force of $12\\ \\text{N}$. Find its acceleration.","s":["$a=\\frac{\\Sigma F}{m}=\\frac{12}{3.0}=4.0\\ \\text{m s}^{-2}$."],"a":"$4.0\\ \\text{m s}^{-2}$"},{"t":"warn","x":"Weight and normal force are **not** a Newton's third-law pair. A third-law pair acts on **different objects**: the Earth pulls the block down, and the block pulls the Earth up."},{"t":"p","x":"**Newton's three laws in one sentence each.** (1) An object keeps its velocity unless a net force acts. (2) Net force causes acceleration: $\\Sigma F=ma$, in the direction of the net force. (3) Forces come in equal and opposite pairs acting on **different** objects. Most problems in this chapter are law 2 applied separately along two perpendicular axes."},{"t":"p","x":"**Equilibrium.** If an object is at rest or moving at constant velocity, the net force is zero in every direction. That gives you equations even when nothing is accelerating, which is how you find unknown tensions, normal forces or friction."},{"t":"ex","title":"Worded problem: lift","q":"A 60 kg person stands on bathroom scales in a lift accelerating upward at $1.5\\ \\text{m s}^{-2}$. What do the scales read?","s":["Take up as positive: $N-mg=ma\\Rightarrow N=m(g+a)=60(9.8+1.5)$.","$N=678$ N. The scales show the normal force, which corresponds to $\\frac{678}{9.8}\\approx69$ kg."],"a":"$678$ N (it reads about 69 kg)."}]},{"id":"ph3-c02-s2","code":"2.2","title":"Forces on a slope","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: forces on an inclined plane","url":"https://www.youtube.com/results?search_query=Flipping+Physics+forces+on+an+inclined+plane","kind":"search"}]},{"t":"p","x":"On a slope of angle $\\theta$, choose axes **along** and **perpendicular** to the surface. The weight splits into $mg\\sin\\theta$ (down the slope) and $mg\\cos\\theta$ (into the slope). With no acceleration perpendicular to the surface, $N=mg\\cos\\theta$. Down the slope, the net force is $mg\\sin\\theta-f$."},{"t":"key","x":"$$F_{\\parallel}=mg\\sin\\theta,\\qquad F_{\\perp}=mg\\cos\\theta=N$$"},{"t":"ex","title":"Frictionless slope","q":"A $5.0\\ \\text{kg}$ block sits on a frictionless $30^\\circ$ slope. Find its acceleration and the normal force.","s":["$a=g\\sin30^\\circ=4.9\\ \\text{m s}^{-2}$ down the slope.","$N=mg\\cos30^\\circ=5.0(9.8)(0.866)=42.4\\ \\text{N}$."],"a":"$4.9\\ \\text{m s}^{-2}$ down the slope and $42.4\\ \\text{N}$."},{"t":"int","name":"incline","cap":"Change the slope angle and the friction coefficient. The block slides only when the down-slope component beats the maximum friction."},{"t":"warn","x":"The normal force on a slope is **less than** $mg$ (it equals $mg\\cos\\theta$). Using $N=mg$ on a slope is one of the most common errors."},{"t":"p","x":"**Finding the angle on a slope.** The angle between the weight and the perpendicular to the slope equals the slope angle $\\theta$ (the two angles have perpendicular sides). That is why the component along the slope is $mg\\sin\\theta$ and the component into the slope is $mg\\cos\\theta$. A quick check: at $\\theta=0$ the along-slope part should be zero, and $\\sin0=0$."},{"t":"ex","title":"Worded problem: trolley on a ramp","q":"A 12 kg trolley is released on a frictionless ramp inclined at $15^\\circ$. Find its acceleration and its speed after travelling 4.0 m down the ramp.","s":["$a=g\\sin\\theta=9.8\\sin15^\\circ\\approx2.54\\ \\text{m s}^{-2}$ (the mass cancels).","$v^2=0+2(2.54)(4.0)\\Rightarrow v\\approx4.5$ m/s."],"a":"$2.5\\ \\text{m s}^{-2}$; about $4.5$ m/s after 4.0 m."}]},{"id":"ph3-c02-s3","code":"2.3","title":"Friction","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: friction coefficient physics","url":"https://www.youtube.com/results?search_query=Flipping+Physics+friction+coefficient+physics","kind":"search"}]},{"t":"p","x":"**Static friction** adjusts up to a maximum $\\mu_sN$ to stop sliding. **Kinetic friction** acts on a sliding object and equals $\\mu_kN$ in the direction opposing motion. A block just on the point of sliding on a slope has $\\tan\\theta=\\mu_s$."},{"t":"ex","title":"Sliding with friction","q":"A block slides down a $30^\\circ$ slope with $\\mu_k=0.30$. Find its acceleration.","s":["$mg\\sin\\theta-\\mu_kmg\\cos\\theta=ma$.","$a=9.8(\\sin30^\\circ-0.30\\cos30^\\circ)=9.8(0.500-0.260)=2.35\\ \\text{m s}^{-2}$."],"a":"$2.35\\ \\text{m s}^{-2}$ down the slope."},{"t":"ex","title":"Critical angle","q":"A block is on a slope with $\\mu_s=0.60$. Find the greatest angle before it slides.","s":["$\\tan\\theta=\\mu_s=0.60$."],"a":"$\\theta=31.0^\\circ$"},{"t":"ex","title":"Pushed up a slope at constant speed","q":"A $2.0\\ \\text{kg}$ block is pushed up a $20^\\circ$ slope at constant speed with $\\mu_k=0.20$. Find the force parallel to the slope.","s":["$F=mg\\sin\\theta+\\mu_kmg\\cos\\theta=19.6(0.342+0.2\\times0.940)=10.4\\ \\text{N}$."],"a":"$10.4\\ \\text{N}$ up the slope."},{"t":"p","x":"**Static or kinetic?** If the object is not moving, static friction takes whatever value is needed to stop motion, up to $\\mu_sN$. Only when that limit is reached does it slip. Once it slides, kinetic friction $\\mu_kN$ (usually smaller) acts opposite to the motion. Friction always opposes the **relative** motion (or tendency of motion) of the surfaces."},{"t":"ex","title":"Worded problem: box pushed up a slope","q":"A 20 kg box is pushed up a $25^\\circ$ slope by a force of 150 N parallel to the slope. The coefficient of kinetic friction is 0.30. Find its acceleration.","s":["$N=mg\\cos25^\\circ=20(9.8)(0.906)\\approx177.6$ N, so $f_k=0.30\\times177.6\\approx53.3$ N (down the slope).","Weight component down the slope: $mg\\sin25^\\circ\\approx82.8$ N.","$\\Sigma F=150-82.8-53.3=13.9$ N, so $a=\\frac{13.9}{20}\\approx0.70\\ \\text{m s}^{-2}$ up the slope."],"a":"About $0.70\\ \\text{m s}^{-2}$ up the slope."}]},{"id":"ph3-c02-s4","code":"2.4","title":"Pulleys and connected objects","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: pulleys Atwood machine connected objects","url":"https://www.youtube.com/results?search_query=Flipping+Physics+pulleys+Atwood+machine+connected+objects","kind":"search"}]},{"t":"p","x":"Treat the system as one object when the string is taut and does not stretch, so both masses share the same acceleration. For two masses over a light pulley, $a=\\dfrac{(m_1-m_2)g}{m_1+m_2}$. Then use one mass alone to find the tension."},{"t":"ex","title":"Atwood machine","q":"Masses of $5.0\\ \\text{kg}$ and $3.0\\ \\text{kg}$ hang from a light string over a pulley. Find the acceleration and the tension.","s":["$a=\\frac{(5.0-3.0)(9.8)}{8.0}=2.45\\ \\text{m s}^{-2}$.","For the lighter mass, $T-mg=ma\\Rightarrow T=3.0(9.8+2.45)=36.8\\ \\text{N}$."],"a":"$2.45\\ \\text{m s}^{-2}$ and $36.8\\ \\text{N}$."},{"t":"p","x":"**System versus individual masses.** Treat the whole system first to find the shared acceleration: net external force divided by total mass. Then isolate **one** mass to find the tension. The tension is an internal force for the system, so it cancels when you treat everything together."},{"t":"ex","title":"Worded problem: block on a table pulling a hanging mass","q":"A 4.0 kg block on a frictionless table is connected by a string over a pulley to a 1.0 kg hanging mass. Find the acceleration and the tension.","s":["System: the only unbalanced force is the hanging weight, $1.0\\times9.8=9.8$ N. Total mass 5.0 kg, so $a=\\frac{9.8}{5.0}=1.96\\ \\text{m s}^{-2}$.","Tension: on the 4.0 kg block, $T=ma=4.0\\times1.96=7.84$ N."],"a":"$a=1.96\\ \\text{m s}^{-2}$, $T\\approx7.8$ N."}]},{"id":"ph3-c02-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Always draw the free-body diagram.** Label every force with its name and direction, show the axes along and perpendicular to the slope, and write $\\Sigma F=ma$ for each axis. A correct diagram earns marks even if the arithmetic goes wrong."},{"t":"p","x":"**Units and figures.** Forces in newtons, acceleration in $\\text{m s}^{-2}$, 2 or 3 significant figures. Do not round until the final line."}]}],"quiz":[{"topic":"Normal","q":"A $10\\ \\text{kg}$ object rests on level ground. Find the normal force (N).","a":"98","alt":[],"ad":"$98\\ \\text{N}$","sol":"$N=mg=10(9.8)$.","h":["On level ground $N=mg$.","$10\\times9.8$.","Compute."]},{"topic":"Slope component","q":"A $4.0\\ \\text{kg}$ block is on a $20^\\circ$ slope. Find the component of its weight down the slope (N, 1 decimal place).","a":"13.4","alt":[],"ad":"$13.4\\ \\text{N}$","sol":"$mg\\sin20^\\circ=39.2(0.342)=13.4$.","h":["Along the slope uses sine.","$mg=39.2$.","$39.2\\sin20^\\circ$."]},{"topic":"Slope normal","q":"A $4.0\\ \\text{kg}$ block is on a $20^\\circ$ slope. Find the normal force (N, 1 decimal place).","a":"36.8","alt":[],"ad":"$36.8\\ \\text{N}$","sol":"$mg\\cos20^\\circ=39.2(0.940)=36.8$.","h":["Perpendicular uses cosine.","$mg=39.2$.","$39.2\\cos20^\\circ$."]},{"topic":"Frictionless acceleration","q":"Find the acceleration of a block on a frictionless $40^\\circ$ slope ($\\text{m s}^{-2}$, 2 decimal places).","a":"6.30","alt":["6.3"],"ad":"$6.30\\ \\text{m s}^{-2}$","sol":"$a=g\\sin40^\\circ=9.8(0.643)=6.30$.","h":["Mass cancels.","$a=g\\sin\\theta$.","$9.8\\sin40^\\circ$."]},{"topic":"Friction force","q":"$N=40\\ \\text{N}$ and $\\mu_k=0.25$. Find the kinetic friction (N).","a":"10","alt":["10.0"],"ad":"$10\\ \\text{N}$","sol":"$f=\\mu N=0.25\\times40$.","h":["$f=\\mu N$.","$0.25\\times40$.","Compute."]},{"topic":"Constant speed","q":"A block slides down a $20^\\circ$ slope at constant speed. Find $\\mu_k$ (2 decimal places).","a":"0.36","alt":[],"ad":"$0.36$","sol":"Net force zero: $mg\\sin\\theta=\\mu mg\\cos\\theta$, so $\\mu=\\tan20^\\circ=0.364$.","h":["Constant speed means zero net force.","$\\sin\\theta=\\mu\\cos\\theta$.","$\\mu=\\tan\\theta$."]},{"topic":"Critical angle","q":"A block just begins to slide when the slope is $\\theta$ and $\\mu_s=1.0$. Find $\\theta$ (degrees).","a":"45","alt":[],"ad":"$45^\\circ$","sol":"$\\tan\\theta=1.0$.","h":["$\\tan\\theta=\\mu_s$.","$\\tan^{-1}1$.","Compute."]},{"topic":"With friction","q":"Find the acceleration of a block on a $30^\\circ$ slope with $\\mu_k=0.20$ ($\\text{m s}^{-2}$, 2 decimal places).","a":"3.20","alt":["3.2"],"ad":"$3.20\\ \\text{m s}^{-2}$","sol":"$a=9.8(0.5-0.2\\cos30^\\circ)=9.8(0.327)=3.20$.","h":["$a=g(\\sin\\theta-\\mu\\cos\\theta)$.","$\\cos30^\\circ=0.866$.","Compute."]},{"topic":"Weight","q":"Find the weight of a $3.0\\ \\text{kg}$ object (N).","a":"29.4","alt":["29"],"ad":"$29.4\\ \\text{N}$","sol":"$W=mg=3.0(9.8)$.","h":["$W=mg$.","$3.0\\times9.8$.","Compute."]},{"topic":"Newton's second law","q":"Net force $12\\ \\text{N}$ acts on $3.0\\ \\text{kg}$. Find $a$ ($\\text{m s}^{-2}$).","a":"4.0","alt":["4"],"ad":"$4.0\\ \\text{m s}^{-2}$","sol":"$a=F/m$.","h":["$a=F/m$.","$12/3$.","Compute."]}],"comets":[{"topic":"Extension: Atwood","q":"Masses of $5.0\\ \\text{kg}$ and $3.0\\ \\text{kg}$ hang over a light pulley. Find the acceleration ($\\text{m s}^{-2}$, 2 decimal places).","a":"2.45","alt":[],"ad":"$2.45\\ \\text{m s}^{-2}$","sol":"$a=\\frac{(5-3)(9.8)}{8}=2.45$.","h":["Treat the system as one object.","Net driving force $(m_1-m_2)g$.","Total mass $8$ kg."]}],"cards":[{"type":"def","topic":"Free-body diagrams and Newton's laws","f":"State Newton's second law.","b":"The net force on an object equals its mass times acceleration: $\\Sigma F=ma$."},{"type":"def","topic":"Free-body diagrams and Newton's laws","f":"State Newton's third law.","b":"When object A exerts a force on B, B exerts an equal and opposite force on A. The pair acts on different objects."},{"type":"def","topic":"Free-body diagrams and Newton's laws","f":"What does \"equilibrium\" mean for forces?","b":"The net force is zero, so the object is at rest or moving with constant velocity."},{"type":"word","topic":"Free-body diagrams and Newton's laws","f":"60 kg person in a lift accelerating up at 1.5 m/s\u00b2. Normal force?","b":"$N=m(g+a)=60(11.3)=678$ N."},{"type":"def","topic":"Forces on a slope","f":"Components of weight on a slope of angle $\\theta$.","b":"Parallel to slope: $mg\\sin\\theta$. Perpendicular: $mg\\cos\\theta$."},{"type":"def","topic":"Forces on a slope","f":"Acceleration down a frictionless slope.","b":"$a=g\\sin\\theta$, independent of mass."},{"type":"def","topic":"Forces on a slope","f":"Normal force on a slope with no other perpendicular forces.","b":"$N=mg\\cos\\theta$ (less than $mg$)."},{"type":"def","topic":"Friction","f":"Maximum static friction and kinetic friction.","b":"$f_s\\le\\mu_sN$; $f_k=\\mu_kN$"},{"type":"def","topic":"Friction","f":"Critical angle at which a block just starts to slide.","b":"$\\tan\\theta=\\mu_s$"},{"type":"word","topic":"Friction","f":"A block slides at constant speed down a $20^\\circ$ slope. Find $\\mu_k$.","b":"Constant speed means net force zero: $mg\\sin20^\\circ=\\mu_kmg\\cos20^\\circ$, so $\\mu_k=\\tan20^\\circ\\approx0.36$."},{"type":"def","topic":"Pulleys and connected objects","f":"Acceleration of an Atwood machine with masses $m_1>m_2$.","b":"$a=\\dfrac{(m_1-m_2)g}{m_1+m_2}$"},{"type":"word","topic":"Pulleys and connected objects","f":"4.0 kg block on a frictionless table pulled by a hanging 1.0 kg mass. Acceleration?","b":"$a=\\frac{1.0\\times9.8}{5.0}=1.96\\ \\text{m s}^{-2}$"},{"type":"word","topic":"Pulleys and connected objects","f":"Why is the tension less than the hanging mass's weight when it accelerates down?","b":"For the hanging mass, $mg-T=ma>0$, so $T\u003cmg$."}],"hours":3},"ph3-c03":{"id":"ph3-c03","interactive":"none","summary":"Objects moving in a circle accelerate toward the centre even at constant speed. This chapter covers uniform circular motion, centripetal acceleration and force, horizontal circles including flat and banked curves, and vertical circles.","videos":[{"src":"F","title":"Centripetal acceleration and force","url":"https://www.youtube.com/results?search_query=Flipping+Physics+centripetal+force+circular+motion+physics","kind":"search"},{"src":"K","title":"Uniform circular motion","url":"https://www.youtube.com/results?search_query=Khan+Academy+uniform+circular+motion+centripetal+acceleration","kind":"search"},{"src":"V","title":"Veritasium: Why does the water stay in the bucket","url":"https://www.youtube.com/results?search_query=Veritasium+centrifugal+force","kind":"search"}],"sections":[{"id":"ph3-c03-s1","code":"3.1","title":"Uniform circular motion","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: uniform circular motion","url":"https://www.youtube.com/results?search_query=Flipping+Physics+uniform+circular+motion","kind":"search"}]},{"t":"p","x":"In **uniform circular motion** the speed is constant but the **direction changes**, so the velocity changes and the object **accelerates toward the centre**. For a radius $r$ and period $T$ (time for one revolution): $v=\\dfrac{2\\pi r}{T}=2\\pi rf$ where $f=\\frac1T$ is the frequency in hertz. Angular speed $\\omega=\\dfrac{2\\pi}{T}$ in $\\text{rad s}^{-1}$ and $v=\\omega r$."},{"t":"key","x":"$$v=\\frac{2\\pi r}{T},\\qquad a_c=\\frac{v^2}{r}=\\frac{4\\pi^2r}{T^2}=\\omega^2r$$"},{"t":"ex","title":"Speed and acceleration","q":"A stone on a $0.80\\ \\text{m}$ string is whirled at $2.0$ revolutions per second. Find its speed and centripetal acceleration.","s":["$T=0.50\\ \\text{s}$; $v=\\frac{2\\pi(0.80)}{0.50}=10.1\\ \\text{m s}^{-1}$.","$a_c=\\frac{v^2}{r}=\\frac{10.05^2}{0.80}=126\\ \\text{m s}^{-2}$."],"a":"$10.1\\ \\text{m s}^{-1}$ and $126\\ \\text{m s}^{-2}$ toward the centre."},{"t":"warn","x":"\"Centrifugal force\" is not a real force on the object. The object would move in a straight line at a tangent if the inward force vanished. Always name the real force providing the centripetal force (tension, friction, normal force, gravity)."},{"t":"p","x":"**Why there is an acceleration at constant speed.** Acceleration is the rate of change of **velocity**, a vector. In a circle the direction keeps changing, so the velocity changes even though its size does not. The change always points toward the centre, giving centripetal acceleration $a_c=\\frac{v^2}{r}$. Period $T$ is the time for one revolution and frequency $f=\\frac1T$."},{"t":"ex","title":"Worded problem: spin cycle","q":"A washing machine drum of radius 0.25 m spins at 1200 revolutions per minute. Find the speed of a sock on the wall and its centripetal acceleration.","s":["$f=\\frac{1200}{60}=20$ Hz, so $T=0.05$ s. $v=\\frac{2\\pi(0.25)}{0.05}\\approx31.4$ m/s.","$a_c=\\frac{v^2}{r}=\\frac{31.4^2}{0.25}\\approx3950\\ \\text{m s}^{-2}$ (about 400 g)."],"a":"About $31$ m/s and $3.9\\times10^3\\ \\text{m s}^{-2}$ toward the centre."}]},{"id":"ph3-c03-s2","code":"3.2","title":"Centripetal force","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: centripetal force","url":"https://www.youtube.com/results?search_query=Flipping+Physics+centripetal+force","kind":"search"}]},{"t":"p","x":"**Centripetal force** is the **net** force toward the centre: $F_c=ma_c=\\dfrac{mv^2}{r}$. It is not a new force; it is the resultant of the real forces. On a flat curve it is **friction**; on a string it is **tension**; for a planet it is **gravity**."},{"t":"ex","title":"Car on a flat curve","q":"A $1200\\ \\text{kg}$ car goes around a flat curve of radius $50\\ \\text{m}$ at $15\\ \\text{m s}^{-1}$. Find the friction force needed and the minimum coefficient of friction.","s":["$F=\\frac{mv^2}{r}=\\frac{1200(225)}{50}=5400\\ \\text{N}$.","$\\mu mg=\\frac{mv^2}{r}\\Rightarrow\\mu=\\frac{v^2}{rg}=\\frac{225}{50(9.8)}=0.46$."],"a":"$5400\\ \\text{N}$ and $\\mu\\ge0.46$."},{"t":"p","x":"**Identify the real force.** The centripetal force is always supplied by something real: tension for a ball on a string, friction for a car on a flat curve, gravity for a satellite, the normal force for a rider in a rotor, or a combination. In your answer, name that force. Writing \"the centripetal force keeps it moving in a circle\" without naming it does not earn the mark."},{"t":"ex","title":"Worded problem: maximum speed on a flat curve","q":"A 1200 kg car rounds a flat curve of radius 50 m. The coefficient of static friction between tyres and road is 0.70. Find the maximum speed without skidding.","s":["Friction supplies the centripetal force: $\\mu_smg=\\frac{mv^2}{r}$, so $v=\\sqrt{\\mu_sgr}$ (mass cancels).","$v=\\sqrt{0.70\\times9.8\\times50}\\approx18.5$ m/s (about 67 km/h)."],"a":"About $18.5$ m/s."}]},{"id":"ph3-c03-s3","code":"3.3","title":"Banked curves and horizontal circles","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: banked curves circular motion","url":"https://www.youtube.com/results?search_query=Flipping+Physics+banked+curves+circular+motion","kind":"search"}]},{"t":"p","x":"On a **frictionless banked curve**, the horizontal component of the normal force provides the centripetal force: $N\\sin\\theta=\\frac{mv^2}{r}$ and $N\\cos\\theta=mg$. Dividing gives $\\tan\\theta=\\dfrac{v^2}{rg}$. The same method works for a conical pendulum (tension has horizontal and vertical components)."},{"t":"ex","title":"Banked road","q":"At what angle should a frictionless curve of radius $80\\ \\text{m}$ be banked for $20\\ \\text{m s}^{-1}$?","s":["$\\tan\\theta=\\frac{v^2}{rg}=\\frac{400}{80(9.8)}=0.510$."],"a":"$\\theta=27.0^\\circ$"},{"t":"p","x":"**Method:** resolve forces vertically (no acceleration) and horizontally toward the centre ($F=mv^2/r$), then combine."},{"t":"p","x":"**Design speed of a banked curve.** On a frictionless bank, $N\\cos\\theta=mg$ vertically and $N\\sin\\theta=\\frac{mv^2}{r}$ horizontally. Dividing gives $\\tan\\theta=\\frac{v^2}{rg}$. At this speed no friction is needed. Faster cars tend to slide up the bank (friction acts down the slope); slower cars tend to slide down (friction acts up the slope)."},{"t":"ex","title":"Worded problem: velodrome","q":"A velodrome turn has radius 25 m and is designed for 15 m/s. What banking angle is needed so no friction is required?","s":["$\\tan\\theta=\\frac{v^2}{rg}=\\frac{15^2}{25\\times9.8}\\approx0.918$.","$\\theta\\approx42.6^\\circ$."],"a":"About $43^\\circ$."},{"t":"ex","title":"Conical pendulum","q":"A 0.20 kg mass on a 0.80 m string moves in a horizontal circle with the string at $30^\\circ$ to the vertical. Find the tension and the speed.","s":["Vertical: $T\\cos30^\\circ=mg\\Rightarrow T=\\frac{0.20\\times9.8}{0.866}\\approx2.26$ N.","Radius $r=0.80\\sin30^\\circ=0.40$ m. Horizontal: $T\\sin30^\\circ=\\frac{mv^2}{r}\\Rightarrow v^2=\\frac{2.26\\times0.5\\times0.40}{0.20}\\approx2.26$, so $v\\approx1.5$ m/s."],"a":"$T\\approx2.3$ N, $v\\approx1.5$ m/s."}]},{"id":"ph3-c03-s4","code":"3.4","title":"Vertical circles","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: vertical circle circular motion","url":"https://www.youtube.com/results?search_query=Flipping+Physics+vertical+circle+circular+motion","kind":"search"}]},{"t":"p","x":"In a vertical circle, speed changes and the net inward force changes with position. **Top:** $T+mg=\\frac{mv^2}{r}$. **Bottom:** $T-mg=\\frac{mv^2}{r}$. The minimum speed at the top for a string to stay taut is when $T=0$: $v_{\\min}=\\sqrt{gr}$. On a hill or bridge, $mg-N=\\frac{mv^2}{r}$ at the top, so you feel lighter."},{"t":"ex","title":"Bottom of a swing","q":"A $2.0\\ \\text{kg}$ mass moves at $3.0\\ \\text{m s}^{-1}$ at the bottom of a vertical circle of radius $1.5\\ \\text{m}$. Find the tension.","s":["$T-mg=\\frac{mv^2}{r}$, so $T=2.0\\left(9.8+\\frac{9.0}{1.5}\\right)=31.6\\ \\text{N}$."],"a":"$31.6\\ \\text{N}$"},{"t":"ex","title":"Minimum speed","q":"Find the minimum speed at the top of a vertical circle of radius $0.50\\ \\text{m}$.","s":["$T=0\\Rightarrow mg=\\frac{mv^2}{r}\\Rightarrow v=\\sqrt{gr}=\\sqrt{4.9}=2.21\\ \\text{m s}^{-1}$."],"a":"$2.21\\ \\text{m s}^{-1}$"},{"t":"p","x":"**Minimum speed at the top.** At the top of a vertical circle, the smallest possible inward force is gravity alone (tension or normal force zero). So $mg=\\frac{mv^2}{r}$ gives $v_{\\min}=\\sqrt{gr}$. Below this the string goes slack or the rider leaves the track. At the bottom the tension or normal force is largest: $T=mg+\\frac{mv^2}{r}$, which is why you feel heavier at the bottom of a swing."},{"t":"ex","title":"Worded problem: roller coaster loop","q":"A roller coaster loop has radius 8.0 m. What is the minimum speed at the top? If a 70 kg rider passes the top at 12 m/s, what normal force does the seat exert?","s":["$v_{\\min}=\\sqrt{9.8\\times8.0}\\approx8.85$ m/s.","At 12 m/s: $N+mg=\\frac{mv^2}{r}\\Rightarrow N=\\frac{70\\times144}{8.0}-70\\times9.8=1260-686=574$ N (downward, toward the centre)."],"a":"Minimum $8.9$ m/s; seat force $574$ N."}]},{"id":"ph3-c03-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Say which force.** Examiners want the real force supplying the centripetal force, and its direction toward the centre. \"Centripetal force\" alone as a labelled arrow on a free-body diagram is usually wrong."},{"t":"p","x":"**Check your signs.** Take the direction toward the centre as positive for circular-motion equations. At the top of a circle gravity points toward the centre; at the bottom it points away."}]}],"quiz":[{"topic":"Speed","q":"A stone moves in a circle of radius $2.0\\ \\text{m}$ with period $4.0\\ \\text{s}$. Find its speed ($\\text{m s}^{-1}$, 2 decimal places).","a":"3.14","alt":[],"ad":"$3.14\\ \\text{m s}^{-1}$","sol":"$v=\\frac{2\\pi(2.0)}{4.0}=3.14$.","h":["$v=2\\pi r/T$.","$2\\pi\\times2.0=12.57$.","Divide by 4.0."]},{"topic":"Acceleration","q":"$v=6.0\\ \\text{m s}^{-1}$ and $r=3.0\\ \\text{m}$. Find the centripetal acceleration ($\\text{m s}^{-2}$).","a":"12","alt":["12.0"],"ad":"$12\\ \\text{m s}^{-2}$","sol":"$a=v^2/r=36/3.0$.","h":["$a=v^2/r$.","$36\\div3$.","Compute."]},{"topic":"Force","q":"A $0.50\\ \\text{kg}$ mass moves at $4.0\\ \\text{m s}^{-1}$ on a radius of $2.0\\ \\text{m}$. Find the centripetal force (N).","a":"4.0","alt":["4"],"ad":"$4.0\\ \\text{N}$","sol":"$F=mv^2/r=0.50(16)/2.0$.","h":["$F=mv^2/r$.","$16/2$.","Multiply by 0.50."]},{"topic":"Period","q":"A motor turns at $5.0\\ \\text{Hz}$. Find the period (s).","a":"0.20","alt":["0.2"],"ad":"$0.20\\ \\text{s}$","sol":"$T=1/f$.","h":["$T=1/f$.","$1/5.0$.","Compute."]},{"topic":"Minimum speed","q":"Find the minimum speed at the top of a vertical circle of radius $2.5\\ \\text{m}$ ($\\text{m s}^{-1}$, 2 decimal places).","a":"4.95","alt":[],"ad":"$4.95\\ \\text{m s}^{-1}$","sol":"$v=\\sqrt{gr}=\\sqrt{24.5}=4.95$.","h":["Tension is zero at the minimum.","$mg=mv^2/r$.","$v=\\sqrt{gr}$."]},{"topic":"Banking","q":"A frictionless curve of radius $50\\ \\text{m}$ is designed for $14\\ \\text{m s}^{-1}$. Find the banking angle (degrees, 1 decimal place).","a":"21.8","alt":[],"ad":"$21.8^\\circ$","sol":"$\\tan\\theta=\\frac{196}{490}=0.40$, $\\theta=21.8^\\circ$.","h":["$\\tan\\theta=v^2/rg$.","$196/490$.","$\\tan^{-1}0.40$."]},{"topic":"Accelerating?","q":"A satellite orbits at constant speed in a circle. Is it accelerating? Answer yes or no.","a":"yes","alt":["Yes"],"ad":"Yes","sol":"Direction of velocity changes, so acceleration is non-zero toward the centre.","h":["Acceleration is change in velocity.","Velocity is a vector.","Direction changes."]},{"topic":"Bottom tension","q":"$m=2.0\\ \\text{kg}$, $v=3.0\\ \\text{m s}^{-1}$, $r=1.5\\ \\text{m}$ at the bottom of a vertical circle. Find the tension (N, 1 decimal place).","a":"31.6","alt":[],"ad":"$31.6\\ \\text{N}$","sol":"$T=m(g+v^2/r)=2.0(9.8+6.0)$.","h":["Tension minus weight gives centripetal force.","$T=mg+mv^2/r$.","Substitute."]},{"topic":"Hill","q":"A $1000\\ \\text{kg}$ car crosses the top of a hill of radius $40\\ \\text{m}$ at $10\\ \\text{m s}^{-1}$. Find the normal force (N).","a":"7300","alt":[],"ad":"$7300\\ \\text{N}$","sol":"$N=m(g-v^2/r)=1000(9.8-2.5)=7300$.","h":["Weight minus normal gives the inward force.","$mg-N=mv^2/r$.","Substitute."]},{"topic":"Angular speed","q":"A wheel turns at $60\\ \\text{rpm}$. Find $\\omega$ ($\\text{rad s}^{-1}$, 2 decimal places).","a":"6.28","alt":[],"ad":"$6.28\\ \\text{rad s}^{-1}$","sol":"$f=1\\ \\text{Hz}$, $\\omega=2\\pi f$.","h":["Convert to revolutions per second.","$\\omega=2\\pi f$.","$2\\pi\\times1$."]}],"comets":[{"topic":"Extension: Lifting off","q":"A car crosses the top of a hill of radius $40\\ \\text{m}$. At what speed does the normal force become zero ($\\text{m s}^{-1}$, 1 decimal place)?","a":"19.8","alt":[],"ad":"$19.8\\ \\text{m s}^{-1}$","sol":"$N=0\\Rightarrow mg=\\frac{mv^2}{r}\\Rightarrow v=\\sqrt{gr}=\\sqrt{392}=19.8$.","h":["Set $N=0$.","$mg=mv^2/r$.","$v=\\sqrt{gr}$."]},{"topic":"Extension: Flat curve limit","q":"The maximum speed on a flat curve of radius $40\\ \\text{m}$ with $\\mu=0.50$ is?","a":"14","alt":["14.0"],"ad":"$14\\ \\text{m s}^{-1}$","sol":"$\\mu mg=\\frac{mv^2}{r}\\Rightarrow v=\\sqrt{\\mu gr}=\\sqrt{196}=14$.","h":["Friction provides the inward force.","$\\mu g=v^2/r$.","$v=\\sqrt{\\mu gr}$."]}],"cards":[{"type":"def","topic":"Uniform circular motion","f":"Speed of an object in uniform circular motion.","b":"$v=\\frac{2\\pi r}{T}$"},{"type":"def","topic":"Uniform circular motion","f":"Centripetal acceleration formulas.","b":"$a_c=\\frac{v^2}{r}=\\frac{4\\pi^2r}{T^2}$, directed toward the centre."},{"type":"def","topic":"Uniform circular motion","f":"Direction of velocity in circular motion.","b":"Tangent to the circle, perpendicular to the radius."},{"type":"def","topic":"Centripetal force","f":"Centripetal force formula.","b":"$F_c=\\frac{mv^2}{r}=\\frac{4\\pi^2mr}{T^2}$, the net force toward the centre."},{"type":"word","topic":"Centripetal force","f":"What supplies the centripetal force for a car on a flat curve?","b":"Static friction between the tyres and the road, pointing toward the centre."},{"type":"word","topic":"Centripetal force","f":"Max speed on a flat curve with friction coefficient $\\mu$, radius $r$?","b":"$v=\\sqrt{\\mu gr}$"},{"type":"def","topic":"Banked curves and horizontal circles","f":"Banking angle formula (no friction).","b":"$\\tan\\theta=\\dfrac{v^2}{rg}$"},{"type":"word","topic":"Banked curves and horizontal circles","f":"A car goes faster than the design speed on a banked curve. Which way does friction act?","b":"Down the slope, because the car tends to slide up and out."},{"type":"def","topic":"Vertical circles","f":"Minimum speed at the top of a vertical circle.","b":"$v_{\\min}=\\sqrt{gr}$ (gravity alone provides the centripetal force)."},{"type":"def","topic":"Vertical circles","f":"Tension at the bottom of a vertical circle.","b":"$T=mg+\\frac{mv^2}{r}$"},{"type":"word","topic":"Vertical circles","f":"Why do you feel heavier at the bottom of a swing?","b":"The seat must push up with $mg+\\frac{mv^2}{r}$, more than your weight, to provide the upward centripetal force."}],"hours":4},"ph3-c04":{"id":"ph3-c04","interactive":"orbit","summary":"Every mass attracts every other mass. This chapter covers Newton's law of universal gravitation, gravitational field strength and the inverse-square law, orbital speed and period, Kepler's laws, geostationary satellites and apparent weightlessness.","videos":[{"src":"F","title":"Newton's law of universal gravitation","url":"https://www.youtube.com/results?search_query=Flipping+Physics+Newton+law+of+gravitation+physics+orbits","kind":"search"},{"src":"K","title":"Orbits and Kepler's laws","url":"https://www.youtube.com/results?search_query=Khan+Academy+Kepler+laws+orbits+physics","kind":"search"},{"src":"V","title":"Veritasium: Gravity visualized","url":"https://www.youtube.com/results?search_query=Veritasium+gravity+orbits","kind":"search"}],"sections":[{"id":"ph3-c04-s1","code":"4.1","title":"Newton's law of gravitation","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: Newton law of gravitation","url":"https://www.youtube.com/results?search_query=Flipping+Physics+Newton+law+of+gravitation","kind":"search"}]},{"t":"p","x":"Any two masses attract each other with equal and opposite forces along the line joining their centres. The force depends on the product of the masses and falls with the **square of the distance** between centres. $G=6.67\\times10^{-11}\\ \\text{N m}^2\\text{kg}^{-2}$."},{"t":"key","x":"$$F=\\frac{Gm_1m_2}{r^2}$$"},{"t":"ex","title":"Two cars","q":"Two $1.0\\times10^3\\ \\text{kg}$ cars are $2.0\\ \\text{m}$ apart. Find the gravitational force between them.","s":["$F=\\frac{6.67\\times10^{-11}(1000)(1000)}{2.0^2}=1.67\\times10^{-5}\\ \\text{N}$."],"a":"$1.67\\times10^{-5}\\ \\text{N}$, far too small to notice."},{"t":"warn","x":"$r$ is the distance between **centres of mass**, not surfaces. For an object at height $h$ above a planet of radius $R$, use $r=R+h$."},{"t":"p","x":"**An inverse square law.** Gravitational force falls with the square of the distance between centres: double the distance and the force drops to a quarter; triple it and it drops to a ninth. Every mass attracts every other mass, but $G=6.67\\times10^{-11}\\ \\text{N m}^2\\text{kg}^{-2}$ is so small that the force is only noticeable when at least one mass is planet-sized."},{"t":"ex","title":"Worded problem: Earth and Moon","q":"Find the gravitational force between Earth ($5.97\\times10^{24}$ kg) and the Moon ($7.35\\times10^{22}$ kg), whose centres are $3.84\\times10^8$ m apart.","s":["$F=\\dfrac{6.67\\times10^{-11}\\times5.97\\times10^{24}\\times7.35\\times10^{22}}{(3.84\\times10^8)^2}$."],"a":"$F\\approx1.98\\times10^{20}$ N"}]},{"id":"ph3-c04-s2","code":"4.2","title":"Gravitational field strength","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: gravitational field strength","url":"https://www.youtube.com/results?search_query=Flipping+Physics+gravitational+field+strength","kind":"search"}]},{"t":"p","x":"The **gravitational field strength** is the force per unit mass: $g=\\dfrac{F}{m}=\\dfrac{GM}{r^2}$ (in $\\text{N kg}^{-1}$, the same as $\\text{m s}^{-2}$). It points toward the centre of the mass, and **doubling the distance divides it by 4**. Near Earth's surface $g\\approx9.8\\ \\text{N kg}^{-1}$, which can be confirmed from $G$, $M_E=5.97\\times10^{24}\\ \\text{kg}$ and $R_E=6.37\\times10^6\\ \\text{m}$."},{"t":"ex","title":"Field strength","q":"Find $g$ at the surface of Mars ($M=6.4\\times10^{23}\\ \\text{kg}$, $R=3.4\\times10^6\\ \\text{m}$).","s":["$g=\\frac{GM}{R^2}=\\frac{6.67\\times10^{-11}(6.4\\times10^{23})}{(3.4\\times10^6)^2}=3.69\\ \\text{N kg}^{-1}$."],"a":"$3.69\\ \\text{N kg}^{-1}$"},{"t":"ex","title":"At altitude","q":"Find $g$ at $400\\ \\text{km}$ above Earth's surface.","s":["$r=6.37\\times10^6+4.0\\times10^5=6.77\\times10^6\\ \\text{m}$.","$g=\\frac{6.67\\times10^{-11}(5.97\\times10^{24})}{(6.77\\times10^6)^2}=8.69\\ \\text{N kg}^{-1}$."],"a":"$8.69\\ \\text{N kg}^{-1}$, only slightly less than at the surface."},{"t":"int","name":"orbit","cap":"Move the orbital radius. See how field strength, speed and period change with radius."},{"t":"p","x":"**Field strength equals free-fall acceleration.** Because $F=mg$ and $F=\\frac{GMm}{r^2}$, $g=\\frac{GM}{r^2}$. So the field strength in N/kg is also the free-fall acceleration in m/s\u00b2. Above the surface, $r=R+h$. At a height equal to one Earth radius ($r=2R$), $g$ is a quarter of its surface value, about $2.45\\ \\text{m s}^{-2}$."},{"t":"ex","title":"Worded problem: Mars","q":"Mars has mass $6.42\\times10^{23}$ kg and radius $3.39\\times10^6$ m. Find $g$ on its surface and the weight of a 90 kg astronaut there.","s":["$g=\\dfrac{6.67\\times10^{-11}\\times6.42\\times10^{23}}{(3.39\\times10^6)^2}\\approx3.73\\ \\text{N kg}^{-1}$.","Weight $=90\\times3.73\\approx335$ N (compared with 882 N on Earth). Their mass is still 90 kg."],"a":"$g\\approx3.7\\ \\text{N kg}^{-1}$; weight about $340$ N."}]},{"id":"ph3-c04-s3","code":"4.3","title":"Orbits and Kepler's laws","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: Kepler laws orbits satellites","url":"https://www.youtube.com/results?search_query=Flipping+Physics+Kepler+laws+orbits+satellites","kind":"search"}]},{"t":"p","x":"For a satellite in a circular orbit, **gravity is the centripetal force**: $\\dfrac{GMm}{r^2}=\\dfrac{mv^2}{r}$ so $v=\\sqrt{\\dfrac{GM}{r}}$ (independent of the satellite's mass). With $v=\\frac{2\\pi r}{T}$ this gives **Kepler's third law**: $\\dfrac{T^2}{r^3}=\\dfrac{4\\pi^2}{GM}$, a constant for all orbits around the same central mass."},{"t":"key","x":"$$v=\\sqrt{\\frac{GM}{r}},\\qquad \\frac{r^3}{T^2}=\\frac{GM}{4\\pi^2}$$"},{"t":"ex","title":"Space station","q":"Find the orbital speed and period of a satellite $400\\ \\text{km}$ above Earth.","s":["$r=6.77\\times10^6$; $v=\\sqrt{\\frac{GM}{r}}=\\sqrt{\\frac{3.98\\times10^{14}}{6.77\\times10^6}}=7.67\\times10^3\\ \\text{m s}^{-1}$.","$T=\\frac{2\\pi r}{v}=5.55\\times10^3\\ \\text{s}=92.4\\ \\text{min}$."],"a":"$7.67\\ \\text{km s}^{-1}$ and $92\\ \\text{min}$."},{"t":"p","x":"**Kepler's laws.** (1) Orbits are ellipses with the central body at one focus. (2) A line from the central body sweeps equal areas in equal times, so orbiting bodies move fastest when closest. (3) $T^2\\propto r^3$. Higher orbits are **slower** and take **longer**."},{"t":"p","x":"**Everything follows from one equation.** Set gravity equal to the centripetal force: $\\frac{GMm}{r^2}=\\frac{mv^2}{r}$. This gives $v=\\sqrt{\\frac{GM}{r}}$, and with $v=\\frac{2\\pi r}{T}$ it gives Kepler's third law $\\frac{r^3}{T^2}=\\frac{GM}{4\\pi^2}$. The satellite's mass cancels, so orbital speed and period depend only on the central mass and the orbit radius. Lower orbits are faster and have shorter periods."},{"t":"ex","title":"Worded problem: ISS","q":"The ISS orbits about 420 km above Earth's surface. Find its orbital speed and period. ($R_E=6.37\\times10^6$ m, $M_E=5.97\\times10^{24}$ kg)","s":["$r=6.37\\times10^6+4.20\\times10^5=6.79\\times10^6$ m.","$v=\\sqrt{\\frac{6.67\\times10^{-11}\\times5.97\\times10^{24}}{6.79\\times10^6}}\\approx7.66\\times10^3$ m/s.","$T=\\frac{2\\pi r}{v}=\\frac{2\\pi\\times6.79\\times10^6}{7.66\\times10^3}\\approx5.57\\times10^3$ s $\\approx93$ minutes."],"a":"About $7.7$ km/s and a period of about 93 minutes."}]},{"id":"ph3-c04-s4","code":"4.4","title":"Geostationary satellites and weightlessness","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: geostationary satellite weightlessness","url":"https://www.youtube.com/results?search_query=Flipping+Physics+geostationary+satellite+weightlessness","kind":"search"}]},{"t":"p","x":"A **geostationary** satellite has a period of 24 hours, orbits above the equator in the same direction as Earth's rotation, and so stays above one point. Its radius is found from $r^3=\\frac{GMT^2}{4\\pi^2}\\approx4.22\\times10^7\\ \\text{m}$ from Earth's centre, about $3.59\\times10^7\\ \\text{m}$ above the surface."},{"t":"p","x":"**Apparent weightlessness.** An astronaut in orbit is in **free fall** around Earth. Gravity still acts (about $90\\%$ of surface value at ISS altitude), but there is no contact force from the floor, so no sensation of weight."},{"t":"warn","x":"Orbiting astronauts do not float because gravity is absent. They float because they and the spacecraft fall together."},{"t":"p","x":"**Finding the geostationary radius.** Use Kepler's third law with $T=24$ h $=86400$ s (strictly a sidereal day of about 86164 s): $r=\\sqrt[3]{\\frac{GMT^2}{4\\pi^2}}\\approx4.22\\times10^7$ m from Earth's centre, about 36 000 km above the surface. Geostationary satellites are used for communications and weather imaging because ground dishes can point at a fixed spot in the sky."},{"t":"ex","title":"Geostationary orbit","q":"Calculate the radius and speed of a geostationary orbit.","s":["$r^3=\\dfrac{6.67\\times10^{-11}\\times5.97\\times10^{24}\\times86400^2}{4\\pi^2}\\approx7.53\\times10^{22}$, so $r\\approx4.22\\times10^7$ m.","$v=\\frac{2\\pi r}{T}=\\frac{2\\pi\\times4.22\\times10^7}{86400}\\approx3.07\\times10^3$ m/s."],"a":"$r\\approx4.22\\times10^7$ m (about $3.58\\times10^7$ m above the surface); $v\\approx3.1$ km/s."}]},{"id":"ph3-c04-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Constants and rounding.** Use $G=6.67\\times10^{-11}$, $M_E=5.97\\times10^{24}\\ \\text{kg}$, $R_E=6.37\\times10^6\\ \\text{m}$. Keep full precision until the end. Convert km to m before substituting."},{"t":"p","x":"**Proportional reasoning.** Many questions are asked as ratios. If $r$ doubles, $F$ and $g$ become $\\frac14$, $v$ becomes $\\frac1{\\sqrt2}$ and $T$ becomes $2\\sqrt2$ times larger. Writing the proportion with symbols is quicker and safer than recalculating."}]}],"quiz":[{"topic":"Doubling","q":"If the distance between two masses doubles, by what factor does the gravitational force change (as a decimal)?","a":"0.25","alt":["1/4"],"ad":"$\\frac14$","sol":"$F\\propto1/r^2$.","h":["Inverse square law.","$(1/2)^2$.","Compute."]},{"topic":"Field at 2R","q":"Find $g$ at a distance $2R_E$ from Earth's centre ($\\text{N kg}^{-1}$), using $g=9.8$ at the surface.","a":"2.45","alt":[],"ad":"$2.45\\ \\text{N kg}^{-1}$","sol":"$g\\propto1/r^2$, so $9.8/4$.","h":["Distance doubles.","Field falls by a factor of 4.","Divide 9.8 by 4."]},{"topic":"Mars","q":"Find $g$ at the surface of a planet with $M=6.4\\times10^{23}\\ \\text{kg}$ and $R=3.4\\times10^6\\ \\text{m}$ ($\\text{N kg}^{-1}$, 2 decimal places).","a":"3.69","alt":[],"ad":"$3.69\\ \\text{N kg}^{-1}$","sol":"$g=\\frac{GM}{R^2}=3.69$.","h":["$g=GM/R^2$.","Square the radius.","Compute."]},{"topic":"Weight","q":"Find the weight of a $60\\ \\text{kg}$ person where $g=3.7\\ \\text{N kg}^{-1}$ (N).","a":"222","alt":[],"ad":"$222\\ \\text{N}$","sol":"$W=mg=60(3.7)$.","h":["$W=mg$.","$60\\times3.7$.","Compute."]},{"topic":"Orbital speed","q":"A satellite orbits at $r=7.0\\times10^6\\ \\text{m}$ from Earth's centre. Find its speed in $\\text{km s}^{-1}$ (1 decimal place).","a":"7.5","alt":[],"ad":"$7.5\\ \\text{km s}^{-1}$","sol":"$v=\\sqrt{GM/r}=\\sqrt{3.98\\times10^{14}/7.0\\times10^6}=7.54\\times10^3$.","h":["Gravity is the centripetal force.","$v=\\sqrt{GM/r}$.","Convert to km/s."]},{"topic":"Period","q":"A satellite orbits at $r=7.0\\times10^6\\ \\text{m}$ with speed $7.54\\times10^3\\ \\text{m s}^{-1}$. Find its period in minutes (1 decimal place).","a":"97.2","alt":[],"ad":"$97.2\\ \\text{min}$","sol":"$T=\\frac{2\\pi r}{v}=5.83\\times10^3\\ \\text{s}=97.2\\ \\text{min}$.","h":["$T=2\\pi r/v$.","$2\\pi\\times7.0\\times10^6=4.40\\times10^7$.","Divide by $v$ and convert."]},{"topic":"Kepler","q":"If an orbital radius is multiplied by 4, by what factor is the period multiplied?","a":"8","alt":[],"ad":"$8$","sol":"$T\\propto r^{3/2}$, so $4^{3/2}=8$.","h":["$T^2\\propto r^3$.","$T\\propto r^{1.5}$.","$4^{1.5}$."]},{"topic":"Weightless?","q":"An astronaut in a stable orbit has no gravity acting on them. True or false?","a":"false","alt":["False"],"ad":"False","sol":"Gravity acts and provides the centripetal force; they are in free fall.","h":["What keeps the satellite in orbit?","Gravity is the centripetal force.","So it is not zero."]},{"topic":"Geostationary period","q":"What is the period of a geostationary satellite in hours?","a":"24","alt":[],"ad":"$24\\ \\text{h}$","sol":"It matches Earth's rotation.","h":["Stays above a point.","Matches rotation.","One day."]},{"topic":"Far field","q":"Find $g$ at a height $3R_E$ above Earth's surface (so $r=4R_E$), in $\\text{N kg}^{-1}$ (2 decimal places).","a":"0.61","alt":[],"ad":"$0.61\\ \\text{N kg}^{-1}$","sol":"$9.8/16=0.6125$.","h":["$r=4R_E$.","Field falls with $r^2$.","$9.8/16$."]}],"comets":[{"topic":"Extension: Period ratio","q":"Satellite A has a period 8 times that of satellite B around the same planet. Find $r_A/r_B$.","a":"4","alt":[],"ad":"$4$","sol":"$r^3\\propto T^2$, so $r\\propto T^{2/3}=8^{2/3}=4$.","h":["$T^2\\propto r^3$.","$r\\propto T^{2/3}$.","$8^{2/3}=4$."]},{"topic":"Extension: Planet scaling","q":"Two planets have the same density but one has twice the radius. Find the ratio of surface $g$ (large to small).","a":"2","alt":[],"ad":"$2$","sol":"$M\\propto R^3$, so $g=\\frac{GM}{R^2}\\propto R$.","h":["Same density means $M\\propto R^3$.","$g=GM/R^2$.","$g\\propto R$."]}],"cards":[{"type":"def","topic":"Newton's law of gravitation","f":"Newton's law of universal gravitation.","b":"$F=\\dfrac{Gm_1m_2}{r^2}$ where $r$ is the distance between centres and $G=6.67\\times10^{-11}\\ \\text{N m}^2\\text{kg}^{-2}$."},{"type":"word","topic":"Newton's law of gravitation","f":"If the distance between two masses triples, what happens to the force?","b":"It becomes $\\frac19$ of the original."},{"type":"word","topic":"Newton's law of gravitation","f":"If both masses double and the distance doubles, the force...?","b":"Stays the same: $\\frac{2\\times2}{2^2}=1$."},{"type":"def","topic":"Gravitational field strength","f":"Gravitational field strength at distance $r$ from a planet's centre.","b":"$g=\\dfrac{GM}{r^2}$ (N kg\u207b\u00b9, equal to m s\u207b\u00b2)."},{"type":"word","topic":"Gravitational field strength","f":"$g$ at a height of one Earth radius above the surface?","b":"$r=2R$, so $g=\\frac{9.8}{4}\\approx2.45\\ \\text{N kg}^{-1}$."},{"type":"def","topic":"Gravitational field strength","f":"Difference between mass and weight.","b":"Mass (kg) is the amount of matter and is the same everywhere. Weight $W=mg$ (N) is the gravitational force and depends on $g$."},{"type":"def","topic":"Orbits and Kepler's laws","f":"Orbital speed of a satellite.","b":"$v=\\sqrt{\\dfrac{GM}{r}}$ (independent of the satellite's mass)."},{"type":"def","topic":"Orbits and Kepler's laws","f":"Kepler's third law (circular orbits).","b":"$\\dfrac{r^3}{T^2}=\\dfrac{GM}{4\\pi^2}$, the same for all bodies orbiting the same central mass."},{"type":"def","topic":"Orbits and Kepler's laws","f":"State Kepler's first and second laws.","b":"(1) Planets move in ellipses with the Sun at one focus. (2) A line from the Sun to a planet sweeps equal areas in equal times, so planets move faster when closer."},{"type":"word","topic":"Orbits and Kepler's laws","f":"Satellite A orbits at 4 times the radius of satellite B. Compare periods.","b":"$T\\propto r^{3/2}$, so $T_A=4^{3/2}T_B=8T_B$."},{"type":"def","topic":"Geostationary satellites and weightlessness","f":"Three conditions for a geostationary orbit.","b":"Period of 24 h (one sidereal day), circular orbit above the equator, moving in the same direction as Earth rotates."},{"type":"def","topic":"Geostationary satellites and weightlessness","f":"Radius of a geostationary orbit.","b":"About $4.22\\times10^7$ m from Earth's centre (about 36 000 km altitude)."},{"type":"word","topic":"Geostationary satellites and weightlessness","f":"Why do astronauts on the ISS appear weightless?","b":"They and the station are both in free fall around Earth with the same acceleration, so nothing pushes on them. Gravity is still about 90% of its surface value."}],"hours":4.5},"ph3-c05":{"id":"ph3-c05","interactive":"none","summary":"Electric charges exert forces on each other through electric fields. This chapter covers Coulomb's law, electric field strength, field lines, uniform fields between parallel plates, and the motion and energy of charges in a field.","videos":[{"src":"F","title":"Coulomb's law and electric fields","url":"https://www.youtube.com/results?search_query=Flipping+Physics+Coulomb+law+electric+field+physics","kind":"search"},{"src":"K","title":"Electric field and potential","url":"https://www.youtube.com/results?search_query=Khan+Academy+electric+field+electric+potential+physics","kind":"search"},{"src":"V","title":"Veritasium: Electric fields","url":"https://www.youtube.com/results?search_query=Veritasium+electricity+energy+flows","kind":"search"}],"sections":[{"id":"ph3-c05-s1","code":"5.1","title":"Charge and Coulomb's law","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: Coulomb law electric charge","url":"https://www.youtube.com/results?search_query=Flipping+Physics+Coulomb+law+electric+charge","kind":"search"}]},{"t":"p","x":"There are two kinds of charge. **Like charges repel and unlike charges attract.** Charge is measured in coulombs; the elementary charge is $1.6\\times10^{-19}\\ \\text{C}$ (the data book lists the electron's charge as $e=-1.6\\times10^{-19}\\ \\text{C}$). **Coulomb's law** gives the force between two point charges, with $k=9\\times10^9\\ \\text{N m}^2\\text{C}^{-2}$ (the value in the QCAA data book)."},{"t":"key","x":"$$F=\\frac{kq_1q_2}{r^2}$$"},{"t":"ex","title":"Two charges","q":"Charges $+3.0\\ \\mu\\text{C}$ and $-2.0\\ \\mu\\text{C}$ are $0.20\\ \\text{m}$ apart. Find the force between them.","s":["$F=\\frac{(9\\times10^9)(3.0\\times10^{-6})(2.0\\times10^{-6})}{0.20^2}=1.35\\ \\text{N}$.","Opposite charges, so it is attractive."],"a":"$1.35\\ \\text{N}$ attractive."},{"t":"warn","x":"Use the **magnitudes** of the charges to find the size of the force, then decide the direction from the signs. Convert $\\mu\\text{C}$ to C ($\\times10^{-6}$) before substituting."},{"t":"p","x":"**Coulomb's law and gravity side by side.** Both are inverse square laws: $F=\\frac{kq_1q_2}{r^2}$ and $F=\\frac{Gm_1m_2}{r^2}$. The differences: charge comes in two signs, so electric forces can attract or repel, while gravity only attracts; and $k=8.99\\times10^9\\ \\text{N m}^2\\text{C}^{-2}$ is about $10^{20}$ times larger than $G$, which is why electric forces dominate at the atomic scale."},{"t":"p","x":"**Charging and conservation.** Objects become charged by gaining or losing electrons, never protons. Charge is conserved: when two identical conducting spheres touch, they share their total charge equally."},{"t":"ex","title":"Worded problem: touching spheres","q":"Two identical small conducting spheres carry $+6.0\\ \\mu\\text{C}$ and $-2.0\\ \\mu\\text{C}$. They touch and are then placed 0.30 m apart. Find the force between them.","s":["Total charge $=+4.0\\ \\mu\\text{C}$, shared equally: $+2.0\\ \\mu\\text{C}$ each.","$F=\\dfrac{8.99\\times10^9\\times(2.0\\times10^{-6})^2}{0.30^2}\\approx0.40$ N."],"a":"$0.40$ N, repulsive (both now positive)."},{"t":"ex","title":"Net force from two charges","q":"Charges of $+3.0\\ \\mu\\text{C}$ at $x=0$ and $-3.0\\ \\mu\\text{C}$ at $x=0.20$ m. Find the force on a $+1.0\\ \\mu\\text{C}$ charge at $x=0.10$ m.","s":["From the $+3.0$: repelled to the right, $F=\\frac{8.99\\times10^9\\times3.0\\times10^{-6}\\times1.0\\times10^{-6}}{0.10^2}\\approx2.70$ N.","From the $-3.0$: attracted to the right, also $2.70$ N."],"a":"$5.4$ N in the $+x$ direction."}]},{"id":"ph3-c05-s2","code":"5.2","title":"Electric field strength","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: electric field strength","url":"https://www.youtube.com/results?search_query=Flipping+Physics+electric+field+strength","kind":"search"}]},{"t":"p","x":"The **electric field strength** at a point is the force per unit **positive** charge: $E=\\dfrac{F}{q}$ (units $\\text{N C}^{-1}=\\text{V m}^{-1}$). For a point charge $Q$: $E=\\dfrac{kQ}{r^2}$. The field points **away from positive** charges and **toward negative** charges. Field lines show direction; closer lines mean a stronger field."},{"t":"ex","title":"Point charge","q":"Find the field strength $0.50\\ \\text{m}$ from a $+4.0\\ \\mu\\text{C}$ point charge.","s":["$E=\\frac{(9\\times10^9)(4.0\\times10^{-6})}{0.50^2}=1.44\\times10^5\\ \\text{N C}^{-1}$."],"a":"$1.44\\times10^5\\ \\text{N C}^{-1}$ directed away from the charge."},{"t":"p","x":"**Superposition.** The total field is the **vector sum** of the fields from each charge. Between two equal like charges the fields cancel at the midpoint."},{"t":"warn","x":"A **negative** charge in a field feels a force **opposite** to the field direction."},{"t":"p","x":"**Drawing field lines.** Field lines start on positive charges and end on negative charges, never cross, and are closer together where the field is stronger. The line's direction at any point is the direction a small positive test charge would be pushed. Around a single point charge they are radial; between a positive and a negative charge they curve from one to the other (a dipole pattern)."},{"t":"ex","title":"Worded problem: point of zero field","q":"Charges of $+4.0\\ \\mu\\text{C}$ and $+1.0\\ \\mu\\text{C}$ are 0.30 m apart. Where between them is the electric field zero?","s":["Let the point be $x$ from the $4.0\\ \\mu\\text{C}$ charge. Fields cancel when $\\frac{k(4.0)}{x^2}=\\frac{k(1.0)}{(0.30-x)^2}$.","Take square roots: $\\frac{2}{x}=\\frac{1}{0.30-x}\\Rightarrow0.60-2x=x\\Rightarrow x=0.20$ m."],"a":"$0.20$ m from the $+4.0\\ \\mu$C charge (closer to the smaller charge)."}]},{"id":"ph3-c05-s3","code":"5.3","title":"Uniform fields and charged particles","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: charged particle in uniform electric field","url":"https://www.youtube.com/results?search_query=Flipping+Physics+charged+particle+in+uniform+electric+field","kind":"search"}]},{"t":"p","x":"Between two parallel plates with potential difference $V$ and separation $d$, the field is **uniform**: $E=\\dfrac Vd$. A charge $q$ feels force $F=qE$ and acceleration $a=\\dfrac{qE}{m}$. Starting from rest, work done by the field becomes kinetic energy: $qV=\\tfrac12mv^2$."},{"t":"key","x":"$$E=\\frac Vd,\\qquad F=qE,\\qquad qV=\\tfrac12mv^2$$"},{"t":"ex","title":"Electron in a field","q":"An electron is in a uniform field of $2.5\\times10^4\\ \\text{V m}^{-1}$. Find its force and acceleration.","s":["$F=qE=(1.60\\times10^{-19})(2.5\\times10^4)=4.0\\times10^{-15}\\ \\text{N}$.","$a=\\frac Fm=\\frac{4.0\\times10^{-15}}{9.11\\times10^{-31}}=4.4\\times10^{15}\\ \\text{m s}^{-2}$."],"a":"$4.0\\times10^{-15}\\ \\text{N}$ and $4.4\\times10^{15}\\ \\text{m s}^{-2}$."},{"t":"ex","title":"Speed from potential","q":"An electron accelerates from rest through $500\\ \\text{V}$. Find its final speed.","s":["$v=\\sqrt{\\frac{2qV}{m}}=\\sqrt{\\frac{2(1.60\\times10^{-19})(500)}{9.11\\times10^{-31}}}=1.33\\times10^7\\ \\text{m s}^{-1}$."],"a":"$1.33\\times10^7\\ \\text{m s}^{-1}$"},{"t":"p","x":"**Electron-volt.** An electron accelerated through $1\\ \\text{V}$ gains $1\\ \\text{eV}=1.60\\times10^{-19}\\ \\text{J}$. A proton accelerated through $1000\\ \\text{V}$ gains $1000\\ \\text{eV}$."},{"t":"p","x":"**Parallel plates are like gravity sideways.** Between parallel plates the field is uniform, so a charged particle feels a constant force $qE$ and a constant acceleration $a=\\frac{qE}{m}$. A particle entering at right angles to the field follows a **parabola**, just like a horizontally launched projectile: constant velocity along the plates, constant acceleration across them."},{"t":"ex","title":"Worded problem: electron deflection","q":"An electron enters the space between two plates 2.0 cm apart with a potential difference of 100 V, travelling at $2.0\\times10^7$ m/s parallel to the plates. The plates are 5.0 cm long. Find its sideways deflection as it leaves. ($m_e=9.11\\times10^{-31}$ kg)","s":["$E=\\frac{100}{0.020}=5000\\ \\text{V m}^{-1}$, $a=\\frac{eE}{m}=\\frac{1.60\\times10^{-19}\\times5000}{9.11\\times10^{-31}}\\approx8.78\\times10^{14}\\ \\text{m s}^{-2}$.","Time between plates: $t=\\frac{0.050}{2.0\\times10^7}=2.5\\times10^{-9}$ s.","Deflection $=\\frac12at^2=\\frac12(8.78\\times10^{14})(2.5\\times10^{-9})^2\\approx2.7\\times10^{-3}$ m."],"a":"About $2.7$ mm toward the positive plate."},{"t":"ex","title":"Work done by a field","q":"A proton is accelerated from rest through 2000 V. Find its final speed. ($m_p=1.67\\times10^{-27}$ kg)","s":["$qV=\\tfrac12mv^2\\Rightarrow v=\\sqrt{\\dfrac{2qV}{m}}=\\sqrt{\\dfrac{2\\times1.60\\times10^{-19}\\times2000}{1.67\\times10^{-27}}}$."],"a":"$v\\approx6.2\\times10^5$ m/s"}]},{"id":"ph3-c05-s4","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Gravity versus electric force.** For an electron the electric force is enormously larger than its weight, so ignore gravity unless a particle is stationary (such as an oil drop held in balance). When stationary, $qE=mg$."},{"t":"p","x":"**Direction answers.** Describe field directions with words such as \"toward the negative plate\" and always state the sign of the charge when explaining which way a force acts."}]}],"quiz":[{"topic":"Field strength","q":"A force of $6.0\\times10^{-3}\\ \\text{N}$ acts on $2.0\\ \\mu\\text{C}$. Find $E$ ($\\text{N C}^{-1}$).","a":"3000","alt":["3.0e3","3.0x10^3"],"ad":"$3.0\\times10^3\\ \\text{N C}^{-1}$","sol":"$E=F/q=\\frac{6.0\\times10^{-3}}{2.0\\times10^{-6}}$.","h":["$E=F/q$.","Convert $\\mu$C to C.","Divide."]},{"topic":"Plates","q":"$240\\ \\text{V}$ is applied across plates $0.030\\ \\text{m}$ apart. Find $E$ ($\\text{V m}^{-1}$).","a":"8000","alt":[],"ad":"$8.0\\times10^3\\ \\text{V m}^{-1}$","sol":"$E=V/d=240/0.030$.","h":["$E=V/d$.","$d=0.030$.","Divide."]},{"topic":"Distance","q":"If the distance between two point charges doubles, by what factor does the electric force change (decimal)?","a":"0.25","alt":["1/4"],"ad":"$\\frac14$","sol":"Inverse square.","h":["$F\\propto1/r^2$.","$(1/2)^2$.","Compute."]},{"topic":"Force","q":"A $5.0\\ \\mu\\text{C}$ charge is in a field of $4000\\ \\text{N C}^{-1}$. Find the force (N).","a":"0.020","alt":["0.02"],"ad":"$0.020\\ \\text{N}$","sol":"$F=qE=5.0\\times10^{-6}\\times4000$.","h":["$F=qE$.","Convert $\\mu$C to C.","Multiply."]},{"topic":"Negative charge","q":"Does a negative charge accelerate in the same direction as the electric field? Answer yes or no.","a":"no","alt":["No"],"ad":"No","sol":"A negative charge is pushed opposite to the field.","h":["Field direction is defined by positive charges.","Negative is opposite.","Opposite direction."]},{"topic":"Work","q":"A $2.0\\ \\mu\\text{C}$ charge moves through $150\\ \\text{V}$. Find the work done in millijoules.","a":"0.30","alt":["0.3"],"ad":"$0.30\\ \\text{mJ}$","sol":"$W=qV=2.0\\times10^{-6}(150)=3.0\\times10^{-4}\\ \\text{J}$.","h":["$W=qV$.","Convert $\\mu$C to C.","$3.0\\times10^{-4}\\ \\text{J}$."]},{"topic":"Energy","q":"A proton is accelerated through $1000\\ \\text{V}$. Find its kinetic energy gain in eV.","a":"1000","alt":[],"ad":"$1000\\ \\text{eV}$","sol":"One electron-volt per volt for a single elementary charge.","h":["Definition of eV.","$q=e$.","$qV$ in eV."]},{"topic":"Midpoint","q":"Two identical positive charges are $1.0\\ \\text{m}$ apart. What is the net field strength at the midpoint?","a":"0","alt":[],"ad":"$0$","sol":"The fields are equal and opposite.","h":["Fields point away from each charge.","Equal magnitude.","They cancel."]},{"topic":"Acceleration","q":"An electron in a $1.0\\times10^4\\ \\text{N C}^{-1}$ field accelerates at what rate, in units of $10^{15}\\ \\text{m s}^{-2}$ (2 decimal places)?","a":"1.76","alt":[],"ad":"$1.76\\times10^{15}\\ \\text{m s}^{-2}$","sol":"$a=\\frac{eE}{m}=\\frac{1.60\\times10^{-19}\\times10^4}{9.11\\times10^{-31}}=1.76\\times10^{15}$.","h":["$a=qE/m$.","Use the electron mass $9.11\\times10^{-31}$.","Compute."]},{"topic":"Field scaling","q":"The field strength at distance $r$ from a point charge is $E$. What is it at $2r$ (as a multiple of $E$)?","a":"0.25","alt":["1/4"],"ad":"$\\frac E4$","sol":"$E\\propto1/r^2$.","h":["Inverse square.","$(1/2)^2$.","Compute."]}],"comets":[{"topic":"Extension: Zero-field point","q":"Charges $+q$ and $+4q$ are $3.0\\ \\text{m}$ apart. How far from $+q$ (along the line between them) is the field zero (metres)?","a":"1.0","alt":["1"],"ad":"$1.0\\ \\text{m}$","sol":"$\\frac{kq}{x^2}=\\frac{4kq}{(3-x)^2}\\Rightarrow3-x=2x\\Rightarrow x=1.0$.","h":["Fields cancel: set magnitudes equal.","$\\frac1{x^2}=\\frac4{(3-x)^2}$.","Take square roots."]},{"topic":"Extension: Oil drop","q":"An oil drop of mass $1.6\\times10^{-15}\\ \\text{kg}$ is held stationary between plates $1.0\\ \\text{cm}$ apart at $490\\ \\text{V}$. How many elementary charges does it carry?","a":"2","alt":[],"ad":"$2$","sol":"$qE=mg\\Rightarrow q=\\frac{mgd}{V}=3.2\\times10^{-19}\\ \\text{C}=2e$.","h":["Balance: $qE=mg$.","$E=V/d$.","Divide $q$ by $e$."]}],"cards":[{"type":"def","topic":"Charge and Coulomb's law","f":"State Coulomb's law.","b":"$F=\\dfrac{kq_1q_2}{r^2}$ with $k=8.99\\times10^9\\ \\text{N m}^2\\text{C}^{-2}$. Like charges repel, unlike attract."},{"type":"def","topic":"Charge and Coulomb's law","f":"Charge on one electron.","b":"$-1.60\\times10^{-19}$ C (the elementary charge $e=1.60\\times10^{-19}$ C)."},{"type":"word","topic":"Charge and Coulomb's law","f":"Two identical spheres with $+6\\ \\mu$C and $-2\\ \\mu$C touch. Charge on each after?","b":"$+2\\ \\mu$C each (total $+4\\ \\mu$C shared equally)."},{"type":"word","topic":"Charge and Coulomb's law","f":"If the distance between two charges halves, the force...?","b":"Becomes 4 times larger."},{"type":"def","topic":"Electric field strength","f":"Electric field strength of a point charge.","b":"$E=\\dfrac{kq}{r^2}$, pointing away from a positive charge and toward a negative one."},{"type":"def","topic":"Electric field strength","f":"Rules for electric field lines.","b":"Start on positive, end on negative, never cross, closer together where the field is stronger."},{"type":"def","topic":"Electric field strength","f":"Direction of force on a negative charge in a field $E$.","b":"Opposite to the field direction."},{"type":"def","topic":"Uniform fields and charged particles","f":"Field between parallel plates.","b":"$E=\\dfrac{V}{d}$, uniform, from the positive plate to the negative plate."},{"type":"def","topic":"Uniform fields and charged particles","f":"Energy gained by a charge accelerated through potential difference $V$.","b":"$W=qV=\\tfrac12mv^2$ (from rest)."},{"type":"def","topic":"Uniform fields and charged particles","f":"What is an electron-volt?","b":"The energy gained by an electron moving through 1 V: $1\\ \\text{eV}=1.60\\times10^{-19}$ J."},{"type":"word","topic":"Uniform fields and charged particles","f":"Path of an electron fired between parallel plates, perpendicular to the field?","b":"A parabola, curving toward the positive plate (constant sideways acceleration)."},{"type":"word","topic":"Uniform fields and charged particles","f":"Speed of a proton accelerated from rest through 2000 V?","b":"$v=\\sqrt{2qV/m}\\approx6.2\\times10^5$ m/s."}],"hours":4},"ph3-c06":{"id":"ph3-c06","interactive":"lorentz","summary":"Moving charges and currents create and feel magnetic fields. This chapter covers magnetic field lines, fields of wires and solenoids, the force on a current-carrying conductor, the force on a moving charge, circular paths in magnetic fields, and the idea of the motor.","videos":[{"src":"F","title":"Magnetic fields and forces","url":"https://www.youtube.com/results?search_query=Flipping+Physics+magnetic+force+on+moving+charge+physics","kind":"search"},{"src":"K","title":"Magnetic force on a current-carrying wire","url":"https://www.youtube.com/results?search_query=Khan+Academy+magnetic+force+current+carrying+wire","kind":"search"},{"src":"V","title":"Veritasium: How magnets work","url":"https://www.youtube.com/results?search_query=Veritasium+magnets+how+they+work","kind":"search"}],"sections":[{"id":"ph3-c06-s1","code":"6.1","title":"Magnetic fields","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: magnetic fields and field lines","url":"https://www.youtube.com/results?search_query=Flipping+Physics+magnetic+fields+and+field+lines","kind":"search"}]},{"t":"p","x":"Magnetic field lines leave the **north** pole and enter the **south** pole outside a magnet, and they never cross. A magnetic field is measured in **tesla (T)**. **Right-hand grip rule for a straight wire:** thumb along the conventional current, fingers curl in the direction of the field. **Solenoid:** curl fingers in the direction of the current in the coils and the thumb points to the **north** end; the field inside is nearly uniform."},{"t":"p","x":"The field around a long wire is $B=\\dfrac{\\mu_0I}{2\\pi r}$ with $\\mu_0=4\\pi\\times10^{-7}\\ \\text{T m A}^{-1}$, so it falls with distance. A solenoid's field increases with current and with the number of turns per metre."},{"t":"warn","x":"Conventional current flows from **positive to negative**, opposite to electron flow. Use conventional current for every right-hand rule unless a question tells you otherwise."},{"t":"p","x":"**Right-hand grip rule.** Grip a wire with your right thumb in the direction of conventional current: your fingers curl in the direction of the magnetic field lines, which form circles around the wire. For a solenoid, curl your fingers in the direction of the current in the loops and your thumb points to the north end. Inside a long solenoid the field is strong and almost uniform."},{"t":"p","x":"**Showing direction in 2D.** A dot $\\odot$ means a field or current coming out of the page (the tip of an arrow); a cross $\\otimes$ means into the page (the tail feathers). Use these consistently in diagrams and hand-rule answers."},{"t":"ex","title":"Field near a wire","q":"A long straight wire carries 12 A. Find the magnetic field strength 3.0 cm from it.","s":["$B=\\dfrac{\\mu_0I}{2\\pi r}=\\dfrac{4\\pi\\times10^{-7}\\times12}{2\\pi\\times0.030}$."],"a":"$B=8.0\\times10^{-5}$ T"}]},{"id":"ph3-c06-s2","code":"6.2","title":"Force on a current-carrying conductor","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: force on a current carrying wire magnetic field","url":"https://www.youtube.com/results?search_query=Flipping+Physics+force+on+a+current+carrying+wire+magnetic+field","kind":"search"}]},{"t":"p","x":"A wire carrying current $I$ in a perpendicular field $B$ experiences a force $F=BIL\\sin\\theta$, where $\\theta$ is the angle between the current and the field. **Right-hand palm (or slap) rule:** fingers along the field, thumb along the conventional current, and the force comes out of the palm. The force is perpendicular to **both** the field and the current."},{"t":"key","x":"$$F=BIL\\sin\\theta$$"},{"t":"ex","title":"Wire in a field","q":"A $0.30\\ \\text{m}$ wire carries $5.0\\ \\text{A}$ at right angles to a $0.40\\ \\text{T}$ field. Find the force.","s":["$F=BIL=0.40(5.0)(0.30)=0.60\\ \\text{N}$."],"a":"$0.60\\ \\text{N}$"},{"t":"p","x":"**Parallel wires.** Currents in the **same** direction attract; opposite directions repel. This is how the ampere is defined."},{"t":"p","x":"**Right-hand palm (or slap) rule.** Point your fingers along the field $B$, your thumb along the conventional current $I$; the force on the wire comes out of your palm. Because $F=BIL\\sin\\theta$, the force is greatest when the wire is perpendicular to the field and zero when it is parallel."},{"t":"ex","title":"Worded problem: balancing a wire","q":"A horizontal 0.40 m wire of mass 12 g is in a horizontal magnetic field of 0.30 T perpendicular to it. What current makes the magnetic force exactly balance its weight?","s":["Need $BIL=mg\\Rightarrow I=\\dfrac{mg}{BL}=\\dfrac{0.012\\times9.8}{0.30\\times0.40}$."],"a":"$I\\approx0.98$ A (directed so the force is upward)."}]},{"id":"ph3-c06-s3","code":"6.3","title":"Force on a moving charge","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: force on a moving charge magnetic field","url":"https://www.youtube.com/results?search_query=Flipping+Physics+force+on+a+moving+charge+magnetic+field","kind":"search"}]},{"t":"p","x":"A charge $q$ moving at speed $v$ at angle $\\theta$ to a magnetic field feels $F=qvB\\sin\\theta$. The force is **perpendicular to the velocity**, so it does **no work** and changes direction, not speed. For a negative charge reverse the direction from the right-hand rule."},{"t":"key","x":"$$F=qvB\\sin\\theta,\\qquad r=\\frac{mv}{qB},\\qquad T=\\frac{2\\pi m}{qB}$$"},{"t":"ex","title":"Path of a proton","q":"A proton moves at $2.0\\times10^6\\ \\text{m s}^{-1}$ perpendicular to a $0.50\\ \\text{T}$ field. Find the radius of its circular path.","s":["$\\frac{mv^2}{r}=qvB\\Rightarrow r=\\frac{mv}{qB}=\\frac{(1.67\\times10^{-27})(2.0\\times10^6)}{(1.60\\times10^{-19})(0.50)}=4.2\\times10^{-2}\\ \\text{m}$."],"a":"$4.2\\ \\text{cm}$"},{"t":"int","name":"lorentz","cap":"Change the speed and the field strength and see the circular path of a proton."},{"t":"p","x":"**Velocity selector.** With electric and magnetic fields perpendicular to each other and to the velocity, a charge passes undeflected when $qE=qvB$, so $v=\\dfrac EB$."},{"t":"warn","x":"The magnetic force does **no work** on a moving charge. It cannot speed a particle up; only an electric field can."},{"t":"p","x":"**Why charges move in circles.** The magnetic force $qvB$ is always perpendicular to the velocity, so it changes direction but never speed. A constant-size force perpendicular to motion is exactly a centripetal force: $qvB=\\frac{mv^2}{r}$, giving $r=\\frac{mv}{qB}$. Heavier or faster particles make bigger circles; stronger fields make smaller ones. For a negative charge, reverse the force direction from the hand rule."},{"t":"ex","title":"Worded problem: electron in a field","q":"An electron moving at $3.0\\times10^6$ m/s enters a 2.0 mT field at right angles. Find the radius of its path and the time for one revolution.","s":["$r=\\dfrac{mv}{qB}=\\dfrac{9.11\\times10^{-31}\\times3.0\\times10^6}{1.60\\times10^{-19}\\times2.0\\times10^{-3}}\\approx8.5\\times10^{-3}$ m.","$T=\\dfrac{2\\pi m}{qB}=\\dfrac{2\\pi\\times9.11\\times10^{-31}}{1.60\\times10^{-19}\\times2.0\\times10^{-3}}\\approx1.8\\times10^{-8}$ s."],"a":"Radius about $8.5$ mm; period about $1.8\\times10^{-8}$ s."},{"t":"ex","title":"Velocity selector","q":"Crossed fields of $E=4.0\\times10^4\\ \\text{V m}^{-1}$ and $B=0.020$ T. What speed passes undeflected?","s":["Forces balance when $qE=qvB$, so $v=\\frac EB=\\frac{4.0\\times10^4}{0.020}$."],"a":"$2.0\\times10^6$ m/s (for any charge or mass)"}]},{"id":"ph3-c06-s4","code":"6.4","title":"Motors and applications","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: electric motor physics","url":"https://www.youtube.com/results?search_query=Flipping+Physics+electric+motor+physics","kind":"search"}]},{"t":"p","x":"In a **DC motor** a current-carrying coil sits in a magnetic field. The forces on opposite sides of the coil are in opposite directions, producing a **torque**. A **split-ring commutator** reverses the current every half turn so the coil keeps turning in the same direction. Increasing the current, the field strength, the number of turns or the coil area increases the torque."},{"t":"p","x":"**Mass spectrometer.** Ions are accelerated through a known potential, then enter a magnetic field. They move in circles of radius $r=\\frac{mv}{qB}$, so heavier ions travel on larger circles and are separated by mass."},{"t":"p","x":"**Keeping a motor turning.** In a DC motor, the forces on the two sides of the coil form a turning effect (torque). After half a turn the forces would reverse and stop the coil, so a **split-ring commutator** reverses the current in the coil every half turn, keeping the torque in the same rotational direction. Brushes make sliding contact with the commutator. Torque is greatest when the plane of the coil is parallel to the field."},{"t":"ex","title":"Worded problem: force on a motor coil side","q":"A rectangular motor coil has 50 turns; each side in the field is 0.060 m long and carries 1.5 A in a 0.20 T field. Find the force on one side when the coil is parallel to the field.","s":["$F=NBIL=50\\times0.20\\times1.5\\times0.060$."],"a":"$0.90$ N (with an equal and opposite force on the other side)"}]},{"id":"ph3-c06-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Hand rules.** Name the rule you use and state the three directions (field, current or velocity, force). Draw a 3D sketch using the dot and cross notation for out of and into the page."},{"t":"p","x":"**Common errors.** Using electron flow for a right-hand rule; forgetting $\\sin\\theta$; using $B$ in gauss instead of tesla; thinking the magnetic force changes speed."}]}],"quiz":[{"topic":"Wire force","q":"A $0.20\\ \\text{m}$ wire carries $4.0\\ \\text{A}$ at $30^\\circ$ to a $0.50\\ \\text{T}$ field. Find the force (N).","a":"0.20","alt":["0.2"],"ad":"$0.20\\ \\text{N}$","sol":"$F=BIL\\sin\\theta=0.50(4.0)(0.20)(0.50)$.","h":["$F=BIL\\sin\\theta$.","$\\sin30^\\circ=0.50$.","Multiply."]},{"topic":"Moving charge","q":"An electron moves at $5.0\\times10^6\\ \\text{m s}^{-1}$ perpendicular to a $0.20\\ \\text{T}$ field. Find the force in units of $10^{-13}\\ \\text{N}$.","a":"1.6","alt":[],"ad":"$1.6\\times10^{-13}\\ \\text{N}$","sol":"$F=qvB=1.60\\times10^{-19}(5.0\\times10^6)(0.20)=1.6\\times10^{-13}$.","h":["$F=qvB$.","Use $q=1.60\\times10^{-19}$.","Multiply."]},{"topic":"Parallel","q":"What is the magnetic force on a charge moving parallel to a field (N)?","a":"0","alt":[],"ad":"$0$","sol":"$\\sin0^\\circ=0$.","h":["$F=qvB\\sin\\theta$.","$\\theta=0$.","$\\sin0=0$."]},{"topic":"Radius","q":"A proton moves at $1.0\\times10^6\\ \\text{m s}^{-1}$ perpendicular to a $0.10\\ \\text{T}$ field. Find the radius in cm (1 decimal place).","a":"10.5","alt":["10.4"],"ad":"$10.5\\ \\text{cm}$","sol":"$r=\\frac{mv}{qB}=\\frac{1.6726219\\times10^{-27}(10^6)}{1.6\\times10^{-19}(0.10)}=0.1045\\ \\text{m}\\approx10.5\\ \\text{cm}$. (Rounding $m_p$ to $1.67\\times10^{-27}$ gives $10.4$, which is also accepted.)","h":["$r=mv/(qB)$.","Use $m_p=1.6726219\\times10^{-27}$ kg from the data book.","Convert metres to cm."]},{"topic":"Speed doubling","q":"If the speed of a charge in a magnetic field doubles, by what factor does the radius change?","a":"2","alt":[],"ad":"$2$","sol":"$r\\propto v$.","h":["$r=mv/qB$.","Radius is proportional to $v$.","Factor 2."]},{"topic":"Velocity selector","q":"$E=1.0\\times10^4\\ \\text{V m}^{-1}$ and $B=0.050\\ \\text{T}$. Find the selected speed in units of $10^5\\ \\text{m s}^{-1}$.","a":"2.0","alt":["2"],"ad":"$2.0\\times10^5\\ \\text{m s}^{-1}$","sol":"$v=E/B=\\frac{1.0\\times10^4}{0.050}$.","h":["Forces balance: $qE=qvB$.","$v=E/B$.","Divide."]},{"topic":"Solenoid","q":"If the current in a solenoid is doubled, by what factor does its field change?","a":"2","alt":[],"ad":"$2$","sol":"$B\\propto I$.","h":["Field is proportional to current.","Double current.","Factor 2."]},{"topic":"Parallel wires","q":"Do two parallel wires carrying current in the same direction attract? Answer yes or no.","a":"yes","alt":["Yes"],"ad":"Yes","sol":"Same-direction currents attract.","h":["Same direction currents.","Fields add between them... they pull together.","Attract."]},{"topic":"Period","q":"Find the cyclotron period of a proton in a $1.0\\ \\text{T}$ field in nanoseconds (1 decimal place).","a":"65.7","alt":["65.6"],"ad":"$65.7\\ \\text{ns}$","sol":"$T=\\frac{2\\pi m}{qB}=\\frac{2\\pi(1.6726219\\times10^{-27})}{1.6\\times10^{-19}(1.0)}=6.57\\times10^{-8}\\ \\text{s}$. (Rounding $m_p$ gives $65.6$, also accepted.)","h":["$T=2\\pi m/qB$.","Speed cancels.","Convert to ns."]},{"topic":"Work","q":"How much work does a magnetic field do on a moving charge in one revolution (J)?","a":"0","alt":[],"ad":"$0$","sol":"Force is perpendicular to motion.","h":["$W=Fd\\cos\\theta$.","The angle is $90^\\circ$.","Zero."]}],"comets":[{"topic":"Extension: Isotopes","q":"Two ions with the same charge and speed enter the same magnetic field. One has mass $4\\ \\text{u}$ and the other $2\\ \\text{u}$. Find the ratio of the larger radius to the smaller.","a":"2","alt":[],"ad":"$2$","sol":"$r\\propto m$.","h":["$r=mv/qB$.","Same $q$, $v$, $B$.","Ratio of masses."]}],"cards":[{"type":"def","topic":"Magnetic fields","f":"Right-hand grip rule for a straight wire.","b":"Thumb along the conventional current; curled fingers show the direction of the circular field lines."},{"type":"def","topic":"Magnetic fields","f":"Field around a long straight wire.","b":"$B=\\dfrac{\\mu_0I}{2\\pi r}$, with $\\mu_0=4\\pi\\times10^{-7}\\ \\text{T m A}^{-1}$."},{"type":"def","topic":"Magnetic fields","f":"Meaning of $\\odot$ and $\\otimes$.","b":"$\\odot$: out of the page. $\\otimes$: into the page."},{"type":"def","topic":"Force on a current-carrying conductor","f":"Force on a current-carrying wire in a magnetic field.","b":"$F=BIL\\sin\\theta$, perpendicular to both the wire and the field."},{"type":"def","topic":"Force on a current-carrying conductor","f":"When is the force on a current-carrying wire zero?","b":"When the wire is parallel (or anti-parallel) to the field ($\\sin\\theta=0$)."},{"type":"word","topic":"Force on a current-carrying conductor","f":"Two parallel wires carry current in the same direction. Do they attract or repel?","b":"Attract."},{"type":"def","topic":"Force on a moving charge","f":"Force on a charge moving in a magnetic field.","b":"$F=qvB\\sin\\theta$, perpendicular to both $v$ and $B$."},{"type":"def","topic":"Force on a moving charge","f":"Radius of a charged particle's circular path in a magnetic field.","b":"$r=\\dfrac{mv}{qB}$"},{"type":"def","topic":"Force on a moving charge","f":"Why does a magnetic field do no work on a moving charge?","b":"The force is always perpendicular to the velocity, so it changes direction only, not speed or kinetic energy."},{"type":"word","topic":"Force on a moving charge","f":"Speed that passes undeflected through crossed $E$ and $B$ fields?","b":"$v=\\frac EB$"},{"type":"def","topic":"Motors and applications","f":"Role of the split-ring commutator in a DC motor.","b":"It reverses the current in the coil every half turn so the torque keeps acting in the same direction."},{"type":"def","topic":"Motors and applications","f":"Position of a motor coil for maximum torque.","b":"When the plane of the coil is parallel to the magnetic field."},{"type":"word","topic":"Motors and applications","f":"How does a mass spectrometer separate ions?","b":"Ions with the same speed and charge follow circles of radius $r=\\frac{mv}{qB}$, so heavier ions travel on larger circles and land in different
