um: Gravity visualized","url":"https://www.youtube.com/results?search_query=Veritasium+gravity+orbits","kind":"search"}],"sections":[{"id":"ph3-c04-s1","code":"4.1","title":"Newton's law of gravitation","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: Newton law of gravitation","url":"https://www.youtube.com/results?search_query=Flipping+Physics+Newton+law+of+gravitation","kind":"search"}]},{"t":"p","x":"Any two masses attract each other with equal and opposite forces along the line joining their centres. The force depends on the product of the masses and falls with the **square of the distance** between centres. $G=6.67\\times10^{-11}\\ \\text{N m}^2\\text{kg}^{-2}$."},{"t":"key","x":"$$F=\\frac{Gm_1m_2}{r^2}$$"},{"t":"ex","title":"Two cars","q":"Two $1.0\\times10^3\\ \\text{kg}$ cars are $2.0\\ \\text{m}$ apart. Find the gravitational force between them.","s":["$F=\\frac{6.67\\times10^{-11}(1000)(1000)}{2.0^2}=1.67\\times10^{-5}\\ \\text{N}$."],"a":"$1.67\\times10^{-5}\\ \\text{N}$, far too small to notice."},{"t":"warn","x":"$r$ is the distance between **centres of mass**, not surfaces. For an object at height $h$ above a planet of radius $R$, use $r=R+h$."}]},{"id":"ph3-c04-s2","code":"4.2","title":"Gravitational field strength","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: gravitational field strength","url":"https://www.youtube.com/results?search_query=Flipping+Physics+gravitational+field+strength","kind":"search"}]},{"t":"p","x":"The **gravitational field strength** is the force per unit mass: $g=\\dfrac{F}{m}=\\dfrac{GM}{r^2}$ (in $\\text{N kg}^{-1}$, the same as $\\text{m s}^{-2}$). It points toward the centre of the mass, and **doubling the distance divides it by 4**. Near Earth's surface $g\\approx9.8\\ \\text{N kg}^{-1}$, which can be confirmed from $G$, $M_E=5.97\\times10^{24}\\ \\text{kg}$ and $R_E=6.37\\times10^6\\ \\text{m}$."},{"t":"ex","title":"Field strength","q":"Find $g$ at the surface of Mars ($M=6.4\\times10^{23}\\ \\text{kg}$, $R=3.4\\times10^6\\ \\text{m}$).","s":["$g=\\frac{GM}{R^2}=\\frac{6.67\\times10^{-11}(6.4\\times10^{23})}{(3.4\\times10^6)^2}=3.69\\ \\text{N kg}^{-1}$."],"a":"$3.69\\ \\text{N kg}^{-1}$"},{"t":"ex","title":"At altitude","q":"Find $g$ at $400\\ \\text{km}$ above Earth's surface.","s":["$r=6.37\\times10^6+4.0\\times10^5=6.77\\times10^6\\ \\text{m}$.","$g=\\frac{6.67\\times10^{-11}(5.97\\times10^{24})}{(6.77\\times10^6)^2}=8.69\\ \\text{N kg}^{-1}$."],"a":"$8.69\\ \\text{N kg}^{-1}$, only slightly less than at the surface."},{"t":"int","name":"orbit","cap":"Move the orbital radius. See how field strength, speed and period change with radius."}]},{"id":"ph3-c04-s3","code":"4.3","title":"Orbits and Kepler's laws","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: Kepler laws orbits satellites","url":"https://www.youtube.com/results?search_query=Flipping+Physics+Kepler+laws+orbits+satellites","kind":"search"}]},{"t":"p","x":"For a satellite in a circular orbit, **gravity is the centripetal force**: $\\dfrac{GMm}{r^2}=\\dfrac{mv^2}{r}$ so $v=\\sqrt{\\dfrac{GM}{r}}$ (independent of the satellite's mass). With $v=\\frac{2\\pi r}{T}$ this gives **Kepler's third law**: $\\dfrac{T^2}{r^3}=\\dfrac{4\\pi^2}{GM}$, a constant for all orbits around the same central mass."},{"t":"key","x":"$$v=\\sqrt{\\frac{GM}{r}},\\qquad \\frac{r^3}{T^2}=\\frac{GM}{4\\pi^2}$$"},{"t":"ex","title":"Space station","q":"Find the orbital speed and period of a satellite $400\\ \\text{km}$ above Earth.","s":["$r=6.77\\times10^6$; $v=\\sqrt{\\frac{GM}{r}}=\\sqrt{\\frac{3.98\\times10^{14}}{6.77\\times10^6}}=7.67\\times10^3\\ \\text{m s}^{-1}$.","$T=\\frac{2\\pi r}{v}=5.55\\times10^3\\ \\text{s}=92.4\\ \\text{min}$."],"a":"$7.67\\ \\text{km s}^{-1}$ and $92\\ \\text{min}$."},{"t":"p","x":"**Kepler's laws.** (1) Orbits are ellipses with the central body at one focus. (2) A line from the central body sweeps equal areas in equal times, so orbiting bodies move fastest when closest. (3) $T^2\\propto r^3$. Higher orbits are **slower** and take **longer**."}]},{"id":"ph3-c04-s4","code":"4.4","title":"Geostationary satellites and weightlessness","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: geostationary satellite weightlessness","url":"https://www.youtube.com/results?search_query=Flipping+Physics+geostationary+satellite+weightlessness","kind":"search"}]},{"t":"p","x":"A **geostationary** satellite has a period of 24 hours, orbits above the equator in the same direction as Earth's rotation, and so stays above one point. Its radius is found from $r^3=\\frac{GMT^2}{4\\pi^2}\\approx4.22\\times10^7\\ \\text{m}$ from Earth's centre, about $3.59\\times10^7\\ \\text{m}$ above the surface."},{"t":"p","x":"**Apparent weightlessness.** An astronaut in orbit is in **free fall** around Earth. Gravity still acts (about $90\\%$ of surface value at ISS altitude), but there is no contact force from the floor, so no sensation of weight."},{"t":"warn","x":"Orbiting astronauts do not float because gravity is absent. They float because they and the spacecraft fall together."}]},{"id":"ph3-c04-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Constants and rounding.** Use $G=6.67\\times10^{-11}$, $M_E=5.97\\times10^{24}\\ \\text{kg}$, $R_E=6.37\\times10^6\\ \\text{m}$. Keep full precision until the end. Convert km to m before substituting."},{"t":"p","x":"**Proportional reasoning.** Many questions are asked as ratios. If $r$ doubles, $F$ and $g$ become $\\frac14$, $v$ becomes $\\frac1{\\sqrt2}$ and $T$ becomes $2\\sqrt2$ times larger. Writing the proportion with symbols is quicker and safer than recalculating."}]}],"quiz":[{"topic":"Doubling","q":"If the distance between two masses doubles, by what factor does the gravitational force change (as a decimal)?","a":"0.25","alt":["1/4"],"ad":"$\\frac14$","sol":"$F\\propto1/r^2$.","h":["Inverse square law.","$(1/2)^2$.","Compute."]},{"topic":"Field at 2R","q":"Find $g$ at a distance $2R_E$ from Earth's centre ($\\text{N kg}^{-1}$), using $g=9.8$ at the surface.","a":"2.45","alt":[],"ad":"$2.45\\ \\text{N kg}^{-1}$","sol":"$g\\propto1/r^2$, so $9.8/4$.","h":["Distance doubles.","Field falls by a factor of 4.","Divide 9.8 by 4."]},{"topic":"Mars","q":"Find $g$ at the surface of a planet with $M=6.4\\times10^{23}\\ \\text{kg}$ and $R=3.4\\times10^6\\ \\text{m}$ ($\\text{N kg}^{-1}$, 2 decimal places).","a":"3.69","alt":[],"ad":"$3.69\\ \\text{N kg}^{-1}$","sol":"$g=\\frac{GM}{R^2}=3.69$.","h":["$g=GM/R^2$.","Square the radius.","Compute."]},{"topic":"Weight","q":"Find the weight of a $60\\ \\text{kg}$ person where $g=3.7\\ \\text{N kg}^{-1}$ (N).","a":"222","alt":[],"ad":"$222\\ \\text{N}$","sol":"$W=mg=60(3.7)$.","h":["$W=mg$.","$60\\times3.7$.","Compute."]},{"topic":"Orbital speed","q":"A satellite orbits at $r=7.0\\times10^6\\ \\text{m}$ from Earth's centre. Find its speed in $\\text{km s}^{-1}$ (1 decimal place).","a":"7.5","alt":[],"ad":"$7.5\\ \\text{km s}^{-1}$","sol":"$v=\\sqrt{GM/r}=\\sqrt{3.98\\times10^{14}/7.0\\times10^6}=7.54\\times10^3$.","h":["Gravity is the centripetal force.","$v=\\sqrt{GM/r}$.","Convert to km/s."]},{"topic":"Period","q":"A satellite orbits at $r=7.0\\times10^6\\ \\text{m}$ with speed $7.54\\times10^3\\ \\text{m s}^{-1}$. Find its period in minutes (1 decimal place).","a":"97.2","alt":[],"ad":"$97.2\\ \\text{min}$","sol":"$T=\\frac{2\\pi r}{v}=5.83\\times10^3\\ \\text{s}=97.2\\ \\text{min}$.","h":["$T=2\\pi r/v$.","$2\\pi\\times7.0\\times10^6=4.40\\times10^7$.","Divide by $v$ and convert."]},{"topic":"Kepler","q":"If an orbital radius is multiplied by 4, by what factor is the period multiplied?","a":"8","alt":[],"ad":"$8$","sol":"$T\\propto r^{3/2}$, so $4^{3/2}=8$.","h":["$T^2\\propto r^3$.","$T\\propto r^{1.5}$.","$4^{1.5}$."]},{"topic":"Weightless?","q":"An astronaut in a stable orbit has no gravity acting on them. True or false?","a":"false","alt":["False"],"ad":"False","sol":"Gravity acts and provides the centripetal force; they are in free fall.","h":["What keeps the satellite in orbit?","Gravity is the centripetal force.","So it is not zero."]},{"topic":"Geostationary period","q":"What is the period of a geostationary satellite in hours?","a":"24","alt":[],"ad":"$24\\ \\text{h}$","sol":"It matches Earth's rotation.","h":["Stays above a point.","Matches rotation.","One day."]},{"topic":"Far field","q":"Find $g$ at a height $3R_E$ above Earth's surface (so $r=4R_E$), in $\\text{N kg}^{-1}$ (2 decimal places).","a":"0.61","alt":[],"ad":"$0.61\\ \\text{N kg}^{-1}$","sol":"$9.8/16=0.6125$.","h":["$r=4R_E$.","Field falls with $r^2$.","$9.8/16$."]}],"comets":[{"topic":"Extension: Period ratio","q":"Satellite A has a period 8 times that of satellite B around the same planet. Find $r_A/r_B$.","a":"4","alt":[],"ad":"$4$","sol":"$r^3\\propto T^2$, so $r\\propto T^{2/3}=8^{2/3}=4$.","h":["$T^2\\propto r^3$.","$r\\propto T^{2/3}$.","$8^{2/3}=4$."]},{"topic":"Extension: Planet scaling","q":"Two planets have the same density but one has twice the radius. Find the ratio of surface $g$ (large to small).","a":"2","alt":[],"ad":"$2$","sol":"$M\\propto R^3$, so $g=\\frac{GM}{R^2}\\propto R$.","h":["Same density means $M\\propto R^3$.","$g=GM/R^2$.","$g\\propto R$."]}],"hours":4.5},"ph3-c05":{"id":"ph3-c05","interactive":"none","summary":"Electric charges exert forces on each other through electric fields. This chapter covers Coulomb's law, electric field strength, field lines, uniform fields between parallel plates, and the motion and energy of charges in a field.","videos":[{"src":"F","title":"Coulomb's law and electric fields","url":"https://www.youtube.com/results?search_query=Flipping+Physics+Coulomb+law+electric+field+physics","kind":"search"},{"src":"K","title":"Electric field and potential","url":"https://www.youtube.com/results?search_query=Khan+Academy+electric+field+electric+potential+physics","kind":"search"},{"src":"V","title":"Veritasium: Electric fields","url":"https://www.youtube.com/results?search_query=Veritasium+electricity+energy+flows","kind":"search"}],"sections":[{"id":"ph3-c05-s1","code":"5.1","title":"Charge and Coulomb's law","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: Coulomb law electric charge","url":"https://www.youtube.com/results?search_query=Flipping+Physics+Coulomb+law+electric+charge","kind":"search"}]},{"t":"p","x":"There are two kinds of charge. **Like charges repel and unlike charges attract.** Charge is measured in coulombs; the elementary charge is $1.6\\times10^{-19}\\ \\text{C}$ (the data book lists the electron's charge as $e=-1.6\\times10^{-19}\\ \\text{C}$). **Coulomb's law** gives the force between two point charges, with $k=9\\times10^9\\ \\text{N m}^2\\text{C}^{-2}$ (the value in the QCAA data book)."},{"t":"key","x":"$$F=\\frac{kq_1q_2}{r^2}$$"},{"t":"ex","title":"Two charges","q":"Charges $+3.0\\ \\mu\\text{C}$ and $-2.0\\ \\mu\\text{C}$ are $0.20\\ \\text{m}$ apart. Find the force between them.","s":["$F=\\frac{(9\\times10^9)(3.0\\times10^{-6})(2.0\\times10^{-6})}{0.20^2}=1.35\\ \\text{N}$.","Opposite charges, so it is attractive."],"a":"$1.35\\ \\text{N}$ attractive."},{"t":"warn","x":"Use the **magnitudes** of the charges to find the size of the force, then decide the direction from the signs. Convert $\\mu\\text{C}$ to C ($\\times10^{-6}$) before substituting."}]},{"id":"ph3-c05-s2","code":"5.2","title":"Electric field strength","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: electric field strength","url":"https://www.youtube.com/results?search_query=Flipping+Physics+electric+field+strength","kind":"search"}]},{"t":"p","x":"The **electric field strength** at a point is the force per unit **positive** charge: $E=\\dfrac{F}{q}$ (units $\\text{N C}^{-1}=\\text{V m}^{-1}$). For a point charge $Q$: $E=\\dfrac{kQ}{r^2}$. The field points **away from positive** charges and **toward negative** charges. Field lines show direction; closer lines mean a stronger field."},{"t":"ex","title":"Point charge","q":"Find the field strength $0.50\\ \\text{m}$ from a $+4.0\\ \\mu\\text{C}$ point charge.","s":["$E=\\frac{(9\\times10^9)(4.0\\times10^{-6})}{0.50^2}=1.44\\times10^5\\ \\text{N C}^{-1}$."],"a":"$1.44\\times10^5\\ \\text{N C}^{-1}$ directed away from the charge."},{"t":"p","x":"**Superposition.** The total field is the **vector sum** of the fields from each charge. Between two equal like charges the fields cancel at the midpoint."},{"t":"warn","x":"A **negative** charge in a field feels a force **opposite** to the field direction."}]},{"id":"ph3-c05-s3","code":"5.3","title":"Uniform fields and charged particles","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: charged particle in uniform electric field","url":"https://www.youtube.com/results?search_query=Flipping+Physics+charged+particle+in+uniform+electric+field","kind":"search"}]},{"t":"p","x":"Between two parallel plates with potential difference $V$ and separation $d$, the field is **uniform**: $E=\\dfrac Vd$. A charge $q$ feels force $F=qE$ and acceleration $a=\\dfrac{qE}{m}$. Starting from rest, work done by the field becomes kinetic energy: $qV=\\tfrac12mv^2$."},{"t":"key","x":"$$E=\\frac Vd,\\qquad F=qE,\\qquad qV=\\tfrac12mv^2$$"},{"t":"ex","title":"Electron in a field","q":"An electron is in a uniform field of $2.5\\times10^4\\ \\text{V m}^{-1}$. Find its force and acceleration.","s":["$F=qE=(1.60\\times10^{-19})(2.5\\times10^4)=4.0\\times10^{-15}\\ \\text{N}$.","$a=\\frac Fm=\\frac{4.0\\times10^{-15}}{9.11\\times10^{-31}}=4.4\\times10^{15}\\ \\text{m s}^{-2}$."],"a":"$4.0\\times10^{-15}\\ \\text{N}$ and $4.4\\times10^{15}\\ \\text{m s}^{-2}$."},{"t":"ex","title":"Speed from potential","q":"An electron accelerates from rest through $500\\ \\text{V}$. Find its final speed.","s":["$v=\\sqrt{\\frac{2qV}{m}}=\\sqrt{\\frac{2(1.60\\times10^{-19})(500)}{9.11\\times10^{-31}}}=1.33\\times10^7\\ \\text{m s}^{-1}$."],"a":"$1.33\\times10^7\\ \\text{m s}^{-1}$"},{"t":"p","x":"**Electron-volt.** An electron accelerated through $1\\ \\text{V}$ gains $1\\ \\text{eV}=1.60\\times10^{-19}\\ \\text{J}$. A proton accelerated through $1000\\ \\text{V}$ gains $1000\\ \\text{eV}$."}]},{"id":"ph3-c05-s4","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Gravity versus electric force.** For an electron the electric force is enormously larger than its weight, so ignore gravity unless a particle is stationary (such as an oil drop held in balance). When stationary, $qE=mg$."},{"t":"p","x":"**Direction answers.** Describe field directions with words such as \"toward the negative plate\" and always state the sign of the charge when explaining which way a force acts."}]}],"quiz":[{"topic":"Field strength","q":"A force of $6.0\\times10^{-3}\\ \\text{N}$ acts on $2.0\\ \\mu\\text{C}$. Find $E$ ($\\text{N C}^{-1}$).","a":"3000","alt":["3.0e3","3.0x10^3"],"ad":"$3.0\\times10^3\\ \\text{N C}^{-1}$","sol":"$E=F/q=\\frac{6.0\\times10^{-3}}{2.0\\times10^{-6}}$.","h":["$E=F/q$.","Convert $\\mu$C to C.","Divide."]},{"topic":"Plates","q":"$240\\ \\text{V}$ is applied across plates $0.030\\ \\text{m}$ apart. Find $E$ ($\\text{V m}^{-1}$).","a":"8000","alt":[],"ad":"$8.0\\times10^3\\ \\text{V m}^{-1}$","sol":"$E=V/d=240/0.030$.","h":["$E=V/d$.","$d=0.030$.","Divide."]},{"topic":"Distance","q":"If the distance between two point charges doubles, by what factor does the electric force change (decimal)?","a":"0.25","alt":["1/4"],"ad":"$\\frac14$","sol":"Inverse square.","h":["$F\\propto1/r^2$.","$(1/2)^2$.","Compute."]},{"topic":"Force","q":"A $5.0\\ \\mu\\text{C}$ charge is in a field of $4000\\ \\text{N C}^{-1}$. Find the force (N).","a":"0.020","alt":["0.02"],"ad":"$0.020\\ \\text{N}$","sol":"$F=qE=5.0\\times10^{-6}\\times4000$.","h":["$F=qE$.","Convert $\\mu$C to C.","Multiply."]},{"topic":"Negative charge","q":"Does a negative charge accelerate in the same direction as the electric field? Answer yes or no.","a":"no","alt":["No"],"ad":"No","sol":"A negative charge is pushed opposite to the field.","h":["Field direction is defined by positive charges.","Negative is opposite.","Opposite direction."]},{"topic":"Work","q":"A $2.0\\ \\mu\\text{C}$ charge moves through $150\\ \\text{V}$. Find the work done in millijoules.","a":"0.30","alt":["0.3"],"ad":"$0.30\\ \\text{mJ}$","sol":"$W=qV=2.0\\times10^{-6}(150)=3.0\\times10^{-4}\\ \\text{J}$.","h":["$W=qV$.","Convert $\\mu$C to C.","$3.0\\times10^{-4}\\ \\text{J}$."]},{"topic":"Energy","q":"A proton is accelerated through $1000\\ \\text{V}$. Find its kinetic energy gain in eV.","a":"1000","alt":[],"ad":"$1000\\ \\text{eV}$","sol":"One electron-volt per volt for a single elementary charge.","h":["Definition of eV.","$q=e$.","$qV$ in eV."]},{"topic":"Midpoint","q":"Two identical positive charges are $1.0\\ \\text{m}$ apart. What is the net field strength at the midpoint?","a":"0","alt":[],"ad":"$0$","sol":"The fields are equal and opposite.","h":["Fields point away from each charge.","Equal magnitude.","They cancel."]},{"topic":"Acceleration","q":"An electron in a $1.0\\times10^4\\ \\text{N C}^{-1}$ field accelerates at what rate, in units of $10^{15}\\ \\text{m s}^{-2}$ (2 decimal places)?","a":"1.76","alt":[],"ad":"$1.76\\times10^{15}\\ \\text{m s}^{-2}$","sol":"$a=\\frac{eE}{m}=\\frac{1.60\\times10^{-19}\\times10^4}{9.11\\times10^{-31}}=1.76\\times10^{15}$.","h":["$a=qE/m$.","Use the electron mass $9.11\\times10^{-31}$.","Compute."]},{"topic":"Field scaling","q":"The field strength at distance $r$ from a point charge is $E$. What is it at $2r$ (as a multiple of $E$)?","a":"0.25","alt":["1/4"],"ad":"$\\frac E4$","sol":"$E\\propto1/r^2$.","h":["Inverse square.","$(1/2)^2$.","Compute."]}],"comets":[{"topic":"Extension: Zero-field point","q":"Charges $+q$ and $+4q$ are $3.0\\ \\text{m}$ apart. How far from $+q$ (along the line between them) is the field zero (metres)?","a":"1.0","alt":["1"],"ad":"$1.0\\ \\text{m}$","sol":"$\\frac{kq}{x^2}=\\frac{4kq}{(3-x)^2}\\Rightarrow3-x=2x\\Rightarrow x=1.0$.","h":["Fields cancel: set magnitudes equal.","$\\frac1{x^2}=\\frac4{(3-x)^2}$.","Take square roots."]},{"topic":"Extension: Oil drop","q":"An oil drop of mass $1.6\\times10^{-15}\\ \\text{kg}$ is held stationary between plates $1.0\\ \\text{cm}$ apart at $490\\ \\text{V}$. How many elementary charges does it carry?","a":"2","alt":[],"ad":"$2$","sol":"$qE=mg\\Rightarrow q=\\frac{mgd}{V}=3.2\\times10^{-19}\\ \\text{C}=2e$.","h":["Balance: $qE=mg$.","$E=V/d$.","Divide $q$ by $e$."]}],"hours":4},"ph3-c06":{"id":"ph3-c06","interactive":"lorentz","summary":"Moving charges and currents create and feel magnetic fields. This chapter covers magnetic field lines, fields of wires and solenoids, the force on a current-carrying conductor, the force on a moving charge, circular paths in magnetic fields, and the idea of the motor.","videos":[{"src":"F","title":"Magnetic fields and forces","url":"https://www.youtube.com/results?search_query=Flipping+Physics+magnetic+force+on+moving+charge+physics","kind":"search"},{"src":"K","title":"Magnetic force on a current-carrying wire","url":"https://www.youtube.com/results?search_query=Khan+Academy+magnetic+force+current+carrying+wire","kind":"search"},{"src":"V","title":"Veritasium: How magnets work","url":"https://www.youtube.com/results?search_query=Veritasium+magnets+how+they+work","kind":"search"}],"sections":[{"id":"ph3-c06-s1","code":"6.1","title":"Magnetic fields","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: magnetic fields and field lines","url":"https://www.youtube.com/results?search_query=Flipping+Physics+magnetic+fields+and+field+lines","kind":"search"}]},{"t":"p","x":"Magnetic field lines leave the **north** pole and enter the **south** pole outside a magnet, and they never cross. A magnetic field is measured in **tesla (T)**. **Right-hand grip rule for a straight wire:** thumb along the conventional current, fingers curl in the direction of the field. **Solenoid:** curl fingers in the direction of the current in the coils and the thumb points to the **north** end; the field inside is nearly uniform."},{"t":"p","x":"The field around a long wire is $B=\\dfrac{\\mu_0I}{2\\pi r}$ with $\\mu_0=4\\pi\\times10^{-7}\\ \\text{T m A}^{-1}$, so it falls with distance. A solenoid's field increases with current and with the number of turns per metre."},{"t":"warn","x":"Conventional current flows from **positive to negative**, opposite to electron flow. Use conventional current for every right-hand rule unless a question tells you otherwise."}]},{"id":"ph3-c06-s2","code":"6.2","title":"Force on a current-carrying conductor","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: force on a current carrying wire magnetic field","url":"https://www.youtube.com/results?search_query=Flipping+Physics+force+on+a+current+carrying+wire+magnetic+field","kind":"search"}]},{"t":"p","x":"A wire carrying current $I$ in a perpendicular field $B$ experiences a force $F=BIL\\sin\\theta$, where $\\theta$ is the angle between the current and the field. **Right-hand palm (or slap) rule:** fingers along the field, thumb along the conventional current, and the force comes out of the palm. The force is perpendicular to **both** the field and the current."},{"t":"key","x":"$$F=BIL\\sin\\theta$$"},{"t":"ex","title":"Wire in a field","q":"A $0.30\\ \\text{m}$ wire carries $5.0\\ \\text{A}$ at right angles to a $0.40\\ \\text{T}$ field. Find the force.","s":["$F=BIL=0.40(5.0)(0.30)=0.60\\ \\text{N}$."],"a":"$0.60\\ \\text{N}$"},{"t":"p","x":"**Parallel wires.** Currents in the **same** direction attract; opposite directions repel. This is how the ampere is defined."}]},{"id":"ph3-c06-s3","code":"6.3","title":"Force on a moving charge","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: force on a moving charge magnetic field","url":"https://www.youtube.com/results?search_query=Flipping+Physics+force+on+a+moving+charge+magnetic+field","kind":"search"}]},{"t":"p","x":"A charge $q$ moving at speed $v$ at angle $\\theta$ to a magnetic field feels $F=qvB\\sin\\theta$. The force is **perpendicular to the velocity**, so it does **no work** and changes direction, not speed. For a negative charge reverse the direction from the right-hand rule."},{"t":"key","x":"$$F=qvB\\sin\\theta,\\qquad r=\\frac{mv}{qB},\\qquad T=\\frac{2\\pi m}{qB}$$"},{"t":"ex","title":"Path of a proton","q":"A proton moves at $2.0\\times10^6\\ \\text{m s}^{-1}$ perpendicular to a $0.50\\ \\text{T}$ field. Find the radius of its circular path.","s":["$\\frac{mv^2}{r}=qvB\\Rightarrow r=\\frac{mv}{qB}=\\frac{(1.67\\times10^{-27})(2.0\\times10^6)}{(1.60\\times10^{-19})(0.50)}=4.2\\times10^{-2}\\ \\text{m}$."],"a":"$4.2\\ \\text{cm}$"},{"t":"int","name":"lorentz","cap":"Change the speed and the field strength and see the circular path of a proton."},{"t":"p","x":"**Velocity selector.** With electric and magnetic fields perpendicular to each other and to the velocity, a charge passes undeflected when $qE=qvB$, so $v=\\dfrac EB$."},{"t":"warn","x":"The magnetic force does **no work** on a moving charge. It cannot speed a particle up; only an electric field can."}]},{"id":"ph3-c06-s4","code":"6.4","title":"Motors and applications","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: electric motor physics","url":"https://www.youtube.com/results?search_query=Flipping+Physics+electric+motor+physics","kind":"search"}]},{"t":"p","x":"In a **DC motor** a current-carrying coil sits in a magnetic field. The forces on opposite sides of the coil are in opposite directions, producing a **torque**. A **split-ring commutator** reverses the current every half turn so the coil keeps turning in the same direction. Increasing the current, the field strength, the number of turns or the coil area increases the torque."},{"t":"p","x":"**Mass spectrometer.** Ions are accelerated through a known potential, then enter a magnetic field. They move in circles of radius $r=\\frac{mv}{qB}$, so heavier ions travel on larger circles and are separated by mass."}]},{"id":"ph3-c06-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Hand rules.** Name the rule you use and state the three directions (field, current or velocity, force). Draw a 3D sketch using the dot and cross notation for out of and into the page."},{"t":"p","x":"**Common errors.** Using electron flow for a right-hand rule; forgetting $\\sin\\theta$; using $B$ in gauss instead of tesla; thinking the magnetic force changes speed."}]}],"quiz":[{"topic":"Wire force","q":"A $0.20\\ \\text{m}$ wire carries $4.0\\ \\text{A}$ at $30^\\circ$ to a $0.50\\ \\text{T}$ field. Find the force (N).","a":"0.20","alt":["0.2"],"ad":"$0.20\\ \\text{N}$","sol":"$F=BIL\\sin\\theta=0.50(4.0)(0.20)(0.50)$.","h":["$F=BIL\\sin\\theta$.","$\\sin30^\\circ=0.50$.","Multiply."]},{"topic":"Moving charge","q":"An electron moves at $5.0\\times10^6\\ \\text{m s}^{-1}$ perpendicular to a $0.20\\ \\text{T}$ field. Find the force in units of $10^{-13}\\ \\text{N}$.","a":"1.6","alt":[],"ad":"$1.6\\times10^{-13}\\ \\text{N}$","sol":"$F=qvB=1.60\\times10^{-19}(5.0\\times10^6)(0.20)=1.6\\times10^{-13}$.","h":["$F=qvB$.","Use $q=1.60\\times10^{-19}$.","Multiply."]},{"topic":"Parallel","q":"What is the magnetic force on a charge moving parallel to a field (N)?","a":"0","alt":[],"ad":"$0$","sol":"$\\sin0^\\circ=0$.","h":["$F=qvB\\sin\\theta$.","$\\theta=0$.","$\\sin0=0$."]},{"topic":"Radius","q":"A proton moves at $1.0\\times10^6\\ \\text{m s}^{-1}$ perpendicular to a $0.10\\ \\text{T}$ field. Find the radius in cm (1 decimal place).","a":"10.5","alt":["10.4"],"ad":"$10.5\\ \\text{cm}$","sol":"$r=\\frac{mv}{qB}=\\frac{1.6726219\\times10^{-27}(10^6)}{1.6\\times10^{-19}(0.10)}=0.1045\\ \\text{m}\\approx10.5\\ \\text{cm}$. (Rounding $m_p$ to $1.67\\times10^{-27}$ gives $10.4$, which is also accepted.)","h":["$r=mv/(qB)$.","Use $m_p=1.6726219\\times10^{-27}$ kg from the data book.","Convert metres to cm."]},{"topic":"Speed doubling","q":"If the speed of a charge in a magnetic field doubles, by what factor does the radius change?","a":"2","alt":[],"ad":"$2$","sol":"$r\\propto v$.","h":["$r=mv/qB$.","Radius is proportional to $v$.","Factor 2."]},{"topic":"Velocity selector","q":"$E=1.0\\times10^4\\ \\text{V m}^{-1}$ and $B=0.050\\ \\text{T}$. Find the selected speed in units of $10^5\\ \\text{m s}^{-1}$.","a":"2.0","alt":["2"],"ad":"$2.0\\times10^5\\ \\text{m s}^{-1}$","sol":"$v=E/B=\\frac{1.0\\times10^4}{0.050}$.","h":["Forces balance: $qE=qvB$.","$v=E/B$.","Divide."]},{"topic":"Solenoid","q":"If the current in a solenoid is doubled, by what factor does its field change?","a":"2","alt":[],"ad":"$2$","sol":"$B\\propto I$.","h":["Field is proportional to current.","Double current.","Factor 2."]},{"topic":"Parallel wires","q":"Do two parallel wires carrying current in the same direction attract? Answer yes or no.","a":"yes","alt":["Yes"],"ad":"Yes","sol":"Same-direction currents attract.","h":["Same direction currents.","Fields add between them... they pull together.","Attract."]},{"topic":"Period","q":"Find the cyclotron period of a proton in a $1.0\\ \\text{T}$ field in nanoseconds (1 decimal place).","a":"65.7","alt":["65.6"],"ad":"$65.7\\ \\text{ns}$","sol":"$T=\\frac{2\\pi m}{qB}=\\frac{2\\pi(1.6726219\\times10^{-27})}{1.6\\times10^{-19}(1.0)}=6.57\\times10^{-8}\\ \\text{s}$. (Rounding $m_p$ gives $65.6$, also accepted.)","h":["$T=2\\pi m/qB$.","Speed cancels.","Convert to ns."]},{"topic":"Work","q":"How much work does a magnetic field do on a moving charge in one revolution (J)?","a":"0","alt":[],"ad":"$0$","sol":"Force is perpendicular to motion.","h":["$W=Fd\\cos\\theta$.","The angle is $90^\\circ$.","Zero."]}],"comets":[{"topic":"Extension: Isotopes","q":"Two ions with the same charge and speed enter the same magnetic field. One has mass $4\\ \\text{u}$ and the other $2\\ \\text{u}$. Find the ratio of the larger radius to the smaller.","a":"2","alt":[],"ad":"$2$","sol":"$r\\propto m$.","h":["$r=mv/qB$.","Same $q$, $v$, $B$.","Ratio of masses."]}],"hours":4.5},"ph3-c07":{"id":"ph3-c07","interactive":"none","summary":"A changing magnetic flux induces an emf. This chapter covers magnetic flux, Faraday's and Lenz's laws, the emf of a moving conductor, generators, and the meaning of RMS values.","videos":[{"src":"F","title":"Electromagnetic induction, Faraday and Lenz","url":"https://www.youtube.com/results?search_query=Flipping+Physics+Faraday+law+Lenz+law+electromagnetic+induction+physics","kind":"search"},{"src":"K","title":"Magnetic flux and induction","url":"https://www.youtube.com/results?search_query=Khan+Academy+magnetic+flux+Faraday+law+induction","kind":"search"},{"src":"V","title":"Veritasium: Induction and the magnet in a tube","url":"https://www.youtube.com/results?search_query=Veritasium+Lenz+law+magnet+falling+tube","kind":"search"}],"sections":[{"id":"ph3-c07-s1","code":"7.1","title":"Magnetic flux","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: magnetic flux","url":"https://www.youtube.com/results?search_query=Flipping+Physics+magnetic+flux","kind":"search"}]},{"t":"p","x":"**Magnetic flux** measures how much field passes through a surface: $\\Phi=BA\\cos\\theta$ in **webers (Wb)**, where $A$ is the area and $\\theta$ is the angle between the field and the **normal** (perpendicular) to the surface. Flux is largest when the field is perpendicular to the loop's plane and zero when the field runs parallel to the plane."},{"t":"key","x":"$$\\Phi=BA\\cos\\theta$$"},{"t":"ex","title":"Flux","q":"A $0.020\\ \\text{m}^2$ coil is perpendicular to a $0.50\\ \\text{T}$ field. Find the flux, and the flux after turning $60^\\circ$.","s":["$\\Phi=BA\\cos0^\\circ=0.50(0.020)=0.010\\ \\text{Wb}$.","At $60^\\circ$: $\\Phi=0.010\\cos60^\\circ=0.0050\\ \\text{Wb}$."],"a":"$0.010\\ \\text{Wb}$ and $0.0050\\ \\text{Wb}$."},{"t":"warn","x":"$\\theta$ is measured from the **normal**, not from the plane of the coil. If a question gives the angle to the plane, subtract it from $90^\\circ$."}]},{"id":"ph3-c07-s2","code":"7.2","title":"Faraday's and Lenz's laws","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: Faraday law Lenz law","url":"https://www.youtube.com/results?search_query=Flipping+Physics+Faraday+law+Lenz+law","kind":"search"}]},{"t":"p","x":"**Faraday's law:** the induced emf equals the rate of change of flux linkage: $\\varepsilon=-N\\dfrac{\\Delta\\Phi}{\\Delta t}$. **Lenz's law** (the minus sign): the induced current's own field **opposes the change** in flux that caused it. This is conservation of energy: if induced fields helped the change, energy would appear from nothing."},{"t":"key","x":"$$\\varepsilon=-N\\frac{\\Delta\\Phi}{\\Delta t}$$"},{"t":"ex","title":"Changing flux","q":"A $200$-turn coil has flux falling from $0.010\\ \\text{Wb}$ to zero in $0.050\\ \\text{s}$. Find the average emf.","s":["$|\\varepsilon|=N\\frac{\\Delta\\Phi}{\\Delta t}=200\\times\\frac{0.010}{0.050}=40\\ \\text{V}$."],"a":"$40\\ \\text{V}$"},{"t":"p","x":"**Using Lenz.** A north pole approaching a loop increases flux through it, so the loop develops a current whose field also points toward the approaching magnet (a north face) to repel it. A magnet pulled away is attracted. In both cases the induced current makes the motion **harder**."}]},{"id":"ph3-c07-s3","code":"7.3","title":"Moving conductors","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: moving conductor in a magnetic field emf","url":"https://www.youtube.com/results?search_query=Flipping+Physics+moving+conductor+in+a+magnetic+field+emf","kind":"search"}]},{"t":"p","x":"A conductor of length $L$ moving at speed $v$ perpendicular to a field $B$ has emf $\\varepsilon=BLv$. If connected to a circuit of resistance $R$ the current is $I=\\frac{\\varepsilon}{R}$, and the magnetic force on it is $BIL$, opposing the motion."},{"t":"ex","title":"Sliding rod","q":"A $0.50\\ \\text{m}$ rod moves at $4.0\\ \\text{m s}^{-1}$ perpendicular to a $0.30\\ \\text{T}$ field. Find the emf.","s":["$\\varepsilon=BLv=0.30(0.50)(4.0)=0.60\\ \\text{V}$."],"a":"$0.60\\ \\text{V}$"},{"t":"p","x":"**Eddy currents.** A conductor moving through a changing field has circulating currents induced in it. Lenz's law means they oppose the motion, which is used for braking and cause heating in transformer cores (reduced by laminating the core)."}]},{"id":"ph3-c07-s4","code":"7.4","title":"Generators and AC","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: AC generator physics","url":"https://www.youtube.com/results?search_query=Flipping+Physics+AC+generator+physics","kind":"search"}]},{"t":"p","x":"In an **AC generator** a coil rotates in a magnetic field and the flux changes sinusoidally. The emf is **greatest when the coil's plane is parallel to the field** (the flux is zero but changing fastest) and **zero when the plane is perpendicular to the field** (maximum flux, zero rate of change). A split-ring commutator would give DC; slip rings give AC."},{"t":"p","x":"**RMS values.** For a sinusoidal supply $V_{\\text{rms}}=\\dfrac{V_{\\text{peak}}}{\\sqrt2}$ and $I_{\\text{rms}}=\\dfrac{I_{\\text{peak}}}{\\sqrt2}$. The RMS value is the equivalent steady value that would deliver the same power: $P=V_{\\text{rms}}I_{\\text{rms}}=\\dfrac{V_{\\text{rms}}^2}{R}$."},{"t":"ex","title":"RMS","q":"The mains supply has $V_{\\text{rms}}=240\\ \\text{V}$. Find the peak voltage.","s":["$V_{\\text{peak}}=\\sqrt2\\times240=339\\ \\text{V}$."],"a":"$339\\ \\text{V}$"},{"t":"warn","x":"Household \"240 V\" is an RMS value, so the voltage actually swings between about $-339\\ \\text{V}$ and $+339\\ \\text{V}$."}]},{"id":"ph3-c07-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Explaining induction.** A complete answer has three parts: (1) the flux through the circuit is changing, (2) so an emf is induced (Faraday), (3) and the direction is such as to oppose the change (Lenz). Use the word **flux** and the word **change**."},{"t":"p","x":"**Graph questions.** Flux against time is a cosine for a rotating coil; the emf is the gradient of the flux graph (negative), which gives a sine curve."}]}],"quiz":[{"topic":"Flux","q":"$B=0.20\\ \\text{T}$ is perpendicular to an area of $0.050\\ \\text{m}^2$. Find the flux (Wb).","a":"0.010","alt":["0.01"],"ad":"$0.010\\ \\text{Wb}$","sol":"$\\Phi=BA=0.20(0.050)$.","h":["$\\Phi=BA\\cos\\theta$.","$\\theta=0^\\circ$.","Multiply."]},{"topic":"Zero flux","q":"What is the flux when the field is parallel to the plane of a loop (Wb)?","a":"0","alt":[],"ad":"$0$","sol":"The normal is perpendicular to the field, so $\\cos90^\\circ=0$.","h":["Angle to the normal.","$\\theta=90^\\circ$.","$\\cos90^\\circ=0$."]},{"topic":"Faraday","q":"A $50$-turn coil has $\\Delta\\Phi=0.040\\ \\text{Wb}$ in $0.20\\ \\text{s}$. Find the average emf (V).","a":"10","alt":["10.0"],"ad":"$10\\ \\text{V}$","sol":"$\\varepsilon=N\\Delta\\Phi/\\Delta t=50\\times0.20$.","h":["$\\varepsilon=N\\Delta\\Phi/\\Delta t$.","$\\Delta\\Phi/\\Delta t=0.20$.","Multiply by 50."]},{"topic":"Rod","q":"$B=0.50\\ \\text{T}$, $L=0.40\\ \\text{m}$, $v=3.0\\ \\text{m s}^{-1}$. Find the emf (V).","a":"0.60","alt":["0.6"],"ad":"$0.60\\ \\text{V}$","sol":"$\\varepsilon=BLv$.","h":["$\\varepsilon=BLv$.","Multiply the three.","Compute."]},{"topic":"RMS","q":"A supply has peak voltage $170\\ \\text{V}$. Find $V_{\\text{rms}}$ (V, nearest whole number).","a":"120","alt":["120.2","120.21"],"ad":"$120\\ \\text{V}$","sol":"$170/\\sqrt2=120$.","h":["$V_{\\text{rms}}=V_{\\text{peak}}/\\sqrt2$.","$\\sqrt2=1.414$.","Divide."]},{"topic":"Lenz","q":"A north pole moves toward a coil. Does the induced current produce a field opposing the magnet's approach? Answer yes or no.","a":"yes","alt":["Yes"],"ad":"Yes","sol":"Lenz's law: induced effects oppose the change.","h":["Lenz's law.","Opposes the change.","Yes."]},{"topic":"Frequency","q":"A generator coil makes $50$ rotations each second. What is the frequency of the AC output (Hz)?","a":"50","alt":[],"ad":"$50\\ \\text{Hz}$","sol":"One cycle per rotation.","h":["One rotation, one cycle.","Same count per second.","50."]},{"topic":"Maximum emf","q":"At the instant a generator's emf is a maximum, is the flux through the coil zero? Answer yes or no.","a":"yes","alt":["Yes"],"ad":"Yes","sol":"The emf is greatest when the flux is changing fastest, which is when the flux is zero.","h":["The emf is the gradient of the flux graph.","Gradient is steepest at zero flux.","Yes."]},{"topic":"Power","q":"A $60\\ \\Omega$ heater runs on $240\\ \\text{V}_{\\text{rms}}$. Find its power (W).","a":"960","alt":[],"ad":"$960\\ \\text{W}$","sol":"$P=V^2/R=\\frac{240^2}{60}$.","h":["$P=V^2/R$.","$240^2=57600$.","Divide by 60."]},{"topic":"Speed","q":"If a generator's coil turns twice as fast, by what factor does the peak emf change?","a":"2","alt":[],"ad":"$2$","sol":"Flux changes twice as fast.","h":["Rate of change of flux doubles.","Emf is proportional to that rate.","Factor 2."]}],"comets":[{"topic":"Extension: Rod on rails","q":"A $0.20\\ \\text{m}$ rod slides at $2.0\\ \\text{m s}^{-1}$ on rails in a $0.50\\ \\text{T}$ field. The circuit resistance is $0.10\\ \\Omega$. Find the current (A).","a":"2.0","alt":["2"],"ad":"$2.0\\ \\text{A}$","sol":"$\\varepsilon=BLv=0.20\\ \\text{V}$; $I=\\varepsilon/R=2.0$.","h":["Find the emf first.","$\\varepsilon=0.50(0.20)(2.0)$.","$I=\\varepsilon/R$."]},{"topic":"Extension: Force on the rod","q":"For the same rod and circuit, find the force needed to keep it moving at constant speed (N).","a":"0.20","alt":["0.2"],"ad":"$0.20\\ \\text{N}$","sol":"$F=BIL=0.50(2.0)(0.20)=0.20$.","h":["Constant speed: applied force balances magnetic force.","$F=BIL$.","Use $I=2.0\\ \\text{A}$."]}],"hours":4},"ph3-c08":{"id":"ph3-c08","interactive":"transformer","summary":"Transformers change AC voltages and make long-distance power transmission efficient. This chapter covers the ideal transformer equations, energy losses, transmission-line power loss, and why electricity is transmitted at high voltage.","videos":[{"src":"F","title":"Transformers and power transmission","url":"https://www.youtube.com/results?search_query=Flipping+Physics+transformers+step+up+step+down+power+transmission+physics","kind":"search"},{"src":"K","title":"Transformers","url":"https://www.youtube.com/results?search_query=Khan+Academy+transformer+physics+ideal+transformer","kind":"search"},{"src":"V","title":"Veritasium: The grid","url":"https://www.youtube.com/results?search_query=Veritasium+AC+DC+power+grid","kind":"search"}],"sections":[{"id":"ph3-c08-s1","code":"8.1","title":"The ideal transformer","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: ideal transformer","url":"https://www.youtube.com/results?search_query=Flipping+Physics+ideal+transformer","kind":"search"}]},{"t":"p","x":"A transformer has a **primary** and **secondary** coil wound on a soft-iron core. An alternating current in the primary produces a changing flux in the core, which induces an emf in the secondary. **It works only with AC**, because a DC current produces a steady flux and no induction."},{"t":"key","x":"$$\\frac{V_s}{V_p}=\\frac{N_s}{N_p},\\qquad V_pI_p=V_sI_s\\ (\\text{ideal})$$"},{"t":"ex","title":"Step-down","q":"A transformer has $500$ primary and $100$ secondary turns with a $240\\ \\text{V}$ input. Find the output voltage.","s":["$V_s=V_p\\frac{N_s}{N_p}=240\\times\\frac{100}{500}=48\\ \\text{V}$."],"a":"$48\\ \\text{V}$"},{"t":"p","x":"$N_s>N_p$ is a **step-up** transformer (raises voltage, lowers current). $N_s\u003cN_p$ is **step-down**. The power is not increased: voltage up means current down."},{"t":"ex","title":"Currents","q":"An ideal transformer delivers $12\\ \\text{W}$ at $48\\ \\text{V}$ from a $240\\ \\text{V}$ primary. Find the secondary and primary currents.","s":["$I_s=\\frac PV=\\frac{12}{48}=0.25\\ \\text{A}$.","$I_p=\\frac{12}{240}=0.050\\ \\text{A}$."],"a":"$0.25\\ \\text{A}$ and $0.050\\ \\text{A}$."},{"t":"int","name":"transformer","cap":"Change the turns and the load. Check that the ideal power in equals the power out."}]},{"id":"ph3-c08-s2","code":"8.2","title":"Real transformers and energy losses","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: transformer energy losses","url":"https://www.youtube.com/results?search_query=Flipping+Physics+transformer+energy+losses","kind":"search"}]},{"t":"p","x":"Real transformers are not perfectly efficient. **Efficiency** $=\\dfrac{P_{\\text{out}}}{P_{\\text{in}}}\\times100\\%$. Losses include **resistive heating** in the windings, **eddy currents** in the core (reduced by using a **laminated** core), **hysteresis** (reversing magnetisation of the core, reduced by soft iron) and **flux leakage** (reduced by winding the coils on a shared core)."},{"t":"ex","title":"Efficiency","q":"A transformer takes $300\\ \\text{W}$ and delivers $285\\ \\text{W}$. Find its efficiency.","s":["$\\frac{285}{300}\\times100=95\\%$."],"a":"$95\\%$"}]},{"id":"ph3-c08-s3","code":"8.3","title":"Power transmission","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: power transmission transformers","url":"https://www.youtube.com/results?search_query=Flipping+Physics+power+transmission+transformers","kind":"search"}]},{"t":"p","x":"The power lost in a cable is $P_{\\text{loss}}=I^2R$. For a given transmitted power $P=VI$, a **higher voltage means a lower current**, and the loss falls with the **square** of the current. That is why electricity is **stepped up** at the power station for transmission and **stepped down** near the user."},{"t":"ex","title":"Transmission loss","q":"A power station sends $100\\ \\text{kW}$ through cables with resistance $5.0\\ \\Omega$. Compare the power lost at $10\\ \\text{kV}$ and at $1.0\\ \\text{kV}$.","s":["At $10\\ \\text{kV}$: $I=\\frac{100\\times10^3}{10\\times10^3}=10\\ \\text{A}$; $P_{\\text{loss}}=10^2(5.0)=500\\ \\text{W}$ (0.5%).","At $1.0\\ \\text{kV}$: $I=100\\ \\text{A}$; $P_{\\text{loss}}=100^2(5.0)=50\\ \\text{kW}$ (50%)."],"a":"$500\\ \\text{W}$ at $10\\ \\text{kV}$ versus $50\\ \\text{kW}$ at $1.0\\ \\text{kV}$."},{"t":"warn","x":"The voltage in $P_{\\text{loss}}=V^2/R$ is the voltage **across the cable**, not the transmission voltage. Use $I^2R$ for line loss."}]},{"id":"ph3-c08-s4","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Explain, do not just calculate.** A typical question: \"Explain why power is transmitted at high voltage.\" Answer: for a fixed power, higher voltage means lower current ($I=P/V$), and heat loss in the cables is $I^2R$, so far less energy is wasted."},{"t":"p","x":"**Reasons a transformer is not 100% efficient** should name the cause and the fix: eddy currents (laminated core), resistive heating (thick copper wire), hysteresis (soft iron core) and leakage (shared core)."}]}],"quiz":[{"topic":"Output voltage","q":"A transformer has $N_p/N_s=10$ and $V_p=240\\ \\text{V}$. Find $V_s$ (V).","a":"24","alt":["24.0"],"ad":"$24\\ \\text{V}$","sol":"$V_s=240/10$.","h":["$V_s/V_p=N_s/N_p$.","$N_s/N_p=0.10$.","Multiply."]},{"topic":"Turns","q":"Find $N_s$ to step $240\\ \\text{V}$ down to $12\\ \\text{V}$ with $N_p=1000$.","a":"50","alt":[],"ad":"$50$","sol":"$N_s=1000\\times\\frac{12}{240}$.","h":["$N_s/N_p=V_s/V_p$.","$12/240=0.05$.","Multiply."]},{"topic":"Current","q":"An ideal transformer has $V_p=240\\ \\text{V}$, $I_p=0.50\\ \\text{A}$ and $V_s=12\\ \\text{V}$. Find $I_s$ (A).","a":"10","alt":["10.0"],"ad":"$10\\ \\text{A}$","sol":"$V_pI_p=V_sI_s\\Rightarrow I_s=\\frac{120}{12}$.","h":["Ideal means power in equals power out.","$V_pI_p=120\\ \\text{W}$.","Divide by $V_s$."]},{"topic":"Line loss","q":"A cable of resistance $2.0\\ \\Omega$ carries $20\\ \\text{A}$. Find the power lost (W).","a":"800","alt":[],"ad":"$800\\ \\text{W}$","sol":"$P=I^2R=400(2.0)$.","h":["$P=I^2R$.","$20^2=400$.","Multiply by 2.0."]},{"topic":"Line current","q":"$50\\ \\text{kW}$ is sent at $5000\\ \\text{V}$. Find the current (A).","a":"10","alt":[],"ad":"$10\\ \\text{A}$","sol":"$I=P/V=\\frac{50000}{5000}$.","h":["$P=VI$.","$I=P/V$.","Divide."]},{"topic":"Higher voltage","q":"If the transmission voltage rises by a factor of 10 for the same power, by what factor does the line loss fall?","a":"100","alt":[],"ad":"$100$","sol":"Current falls by 10, loss $\\propto I^2$.","h":["$I\\propto1/V$.","Loss $\\propto I^2$.","$10^2$."]},{"topic":"Efficiency","q":"A transformer takes $300\\ \\text{W}$ in and gives $285\\ \\text{W}$ out. Find the efficiency (%).","a":"95","alt":[],"ad":"$95\\%$","sol":"$285/300\\times100$.","h":["Output over input.","$285/300=0.95$.","Convert to %."]},{"topic":"DC","q":"Can a transformer step up a steady DC voltage? Answer yes or no.","a":"no","alt":["No"],"ad":"No","sol":"DC gives a constant flux, so no emf is induced.","h":["Induction needs a changing flux.","DC flux does not change.","No."]},{"topic":"Step-up","q":"A transformer has more secondary turns than primary turns. Is it a step-up transformer? Answer yes or no.","a":"yes","alt":["Yes"],"ad":"Yes","sol":"$V_s>V_p$ when $N_s>N_p$.","h":["$V_s/V_p=N_s/N_p$.","$N_s>N_p$ means $V_s>V_p$.","Step-up."]},{"topic":"Ratio","q":"$V_p=11000\\ \\text{V}$ and $V_s=240\\ \\text{V}$. Find $N_p/N_s$ (1 decimal place).","a":"45.8","alt":[],"ad":"$45.8$","sol":"$\\frac{N_p}{N_s}=\\frac{11000}{240}=45.8$.","h":["$N_p/N_s=V_p/V_s$.","$11000/240$.","Compute."]}],"comets":[{"topic":"Extension: Line loss percentage","q":"$2.0\\ \\text{MW}$ is sent at $20\\ \\text{kV}$ through lines with resistance $10\\ \\Omega$. What percentage of the power is lost?","a":"5","alt":["5.0"],"ad":"$5\\%$","sol":"$I=\\frac{2.0\\times10^6}{20\\times10^3}=100\\ \\text{A}$; $P_{\\text{loss}}=100^2(10)=100\\ \\text{kW}$, which is $5\\%$ of $2.0\\ \\text{MW}$.","h":["Find the current.","$P_{\\text{loss}}=I^2R$.","Divide by the total power."]},{"topic":"Extension: Cutting the loss","q":"To reduce the line loss in the previous question to $1.25\\%$, by what factor must the transmission voltage increase?","a":"2","alt":[],"ad":"$2$","sol":"Loss $\\propto1/V^2$; a quarter of the loss needs $V$ doubled.","h":["$P_{\\text{loss}}\\propto I^2\\propto1/V^2$.","The loss must fall by a factor of 4.","Square root of 4."]}],"hours":3.5}}</script>
<script id="app-script">
(function(){
'use strict';
var SHELL=document.getElementById('shell').outerHTML;
var S=JSON.parse(document.getElementById('state').textContent);
S.log=S.log||[];S.mistakes=S.mistakes||[];S.progress=S.progress||{};S.lessons=S.lessons||{};S.practice=S.practice||{};S.bank=S.bank||{};S.time=S.time||{};S.comets=S.comets||{};S.exams=S.exams||{};S.xp=S.xp||0;
const DIRTY=new Set();
const norm=s=>String(s).toLowerCase().replace(/\s+/g,'').replace(/[·×]/g,'*').replace(/−/g,'-');
var MJCFG='{tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]],processEscapes:true},svg:{fontCache:"global"},options:{enableMenu:false},startup:{typeset:false}}';
var HEAD='<scr'+'ipt>window.MathJax='+MJCFG+';</scr'+'ipt><scr'+'ipt async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></scr'+'ipt><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Galaxy</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&family=Unbounded:wght@500;700&display=swap">';

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=864e5, REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL={new:cssv('--new'),learning:cssv('--learn'),revise:cssv('--revise'),solid:cssv('--solid'),due:cssv('--solid'),risk:cssv('--risk'),gold:cssv('--gold'),ink:cssv('--ink'),mute:cssv('--mute')};
const LABEL={new:'Not started',learning:'Learning',revise:'Needs revision',solid:'Solid',due:'Due for review'};
const fmtDate=t=>new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'});

/* ---------- data helpers ---------- */
const subj=id=>S.subjects.find(s=>s.id===id);
const VS=()=>S.subjects.filter(s=>!s.hidden);
const UNITS=['3','4'];
const chaptersOf=(s,u)=>s.units[u]||[];
function findCh(id){for(const s of S.subjects)for(const u of UNITS){const l=chaptersOf(s,u),i=l.findIndex(c=>c.id===id);if(i>=0)return{s,u,ch:l[i],i,list:l};}return null;}
function effStatus(id){const p=S.progress[id];if(!p)return'new';if(p.status==='solid'&&p.due&&Date.now()>=p.due)return'due';return p.status||'new';}
const solidCount=l=>l.filter(c=>effStatus(c.id)==='solid').length;
const nextOf=l=>l.find(c=>effStatus(c.id)!=='solid');
const numOf=(c,i)=>parseInt(String(c.n||'').replace(/\D/g,''),10)||i+1;
const openMistakes=id=>S.mistakes.filter(m=>m.ch===id&&m.rights.length<2);
function subjectTotals(s){let t=0,d=0;for(const u of UNITS){const l=chaptersOf(s,u);t+=l.length;d+=solidCount(l);}return{t,d};}

/* ---------- view state ---------- */
const V={view:'galaxy',subj:null,unit:'3',sel:null,add:false,insights:false,exam:false,hover:null};
let sess=null, SAMPLE, tr=null, unitT0=-9999, hits=[], shiftX=0;

/* ---------- canvas ---------- */
const cv=$('#sky'), ctx=cv.getContext('2d');
let W=0,H=0;
function resize(){const d=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);}
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const stars=Array.from({length:430},()=>({x:rnd(),y:rnd(),r:rnd()*1.3+.2,p:rnd()*6.28,s:rnd()*.0015+.0004,d:rnd()*.7+.3}));
function hex(c){const n=parseInt(c.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function mix(c,t){const[r,g,b]=hex(c),k=t>0?255:0,a=Math.abs(t);return'rgb('+Math.round(r+(k-r)*a)+','+Math.round(g+(k-g)*a)+','+Math.round(b+(k-b)*a)+')';}
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const panelOpen=()=>(V.insights||V.exam||(V.view==='subject'&&(V.sel||V.add)))&&W>=760&&!V.hidden&&!V.wide;
function cx0(){return W/2-shiftX;}
function freeW(){return W-2*shiftX;}

/* ---------- star-chart engine: constellations, not orbits ---------- */
const hexA=a=>Math.round(clamp(a,0,1)*255).toString(16).padStart(2,'0');
const rgba=(c,a)=>{const h=hex(c.length===7?c:'#cccccc');return'rgba('+h[0]+','+h[1]+','+h[2]+','+clamp(a,0,1).toFixed(3)+')';};

  const list=chaptersOf(s,V.unit),n=list.length,fw=freeW(),cx=cx0(),A=o.alpha==null?1:o.alpha;
  const sc=o.scale==null?1:o.scale;
  ctx.save();ctx.globalAlpha=A;
  const top=124,bot=H-160,rx=cx-fw/2+150,rw=fw-300;
  ctx.translate(cx,(top+bot)/2);ctx.scale(sc,sc);ctx.translate(-cx,-(top+bot)/2);
  if(!n){text('No chapters here yet',cx,H/2-10,'600 24px "Geist",system-ui,sans-serif','rgba(238,240,246,.7)');text('ADD SOME FROM THE LIST BELOW',cx,H/2+16,'500 10px "Geist",system-ui,sans-serif','rgba(142,152,174,.9)','center','1px');ctx.restore();return;}
  const L=layout(s.id+'|u'+V.unit,n+1),pts=fitPts(L,rx,top,rw,bot-top);
  const z=Math.min(fw,H)/820,base=clamp(z,.8,1.35);
  const dur=REDUCE?1:900+n*420,ku=unitT0<0?1:clamp((performance.now()-unitT0)/dur,0,1);
  const fr=k=>clamp(ku*(n+.4)-k,0,1);
  const lit=k=>{if(k===n-1)return 2;const st=effStatus(list[k].id);return st==='solid'||st==='due'?1:0;};
  drawLines(pts,lit,fr,1,L.extra);
  drawFlow(pts,lit,t,A);
  const nxt=nextOf(list);
  const J=journeyStep(list,pts,ku);
  list.forEach((c,i)=>{
    const sp=REDUCE?1:clamp((ku*(n+.4)-i+.15)*1.6,0,1);if(sp<=0)return;
    const ss=starStyle(c.id),p=S.progress[c.id]||{},sel=V.sel===c.id,hov=V.hover===c.id,x=pts[i].x,y=pts[i].y,info=CT[c.id];
    const r=ss.r*base*1.25*(hov?1.22:1)*(1+1.2*(1-easeOut(sp)));ctx.globalAlpha=A*easeOut(sp);
    // section progress arc
    if(info&&info.sections.length){const f=Object.keys(p.secs||{}).length/info.sections.length,ar=r*3.4+6;
      ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,ar,0,6.283);ctx.stroke();
      if(f>0){ctx.strokeStyle=rgba(ss.st==='new'?'#9fbbe6':ss.c,.85);ctx.lineCap='round';ctx.beginPath();ctx.arc(x,y,ar,-Math.PI/2,-Math.PI/2+6.283*f);ctx.stroke();}}
    else{ctx.strokeStyle='rgba(185,198,238,.28)';ctx.lineWidth=1;ctx.setLineDash([2,3]);ctx.beginPath();ctx.arc(x,y,r*2.4,0,6.283);ctx.stroke();ctx.setLineDash([]);}
    const pf=JR&&JR.passed[i]?.7*Math.exp(-(performance.now()-JR.passed[i])/900):0;
    starGlyph(x,y,r*(1+.5*pf),pf>.05?'#ffffff':ss.c,Math.min(1,(info?ss.k:ss.k*.6)+pf),t,i+3,{diag:ss.st==='solid'||pf>.3,boost:(hov?1.15:1)+pf*.9});
    if(ss.st==='due'){const k=REDUCE?.5:(Math.sin(t*.004)+1)/2;ctx.strokeStyle=rgba('#e3bd78',.3+.5*k);ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,r*3.4+12+k*5,0,6.283);ctx.stroke();}
    if(p.risky){ctx.strokeStyle=rgba('#c98585',.8);ctx.lineWidth=1.4;ctx.setLineDash([3,4]);ctx.beginPath();ctx.arc(x,y,r*3.4+11,0,6.283);ctx.stroke();ctx.setLineDash([]);}
    if(nxt&&nxt.id===c.id&&!sel&&!REDUCE){for(let q=0;q<2;q++){const k=((t*.00045)+q*.5)%1;ctx.strokeStyle=rgba('#d9b878',(1-k)*.55);ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x,y,r*3.4+6+k*34,0,6.283);ctx.stroke();}}
    if(sel&&!(JR&&JR.id===c.id)){ctx.save();ctx.translate(x,y);ctx.rotate(REDUCE?0:t*.0006);const R2=r*3.4+14;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.2;
      for(let q=0;q<4;q++){ctx.beginPath();ctx.arc(0,0,R2,q*Math.PI/2+.25,q*Math.PI/2+Math.PI/2-.25);ctx.stroke();ctx.beginPath();ctx.moveTo(R2+3,0);ctx.lineTo(R2+10,0);ctx.stroke();ctx.rotate(Math.PI/2);}ctx.restore();}
    const fl=S.flash;
    if(fl&&fl.id===c.id&&Date.now()-fl.t<120000&&performance.now()-FLASH0<6400){const k=((performance.now()-FLASH0)/1600)%1;
      ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle=rgba(ss.c,1-k);ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r*2+k*70,0,6.283);ctx.stroke();ctx.restore();
      starGlyph(x,y,r,ss.c,1,t,i,{diag:true,boost:1+1.2*(1-k)});}
    if(info&&(ss.st==='solid'||ss.st==='due')){const done=info.comets.filter((q,k)=>S.comets[c.id+'-c'+k]).length;
      for(let k=0;k<done;k++)cometAt(x,y,r,k,t,'#e8c98a',false);if(done<info.comets.length)cometAt(x,y,r,done+1,t,'#9fb4ff',true);}
    // labels
    const la=(hov||sel?1:.78)*clamp(sp*1.4-.4,0,1),ly=y+r*3.4+(sel?40:22);
    ctx.globalAlpha=A*la;
    const isN=nxt&&nxt.id===c.id;
    text((String(numOf(c,i)).padStart(2,'0'))+(isN?'  ·  NEXT':''),x,ly,(hov?'600 11.5px':'500 10.5px')+' "Geist",system-ui,sans-serif',isN?'#d9b878':hov?'#ffffff':'rgba(142,152,174,.95)','center','1px',true);
    ctx.globalAlpha=A;
    if(sc>.95)hits.push({kind:'planet',id:c.id,x:x,y:y+10,r:Math.max(r*3.4+12,30)});
  });
  if(J)drawComet(J,pts,A);
  if(V.sel&&!J){const si=list.findIndex(c=>c.id===V.sel);if(si>=0)drawReveal(list[si],si,pts[si],base,A,fw,cx);}
  // exam: the guiding star at the end of the constellation
  const ep=pts[n],esp=REDUCE?1:clamp((ku*(n+.4)-n+.2)*1.5,0,1);
  if(esp>0){const ex=S.exams[s.id+V.unit],hov=V.hover==='station';
    ctx.globalAlpha=A*esp;compass(ep.x,ep.y,9*base*easeBack(esp),t,hov,ex?ex.best:null);ctx.globalAlpha=A;
    if(sc>.95)hits.push({kind:'station',id:'station',x:ep.x,y:ep.y+10,r:44});}
  ctx.restore();
}

/* hyperspace streaks while flying between views */
function warp(t){
  const k=clamp((t-tr.t0)/tr.dur,0,1),I=Math.sin(k*Math.PI);if(I<.02)return;
  const cx=W/2,cy=H/2,dir=tr.kind==='in'?1:-1;
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
  for(let i=0;i<stars.length;i+=2){const s=stars[i],x=s.x*W,y=s.y*H,dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy)||1,L=I*d*.18*(.4+s.d);
    ctx.strokeStyle='rgba(200,205,225,'+(I*.22*s.d).toFixed(3)+')';ctx.lineWidth=s.r*.7;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx/d*L*dir,y+dy/d*L*dir);ctx.stroke();}
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.5);ctx.globalCompositeOperation='source-over';g.addColorStop(0,'rgba(0,0,0,'+(I*.3).toFixed(3)+')');g.addColorStop(1,'rgba(0,0,0,'+(I*.9).toFixed(3)+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.restore();
}

/* ---------- star-to-star journey + name reveal ---------- */
let JR=null,REV=null;
const easeIO=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
function startJourney(prevId,id){
  const s=subj(V.subj);if(!s)return;const list=chaptersOf(s,V.unit),ti=list.findIndex(c=>c.id===id);if(ti<0)return;
  if(REDUCE){JR=null;REV={id:id,t0:performance.now()-9000};return;}
  let fi=prevId?list.findIndex(c=>c.id===prevId):-1;
  if(fi<0)fi=0;
  if(fi===ti)fi=ti>0?ti-1:(list.length>1?1:ti);
  const m=Math.abs(ti-fi);
  JR={id:id,fi:fi,ti:ti,t0:performance.now(),dur:m?clamp(1000+m*520,1300,4200):500,passed:{}};REV=null;
}
function pathPt(J,pts,u){const sg=J.ti>=J.fi?1:-1,j=Math.min(Math.floor(u),Math.abs(J.ti-J.fi)-1),f=u-j,a=pts[J.fi+sg*j],b=pts[J.fi+sg*(j+1)];if(!b)return pts[J.ti];return partial(a,b,clamp(f,0,1));}
function journeyStep(list,pts,ku){
  if(!JR)return null;
  if(JR.id!==V.sel||!pts[JR.ti]||list[JR.ti].id!==JR.id){JR=null;return null;}
  if(ku<1){JR.t0=performance.now();}
  const now=performance.now(),k=clamp((now-JR.t0)/JR.dur,0,1),m=Math.abs(JR.ti-JR.fi),u=easeIO(k)*m,sg=JR.ti>=JR.fi?1:-1;
  for(let q=0;q<=m;q++){const idx=JR.fi+sg*q;if(u>=q-.02&&!JR.passed[idx])JR.passed[idx]=now;}
  if(k>=1){REV={id:JR.id,t0:now};const P=JR.passed;JR=null;JRP={passed:P};return null;}
  return{u:u,m:m,k:k,J:JR};
}
let JRP=null;
function drawComet(S0,pts,A){
  const J=S0.J,u=S0.u;
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
  // the travelled path glows behind the comet
  const sg=J.ti>=J.fi?1:-1;
  for(let q=0;q<Math.ceil(u);q++){const a=pts[J.fi+sg*q],b=q+1<=u?pts[J.fi+sg*(q+1)]:pathPt(J,pts,u),age=(u-q-1);
    ctx.strokeStyle='rgba(255,255,255,'+(A*clamp(.55-age*.18,.12,.55)).toFixed(3)+')';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
  // tail
  const N=26;let prev=null;
  for(let q=N;q>=0;q--){const uu=Math.max(0,u-q*.028),p=pathPt(J,pts,uu),f=1-q/N;
    if(prev){ctx.strokeStyle='rgba(205,215,240,'+(A*f*f*.7).toFixed(3)+')';ctx.lineWidth=.4+f*2.4;ctx.beginPath();ctx.moveTo(prev.x,prev.y);ctx.lineTo(p.x,p.y);ctx.stroke();}
    prev=p;}
  // sparks shed from the tail
  for(let q=0;q<8;q++){const uu=Math.max(0,u-q*.07-((performance.now()*.001+q*.37)%.07)),p=pathPt(J,pts,uu),o=Math.sin(q*12.9+u*7)*6;
    ctx.fillStyle='rgba(205,215,240,'+(A*(1-q/8)*.45).toFixed(3)+')';ctx.beginPath();ctx.arc(p.x+o*.6,p.y-o*.4,1.1,0,6.283);ctx.fill();}
  ctx.restore();
  const h=pathPt(J,pts,u);
  starGlyph(h.x,h.y,2.8,'#dfe6ff',.85,performance.now(),99,{diag:true,boost:1.1,rot:performance.now()*.0015});
}
function drawReveal(c,i,p,base,A,fw,cx){
  const now=performance.now(),e=REV&&REV.id===c.id?now-REV.t0:99999,x=p.x,y=p.y;
  ctx.save();
  // arrival shockwave + flare
  if(e<2000){const k=e/2000;ctx.globalCompositeOperation='lighter';
    for(let q=0;q<2;q++){const kk=clamp(k*1.4-q*.25,0,1);if(kk<=0||kk>=1)continue;ctx.strokeStyle='rgba(200,210,235,'+(A*(1-kk)*.4).toFixed(3)+')';ctx.lineWidth=1.2*(1-kk)+.4;ctx.beginPath();ctx.arc(x,y,12+easeOut(kk)*120,0,6.283);ctx.stroke();}
    if(k<.5)starGlyph(x,y,4*base,'#dfe6ff',.8,now,i,{diag:true,boost:1+1.2*(1-k/.5)});
    ctx.globalCompositeOperation='source-over';}
  // label side: away from the edge that has less room
  const lines=wrapTitle(c.title,24),F='600 24px "Geist",system-ui,sans-serif';ctx.font=F;
  const tw=Math.max(...lines.map(l=>ctx.measureText(l).width)),gap=40,right=cx+fw/2-24,left=cx-fw/2+24;
  let dir=x+gap+tw+30<right?1:-1;if(dir<0&&x-gap-tw-30<left)dir=1;
  const lk=easeOut(clamp((e-300)/900,0,1)),x0=x+dir*18,x1=x+dir*(gap*lk),yL=y-6;
  // leader line
  ctx.strokeStyle='rgba(255,255,255,'+(A*.55).toFixed(3)+')';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();
  if(lk>.98){ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillRect(x1-(dir<0?2:0),y-1,2,2);}
  const tx=x+dir*(gap+10),al=dir>0?'left':'right';
  // eyebrow
  const ek=clamp((e-1700)/900,0,1);
  ctx.globalAlpha=A*ek;
  text('CHAPTER '+String(numOf(c,i)).padStart(2,'0')+'  ·  '+(LABEL[effStatus(c.id)]||'').toUpperCase(),tx,yL-14-(lines.length-1)*14,'500 10.5px "Geist",system-ui,sans-serif','rgba(160,160,170,.95)',al,'1.5px',true);
  // letters surface out of the dark in random order
  const startL=900;let idx=0;
  lines.forEach((ln,q)=>{ctx.font=F;const lw=ctx.measureText(ln).width;let cx2=dir>0?tx:tx-lw;const yy=yL+14+q*28-(lines.length-1)*14;
    for(let j=0;j<ln.length;j++){const ch=ln[j];ctx.font=F;const cw=ctx.measureText(ch).width;
      const sd=Math.sin((idx+1)*12.9898)*43758.5453,rr=sd-Math.floor(sd),ts=startL+rr*1100,k=clamp((e-ts)/700,0,1);idx++;
      if(k>0&&ch!==' '){const fl=k<1?(.55+.45*Math.abs(Math.sin(now*.03+j))):1;
        ctx.save();ctx.globalAlpha=A*easeOut(k)*fl;if('filter' in ctx)ctx.filter='blur('+((1-k)*6).toFixed(1)+'px)';
        text(ch,cx2,yy-(1-k)*4,F,k<1?'#cfd6ea':'#ffffff','left','0px',k>=1);ctx.restore();}
      cx2+=cw;}
  });
  // underline sweep
  const ud=startL+1900,uk=easeOut(clamp((e-ud)/500,0,1));
  if(uk>0){const ux=dir>0?tx:tx-tw,uy=yL+24+(lines.length-1)*14;const g=ctx.createLinearGradient(ux,0,ux+tw,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g;ctx.globalAlpha=A;if(dir>0)ctx.fillRect(ux,uy,tw*uk,1);else ctx.fillRect(ux+tw*(1-uk),uy,tw*uk,1);}
  ctx.restore();
}

/* slow drifting mist and a breathing dark edge */
const MIST=Array.from({length:7},(_,i)=>({x:rnd(),y:rnd(),r:.35+rnd()*.4,s:.4+rnd()*.8,p:rnd()*6.28}));
function drawMist(t){
  const tt=REDUCE?0:t;
  MIST.forEach(m=>{const x=(((m.x+tt*.0000045*m.s)%1.4)-.2)*W,y=(m.y+.06*Math.sin(tt*.00007*m.s+m.p))*H,r=Math.max(W,H)*m.r;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(120,125,145,.028)');g.addColorStop(.6,'rgba(90,95,115,.012)');g.addColorStop(1,'rgba(90,95,115,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);});
  const b=REDUCE?.5:.5+.5*Math.sin(tt*.00045),g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.78);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+(.45+.2*b).toFixed(3)+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

let FLASH0=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const t=REDUCE?0:now;
  const target=panelOpen()?255:0;
  shiftX+=(target-shiftX)*(REDUCE?1:.09);
  ctx.clearRect(0,0,W,H);
  drawBackdrop(now);
  hits=[];
  if(tr){
    const k=Math.min(1,(now-tr.t0)/tr.dur);
    if(tr.kind==='in'){
      if(k<.5){const e=ease(k*2);drawGalaxy(now,{zoomOn:tr.subj,z:1+e*9,alpha:1-e*.92});}
      else{if(V.view!=='subject'){V.view='subject';V.subj=tr.subj;chrome();}const e=ease((k-.5)*2);drawSubject(now,{scale:.35+.65*e,alpha:e});}
    }else{
      if(k<.5){const e=ease(k*2);drawSubject(now,{scale:1-.65*e,alpha:1-e});}
      else{if(V.view!=='galaxy'){V.view='galaxy';chrome();}const e=ease((k-.5)*2);drawGalaxy(now,{zoomOn:tr.subj,z:10-9*e,alpha:.08+.92*e});}
    }
    if(k>=1)tr=null;
    return;
  }
  if(V.view==='galaxy')drawGalaxy(now);else drawSubject(now);
}
function go(kind,id){
  if(REDUCE){if(kind==='in'){V.view='subject';V.subj=id;}else{V.view='galaxy';}chrome();return;}
  tr={kind:kind,subj:id,t0:performance.now(),dur:1100};
}

/* ---------- pointer ---------- */
function hitAt(e){
  const b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
  for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(Math.hypot(x-h.x,y-h.y)<=h.r)return h;}
  return null;
}
cv.addEventListener('pointermove',e=>{const h=hitAt(e);V.hover=h?h.id:null;cv.style.cursor=h?'pointer':'default';});
cv.addEventListener('pointerleave',()=>{V.hover=null;});
cv.addEventListener('click',e=>{const h=hitAt(e);if(!h||tr)return;if(h.kind==='sun')enterSubject(h.id);else if(h.kind==='station')openExam();else openChapter(h.id);});

/* ---------- navigation ---------- */
function enterSubject(id){V.sel=null;V.add=false;V.insights=false;V.exam=false;endSess();const s=subj(id);const u=chaptersOf(s,'3').length||!chaptersOf(s,'4').length?'3':'4';V.unit=u;unitT0=-9999;go('in',id);renderPanel();}
function leave(){flushSave();const id=V.subj;V.sel=null;V.add=false;V.insights=false;V.exam=false;endSess();renderPanel();go('out',id);}
function setUnit(u){if(u===V.unit)return;V.unit=u;V.sel=null;V.add=false;V.insights=false;V.exam=false;endSess();unitT0=performance.now();chrome();renderPanel();}
function openChapter(id){
  V.hidden=false;V.chaps=false;flushSave();endSess();V.add=false;V.insights=false;V.exam=false;
  const f=findCh(id);
  if(f&&(V.view!=='subject'||V.subj!==f.s.id||V.unit!==f.u)){tr=null;V.view='subject';V.subj=f.s.id;V.unit=f.u;unitT0=performance.now();}
  V.sel=id;renderPanel();chrome();
}
function closePanel(){flushSave();endSess();V.sel=null;V.add=false;V.insights=false;V.exam=false;renderPanel();chrome();}

/* ---------- chrome (crumbs, tabs, chips) ---------- */
function chrome(){
  const cr=$('#crumbs'),un=$('#units'),ch=$('#chips');
  const sk=streakInfo(),li0=lvlInfo();$('#streak').innerHTML='Lv <b>'+li0.L+'</b> · '+li0.x+' XP · '+(sk.n?'<b>'+sk.n+'</b> day streak':'no streak yet');$('#streak').setAttribute('data-insights','1');
  if(V.view!=='subject'){V.chaps=false;$('#chlist').hidden=true;}
  $('#today').innerHTML=V.view==='galaxy'?todayHTML():'';
  $('#insightsBtn').setAttribute('aria-pressed',String(V.insights));
  if(V.view==='subject'){
    const s=subj(V.subj);
    cr.innerHTML='<button class="crumb" data-go="galaxy">Galaxy</button><span aria-hidden="true">›</span><span class="here">'+esc(s.name)+'</span>';
    un.innerHTML=UNITS.map(u=>{const l=chaptersOf(s,u);return'<button role="tab" aria-selected="'+(V.unit===u)+'" data-unit="'+u+'">Unit '+u+'<small>'+solidCount(l)+'/'+l.length+'</small></button>';}).join('');
    const l=chaptersOf(s,V.unit),nx=nextOf(l);
    renderChlist(l,nx);ch.innerHTML=chapBtn(l,nx)+'<button class="chip" role="listitem" data-exam="1"><i class="dot" style="--c:#ffd98a"></i><span class="t">Unit exam station</span></button><button class="chip add" role="listitem" data-add="1">+ Add chapters</button>';
  }else{
    cr.innerHTML='<span class="here">Galaxy</span><span class="cue">Pick a subject to enter its solar system</span>';
    un.innerHTML='';
    ch.innerHTML=VS().map(s=>{const t=subjectTotals(s);return'<button class="chip" role="listitem" style="--c:'+s.hue+'" data-sun="'+s.id+'"><i class="dot"></i><span class="t">'+esc(s.name)+(t.t?' · '+t.d+'/'+t.t:'')+'</span></button>';}).join('');
  }
}
$('#shell').addEventListener('click',e=>{
  const td=e.target.closest('[data-today]');if(td){const pr=td.dataset.today.split('|');enterSubject(pr[0]);setTimeout(()=>openChapter(pr[1]),900);return;}
  if(e.target.closest('[data-chaps]')){V.chaps=!V.chaps;chrome();return;}
  if(e.target.closest('[data-exam]')){V.chaps=false;openExam();return;}
  const g=e.target.closest('[data-go]');if(g){leave();return;}
  const u=e.target.closest('[data-unit]');if(u){setUnit(u.dataset.unit);return;}
  const s=e.target.closest('[data-sun]');if(s&&!tr){enterSubject(s.dataset.sun);return;}
  const c=e.target.closest('[data-ch]');if(c){openChapter(c.dataset.ch);return;}
  if(e.target.closest('[data-insights]')){endSess();V.sel=null;V.add=false;V.exam=false;V.hidden=false;V.insights=!V.insights;renderPanel();chrome();return;}

const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
function md(t){
  let out='',ul=false;
  for(const raw of String(t).split('\n')){
    const l=raw.trimEnd();
    if(/^\s*[-•*]\s+/.test(l)){if(!ul){out+='<ul>';ul=true;}out+='<li>'+inl(l.replace(/^\s*[-•*]\s+/,''))+'</li>';continue;}
    if(ul){out+='</ul>';ul=false;}
    if(/^#{1,4}\s/.test(l))out+='<h4>'+inl(l.replace(/^#+\s*/,''))+'</h4>';
    else if(l.trim())out+='<p>'+inl(l)+'</p>';
  }
  return out+(ul?'</ul>':'');
}

async function startQuizAI(strict,force){

  me.practice=!strict;

    if(force!==true){
      if(!strict&&S.practice[cid]){me.qs=mkQs(S.practice[cid],n,[]);me.i=0;me.phase='q';renderPanel();return;}
      if(strict&&S.bank[cid]){const re2=(S.bank[cid].re||[]).map(i=>S.mistakes.find(m=>m.id===i)).filter(Boolean);me.qs=mkQs(S.bank[cid].arr,n,re2);me.i=0;me.phase='q';renderPanel();return;}

function applyRevise(c,sum){
  const id=c.ch.id,p=S.progress[id]||(S.progress[id]={status:'new',attempts:0,history:[],streak:0,due:0}),before=effStatus(id);let fixed=0;
  delete S.bank[id];
  p.attempts=(p.attempts||0)+1;p.history=(p.history||[]).concat([{t:Date.now(),pct:Math.round(sum.score*100),hints:sum.hints,mode:'revise'}]).slice(-12);
  p.risky=sum.cw>0;
  if(sum.score>=.8&&sum.hints<=1){p.status='solid';p.streak=(p.streak||0)+1;p.due=Date.now()+[7,21,60][Math.min(p.streak-1,2)]*DAY;}
  else if(sum.score>=.5){p.status='revise';p.streak=0;p.due=Date.now()+2*DAY;}
  else{p.status='learning';p.streak=0;p.due=0;}
  for(const q of sess.qs){
    if(q.st.void)continue;
    if(q.retestOf){const m=S.mistakes.find(m=>m.id===q.retestOf);if(m&&q.st.credit===1){const d=new Date().toDateString();if(!m.rights.includes(d)){m.rights.push(d);if(m.rights.length===2)fixed++;}}}
    else if(q.st.credit<1)S.mistakes.push({id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),ch:id,qid:q.qid,topic:q.topic,q:q.q,a:q.answer,type:q.st.errorType||'method',conf:q.st.conf,t:Date.now(),rights:[]});
  }
  S.mistakes=S.mistakes.slice(-200);
  S.flash={id:id,t:Date.now(),to:effStatus(id)};
  S.log=S.log.concat([{t:Date.now(),k:'revise',ch:id,pct:Math.round(sum.score*100),before:before,after:effStatus(id),fixed:fixed}]).slice(-300);
}
function applyLearn(c){
  const id=c.ch.id,p=S.progress[id]||(S.progress[id]={status:'new',attempts:0,history:[],streak:0,due:0});
  const before=effStatus(id);
  if(!p.status||p.status==='new')p.status='learning';
  p.learned=Date.now();S.flash={id:id,t:Date.now(),to:effStatus(id)};
  S.log=S.log.concat([{t:Date.now(),k:'learn',ch:id,before:before,after:effStatus(id)}]).slice(-300);
}

/* ---------- local answer checking ---------- */
function cleanA(s){
  return String(s).toLowerCase().replace(/\$/g,'').replace(/\\(left|right|,|;|!)/g,'').replace(/\\(?:d|t)?frac\{([^{}]*)\}\{([^{}]*)\}/g,'($1)/($2)').replace(/\\(pi|theta|sqrt|ln|sin|cos|tan|cdot|times)/g,'$1').replace(/[{}]/g,'')
   .replace(/\s+/g,'').replace(/[·×]/g,'*').replace(/−/g,'-').replace(/π/g,'pi').replace(/√/g,'sqrt').replace(/²/g,'^2').replace(/³/g,'^3').replace(/θ/g,'theta').replace(/±/g,'+-')
   .replace(/°|degrees|units|square/g,'').replace(/and/g,',').replace(/\.$/,'');
}
function forms(s){
  const c=cleanA(s),out=new Set([c]);
  const m=c.match(/^[a-z]{1,3}(\([a-z0-9]+\))?=(.+)$/);if(m&&c.split('=').length===2)out.add(m[2]);
  if(c.indexOf(',')>0&&!/[()]/.test(c))out.add(c.split(',').sort().join(','));
  [...out].forEach(x=>{if(/^\(.*\)$/.test(x)&&x.indexOf('(',1)<0)out.add(x.slice(1,-1));});
  return out;
}
const numOfA=s=>{s=cleanA(s);let m=s.match(/^(-?\d*\.?\d+)$/);if(m)return{v:parseFloat(m[1]),dp:(m[1].split('.')[1]||'').length,frac:false};m=s.match(/^(-?\d+)\/(\d+)$/);if(m&&+m[2])return{v:+m[1]/+m[2],dp:0,frac:true};return null;};
function sameAns(key,given){
  const kn=numOfA(key),gn=numOfA(given);
  if(kn&&gn){const tol=kn.frac?.00051:kn.dp?0.5*Math.pow(10,-kn.dp)+1e-12:1e-9;return Math.abs(kn.v-gn.v)<=tol;}
  const sq=f=>{const o=new Set();f.forEach(x=>{o.add(x);o.add(x.replace(/\(([a-z0-9.]+)\)/g,'$1'));});return o;};
  const a=sq(forms(key)),b=sq(forms(given));for(const x of a)if(b.has(x))return true;return false;
}

      sess.qa.map(x=>'<p><strong>You:</strong> '+esc(x.q)+'</p><div class="lesson">'+(x.a?md(x.a):'<span class="spin"></span>')+'</div>').join('')+
      '<input type="text" id="askbox" placeholder="Ask a question about this chapter" '+(sess.askBusy?'disabled':'')+'><div class="row"><button class="btn ghost" data-act="ask"'+(sess.askBusy?' disabled':'')+'>Ask</button></div></div>';
  }else if(tab==='videos'){
    h+='<p class="sub">Videos to watch alongside each section. They open on YouTube in a new tab. “Direct video” opens the exact video. “Search results” opens a YouTube search for the topic, because I could not confirm a single exact video for it.</p>';
    ['B','J','F','K','V'].forEach(src=>{
      const l=ct.videos.filter(v=>v.src===src);if(!l.length)return;
      h+='<h4 class="eyebrow" style="margin:14px 0 6px">'+SRCN[src]+'</h4>'+l.slice().sort((p,q)=>(q.kind==='video')-(p.kind==='video')).map(vidHTML).join('');
    });
  }else if(tab==='practice'){
    h+='<p class="muted">Practice gives you free hints and shows the full worked solution. Checkpoint is strict: confidence rating first, hints cost marks, 8 questions, 80% or more with at most one hint turns the planet green.</p><div class="row"><button class="btn" data-act="practice">Practise (5 questions)</button><button class="btn ghost" data-act="revise">Revise checkpoint (8 questions)</button></div>'+
      '<p class="sub">'+ct.quiz.length+' questions in this chapter’s bank. Answers are checked on this page, so practice uses none of your Claude usage.</p>'+
      '<h4 class="eyebrow" style="margin:14px 0 6px">Textbook questions to do</h4>'+ct.sections.map(s=>s.blocks.filter(b=>b.t==='tb').map(b=>'<div class="tbrow"><b>Ex '+esc(b.code)+'</b><span>Rec: '+esc(b.rec.replace(/,/g,', '))+'</span><span>Ext: '+esc(b.ext.replace(/,/g,', '))+'</span></div>').join('')).join('');
  }else{
    const st=effStatus(c.ch.id),open=st==='solid'||st==='due',n=ct.comets.length,d=ct.comets.filter((q,k)=>S.comets[c.ch.id+'-c'+k]).length;
    h+='<p class="muted">Comets are extension challenges. They unlock when this planet is solid.</p>'+(open?'<p class="sub">'+d+' of '+n+' caught.</p><div class="row"><button class="btn" data-act="comet">Start comet challenges</button></div>':'<p class="fb">Locked. Make this planet solid with a Revise checkpoint first.</p>')+
      ct.comets.map((q,k)=>'<div class="tbrow"><b>'+esc(q.topic)+'</b><span>'+(S.comets[c.ch.id+'-c'+k]?'Caught ✓':open?'Waiting':'Locked')+'</span></div>').join('');
  }
  return h;
}

/* ---------- interactive widgets ---------- */
const WG={};
const sv=(vb,b)=>({x:x=>(x-vb[0])/(vb[1]-vb[0])*300,y:y=>190-(y-vb[2])/(vb[3]-vb[2])*190});
function axes(m,vb){return'<line x1="0" x2="300" y1="'+m.y(0).toFixed(1)+'" y2="'+m.y(0).toFixed(1)+'" stroke="#5d6882" stroke-width="1"/><line y1="0" y2="190" x1="'+m.x(0).toFixed(1)+'" x2="'+m.x(0).toFixed(1)+'" stroke="#5d6882" stroke-width="1"/>';}
function curve(m,f,a,b,vb,col,w){
  let d='',pen=false;const N=160;
  for(let i=0;i<=N;i++){const x=a+(b-a)*i/N,y=f(x);if(!isFinite(y)||y<vb[2]-1||y>vb[3]+1){pen=false;continue;}d+=(pen?'L':'M')+m.x(x).toFixed(1)+' '+m.y(y).toFixed(1);pen=true;}
  return'<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+(w||2.2)+'"/>';
}
const dot=(m,x,y,c,r)=>'<circle cx="'+m.x(x).toFixed(1)+'" cy="'+m.y(y).toFixed(1)+'" r="'+(r||4.5)+'" fill="'+c+'"/>';
const seg=(m,x1,y1,x2,y2,c,w,dash)=>'<line x1="'+m.x(x1).toFixed(1)+'" y1="'+m.y(y1).toFixed(1)+'" x2="'+m.x(x2).toFixed(1)+'" y2="'+m.y(y2).toFixed(1)+'" stroke="'+c+'" stroke-width="'+(w||1.5)+'"'+(dash?' stroke-dasharray="4 4"':'')+'/>';
WG.expfun={t:'Explore $y=a^x$',c:[['a','Base a',1.2,4,.05,2]],draw:v=>{
  const vb=[-3,3,-.5,6],m=sv(vb),a=v.a,g=Math.log(a);
  return axes(m,vb)+curve(m,x=>Math.exp(x),-3,3,vb,'#5d6882',1.4)+curve(m,x=>Math.pow(a,x),-3,3,vb,'#d9b878')+dot(m,0,1,'#fff')+seg(m,-1.2,1-1.2*g,1.6,1+1.6*g,'#86bfa6',1.6,true)+
   '<text x="8" y="16" fill="#8d98b2" font-size="11">grey: y = eˣ · gold: y = aˣ · green: tangent at (0, 1)</text>';
},r:v=>{const g=Math.log(v.a);return'Gradient at x = 0 is ln a ≈ '+g.toFixed(3)+', the height there is 1. '+(Math.abs(v.a-Math.E)<.04?'Gradient ≈ height: this is e.':'Slide a towards 2.718 to make them equal.');}};
WG.logfun={t:'Inverses: $e^x$ and $\\ln x$',c:[['t','x-value',-2,1.5,.05,0]],draw:v=>{

   '<text x="8" y="16" fill="#8d98b2" font-size="11">gold: eˣ · blue: ln x · dashed: y = x</text>';
},r:v=>'The point ('+v.t.toFixed(2)+', '+Math.exp(v.t).toFixed(2)+') on eˣ mirrors to ('+Math.exp(v.t).toFixed(2)+', '+v.t.toFixed(2)+') on ln x.'};
WG.trigfun={t:'Build $y=a\\sin(b(x-c))+d$',c:[['a','Amplitude a',.5,3,.1,1.5],['b','b',.5,3,.1,1],['c','Shift c',-3,3,.1,0],['d','Midline d',-2,2,.1,0]],draw:v=>{

WG.concavity={t:'Concavity of $f(x)=x^3-3x^2$',c:[['t','x',-1,3.4,.05,.5]],draw:v=>{
  const vb=[-1.5,3.7,-5,4],m=sv(vb),f=x=>x*x*x-3*x*x,t=v.t,d=3*t*t-6*t;

},r:v=>{const d=3*v.t*v.t-6*v.t,s=6*v.t-6;return'f′ = '+d.toFixed(2)+' ('+(d>0?'rising':d<0?'falling':'stationary')+'), f″ = '+s.toFixed(2)+' → '+(s>0?'concave up':s<0?'concave down':'point of inflection')+'. The red dot at x = 1 is the inflection.';}};
const LF=[0];for(let i=1;i<=40;i++)LF[i]=LF[i-1]+Math.log(i);

  const w=280/(n+1);return P.map((q,k)=>'<rect x="'+(10+k*w).toFixed(1)+'" y="'+(175-q/mx*150).toFixed(1)+'" width="'+Math.max(1,w-2).toFixed(1)+'" height="'+(q/mx*150).toFixed(1)+'" fill="#8fa8c8" rx="1.5"/>').join('')+'<line x1="'+(10+(n*p+.5)*w).toFixed(1)+'" x2="'+(10+(n*p+.5)*w).toFixed(1)+'" y1="10" y2="175" stroke="#d9b878" stroke-dasharray="4 4"/>';
},r:v=>'Mean np = '+(Math.round(v.n)*v.p).toFixed(2)+', variance np(1−p) = '+(Math.round(v.n)*v.p*(1-v.p)).toFixed(2)+', σ ≈ '+Math.sqrt(Math.round(v.n)*v.p*(1-v.p)).toFixed(2)+'. The dashed line is the mean.'};
WG.complex={t:'Multiplying complex numbers',c:[['r1','|z₁|',.5,2.5,.1,1.5],['a1','arg z₁ (°)',0,180,5,40],['r2','|z₂|',.5,2.5,.1,1.2],['a2','arg z₂ (°)',0,180,5,60]],draw:v=>{

  let o=axes(m,vb);
  [[z1,'#d9b878'],[z2,'#8fa8c8'],[z3,'#86bfa6']].forEach(a=>{o+=seg(m,0,0,a[0][0],a[0][1],a[1],2)+dot(m,a[0][0],a[0][1],a[1],4);});

},r:v=>'|z₁z₂| = '+(v.r1*v.r2).toFixed(2)+' (moduli multiply). arg(z₁z₂) = '+(v.a1+v.a2)+'° (arguments add).'};
WG.matrix={t:'A matrix transforms the unit square',c:[['a','a',-2,2,.1,1],['b','b',-2,2,.1,.5],['c','c',-2,2,.1,0],['d','d',-2,2,.1,1]],draw:v=>{
  const vb=[-4,4,-3,3.4],m=sv(vb),P=[[0,0],[1,0],[1,1],[0,1]].map(q=>[v.a*q[0]+v.b*q[1],v.c*q[0]+v.d*q[1]]);

},r:v=>{const dt=v.a*v.d-v.b*v.c;return'Matrix [[a, b], [c, d]]: columns are where î (blue) and ĵ (green) land. det = ad − bc = '+dt.toFixed(2)+(Math.abs(dt)<.05?' → squashed flat, no inverse.':dt<0?' → area scaled by '+Math.abs(dt).toFixed(2)+' and flipped.':' → area scaled by '+dt.toFixed(2)+'.');}};
WG.vec3d={t:'Dot product and projection (shown in 2D)',c:[['a','angle of a (°)',0,180,5,20],['b','angle of b (°)',0,180,5,70]],draw:v=>{
  const vb=[-4,4,-1,4.4],m=sv(vb),R=Math.PI/180,A=[3*Math.cos(v.a*R),3*Math.sin(v.a*R)],B=[2*Math.cos(v.b*R),2*Math.sin(v.b*R)],d=A[0]*B[0]+A[1]*B[1],k=d/4,pr=[B[0]*k,B[1]*k];

WG.tangent={t:'Secant to tangent: the limit idea',c:[['t','Point x',-2,2,.05,.5],['h','Gap h',.02,1.5,.02,1]],draw:v=>{

},r:v=>{const f=x=>.25*x*x*x-x+.5,sl=(f(v.t+v.h)-f(v.t))/v.h;return'Secant gradient = '+sl.toFixed(3)+' (blue). Tangent gradient f′(x) = '+(.75*v.t*v.t-1).toFixed(3)+' (green dashed). Shrink h and the blue line becomes the green one.';}};
WG.riemann={t:'Area as a sum of rectangles',c:[['n','Rectangles n',1,40,1,4]],draw:v=>{

WG.projectile={t:'Projectile launcher',c:[['v','Launch speed (m/s)',5,40,1,20],['th','Angle (°)',5,85,1,40],['h0','Launch height (m)',0,30,1,0]],draw:v=>{

WG.incline={t:'Block on a slope',c:[['th','Slope angle (°)',0,60,1,30],['mu','Friction coefficient μ',0,1,.05,.3]],draw:v=>{

WG.orbit={t:'Satellite orbit around Earth',c:[['r','Orbital radius (× Earth radius)',1.05,7,.05,1.06]],draw:v=>{

function errHint(key,given){
  const k=numOfA(key),g=numOfA(given),base='That does not match the answer key. Check the form (exact values, simplified, brackets); if yours is equivalent, tap “I was right”.';
  if(k&&g){
    if(k.v!==0&&Math.abs(g.v+k.v)<1e-9)return'Sign error: your answer is the negative of the key. Recheck the sign on each step.';
    if(k.v!==0&&Math.abs(g.v/k.v-1)<.02)return'Very close: this looks like a rounding difference. Keep full decimals until the last step.';
    if(k.v!==0&&g.v!==0){const r=g.v/k.v;if((Math.abs(r)>=2&&Math.abs(r-Math.round(r))<1e-6)||(Math.abs(1/r)>=2&&Math.abs(1/r-Math.round(1/r))<1e-6))return'Factor error: your answer is a whole-number multiple or fraction of the key. Look for a missed chain-rule factor or a missed division.';}
    return'Wrong value. Redo the working line by line and compare with the worked example in the lesson.';
  }
  const ck=cleanA(key),cg=cleanA(given);
  if(/\+c$/.test(ck)&&!/\+c$/.test(cg)&&sameAns(ck.replace(/\+c$/,''),cg))return'Missing + c: an indefinite integral needs the constant of integration.';
  if(cg==='-'+ck||'-'+cg===ck)return'Sign error: your expression is the negative of the key. Recheck the signs.';
  return base;
}

      return'<button class="cp" data-ch="'+c.id+'"><i class="dot" style="--c:'+COL[st]+'"></i><span class="cpn">'+(f?numOf(f.ch,f.i):'')+' · '+esc(c.title)+'</span><span class="mini"><i style="width:'+Math.round(d/ct.sections.length*100)+'%"></i></span><b>'+d+'/'+ct.sections.length+'</b></button>';}).join('');});
  return'<h4 class="eyebrow" style="margin:18px 0 6px">Study time</h4><div class="stats"><div><b>'+total.toFixed(1)+' h</b><span>Tracked on this page (of about '+plan+' h planned)</span></div><div><b>'+wk.toFixed(1)+' h</b><span>Last 7 days</span></div></div>'+
   '<div class="prog"><i style="width:'+Math.min(100,Math.round(total/Math.max(plan,1)*100))+'%"></i></div><p class="sub">Time counts only while this page is open and you are active.</p>'+
   '<h4 class="eyebrow" style="margin:14px 0 6px">Last 12 weeks</h4><div class="heat" aria-label="Study heat map">'+cells+'</div>'+
   '<h4 class="eyebrow" style="margin:14px 0 4px">Chapter progress (sections understood)</h4>'+rows;
}

/* ---------- boot ---------- */
function start(d){
  d=d||{};
  if(d.view==='subject'&&subj(d.subj)){V.view='subject';V.subj=d.subj;V.unit=d.unit||'3';if(d.sel&&findCh(d.sel))V.sel=d.sel;}
  if(S.flash&&Date.now()-S.flash.t<120000){
    const f=findCh(S.flash.id);
    if(f){V.view='subject';V.subj=f.s.id;V.unit=f.u;V.sel=f.ch.id;toast(f.s.name+' · chapter '+numOf(f.ch,f.i)+' is now: '+LABEL[effStatus(f.ch.id)]);}
  }
  FLASH0=performance.now();
  resize();chrome();renderPanel();
  window.addEventListener('resize',resize);
  if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({view:V.view,subj:V.subj,unit:V.unit,sel:V.sel}));
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
  requestAnimationFrame(frame);
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start(window.claude&&window.claude.hot&&window.claude.hot.data?window.claude.hot.data:{});
})();
</script>
