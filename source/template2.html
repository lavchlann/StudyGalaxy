ntiate $u^4$ and the inside separately.","Multiply and substitute back."]},{"topic":"Root chain","q":"Differentiate $y=\\sqrt{x^2+16}$.","a":"x/sqrt(x^2+16)","alt":["x/(x^2+16)^(1/2)","x/\u221a(x^2+16)"],"ad":"$\\dfrac{x}{\\sqrt{x^2+16}}$","sol":"Write $y=(x^2+16)^{1/2}$. || Outside derivative: $\\frac12(x^2+16)^{-1/2}$. || Inside derivative: $2x$. || Multiply: $\\frac12\\times2x\\,(x^2+16)^{-1/2}=\\frac{x}{\\sqrt{x^2+16}}$.","h":["Write the root as a power $\\frac12$.","The inside derivative is $2x$.","Simplify $\\frac12\\times2x$."]},{"topic":"Exponential chain","q":"Differentiate $y=e^{\\sin x}$.","a":"cosxe^(sinx)","alt":["cos(x)e^(sin(x))","e^(sinx)cosx","cosx e^sinx"],"ad":"$\\cos x\\,e^{\\sin x}$","sol":"The outside is $e^{(\\ )}$, which differentiates to itself. || The inside is $\\sin x$, whose derivative is $\\cos x$. || Multiply: $e^{\\sin x}\\times\\cos x$. || So $\\frac{dy}{dx}=\\cos x\\,e^{\\sin x}$.","h":["The outside is the exponential.","Inside derivative of $\\sin x$.","Multiply."]},{"topic":"Gradient","q":"Find the gradient of $y=(x^2-3)^3$ at $x=2$.","a":"12","alt":["m=12"],"ad":"$12$","sol":"Chain rule: $\\frac{dy}{dx}=3(x^2-3)^2\\times2x=6x(x^2-3)^2$. || Substitute $x=2$: $6(2)(4-3)^2$. || $=12\\times1$. || The gradient is 12.","h":["Differentiate with the chain rule.","Substitute $x=2$.","$(4-3)^2=1$."]},{"topic":"Three layers","q":"Differentiate $y=\\cos^2(3x)$.","a":"-6sin(3x)cos(3x)","alt":["-6cos(3x)sin(3x)","-3sin(6x)"],"ad":"$-6\\sin(3x)\\cos(3x)$ (or $-3\\sin6x$)","sol":"Rewrite as $y=\\big(\\cos(3x)\\big)^2$. || Outside: $2\\cos(3x)$. || Inside: $\\frac{d}{dx}\\cos(3x)=-3\\sin(3x)$. || Multiply: $2\\cos(3x)\\times(-3\\sin(3x))=-6\\sin(3x)\\cos(3x)$, which also equals $-3\\sin(6x)$.","h":["$\\cos^2(3x)=(\\cos3x)^2$.","Differentiate the square first.","Then $\\cos(3x)$ with its chain factor 3."]}]},{"id":"mm3-c03-s2","code":"3.3","title":"The product rule","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: product rule","url":"https://www.youtube.com/results?search_query=Joel+Speranza+product+rule","kind":"search"},{"src":"B","title":"3Blue1Brown: Visualizing the chain rule and product rule","url":"https://www.youtube.com/watch?v=YG15m2VwSjA","kind":"video"}]},{"t":"p","x":"**What this topic is about.** The product rule differentiates two functions of $x$ multiplied together, such as $x^2e^{3x}$, $x\\ln x$ or $x\\sin x$. Products are everywhere in modelling: a damped oscillation $e^{-t}\\sin t$, or a drug model $te^{-t}$."},{"t":"key","x":"$$\\frac{d}{dx}(uv)=u'v+uv'\\qquad\\text{(derivative of the first times the second, plus the first times the derivative of the second)}$$"},{"t":"p","x":"**Why not just multiply the derivatives?** Try $y=x\\cdot x=x^2$. The true derivative is $2x$. Multiplying the derivatives would give $1\\times1=1$, which is wrong. The product rule gives $1\\cdot x+x\\cdot1=2x$, correct. Geometrically, if a rectangle has sides $u$ and $v$ that both grow, the area grows by a strip along each side: $u'v+uv'$."},{"t":"p","x":"**A safe layout.** Write four things in a small table before assembling: $u=\\ \\ $, $v=\\ \\ $, $u'=\\ \\ $, $v'=\\ \\ $. Each of $u'$ and $v'$ may need its own chain rule. Then assemble $u'v+uv'$ and **factorise** the common factors. Factorising is not optional: to find stationary points you need a product of factors set equal to zero."},{"t":"p","x":"**Factorising tips.** With exponentials, factor out the exponential with the smaller power: $2xe^{3x}+3x^2e^{3x}=xe^{3x}(2+3x)$. With logs and powers of $x$: $3x^2\\ln x+x^2=x^2(3\\ln x+1)$. Remember $e^{kx}>0$ always, so that factor never gives a stationary point."},{"t":"ex","title":"Product of a power and an exponential (full working)","q":"Differentiate $y=x^2e^{3x}$ and fully factorise.","s":["**Set up:** $u=x^2$, $v=e^{3x}$.","**Derivatives:** $u'=2x$; $v'=3e^{3x}$ (chain rule).","**Assemble $u'v+uv'$:** $2x\\cdot e^{3x}+x^2\\cdot3e^{3x}$.","**Identify common factors:** both terms contain $x$ and $e^{3x}$.","**Factorise:** $xe^{3x}(2+3x)$."],"a":"$\\dfrac{dy}{dx}=xe^{3x}(3x+2)$"},{"t":"ex","title":"Stationary points with the product rule (full working)","q":"Find the stationary points of $y=x^2e^{-x}$.","s":["**Set up:** $u=x^2$, $u'=2x$; $v=e^{-x}$, $v'=-e^{-x}$.","**Assemble:** $y'=2xe^{-x}+x^2(-e^{-x})=2xe^{-x}-x^2e^{-x}$.","**Factorise:** $y'=xe^{-x}(2-x)$.","**Set to zero:** a product is zero when a factor is zero. $x=0$, or $2-x=0\\Rightarrow x=2$. $e^{-x}$ is never zero.","**Find $y$-values:** $y(0)=0$; $y(2)=4e^{-2}\\approx0.541$.","**Nature by sign test:** $y'$ is negative for $x\u003c0$, positive for $0\u003cx\u003c2$, negative for $x>2$. So $(0,0)$ is a minimum and $(2,4e^{-2})$ is a maximum."],"a":"Minimum $(0,0)$; maximum $\\left(2,\\ 4e^{-2}\\right)$"},{"t":"ex","title":"Product with a log (full working)","q":"Find the stationary point of $y=x\\ln x$ ($x>0$).","s":["**Set up:** $u=x$, $u'=1$; $v=\\ln x$, $v'=\\frac1x$.","**Assemble:** $y'=1\\cdot\\ln x+x\\cdot\\frac1x=\\ln x+1$.","**Set to zero:** $\\ln x=-1\\Rightarrow x=e^{-1}$.","**$y$-value:** $y=e^{-1}\\ln e^{-1}=e^{-1}\\times(-1)=-e^{-1}$.","**Nature:** $y''=\\frac1x>0$, so it is a minimum."],"a":"Minimum at $\\left(e^{-1},\\,-e^{-1}\\right)$"},{"t":"ex","title":"Product of three factors (full working)","q":"Differentiate $y=x^2e^x\\sin x$.","s":["**Extend the product rule:** for $uvw$, $(uvw)'=u'vw+uv'w+uvw'$ (differentiate one factor at a time, keeping the others).","**Derivatives:** $u=x^2$, $u'=2x$; $v=e^x$, $v'=e^x$; $w=\\sin x$, $w'=\\cos x$.","**Assemble:** $2x\\,e^x\\sin x+x^2e^x\\sin x+x^2e^x\\cos x$.","**Factorise $xe^x$:** $xe^x\\big(2\\sin x+x\\sin x+x\\cos x\\big)$."],"a":"$xe^x\\left(2\\sin x+x\\sin x+x\\cos x\\right)$"},{"t":"warn","x":"$(uv)'\\neq u'v'$. Also take care with signs inside $v'$: $\\frac{d}{dx}e^{-x}=-e^{-x}$ and $\\frac{d}{dx}\\cos x=-\\sin x$. Write $u'$ and $v'$ separately first."},{"t":"p","x":"**Exam tip.** In technology-free papers you must show the product-rule line before simplifying. A bare final answer with an error gets no method mark."},{"t":"tb","rec":"1,5,6,8,10,11,12","ext":"14,16,17,19","x":"Exercise 3.3 uses the product rule alone and combined with chain rule, then finds tangents and turning points.","code":"3.3"}],"checks":[{"topic":"Product rule","q":"Differentiate $y=x^3e^{2x}$.","a":"x^2e^(2x)(2x+3)","alt":["e^(2x)x^2(2x+3)","3x^2e^(2x)+2x^3e^(2x)","x^2e^(2x)(3+2x)"],"ad":"$x^2e^{2x}(2x+3)$","sol":"$u=x^3$, $u'=3x^2$; $v=e^{2x}$, $v'=2e^{2x}$. || $u'v+uv'=3x^2e^{2x}+2x^3e^{2x}$. || Both terms share $x^2e^{2x}$. || Factorise: $x^2e^{2x}(3+2x)$.","h":["Write $u$, $v$, $u'$, $v'$.","$v'$ needs the chain rule.","Factor out $x^2e^{2x}$."]},{"topic":"Product with trig","q":"Differentiate $y=x\\sin x$.","a":"sinx+xcosx","alt":["sin(x)+xcos(x)","xcosx+sinx"],"ad":"$\\sin x+x\\cos x$","sol":"$u=x$, $u'=1$; $v=\\sin x$, $v'=\\cos x$. || Product rule: $u'v+uv'=1\\cdot\\sin x+x\\cos x$. || There is no common factor to take out. || So $\\frac{dy}{dx}=\\sin x+x\\cos x$.","h":["Identify $u$ and $v$.","$u'=1$.","Assemble $u'v+uv'$."]},{"topic":"Gradient","q":"Find the gradient of $y=xe^{x}$ at $x=1$. Give an exact answer.","a":"2e","alt":[],"ad":"$2e$","sol":"$y'=1\\cdot e^x+x\\cdot e^x=e^x(1+x)$. || Substitute $x=1$: $e^1(1+1)$. || $=2e$. || The gradient is $2e\\approx5.44$.","h":["Product rule with $u=x$, $v=e^x$.","Factorise $e^x$.","Substitute $x=1$."]},{"topic":"Stationary point","q":"Find the $x$-coordinate of the stationary point of $y=xe^{-2x}$.","a":"1/2","alt":["0.5","x=1/2"],"ad":"$x=\\tfrac12$","sol":"$u=x$, $u'=1$; $v=e^{-2x}$, $v'=-2e^{-2x}$. || $y'=e^{-2x}-2xe^{-2x}=e^{-2x}(1-2x)$. || $e^{-2x}\\neq0$, so $1-2x=0$. || $x=\\frac12$.","h":["Product rule.","Factor out $e^{-2x}$.","Set the other factor to zero."]},{"topic":"Product with log","q":"Differentiate $y=x^2\\ln x$.","a":"x(2lnx+1)","alt":["2xlnx+x","x(2ln(x)+1)","2xln(x)+x"],"ad":"$x(2\\ln x+1)$","sol":"$u=x^2$, $u'=2x$; $v=\\ln x$, $v'=\\frac1x$. || $u'v+uv'=2x\\ln x+x^2\\cdot\\frac1x$. || Simplify: $2x\\ln x+x$. || Factorise: $x(2\\ln x+1)$.","h":["$v'=\\frac1x$.","$x^2\\cdot\\frac1x=x$.","Factor out $x$."]}]},{"id":"mm3-c03-s3","code":"3.4","title":"The quotient rule","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: quotient rule","url":"https://www.youtube.com/results?search_query=Joel+Speranza+quotient+rule","kind":"search"}]},{"t":"p","x":"**What this topic is about.** The quotient rule differentiates one function divided by another, such as $\\frac{x}{x^2+1}$, $\\frac{e^{2x}}{x}$ or $\\frac{\\ln x}{x}$. Quotients model concentrations, averages and efficiencies, and they appear in stationary-point and tangent questions."},{"t":"key","x":"$$\\frac{d}{dx}\\left(\\frac uv\\right)=\\frac{u'v-uv'}{v^2}$$ Memory aid: \"low d-high minus high d-low, over low squared\", where high $=u$ (top) and low $=v$ (bottom)."},{"t":"p","x":"**Order matters.** Unlike the product rule, the quotient rule has a **minus** sign, so swapping the two terms in the numerator flips the sign of your answer. Check your order with a simple case: $\\frac{x}{1}$ should differentiate to 1; with $u=x,v=1$: $\\frac{1\\cdot1-x\\cdot0}{1}=1$ \u2713."},{"t":"p","x":"**Quotient or product?** Any quotient can be written as a product with a negative power: $\\frac{u}{v}=uv^{-1}$. If the bottom is a single power of $x$ (like $x^3$) it is often quicker to rewrite and use the product rule or even just the power rule. If the bottom is a sum ($x^2+1$), the quotient rule is usually cleaner."},{"t":"p","x":"**Simplifying the result.** Expand the numerator carefully with brackets, collect like terms, and factorise if possible. Usually leave the denominator as $v^2$ (do not expand it). Then common factors between top and bottom may cancel."},{"t":"ex","title":"Quotient with a polynomial bottom (full working)","q":"Differentiate $y=\\dfrac{x}{x^2+1}$ and find the stationary points.","s":["**Set up:** $u=x$, $u'=1$; $v=x^2+1$, $v'=2x$.","**Apply the rule:** $y'=\\dfrac{1\\cdot(x^2+1)-x\\cdot2x}{(x^2+1)^2}$.","**Simplify the numerator:** $x^2+1-2x^2=1-x^2$. So $y'=\\dfrac{1-x^2}{(x^2+1)^2}$.","**Stationary points:** a fraction is zero when its numerator is zero: $1-x^2=0\\Rightarrow x=\\pm1$.","**$y$-values:** $y(1)=\\frac12$, $y(-1)=-\\frac12$.","**Nature:** $y'$ is positive between $-1$ and $1$ and negative outside, so $\\left(1,\\frac12\\right)$ is a maximum and $\\left(-1,-\\frac12\\right)$ a minimum."],"a":"$y'=\\dfrac{1-x^2}{(x^2+1)^2}$; max $\\left(1,\\frac12\\right)$, min $\\left(-1,-\\frac12\\right)$"},{"t":"ex","title":"Quotient with an exponential (full working)","q":"Differentiate $y=\\dfrac{e^{2x}}{x}$.","s":["**Set up:** $u=e^{2x}$, $u'=2e^{2x}$; $v=x$, $v'=1$.","**Apply the rule:** $y'=\\dfrac{2e^{2x}\\cdot x-e^{2x}\\cdot1}{x^2}$.","**Factorise the numerator:** $e^{2x}(2x-1)$.","**Final form:** $y'=\\dfrac{e^{2x}(2x-1)}{x^2}$.","**Note:** this is zero only when $2x-1=0$, i.e. $x=\\frac12$, because $e^{2x}>0$."],"a":"$\\dfrac{e^{2x}(2x-1)}{x^2}$"},{"t":"ex","title":"Quotient with a log (full working)","q":"Find the maximum value of $y=\\dfrac{\\ln x}{x}$ for $x>0$.","s":["**Set up:** $u=\\ln x$, $u'=\\frac1x$; $v=x$, $v'=1$.","**Apply the rule:** $y'=\\dfrac{\\frac1x\\cdot x-\\ln x\\cdot1}{x^2}=\\dfrac{1-\\ln x}{x^2}$.","**Set to zero:** $1-\\ln x=0\\Rightarrow x=e$.","**Nature:** for $x\u003ce$, $\\ln x\u003c1$ so $y'>0$; for $x>e$, $y'\u003c0$. Increasing then decreasing: a maximum.","**Maximum value:** $y(e)=\\dfrac{\\ln e}{e}=\\dfrac1e$."],"a":"Maximum value $\\frac{1}{e}$ at $x=e$"},{"t":"ex","title":"Quotient with trig, simplified with an identity (full working)","q":"Differentiate $y=\\dfrac{\\cos x}{1+\\sin x}$ and simplify.","s":["**Set up:** $u=\\cos x$, $u'=-\\sin x$; $v=1+\\sin x$, $v'=\\cos x$.","**Apply the rule:** $y'=\\dfrac{-\\sin x(1+\\sin x)-\\cos x\\cdot\\cos x}{(1+\\sin x)^2}$.","**Expand the numerator:** $-\\sin x-\\sin^2x-\\cos^2x$.","**Use $\\sin^2x+\\cos^2x=1$:** numerator $=-\\sin x-1=-(1+\\sin x)$.","**Cancel one factor of $(1+\\sin x)$:** $y'=\\dfrac{-(1+\\sin x)}{(1+\\sin x)^2}=-\\dfrac1{1+\\sin x}$."],"a":"$-\\dfrac{1}{1+\\sin x}$"},{"t":"warn","x":"Writing $\\frac{uv'-u'v}{v^2}$ (wrong order) gives the negative of the correct answer. Also do not cancel terms across a minus sign in the numerator before simplifying properly."},{"t":"p","x":"**Exam tip.** If a question says \"hence find the stationary points\", only the numerator matters: set it equal to zero and remember to exclude values that make the denominator zero."},{"t":"tb","rec":"1,3,5,7,11","ext":"13,14,17,20","x":"Exercise 3.4 practises quotient rule with every function type learned so far.","code":"3.4"}],"checks":[{"topic":"Quotient","q":"Differentiate $y=\\dfrac{x}{x+3}$.","a":"3/(x+3)^2","alt":[],"ad":"$\\dfrac{3}{(x+3)^2}$","sol":"$u=x$, $u'=1$; $v=x+3$, $v'=1$. || $y'=\\frac{1(x+3)-x(1)}{(x+3)^2}$. || Numerator: $x+3-x=3$. || So $y'=\\frac{3}{(x+3)^2}$.","h":["Low d-high minus high d-low.","Both derivatives are 1.","Simplify the numerator."]},{"topic":"Quotient with e","q":"Differentiate $y=\\dfrac{e^{x}}{x^2}$.","a":"e^x(x-2)/x^3","alt":["(e^x(x-2))/x^3","e^x(x-2)/x^3"],"ad":"$\\dfrac{e^x(x-2)}{x^3}$","sol":"$u=e^x$, $u'=e^x$; $v=x^2$, $v'=2x$. || $y'=\\frac{e^x\\cdot x^2-e^x\\cdot2x}{x^4}$. || Factorise the numerator: $xe^x(x-2)$. || Cancel one $x$: $y'=\\frac{e^x(x-2)}{x^3}$.","h":["$v^2=x^4$.","Factor $xe^x$ from the numerator.","Cancel an $x$."]},{"topic":"Quotient with trig","q":"Differentiate $y=\\dfrac{\\sin x}{x}$.","a":"(xcosx-sinx)/x^2","alt":["(x cos x - sin x)/x^2","(xcos(x)-sin(x))/x^2"],"ad":"$\\dfrac{x\\cos x-\\sin x}{x^2}$","sol":"$u=\\sin x$, $u'=\\cos x$; $v=x$, $v'=1$. || $y'=\\frac{\\cos x\\cdot x-\\sin x\\cdot1}{x^2}$. || Tidy the numerator: $x\\cos x-\\sin x$. || So $y'=\\frac{x\\cos x-\\sin x}{x^2}$.","h":["Top is $\\sin x$, bottom is $x$.","Keep the order.","Bottom squared is $x^2$."]},{"topic":"Stationary point","q":"Find the $x$-coordinate of the stationary point of $y=\\dfrac{\\ln x}{x^2}$.","a":"sqrte","alt":["e^(1/2)","\u221ae","sqrt(e)"],"ad":"$x=\\sqrt e$","sol":"$u=\\ln x$, $u'=\\frac1x$; $v=x^2$, $v'=2x$. || $y'=\\frac{\\frac1x\\cdot x^2-\\ln x\\cdot2x}{x^4}=\\frac{x-2x\\ln x}{x^4}=\\frac{1-2\\ln x}{x^3}$. || Set the numerator to zero: $\\ln x=\\frac12$. || So $x=e^{1/2}=\\sqrt e$.","h":["Apply the quotient rule.","Simplify by cancelling $x$.","Solve $1-2\\ln x=0$."]},{"topic":"Value of derivative","q":"Find $f'(0)$ for $f(x)=\\dfrac{x+1}{x^2+1}$.","a":"1","alt":[],"ad":"$1$","sol":"$u=x+1$, $u'=1$; $v=x^2+1$, $v'=2x$. || $f'(x)=\\frac{(x^2+1)-(x+1)2x}{(x^2+1)^2}=\\frac{1-2x-x^2}{(x^2+1)^2}$. || Substitute $x=0$: $\\frac{1}{1}$. || $f'(0)=1$.","h":["Quotient rule.","Expand $(x+1)2x$.","Substitute $x=0$."]}]},{"id":"mm3-c03-s4","code":"3.5","title":"Applications of differentiation","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: tangents normals and optimisation","url":"https://www.youtube.com/results?search_query=Joel+Speranza+tangents+normals+and+optimisation","kind":"search"}]},{"t":"p","x":"**What this topic is about.** Using the rules to answer applied questions: tangents and normals, rates of change in context, kinematics (displacement, velocity, acceleration) and simple optimisation. This is where derivatives earn most of their marks in the exam."},{"t":"key","x":"**Tangent at $x=a$:** $y-f(a)=f'(a)(x-a)$. **Normal at $x=a$:** gradient $-\\frac{1}{f'(a)}$ (perpendicular gradients multiply to $-1$). If $f'(a)=0$ the tangent is horizontal and the normal is the vertical line $x=a$."},{"t":"key","x":"**Kinematics:** displacement $x(t)$; velocity $v=\\frac{dx}{dt}$; acceleration $a=\\frac{dv}{dt}$. \"At rest\" means $v=0$. \"Initially\" means $t=0$. Speed is $|v|$. The particle moves in the positive direction when $v>0$."},{"t":"p","x":"**Tangent and normal routine.** (1) Find the point $(a,f(a))$. (2) Differentiate. (3) Substitute to get the gradient $m=f'(a)$. (4) Tangent: $y-y_1=m(x-x_1)$. (5) Normal: use $-\\frac1m$. (6) Rearrange to the form asked (usually $y=mx+c$ or $ax+by+c=0$). Give exact values."},{"t":"p","x":"**Rates of change in context.** \"How fast\", \"rate of change\", \"rate of increase\" all mean the derivative with respect to time (or the stated variable). Always give units: if $V$ is in litres and $t$ in minutes, $\\frac{dV}{dt}$ is in litres per minute. A negative rate means decreasing."},{"t":"ex","title":"Tangent and normal (full working)","q":"Find the equations of the tangent and normal to $y=xe^{x}$ at $x=0$.","s":["**Point:** $y=0\\cdot e^0=0$, so $(0,0)$.","**Derivative (product rule):** $y'=e^x+xe^x=e^x(1+x)$.","**Gradient:** at $x=0$, $m=e^0(1)=1$.","**Tangent:** $y-0=1(x-0)\\Rightarrow y=x$.","**Normal gradient:** $-\\frac1m=-1$, so the normal is $y=-x$."],"a":"Tangent $y=x$; normal $y=-x$"},{"t":"ex","title":"Kinematics (full working)","q":"A particle moves with displacement $x=te^{-0.5t}$ m for $t\\ge0$ s. Find when it is at rest, its displacement then, and its acceleration at that time.","s":["**Velocity (product rule):** $u=t$, $u'=1$; $v=e^{-0.5t}$, $v'=-0.5e^{-0.5t}$. So $v=e^{-0.5t}-0.5te^{-0.5t}=e^{-0.5t}(1-0.5t)$.","**At rest:** $v=0\\Rightarrow1-0.5t=0\\Rightarrow t=2$ s.","**Displacement then:** $x(2)=2e^{-1}\\approx0.736$ m.","**Acceleration:** differentiate $v=e^{-0.5t}(1-0.5t)$ with the product rule: $a=-0.5e^{-0.5t}(1-0.5t)+e^{-0.5t}(-0.5)=e^{-0.5t}(0.25t-1)$.","**At $t=2$:** $a=e^{-1}(0.5-1)=-0.5e^{-1}\\approx-0.184$ m/s$^2$."],"a":"At rest at $t=2$ s, $x\\approx0.736$ m, $a\\approx-0.18$ m/s\u00b2"},{"t":"ex","title":"Rate of change with a quotient (full working)","q":"A drug's concentration is $C=\\dfrac{20t}{t^2+4}$ mg/L after $t$ hours. Find when the concentration is greatest and its value.","s":["**Quotient rule:** $u=20t$, $u'=20$; $v=t^2+4$, $v'=2t$.","**Derivative:** $C'=\\dfrac{20(t^2+4)-20t\\cdot2t}{(t^2+4)^2}=\\dfrac{80-20t^2}{(t^2+4)^2}=\\dfrac{20(4-t^2)}{(t^2+4)^2}$.","**Set to zero:** $4-t^2=0\\Rightarrow t=2$ (time is positive).","**Check it is a maximum:** for $0\u003ct\u003c2$, $C'>0$ (rising); for $t>2$, $C'\u003c0$ (falling).","**Value:** $C(2)=\\dfrac{40}{8}=5$ mg/L."],"a":"Greatest after 2 hours, at 5 mg/L"},{"t":"ex","title":"Simple optimisation (full working)","q":"A rectangle has perimeter 40 cm. Find the dimensions that give the largest area.","s":["**Variables:** let the width be $x$; then the length is $20-x$ (half the perimeter is 20).","**Area function:** $A=x(20-x)=20x-x^2$, with $0\u003cx\u003c20$.","**Differentiate:** $A'=20-2x$.","**Set to zero:** $x=10$.","**Confirm a maximum:** $A''=-2\u003c0$.","**Answer:** $10$ cm by $10$ cm (a square), area $100$ cm$^2$."],"a":"$10\\times10$ cm, area $100$ cm\u00b2"},{"t":"warn","x":"The normal's gradient is the **negative reciprocal**, not just the negative. And for kinematics, \"at rest\" is $v=0$, not $x=0$."},{"t":"p","x":"**Exam tip.** Write a concluding sentence with units for every applied answer, e.g. \"The particle is at rest after 2 seconds, 0.74 m from the origin\"."},{"t":"tb","rec":"1,5,7,10,11,12","ext":"13,15,19,20","x":"Exercise 3.5 applies the rules to tangents and normals, rates of change, kinematics and optimisation.","code":"3.5"}],"checks":[{"topic":"Tangent","q":"Find the equation of the tangent to $y=x^2e^{x}$ at $x=0$.","a":"y=0","alt":["0"],"ad":"$y=0$","sol":"Point: $y=0$, so $(0,0)$. || Derivative: $y'=2xe^x+x^2e^x=xe^x(2+x)$. || Gradient at $x=0$: $0$. || Tangent: $y-0=0(x-0)$, i.e. $y=0$ (the $x$-axis).","h":["Find the point.","Product rule.","The gradient is 0."]},{"topic":"Normal","q":"Find the gradient of the normal to $y=\\ln(2x)$ at $x=1$.","a":"-1","alt":["m=-1"],"ad":"$-1$","sol":"Differentiate: $y'=\\frac1x$. || At $x=1$ the tangent gradient is 1. || The normal is perpendicular, so its gradient is $-\\frac11$. || The normal gradient is $-1$.","h":["$\\frac{d}{dx}\\ln(2x)=\\frac1x$.","Tangent gradient at $x=1$.","Negative reciprocal."]},{"topic":"At rest","q":"$x=t^3-6t^2+9t$ (m, s). When is the particle at rest?","a":"1,3","alt":["t=1,3","1 and 3","t=1 and t=3"],"ad":"$t=1$ s and $t=3$ s","sol":"Velocity: $v=\\frac{dx}{dt}=3t^2-12t+9$. || At rest means $v=0$: $3t^2-12t+9=0$. || Divide by 3 and factorise: $(t-1)(t-3)=0$. || So $t=1$ s and $t=3$ s.","h":["Differentiate to get $v$.","Set $v=0$.","Factorise the quadratic."]},{"topic":"Acceleration","q":"$x=t^3-6t^2+9t$. Find the acceleration when $t=3$.","a":"6","alt":["6 m/s^2"],"ad":"$6$ m/s\u00b2","sol":"$v=3t^2-12t+9$. || $a=\\frac{dv}{dt}=6t-12$. || Substitute $t=3$: $18-12$. || $a=6$ m/s\u00b2.","h":["Differentiate twice.","$a=6t-12$.","Substitute $t=3$."]},{"topic":"Optimisation","q":"Two numbers add to 30. Find the largest possible product.","a":"225","alt":[],"ad":"$225$","sol":"Let the numbers be $x$ and $30-x$, so $P=x(30-x)=30x-x^2$. || $P'=30-2x=0$ gives $x=15$. || $P''=-2\u003c0$, so it is a maximum. || The largest product is $15\\times15=225$.","h":["Write the product in one variable.","Differentiate and set to zero.","Evaluate $P(15)$."]}]},{"id":"mm3-c03-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Spotting the rule.** Sum or difference: differentiate term by term. Product of two functions of $x$: product rule. Fraction with $x$ in the bottom: quotient rule (or rewrite as a product). Function inside a function: chain rule. Many exam questions need two rules at once, e.g. a product whose second factor needs the chain rule."},{"t":"p","x":"**A verification habit.** After differentiating, test a value. For $y=xe^{-2x}$ at $x=0$: your $y'=e^{-2x}(1-2x)$ gives 1, and the graph visibly rises through the origin with gradient about 1. A ten-second check catches sign errors."},{"t":"ex","title":"Exam-style: rules combined (full working)","q":"Differentiate $y=\\dfrac{xe^{x}}{x+1}$ and give the answer as a single fraction.","s":["**Quotient rule with $u=xe^x$, $v=x+1$.** First find $u'$ with the product rule: $u'=e^x+xe^x=(x+1)e^x$. And $v'=1$.","**Apply:** $y'=\\dfrac{(x+1)e^x(x+1)-xe^x\\cdot1}{(x+1)^2}$.","**Factor $e^x$ from the numerator:** $e^x\\left[(x+1)^2-x\\right]$.","**Expand:** $(x+1)^2-x=x^2+2x+1-x=x^2+x+1$.","**Result:** $y'=\\dfrac{e^x(x^2+x+1)}{(x+1)^2}$."],"a":"$\\dfrac{e^x(x^2+x+1)}{(x+1)^2}$"},{"t":"ex","title":"Exam-style: chain inside product (full working)","q":"Differentiate $y=x\\sqrt{1-x^2}$ and find where the gradient is zero.","s":["**Product rule:** $u=x$, $u'=1$; $v=(1-x^2)^{1/2}$, $v'=\\frac12(1-x^2)^{-1/2}(-2x)=\\dfrac{-x}{\\sqrt{1-x^2}}$.","**Assemble:** $y'=\\sqrt{1-x^2}+x\\cdot\\dfrac{-x}{\\sqrt{1-x^2}}$.","**Common denominator:** $y'=\\dfrac{(1-x^2)-x^2}{\\sqrt{1-x^2}}=\\dfrac{1-2x^2}{\\sqrt{1-x^2}}$.","**Set the numerator to zero:** $1-2x^2=0\\Rightarrow x=\\pm\\dfrac{1}{\\sqrt2}$."],"a":"$y'=\\dfrac{1-2x^2}{\\sqrt{1-x^2}}$; zero at $x=\\pm\\frac{1}{\\sqrt2}$"},{"t":"warn","x":"Leave the denominator of a quotient-rule answer factorised, and do not forget to apply the chain rule inside a product or quotient."}],"checks":[{"topic":"Combined","q":"Differentiate $y=x^2(2x+1)^3$.","a":"2x(2x+1)^2(5x+1)","alt":["2x(5x+1)(2x+1)^2","x(2x+1)^2(10x+2)"],"ad":"$2x(2x+1)^2(5x+1)$","sol":"$u=x^2$, $u'=2x$; $v=(2x+1)^3$, $v'=3(2x+1)^2\\cdot2=6(2x+1)^2$. || $y'=2x(2x+1)^3+6x^2(2x+1)^2$. || Factor out $2x(2x+1)^2$: $2x(2x+1)^2\\left[(2x+1)+3x\\right]$. || Simplify: $2x(2x+1)^2(5x+1)$.","h":["Product rule with chain rule for $v'$.","Common factor $2x(2x+1)^2$.","Simplify the bracket."]},{"topic":"Combined quotient","q":"Differentiate $y=\\dfrac{e^{2x}}{x+1}$.","a":"e^(2x)(2x+1)/(x+1)^2","alt":["(e^(2x)(2x+1))/(x+1)^2"],"ad":"$\\dfrac{e^{2x}(2x+1)}{(x+1)^2}$","sol":"$u=e^{2x}$, $u'=2e^{2x}$; $v=x+1$, $v'=1$. || $y'=\\frac{2e^{2x}(x+1)-e^{2x}}{(x+1)^2}$. || Factor $e^{2x}$: $e^{2x}(2x+2-1)$. || $y'=\\frac{e^{2x}(2x+1)}{(x+1)^2}$.","h":["Quotient rule.","$u'$ needs the chain rule.","Factor out $e^{2x}$."]},{"topic":"Which rule","q":"Differentiate $y=\\ln(x^2+1)^3$ (that is, $\\ln\\big((x^2+1)^3\\big)$).","a":"6x/(x^2+1)","alt":["(6x)/(x^2+1)"],"ad":"$\\dfrac{6x}{x^2+1}$","sol":"Use the log power law first: $y=3\\ln(x^2+1)$. || Differentiate: $3\\times\\frac{2x}{x^2+1}$. || Multiply. || $y'=\\frac{6x}{x^2+1}$.","h":["Log laws first.","$\\frac{d}{dx}\\ln f=\\frac{f'}f$.","Multiply by 3."]},{"topic":"Tangent gradient","q":"Find the gradient of $y=x\\sqrt{x+3}$ at $x=1$.","a":"9/4","alt":["2.25"],"ad":"$\\dfrac94$","sol":"$u=x$, $u'=1$; $v=(x+3)^{1/2}$, $v'=\\frac{1}{2\\sqrt{x+3}}$. || $y'=\\sqrt{x+3}+\\frac{x}{2\\sqrt{x+3}}$. || At $x=1$: $\\sqrt4+\\frac{1}{2\\sqrt4}=2+\\frac14$. || So the gradient is $\\frac94$.","h":["Product rule.","Chain rule for the root.","Substitute $x=1$."]},{"topic":"Second derivative","q":"Find $\\dfrac{d^2y}{dx^2}$ for $y=xe^{x}$.","a":"e^x(x+2)","alt":["(x+2)e^x","xe^x+2e^x"],"ad":"$(x+2)e^x$","sol":"First derivative: $y'=e^x+xe^x=(x+1)e^x$. || Differentiate again with the product rule: $u=x+1$, $u'=1$; $v=e^x$, $v'=e^x$. || $y''=e^x+(x+1)e^x$. || Factorise: $(x+2)e^x$.","h":["Find $y'$ first.","Differentiate $(x+1)e^x$.","Factor out $e^x$."]}]}],"quiz":[{"topic":"Chain rule","q":"Differentiate $y=(4x-1)^3$.","a":"12(4x-1)^2","alt":[],"ad":"$12(4x-1)^2$","sol":"Let $u=4x-1$, so $y=u^3$. || $\\frac{dy}{du}=3u^2$ and $\\frac{du}{dx}=4$. || Chain rule: $\\frac{dy}{dx}=3u^2\\times4=12u^2$. || Substitute back: $\\frac{dy}{dx}=12(4x-1)^2$.","h":["Outside: power 3.","Inside derivative is 4.","Multiply them."]},{"topic":"Chain rule","q":"Differentiate $y=\\sqrt{x^2+9}$.","a":"x/sqrt(x^2+9)","alt":["x/(x^2+9)^(1/2)","x/\u221a(x^2+9)"],"ad":"$\\dfrac{x}{\\sqrt{x^2+9}}$","sol":"Write $y=(x^2+9)^{1/2}$. || Outside derivative: $\\frac12(x^2+9)^{-1/2}$. || Inside derivative: $2x$. || Multiply: $\\frac12\\cdot2x\\,(x^2+9)^{-1/2}=\\frac{x}{\\sqrt{x^2+9}}$.","h":["Rewrite as a power of $\\frac12$.","Inside derivative is $2x$.","Simplify the $\\frac12\\times2$."]},{"topic":"Product rule","q":"Differentiate $y=xe^{x}$.","a":"(x+1)e^x","alt":["e^x(x+1)","e^x+xe^x","xe^x+e^x"],"ad":"$(x+1)e^x$","sol":"Product rule with $u=x$, $u'=1$ and $v=e^x$, $v'=e^x$. || $u'v+uv'=1\\cdot e^x+x\\cdot e^x$. || Both terms share $e^x$. || Factorise: $(x+1)e^x$.","h":["$u=x$, $v=e^x$.","Product rule.","Factorise."]},{"topic":"Product rule","q":"Differentiate $y=x^3\\ln x$.","a":"x^2(3ln x+1)","alt":["x^2(3lnx+1)","3x^2lnx+x^2","x^2+3x^2ln(x)"],"ad":"$x^2(3\\ln x+1)$","sol":"Product rule with $u=x^3$, $u'=3x^2$ and $v=\\ln x$, $v'=\\frac1x$. || $u'v+uv'=3x^2\\ln x+x^3\\cdot\\frac1x$. || Simplify $x^3\\cdot\\frac1x=x^2$: so $3x^2\\ln x+x^2$. || Factorise: $x^2(3\\ln x+1)$.","h":["$u=x^3$, $v=\\ln x$.","$v'=\\frac1x$.","Factorise $x^2$."]},{"topic":"Quotient","q":"Differentiate $y=\\dfrac{x}{x+1}$.","a":"1/(x+1)^2","alt":["(x+1)^(-2)"],"ad":"$\\dfrac{1}{(x+1)^2}$","sol":"Quotient rule with $u=x$, $u'=1$ and $v=x+1$, $v'=1$. || $\\frac{u'v-uv'}{v^2}=\\frac{1\\cdot(x+1)-x\\cdot1}{(x+1)^2}$. || Simplify the numerator: $x+1-x=1$. || So $\\frac{dy}{dx}=\\frac{1}{(x+1)^2}$.","h":["Quotient rule.","Numerator: $(x+1)-x$.","Simplify."]},{"topic":"Quotient","q":"Differentiate $y=\\dfrac{\\sin x}{x}$.","a":"(xcosx-sinx)/x^2","alt":["(x cos x - sin x)/x^2","(xcos(x)-sin(x))/x^2"],"ad":"$\\dfrac{x\\cos x-\\sin x}{x^2}$","sol":"Quotient rule with $u=\\sin x$, $u'=\\cos x$ and $v=x$, $v'=1$. || $\\frac{u'v-uv'}{v^2}=\\frac{\\cos x\\cdot x-\\sin x\\cdot1}{x^2}$. || Keep the order: low d-high minus high d-low. || So $\\frac{dy}{dx}=\\frac{x\\cos x-\\sin x}{x^2}$.","h":["$u=\\sin x$, $v=x$.","Quotient rule.","Keep the order."]},{"topic":"Tangent","q":"Find the gradient of $y=x^2e^{-x}$ at $x=1$. Give an exact answer.","a":"1/e","alt":["e^(-1)","1e^-1"],"ad":"$e^{-1}$","sol":"Product rule: $u=x^2$, $u'=2x$; $v=e^{-x}$, $v'=-e^{-x}$. || $y'=2xe^{-x}-x^2e^{-x}=xe^{-x}(2-x)$. || Substitute $x=1$: $1\\cdot e^{-1}(2-1)$. || The gradient is $e^{-1}=\\frac1e$.","h":["Product rule.","Substitute $x=1$.","Collect terms."]},{"topic":"Stationary","q":"Find the positive $x$ where $y=x^2e^{-x}$ has a stationary point.","a":"2","alt":["x=2"],"ad":"$x=2$","sol":"From the product rule, $y'=xe^{-x}(2-x)$. || Set $y'=0$: $x=0$ or $2-x=0$ (since $e^{-x}\\neq0$). || The positive solution is $x=2$. || So the stationary point (a maximum) is at $x=2$.","h":["Product rule.","Factorise.","Set each factor to 0."]},{"topic":"Kinematics","q":"$x=t^3-6t^2$. Find the velocity when $t=1$.","a":"-9","alt":["v=-9"],"ad":"$-9$","sol":"Velocity is the derivative of displacement: $v=\\frac{dx}{dt}=3t^2-12t$. || Substitute $t=1$: $v=3(1)-12(1)$. || $v=3-12=-9$. || The velocity is $-9$ (moving in the negative direction).","h":["Velocity is the derivative.","Differentiate.","Substitute."]},{"topic":"Normal","q":"Find the gradient of the normal to $y=e^{x}$ at $x=0$.","a":"-1","alt":["m=-1"],"ad":"$-1$","sol":"Tangent gradient: $\\frac{d}{dx}e^x=e^x$, which is $e^0=1$ at $x=0$. || The normal is perpendicular, so its gradient is the negative reciprocal. || $-\\frac{1}{1}=-1$. || The normal's gradient is $-1$.","h":["Tangent gradient first.","Normal is perpendicular.","Negative reciprocal."]},{"topic":"Chain rule","q":"Differentiate $y=(3x^2+1)^4$.","a":"24x(3x^2+1)^3","alt":[],"ad":"$24x(3x^2+1)^3$","sol":"Let $u=3x^2+1$, so $y=u^4$. || $\\frac{dy}{du}=4u^3$, $\\frac{du}{dx}=6x$. || Multiply: $4u^3\\times6x=24xu^3$. || So $\\frac{dy}{dx}=24x(3x^2+1)^3$.","h":["Outer power.","Inner derivative is $6x$.","Multiply."]},{"topic":"Chain with exp","q":"Differentiate $y=e^{x^2+1}$.","a":"2xe^(x^2+1)","alt":["2x*e^(x^2+1)"],"ad":"$2xe^{x^2+1}$","sol":"The power of $e$ is $x^2+1$, with derivative $2x$. || Using $\\frac{d}{dx}e^{f}=f'e^{f}$. || Copy the exponential and multiply by $2x$. || $\\frac{dy}{dx}=2xe^{x^2+1}$.","h":["Inside is $x^2+1$.","Derivative $2x$.","Keep $e^u$."]},{"topic":"Product","q":"Differentiate $y=x^2\\ln x$.","a":"2xlnx+x","alt":["x(2lnx+1)","2xln(x)+x"],"ad":"$2x\\ln x+x$","sol":"Product rule: $u=x^2$, $u'=2x$; $v=\\ln x$, $v'=\\frac1x$. || $u'v+uv'=2x\\ln x+x^2\\cdot\\frac1x$. || $x^2\\cdot\\frac1x=x$. || So $\\frac{dy}{dx}=2x\\ln x+x$.","h":["Product rule.","$u=x^2$, $v=\\ln x$.","Simplify $x^2\\cdot\\frac1x$."]},{"topic":"Quotient","q":"Differentiate $y=\\dfrac{e^x}{x}$.","a":"e^x(x-1)/x^2","alt":["(xe^x-e^x)/x^2","(e^x(x-1))/x^2"],"ad":"$\\dfrac{e^x(x-1)}{x^2}$","sol":"Quotient rule: $u=e^x$, $u'=e^x$; $v=x$, $v'=1$. || $\\frac{dy}{dx}=\\frac{e^x\\cdot x-e^x\\cdot1}{x^2}$. || Factor $e^x$ from the numerator. || $\\frac{dy}{dx}=\\frac{e^x(x-1)}{x^2}$.","h":["Quotient rule.","$u=e^x$, $v=x$.","Factor $e^x$."]},{"topic":"Gradient","q":"Find $f'(1)$ for $f(x)=xe^{x}$. Exact.","a":"2e","alt":[],"ad":"$2e$","sol":"Product rule: $f'(x)=e^x+xe^x=e^x(1+x)$. || Substitute $x=1$: $e^1(1+1)$. || $=2e$. || So $f'(1)=2e\\approx5.44$.","h":["Product rule.","$e^x(1+x)$.","Substitute 1."]},{"topic":"Optimisation","q":"Maximise $A=x(30-x)$. What is the maximum area?","a":"225","alt":[],"ad":"$225$","sol":"Expand: $A=30x-x^2$. || Differentiate: $A'=30-2x$, and set to zero: $x=15$. || $A''=-2\u003c0$, so it is a maximum. || Maximum area: $A(15)=15\\times15=225$.","h":["Differentiate.","$30-2x=0$.","$A(15)$."]},{"topic":"Normal","q":"The tangent to $y=e^{2x}$ at $x=0$ has gradient 2. State the normal's gradient.","a":"-1/2","alt":["-0.5"],"ad":"$-\\frac12$","sol":"Perpendicular gradients multiply to $-1$: $m_{\\text{tangent}}\\times m_{\\text{normal}}=-1$. || $2\\times m=-1$. || Solve: $m=-\\frac12$. || The normal's gradient is $-\\frac12$.","h":["$m_1m_2=-1$.","$2m=-1$.","Solve."]},{"topic":"Chain","q":"Differentiate $y=\\cos(x^2)$.","a":"-2xsin(x^2)","alt":[],"ad":"$-2x\\sin(x^2)$","sol":"The angle is $x^2$, with derivative $2x$. || $\\cos$ differentiates to $-\\sin$. || Multiply: $-\\sin(x^2)\\times2x$. || $\\frac{dy}{dx}=-2x\\sin(x^2)$.","h":["Outer is cos.","Inner derivative $2x$.","Combine."]},{"topic":"Chain","q":"Differentiate $y=\\ln(5x-2)$.","a":"5/(5x-2)","alt":[],"ad":"$\\frac5{5x-2}$","sol":"The inside is $5x-2$, with derivative $5$. || $\\frac{d}{dx}\\ln f=\\frac{f'}{f}$. || Put the inside's derivative over the inside. || $\\frac{dy}{dx}=\\frac{5}{5x-2}$.","h":["$\\frac{d}{dx}\\ln f=\\frac{f'}f$.","$f'=5$.","Write it."]},{"topic":"Stationary","q":"Where is $y=xe^{-x}$ stationary?","a":"1","alt":["x=1"],"ad":"$x=1$","sol":"Product rule: $u=x$, $u'=1$; $v=e^{-x}$, $v'=-e^{-x}$. || $y'=e^{-x}-xe^{-x}=e^{-x}(1-x)$. || $e^{-x}$ is never zero, so $1-x=0$. || Stationary at $x=1$.","h":["Product rule.","Factor $e^{-x}$.","Solve $1-x=0$."]}],"comets":[{"topic":"Extension: Both rules at once","q":"Differentiate $y=\\dfrac{xe^{x}}{x+1}$. Enter your answer as a single fraction.","a":"e^x(x^2+x+1)/(x+1)^2","alt":["(e^x(x^2+x+1))/(x+1)^2","e^x*(x^2+x+1)/(x+1)^2"],"ad":"$\\dfrac{e^x(x^2+x+1)}{(x+1)^2}$","sol":"Quotient rule with $u=xe^x$ and $v=x+1$. First $u'$ (product rule): $u'=e^x+xe^x=(x+1)e^x$; and $v'=1$. || $y'=\\frac{(x+1)e^x(x+1)-xe^x}{(x+1)^2}$. || Factor out $e^x$: numerator $=e^x\\left[(x+1)^2-x\\right]=e^x(x^2+2x+1-x)$. || Simplify: $y'=\\frac{e^x(x^2+x+1)}{(x+1)^2}$.","h":["Use the product rule to get $u'$.","Then the quotient rule.","Factor out $e^x$ in the numerator."]},{"topic":"Extension: Nth derivative","q":"If $f(x)=xe^x$, find $f^{(10)}(0)$.","a":"10","alt":[],"ad":"$10$","sol":"$f'(x)=(x+1)e^x$ by the product rule. || $f''(x)=e^x+(x+1)e^x=(x+2)e^x$. || The pattern is $f^{(n)}(x)=(x+n)e^x$ (each differentiation adds 1 to the constant). || So $f^{(10)}(0)=(0+10)e^0=10$.","h":["Compute $f'$, $f''$.","Pattern: $(x+n)e^x$.","Substitute."]}],"cards":[{"type":"def","topic":"The chain rule","f":"State the chain rule in Leibniz notation.","b":"$\\dfrac{dy}{dx}=\\dfrac{dy}{du}\\cdot\\dfrac{du}{dx}$"},{"type":"def","topic":"The chain rule","f":"Shortcut for $\\frac{d}{dx}(ax+b)^n$?","b":"$na(ax+b)^{n-1}$"},{"type":"def","topic":"The product rule","f":"State the product rule.","b":"$\\dfrac{d}{dx}(uv)=u'v+uv'$"},{"type":"def","topic":"The product rule","f":"Why factorise after using the product rule?","b":"To solve $y'=0$ easily: each factor can be set to zero, and factors like $e^{kx}$ are never zero."},{"type":"def","topic":"The quotient rule","f":"State the quotient rule.","b":"$\\dfrac{d}{dx}\\left(\\dfrac uv\\right)=\\dfrac{u'v-uv'}{v^2}$ (bottom times derivative of top, minus top times derivative of bottom, over bottom squared)."},{"type":"word","topic":"Applications of differentiation","f":"$x=t^3-6t^2+9t$ (m, s). When is the particle at rest?","b":"$v=3t^2-12t+9=3(t-1)(t-3)=0$ at $t=1$ s and $t=3$ s."},{"type":"word","topic":"Applications of differentiation","f":"Find the tangent to $y=xe^x$ at $x=0$.","b":"$y'=e^x(1+x)$, gradient 1 at $(0,0)$: tangent $y=x$."},{"type":"word","topic":"Applications of differentiation","f":"$C=\\frac{20t}{t^2+4}$. Why is $t=2$ a maximum?","b":"$C'=\\frac{20(4-t^2)}{(t^2+4)^2}$ is positive before $t=2$ and negative after, so $C$ rises then falls."},{"type":"def","topic":"Applications of differentiation","f":"Gradient of the normal if the tangent has gradient $m$?","b":"$-\\frac1m$ (the negative reciprocal), because perpendicular gradients multiply to $-1$."}],"hours":4},"mm3-c04":{"id":"mm3-c04","interactive":"concavity","summary":"The first derivative tells you where a graph rises and falls; the second derivative tells you how it bends. This chapter uses both to classify stationary points, find points of inflection, sketch curves, and solve optimisation problems.","videos":[{"src":"B","title":"Higher order derivatives (3Blue1Brown, ch. 10)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Higher+order+derivatives+Essence+of+calculus+chapter+10","kind":"search"},{"src":"J","title":"Second derivative and concavity","url":"https://www.youtube.com/results?search_query=Joel+Speranza+second+derivative+concavity","kind":"search"},{"src":"J","title":"Curve sketching","url":"https://www.youtube.com/results?search_query=Joel+Speranza+curve+sketching+calculus","kind":"search"},{"src":"J","title":"Optimisation problems","url":"https://www.youtube.com/results?search_query=Joel+Speranza+optimisation+calculus","kind":"search"}],"sections":[{"id":"mm3-c04-s1","code":"4.2","title":"The second derivative","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: second derivative","url":"https://www.youtube.com/results?search_query=Joel+Speranza+second+derivative","kind":"search"},{"src":"B","title":"3Blue1Brown: Higher order derivatives","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Higher+order+derivatives","kind":"search"}]},{"t":"p","x":"**What this topic is about.** The second derivative is the derivative of the derivative. It tells you how the gradient itself is changing, which describes how a graph **bends** and, in motion, gives acceleration. You will use it to classify stationary points (4.3), sketch curves (4.4) and confirm maxima and minima in optimisation (4.5)."},{"t":"key","x":"$$f''(x)=\\frac{d}{dx}\\big(f'(x)\\big)=\\frac{d^2y}{dx^2}$$ If $f''(x)>0$ the gradient is increasing: the graph is **concave up** (shaped like a cup). If $f''(x)\u003c0$ the gradient is decreasing: **concave down** (shaped like a cap)."},{"t":"p","x":"**Reading the notation.** $\\frac{d^2y}{dx^2}$ is read \"d two y by d x squared\". It is not a square of anything; it means \"differentiate $y$ with respect to $x$, twice\". Prime notation: $f'$ first derivative, $f''$ second derivative, $f'''$ third."},{"t":"p","x":"**Interpreting signs in words.** Suppose $P(t)$ is a population. $P'(t)>0$ means it is increasing. $P''(t)\u003c0$ at the same time means the increase is **slowing down** (the growth rate is falling). Exam questions often ask for exactly this kind of sentence: give the sign, say what it means for the rate, and use the context."},{"t":"key","x":"**Kinematics:** if $x(t)$ is displacement, then $v=x'(t)$ is velocity and $a=v'(t)=x''(t)$ is acceleration. A particle **speeds up** when $v$ and $a$ have the same sign, and **slows down** when they have opposite signs."},{"t":"p","x":"**How to find a second derivative safely.** Differentiate once and **simplify fully** (factorise exponentials, collect terms). Then differentiate the simplified expression. If the first derivative is a product or quotient, the second derivative needs the product or quotient rule again. Simplifying first saves a lot of algebra."},{"t":"ex","title":"Second derivative of a polynomial (full working)","q":"For $f(x)=x^4-2x^3+5x$, find $f''(x)$ and $f''(-1)$.","s":["**First derivative** (power rule on each term): $f'(x)=4x^3-6x^2+5$.","**Second derivative** (differentiate $f'$): $f''(x)=12x^2-12x$.","**Substitute $x=-1$:** $f''(-1)=12(1)-12(-1)=12+12=24$.","**Interpret:** $f''(-1)>0$, so the graph is concave up at $x=-1$."],"a":"$f''(x)=12x^2-12x$; $f''(-1)=24$"},{"t":"ex","title":"Second derivative of a product (full working)","q":"Find $f''(x)$ for $f(x)=x^3e^{-x}$.","s":["**First derivative (product rule):** $u=x^3$, $u'=3x^2$; $v=e^{-x}$, $v'=-e^{-x}$. So $f'(x)=3x^2e^{-x}-x^3e^{-x}=e^{-x}(3x^2-x^3)$.","**Second derivative (product rule again):** now $u=e^{-x}$, $u'=-e^{-x}$; $v=3x^2-x^3$, $v'=6x-3x^2$.","**Assemble:** $f''(x)=-e^{-x}(3x^2-x^3)+e^{-x}(6x-3x^2)$.","**Factor $e^{-x}$ and collect:** $e^{-x}\\left(-3x^2+x^3+6x-3x^2\\right)=e^{-x}(x^3-6x^2+6x)$."],"a":"$f''(x)=e^{-x}(x^3-6x^2+6x)$"},{"t":"ex","title":"Worded problem: speeding up or slowing down (full working)","q":"A particle has displacement $x=t^3-9t^2+24t$ m for $t\\ge0$ s. Find its velocity and acceleration at $t=3$, and decide whether it is speeding up just before and just after $t=3$.","s":["**Velocity:** $v=\\frac{dx}{dt}=3t^2-18t+24$, so $v(3)=27-54+24=-3$ m/s.","**Acceleration:** $a=\\frac{dv}{dt}=6t-18$, so $a(3)=0$ m/s$^2$.","**Just before, $t=2.5$:** $v=18.75-45+24=-2.25$ and $a=15-18=-3$. Same sign, so it is **speeding up**.","**Just after, $t=3.5$:** $v=36.75-63+24=-2.25$ and $a=21-18=3$. Opposite signs, so it is **slowing down**.","**Conclude:** at $t=3$ the particle changes from speeding up to slowing down (its speed is greatest there)."],"a":"$v(3)=-3$ m/s, $a(3)=0$; speeding up before $t=3$, slowing down after"},{"t":"ex","title":"Interpreting in context (full working)","q":"The volume of water in a tank is $V(t)=200+30t-t^2$ litres. Find $V'(5)$ and $V''(5)$ and interpret both.","s":["**First derivative:** $V'(t)=30-2t$, so $V'(5)=20$ L/min.","**Interpret $V'$:** positive, so the volume is increasing at 20 litres per minute at $t=5$.","**Second derivative:** $V''(t)=-2$, so $V''(5)=-2$ L/min$^2$.","**Interpret $V''$:** negative, so the rate of filling is decreasing: the tank is still filling, but more slowly each minute."],"a":"$V'(5)=20$ (filling at 20 L/min); $V''(5)=-2$ (the filling rate is decreasing)"},{"t":"warn","x":"Negative acceleration does **not** always mean slowing down. A particle with $v\u003c0$ and $a\u003c0$ is speeding up (moving faster in the negative direction)."},{"t":"p","x":"**Exam tip.** When asked to \"interpret\" a second derivative, mention the rate: \"the rate of increase is decreasing\" is the expected phrase, not \"it is decreasing\"."},{"t":"tb","rec":"1,2,4,8,11,12","ext":"13,14,16,17,19","x":"Exercise 4.2 computes second derivatives for every function type and interprets them in context.","code":"4.2"}],"checks":[{"topic":"Polynomial","q":"Find $f''(x)$ for $f(x)=2x^4-x^3+7x$.","a":"24x^2-6x","alt":["24x\u00b2-6x","6x(4x-1)"],"ad":"$24x^2-6x$","sol":"First derivative: $f'(x)=8x^3-3x^2+7$. || Differentiate again term by term. || $\\frac{d}{dx}8x^3=24x^2$, $\\frac{d}{dx}(-3x^2)=-6x$, $\\frac{d}{dx}7=0$. || So $f''(x)=24x^2-6x$.","h":["Differentiate once.","Differentiate again.","Constants vanish."]},{"topic":"Exponential","q":"Find $\\dfrac{d^2y}{dx^2}$ for $y=4e^{-2x}$.","a":"16e^(-2x)","alt":["16e^-2x"],"ad":"$16e^{-2x}$","sol":"First derivative: $y'=4\\times(-2)e^{-2x}=-8e^{-2x}$. || Second derivative: $y''=-8\\times(-2)e^{-2x}$. || Two negatives make a positive. || $y''=16e^{-2x}$.","h":["Each differentiation multiplies by $-2$.","$-8\\times-2=16$.","Keep $e^{-2x}$."]},{"topic":"Value","q":"Find $f''(2)$ for $f(x)=x^3-6x^2+4$.","a":"0","alt":[],"ad":"$0$","sol":"$f'(x)=3x^2-12x$. || $f''(x)=6x-12$. || $f''(2)=12-12$. || $f''(2)=0$.","h":["Differentiate twice.","$f''(x)=6x-12$.","Substitute 2."]},{"topic":"Acceleration","q":"$x=2t^3-15t^2+36t$. Find the acceleration at $t=1$.","a":"-18","alt":["-18 m/s^2"],"ad":"$-18$ m/s\u00b2","sol":"$v=\\frac{dx}{dt}=6t^2-30t+36$. || $a=\\frac{dv}{dt}=12t-30$. || At $t=1$: $12-30$. || $a=-18$ m/s\u00b2.","h":["Differentiate for $v$.","Differentiate again for $a$.","Substitute $t=1$."]},{"topic":"Interpret","q":"$P(t)$ is a population with $P'(t)=40$ and $P''(t)=-3$ at $t=6$. Which statement is correct: (A) decreasing quickly, (B) increasing at a decreasing rate, (C) increasing at an increasing rate?","a":"B","alt":["b","(B)"],"ad":"(B) increasing at a decreasing rate","sol":"$P'(6)=40>0$, so the population is increasing. || $P''(6)=-3\u003c0$, so the rate of increase is getting smaller. || Together: increasing, but more slowly. || That is statement (B).","h":["What does $P'>0$ mean?","What does $P''\u003c0$ say about the rate?","Combine both."]}]},{"id":"mm3-c04-s2","code":"4.3","title":"Concavity and points of inflection","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: concavity and points of inflection","url":"https://www.youtube.com/results?search_query=Joel+Speranza+concavity+and+points+of+inflection","kind":"search"}]},{"t":"p","x":"**What this topic is about.** Using derivatives to find and **classify** stationary points (maximum, minimum, stationary point of inflection), and finding **points of inflection** where the concavity changes. This is the core of curve sketching and of every \"find and justify the maximum\" question."},{"t":"key","x":"**Stationary point:** $f'(a)=0$ (the tangent is horizontal). **Second derivative test:** if $f''(a)>0$ it is a local minimum; if $f''(a)\u003c0$ a local maximum; if $f''(a)=0$ the test is **inconclusive**."},{"t":"key","x":"**First derivative (sign) test:** check the sign of $f'$ just to the left and right of $a$. $+\\to-$: maximum. $-\\to+$: minimum. Same sign both sides: stationary point of inflection."},{"t":"key","x":"**Point of inflection:** a point where the concavity changes, i.e. $f''(x)=0$ **and** $f''$ changes sign. If also $f'(x)=0$ it is a **stationary** point of inflection."},{"t":"p","x":"**Why the second derivative test works.** At a minimum the curve is cup-shaped (concave up), so $f''>0$. At a maximum it is cap-shaped (concave down), so $f''\u003c0$. When $f''=0$ the curve could be a min ($x^4$), a max ($-x^4$) or an inflection ($x^3$), so you must switch to the sign test."},{"t":"p","x":"**Showing the sign test in an exam.** Draw a small table: a row for $x$ values just left of, at, and right of the point, and a row for the sign of $f'$, with arrows (\u2198 \u2192 \u2197). This table is accepted as justification and earns the \"nature\" mark."},{"t":"ex","title":"Classifying with the second derivative (full working)","q":"Find and classify the stationary points of $f(x)=x^3-3x^2-9x+5$.","s":["**Differentiate:** $f'(x)=3x^2-6x-9$.","**Set to zero and factorise:** $3(x^2-2x-3)=0\\Rightarrow3(x-3)(x+1)=0$, so $x=3$ or $x=-1$.","**Find the $y$-values:** $f(3)=27-27-27+5=-22$; $f(-1)=-1-3+9+5=10$.","**Second derivative:** $f''(x)=6x-6$.","**Test $x=3$:** $f''(3)=12>0$, concave up, so $(3,-22)$ is a local minimum.","**Test $x=-1$:** $f''(-1)=-12\u003c0$, concave down, so $(-1,10)$ is a local maximum."],"a":"Local maximum $(-1,10)$; local minimum $(3,-22)$"},{"t":"ex","title":"When the second derivative test fails (full working)","q":"Find and classify the stationary point of $f(x)=x^3-3x^2+3x$.","s":["**Differentiate:** $f'(x)=3x^2-6x+3=3(x-1)^2$.","**Set to zero:** $x=1$. Point: $f(1)=1-3+3=1$, so $(1,1)$.","**Second derivative test:** $f''(x)=6x-6$, so $f''(1)=0$: inconclusive.","**Sign test:** $f'(0)=3>0$ and $f'(2)=3>0$. The gradient is positive on both sides (\u2197 \u2192 \u2197).","**Conclude:** no change of sign, so $(1,1)$ is a stationary point of inflection."],"a":"Stationary point of inflection at $(1,1)$"},{"t":"ex","title":"Point of inflection (full working)","q":"Find the point of inflection of $y=xe^{-x}$ and state where the graph is concave up.","s":["**First derivative:** $y'=e^{-x}-xe^{-x}=e^{-x}(1-x)$.","**Second derivative** (product rule on $e^{-x}(1-x)$): $y''=-e^{-x}(1-x)+e^{-x}(-1)=e^{-x}(x-2)$.","**Set $y''=0$:** $e^{-x}>0$, so $x=2$.","**Check the sign change:** for $x\u003c2$, $y''\u003c0$ (concave down); for $x>2$, $y''>0$ (concave up). It changes, so this is a point of inflection.","**Coordinates:** $y(2)=2e^{-2}$, so the point is $\\left(2,\\frac{2}{e^2}\\right)$."],"a":"Inflection at $\\left(2,\\ 2e^{-2}\\right)$; concave up for $x>2$"},{"t":"ex","title":"Inflection of a cubic (full working)","q":"Find the point of inflection of $f(x)=x^3-6x^2+9x+1$ and the gradient there.","s":["**Differentiate twice:** $f'(x)=3x^2-12x+9$; $f''(x)=6x-12$.","**Set $f''=0$:** $x=2$.","**Sign change:** $f''(1)=-6\u003c0$ and $f''(3)=6>0$, so concavity changes.","**Coordinates:** $f(2)=8-24+18+1=3$, so $(2,3)$.","**Gradient there:** $f'(2)=12-24+9=-3$ (not zero, so it is a non-stationary inflection)."],"a":"Point of inflection $(2,3)$ with gradient $-3$"},{"t":"warn","x":"$f''(a)=0$ is necessary but **not sufficient** for an inflection. $y=x^4$ has $f''(0)=0$ but $x=0$ is a minimum, because $f''=12x^2$ does not change sign."},{"t":"p","x":"**Exam tip.** State the test you use and its result in words: \"$f''(3)=12>0$, therefore a local minimum\". A bare \"min\" without justification usually loses the mark."},{"t":"int","name":"concavity","cap":"Drag the point along a cubic and watch the gradient, the sign of $f''$ and the concavity shading."},{"t":"tb","rec":"1,4,6,8,10,12","ext":"14,16,18,20","x":"Exercise 4.3 classifies stationary points with the second derivative and finds inflection points.","code":"4.3"}],"checks":[{"topic":"Classify","q":"Find and classify the stationary point of $f(x)=x^2-6x+11$.","a":"min (3,2)","alt":["minimum at (3,2)","(3,2) min","min(3,2)","(3,2) minimum"],"ad":"Local minimum at $(3,2)$","sol":"$f'(x)=2x-6=0$ gives $x=3$. || $f(3)=9-18+11=2$, so the point is $(3,2)$. || $f''(x)=2>0$. || Concave up, so $(3,2)$ is a local minimum.","h":["Set $f'(x)=0$.","Find $f(3)$.","Use the sign of $f''$."]},{"topic":"Two points","q":"Find the $x$-coordinate of the local maximum of $f(x)=x^3-12x$.","a":"-2","alt":["x=-2"],"ad":"$x=-2$","sol":"$f'(x)=3x^2-12=0$ gives $x^2=4$, so $x=\\pm2$. || $f''(x)=6x$. || $f''(-2)=-12\u003c0$: maximum; $f''(2)=12>0$: minimum. || The local maximum is at $x=-2$.","h":["Solve $3x^2-12=0$.","Two stationary points.","Negative $f''$ means maximum."]},{"topic":"Inflection","q":"Find the point of inflection of $y=x^3+3x^2-2$.","a":"(-1,0)","alt":["x=-1,y=0","(-1, 0)"],"ad":"$(-1,0)$","sol":"$y'=3x^2+6x$, $y''=6x+6$. || $y''=0$ at $x=-1$. || $y''$ changes from negative to positive there, so it is an inflection. || $y(-1)=-1+3-2=0$, giving $(-1,0)$.","h":["Differentiate twice.","Solve $y''=0$.","Check the sign change and find $y$."]},{"topic":"Sign test","q":"Classify the stationary point of $y=x^4$ at $x=0$.","a":"min","alt":["minimum","local minimum","local min"],"ad":"Local minimum","sol":"$y'=4x^3=0$ at $x=0$; $y''=12x^2=0$ there, so the second derivative test fails. || Sign test: $y'(-1)=-4\u003c0$ and $y'(1)=4>0$. || The gradient changes from negative to positive. || So $x=0$ is a local minimum.","h":["The second derivative test is inconclusive here.","Check $y'$ either side.","$-$ to $+$ means minimum."]},{"topic":"Concavity","q":"On what interval is $f(x)=x^3-6x^2$ concave down?","a":"x\u003c2","alt":["(-inf,2)","(-\u221e,2)","x\u003c2"],"ad":"$x\u003c2$","sol":"$f'(x)=3x^2-12x$, $f''(x)=6x-12$. || Concave down means $f''(x)\u003c0$. || $6x-12\u003c0\\Rightarrow x\u003c2$. || So the graph is concave down for $x\u003c2$.","h":["Find $f''$.","Concave down: $f''\u003c0$.","Solve the inequality."]}]},{"id":"mm3-c04-s3","code":"4.4","title":"Curve sketching","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: curve sketching with calculus","url":"https://www.youtube.com/results?search_query=Joel+Speranza+curve+sketching+with+calculus","kind":"search"}]},{"t":"p","x":"**What this topic is about.** Using everything about derivatives to draw an accurate sketch of a function, with all key features labelled. Sketching shows that you understand how a function behaves, and graph questions often ask you to label exact coordinates and justify their nature."},{"t":"key","x":"**Sketching checklist:** (1) **Domain** and any restrictions. (2) **Intercepts:** $y$-intercept at $x=0$; $x$-intercepts from $y=0$. (3) **Stationary points** from $f'(x)=0$, with their nature. (4) **Points of inflection** from $f''(x)=0$ with a sign change. (5) **Asymptotes** and **end behaviour** (what happens as $x\\to\\pm\\infty$). (6) Join smoothly, respecting the concavity, and **label** every feature with exact coordinates."},{"t":"p","x":"**End behaviour.** For a polynomial, the highest-power term decides: $-x^3$ goes to $-\\infty$ as $x\\to\\infty$ and to $+\\infty$ as $x\\to-\\infty$. For $xe^{-x}$, the exponential wins as $x\\to\\infty$, so $y\\to0$ (the $x$-axis is an asymptote). For $\\ln x$, there is a vertical asymptote at $x=0$."},{"t":"p","x":"**Touching versus crossing.** A repeated factor $(x-a)^2$ means the graph touches the $x$-axis at $a$ (a turning point there); a single factor means it crosses; a cubed factor $(x-a)^3$ means a stationary point of inflection on the axis."},{"t":"p","x":"**Labelling in an exam.** Write coordinates next to each feature, e.g. \"max $(1,4)$\", \"PoI $(0,2)$\". Draw asymptotes dashed with their equations. Make the curve pass exactly through labelled points with the correct shape (no extra wiggles)."},{"t":"ex","title":"Full sketch of a cubic (full working)","q":"Find all key features of $y=-x^3+3x+2$ needed for a sketch.","s":["**$y$-intercept:** $x=0\\Rightarrow y=2$, so $(0,2)$.","**$x$-intercepts:** test $x=-1$: $1-3+2=0$ \u2713, so $(x+1)$ is a factor. Dividing gives $-x^3+3x+2=-(x+1)^2(x-2)$. So $x=-1$ (repeated, the graph touches) and $x=2$ (crosses).","**Stationary points:** $y'=-3x^2+3=0\\Rightarrow x=\\pm1$. $y(-1)=1-3+2=0$; $y(1)=-1+3+2=4$.","**Nature:** $y''=-6x$. At $x=-1$, $y''=6>0$: minimum $(-1,0)$. At $x=1$, $y''=-6\u003c0$: maximum $(1,4)$.","**Inflection:** $y''=0$ at $x=0$ with a sign change, so $(0,2)$ is a point of inflection.","**End behaviour:** the leading term $-x^3$ means $y\\to-\\infty$ as $x\\to\\infty$ and $y\\to\\infty$ as $x\\to-\\infty$."],"a":"Min $(-1,0)$ touching the axis, max $(1,4)$, inflection $(0,2)$, crosses at $(2,0)$; falls to the right"},{"t":"ex","title":"Sketch of an exponential product (full working)","q":"Find the key features of $f(x)=xe^{-x}$ for $x\\ge0$.","s":["**Intercept:** $f(0)=0$; and $f(x)=0$ only when $x=0$ (since $e^{-x}>0$). So the graph starts at the origin.","**Stationary point:** $f'(x)=e^{-x}(1-x)=0\\Rightarrow x=1$, $f(1)=e^{-1}\\approx0.368$.","**Nature:** $f''(x)=e^{-x}(x-2)$; $f''(1)=-e^{-1}\u003c0$: local maximum $\\left(1,e^{-1}\\right)$.","**Inflection:** $f''=0$ at $x=2$ with a sign change: $\\left(2,2e^{-2}\\right)\\approx(2,0.271)$.","**End behaviour:** as $x\\to\\infty$, $xe^{-x}\\to0$ (the exponential decays faster than $x$ grows), so $y=0$ is a horizontal asymptote."],"a":"Starts at $(0,0)$, max $(1,e^{-1})$, inflection $(2,2e^{-2})$, approaches $y=0$"},{"t":"ex","title":"Sketch involving a log (full working)","q":"Find the key features of $y=x-2\\ln x$.","s":["**Domain:** $\\ln x$ requires $x>0$.","**Vertical asymptote:** as $x\\to0^+$, $-2\\ln x\\to+\\infty$, so $y\\to+\\infty$: the $y$-axis is an asymptote.","**Stationary point:** $y'=1-\\frac2x=0\\Rightarrow x=2$, $y=2-2\\ln2\\approx0.614$.","**Nature:** $y''=\\frac{2}{x^2}>0$ for all $x>0$, so a minimum, and the graph is concave up everywhere (no inflection).","**$x$-intercepts:** the minimum value $0.614$ is positive, so the graph never reaches the $x$-axis.","**End behaviour:** as $x\\to\\infty$, $x$ grows faster than $2\\ln x$, so $y\\to\\infty$."],"a":"Domain $x>0$, asymptote $x=0$, minimum $(2,\\,2-2\\ln2)$, concave up, no $x$-intercepts"},{"t":"warn","x":"Do not draw a turning point where there is only a point of inflection, and do not let a curve cross its asymptote unless your working shows it does. Always label exact coordinates, not just approximate ones."},{"t":"p","x":"**Exam tip.** Use your working as a table of features before drawing. A neat sketch that matches a correct table usually earns full marks even if the drawing is not perfectly to scale."},{"t":"tb","rec":"1,2,5,8,12","ext":"14,16,17,20","x":"Exercise 4.4 sketches polynomials, exponentials, logs and trig curves with all key features labelled.","code":"4.4"}],"checks":[{"topic":"Intercepts","q":"Find the $x$-intercepts of $y=x^3-4x$.","a":"-2,0,2","alt":["x=-2,0,2","0,2,-2","-2, 0, 2"],"ad":"$x=-2,\\ 0,\\ 2$","sol":"Set $y=0$: $x^3-4x=0$. || Factorise: $x(x^2-4)=x(x-2)(x+2)=0$. || So $x=0$, $x=2$ or $x=-2$. || The graph crosses the axis at $(-2,0)$, $(0,0)$ and $(2,0)$.","h":["Set $y=0$.","Take out $x$.","Difference of two squares."]},{"topic":"Touch or cross","q":"At which $x$ does $y=(x-1)^2(x+3)$ touch the $x$-axis without crossing?","a":"1","alt":["x=1"],"ad":"$x=1$","sol":"The factor $(x-1)^2$ is repeated (squared). || A squared factor does not change sign, so the graph touches the axis there. || The single factor $(x+3)$ gives a crossing at $x=-3$. || So it touches at $x=1$.","h":["Look at the powers of the factors.","Even power: touch.","Odd (single) power: cross."]},{"topic":"Stationary points","q":"Find the coordinates of the local maximum of $y=x^3-3x^2$.","a":"(0,0)","alt":["x=0,y=0","(0, 0)"],"ad":"$(0,0)$","sol":"$y'=3x^2-6x=3x(x-2)=0$ gives $x=0$ or $x=2$. || $y''=6x-6$: $y''(0)=-6\u003c0$, so $x=0$ is a maximum. || $y(0)=0$. || The local maximum is $(0,0)$.","h":["Factorise $y'$.","Test each with $y''$.","Find $y$ at the maximum."]},{"topic":"End behaviour","q":"For $y=xe^{-x}$, what does $y$ approach as $x\\to\\infty$?","a":"0","alt":["y=0","0 (y=0 asymptote)"],"ad":"$0$ (the $x$-axis is an asymptote)","sol":"As $x\\to\\infty$, $x$ grows without bound. || But $e^{-x}=\\frac{1}{e^x}$ shrinks much faster. || The product $\\frac{x}{e^x}\\to0$. || So $y\\to0$ and $y=0$ is a horizontal asymptote.","h":["Rewrite as $\\frac{x}{e^x}$.","Which grows faster, $x$ or $e^x$?","The fraction tends to 0."]},{"topic":"Inflection on a sketch","q":"Find the $x$-coordinate of the point of inflection of $y=x^3-6x^2+5$.","a":"2","alt":["x=2"],"ad":"$x=2$","sol":"$y'=3x^2-12x$, $y''=6x-12$. || $y''=0$ when $x=2$. || $y''\u003c0$ for $x\u003c2$ and $y''>0$ for $x>2$. || The concavity changes, so the inflection is at $x=2$.","h":["Differentiate twice.","Solve $y''=0$.","Check the sign change."]}]},{"id":"mm3-c04-s4","code":"4.5","title":"Optimisation","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: optimisation problems calculus","url":"https://www.youtube.com/results?search_query=Joel+Speranza+optimisation+problems+calculus","kind":"search"}]},{"t":"p","x":"**What this topic is about.** Optimisation means finding the greatest or least value of a quantity: maximum area, minimum cost, shortest time, maximum profit. These questions are worded, multi-step and appear in nearly every external exam. The calculus is usually easy; the setup is where marks are won or lost."},{"t":"key","x":"**Optimisation method:** (1) Draw a diagram and **define variables** with units. (2) Write the quantity to optimise using two variables. (3) Use the **constraint** (fixed perimeter, volume, cost) to rewrite it in **one** variable. (4) State the **domain** from the context. (5) Differentiate and solve $=0$. (6) **Justify** max or min (second derivative or sign test) and check the **endpoints** of the domain. (7) Answer the actual question with units."},{"t":"p","x":"**Why endpoints matter.** On a closed interval the greatest value can be at an endpoint rather than at a stationary point. Always compare the stationary value with the endpoint values when the domain is closed, e.g. $0\\le x\\le10$."},{"t":"p","x":"**Answer the question asked.** Often you find $x$, but the question wants the area, the cost, or the dimensions. Re-read the question after solving."},{"t":"ex","title":"Fencing against a wall (full working)","q":"A farmer has 120 m of fencing to build a rectangular pen against a straight wall (no fence on the wall side). Find the dimensions that maximise the area.","s":["**Define variables:** let $x$ m be each side perpendicular to the wall; the side parallel to the wall is then $120-2x$ m.","**Area function:** $A=x(120-2x)=120x-2x^2$.","**Domain:** lengths must be positive: $x>0$ and $120-2x>0$, so $0\u003cx\u003c60$.","**Differentiate and solve:** $A'=120-4x=0\\Rightarrow x=30$.","**Justify a maximum:** $A''=-4\u003c0$, so concave down: a maximum.","**Answer the question:** the pen is $30$ m by $60$ m (the 60 m side along the wall), with area $30\\times60=1800$ m$^2$."],"a":"$30$ m $\\times$ $60$ m, area $1800$ m\u00b2"},{"t":"ex","title":"The cheapest can (full working)","q":"A closed cylindrical can must hold $500$ cm$^3$. Find the radius and height that use the least metal.","s":["**Variables:** radius $r$ cm, height $h$ cm. Volume: $\\pi r^2h=500$, so $h=\\dfrac{500}{\\pi r^2}$.","**Quantity to minimise (surface area):** $S=2\\pi r^2+2\\pi rh$. Substitute $h$: $S=2\\pi r^2+2\\pi r\\cdot\\dfrac{500}{\\pi r^2}=2\\pi r^2+\\dfrac{1000}{r}$, with $r>0$.","**Differentiate:** $S'=4\\pi r-\\dfrac{1000}{r^2}$.","**Solve $S'=0$:** $4\\pi r=\\dfrac{1000}{r^2}\\Rightarrow r^3=\\dfrac{250}{\\pi}\\Rightarrow r=\\sqrt[3]{\\dfrac{250}{\\pi}}\\approx4.30$ cm.","**Justify a minimum:** $S''=4\\pi+\\dfrac{2000}{r^3}>0$ for all $r>0$.","**Height:** $h=\\dfrac{500}{\\pi(4.30)^2}\\approx8.60$ cm (equal to the diameter)."],"a":"$r\\approx4.30$ cm, $h\\approx8.60$ cm"},{"t":"ex","title":"Profit on a closed interval (full working)","q":"Weekly profit from selling $x$ hundred items is $P=-2x^3+27x^2-84x+20$ thousand dollars, $0\\le x\\le10$. Find the maximum profit.","s":["**Differentiate:** $P'=-6x^2+54x-84=-6(x^2-9x+14)=-6(x-2)(x-7)$.","**Stationary points:** $x=2$ and $x=7$.","**Nature:** $P''=-12x+54$. $P''(2)=30>0$ (minimum); $P''(7)=-30\u003c0$ (maximum).","**Value at the maximum:** $P(7)=-686+1323-588+20=69$.","**Check endpoints:** $P(0)=20$ and $P(10)=-2000+2700-840+20=-120$. Both are less than 69.","**Answer:** selling 700 items gives the maximum profit of \\$69 000."],"a":"Maximum profit \\$69 000 at 700 items"},{"t":"ex","title":"Open box from a sheet (full working)","q":"Squares of side $x$ cm are cut from the corners of a $30\\times30$ cm sheet and the sides folded up to make an open box. Find the maximum volume.","s":["**Dimensions:** base $(30-2x)$ by $(30-2x)$, height $x$. **Volume:** $V=x(30-2x)^2$, domain $0\u003cx\u003c15$.","**Differentiate (product + chain):** $V'=(30-2x)^2+x\\cdot2(30-2x)(-2)=(30-2x)\\left[(30-2x)-4x\\right]=(30-2x)(30-6x)$.","**Solve $V'=0$:** $x=15$ (outside the domain) or $x=5$.","**Justify:** for $x$ slightly less than 5, $V'>0$; slightly more, $V'\u003c0$: a maximum.","**Maximum volume:** $V(5)=5\\times20^2=2000$ cm$^3$."],"a":"$2000$ cm\u00b3 when $x=5$ cm"},{"t":"warn","x":"Forgetting to justify the maximum or minimum loses a mark every time. So does giving $x$ when the question asked for the maximum area."},{"t":"p","x":"**Exam tip.** Begin with a labelled diagram and a sentence defining every variable. Markers award marks for a correct model (the function in one variable with its domain) even if later algebra goes wrong."},{"t":"tb","rec":"1,2,3,5,7,10,12","ext":"13,14,16,17,18,19,20","x":"Exercise 4.5 covers area, volume, cost and distance optimisation problems.","code":"4.5"}],"checks":[{"topic":"Product max","q":"Two positive numbers have product 64. Find the minimum possible sum.","a":"16","alt":[],"ad":"$16$","sol":"Let the numbers be $x$ and $\\frac{64}{x}$, so the sum is $S=x+\\frac{64}{x}$ for $x>0$. || $S'=1-\\frac{64}{x^2}=0$ gives $x^2=64$, so $x=8$. || $S''=\\frac{128}{x^3}>0$, so it is a minimum. || Minimum sum: $8+8=16$.","h":["Write the sum in one variable.","Solve $S'=0$.","Check it is a minimum."]},{"topic":"Rectangle","q":"A rectangle has perimeter 36 cm. Find the maximum area.","a":"81","alt":["81 cm^2"],"ad":"$81$ cm\u00b2","sol":"Width $x$, length $18-x$, area $A=x(18-x)=18x-x^2$. || $A'=18-2x=0$, so $x=9$. || $A''=-2\u003c0$: maximum. || Maximum area $9\\times9=81$ cm\u00b2.","h":["Half the perimeter is 18.","Area in one variable.","Differentiate and solve."]},{"topic":"Wall pen","q":"80 m of fencing makes a rectangular pen against a wall. Find the maximum area.","a":"800","alt":["800 m^2"],"ad":"$800$ m\u00b2","sol":"Sides $x$, $x$ and $80-2x$, so $A=x(80-2x)=80x-2x^2$. || $A'=80-4x=0$ gives $x=20$. || $A''=-4\u003c0$: maximum. || $A=20\\times40=800$ m\u00b2.","h":["Only three sides need fencing.","$A=x(80-2x)$.","Solve $A'=0$."]},{"topic":"Closed interval","q":"Find the maximum value of $f(x)=x^3-3x$ on $-2\\le x\\le3$.","a":"18","alt":[],"ad":"$18$","sol":"$f'(x)=3x^2-3=0$ gives $x=\\pm1$. || $f(-1)=2$, $f(1)=-2$. || Endpoints: $f(-2)=-8+6=-2$, $f(3)=27-9=18$. || The greatest value is 18, at the endpoint $x=3$.","h":["Find the stationary points.","Evaluate the endpoints too.","Compare all values."]},{"topic":"Box","q":"An open box with a square base has volume 32 cm\u00b3. Find the base side $x$ that minimises the surface area $S=x^2+\\frac{128}{x}$.","a":"4","alt":["x=4"],"ad":"$x=4$ cm","sol":"$S'=2x-\\frac{128}{x^2}$. || Set to zero: $2x^3=128$, so $x^3=64$. || $x=4$. || $S''=2+\\frac{256}{x^3}>0$, so this is a minimum.","h":["Differentiate $\\frac{128}{x}=128x^{-1}$.","Solve $2x=\\frac{128}{x^2}$.","Cube root of 64."]}]},{"id":"mm3-c04-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Endpoints and justification.** On a closed interval, list endpoints, stationary points and any points where the function is not differentiable, and compare values. Always state which test proves max/min."},{"t":"p","x":"**Describing graphs in words.** Use full sentences with evidence: \"$f''(x)>0$ for $x>1$, so the graph is concave up there\". Mixing up $f'$ (increasing/decreasing) with $f''$ (concavity) is a classic lost mark."},{"t":"ex","title":"Exam-style: the closest point (full working)","q":"Find the point on the curve $y=\\sqrt x$ that is closest to $(4,0)$.","s":["**Distance squared:** a point on the curve is $(x,\\sqrt x)$. Distance squared to $(4,0)$ is $D=(x-4)^2+(\\sqrt x)^2=(x-4)^2+x$. Minimising $D$ also minimises the distance (the square root is increasing), and $D$ is easier to differentiate.","**Differentiate:** $D'=2(x-4)+1=2x-7$.","**Solve:** $x=\\frac72$.","**Justify:** $D''=2>0$, a minimum.","**Point:** $y=\\sqrt{3.5}=\\frac{\\sqrt{14}}{2}\\approx1.87$, so $\\left(\\frac72,\\frac{\\sqrt{14}}2\\right)$. Minimum distance $\\sqrt{D}=\\sqrt{\\frac14+\\frac72}=\\frac{\\sqrt{15}}{2}\\approx1.94$."],"a":"$\\left(\\frac72,\\ \\frac{\\sqrt{14}}{2}\\right)$, distance $\\frac{\\sqrt{15}}{2}$"},{"t":"ex","title":"Exam-style: inflection of a bell curve (full working)","q":"For $f(x)=e^{-x^2}$, find the exact positive $x$-value of the point of inflection.","s":["**First derivative (chain rule):** $f'(x)=-2xe^{-x^2}$.","**Second derivative (product rule):** $u=-2x$, $u'=-2$; $v=e^{-x^2}$, $v'=-2xe^{-x^2}$. So $f''=-2e^{-x^2}+(-2x)(-2x)e^{-x^2}=e^{-x^2}(4x^2-2)$.","**Set to zero:** $4x^2-2=0\\Rightarrow x^2=\\frac12\\Rightarrow x=\\pm\\frac1{\\sqrt2}$.","**Sign change:** $4x^2-2$ changes sign at $x=\\frac1{\\sqrt2}$, so it is an inflection."],"a":"$x=\\dfrac{1}{\\sqrt2}=\\dfrac{\\sqrt2}{2}$"},{"t":"warn","x":"Common losses: no justification of nature, ignoring endpoints, and answering with the wrong quantity."}],"checks":[{"topic":"Closest point","q":"Minimise $D=(x-6)^2+x$ to find the $x$-value of the point on $y=\\sqrt x$ closest to $(6,0)$.","a":"5.5","alt":["11/2","x=5.5"],"ad":"$x=\\tfrac{11}{2}$","sol":"$D'=2(x-6)+1=2x-11$. || Set to zero: $x=\\frac{11}2$. || $D''=2>0$, so it is a minimum. || The closest point has $x=5.5$.","h":["Differentiate $D$.","Solve $2x-11=0$.","Check $D''$."]},{"topic":"Inflection","q":"Find the $x$-value of the point of inflection of $y=x^3-9x^2+2$.","a":"3","alt":["x=3"],"ad":"$x=3$","sol":"$y'=3x^2-18x$, $y''=6x-18$. || $y''=0$ at $x=3$. || $y''$ is negative before and positive after. || So the inflection is at $x=3$.","h":["Differentiate twice.","Solve $y''=0$.","Confirm the sign change."]},{"topic":"Cylinder","q":"A closed cylinder with volume $54\\pi$ has surface area $A=2\\pi r^2+\\frac{108\\pi}{r}$. Find the minimising $r$.","a":"3","alt":["r=3"],"ad":"$r=3$","sol":"$A'=4\\pi r-\\frac{108\\pi}{r^2}$. || Set to zero: $4\\pi r^3=108\\pi$, so $r^3=27$. || $r=3$. || $A''=4\\pi+\\frac{216\\pi}{r^3}>0$, so it is a minimum.","h":["Differentiate.","Multiply through by $r^2$.","Cube root of 27."]},{"topic":"Nature","q":"$f'(x)=(x-2)^2(x+1)$. What type of stationary point is at $x=2$?","a":"stationary point of inflection","alt":["inflection","stationary inflection","point of inflection","SPOI"],"ad":"Stationary point of inflection","sol":"$f'(2)=0$, so $x=2$ is stationary. || Sign test: $f'(1)=1\\cdot2>0$ and $f'(3)=1\\cdot4>0$. || The gradient is positive on both sides (no sign change). || So $x=2$ is a stationary point of inflection.","h":["Check $f'$ either side of 2.","$(x-2)^2$ is never negative.","No sign change."]},{"topic":"Interpret","q":"$C(x)$ is the cost of making $x$ items. $C'(100)=4$ and $C''(100)=-0.02$. Describe the cost at 100 items.","a":"increasing at a decreasing rate","alt":["increasing, rate decreasing","cost increasing but rate decreasing"],"ad":"Cost is increasing, at a decreasing rate","sol":"$C'(100)=4>0$: the cost is increasing (about \\$4 per extra item). || $C''(100)\u003c0$: the rate of increase is falling. || Each extra item adds slightly less cost than the one before. || So the cost is increasing at a decreasing rate.","h":["Sign of $C'$.","Sign of $C''$.","Combine into one sentence."]}]}],"quiz":[{"topic":"Second derivative","q":"Find $f''(x)$ for $f(x)=x^4-2x^2$.","a":"12x^2-4","alt":["12x\u00b2-4"],"ad":"$12x^2-4$","sol":"Differentiate once: $f'(x)=4x^3-4x$. || Differentiate again term by term: $\\frac{d}{dx}4x^3=12x^2$ and $\\frac{d}{dx}(-4x)=-4$. || So $f''(x)=12x^2-4$. || This is the second derivative.","h":["Differentiate once.","$4x^3-4x$.","Differentiate again."]},{"topic":"Nature","q":"For $f(x)=x^3-12x$ the stationary point at $x=2$ is a (type \"min\" or \"max\").","a":"min","alt":["minimum","local min","local minimum"],"ad":"minimum","sol":"$f'(x)=3x^2-12=0$ gives $x=\\pm2$, so $x=2$ is stationary. || Second derivative: $f''(x)=6x$. || At $x=2$: $f''(2)=12>0$, concave up. || So it is a minimum.","h":["Find $f''$.","Substitute $x=2$.","Positive means min."]},{"topic":"Inflection","q":"Find the $x$-coordinate of the point of inflection of $f(x)=x^3-6x^2+1$.","a":"2","alt":["x=2"],"ad":"$x=2$","sol":"$f'(x)=3x^2-12x$ and $f''(x)=6x-12$. || Set $f''(x)=0$: $x=2$. || $f''$ is negative for $x\u003c2$ and positive for $x>2$, so the concavity changes. || The point of inflection is at $x=2$.","h":["Find $f''$.","Set to 0.","Solve."]},{"topic":"Second derivative","q":"Find $f''(x)$ for $f(x)=e^{3x}$.","a":"9e^(3x)","alt":["9e^3x"],"ad":"$9e^{3x}$","sol":"First derivative: $f'(x)=3e^{3x}$ (chain factor 3). || Second derivative: differentiate again, multiplying by 3 again. || $f''(x)=3\\times3e^{3x}$. || $f''(x)=9e^{3x}$.","h":["First derivative: chain rule.","$3e^{3x}$.","Differentiate again."]},{"topic":"Concavity","q":"For $f(x)=\\ln x$, is the graph concave up or concave down? (answer \"up\" or \"down\")","a":"down","alt":["concave down"],"ad":"concave down","sol":"$f'(x)=\\frac1x=x^{-1}$. || $f''(x)=-x^{-2}=-\\frac1{x^2}$. || For every $x>0$, $-\\frac1{x^2}\u003c0$. || So $\\ln x$ is concave down everywhere on its domain.","h":["Find $f'$.","Then $f''$.","Check its sign."]},{"topic":"Optimisation","q":"Two numbers add to 20. Find the greatest possible product.","a":"100","alt":["100."],"ad":"$100$","sol":"Let the numbers be $x$ and $20-x$, so the product is $P=x(20-x)=20x-x^2$. || $P'=20-2x=0$ gives $x=10$. || $P''=-2\u003c0$, so it is a maximum. || Greatest product: $10\\times10=100$.","h":["Let the numbers be $x$ and $20-x$.","Write $P$.","Differentiate and set 0."]},{"topic":"Optimisation","q":"A rectangle has perimeter 40 m. Find its maximum area in $\\text{m}^2$.","a":"100","alt":["100 m^2"],"ad":"$100\\ \\text{m}^2$","sol":"Half the perimeter is 20, so sides are $x$ and $20-x$ and $A=x(20-x)$. || $A'=20-2x=0$ gives $x=10$. || $A''=-2\u003c0$: a maximum. || Maximum area $=10\\times10=100$ m\u00b2.","h":["Half the perimeter is 20.","Area $=x(20-x)$.","Maximise."]},{"topic":"Stationary","q":"Find the minimum value of $f(x)=x^2-4x+9$.","a":"5","alt":["f=5","min=5"],"ad":"$5$","sol":"$f'(x)=2x-4=0$ gives $x=2$. || $f''(x)=2>0$, so it is a minimum. || Evaluate: $f(2)=4-8+9$. || Minimum value $=5$.","h":["Differentiate.","$x=2$.","Substitute back."]},{"topic":"Sketch feature","q":"$f(x)=xe^{-x}$ has a local maximum at $x=1$. What is its $y$-value? Give an exact answer.","a":"1/e","alt":["e^(-1)"],"ad":"$e^{-1}$","sol":"Substitute $x=1$ into $f(x)=xe^{-x}$. || $f(1)=1\\times e^{-1}$. || $=e^{-1}$. || So the maximum point is $\\left(1,\\frac1e\\right)$.","h":["Substitute $x=1$.","$e^{-1}$.","Same as $\\frac1e$."]},{"topic":"Second derivative test","q":"$f''(x)=-5$ at a stationary point. Is it a max or min?","a":"max","alt":["maximum","local max","local maximum"],"ad":"maximum","sol":"At a stationary point, a negative second derivative means concave down. || A concave-down shape at a horizontal tangent is the top of a hill. || So $f''=-5\u003c0$ indicates a maximum. || Answer: maximum.","h":["Sign of $f''$.","Negative.","Concave down."]},{"topic":"Second derivative","q":"If $f(x)=x^4-2x^2$, find $f''(1)$.","a":"8","alt":[],"ad":"$8$","sol":"$f'(x)=4x^3-4x$. || $f''(x)=12x^2-4$. || Substitute $x=1$: $12-4$. || $f''(1)=8$.","h":["Differentiate twice.","$f'=4x^3-4x$.","Substitute."]},{"topic":"Concavity","q":"For $f(x)=x^3$, what is $f''(x)$ at $x=-1$?","a":"-6","alt":[],"ad":"$-6$","sol":"$f'(x)=3x^2$. || $f''(x)=6x$. || Substitute $x=-1$: $6(-1)$. || $f''(-1)=-6$.","h":["Differentiate twice.","$6x$.","Substitute."]},{"topic":"Inflection","q":"Find the $x$-coordinate of the inflection of $y=x^3-9x^2$.","a":"3","alt":[],"ad":"$x=3$","sol":"$y'=3x^2-18x$ and $y''=6x-18$. || Set $y''=0$: $x=3$. || $y''$ changes sign there (negative to positive). || The inflection is at $x=3$.","h":["Second derivative.","Set to zero.","Solve."]},{"topic":"Max","q":"The maximum of $y=-x^2+6x$ is?","a":"9","alt":[],"ad":"$9$","sol":"$y'=-2x+6=0$ gives $x=3$. || $y''=-2\u003c0$: a maximum. || $y(3)=-9+18$. || Maximum value $=9$.","h":["Vertex.","$x=3$.","Substitute."]},{"topic":"Exponential","q":"Classify the stationary point of $y=xe^{-x}$.","a":"max","alt":["maximum","local max"],"ad":"maximum at $x=1$","sol":"Product rule: $y'=e^{-x}-xe^{-x}=e^{-x}(1-x)$, zero at $x=1$. || Second derivative: $y''=e^{-x}(x-2)$. || $y''(1)=-e^{-1}\u003c0$. || So $x=1$ is a maximum.","h":["$x=1$.","Second derivative.","Sign."]},{"topic":"Box","q":"Open box volume 32, base $x$. Surface area $S=x^2+\\frac{128}{x}$. Find the minimum value of $S$.","a":"48","alt":[],"ad":"$48$","sol":"$S'=2x-\\frac{128}{x^2}=0\\Rightarrow2x^3=128\\Rightarrow x=4$. || $S''=2+\\frac{256}{x^3}>0$, so a minimum. || $S(4)=16+\\frac{128}4=16+32$. || Minimum surface area $=48$.","h":["Find stationary point.","$x=4$.","Substitute."]},{"topic":"Inflection","q":"Is there an inflection point for $y=x^4$ at $x=0$? Answer yes or no.","a":"no","alt":["No"],"ad":"No","sol":"$y'=4x^3$, $y''=12x^2$, and $y''(0)=0$. || But $y''=12x^2\\ge0$ on both sides of 0, so the concavity does not change. || In fact $y'$ changes from negative to positive, making $x=0$ a minimum. || So there is no inflection: No.","h":["Compute $y''$.","Check sign either side.","No change."]},{"topic":"Rate","q":"$y=e^{3x}$. Find $y''$ at $x=0$.","a":"9","alt":[],"ad":"$9$","sol":"$y'=3e^{3x}$. || $y''=9e^{3x}$. || At $x=0$: $9e^0$. || $y''(0)=9$.","h":["Differentiate twice.","Factor 3 each time.","Substitute."]},{"topic":"Domain","q":"Maximum of $f(x)=x^2$ on $[-1,3]$?","a":"9","alt":[],"ad":"$9$","sol":"$f'(x)=2x=0$ at $x=0$, where $f(0)=0$ (a minimum). || Closed interval, so check the endpoints: $f(-1)=1$, $f(3)=9$. || Compare: 0, 1 and 9. || The maximum is 9, at $x=3$.","h":["Check end points.","$f(3)$.","Compare."]},{"topic":"Sketch","q":"The curve $y=x^3-3x^2$ has a local minimum at $x=$?","a":"2","alt":[],"ad":"$x=2$","sol":"$y'=3x^2-6x=3x(x-2)$, zero at $x=0$ and $x=2$. || $y''=6x-6$. || $y''(2)=6>0$: concave up, a minimum. || So the local minimum is at $x=2$.","h":["Solve $y'=0$.","Test $x=2$.","Sign."]}],"comets":[{"topic":"Extension: Cheapest cylinder","q":"A closed cylinder has volume $54\\pi\\ \\text{cm}^3$. With radius $r$, its surface area is $A=2\\pi r^2+\\dfrac{108\\pi}{r}$. Find the radius $r$ that minimises $A$.","a":"3","alt":["r=3"],"ad":"$r=3$","sol":"Differentiate: $A'=4\\pi r-\\frac{108\\pi}{r^2}$. || Set to zero and multiply by $r^2$: $4\\pi r^3=108\\pi$, so $r^3=27$. || $r=3$. || $A''=4\\pi+\\frac{216\\pi}{r^3}>0$, so $r=3$ gives the minimum.","h":["Differentiate $A$.","Set to zero.","$r^3=27$."]},{"topic":"Extension: Inflection of a normal curve shape","q":"For $f(x)=e^{-x^2}$, find the positive $x$ where $f''(x)=0$. Give an exact answer.","a":"1/sqrt2","alt":["sqrt2/2","1/\u221a2","\u221a2/2","sqrt(2)/2"],"ad":"$\\dfrac{1}{\\sqrt2}$","sol":"$f'(x)=-2xe^{-x^2}$ (chain rule). || Product rule: $f''(x)=-2e^{-x^2}+4x^2e^{-x^2}=e^{-x^2}(4x^2-2)$. || Set to zero: $4x^2=2$, so $x^2=\\frac12$. || Positive solution $x=\\frac{1}{\\sqrt2}=\\frac{\\sqrt2}{2}$, where $f''$ changes sign.","h":["Differentiate twice (product rule on the second).","Factor $e^{-x^2}$.","Solve $4x^2-2=0$."]},{"topic":"Extension: Shortest path","q":"The point on $y=\\sqrt x$ closest to $(4,0)$ has $x$-coordinate?","a":"3.5","alt":["7/2"],"ad":"$x=\\frac72$","sol":"Minimise the squared distance from $(x,\\sqrt x)$ to $(4,0)$: $D=(x-4)^2+x$. || $D'=2(x-4)+1=2x-7$. || $D'=0$ gives $x=\\frac72$; $D''=2>0$ confirms a minimum. || So the closest point has $x=\\frac72$.","h":["Minimise distance squared.","$(x-4)^2+x$.","Differentiate."]}],"cards":[{"type":"def","topic":"The second derivative","f":"What does $f''(x)>0$ tell you about the graph?","b":"The gradient is increasing, so the graph is concave up (bends like a cup)."},{"type":"def","topic":"The second derivative","f":"When is a particle speeding up?","b":"When velocity and acceleration have the same sign (both positive or both negative)."},{"type":"word","topic":"The second derivative","f":"$P''(t)\u003c0$ while $P'(t)>0$. Describe the population in words.","b":"It is still increasing, but the rate of increase is slowing down."},{"type":"def","topic":"Concavity and points of inflection","f":"Second derivative test.","b":"At a stationary point: $f''>0$ minimum, $f''\u003c0$ maximum, $f''=0$ inconclusive (use the sign test)."},{"type":"def","topic":"Concavity and points of inflection","f":"What is a stationary point of inflection?","b":"A point where $f'(x)=0$ and the concavity changes, so the graph flattens but keeps going the same way. Example: $y=x^3$ at $x=0$."},{"type":"def","topic":"Concavity and points of inflection","f":"Is $f''(a)=0$ enough for an inflection point?","b":"No. $f''$ must also change sign at $x=a$. ($y=x^4$ has $f''(0)=0$ but no inflection.)"},{"type":"def","topic":"Curve sketching","f":"Checklist of features for a curve sketch.","b":"Intercepts, stationary points and their nature, points of inflection, asymptotes, end behaviour. All labelled with exact values."},{"type":"word","topic":"Optimisation","f":"120 m of fence, pen against a wall. Best dimensions?","b":"Sides $x$, $x$, $120-2x$. $A=120x-2x^2$ is maximised at $x=30$: $30$ m by $60$ m, area 1800 m\u00b2."},{"type":"word","topic":"Optimisation","f":"Two positive numbers have product 64. Minimise their sum.","b":"$S=x+\\frac{64}x$, $S'=1-\\frac{64}{x^2}=0\\Rightarrow x=8$. Both numbers are 8, sum 16."},{"type":"word","topic":"Optimisation","f":"Why check endpoints in a closed-interval optimisation?","b":"The absolute max or min can occur at an endpoint rather than at a stationary point."},{"type":"word","topic":"Optimisation","f":"An open box is made by cutting squares of side $x$ from a $30\\times30$ cm sheet. Volume function?","b":"$V=x(30-2x)^2$ for $0\u003cx\u003c15$. Maximum at $x=5$: $V=2000$ cm\u00b3."}],"hours":4.5},"mm3-c05":{"id":"mm3-c05","interactive":"antideriv","summary":"Anti-differentiation undoes differentiation. This chapter collects the integration rules for powers, $e^x$, $\\frac1x$ and trig functions, handles linear inside functions, uses initial conditions to find the constant, and applies integrals to motion and area.","videos":[{"src":"B","title":"What does area have to do with slope? (3Blue1Brown, ch. 9)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+What+does+area+have+to+do+with+slope+Essence+of+calculus+chapter+9","kind":"search"},{"src":"B","title":"Integration and the fundamental theorem of calculus (3Blue1Brown, ch. 8)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Integration+and+the+fundamental+theorem+of+calculus","kind":"search"},{"src":"J","title":"Anti-differentiation","url":"https://www.youtube.com/results?search
