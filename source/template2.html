<style id="app-style">
:root{
  /* Layout: full-bleed night-sky canvas with a floating top bar, a bottom chip rail and a right-hand drawer for lessons. */
  --bg:#060a14; --panel:#0d1526; --panel2:#142040; --ink:#e9edf7; --mute:#aab5cd; --line:#2e4170;
  --gold:#d9b878; --new:#5d6882; --learn:#8fa8c8; --revise:#c9a86a; --solid:#86bfa6; --risk:#c98585;
  --display:'Unbounded','Trebuchet MS',system-ui,sans-serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
button{font:inherit;color:inherit}
#shell{position:relative;height:100%;overflow:hidden}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#bar{position:absolute;top:0;left:0;right:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;padding:14px 20px;pointer-events:none}
#bar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe2a8,var(--gold) 55%,#b36a12);box-shadow:0 0 14px 2px #ffb45488}
h1{font:700 12px var(--display);letter-spacing:.16em;text-transform:uppercase;margin:0}
#crumbs{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px}
#crumbs .here{color:var(--ink);font-weight:500}
#crumbs .cue{color:var(--mute);font-size:13px}
.crumb{background:none;border:0;padding:2px 0;color:var(--gold);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
#units{display:flex;gap:6px}
#units button{border:1px solid var(--line);background:rgba(13,21,38,.8);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:500;font-size:13px}
#units button small{margin-left:8px;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
#units button[aria-selected="true"]{border-color:var(--gold);background:#2a1f0c}
#insightsBtn{border:1px solid var(--line);background:rgba(13,21,38,.8);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:500;font-size:13px}
#insightsBtn[aria-pressed="true"]{border-color:var(--gold);background:#2a1f0c}
#streak{font-size:13px;color:var(--mute)}
#streak b{color:var(--gold);font-variant-numeric:tabular-nums}
#legend{list-style:none;display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 0 auto;padding:0;font-size:12px;color:var(--mute)}
#legend li{display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.sw.ring{background:none;border:2px solid var(--c)}
.sw.dash{background:none;border:2px dashed var(--c)}
#chips{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 16px 14px;overflow-x:auto;scrollbar-width:thin}
.chip{flex:none;display:flex;gap:8px;align-items:center;max-width:250px;padding:7px 13px;border:1px solid var(--line);background:rgba(13,21,38,.88);border-radius:999px;font-size:13px;font-weight:500;cursor:pointer}
.chip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-current="true"]{border-color:var(--gold)}
.chip.add{border-style:dashed;color:var(--mute)}
.chip:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#panel{position:absolute;top:92px;right:16px;bottom:64px;width:min(500px,calc(100% - 32px));background:rgba(13,21,38,.95);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:18px 20px 24px;overflow:auto;transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .3s}
#panel.open{transform:none;opacity:1;pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;font-size:18px;line-height:1}
.eyebrow{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
#panel h2{font:700 17px/1.3 var(--display);margin:6px 0 12px;text-wrap:balance}
.pill{display:inline-flex;align-items:center;gap:7px;padding:3px 11px;border-radius:999px;border:1px solid var(--c);font-size:12px;font-weight:700;color:var(--c)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}
.stats div{background:var(--panel2);border-radius:12px;padding:10px 12px}
.stats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btn{border:1px solid var(--gold);background:var(--gold);color:#1b1204;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.link{border:0;background:none;color:var(--mute);padding:4px 2px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.btn[disabled]{opacity:.5;cursor:default}
.sub{font-size:13px;color:var(--mute);margin:6px 0}
.muted{color:var(--mute);font-size:14px}
.lesson p,.lesson li{margin:.5em 0}
.lesson h4{font:700 13px var(--display);margin:1.4em 0 .4em;color:var(--gold);letter-spacing:.04em}
.lesson ul{padding-left:1.2em;margin:.4em 0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;background:#0a1224;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.qhead{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.tag{border:1px solid var(--line);border-radius:999px;padding:1px 9px;text-transform:none;letter-spacing:0}
.qtext{white-space:pre-wrap;background:var(--panel2);border-radius:12px;padding:14px;margin:10px 0;font-size:16px}
textarea,input[type=text]{width:100%;background:#09101f;border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:10px 12px;font:inherit}
textarea{min-height:64px;resize:vertical}
.fb{border-radius:12px;padding:10px 14px;margin:10px 0;border:1px solid var(--line);background:var(--panel2)}
.fb.ok{border-color:var(--solid)}
.fb.no{border-color:var(--risk)}
.hint{border-left:3px solid var(--learn);padding:4px 12px;margin:8px 0;background:#0e1a33;border-radius:0 8px 8px 0}
.sol{border-left:3px solid var(--solid);padding:6px 12px;margin:8px 0;white-space:pre-wrap;background:#0d2220;border-radius:0 8px 8px 0}
.res{display:grid;gap:6px;margin:10px 0}
.res div{display:flex;justify-content:space-between;gap:10px;background:var(--panel2);border-radius:10px;padding:8px 12px;font-size:14px}
.big{font:700 34px var(--display);margin:6px 0}
.wk{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;cursor:pointer}
.wk b{display:block;font-size:14px}
.wk span{font-size:12px;color:var(--mute)}
.wk .n{flex:none;font:700 16px var(--display);color:var(--gold)}
.wk .cw{color:var(--risk)}
.qa{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp .9s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:absolute;left:50%;top:70px;transform:translate(-50%,-20px);background:var(--panel2);border:1px solid var(--gold);border-radius:12px;padding:9px 16px;font-size:14px;opacity:0;pointer-events:none;transition:all .4s;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:759px){
  #bar{padding:10px 12px}
  #legend{margin-left:0}
  #panel{top:auto;left:8px;right:8px;width:auto;bottom:56px;max-height:70%;transform:translateY(calc(100% + 80px))}
}
@media (prefers-reduced-motion:reduce){#panel,#toast{transition:none}.spin{animation:none}}

#lvl{font-size:13px;color:var(--mute)}#lvl b{color:var(--gold)}
.tabs{display:flex;gap:6px;margin:14px 0 10px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:500;font-size:13px}.tabs button[aria-selected="true"]{border-color:var(--gold);background:#2a1f0c}
.prog{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:8px 0 2px}.prog i{display:block;height:100%;background:var(--solid)}
.sumbox{background:var(--panel2);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:14px}
.secnav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.sc{border:1px solid var(--line);background:none;border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer}.sc.cur{border-color:var(--gold);color:var(--gold)}.sc.ok{border-color:var(--solid)}
.sech{font:700 15px/1.3 var(--display);margin:10px 0 4px}
.key{background:#241a08;border:1px solid #5a4116;border-radius:12px;padding:10px 14px;margin:10px 0;overflow-x:auto}
.warn{border-left:3px solid var(--risk);background:#2a1315;border-radius:0 10px 10px 0;padding:8px 12px;margin:10px 0;font-size:14px}
.ex{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:12px 0}.exh{color:var(--gold);font-size:13px}.exq{margin:6px 0}.steps{margin:6px 0 6px 1.1em;padding:0}.steps li{margin:.35em 0}.exa{border-top:1px dashed var(--line);margin-top:8px;padding-top:6px}
.tb{background:#0d2220;border:1px solid #1f5a4d;border-radius:12px;padding:10px 14px;margin:12px 0}.tb p{margin:.4em 0;font-size:14px}.tbl{font-size:14px;margin:3px 0}.tbl span{display:inline-block;min-width:96px;color:var(--solid);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tbrow{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline;background:var(--panel2);border-radius:10px;padding:7px 12px;margin:5px 0;font-size:13px}.tbrow b{min-width:64px}.tbrow span{color:var(--mute)}
.vid{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:6px 0}.vid:hover{border-color:var(--gold)}.vid b{display:block;font-size:14px}.vid em{font-style:normal;font-size:12px;color:var(--mute)}.vi{flex:none;width:30px;height:30px;border-radius:50%;background:#2a1f0c;color:var(--gold);display:grid;place-items:center}
.wg{background:#0a1224;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:12px 0}.wgt{font-size:13px;color:var(--gold)}.wg>svg{width:100%;height:auto;background:#060c1a;border-radius:10px;display:block}.ctl{display:grid;gap:4px;margin:8px 0}.ctl label{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px;font-size:12px;color:var(--mute)}.ctl input{width:100%;accent-color:#ffb454}.wgr{font-size:13px;margin:4px 0 0;min-height:2.6em}
.lvlbar{position:relative;background:var(--panel2);border-radius:12px;padding:10px 12px;overflow:hidden;display:flex;justify-content:space-between;gap:10px;font-size:13px}.lvlbar *{position:relative;z-index:1}.lvlbar i{position:absolute;left:0;top:0;bottom:0;background:#3b2a0a;z-index:0}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.badge{border:1px dashed var(--line);border-radius:12px;padding:8px 10px;opacity:.55}.badge.on{border:1px solid var(--gold);opacity:1;background:#241a08}.badge b{display:block;font-size:13px}.badge span{font-size:11px;color:var(--mute)}
mjx-container{color:inherit}mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;max-width:100%;margin:.6em 0!important}

/* design pass 2 */
.pillbtn{border:1px solid var(--line);background:rgba(13,21,38,.85);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:500;font-size:13px}
.pillbtn:hover{border-color:var(--gold)}
#legBtn{margin-left:auto;width:30px;height:30px;padding:0;font-weight:700}
#legend{display:none;position:absolute;top:56px;right:20px;flex-direction:column;gap:9px;margin:0;padding:14px 18px;background:rgba(13,21,38,.97);border:1px solid var(--line);border-radius:14px;z-index:8;font-size:13px;color:var(--ink)}
#legend.open{display:flex}
#lvl{display:none}
#streak{border:1px solid var(--line);background:rgba(13,21,38,.85);border-radius:999px;padding:5px 14px;cursor:pointer;color:var(--ink)}
#streak:hover{border-color:var(--gold)}
#showpanel{position:absolute;right:16px;top:70px;z-index:5}
#panel.hid{transform:translateX(112%);opacity:0;pointer-events:none}
#panel.wide{left:16px;right:16px;width:auto}
#panel.wide{padding-left:max(24px,calc((100% - 880px)/2));padding-right:max(24px,calc((100% - 880px)/2))}
#panel.wide .lesson{font-size:17.5px;line-height:1.7}
.lesson{font-size:16px;line-height:1.65}
.pbtns{display:flex;gap:6px;flex:none}
#chlist{position:absolute;top:58px;left:16px;width:min(380px,calc(100% - 32px));max-height:calc(100% - 150px);overflow:auto;background:rgba(13,21,38,.97);border:1px solid var(--line);border-radius:16px;padding:8px;z-index:7}
.chr,.cp{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px;cursor:pointer}
.chr:hover,.chr[aria-current="true"],.cp:hover{background:var(--panel2)}
.chr b{display:block;font-size:14px}.chr small{display:block;color:var(--mute);font-size:12px;margin:2px 0 5px}
.chr .dot,.cp .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c);margin-top:6px}
.mini{display:block;height:5px;background:var(--panel2);border-radius:9px;overflow:hidden}.mini i{display:block;height:100%;background:var(--solid)}
.cp{align-items:center;padding:6px 8px}.cpn{flex:1;font-size:13px}.cp .mini{width:90px;flex:none}.cp b{font-size:12px;width:34px;text-align:right;color:var(--mute)}.cp .dot{margin-top:0}
#today{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);z-index:4}
.tdc{display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:290px;max-width:380px;background:rgba(13,21,38,.9);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:14px 18px}
.tdc b{font-size:15px}.tdc span{font-size:13px;color:var(--mute)}.tdc .btn{margin-top:8px;padding:8px 18px}
.secnav{position:sticky;top:-18px;z-index:3;background:rgba(13,21,38,.97);padding:8px 0;margin:6px 0}
.sc em{display:none;font-style:normal;margin-left:6px;color:var(--mute)}#panel.wide .sc em{display:inline}
.sc{padding:4px 10px}
.bd{font-style:normal;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:8px;border:1px solid var(--line)}
.bd.direct{color:var(--solid);border-color:var(--solid)}.bd.srch{color:var(--mute)}
.wg>svg{max-height:440px}
.pre{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}.btn.sm{padding:4px 10px;font-size:12px;border-radius:9px}
.fb.ok::before{content:'✓';display:inline-block;margin-right:8px;font-weight:700;color:var(--solid)}
.fb.no::before{content:'✕';display:inline-block;margin-right:8px;font-weight:700;color:var(--risk)}
.clock{font:700 13px var(--display);color:var(--gold);margin-bottom:6px}.clock.low{color:var(--risk)}
.tmr{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--mute);margin:10px 0}.tmr input{margin-top:4px}
.heat{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;gap:3px;overflow-x:auto;margin:6px 0;padding-bottom:4px}
.hc{width:11px;height:11px;border-radius:3px;background:#17223d;display:block}.hc.pad{background:none}.hc.l1{background:#2a4a47}.hc.l2{background:#3e7567}.hc.l3{background:#5aa38a}.hc.l4{background:#86bfa6}
#panel{counter-reset:wk}.wk::before{counter-increment:wk;content:counter(wk);flex:none;width:22px;height:22px;border-radius:50%;background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;font-size:12px;margin-right:10px}
.wk{align-items:center}
@media (max-width:759px){#legBtn{display:none}}
</style>

<div id="shell">
  <canvas id="sky" aria-label="Study map. Planets are chapters; use the list at the bottom to pick one with a keyboard."></canvas>
  <header id="bar">
    <div class="brand"><span class="mark"></span><h1>Study Galaxy</h1></div>
    <nav id="crumbs" aria-label="Where you are"></nav>
    <div id="units" role="tablist" aria-label="Unit"></div>
    <button id="insightsBtn" data-insights="1" aria-pressed="false">Progress and weak spots</button>
    <span id="streak"></span><span id="lvl"></span>
<button id="legBtn" class="pillbtn" aria-expanded="false" aria-controls="legend" title="Colour key" aria-label="Colour key">?</button>
    <ul id="legend" aria-label="Colour key">
      <li><span class="sw" style="--c:var(--new)"></span>Not started</li>
      <li><span class="sw" style="--c:var(--learn)"></span>Learning</li>
      <li><span class="sw" style="--c:var(--revise)"></span>Needs revision</li>
      <li><span class="sw" style="--c:var(--solid)"></span>Solid</li>
      <li><span class="sw ring" style="--c:var(--revise)"></span>Due for review</li>
      <li><span class="sw dash" style="--c:var(--risk)"></span>Confident but wrong</li>
      <li><span class="sw" style="--c:#e8edff;width:5px;height:5px"></span>Moon = section understood</li>
      <li><span class="sw" style="--c:var(--gold);width:12px;height:4px;border-radius:2px"></span>Comet = extension caught</li>
    </ul>
  </header>
  <div id="chips" role="list"></div>
  <div id="chlist" hidden></div>
  <div id="today"></div>
  <button id="showpanel" class="pillbtn" hidden>Show lesson panel</button>
  <aside id="panel" aria-live="polite"></aside>
  <div id="toast" role="status"></div>

<script type="application/json" id="content">{"mm3-c01":{"id":"mm3-c01","interactive":"expfun","summary":"This chapter builds the two functions that run the rest of Unit 3: $e^x$ and its inverse $\\ln x$. You learn what a limit is, why $e$ is special, how to sketch and solve with exponentials and logarithms, how to differentiate them, and how to use them to model growth, decay and cooling.","videos":[{"src":"B","title":"What's so special about Euler's number e? (3Blue1Brown, Essence of calculus ch. 5)","url":"https://www.youtube.com/watch?v=m2MIpDrF7Es","kind":"video"},{"src":"B","title":"The paradox of the derivative (3Blue1Brown, Essence of calculus ch. 2)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+The+paradox+of+the+derivative+Essence+of+calculus+chapter+2","kind":"search"},{"src":"B","title":"Limits, L'Hopital's rule and epsilon delta (3Blue1Brown, ch. 7)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Limits%2C+L%27Hopital%27s+rule%2C+and+epsilon+delta+definitions","kind":"search"},{"src":"J","title":"Limits and derivatives from first principles","url":"https://www.youtube.com/results?search_query=Joel+Speranza+limits+first+principles","kind":"search"},{"src":"J","title":"Exponential functions and their graphs","url":"https://www.youtube.com/results?search_query=Joel+Speranza+exponential+functions+graphs","kind":"search"},{"src":"J","title":"Logarithm laws and solving log equations","url":"https://www.youtube.com/results?search_query=Joel+Speranza+logarithm+laws","kind":"search"},{"src":"J","title":"Differentiating exponential and logarithmic functions","url":"https://www.youtube.com/results?search_query=Joel+Speranza+differentiation+exponential+logarithmic","kind":"search"}],"sections":[{"id":"mm3-c01-s1","code":"1.2","title":"Limits","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: limits and differentiation from first principles","url":"https://www.youtube.com/results?search_query=Joel+Speranza+limits+and+differentiation+from+first+principles","kind":"search"},{"src":"B","title":"3Blue1Brown: The paradox of the derivative","url":"https://www.youtube.com/results?search_query=3Blue1Brown+The+paradox+of+the+derivative","kind":"search"}]},{"t":"p","x":"A **limit** describes the value a function approaches as the input gets close to a point, even if the function never actually reaches it. We write $\\lim_{x\\to a} f(x)=L$. For most nice functions the limit is just the value, so $\\lim_{x\\to 2}(x^2+1)=5$. Limits become interesting when direct substitution gives $\\tfrac{0}{0}$, because then you must simplify first."},{"t":"p","x":"Because $x$ can approach $a$ from the left ($x\\to a^-$) or the right ($x\\to a^+$), a limit only exists when both sides agree. Limits obey the usual laws: the limit of a sum, product or quotient is the sum, product or quotient of the limits (as long as you do not divide by a limit of zero)."},{"t":"ex","title":"Limit that needs factorising","q":"Evaluate $\\displaystyle\\lim_{x\\to 3}\\frac{x^2-9}{x-3}$.","s":["Substituting $x=3$ gives $\\tfrac{0}{0}$, so factorise the numerator: $\\dfrac{(x-3)(x+3)}{x-3}$.","For $x\\neq 3$ the factor $x-3$ cancels, leaving $x+3$.","Now substitute: $3+3=6$."],"a":"$6$"},{"t":"p","x":"The idea behind all of calculus is the **derivative as a limit**. The gradient of the tangent at $x$ is the limit of the gradient of a chord as the chord shrinks to a point:"},{"t":"key","x":"$$f'(x)=\\lim_{h\\to 0}\\frac{f(x+h)-f(x)}{h}$$"},{"t":"ex","title":"Derivative from first principles","q":"Use first principles to find $f'(x)$ for $f(x)=x^2$.","s":["$\\dfrac{f(x+h)-f(x)}{h}=\\dfrac{(x+h)^2-x^2}{h}=\\dfrac{2xh+h^2}{h}$.","Divide by $h$: $2x+h$.","Let $h\\to 0$: $f'(x)=2x$."],"a":"$f'(x)=2x$"},{"t":"p","x":"You can also **estimate** a limit numerically. Evaluate the function at values closer and closer to the point on both sides and watch where the outputs head. This is how the number $e$ is first met: the values of $\\left(1+\\tfrac1n\\right)^n$ climb towards $2.71828\\ldots$ as $n$ grows, and we define that limit to be $e$."},{"t":"warn","x":"A limit of $\\tfrac00$ does not mean the limit does not exist, and it does not mean the answer is $0$. It means you have not simplified enough yet."},{"t":"tb","rec":"1,2,3,5,8","ext":"11,13","x":"Textbook Exercise 1.2 practises evaluating limits by substitution and factorising, then differentiating from first principles, then estimating limits with technology.","code":"1.2"},{"t":"p","x":"**One-sided limits.** Write $\\lim_{x\\to a^-}f(x)$ for the value approached from the left and $\\lim_{x\\to a^+}f(x)$ from the right. The two-sided limit exists only when they are equal. A graph with a jump, such as $f(x)=\\frac{|x|}{x}$ at $0$ (left limit $-1$, right limit $+1$), has no limit there."},{"t":"ex","title":"A limit that does not exist","q":"Does $\\displaystyle\\lim_{x\\to0}\\frac{|x|}{x}$ exist?","s":["For $x>0$, $\\frac{|x|}x=1$, so the right-hand limit is $1$.","For $x\u003c0$, $\\frac{|x|}x=-1$, so the left-hand limit is $-1$.","The two sides disagree."],"a":"The limit does not exist."},{"t":"ex","title":"First principles with a cubic","q":"Use first principles to differentiate $f(x)=x^3$.","s":["$\\dfrac{(x+h)^3-x^3}{h}=\\dfrac{3x^2h+3xh^2+h^3}{h}=3x^2+3xh+h^2$.","As $h\\to0$, the terms with $h$ vanish."],"a":"$f'(x)=3x^2$"},{"t":"p","x":"**Continuity and differentiability.** A function is **continuous** at $x=a$ when $\\lim_{x\\to a}f(x)=f(a)$ (you can draw it without lifting your pen). It is **differentiable** at $a$ when the first-principles limit exists, which also needs the left and right gradients to match. A sharp corner, such as $y=|x|$ at $0$, is continuous but not differentiable."},{"t":"int","name":"tangent","cap":"Move the point and shrink the gap $h$: the blue secant gradient closes in on the green tangent gradient. That is the definition of the derivative."}]},{"id":"mm3-c01-s2","code":"1.3","title":"The exponential function","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: exponential functions and graphs","url":"https://www.youtube.com/results?search_query=Joel+Speranza+exponential+functions+and+graphs","kind":"search"},{"src":"B","title":"3Blue1Brown: What is special about Euler's number e","url":"https://www.youtube.com/watch?v=m2MIpDrF7Es","kind":"video"}]},{"t":"p","x":"An exponential function has the variable in the **index**: $y=a^x$ with $a>0$, $a\\neq 1$. Every such graph passes through $(0,1)$, has the horizontal asymptote $y=0$, and is always positive. If $a>1$ it grows (the graph rises to the right). If $0\u003ca\u003c1$ it decays (the graph falls to the right)."},{"t":"p","x":"The special base is **Euler's number** $e\\approx 2.71828$. It is the unique base for which the gradient of the curve at every point equals the height of the curve. That is why $y=e^x$ is the star of calculus."},{"t":"key","x":"For $y=ae^{b(x-h)}+k$: the **horizontal asymptote** is $y=k$; $a$ stretches vertically (negative $a$ reflects in the $x$-axis); $b$ stretches horizontally (negative $b$ reflects in the $y$-axis); $h$ shifts right and $k$ shifts up."},{"t":"ex","title":"Sketching a transformed exponential","q":"Sketch $y=2e^{-x}+1$. State the asymptote, the $y$-intercept and the range.","s":["The base graph $y=e^x$ is reflected in the $y$-axis (because of $-x$), stretched by 2 vertically, then shifted up by 1.","Horizontal asymptote: $y=1$.","$y$-intercept: $x=0$ gives $y=2e^0+1=3$, so the point is $(0,3)$.","The graph is always above the asymptote, so the range is $y>1$. There is no $x$-intercept."],"a":"Asymptote $y=1$, $y$-intercept $(0,3)$, range $(1,\\infty)$."},{"t":"p","x":"To find an **$x$-intercept**, set $y=0$ and solve. Since $e^{\\text{anything}}>0$, you must be able to isolate $e^{\\ldots}$ equal to a positive number or the graph has no $x$-intercept."},{"t":"warn","x":"$e^{x+2}$ is not $e^x+2$. A shift inside the index moves the graph left or right. A number added outside moves it up or down, and only the second one moves the asymptote."},{"t":"int","name":"expfun","cap":"Slide $a$ and watch the gradient of $y=a^x$ at $x=0$. When $a=e$ the gradient equals the height."},{"t":"tb","rec":"1,3,4,7,11,12","ext":"13,15,16,18","x":"Exercise 1.3 covers sketching $y=a^x$ and $y=e^x$ with transformations, then finding intercepts and domain and range.","code":"1.3"},{"t":"p","x":"**Finding an exponential from information.** Substitute known points into $y=ae^{bx}+k$. A horizontal asymptote gives $k$ directly; a $y$-intercept gives $a+k$; a second point gives $b$."},{"t":"ex","title":"Exponential through two points","q":"$y=ae^{bx}$ passes through $(0,3)$ and $(1,3e^2)$. Find $a$ and $b$.","s":["$x=0$: $a=3$.","$x=1$: $3e^{b}=3e^2\\Rightarrow b=2$."],"a":"$y=3e^{2x}$"},{"t":"p","x":"**Index laws you need all the time:** $a^m a^n=a^{m+n}$, $\\frac{a^m}{a^n}=a^{m-n}$, $(a^m)^n=a^{mn}$, $a^{-n}=\\frac1{a^n}$, $a^{1/n}=\\sqrt[n]{a}$. For $e$: $e^xe^y=e^{x+y}$ and $\\frac1{e^{x}}=e^{-x}$."},{"t":"warn","x":"$e^x\\cdot e^y=e^{x+y}$, but $e^x+e^y$ cannot be combined. Many \"simplify\" errors come from treating a sum like a product."}]},{"id":"mm3-c01-s3","code":"1.4","title":"Differentiation of exponential functions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: differentiating e^x","url":"https://www.youtube.com/results?search_query=Joel+Speranza+differentiating+e%5Ex","kind":"search"},{"src":"B","title":"3Blue1Brown: What is special about Euler's number e","url":"https://www.youtube.com/watch?v=m2MIpDrF7Es","kind":"video"}]},{"t":"key","x":"$$\\frac{d}{dx}\\left(e^x\\right)=e^x\\qquad\\text{and}\\qquad \\frac{d}{dx}\\left(e^{f(x)}\\right)=f'(x)\\,e^{f(x)}$$"},{"t":"p","x":"The second rule is the chain rule in action: differentiate the **inside** and multiply by the original exponential. So $\\frac{d}{dx}e^{3x}=3e^{3x}$, $\\frac{d}{dx}e^{x^2}=2xe^{x^2}$ and $\\frac{d}{dx}e^{-2x+1}=-2e^{-2x+1}$."},{"t":"ex","title":"Differentiating exponentials","q":"Differentiate $y=5e^{4x}-e^{-x^2}$.","s":["First term: $5\\times 4e^{4x}=20e^{4x}$.","Second term: the inside is $-x^2$ with derivative $-2x$, so $\\frac{d}{dx}e^{-x^2}=-2xe^{-x^2}$. Because of the minus sign in front, this term contributes $+2xe^{-x^2}$.","$y'=20e^{4x}+2xe^{-x^2}$."],"a":"$y'=20e^{4x}+2xe^{-x^2}$"},{"t":"ex","title":"Equation of a tangent","q":"Find the equation of the tangent to $y=e^{2x}$ at $x=0$.","s":["$y'=2e^{2x}$, so at $x=0$ the gradient is $2$.","The point is $(0,e^0)=(0,1)$.","Tangent: $y-1=2(x-0)$, so $y=2x+1$."],"a":"$y=2x+1$"},{"t":"warn","x":"Do not write $\\frac{d}{dx}e^{3x}=3xe^{3x-1}$. The power rule does not apply to $e^x$, because $x$ is in the index, not the base."},{"t":"tb","rec":"1,2,5,6,7,10","ext":"13,16,17,19,20","x":"Exercise 1.4 starts with direct derivatives of $e^{f(x)}$, then tangents and stationary points.","code":"1.4"},{"t":"ex","title":"Stationary point of an exponential","q":"Find and classify the stationary point of $y=e^x-2x$.","s":["$y'=e^x-2=0\\Rightarrow x=\\ln2$. Then $y=2-2\\ln2\\approx0.614$.","$y''=e^x>0$ everywhere, so it is a minimum."],"a":"Minimum at $\\left(\\ln2,\\ 2-2\\ln2\\right)$."},{"t":"p","x":"**Rate of change in context.** If $N=N_0e^{kt}$ then $\\frac{dN}{dt}=kN$: the rate is proportional to the amount. This single idea underlies population growth, radioactive decay and compound interest, so a statement like \"the rate of change is proportional to the size\" should immediately suggest an exponential."}]},{"id":"mm3-c01-s4","code":"1.5","title":"The logarithmic function","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: logarithm laws and the natural logarithm","url":"https://www.youtube.com/results?search_query=Joel+Speranza+logarithm+laws+and+the+natural+logarithm","kind":"search"}]},{"t":"p","x":"A **logarithm** answers the question \"what power?\". $\\log_a(x)=y$ means $a^y=x$. The **natural logarithm** is the log to base $e$: $\\ln x=\\log_e x$. It is the inverse of $e^x$, so $\\ln(e^x)=x$ and $e^{\\ln x}=x$."},{"t":"key","x":"**Log laws** (any base): $\\log(xy)=\\log x+\\log y$; $\\log\\!\\left(\\tfrac xy\\right)=\\log x-\\log y$; $\\log(x^n)=n\\log x$; $\\log_a 1=0$; $\\log_a a=1$."},{"t":"p","x":"Because $\\ln x$ is the inverse of $e^x$, its graph is the reflection of $y=e^x$ in the line $y=x$. So $y=\\ln x$ has domain $x>0$, range all reals, a **vertical asymptote** at $x=0$, and passes through $(1,0)$."},{"t":"ex","title":"Simplifying with log laws","q":"Write $2\\ln 3+\\ln 5-\\ln 15$ as a single logarithm and simplify.","s":["$2\\ln 3=\\ln 9$, so the expression is $\\ln 9+\\ln 5-\\ln 15$.","$\\ln 9+\\ln 5=\\ln 45$, and $\\ln 45-\\ln 15=\\ln\\frac{45}{15}=\\ln 3$."],"a":"$\\ln 3$"},{"t":"ex","title":"Sketching a transformed log graph","q":"Describe $y=\\ln(x-2)+1$.","s":["Shift $y=\\ln x$ right by 2 and up by 1.","Vertical asymptote $x=2$, domain $x>2$.","$x$-intercept: $\\ln(x-2)=-1\\Rightarrow x-2=e^{-1}\\Rightarrow x=2+e^{-1}\\approx 2.37$."],"a":"Asymptote $x=2$, domain $x>2$, $x$-intercept $2+e^{-1}$."},{"t":"warn","x":"$\\ln(x+y)$ is not $\\ln x+\\ln y$. The log of a sum has no simple rule, and $\\ln(x)\\ln(y)$ is not $\\ln(xy)$."},{"t":"int","name":"logfun","cap":"Move the point on $y=e^x$ and watch its mirror image on $y=\\ln x$ across the line $y=x$."},{"t":"tb","rec":"1,2,3,6,10,12","ext":"13,15,17,20","x":"Exercise 1.5 covers index and log laws, then graphs of $y=\\ln x$ and its transformations.","code":"1.5"},{"t":"key","x":"**Change of base:** $\\log_a x=\\dfrac{\\ln x}{\\ln a}$. Use it to evaluate logs on a calculator and to solve $a^x=b$ as $x=\\dfrac{\\ln b}{\\ln a}$."},{"t":"ex","title":"Solving $a^x=b$","q":"Solve $2^x=7$ to 3 decimal places.","s":["Take $\\ln$ of both sides: $x\\ln2=\\ln7$.","$x=\\frac{\\ln7}{\\ln2}\\approx2.807$."],"a":"$x\\approx2.807$"},{"t":"p","x":"**Domain and range, summary.** $y=e^x$: domain $\\mathbb R$, range $(0,\\infty)$. $y=\\ln x$: domain $(0,\\infty)$, range $\\mathbb R$. For $y=\\ln(ax+b)$ the domain is where $ax+b>0$."}]},{"id":"mm3-c01-s5","code":"1.6","title":"Solving equations","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: solving exponential and logarithmic equations","url":"https://www.youtube.com/results?search_query=Joel+Speranza+solving+exponential+and+logarithmic+equations","kind":"search"}]},{"t":"p","x":"**Equations with $e$.** Isolate the exponential, then take $\\ln$ of both sides. For $3e^{2x}=18$: divide to get $e^{2x}=6$, take $\\ln$: $2x=\\ln 6$, so $x=\\tfrac12\\ln 6$."},{"t":"p","x":"**Quadratics in $e^x$.** If you see $e^{2x}$ and $e^x$ together, substitute $u=e^x$ and solve the quadratic. Remember $u=e^x$ must be positive, so reject any $u\\le 0$."},{"t":"ex","title":"A quadratic in $e^x$","q":"Solve $e^{2x}-5e^x+6=0$.","s":["Let $u=e^x$, so $u^2-5u+6=0$, giving $(u-2)(u-3)=0$.","$e^x=2\\Rightarrow x=\\ln 2$ and $e^x=3\\Rightarrow x=\\ln 3$."],"a":"$x=\\ln 2$ or $x=\\ln 3$"},{"t":"p","x":"**Equations with $\\ln$.** Combine logs into one, rewrite in index form, then solve. Always **check the domain**: any solution that makes a log argument zero or negative is rejected."},{"t":"ex","title":"A log equation with a domain check","q":"Solve $\\ln(x)+\\ln(x-2)=\\ln 3$.","s":["Combine: $\\ln\\big(x(x-2)\\big)=\\ln 3$, so $x^2-2x=3$.","$x^2-2x-3=0\\Rightarrow (x-3)(x+1)=0$.","$x=-1$ makes $\\ln x$ undefined, so reject it."],"a":"$x=3$"},{"t":"warn","x":"Rejecting solutions is part of the answer. In an exam, write \"reject, since $\\ln$ is undefined for negative arguments\" and you keep the mark."},{"t":"tb","rec":"1,4,6,8,11,12","ext":"14,16,17,19,20","x":"Exercise 1.6 mixes equations in $e$, quadratics in $e^x$, and log equations with domain checks. Technology is used for equations that cannot be solved by hand.","code":"1.6"},{"t":"ex","title":"Equation with log bases","q":"Solve $\\log_2x+\\log_2(x-2)=3$.","s":["Combine: $\\log_2\\big(x(x-2)\\big)=3\\Rightarrow x(x-2)=2^3=8$.","$x^2-2x-8=0\\Rightarrow(x-4)(x+2)=0$.","$x=-2$ makes $\\log_2x$ undefined, so reject."],"a":"$x=4$"},{"t":"ex","title":"Index form","q":"Solve $\\ln(2x-1)=2$.","s":["Rewrite in index form: $2x-1=e^2$.","$x=\\frac{e^2+1}2\\approx4.19$."],"a":"$x=\\dfrac{e^2+1}{2}$"},{"t":"p","x":"**Strategy.** (1) Is the unknown in an index? Isolate the exponential, then take $\\ln$. (2) Is it inside a log? Combine to one log, convert to index form. (3) Is there an $e^{2x}$ and $e^x$? Substitute $u=e^x$. (4) Always check the domain."}]},{"id":"mm3-c01-s6","code":"1.7","title":"Differentiation of logarithmic functions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: differentiating ln x","url":"https://www.youtube.com/results?search_query=Joel+Speranza+differentiating+ln+x","kind":"search"}]},{"t":"key","x":"$$\\frac{d}{dx}\\big(\\ln x\\big)=\\frac1x\\quad(x>0)\\qquad\\text{and}\\qquad \\frac{d}{dx}\\big(\\ln f(x)\\big)=\\frac{f'(x)}{f(x)}$$"},{"t":"p","x":"The second rule says: derivative of the inside **over** the inside. So $\\frac{d}{dx}\\ln(3x+1)=\\frac{3}{3x+1}$ and $\\frac{d}{dx}\\ln(x^2+4)=\\frac{2x}{x^2+4}$."},{"t":"p","x":"A useful shortcut is to simplify with log laws **before** differentiating. $\\ln(x^5)=5\\ln x$, so its derivative is $\\tfrac5x$, much quicker than using the chain rule."},{"t":"ex","title":"Differentiating logs","q":"Differentiate $y=\\ln\\!\\big((2x+1)^3\\big)$ in two ways.","s":["Chain rule: $\\frac{f'}{f}=\\frac{3(2x+1)^2\\cdot 2}{(2x+1)^3}=\\frac{6}{2x+1}$.","Log law first: $y=3\\ln(2x+1)$, so $y'=3\\cdot\\frac{2}{2x+1}=\\frac{6}{2x+1}$."],"a":"$\\dfrac{6}{2x+1}$"},{"t":"warn","x":"$\\frac{d}{dx}\\ln(3x)=\\frac1x$, not $\\frac{1}{3x}$. The inside derivative is $3$, so the answer is $\\frac{3}{3x}=\\frac1x$."},{"t":"tb","rec":"1,4,6,10,11","ext":"14,16,17,19","x":"Exercise 1.7 practises $\\ln f(x)$ derivatives, tangents to log curves, and using log laws first.","code":"1.7"},{"t":"ex","title":"Log of a trig function","q":"Differentiate $y=\\ln(\\sin x)$ for $0\u003cx\u003c\\pi$.","s":["$\\frac{f'}f=\\frac{\\cos x}{\\sin x}$."],"a":"$\\cot x$"},{"t":"ex","title":"Tangent to a log curve","q":"Find the tangent to $y=\\ln x$ at $x=e$.","s":["$y'=\\frac1x$, so the gradient is $\\frac1e$; the point is $(e,1)$.","$y-1=\\frac1e(x-e)\\Rightarrow y=\\frac xe$."],"a":"$y=\\dfrac{x}{e}$ (it passes through the origin)"}]},{"id":"mm3-c01-s7","code":"1.8","title":"Modelling and solving with exponential and logarithmic functions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: exponential growth and decay modelling","url":"https://www.youtube.com/results?search_query=Joel+Speranza+exponential+growth+and+decay+modelling","kind":"search"}]},{"t":"p","x":"**Growth and decay.** A quantity that changes at a rate proportional to its size follows $N=N_0e^{kt}$. If $k>0$ it grows; if $k\u003c0$ it decays. $N_0$ is the starting amount (at $t=0$). The rate of change is $\\frac{dN}{dt}=kN$."},{"t":"p","x":"**Half-life.** The time for a decaying quantity to halve. Solve $\\tfrac12N_0=N_0e^{kt}$ to get $t=\\dfrac{\\ln 2}{-k}$."},{"t":"p","x":"**Decay to a limit.** Many real models approach a constant, such as cooling to room temperature: $T=T_\\infty+Ae^{kt}$ with $k\u003c0$. The horizontal asymptote $T=T_\\infty$ is the long-term value."},{"t":"ex","title":"Exponential decay","q":"A drug amount is $A=80e^{-0.2t}$ mg after $t$ hours. Find the amount after 3 hours and how fast it is changing then.","s":["$A(3)=80e^{-0.6}\\approx 43.9$ mg.","$\\frac{dA}{dt}=-0.2A$, so at $t=3$ the rate is $-0.2\\times 43.9\\approx -8.78$ mg/h."],"a":"About $43.9$ mg, decreasing at about $8.78$ mg per hour."},{"t":"ex","title":"Time to reach a value","q":"When does $A=80e^{-0.2t}$ fall to $10$ mg?","s":["$10=80e^{-0.2t}\\Rightarrow e^{-0.2t}=\\tfrac18$.","$-0.2t=\\ln\\tfrac18=-\\ln 8\\Rightarrow t=5\\ln 8\\approx 10.4$ hours."],"a":"$t=5\\ln 8\\approx 10.4$ hours"},{"t":"warn","x":"Always state units and interpret the sign. A negative rate of change means the quantity is decreasing, not that the answer is \"wrong\"."},{"t":"tb","rec":"1,3,5,7,10,12","ext":"13,16,17,19","x":"Exercise 1.8 is word-problem modelling: growth, decay, half-life, rates and tangents to log curves.","code":"1.8"},{"t":"ex","title":"Cooling model","q":"A drink cools as $T=20+60e^{-0.1t}$ (\u00b0C, $t$ in minutes). Find its starting temperature, the long-term temperature, and when it reaches $40^\\circ$C.","s":["$T(0)=80$. As $t\\to\\infty$, $T\\to20$ (room temperature).","$20+60e^{-0.1t}=40\\Rightarrow e^{-0.1t}=\\frac13\\Rightarrow t=10\\ln3\\approx11.0$ min."],"a":"$80^\\circ$C, $20^\\circ$C, and about $11.0$ minutes."},{"t":"ex","title":"Doubling time","q":"A population doubles every 8 hours. Write it as $P=P_0e^{kt}$ and find $k$.","s":["$2P_0=P_0e^{8k}\\Rightarrow8k=\\ln2$."],"a":"$k=\\frac{\\ln2}8\\approx0.0866$ per hour"},{"t":"warn","x":"A model is only valid in a sensible domain. Exponential growth cannot continue forever (limited food, space or money). In extended-response questions, comment on this limitation when asked to evaluate a model."}]},{"id":"mm3-c01-s8","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**What the exam rewards.** Marks are awarded for the correct method, accurate answers, and clear communication. Always write the **rule you use** (for example \"chain rule\"), show the substitution, and give **exact answers** unless told to round. Use your CAS to check, not to replace working in the non-technology paper."},{"t":"p","x":"**Command words.** *Determine/find*: show working to a result. *Show that*: you must reach the stated result, so every line must follow; do not work backwards. *Hence*: you must use the previous part. *Evaluate the model*: comment on accuracy and limitations."},{"t":"p","x":"**CAS reminders.** Set radians when angles use $\\pi$. Use `solve`, `d/dx` (or `diff`) and `ln` for natural logs. When a solve returns many solutions, read the domain in the question."},{"t":"ex","title":"Mixed exam-style problem","q":"A hot metal cools as $T(t)=25+75e^{-kt}$. After 5 minutes it is $55^\\circ$C. (a) Find $k$. (b) Find the rate of cooling at $t=5$.","s":["(a) $25+75e^{-5k}=55\\Rightarrow e^{-5k}=\\frac25\\Rightarrow k=\\frac15\\ln\\frac52\\approx0.183$.","(b) $T'(t)=-75ke^{-kt}$. At $t=5$, $75e^{-5k}=30$, so $T'(5)=-30k\\approx-5.50$."],"a":"$k\\approx0.183$; cooling at about $5.5^\\circ$C per minute."},{"t":"warn","x":"Common losses in this chapter: forgetting $+c$ is a later chapter, but here it is forgetting to reject a log solution, mixing $\\ln(a+b)$ with $\\ln a+\\ln b$, and answering in a decimal when exact form was asked."}]}],"quiz":[{"topic":"Chain rule with e","q":"Differentiate $y=3e^{5x}$.","a":"15e^(5x)","alt":[],"ad":"$15e^{5x}$","sol":"The inside $5x$ has derivative $5$, so $y'=3\\cdot 5e^{5x}=15e^{5x}$.","h":["Which part is the \"inside\" of the exponential?","Differentiate the inside and multiply by the whole exponential.","The constant 3 stays as a multiplier: $3\\times 5\\times e^{5x}$."]},{"topic":"Chain rule with e","q":"Differentiate $y=e^{x^2-3x}$.","a":"(2x-3)e^(x^2-3x)","alt":[],"ad":"$(2x-3)e^{x^2-3x}$","sol":"The inside $x^2-3x$ has derivative $2x-3$, so $y'=(2x-3)e^{x^2-3x}$.","h":["Name the inside function.","Its derivative is $2x-3$.","Multiply it by $e^{x^2-3x}$."]},{"topic":"Log law","q":"Simplify $\\ln 8-\\ln 2$ to a single power of $\\ln 2$ (write the answer as a multiple of $\\ln 2$).","a":"2ln2","alt":["2ln(2)","ln4","ln(4)"],"ad":"$2\\ln 2$","sol":"$\\ln 8-\\ln 2=\\ln 4=\\ln 2^2=2\\ln 2$.","h":["Use $\\ln a-\\ln b=\\ln\\frac ab$.","That gives $\\ln 4$.","Write $4$ as $2^2$."]},{"topic":"Solve in e","q":"Solve $2e^{3x}=14$. Give an exact answer.","a":"(1/3)ln7","alt":["ln(7)/3","ln7/3","(ln7)/3","1/3ln7","(1/3)ln(7)"],"ad":"$x=\\tfrac13\\ln 7$","sol":"$e^{3x}=7\\Rightarrow 3x=\\ln 7\\Rightarrow x=\\tfrac13\\ln 7$.","h":["Divide both sides by 2 first.","Take $\\ln$ of both sides.","Divide by 3."]},{"topic":"Quadratic in e^x","q":"Solve $e^{2x}-4e^x-5=0$.","a":"ln5","alt":["x=ln5","ln(5)","x=ln(5)"],"ad":"$x=\\ln 5$","sol":"Let $u=e^x$: $u^2-4u-5=0$, $(u-5)(u+1)=0$. $u=-1$ is impossible, so $e^x=5$ and $x=\\ln 5$.","h":["Substitute $u=e^x$.","Factorise the quadratic in $u$.","Which root is impossible and why?"]},{"topic":"Log equation","q":"Solve $\\ln(x+1)+\\ln(x-1)=\\ln 8$.","a":"3","alt":["x=3"],"ad":"$x=3$","sol":"$\\ln\\big((x+1)(x-1)\\big)=\\ln 8\\Rightarrow x^2-1=8\\Rightarrow x=\\pm3$. Reject $x=-3$ because $\\ln(x-1)$ is undefined there. So $x=3$.","h":["Combine the left side into one log.","Equate the arguments.","Check each solution in the original domain."]},{"topic":"Differentiate ln","q":"Differentiate $y=\\ln(x^2+1)$.","a":"2x/(x^2+1)","alt":["(2x)/(x^2+1)"],"ad":"$\\dfrac{2x}{x^2+1}$","sol":"Derivative of the inside is $2x$, over the inside $x^2+1$.","h":["Use $\\frac{f'}{f}$.","$f=x^2+1$.","$f'=2x$."]},{"topic":"Tangent","q":"Find the gradient of the tangent to $y=e^{2x}+x$ at $x=0$.","a":"3","alt":["m=3"],"ad":"$3$","sol":"$y'=2e^{2x}+1$; at $x=0$, $y'=2+1=3$.","h":["Differentiate first.","Differentiate $e^{2x}$ by the chain rule.","Substitute $x=0$."]},{"topic":"Growth model","q":"A population is $P=500e^{0.04t}$. Find $P$ when $t=10$ (nearest whole number).","a":"746","alt":["745.9","746 people"],"ad":"$\\approx 746$","sol":"$P(10)=500e^{0.4}\\approx 500\\times1.49182=745.9\\approx 746$.","h":["Substitute $t=10$.","You need $e^{0.4}$.","Multiply by 500 and round."]},{"topic":"Half-life","q":"A substance decays by $A=A_0e^{-0.1t}$. Find its half-life to 2 decimal places.","a":"6.93","alt":["6.931","10ln2"],"ad":"$10\\ln 2\\approx 6.93$","sol":"$\\tfrac12=e^{-0.1t}\\Rightarrow -0.1t=-\\ln 2\\Rightarrow t=10\\ln 2\\approx 6.93$.","h":["Set $A=\\tfrac12A_0$.","Take $\\ln$ of both sides.","Divide by $-0.1$."]},{"topic":"Limit","q":"Evaluate $\\displaystyle\\lim_{x\\to2}\\frac{x^2-4}{x-2}$.","a":"4","alt":[],"ad":"$4$","sol":"$\\frac{(x-2)(x+2)}{x-2}=x+2\\to4$.","h":["Substituting gives $0/0$.","Factorise the numerator.","Cancel and substitute."]},{"topic":"First principles","q":"Using first principles, $f(x)=x^2+3x$ gives $\\frac{f(x+h)-f(x)}{h}=2x+h+3$. Find $f'(x)$.","a":"2x+3","alt":[],"ad":"$2x+3$","sol":"Let $h\\to0$ in $2x+h+3$.","h":["What happens to $h$?","It tends to 0.","Remove $h$."]},{"topic":"Exponential through points","q":"$y=ae^{bx}$ passes through $(0,5)$ and $(1,5e^{-3})$. Find $b$.","a":"-3","alt":["b=-3"],"ad":"$b=-3$","sol":"$a=5$ and $5e^{b}=5e^{-3}$.","h":["Use $x=0$ first.","$a=5$.","Equate the exponents at $x=1$."]},{"topic":"Change of base","q":"Solve $3^x=20$ to 2 decimal places.","a":"2.73","alt":["2.727"],"ad":"$x=\\frac{\\ln20}{\\ln3}\\approx2.73$","sol":"$x=\\frac{\\ln20}{\\ln3}=2.7268$.","h":["Take $\\ln$ of both sides.","$x\\ln3=\\ln20$.","Divide and round."]},{"topic":"Stationary","q":"Find the $x$-value of the minimum of $y=e^x-3x$. Give an exact answer.","a":"ln3","alt":["ln(3)","x=ln3"],"ad":"$x=\\ln3$","sol":"$y'=e^x-3=0\\Rightarrow x=\\ln3$; $y''=e^x>0$.","h":["Differentiate.","Set to zero.","Solve with $\\ln$."]},{"topic":"Log equation","q":"Solve $\\log_3x+\\log_3(x-8)=2$.","a":"9","alt":["x=9"],"ad":"$x=9$","sol":"$x(x-8)=9\\Rightarrow x^2-8x-9=0\\Rightarrow x=9$ or $-1$; reject $-1$.","h":["Combine the logs.","Convert to index form.","Check the domain."]},{"topic":"Log derivative","q":"Differentiate $y=\\ln(\\cos x)$ for $0\u003cx\u003c\\frac\\pi2$.","a":"-tanx","alt":["-tan(x)"],"ad":"$-\\tan x$","sol":"$\\frac{-\\sin x}{\\cos x}=-\\tan x$.","h":["Use $\\frac{f'}f$.","$f'=-\\sin x$.","Simplify."]},{"topic":"Tangent","q":"The tangent to $y=\\ln x$ at $x=1$ has what $y$-intercept?","a":"-1","alt":[],"ad":"$-1$","sol":"Gradient $1$ at $(1,0)$: $y=x-1$.","h":["Gradient is $\\frac1x$ at $x=1$.","Point is $(1,0)$.","Write $y=mx+c$."]},{"topic":"Cooling","q":"$T=20+60e^{-0.1t}$. Find $T$ when $t=10$ (1 decimal place).","a":"42.1","alt":["42.07"],"ad":"$\\approx42.1$","sol":"$20+60e^{-1}=20+22.07=42.07$.","h":["Substitute $t=10$.","$e^{-1}\\approx0.3679$.","Multiply and add."]},{"topic":"Doubling","q":"$P=P_0e^{kt}$ triples in 6 years. Find $k$ exactly.","a":"ln3/6","alt":["(ln3)/6","(1/6)ln3","ln(3)/6"],"ad":"$k=\\dfrac{\\ln3}{6}$","sol":"$3=e^{6k}\\Rightarrow k=\\frac{\\ln3}6$.","h":["$3P_0=P_0e^{6k}$.","Cancel $P_0$.","Take $\\ln$."]}],"comets":[{"topic":"Extension: a tangent that passes through the origin","q":"Find the value of $a$ so that the tangent to $y=e^{x}$ at $x=a$ passes through the origin.","a":"1","alt":["a=1"],"ad":"$a=1$","sol":"The tangent at $x=a$ is $y-e^a=e^a(x-a)$. It passes through $(0,0)$ when $-e^a=-ae^a$, so $a=1$.","h":["Write the tangent at $x=a$.","Substitute $(0,0)$ into it.","Cancel $e^a$, which is never zero."]},{"topic":"Extension: solving a hidden quadratic","q":"Solve $\\ln(x)^2=\\ln(x^3)-2$ for $x$ given $\\ln(x)^2$ means $(\\ln x)^2$. Give exact answers.","a":"e and e^2","alt":["e,e^2","x=e,x=e^2","e^2,e"],"ad":"$x=e$ or $x=e^2$","sol":"Let $u=\\ln x$. Then $u^2=3u-2$, so $u^2-3u+2=0$, giving $u=1$ or $u=2$. So $x=e$ or $x=e^2$.","h":["Let $u=\\ln x$.","Use the log law on $\\ln(x^3)$.","Solve the quadratic in $u$."]},{"topic":"Extension: Where does $e^x$ equal its tangent from the origin?","q":"The line $y=mx$ touches $y=e^x$ exactly once. Find $m$ exactly.","a":"e","alt":["m=e"],"ad":"$m=e$","sol":"A tangent at $x=a$ is $y=e^ax+e^a(1-a)$; it passes through the origin when $a=1$, so $m=e$.","h":["Write the tangent at $x=a$.","Force it through $(0,0)$.","Then $m=e^a$."]}],"hours":5},"mm3-c02":{"id":"mm3-c02","interactive":"trigfun","summary":"Trigonometric functions are periodic, so they model tides, temperature and anything that repeats. This chapter works in radians, uses the unit circle for exact values, sketches transformed sine and cosine graphs, differentiates them, and models real cycles.","videos":[{"src":"B","title":"Euler's formula with introductory group theory (3Blue1Brown)","url":"https://www.youtube.com/watch?v=mvmuCPvRoWQ","kind":"video"},{"src":"B","title":"Derivative formulas through geometry (3Blue1Brown, ch. 3)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Derivative+formulas+through+geometry+Essence+of+calculus+chapter+3","kind":"search"},{"src":"J","title":"Unit circle and exact values","url":"https://www.youtube.com/results?search_query=Joel+Speranza+unit+circle+exact+values","kind":"search"},{"src":"J","title":"Trig graphs and transformations","url":"https://www.youtube.com/results?search_query=Joel+Speranza+trigonometric+graphs+transformations","kind":"search"},{"src":"J","title":"Differentiating sin and cos","url":"https://www.youtube.com/results?search_query=Joel+Speranza+differentiation+sin+cos","kind":"search"}],"sections":[{"id":"mm3-c02-s1","code":"2.2","title":"The unit circle and radians","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: radians and the unit circle exact values","url":"https://www.youtube.com/results?search_query=Joel+Speranza+radians+and+the+unit+circle+exact+values","kind":"search"}]},{"t":"p","x":"One **radian** is the angle at the centre of a circle subtended by an arc equal in length to the radius. A full turn is $2\\pi$ radians, so $\\pi$ rad $=180^\\circ$. To convert: degrees $\\times\\frac{\\pi}{180}$ gives radians, and radians $\\times\\frac{180}{\\pi}$ gives degrees."},{"t":"p","x":"On the **unit circle** (radius 1), the point at angle $\\theta$ is $(\\cos\\theta,\\sin\\theta)$. So $\\cos$ is the $x$-coordinate, $\\sin$ is the $y$-coordinate, and $\\tan\\theta=\\frac{\\sin\\theta}{\\cos\\theta}$ is the gradient of the radius."},{"t":"key","x":"Exact values: $\\sin\\frac\\pi6=\\tfrac12$, $\\cos\\frac\\pi6=\\tfrac{\\sqrt3}2$; $\\sin\\frac\\pi4=\\cos\\frac\\pi4=\\tfrac{\\sqrt2}2$; $\\sin\\frac\\pi3=\\tfrac{\\sqrt3}2$, $\\cos\\frac\\pi3=\\tfrac12$. Always: $\\sin^2\\theta+\\cos^2\\theta=1$."},{"t":"p","x":"Use the quadrant to find the sign. In quadrant 1 all are positive; 2 only $\\sin$; 3 only $\\tan$; 4 only $\\cos$. Reduce an angle to its **reference angle** in the first quadrant, then apply the sign."},{"t":"ex","title":"An exact value outside the first quadrant","q":"Find the exact value of $\\sin\\frac{5\\pi}{6}$ and $\\cos\\frac{7\\pi}{6}$.","s":["$\\frac{5\\pi}{6}$ is in quadrant 2 with reference angle $\\frac\\pi6$; $\\sin$ is positive there, so $\\sin\\frac{5\\pi}6=\\frac12$.","$\\frac{7\\pi}{6}$ is in quadrant 3 with reference angle $\\frac\\pi6$; $\\cos$ is negative there, so $\\cos\\frac{7\\pi}6=-\\frac{\\sqrt3}2$."],"a":"$\\tfrac12$ and $-\\tfrac{\\sqrt3}{2}$"},{"t":"ex","title":"Using the Pythagorean identity","q":"If $\\sin\\theta=\\tfrac35$ and $\\theta$ is in quadrant 2, find $\\cos\\theta$ and $\\tan\\theta$.","s":["$\\cos^2\\theta=1-\\tfrac9{25}=\\tfrac{16}{25}$, so $\\cos\\theta=\\pm\\tfrac45$.","Quadrant 2 has negative $\\cos$, so $\\cos\\theta=-\\tfrac45$.","$\\tan\\theta=\\frac{3/5}{-4/5}=-\\tfrac34$."],"a":"$\\cos\\theta=-\\frac45$, $\\tan\\theta=-\\frac34$"},{"t":"warn","x":"Calculator in the wrong mode is the most common lost mark. If the question uses $\\pi$, your CAS or calculator must be in **radians**."},{"t":"tb","rec":"1,2,3,4,5,6,7,9,11","ext":"13,14,16,17,19","x":"Exercise 2.2 covers radian conversion, exact values and the unit circle, arc length and sector area.","code":"2.2"},{"t":"p","x":"**Arc length and sector area.** For a circle of radius $r$ and angle $\\theta$ in radians: arc length $s=r\\theta$ and sector area $A=\\frac12r^2\\theta$. These are only this simple in radians, which is the whole reason radians exist."},{"t":"ex","title":"Sector","q":"A sector has radius $6$ cm and angle $\\frac{2\\pi}3$. Find the arc length and area.","s":["$s=6\\cdot\\frac{2\\pi}3=4\\pi$.","$A=\\frac12\\cdot36\\cdot\\frac{2\\pi}3=12\\pi$."],"a":"$4\\pi$ cm and $12\\pi\\ \\text{cm}^2$"},{"t":"key","x":"**Symmetry identities:** $\\sin(\\pi-\\theta)=\\sin\\theta$, $\\cos(\\pi-\\theta)=-\\cos\\theta$, $\\sin(-\\theta)=-\\sin\\theta$, $\\cos(-\\theta)=\\cos\\theta$, $\\sin\\!\\left(\\tfrac\\pi2-\\theta\\right)=\\cos\\theta$."},{"t":"ex","title":"Using symmetry","q":"Given $\\sin\\theta=0.3$, write $\\sin(\\pi+\\theta)$ and $\\cos\\left(\\frac\\pi2-\\theta\\right)$.","s":["$\\sin(\\pi+\\theta)=-\\sin\\theta=-0.3$.","$\\cos\\left(\\frac\\pi2-\\theta\\right)=\\sin\\theta=0.3$."],"a":"$-0.3$ and $0.3$"}]},{"id":"mm3-c02-s2","code":"2.3","title":"Trigonometric functions and their graphs","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: trigonometric graphs amplitude period","url":"https://www.youtube.com/results?search_query=Joel+Speranza+trigonometric+graphs+amplitude+period","kind":"search"}]},{"t":"p","x":"For $y=a\\sin\\big(b(x-c)\\big)+d$ (and likewise cosine): **amplitude** $|a|$; **period** $\\frac{2\\pi}{b}$; **horizontal shift** $c$; **vertical shift** $d$, with the **midline** $y=d$. The maximum is $d+|a|$ and the minimum is $d-|a|$."},{"t":"p","x":"The graph of $y=\\tan x$ has period $\\pi$ and vertical asymptotes at $x=\\frac\\pi2+n\\pi$. It has no amplitude."},{"t":"ex","title":"Reading a graph","q":"State the amplitude, period, and range of $y=3\\sin(2x)+1$.","s":["Amplitude $=3$. Period $=\\frac{2\\pi}{2}=\\pi$.","Midline $y=1$, so the range is $1-3\\le y\\le 1+3$."],"a":"Amplitude 3, period $\\pi$, range $[-2,4]$."},{"t":"p","x":"**Solving trig equations** on a given domain: find the reference angle from the inverse trig function, then use symmetry for every solution in the domain. For $\\sin$ the two solutions are $\\theta$ and $\\pi-\\theta$; for $\\cos$ they are $\\theta$ and $2\\pi-\\theta$; for $\\tan$ add $\\pi$. If the argument is $2x$, the domain for $2x$ is twice as long, so list more solutions before dividing."},{"t":"ex","title":"Solving on a domain","q":"Solve $2\\sin(2x)=\\sqrt3$ for $0\\le x\\le\\pi$.","s":["$\\sin(2x)=\\frac{\\sqrt3}2$, and $0\\le 2x\\le 2\\pi$.","$2x=\\frac\\pi3$ or $\\frac{2\\pi}3$.","$x=\\frac\\pi6$ or $\\frac\\pi3$."],"a":"$x=\\frac\\pi6,\\ \\frac\\pi3$"},{"t":"warn","x":"Change the domain **first**. For $\\sin(2x)$ on $0\\le x\\le\\pi$ you need $0\\le 2x\\le 2\\pi$. Forgetting that doubling the argument doubles the interval loses half the solutions."},{"t":"int","name":"trigfun","cap":"Change amplitude, period and shifts and see the equation and key features update."},{"t":"tb","rec":"1,3,6,8,10,12","ext":"13,15,16,17,19","x":"Exercise 2.3 covers graphs of $\\sin$, $\\cos$, $\\tan$ with transformations and solving equations on a domain.","code":"2.3"},{"t":"ex","title":"Reading an equation from a graph","q":"A sine curve has maximum $5$ at $x=\\frac\\pi6$, minimum $-1$, and period $\\pi$. Find a cosine model.","s":["Midline $d=\\frac{5+(-1)}2=2$; amplitude $a=3$; $b=\\frac{2\\pi}\\pi=2$.","A maximum at $x=\\frac\\pi6$ means the cosine is shifted right by $\\frac\\pi6$."],"a":"$y=3\\cos\\left(2\\left(x-\\frac\\pi6\\right)\\right)+2$"},{"t":"ex","title":"Tan equation","q":"Solve $\\tan x=-1$ for $0\\le x\\le2\\pi$.","s":["Reference angle $\\frac\\pi4$; tangent is negative in quadrants 2 and 4."],"a":"$x=\\frac{3\\pi}4,\\ \\frac{7\\pi}4$"},{"t":"p","x":"**Equations with a quadratic.** For $2\\sin^2x-\\sin x=0$, factorise: $\\sin x(2\\sin x-1)=0$, so $\\sin x=0$ or $\\sin x=\\frac12$. Never divide by $\\sin x$, because you lose solutions."},{"t":"ex","title":"Trig quadratic","q":"Solve $2\\sin^2x-\\sin x=0$ for $0\\le x\\le2\\pi$.","s":["$\\sin x=0\\Rightarrow x=0,\\pi,2\\pi$.","$\\sin x=\\frac12\\Rightarrow x=\\frac\\pi6,\\frac{5\\pi}6$."],"a":"$x=0,\\ \\frac\\pi6,\\ \\frac{5\\pi}6,\\ \\pi,\\ 2\\pi$"}]},{"id":"mm3-c02-s3","code":"2.4","title":"Differentiating trigonometric functions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: differentiating sin and cos","url":"https://www.youtube.com/results?search_query=Joel+Speranza+differentiating+sin+and+cos","kind":"search"},{"src":"B","title":"3Blue1Brown: Derivative formulas through geometry","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Derivative+formulas+through+geometry","kind":"search"}]},{"t":"key","x":"$$\\frac{d}{dx}\\sin x=\\cos x,\\qquad\\frac{d}{dx}\\cos x=-\\sin x,\\qquad\\frac{d}{dx}\\tan x=\\sec^2x=\\frac1{\\cos^2x}$$"},{"t":"p","x":"With the chain rule: $\\frac{d}{dx}\\sin(f(x))=f'(x)\\cos(f(x))$ and $\\frac{d}{dx}\\cos(f(x))=-f'(x)\\sin(f(x))$. These only hold when $x$ is in **radians**."},{"t":"ex","title":"Chain rule with trig","q":"Differentiate $y=\\sin(3x)+\\cos(x^2)$.","s":["$\\frac{d}{dx}\\sin(3x)=3\\cos(3x)$.","$\\frac{d}{dx}\\cos(x^2)=-2x\\sin(x^2)$."],"a":"$y'=3\\cos(3x)-2x\\sin(x^2)$"},{"t":"ex","title":"Stationary points of a trig graph","q":"Find where $y=\\sin x+\\cos x$ has stationary points on $0\\le x\\le 2\\pi$.","s":["$y'=\\cos x-\\sin x=0\\Rightarrow\\tan x=1$.","$x=\\frac\\pi4$ or $\\frac{5\\pi}{4}$."],"a":"$x=\\frac\\pi4$ and $x=\\frac{5\\pi}4$"},{"t":"warn","x":"$\\frac{d}{dx}\\sin(x^2)\\neq\\cos(x^2)$. You must multiply by the derivative of the inside. Also, $\\frac{d}{dx}\\cos x$ is **negative** sine."},{"t":"tb","rec":"1,2,4,5,6,9,11,12","ext":"14,15,17,19","x":"Exercise 2.4 differentiates $\\sin$, $\\cos$, $\\tan$ with the chain rule, then finds tangents, normals and stationary points.","code":"2.4"},{"t":"ex","title":"Tangent to a sine curve","q":"Find the equation of the tangent to $y=\\sin x$ at $x=\\frac\\pi3$.","s":["$y'=\\cos x$, gradient $\\frac12$; point $\\left(\\frac\\pi3,\\frac{\\sqrt3}2\\right)$.","$y-\\frac{\\sqrt3}2=\\frac12\\left(x-\\frac\\pi3\\right)$."],"a":"$y=\\frac12x+\\frac{\\sqrt3}2-\\frac\\pi6$"},{"t":"ex","title":"Product with trig","q":"Differentiate $y=x\\sin x$.","s":["Product rule: $1\\cdot\\sin x+x\\cos x$."],"a":"$\\sin x+x\\cos x$"},{"t":"ex","title":"Differentiating tan","q":"Differentiate $y=\\tan(3x)$.","s":["$\\frac d{dx}\\tan u=u'\\sec^2u$ with $u=3x$."],"a":"$3\\sec^2(3x)$"}]},{"id":"mm3-c02-s4","code":"2.5","title":"Modelling with trigonometric functions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: trigonometric modelling tides","url":"https://www.youtube.com/results?search_query=Joel+Speranza+trigonometric+modelling+tides","kind":"search"}]},{"t":"p","x":"A periodic situation like tides, daylight hours or a Ferris wheel is modelled by $y=a\\sin\\big(b(t-c)\\big)+d$ or a cosine. Steps: find the midline from $\\frac{\\max+\\min}2$; the amplitude from $\\frac{\\max-\\min}2$; the period from the time between peaks; then use $b=\\frac{2\\pi}{\\text{period}}$."},{"t":"ex","title":"Building a model","q":"Water depth varies between 2 m and 6 m with a period of 12 hours, and is at its maximum at $t=0$. Find a model.","s":["Midline $=\\frac{2+6}2=4$; amplitude $=2$; $b=\\frac{2\\pi}{12}=\\frac\\pi6$.","Max at $t=0$ suggests cosine with no shift."],"a":"$D=2\\cos\\left(\\frac{\\pi t}6\\right)+4$"},{"t":"ex","title":"Using the model","q":"When is the depth first equal to 5 m?","s":["$2\\cos\\left(\\frac{\\pi t}{6}\\right)+4=5\\Rightarrow\\cos\\left(\\frac{\\pi t}6\\right)=\\frac12$.","$\\frac{\\pi t}{6}=\\frac\\pi3\\Rightarrow t=2$."],"a":"$t=2$ hours"},{"t":"p","x":"Rate of change is the derivative. $\\frac{dD}{dt}=-\\frac\\pi3\\sin\\left(\\frac{\\pi t}6\\right)$, which is zero at the highest and lowest tide and most negative halfway down."},{"t":"tb","rec":"1,2,4,6,8,9,12","ext":"13,15,17,20","x":"Exercise 2.5 is context modelling: tides, temperature, Ferris wheels and rates of change.","code":"2.5"},{"t":"ex","title":"Ferris wheel","q":"A wheel of radius $10$ m has its lowest point $2$ m above ground and turns once every $40$ s. Starting at the lowest point, model the height $h(t)$.","s":["Midline $12$, amplitude $10$, $b=\\frac{2\\pi}{40}=\\frac\\pi{20}$.","Starting at the minimum suggests $-\\cos$."],"a":"$h(t)=12-10\\cos\\left(\\frac{\\pi t}{20}\\right)$"},{"t":"ex","title":"Temperature model","q":"$T=18+6\\sin\\left(\\frac{\\pi}{12}(t-9)\\right)$. Find the maximum, when it occurs in the first 24 hours, and the rate of change at $t=9$.","s":["Max is $24$ when $\\frac\\pi{12}(t-9)=\\frac\\pi2\\Rightarrow t=15$.","$T'=\\frac\\pi2\\cos\\left(\\frac\\pi{12}(t-9)\\right)$; at $t=9$ it is $\\frac\\pi2\\approx1.57$."],"a":"$24^\\circ$C at $t=15$; rising at about $1.57^\\circ$C per hour."}]},{"id":"mm3-c02-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Radians first.** Check mode before any trig calculation. Unit-circle exact values must be exact; do not leave $0.866$ when $\\frac{\\sqrt3}2$ is asked."},{"t":"p","x":"**Solving trig equations, a routine.** (1) Isolate the trig function. (2) Find the reference angle. (3) Use quadrants for all solutions. (4) For $\\sin(bx)$, extend the domain to $b$ times its length before solving. (5) Divide by $b$ at the end."},{"t":"p","x":"**Modelling routine.** Max and min give midline and amplitude; the time between peaks gives the period; a known point (for example a max at $t=0$) selects sine or cosine and the shift. Check by substituting a point."},{"t":"ex","title":"Mixed problem","q":"Find the maximum value of $f(x)=3\\sin x+4\\cos x$ by differentiating, on $0\\le x\\le\\frac\\pi2$.","s":["$f'=3\\cos x-4\\sin x=0\\Rightarrow\\tan x=\\frac34$, $x\\approx0.6435$.","$\\sin x=\\frac35$, $\\cos x=\\frac45$, so $f=\\frac95+\\frac{16}5=5$."],"a":"Maximum value $5$ at $x\\approx0.644$."},{"t":"warn","x":"Frequent errors: using degrees, forgetting the negative in $\\frac d{dx}\\cos$, missing solutions when the argument is $2x$, and writing $\\sin^2x$ as $\\sin x^2$."}]}],"quiz":[{"topic":"Radians","q":"Convert $150^\\circ$ to radians. Give an exact answer.","a":"5pi/6","alt":["(5pi)/6","5\u03c0/6","5/6pi"],"ad":"$\\dfrac{5\\pi}{6}$","sol":"$150\\times\\frac{\\pi}{180}=\\frac{5\\pi}6$.","h":["Multiply by $\\frac{\\pi}{180}$.","Simplify $\\frac{150}{180}$.","$\\frac{150}{180}=\\frac56$."]},{"topic":"Exact value","q":"Find the exact value of $\\cos\\frac{2\\pi}{3}$.","a":"-1/2","alt":["-0.5","-(1/2)"],"ad":"$-\\tfrac12$","sol":"Reference angle $\\frac\\pi3$, quadrant 2 so cosine is negative: $-\\frac12$.","h":["Find the reference angle.","Which quadrant is $\\frac{2\\pi}3$ in?","Cosine is negative in quadrant 2."]},{"topic":"Amplitude and period","q":"State the period of $y=4\\cos(3x)-2$ as an exact value.","a":"2pi/3","alt":["(2pi)/3","2\u03c0/3"],"ad":"$\\dfrac{2\\pi}{3}$","sol":"Period $=\\frac{2\\pi}{b}=\\frac{2\\pi}3$.","h":["Period formula.","$b=3$.","Divide $2\\pi$ by 3."]},{"topic":"Range","q":"State the maximum value of $y=4\\cos(3x)-2$.","a":"2","alt":["y=2","max=2"],"ad":"$2$","sol":"Max $=d+|a|=-2+4=2$.","h":["Midline is $y=-2$.","Amplitude is 4.","Add them."]},{"topic":"Derivative","q":"Differentiate $y=\\sin(5x)$.","a":"5cos(5x)","alt":["5cos5x"],"ad":"$5\\cos(5x)$","sol":"Chain rule: inside derivative 5, times $\\cos(5x)$.","h":["Identify the inside.","Derivative of sin is cos.","Multiply by 5."]},{"topic":"Derivative","q":"Differentiate $y=\\cos(x^2)$.","a":"-2xsin(x^2)","alt":["-2x sin(x^2)","-2xsin(x\u00b2)"],"ad":"$-2x\\sin(x^2)$","sol":"$\\frac{d}{dx}\\cos u=-u'\\sin u$ with $u=x^2$, $u'=2x$.","h":["Cosine differentiates to negative sine.","Inside is $x^2$.","Multiply by $2x$."]},{"topic":"Solve","q":"Solve $2\\cos x=1$ for $0\\le x\\le 2\\pi$. List the solutions separated by commas, in order.","a":"pi/3,5pi/3","alt":["pi/3 and 5pi/3","\u03c0/3,5\u03c0/3","x=pi/3,5pi/3"],"ad":"$x=\\frac\\pi3,\\ \\frac{5\\pi}{3}$","sol":"$\\cos x=\\frac12$ gives reference angle $\\frac\\pi3$; cosine positive in quadrants 1 and 4: $\\frac\\pi3$ and $2\\pi-\\frac\\pi3=\\frac{5\\pi}3$.","h":["Isolate $\\cos x$.","Reference angle is $\\frac\\pi3$.","The second solution is $2\\pi-\\frac\\pi3$."]},{"topic":"Identity","q":"If $\\cos\\theta=\\frac{5}{13}$ and $\\theta$ is in quadrant 4, find $\\sin\\theta$.","a":"-12/13","alt":["-(12/13)"],"ad":"$-\\tfrac{12}{13}$","sol":"$\\sin^2\\theta=1-\\frac{25}{169}=\\frac{144}{169}$; quadrant 4 has negative sine, so $-\\frac{12}{13}$.","h":["Use $\\sin^2+\\cos^2=1$.","$\\sin^2\\theta=\\frac{144}{169}$.","Check the sign for quadrant 4."]},{"topic":"Model","q":"A model is $T=8\\sin\\left(\\frac{\\pi t}{12}\\right)+20$. Find the maximum temperature.","a":"28","alt":["28 degrees","T=28"],"ad":"$28$","sol":"Max $=20+8=28$.","h":["Midline is 20.","Amplitude is 8.","Add them."]},{"topic":"Stationary","q":"Find the first positive $x$ with $\\frac{d}{dx}\\sin x=0$. Give an exact value.","a":"pi/2","alt":["\u03c0/2","x=pi/2"],"ad":"$\\dfrac\\pi2$","sol":"$\\cos x=0$ first at $x=\\frac\\pi2$.","h":["Differentiate.","Set $\\cos x=0$.","Smallest positive solution."]},{"topic":"Sector","q":"Find the arc length of a sector with radius $5$ and angle $\\frac{3\\pi}{5}$.","a":"3pi","alt":["3\u03c0"],"ad":"$3\\pi$","sol":"$s=r\\theta=5\\cdot\\frac{3\\pi}5=3\\pi$.","h":["$s=r\\theta$.","Substitute.","Cancel the 5."]},{"topic":"Symmetry","q":"If $\\cos\\theta=\\frac13$, find $\\cos(\\pi-\\theta)$.","a":"-1/3","alt":[],"ad":"$-\\tfrac13$","sol":"$\\cos(\\pi-\\theta)=-\\cos\\theta$.","h":["Symmetry identity.","Negative.","Substitute."]},{"topic":"Model","q":"A curve has max $7$ and min $1$. Find its midline value $d$.","a":"4","alt":[],"ad":"$4$","sol":"$\\frac{7+1}2=4$.","h":["Average of max and min.","$8\\div2$.","Compute."]},{"topic":"Tan","q":"Solve $\\tan x=\\sqrt3$ for $0\\le x\\le\\pi$.","a":"pi/3","alt":["\u03c0/3"],"ad":"$x=\\frac\\pi3$","sol":"Reference angle $\\frac\\pi3$; the next solution $\\frac{4\\pi}3$ is outside the domain.","h":["$\\tan\\frac\\pi3=\\sqrt3$.","Period is $\\pi$.","Check the domain."]},{"topic":"Trig quadratic","q":"Solve $2\\cos^2x=\\cos x$ for $0\\le x\\le\\frac\\pi2$.","a":"pi/3,pi/2","alt":["pi/3 and pi/2","\u03c0/3,\u03c0/2","x=pi/3,pi/2"],"ad":"$x=\\frac\\pi3,\\ \\frac\\pi2$","sol":"$\\cos x(2\\cos x-1)=0$: $\\cos x=0\\Rightarrow x=\\frac\\pi2$; $\\cos x=\\frac12\\Rightarrow x=\\frac\\pi3$.","h":["Factorise.","Two cases.","Check the domain."]},{"topic":"Derivative","q":"Differentiate $y=x\\cos x$.","a":"cosx-xsinx","alt":["cos(x)-xsin(x)","cos x - x sin x"],"ad":"$\\cos x-x\\sin x$","sol":"Product rule: $\\cos x+x(-\\sin x)$.","h":["Product rule.","$u=x$, $v=\\cos x$.","Combine."]},{"topic":"Derivative","q":"Differentiate $y=\\tan(2x)$.","a":"2sec^2(2x)","alt":["2/cos^2(2x)"],"ad":"$2\\sec^2(2x)$","sol":"Chain rule with $\\frac d{dx}\\tan u=u'\\sec^2u$.","h":["Inside is $2x$.","Derivative of $\\tan$.","Multiply by 2."]},{"topic":"Ferris wheel","q":"$h=12-10\\cos\\left(\\frac{\\pi t}{20}\\right)$. Find $h$ when $t=20$.","a":"22","alt":[],"ad":"$22$","sol":"$\\cos\\pi=-1$, so $12+10=22$.","h":["$\\frac{\\pi\\cdot20}{20}=\\pi$.","$\\cos\\pi=-1$.","Compute."]},{"topic":"Gradient","q":"Find the gradient of $y=\\sin(2x)$ at $x=0$.","a":"2","alt":[],"ad":"$2$","sol":"$y'=2\\cos2x$; at $0$ it is $2$.","h":["Chain rule.","$2\\cos2x$.","$\\cos0=1$."]},{"topic":"Max value","q":"Maximum of $y=5\\cos x+12$?","a":"17","alt":[],"ad":"$17$","sol":"$12+5=17$.","h":["Amplitude 5.","Midline 12.","Add."]}],"comets":[{"topic":"Extension: Maximum of a sum","q":"Show that the greatest value of $y=\\sin x+\\cos x$ is $\\sqrt{2}$, by evaluating it at the stationary point $x=\\frac\\pi4$. Enter the value at $x=\\frac\\pi4$ as an exact number.","a":"sqrt2","alt":["sqrt(2)","\u221a2","2^(1/2)"],"ad":"$\\sqrt2$","sol":"$\\sin\\frac\\pi4+\\cos\\frac\\pi4=\\frac{\\sqrt2}2+\\frac{\\sqrt2}2=\\sqrt2$.","h":["Substitute $x=\\frac\\pi4$.","Both exact values equal $\\frac{\\sqrt2}{2}$.","Add."]},{"topic":"Extension: Where is the tide rising fastest?","q":"For $D=2\\cos\\left(\\frac{\\pi t}6\\right)+4$ on $0\\le t\\le12$, find the greatest rate of change of $D$ (a positive number, in m/h). Give it exactly.","a":"pi/3","alt":["\u03c0/3","(pi)/3"],"ad":"$\\dfrac\\pi3$","sol":"$D'=-\\frac\\pi3\\sin\\left(\\frac{\\pi t}6\\right)$, whose greatest magnitude is $\\frac\\pi3$.","h":["Differentiate $D$.","The largest $|\\sin|$ is 1.","Read off the coefficient."]},{"topic":"Extension: Maximum of a combined wave","q":"For $f(x)=3\\sin x+4\\cos x$, the maximum value over all $x$ is?","a":"5","alt":[],"ad":"$5$","sol":"Write as $R\\sin(x+\\alpha)$ with $R=\\sqrt{3^2+4^2}=5$.","h":["Find the stationary point.","$\\tan x=\\frac34$.","Use the 3-4-5 triangle."]}],"hours":4},"mm3-c03":{"id":"mm3-c03","interactive":"tangent","summary":"Three rules (chain, product, quotient) let you differentiate almost any function you will meet. This chapter drills each rule, shows how to combine them, and applies them to tangents, normals, kinematics and optimisation.","videos":[{"src":"B","title":"Visualizing the chain rule and product rule (3Blue1Brown, ch. 4)","url":"https://www.youtube.com/watch?v=YG15m2VwSjA","kind":"video"},{"src":"J","title":"Chain rule","url":"https://www.youtube.com/results?search_query=Joel+Speranza+chain+rule+differentiation","kind":"search"},{"src":"J","title":"Product rule","url":"https://www.youtube.com/results?search_query=Joel+Speranza+product+rule+differentiation","kind":"search"},{"src":"J","title":"Quotient rule","url":"https://www.youtube.com/results?search_query=Joel+Speranza+quotient+rule+differentiation","kind":"search"}],"sections":[{"id":"mm3-c03-s1","code":"3.2","title":"The chain rule","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: chain rule","url":"https://www.youtube.com/results?search_query=Joel+Speranza+chain+rule","kind":"search"},{"src":"B","title":"3Blue1Brown: Visualizing the chain rule and product rule","url":"https://www.youtube.com/watch?v=YG15m2VwSjA","kind":"video"}]},{"t":"p","x":"A **composite function** is a function inside a function, $y=f(g(x))$. Let $u=g(x)$. Then $y=f(u)$ and"},{"t":"key","x":"$$\\frac{dy}{dx}=\\frac{dy}{du}\\cdot\\frac{du}{dx}\\qquad\\text{equivalently}\\qquad \\big[f(g(x))\\big]'=f'(g(x))\\,g'(x)$$"},{"t":"p","x":"In words: differentiate the outside (leaving the inside alone), then multiply by the derivative of the inside. Special case: $\\frac{d}{dx}(ax+b)^n=na(ax+b)^{n-1}$."},{"t":"ex","title":"Chain rule","q":"Differentiate $y=(3x^2+1)^5$.","s":["Let $u=3x^2+1$, so $y=u^5$. $\\frac{dy}{du}=5u^4$, $\\frac{du}{dx}=6x$.","$\\frac{dy}{dx}=5(3x^2+1)^4\\cdot6x=30x(3x^2+1)^4$."],"a":"$30x(3x^2+1)^4$"},{"t":"ex","title":"Chain rule with a root","q":"Differentiate $y=\\sqrt{2x-1}$.","s":["Write $y=(2x-1)^{1/2}$. Then $y'=\\frac12(2x-1)^{-1/2}\\cdot2$.","$y'=\\frac{1}{\\sqrt{2x-1}}$."],"a":"$\\dfrac1{\\sqrt{2x-1}}$"},{"t":"warn","x":"Forgetting to multiply by the inside derivative is the number one chain rule error. After you differentiate, ask: \"did I multiply by $u'$?\""},{"t":"tb","rec":"1,3,4,7,12","ext":"12,16,17,20","x":"Exercise 3.2 practises chain rule with powers, roots, exponentials, logs and trig, including nested compositions.","code":"3.2"},{"t":"ex","title":"Chain rule, three layers","q":"Differentiate $y=\\sin^3(2x)$.","s":["Treat as $u^3$ with $u=\\sin(2x)$: $3u^2\\cdot u'$.","$u'=2\\cos(2x)$."],"a":"$6\\sin^2(2x)\\cos(2x)$"},{"t":"ex","title":"Chain rule with e","q":"Differentiate $y=e^{\\sin x}$.","s":["Outside $e^u$ gives $e^u$, inside $u=\\sin x$ gives $\\cos x$."],"a":"$\\cos x\\,e^{\\sin x}$"},{"t":"p","x":"**Why it works.** Rates multiply: if $y$ changes $\\frac{dy}{du}$ times as fast as $u$, and $u$ changes $\\frac{du}{dx}$ times as fast as $x$, then $y$ changes $\\frac{dy}{du}\\cdot\\frac{du}{dx}$ times as fast as $x$. Say the rule out loud: \"derivative of the outside, leave the inside alone, times derivative of the inside\"."}]},{"id":"mm3-c03-s2","code":"3.3","title":"The product rule","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: product rule","url":"https://www.youtube.com/results?search_query=Joel+Speranza+product+rule","kind":"search"},{"src":"B","title":"3Blue1Brown: Visualizing the chain rule and product rule","url":"https://www.youtube.com/watch?v=YG15m2VwSjA","kind":"video"}]},{"t":"key","x":"$$\\frac{d}{dx}(uv)=u'v+uv'$$"},{"t":"p","x":"Use it when two functions containing $x$ are **multiplied**. Choose $u$ and $v$, find $u'$ and $v'$ separately, assemble, then **factorise** the answer."},{"t":"ex","title":"Product rule","q":"Differentiate $y=x^2e^{3x}$.","s":["$u=x^2$, $u'=2x$; $v=e^{3x}$, $v'=3e^{3x}$.","$y'=2xe^{3x}+x^2\\cdot3e^{3x}=xe^{3x}(2+3x)$."],"a":"$y'=xe^{3x}(3x+2)$"},{"t":"ex","title":"Stationary point using the product rule","q":"Find the stationary point of $y=x\\ln x$ for $x>0$.","s":["$y'=1\\cdot\\ln x+x\\cdot\\frac1x=\\ln x+1$.","$\\ln x+1=0\\Rightarrow x=e^{-1}$, and $y=e^{-1}\\ln e^{-1}=-e^{-1}$."],"a":"$\\left(e^{-1},-e^{-1}\\right)$"},{"t":"warn","x":"$(uv)'$ is **not** $u'v'$. Check with $x\\cdot x$: the derivative of $x^2$ is $2x$, but $u'v'$ would give $1$."},{"t":"tb","rec":"1,5,6,8,10,11,12","ext":"14,16,17,19","x":"Exercise 3.3 uses the product rule alone and combined with chain rule, then finds tangents and turning points.","code":"3.3"},{"t":"ex","title":"Product of three pieces","q":"Differentiate $y=x^2e^{x}\\sin x$.","s":["Differentiate one factor at a time, keeping the others: $2xe^x\\sin x+x^2e^x\\sin x+x^2e^x\\cos x$."],"a":"$xe^x\\left(2\\sin x+x\\sin x+x\\cos x\\right)$"},{"t":"ex","title":"Product with chain","q":"Differentiate $y=x\\,e^{-2x}$ and find its stationary point.","s":["$y'=e^{-2x}-2xe^{-2x}=e^{-2x}(1-2x)$.","$e^{-2x}>0$, so $y'=0\\Rightarrow x=\\frac12$."],"a":"$y'=e^{-2x}(1-2x)$; stationary at $x=\\frac12$."}]},{"id":"mm3-c03-s3","code":"3.4","title":"The quotient rule","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: quotient rule","url":"https://www.youtube.com/results?search_query=Joel+Speranza+quotient+rule","kind":"search"}]},{"t":"key","x":"$$\\frac{d}{dx}\\left(\\frac uv\\right)=\\frac{u'v-uv'}{v^2}$$"},{"t":"p","x":"The numerator order matters: it is \"bottom times derivative of top **minus** top times derivative of bottom\", all over bottom squared. If the denominator is a single power of $x$, rewrite as a product with a negative index instead."},{"t":"ex","title":"Quotient rule","q":"Differentiate $y=\\dfrac{x}{x^2+1}$.","s":["$u=x$, $u'=1$; $v=x^2+1$, $v'=2x$.","$y'=\\frac{1\\cdot(x^2+1)-x\\cdot2x}{(x^2+1)^2}=\\frac{1-x^2}{(x^2+1)^2}$."],"a":"$\\dfrac{1-x^2}{(x^2+1)^2}$"},{"t":"ex","title":"Quotient rule with e","q":"Differentiate $y=\\dfrac{e^{2x}}{x}$.","s":["$u=e^{2x}$, $u'=2e^{2x}$; $v=x$, $v'=1$.","$y'=\\frac{2xe^{2x}-e^{2x}}{x^2}=\\frac{e^{2x}(2x-1)}{x^2}$."],"a":"$\\dfrac{e^{2x}(2x-1)}{x^2}$"},{"t":"warn","x":"Swapping the numerator terms flips the sign of your answer. Memorise the order, then check it with a simple case like $\\frac{x}{1}$."},{"t":"tb","rec":"1,3,5,7,11","ext":"13,14,17,20","x":"Exercise 3.4 practises quotient rule with every function type learned so far.","code":"3.4"},{"t":"ex","title":"Quotient with logs","q":"Differentiate $y=\\dfrac{\\ln x}{x}$ and find where it is stationary.","s":["$y'=\\dfrac{\\frac1x\\cdot x-\\ln x\\cdot1}{x^2}=\\dfrac{1-\\ln x}{x^2}$.","Zero when $\\ln x=1$, so $x=e$."],"a":"$y'=\\dfrac{1-\\ln x}{x^2}$; stationary at $x=e$."},{"t":"warn","x":"Many quotient problems are easier as products: $\\frac{e^x}{x^2}=e^xx^{-2}$. Choose whichever you trust under pressure."}]},{"id":"mm3-c03-s4","code":"3.5","title":"Applications of differentiation","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: tangents normals and optimisation","url":"https://www.youtube.com/results?search_query=Joel+Speranza+tangents+normals+and+optimisation","kind":"search"}]},{"t":"p","x":"**Tangent:** at $x=a$ the gradient is $f'(a)$, so $y-f(a)=f'(a)(x-a)$. **Normal:** perpendicular to the tangent, gradient $-\\frac1{f'(a)}$."},{"t":"p","x":"**Kinematics:** if $x(t)$ is position, velocity is $v=\\frac{dx}{dt}$ and acceleration is $a=\\frac{dv}{dt}$. The particle is at rest when $v=0$."},{"t":"p","x":"**Optimisation (preview):** to maximise or minimise a quantity, write it as a function of one variable, set the derivative to zero, then confirm it is a max or min."},{"t":"ex","title":"Normal to a curve","q":"Find the equation of the normal to $y=\\ln x$ at $x=1$.","s":["$y'=\\frac1x$, so at $x=1$ the tangent gradient is $1$. The normal gradient is $-1$.","Point $(1,0)$. Normal: $y-0=-1(x-1)$."],"a":"$y=-x+1$"},{"t":"ex","title":"Kinematics","q":"A particle has $x=t^2e^{-t}$ for $t\\ge0$. When is it at rest?","s":["$v=2te^{-t}-t^2e^{-t}=te^{-t}(2-t)$.","$v=0\\Rightarrow t=0$ or $t=2$."],"a":"$t=0$ and $t=2$"},{"t":"tb","rec":"1,5,7,10,11,12","ext":"13,15,19,20","x":"Exercise 3.5 applies the rules to tangents and normals, rates of change, kinematics and optimisation.","code":"3.5"},{"t":"ex","title":"Normal line","q":"Find the normal to $y=e^{2x}$ at $x=0$.","s":["$y'=2e^{2x}$, tangent gradient $2$; normal gradient $-\\frac12$; point $(0,1)$."],"a":"$y=-\\frac12x+1$"},{"t":"ex","title":"Optimisation by differentiation","q":"A rectangle has perimeter $40$. Find the maximum area.","s":["Sides $x$ and $20-x$, area $A=x(20-x)=20x-x^2$.","$A'=20-2x=0\\Rightarrow x=10$; $A''=-2\u003c0$ so a maximum."],"a":"$100$ square units (a square, $10\\times10$)."}]},{"id":"mm3-c03-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Spotting the rule.** Sum or difference: differentiate each term. Product of two functions of $x$: product rule. Fraction with $x$ in the denominator: quotient rule (or a product with a negative power). Function inside a function: chain rule. Many questions need two of these at once."},{"t":"p","x":"**Verification habit.** After differentiating, test at one value. For $y=x e^{-2x}$ at $x=0$: $y'=e^0(1-0)=1$, and the curve visibly rises from the origin. A thirty second sanity check catches sign errors."}]}],"quiz":[{"topic":"Chain rule","q":"Differentiate $y=(4x-1)^3$.","a":"12(4x-1)^2","alt":[],"ad":"$12(4x-1)^2$","sol":"$3(4x-1)^2\\cdot4=12(4x-1)^2$.","h":["Outside: power 3.","Inside derivative is 4.","Multiply them."]},{"topic":"Chain rule","q":"Differentiate $y=\\sqrt{x^2+9}$.","a":"x/sqrt(x^2+9)","alt":["x/(x^2+9)^(1/2)","x/\u221a(x^2+9)"],"ad":"$\\dfrac{x}{\\sqrt{x^2+9}}$","sol":"$\\frac12(x^2+9)^{-1/2}\\cdot2x=\\frac{x}{\\sqrt{x^2+9}}$.","h":["Rewrite as a power of $\\frac12$.","Inside derivative is $2x$.","Simplify the $\\frac12\\times2$."]},{"topic":"Product rule","q":"Differentiate $y=xe^{x}$.","a":"(x+1)e^x","alt":["e^x(x+1)","e^x+xe^x","xe^x+e^x"],"ad":"$(x+1)e^x$","sol":"$1\\cdot e^x+x\\cdot e^x=(x+1)e^x$.","h":["$u=x$, $v=e^x$.","Product rule.","Factorise."]},{"topic":"Product rule","q":"Differentiate $y=x^3\\ln x$.","a":"x^2(3ln x+1)","alt":["x^2(3lnx+1)","3x^2lnx+x^2","x^2+3x^2ln(x)"],"ad":"$x^2(3\\ln x+1)$","sol":"$3x^2\\ln x+x^3\\cdot\\frac1x=3x^2\\ln x+x^2=x^2(3\\ln x+1)$.","h":["$u=x^3$, $v=\\ln x$.","$v'=\\frac1x$.","Factorise $x^2$."]},{"topic":"Quotient","q":"Differentiate $y=\\dfrac{x}{x+1}$.","a":"1/(x+1)^2","alt":["(x+1)^(-2)"],"ad":"$\\dfrac{1}{(x+1)^2}$","sol":"$\\frac{1(x+1)-x(1)}{(x+1)^2}=\\frac1{(x+1)^2}$.","h":["Quotient rule.","Numerator: $(x+1)-x$.","Simplify."]},{"topic":"Quotient","q":"Differentiate $y=\\dfrac{\\sin x}{x}$.","a":"(xcosx-sinx)/x^2","alt":["(x cos x - sin x)/x^2","(xcos(x)-sin(x))/x^2"],"ad":"$\\dfrac{x\\cos x-\\sin x}{x^2}$","sol":"$\\frac{x\\cos x-\\sin x\\cdot1}{x^2}$.","h":["$u=\\sin x$, $v=x$.","Quotient rule.","Keep the order."]},{"topic":"Tangent","q":"Find the gradient of $y=x^2e^{-x}$ at $x=1$. Give an exact answer.","a":"1/e","alt":["e^(-1)","1e^-1"],"ad":"$e^{-1}$","sol":"$y'=2xe^{-x}-x^2e^{-x}$; at $x=1$: $2e^{-1}-e^{-1}=e^{-1}$.","h":["Product rule.","Substitute $x=1$.","Collect terms."]},{"topic":"Stationary","q":"Find the positive $x$ where $y=x^2e^{-x}$ has a stationary point.","a":"2","alt":["x=2"],"ad":"$x=2$","sol":"$y'=xe^{-x}(2-x)=0\\Rightarrow x=2$ (positive).","h":["Product rule.","Factorise.","Set each factor to 0."]},{"topic":"Kinematics","q":"$x=t^3-6t^2$. Find the velocity when $t=1$.","a":"-9","alt":["v=-9"],"ad":"$-9$","sol":"$v=3t^2-12t$; $v(1)=3-12=-9$.","h":["Velocity is the derivative.","Differentiate.","Substitute."]},{"topic":"Normal","q":"Find the gr
