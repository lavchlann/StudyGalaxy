places."}],"hours":4.5},"ph3-c07":{"id":"ph3-c07","interactive":"none","summary":"A changing magnetic flux induces an emf. This chapter covers magnetic flux, Faraday's and Lenz's laws, the emf of a moving conductor, generators, and the meaning of RMS values.","videos":[{"src":"F","title":"Electromagnetic induction, Faraday and Lenz","url":"https://www.youtube.com/results?search_query=Flipping+Physics+Faraday+law+Lenz+law+electromagnetic+induction+physics","kind":"search"},{"src":"K","title":"Magnetic flux and induction","url":"https://www.youtube.com/results?search_query=Khan+Academy+magnetic+flux+Faraday+law+induction","kind":"search"},{"src":"V","title":"Veritasium: Induction and the magnet in a tube","url":"https://www.youtube.com/results?search_query=Veritasium+Lenz+law+magnet+falling+tube","kind":"search"}],"sections":[{"id":"ph3-c07-s1","code":"7.1","title":"Magnetic flux","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: magnetic flux","url":"https://www.youtube.com/results?search_query=Flipping+Physics+magnetic+flux","kind":"search"}]},{"t":"p","x":"**Magnetic flux** measures how much field passes through a surface: $\\Phi=BA\\cos\\theta$ in **webers (Wb)**, where $A$ is the area and $\\theta$ is the angle between the field and the **normal** (perpendicular) to the surface. Flux is largest when the field is perpendicular to the loop's plane and zero when the field runs parallel to the plane."},{"t":"key","x":"$$\\Phi=BA\\cos\\theta$$"},{"t":"ex","title":"Flux","q":"A $0.020\\ \\text{m}^2$ coil is perpendicular to a $0.50\\ \\text{T}$ field. Find the flux, and the flux after turning $60^\\circ$.","s":["$\\Phi=BA\\cos0^\\circ=0.50(0.020)=0.010\\ \\text{Wb}$.","At $60^\\circ$: $\\Phi=0.010\\cos60^\\circ=0.0050\\ \\text{Wb}$."],"a":"$0.010\\ \\text{Wb}$ and $0.0050\\ \\text{Wb}$."},{"t":"warn","x":"$\\theta$ is measured from the **normal**, not from the plane of the coil. If a question gives the angle to the plane, subtract it from $90^\\circ$."},{"t":"p","x":"**Three ways to change flux.** Since $\\Phi=BA\\cos\\theta$, flux changes when the field strength changes (moving a magnet closer, switching a current), when the area in the field changes (a rod sliding on rails, a loop entering a field), or when the angle changes (a coil rotating). Each of these is a way to induce an emf."},{"t":"ex","title":"Worded problem: rotating loop","q":"A square loop of side 0.10 m sits in a 0.50 T field. Find the flux when the plane of the loop is perpendicular to the field and when it has rotated so its plane is at $30^\\circ$ to the field.","s":["Perpendicular plane: normal parallel to $B$, $\\theta=0$: $\\Phi=0.50\\times0.010=5.0\\times10^{-3}$ Wb.","Plane at $30^\\circ$ to the field means the normal is at $60^\\circ$: $\\Phi=5.0\\times10^{-3}\\cos60^\\circ=2.5\\times10^{-3}$ Wb."],"a":"$5.0\\times10^{-3}$ Wb and $2.5\\times10^{-3}$ Wb."}]},{"id":"ph3-c07-s2","code":"7.2","title":"Faraday's and Lenz's laws","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: Faraday law Lenz law","url":"https://www.youtube.com/results?search_query=Flipping+Physics+Faraday+law+Lenz+law","kind":"search"}]},{"t":"p","x":"**Faraday's law:** the induced emf equals the rate of change of flux linkage: $\\varepsilon=-N\\dfrac{\\Delta\\Phi}{\\Delta t}$. **Lenz's law** (the minus sign): the induced current's own field **opposes the change** in flux that caused it. This is conservation of energy: if induced fields helped the change, energy would appear from nothing."},{"t":"key","x":"$$\\varepsilon=-N\\frac{\\Delta\\Phi}{\\Delta t}$$"},{"t":"ex","title":"Changing flux","q":"A $200$-turn coil has flux falling from $0.010\\ \\text{Wb}$ to zero in $0.050\\ \\text{s}$. Find the average emf.","s":["$|\\varepsilon|=N\\frac{\\Delta\\Phi}{\\Delta t}=200\\times\\frac{0.010}{0.050}=40\\ \\text{V}$."],"a":"$40\\ \\text{V}$"},{"t":"p","x":"**Using Lenz.** A north pole approaching a loop increases flux through it, so the loop develops a current whose field also points toward the approaching magnet (a north face) to repel it. A magnet pulled away is attracted. In both cases the induced current makes the motion **harder**."},{"t":"p","x":"**Lenz's law is energy conservation.** If the induced current helped the change, it would make the change bigger, creating more current, and so on: free energy. Instead the induced current always opposes the change in flux, so you must do work (push the magnet, turn the generator) to keep it going. That work becomes the electrical energy."},{"t":"p","x":"**A step-by-step Lenz method.** (1) What is happening to the flux, and in which direction? (2) The induced field opposes that change: if flux is increasing, the induced field points the opposite way; if decreasing, the same way. (3) Use the right-hand grip rule to turn that induced field into a current direction."},{"t":"ex","title":"Worded problem: coil in a changing field","q":"A 200-turn coil of area $4.0\\times10^{-3}\\ \\text{m}^2$ is perpendicular to a field that falls steadily from 0.60 T to 0.10 T in 0.25 s. Find the average induced emf.","s":["$\\Delta\\Phi=(0.10-0.60)\\times4.0\\times10^{-3}=-2.0\\times10^{-3}$ Wb.","$\\varepsilon=-N\\frac{\\Delta\\Phi}{\\Delta t}=-200\\times\\frac{-2.0\\times10^{-3}}{0.25}$."],"a":"$1.6$ V"}]},{"id":"ph3-c07-s3","code":"7.3","title":"Moving conductors","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: moving conductor in a magnetic field emf","url":"https://www.youtube.com/results?search_query=Flipping+Physics+moving+conductor+in+a+magnetic+field+emf","kind":"search"}]},{"t":"p","x":"A conductor of length $L$ moving at speed $v$ perpendicular to a field $B$ has emf $\\varepsilon=BLv$. If connected to a circuit of resistance $R$ the current is $I=\\frac{\\varepsilon}{R}$, and the magnetic force on it is $BIL$, opposing the motion."},{"t":"ex","title":"Sliding rod","q":"A $0.50\\ \\text{m}$ rod moves at $4.0\\ \\text{m s}^{-1}$ perpendicular to a $0.30\\ \\text{T}$ field. Find the emf.","s":["$\\varepsilon=BLv=0.30(0.50)(4.0)=0.60\\ \\text{V}$."],"a":"$0.60\\ \\text{V}$"},{"t":"p","x":"**Eddy currents.** A conductor moving through a changing field has circulating currents induced in it. Lenz's law means they oppose the motion, which is used for braking and cause heating in transformer cores (reduced by laminating the core)."},{"t":"p","x":"**Where $\\varepsilon=BLv$ comes from.** A rod moving through a field sweeps out area $Lv$ each second, so the flux through the circuit changes at rate $BLv$, giving $\\varepsilon=BLv$. Alternatively, each free charge in the rod feels $qvB$ along the rod, pushing charges to one end. If a current flows, the rod also feels a magnetic force $BIL$ opposing its motion (Lenz again), so a force is needed to keep it moving at constant speed."},{"t":"ex","title":"Worded problem: sliding rod","q":"A 0.25 m rod slides at 4.0 m/s along rails in a 0.80 T field perpendicular to the rails. The circuit resistance is 2.0 \u03a9. Find the emf, the current, and the force needed to keep it moving at constant speed.","s":["$\\varepsilon=BLv=0.80\\times0.25\\times4.0=0.80$ V. $I=\\frac{0.80}{2.0}=0.40$ A.","Opposing force $F=BIL=0.80\\times0.40\\times0.25=0.080$ N, so an applied force of $0.080$ N is needed."],"a":"$0.80$ V, $0.40$ A, $0.080$ N."}]},{"id":"ph3-c07-s4","code":"7.4","title":"Generators and AC","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: AC generator physics","url":"https://www.youtube.com/results?search_query=Flipping+Physics+AC+generator+physics","kind":"search"}]},{"t":"p","x":"In an **AC generator** a coil rotates in a magnetic field and the flux changes sinusoidally. The emf is **greatest when the coil's plane is parallel to the field** (the flux is zero but changing fastest) and **zero when the plane is perpendicular to the field** (maximum flux, zero rate of change). A split-ring commutator would give DC; slip rings give AC."},{"t":"p","x":"**RMS values.** For a sinusoidal supply $V_{\\text{rms}}=\\dfrac{V_{\\text{peak}}}{\\sqrt2}$ and $I_{\\text{rms}}=\\dfrac{I_{\\text{peak}}}{\\sqrt2}$. The RMS value is the equivalent steady value that would deliver the same power: $P=V_{\\text{rms}}I_{\\text{rms}}=\\dfrac{V_{\\text{rms}}^2}{R}$."},{"t":"ex","title":"RMS","q":"The mains supply has $V_{\\text{rms}}=240\\ \\text{V}$. Find the peak voltage.","s":["$V_{\\text{peak}}=\\sqrt2\\times240=339\\ \\text{V}$."],"a":"$339\\ \\text{V}$"},{"t":"warn","x":"Household \"240 V\" is an RMS value, so the voltage actually swings between about $-339\\ \\text{V}$ and $+339\\ \\text{V}$."},{"t":"p","x":"**Peak emf of a generator.** For an $N$-turn coil of area $A$ rotating at angular speed $\\omega$ in field $B$, the flux is $\\Phi=BA\\cos(\\omega t)$ and the emf is $\\varepsilon=NBA\\omega\\sin(\\omega t)$, so the peak emf is $NBA\\omega$. Spinning twice as fast doubles both the peak emf and the frequency. AC generators use **slip rings**; DC generators use a split-ring commutator."},{"t":"ex","title":"Worded problem: generator output","q":"A 100-turn coil of area $0.020\\ \\text{m}^2$ rotates at 50 revolutions per second in a 0.15 T field. Find the peak and RMS emf.","s":["$\\omega=2\\pi\\times50\\approx314\\ \\text{rad s}^{-1}$. Peak $=NBA\\omega=100\\times0.15\\times0.020\\times314\\approx94$ V.","RMS $=\\frac{94}{\\sqrt2}\\approx67$ V."],"a":"Peak about $94$ V, RMS about $67$ V."}]},{"id":"ph3-c07-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Explaining induction.** A complete answer has three parts: (1) the flux through the circuit is changing, (2) so an emf is induced (Faraday), (3) and the direction is such as to oppose the change (Lenz). Use the word **flux** and the word **change**."},{"t":"p","x":"**Graph questions.** Flux against time is a cosine for a rotating coil; the emf is the gradient of the flux graph (negative), which gives a sine curve."}]}],"quiz":[{"topic":"Flux","q":"$B=0.20\\ \\text{T}$ is perpendicular to an area of $0.050\\ \\text{m}^2$. Find the flux (Wb).","a":"0.010","alt":["0.01"],"ad":"$0.010\\ \\text{Wb}$","sol":"$\\Phi=BA=0.20(0.050)$.","h":["$\\Phi=BA\\cos\\theta$.","$\\theta=0^\\circ$.","Multiply."]},{"topic":"Zero flux","q":"What is the flux when the field is parallel to the plane of a loop (Wb)?","a":"0","alt":[],"ad":"$0$","sol":"The normal is perpendicular to the field, so $\\cos90^\\circ=0$.","h":["Angle to the normal.","$\\theta=90^\\circ$.","$\\cos90^\\circ=0$."]},{"topic":"Faraday","q":"A $50$-turn coil has $\\Delta\\Phi=0.040\\ \\text{Wb}$ in $0.20\\ \\text{s}$. Find the average emf (V).","a":"10","alt":["10.0"],"ad":"$10\\ \\text{V}$","sol":"$\\varepsilon=N\\Delta\\Phi/\\Delta t=50\\times0.20$.","h":["$\\varepsilon=N\\Delta\\Phi/\\Delta t$.","$\\Delta\\Phi/\\Delta t=0.20$.","Multiply by 50."]},{"topic":"Rod","q":"$B=0.50\\ \\text{T}$, $L=0.40\\ \\text{m}$, $v=3.0\\ \\text{m s}^{-1}$. Find the emf (V).","a":"0.60","alt":["0.6"],"ad":"$0.60\\ \\text{V}$","sol":"$\\varepsilon=BLv$.","h":["$\\varepsilon=BLv$.","Multiply the three.","Compute."]},{"topic":"RMS","q":"A supply has peak voltage $170\\ \\text{V}$. Find $V_{\\text{rms}}$ (V, nearest whole number).","a":"120","alt":["120.2","120.21"],"ad":"$120\\ \\text{V}$","sol":"$170/\\sqrt2=120$.","h":["$V_{\\text{rms}}=V_{\\text{peak}}/\\sqrt2$.","$\\sqrt2=1.414$.","Divide."]},{"topic":"Lenz","q":"A north pole moves toward a coil. Does the induced current produce a field opposing the magnet's approach? Answer yes or no.","a":"yes","alt":["Yes"],"ad":"Yes","sol":"Lenz's law: induced effects oppose the change.","h":["Lenz's law.","Opposes the change.","Yes."]},{"topic":"Frequency","q":"A generator coil makes $50$ rotations each second. What is the frequency of the AC output (Hz)?","a":"50","alt":[],"ad":"$50\\ \\text{Hz}$","sol":"One cycle per rotation.","h":["One rotation, one cycle.","Same count per second.","50."]},{"topic":"Maximum emf","q":"At the instant a generator's emf is a maximum, is the flux through the coil zero? Answer yes or no.","a":"yes","alt":["Yes"],"ad":"Yes","sol":"The emf is greatest when the flux is changing fastest, which is when the flux is zero.","h":["The emf is the gradient of the flux graph.","Gradient is steepest at zero flux.","Yes."]},{"topic":"Power","q":"A $60\\ \\Omega$ heater runs on $240\\ \\text{V}_{\\text{rms}}$. Find its power (W).","a":"960","alt":[],"ad":"$960\\ \\text{W}$","sol":"$P=V^2/R=\\frac{240^2}{60}$.","h":["$P=V^2/R$.","$240^2=57600$.","Divide by 60."]},{"topic":"Speed","q":"If a generator's coil turns twice as fast, by what factor does the peak emf change?","a":"2","alt":[],"ad":"$2$","sol":"Flux changes twice as fast.","h":["Rate of change of flux doubles.","Emf is proportional to that rate.","Factor 2."]}],"comets":[{"topic":"Extension: Rod on rails","q":"A $0.20\\ \\text{m}$ rod slides at $2.0\\ \\text{m s}^{-1}$ on rails in a $0.50\\ \\text{T}$ field. The circuit resistance is $0.10\\ \\Omega$. Find the current (A).","a":"2.0","alt":["2"],"ad":"$2.0\\ \\text{A}$","sol":"$\\varepsilon=BLv=0.20\\ \\text{V}$; $I=\\varepsilon/R=2.0$.","h":["Find the emf first.","$\\varepsilon=0.50(0.20)(2.0)$.","$I=\\varepsilon/R$."]},{"topic":"Extension: Force on the rod","q":"For the same rod and circuit, find the force needed to keep it moving at constant speed (N).","a":"0.20","alt":["0.2"],"ad":"$0.20\\ \\text{N}$","sol":"$F=BIL=0.50(2.0)(0.20)=0.20$.","h":["Constant speed: applied force balances magnetic force.","$F=BIL$.","Use $I=2.0\\ \\text{A}$."]}],"cards":[{"type":"def","topic":"Magnetic flux","f":"Definition of magnetic flux.","b":"$\\Phi=BA\\cos\\theta$ (weber, Wb), with $\\theta$ between $B$ and the normal to the surface."},{"type":"def","topic":"Magnetic flux","f":"Three ways to change the flux through a coil.","b":"Change $B$, change the area $A$ in the field, or change the angle $\\theta$."},{"type":"def","topic":"Magnetic flux","f":"What is flux linkage?","b":"$N\\Phi$: the flux through one turn times the number of turns."},{"type":"def","topic":"Faraday's and Lenz's laws","f":"State Faraday's law.","b":"The induced emf equals the rate of change of flux linkage: $\\varepsilon=-N\\dfrac{\\Delta\\Phi}{\\Delta t}$."},{"type":"def","topic":"Faraday's and Lenz's laws","f":"State Lenz's law.","b":"The induced current flows in a direction that opposes the change in flux that produced it."},{"type":"def","topic":"Faraday's and Lenz's laws","f":"Why is Lenz's law a consequence of conservation of energy?","b":"If the induced current aided the change, energy would be created from nothing. Opposing the change means work must be done to produce electrical energy."},{"type":"word","topic":"Faraday's and Lenz's laws","f":"A magnet's north pole is pushed toward a coil. What pole forms at that end of the coil?","b":"A north pole, to repel the approaching magnet (opposing the increase in flux)."},{"type":"def","topic":"Moving conductors","f":"Emf induced across a rod moving through a field.","b":"$\\varepsilon=BLv$ (rod, velocity and field mutually perpendicular)."},{"type":"word","topic":"Moving conductors","f":"Why is a force needed to keep a rod moving at constant speed on rails in a field?","b":"The induced current in the rod feels a magnetic force $BIL$ opposing the motion (Lenz's law)."},{"type":"def","topic":"Moving conductors","f":"Eddy current braking: how does it work?","b":"Moving conductors in a field get induced circulating currents that, by Lenz's law, produce forces opposing the motion, slowing it without contact."},{"type":"def","topic":"Generators and AC","f":"Peak emf of a rotating coil.","b":"$\\varepsilon_{\\max}=NBA\\omega$"},{"type":"def","topic":"Generators and AC","f":"When is the emf of a rotating coil largest?","b":"When the plane of the coil is parallel to the field (flux is zero but changing fastest)."},{"type":"def","topic":"Generators and AC","f":"RMS voltage relationship.","b":"$V_{\\text{rms}}=\\dfrac{V_{\\text{peak}}}{\\sqrt2}$"},{"type":"word","topic":"Generators and AC","f":"A generator's rotation speed doubles. Effect on peak emf and frequency?","b":"Both double."},{"type":"def","topic":"Generators and AC","f":"Slip rings vs split-ring commutator.","b":"Slip rings give AC output (generators). A split ring reverses connections every half turn, giving DC (motors and DC generators)."}],"hours":4},"ph3-c08":{"id":"ph3-c08","interactive":"transformer","summary":"Transformers change AC voltages and make long-distance power transmission efficient. This chapter covers the ideal transformer equations, energy losses, transmission-line power loss, and why electricity is transmitted at high voltage.","videos":[{"src":"F","title":"Transformers and power transmission","url":"https://www.youtube.com/results?search_query=Flipping+Physics+transformers+step+up+step+down+power+transmission+physics","kind":"search"},{"src":"K","title":"Transformers","url":"https://www.youtube.com/results?search_query=Khan+Academy+transformer+physics+ideal+transformer","kind":"search"},{"src":"V","title":"Veritasium: The grid","url":"https://www.youtube.com/results?search_query=Veritasium+AC+DC+power+grid","kind":"search"}],"sections":[{"id":"ph3-c08-s1","code":"8.1","title":"The ideal transformer","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: ideal transformer","url":"https://www.youtube.com/results?search_query=Flipping+Physics+ideal+transformer","kind":"search"}]},{"t":"p","x":"A transformer has a **primary** and **secondary** coil wound on a soft-iron core. An alternating current in the primary produces a changing flux in the core, which induces an emf in the secondary. **It works only with AC**, because a DC current produces a steady flux and no induction."},{"t":"key","x":"$$\\frac{V_s}{V_p}=\\frac{N_s}{N_p},\\qquad V_pI_p=V_sI_s\\ (\\text{ideal})$$"},{"t":"ex","title":"Step-down","q":"A transformer has $500$ primary and $100$ secondary turns with a $240\\ \\text{V}$ input. Find the output voltage.","s":["$V_s=V_p\\frac{N_s}{N_p}=240\\times\\frac{100}{500}=48\\ \\text{V}$."],"a":"$48\\ \\text{V}$"},{"t":"p","x":"$N_s>N_p$ is a **step-up** transformer (raises voltage, lowers current). $N_s\u003cN_p$ is **step-down**. The power is not increased: voltage up means current down."},{"t":"ex","title":"Currents","q":"An ideal transformer delivers $12\\ \\text{W}$ at $48\\ \\text{V}$ from a $240\\ \\text{V}$ primary. Find the secondary and primary currents.","s":["$I_s=\\frac PV=\\frac{12}{48}=0.25\\ \\text{A}$.","$I_p=\\frac{12}{240}=0.050\\ \\text{A}$."],"a":"$0.25\\ \\text{A}$ and $0.050\\ \\text{A}$."},{"t":"int","name":"transformer","cap":"Change the turns and the load. Check that the ideal power in equals the power out."},{"t":"p","x":"**Why a transformer needs AC.** The primary current creates a magnetic flux in the iron core. Only a **changing** flux induces an emf in the secondary (Faraday's law). Alternating current changes direction constantly, so the flux keeps changing and an alternating emf appears in the secondary. With steady DC there is a brief pulse when switched on, then nothing."},{"t":"p","x":"**Turns ratio both ways.** For an ideal transformer $\\frac{V_s}{V_p}=\\frac{N_s}{N_p}$ and, because power in equals power out, $\\frac{I_s}{I_p}=\\frac{N_p}{N_s}$. A step-up transformer raises voltage and lowers current by the same factor. It does not create energy."},{"t":"ex","title":"Worded problem: phone charger","q":"A charger's transformer converts 240 V mains to 6.0 V. The primary has 2000 turns. How many secondary turns are needed, and what primary current flows when the output current is 1.2 A (ideal transformer)?","s":["$N_s=N_p\\frac{V_s}{V_p}=2000\\times\\frac{6.0}{240}=50$ turns.","$V_pI_p=V_sI_s\\Rightarrow I_p=\\frac{6.0\\times1.2}{240}=0.030$ A."],"a":"50 turns; $0.030$ A in the primary."}]},{"id":"ph3-c08-s2","code":"8.2","title":"Real transformers and energy losses","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: transformer energy losses","url":"https://www.youtube.com/results?search_query=Flipping+Physics+transformer+energy+losses","kind":"search"}]},{"t":"p","x":"Real transformers are not perfectly efficient. **Efficiency** $=\\dfrac{P_{\\text{out}}}{P_{\\text{in}}}\\times100\\%$. Losses include **resistive heating** in the windings, **eddy currents** in the core (reduced by using a **laminated** core), **hysteresis** (reversing magnetisation of the core, reduced by soft iron) and **flux leakage** (reduced by winding the coils on a shared core)."},{"t":"ex","title":"Efficiency","q":"A transformer takes $300\\ \\text{W}$ and delivers $285\\ \\text{W}$. Find its efficiency.","s":["$\\frac{285}{300}\\times100=95\\%$."],"a":"$95\\%$"},{"t":"p","x":"**Where the energy goes and how it is reduced.** Resistive heating in the copper windings ($I^2R$): use thick, low-resistance wire. Eddy currents in the core: use a **laminated** core of thin insulated iron sheets so the circulating currents are small. Hysteresis (repeated magnetising of the core): use soft iron, which magnetises and demagnetises easily. Flux leakage: wind the coils on top of each other on a closed core."},{"t":"ex","title":"Worded problem: real transformer","q":"A transformer is 92% efficient. Its primary draws 2.5 A from a 240 V supply. The output voltage is 24 V. Find the output current.","s":["$P_{in}=240\\times2.5=600$ W, so $P_{out}=0.92\\times600=552$ W.","$I_s=\\frac{552}{24}=23$ A."],"a":"$23$ A"}]},{"id":"ph3-c08-s3","code":"8.3","title":"Power transmission","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: power transmission transformers","url":"https://www.youtube.com/results?search_query=Flipping+Physics+power+transmission+transformers","kind":"search"}]},{"t":"p","x":"The power lost in a cable is $P_{\\text{loss}}=I^2R$. For a given transmitted power $P=VI$, a **higher voltage means a lower current**, and the loss falls with the **square** of the current. That is why electricity is **stepped up** at the power station for transmission and **stepped down** near the user."},{"t":"ex","title":"Transmission loss","q":"A power station sends $100\\ \\text{kW}$ through cables with resistance $5.0\\ \\Omega$. Compare the power lost at $10\\ \\text{kV}$ and at $1.0\\ \\text{kV}$.","s":["At $10\\ \\text{kV}$: $I=\\frac{100\\times10^3}{10\\times10^3}=10\\ \\text{A}$; $P_{\\text{loss}}=10^2(5.0)=500\\ \\text{W}$ (0.5%).","At $1.0\\ \\text{kV}$: $I=100\\ \\text{A}$; $P_{\\text{loss}}=100^2(5.0)=50\\ \\text{kW}$ (50%)."],"a":"$500\\ \\text{W}$ at $10\\ \\text{kV}$ versus $50\\ \\text{kW}$ at $1.0\\ \\text{kV}$."},{"t":"warn","x":"The voltage in $P_{\\text{loss}}=V^2/R$ is the voltage **across the cable**, not the transmission voltage. Use $I^2R$ for line loss."},{"t":"p","x":"**The whole grid in one picture.** Power stations generate at about 20 kV. Step-up transformers raise this to hundreds of kilovolts for long-distance lines, cutting the current and therefore the $I^2R$ loss. Step-down transformers at substations bring it down in stages to 240 V for homes. Remember that the voltage **drop** along the cable is $IR$, not the transmission voltage, so use $P_{loss}=I^2R$ with the line current."},{"t":"ex","title":"Worded problem: comparing transmission voltages","q":"A town needs 2.0 MW delivered through lines of total resistance 4.0 \u03a9. Compare the power lost if transmitted at 22 kV and at 220 kV.","s":["At 22 kV: $I=\\frac{2.0\\times10^6}{22\\times10^3}\\approx91$ A, $P_{loss}=91^2\\times4.0\\approx3.3\\times10^4$ W (about 1.7%).","At 220 kV: $I\\approx9.1$ A, $P_{loss}\\approx330$ W."],"a":"Ten times the voltage gives one-hundredth of the loss: about 33 kW versus 0.33 kW."}]},{"id":"ph3-c08-s4","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Explain, do not just calculate.** A typical question: \"Explain why power is transmitted at high voltage.\" Answer: for a fixed power, higher voltage means lower current ($I=P/V$), and heat loss in the cables is $I^2R$, so far less energy is wasted."},{"t":"p","x":"**Reasons a transformer is not 100% efficient** should name the cause and the fix: eddy currents (laminated core), resistive heating (thick copper wire), hysteresis (soft iron core) and leakage (shared core)."}]}],"quiz":[{"topic":"Output voltage","q":"A transformer has $N_p/N_s=10$ and $V_p=240\\ \\text{V}$. Find $V_s$ (V).","a":"24","alt":["24.0"],"ad":"$24\\ \\text{V}$","sol":"$V_s=240/10$.","h":["$V_s/V_p=N_s/N_p$.","$N_s/N_p=0.10$.","Multiply."]},{"topic":"Turns","q":"Find $N_s$ to step $240\\ \\text{V}$ down to $12\\ \\text{V}$ with $N_p=1000$.","a":"50","alt":[],"ad":"$50$","sol":"$N_s=1000\\times\\frac{12}{240}$.","h":["$N_s/N_p=V_s/V_p$.","$12/240=0.05$.","Multiply."]},{"topic":"Current","q":"An ideal transformer has $V_p=240\\ \\text{V}$, $I_p=0.50\\ \\text{A}$ and $V_s=12\\ \\text{V}$. Find $I_s$ (A).","a":"10","alt":["10.0"],"ad":"$10\\ \\text{A}$","sol":"$V_pI_p=V_sI_s\\Rightarrow I_s=\\frac{120}{12}$.","h":["Ideal means power in equals power out.","$V_pI_p=120\\ \\text{W}$.","Divide by $V_s$."]},{"topic":"Line loss","q":"A cable of resistance $2.0\\ \\Omega$ carries $20\\ \\text{A}$. Find the power lost (W).","a":"800","alt":[],"ad":"$800\\ \\text{W}$","sol":"$P=I^2R=400(2.0)$.","h":["$P=I^2R$.","$20^2=400$.","Multiply by 2.0."]},{"topic":"Line current","q":"$50\\ \\text{kW}$ is sent at $5000\\ \\text{V}$. Find the current (A).","a":"10","alt":[],"ad":"$10\\ \\text{A}$","sol":"$I=P/V=\\frac{50000}{5000}$.","h":["$P=VI$.","$I=P/V$.","Divide."]},{"topic":"Higher voltage","q":"If the transmission voltage rises by a factor of 10 for the same power, by what factor does the line loss fall?","a":"100","alt":[],"ad":"$100$","sol":"Current falls by 10, loss $\\propto I^2$.","h":["$I\\propto1/V$.","Loss $\\propto I^2$.","$10^2$."]},{"topic":"Efficiency","q":"A transformer takes $300\\ \\text{W}$ in and gives $285\\ \\text{W}$ out. Find the efficiency (%).","a":"95","alt":[],"ad":"$95\\%$","sol":"$285/300\\times100$.","h":["Output over input.","$285/300=0.95$.","Convert to %."]},{"topic":"DC","q":"Can a transformer step up a steady DC voltage? Answer yes or no.","a":"no","alt":["No"],"ad":"No","sol":"DC gives a constant flux, so no emf is induced.","h":["Induction needs a changing flux.","DC flux does not change.","No."]},{"topic":"Step-up","q":"A transformer has more secondary turns than primary turns. Is it a step-up transformer? Answer yes or no.","a":"yes","alt":["Yes"],"ad":"Yes","sol":"$V_s>V_p$ when $N_s>N_p$.","h":["$V_s/V_p=N_s/N_p$.","$N_s>N_p$ means $V_s>V_p$.","Step-up."]},{"topic":"Ratio","q":"$V_p=11000\\ \\text{V}$ and $V_s=240\\ \\text{V}$. Find $N_p/N_s$ (1 decimal place).","a":"45.8","alt":[],"ad":"$45.8$","sol":"$\\frac{N_p}{N_s}=\\frac{11000}{240}=45.8$.","h":["$N_p/N_s=V_p/V_s$.","$11000/240$.","Compute."]}],"comets":[{"topic":"Extension: Line loss percentage","q":"$2.0\\ \\text{MW}$ is sent at $20\\ \\text{kV}$ through lines with resistance $10\\ \\Omega$. What percentage of the power is lost?","a":"5","alt":["5.0"],"ad":"$5\\%$","sol":"$I=\\frac{2.0\\times10^6}{20\\times10^3}=100\\ \\text{A}$; $P_{\\text{loss}}=100^2(10)=100\\ \\text{kW}$, which is $5\\%$ of $2.0\\ \\text{MW}$.","h":["Find the current.","$P_{\\text{loss}}=I^2R$.","Divide by the total power."]},{"topic":"Extension: Cutting the loss","q":"To reduce the line loss in the previous question to $1.25\\%$, by what factor must the transmission voltage increase?","a":"2","alt":[],"ad":"$2$","sol":"Loss $\\propto1/V^2$; a quarter of the loss needs $V$ doubled.","h":["$P_{\\text{loss}}\\propto I^2\\propto1/V^2$.","The loss must fall by a factor of 4.","Square root of 4."]}],"cards":[{"type":"def","topic":"The ideal transformer","f":"Transformer voltage\u2013turns equation.","b":"$\\dfrac{V_s}{V_p}=\\dfrac{N_s}{N_p}$"},{"type":"def","topic":"The ideal transformer","f":"Ideal transformer power and current relationship.","b":"$V_pI_p=V_sI_s$, so $\\dfrac{I_s}{I_p}=\\dfrac{N_p}{N_s}$."},{"type":"def","topic":"The ideal transformer","f":"Why won't a transformer work on steady DC?","b":"Steady current produces constant flux, and only changing flux induces an emf in the secondary."},{"type":"word","topic":"The ideal transformer","f":"Step-up transformer with turns ratio 1:20 and 12 V input. Output voltage?","b":"$12\\times20=240$ V."},{"type":"def","topic":"Real transformers and energy losses","f":"Four energy losses in a real transformer and how to reduce them.","b":"Resistive heating (thick copper wire); eddy currents (laminated core); hysteresis (soft iron core); flux leakage (closely wound coils on a closed core)."},{"type":"def","topic":"Real transformers and energy losses","f":"Why is a transformer core laminated?","b":"Thin insulated layers break up eddy current paths, reducing heating losses in the core."},{"type":"def","topic":"Real transformers and energy losses","f":"Efficiency formula.","b":"$\\eta=\\dfrac{P_{out}}{P_{in}}\\times100\\%$"},{"type":"def","topic":"Power transmission","f":"Power lost in transmission lines.","b":"$P_{loss}=I^2R$, where $I$ is the line current and $R$ the line resistance."},{"type":"word","topic":"Power transmission","f":"Transmission voltage is increased by a factor of 10. Effect on line loss?","b":"Current falls by 10, so $I^2R$ loss falls by a factor of 100."},{"type":"word","topic":"Power transmission","f":"Why not use $P=\\frac{V^2}{R}$ with the transmission voltage to find the line loss?","b":"The transmission voltage is not across the cable. Only the small voltage drop $IR$ is, so use $I^2R$ with the line current."}],"hours":3.5}}</script>

function hex(c){const n=parseInt(c.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}

/* ---------- star-chart engine: constellations, not orbits ---------- */
const hexA=a=>Math.round(clamp(a,0,1)*255).toString(16).padStart(2,'0');
const rgba=(c,a)=>{const h=hex(c.length===7?c:'#cccccc');return'rgba('+h[0]+','+h[1]+','+h[2]+','+clamp(a,0,1).toFixed(3)+')';};
const easeOut=x=>1-Math.pow(1-x,3);

let PX=0,PY=0,PXt=0,PYt=0,galT0=performance.now();

const DUST=Array.from({length:2600},()=>{const v=(rnd()+rnd()+rnd()+rnd()-2)/2;return{u:rnd(),v:v,r:rnd()*rnd()*1.1+.18,a:rnd()*.45+.08,c:rnd()};});
const CLOUD=Array.from({length:26},()=>({u:rnd(),v:(rnd()-.5)*.7,r:rnd()*.5+.25,c:rnd()}));
const SKY=Array.from({length:520},()=>({x:rnd(),y:rnd(),r:rnd()*rnd()*1.2+.2,a:rnd()*.5+.15,c:rnd()}));
let BG=null,BGk='';
function buildBG(){
  const d=qd(),bw=Math.round(W*1.08),bh=Math.round(H*1.08);
  BG=document.createElement('canvas');BG.width=Math.round(bw*d);BG.height=Math.round(bh*d);

    const col=c.c>.72?'92,90,96':c.c>.4?'72,74,86':'60,62,72';gr.addColorStop(0,'rgba('+col+',.035)');gr.addColorStop(1,'rgba('+col+',0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);});

      g.addColorStop(0,'rgba(255,248,230,'+(1-k)*.9+')');g.addColorStop(1,'rgba(255,255,255,0)');ctx.strokeStyle=g;ctx.lineWidth=1.4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-SS.dx*tl,y-SS.dy*tl);ctx.stroke();
      ctx.fillStyle='rgba(255,250,235,'+(1-k)+')';ctx.beginPath();ctx.arc(x,y,1.4,0,6.283);ctx.fill();}

  for(const s of stars){
    if(s.d<.55)continue;

  }

/* a star glyph: halo, diffraction spikes, hot core */
function starGlyph(x,y,r,col,k,t,sd,o){
  o=o||{};const tw=REDUCE?1:.82+.18*Math.sin(t*.0026+sd*1.9)+.06*Math.sin(t*.011+sd*4.1);
  ctx.save();ctx.globalCompositeOperation='lighter';
  const hr=r*(5+4*k)*(o.boost||1);
  const g=ctx.createRadialGradient(x,y,0,x,y,hr);g.addColorStop(0,rgba(col,.5*k));g.addColorStop(.18,rgba(col,.2*k));g.addColorStop(.5,rgba(col,.05*k));g.addColorStop(1,rgba(col,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,hr,0,6.283);ctx.fill();
  if(k>.3){
    const Ls=r*(3+7*k)*tw*(o.boost||1),rot=o.rot||0;
    const spike=(a,L,w)=>{const ex=x+Math.cos(a)*L,ey=y+Math.sin(a)*L,gr=ctx.createLinearGradient(x,y,ex,ey);gr.addColorStop(0,rgba('#ffffff',.85*k));gr.addColorStop(.25,rgba(col,.45*k));gr.addColorStop(1,rgba(col,0));
      ctx.strokeStyle=gr;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(ex,ey);ctx.stroke();};
    ctx.lineCap='round';
    for(let i=0;i<4;i++)spike(rot+i*Math.PI/2,Ls,Math.max(.8,r*.32));

  }

  ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r*1.25,0,6.283);ctx.fill();

function text(t,x,y,font,color,align,ls,halo){ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align||'center';ctx.textBaseline='alphabetic';if('letterSpacing' in ctx)ctx.letterSpacing=ls||'0px';if(halo){ctx.save();ctx.strokeStyle='rgba(4,6,13,.9)';ctx.lineWidth=5;ctx.lineJoin='round';ctx.strokeText(t,x,y);ctx.restore();}ctx.fillText(t,x,y);if('letterSpacing' in ctx)ctx.letterSpacing='0px';}
function pill(){}
function allChapters(s){return UNITS.reduce((a,u)=>a.concat(chaptersOf(s,u)),[]);}
/* deterministic constellation shapes */
const LAY={};
function hashS(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return(Math.abs(h)%2147483646)+1;}
function layout(key,n){
  const kk=key+':'+n;if(LAY[kk])return LAY[kk];
  let sd=hashS(key);const R=()=>(sd=(sd*16807)%2147483647)/2147483647;
  let best=null;
  for(let at=0;at<60;at++){
    const pts=[[0,0]];let a=R()*6.283,ok=true;
    for(let i=1;i<n;i++){

const LAYS={k:'',t:-1e9,a:null};
function layersPaint(t){
  const sc=.25,w=Math.max(8,Math.round(W*sc)),h=Math.max(8,Math.round(H*sc)),k=w+'x'+h;
  if(LAYS.k!==k){LAYS.k=k;LAYS.t=-1e9;{const c=document.createElement('canvas');c.width=w;c.height=h;LAYS.a=c;}}
  if(t>=LAYS.t&&t-LAYS.t<130)return;
  LAYS.t=t;
  const A=LAYS.a.getContext('2d');A.setTransform(sc,0,0,sc,0,0);A.clearRect(0,0,W,H);
  const sj=V.view==='subject'?subj(V.subj):null;
  const tint=[[.18,.22,.55,'#2a2c36',.04],[.86,.78,.6,'#24262e',.035]];
  if(sj)tint.push([.5,.5,.55,sj.hue,.03]);
  tint.forEach((b,i)=>{const x=W*b[0]+Math.sin(t*.00004+i*1.3)*40-PX*30,y=H*b[1]+Math.cos(t*.00003+i*2.1)*30-PY*20,r=Math.max(W,H)*b[2];
    const g=A.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,b[3]+hexA(b[4]));g.addColorStop(1,b[3]+'00');A.fillStyle=g;A.fillRect(0,0,W,H);});
  const B=A;
  const tt=REDUCE?0:t;
  MIST.forEach(m=>{const x=(((m.x+tt*.0000045*m.s)%1.4)-.2)*W,y=(m.y+.06*Math.sin(tt*.00007*m.s+m.p))*H,r=Math.max(W,H)*m.r;
    const g=B.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(120,125,145,.028)');g.addColorStop(.6,'rgba(90,95,115,.012)');g.addColorStop(1,'rgba(90,95,115,0)');B.fillStyle=g;B.fillRect(0,0,W,H);});
  const bb=REDUCE?.5:.5+.5*Math.sin(tt*.00045),g=B.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.78);

  {const po=panelOpen();if(po!==LPO){LPO=po;SETTLE=now+1300;}

function md(t){
  let out='',ul=false;
  for(const raw of String(t).split('\n')){
    const l=raw.trimEnd();
    if(/^\s*[-•*]\s+/.test(l)){if(!ul){out+='<ul>';ul=true;}out+='<li>'+inl(l.replace(/^\s*[-•*]\s+/,''))+'</li>';continue;}

/* ---------- prompts ---------- */
function ctxLine(c){return'Subject: '+c.s.name+'. Unit '+c.u+' of Queensland senior secondary (QCE Units 3 and 4, Year 12). Textbook chapter: "'+c.ch.title+'".';}
const MATHSTYLE='Write maths in LaTeX: $...$ for inline maths and $$...$$ for display maths (for example $\\frac{d}{dx}e^{2x}=2e^{2x}$).';
function lessonPrompt(c){
  const maths=/math/i.test(c.s.name);
  return'You are a warm, clear, patient tutor teaching a Year 12 student.\n'+ctxLine(c)+'\nTeach this chapter from scratch using these markdown headings: ## What this chapter is about, ## Key ideas (short bullets with the key formulas), ## Worked example 1 (a standard question with every step shown), ## Worked example 2 (harder, exam-style), ## Common mistakes. About 500 to 700 words.\n'+(maths?MATHSTYLE+' Put each key equation or step on its own line wrapped in backticks. ':'')+'Check every calculation by substituting back before you write it. You are working from the chapter title and the usual curriculum, not from the textbook text, so do not claim to quote the textbook.';
}
function qPrompt(c,n,strict,re){
  const maths=/math/i.test(c.s.name);
  return'You are writing '+n+' '+(strict?'exam-style checkpoint':'guided practice')+' questions for a Year 12 student.\n'+ctxLine(c)+'\n'+
   (maths?'Each question must have one short final answer that can be typed as plain text (a number, an expression, an interval or a probability). No graphs or diagrams, and nothing that needs more than simple arithmetic by hand. '+MATHSTYLE:'Each question should be answerable in one to three sentences. Write in plain text.')+
   '\nCover different sub-topics of the chapter and ramp up in difficulty ('+(strict?'start with a standard skill and finish with a harder multi-step question':'easy, then medium, then slightly harder')+'). Work every question out fully and verify each answer by substituting back or re-deriving it before you write it down.\n'+
   (re.length?'The first '+re.length+' question(s) must be fresh variants of questions the student previously got wrong (same skill, changed numbers or wording), in this order:\n'+re.map((m,i)=>(i+1)+'. '+m.q).join('\n')+'\n':'')+
   'Return only JSON: an array of '+n+' objects {"q": question text, "answer": final answer, "solution": numbered steps as one string, "topic": 2 to 4 word sub-topic, "hints": [a small nudge, an outline of the method, the full first step]}. No hint may state the final answer.';
}
function gradePrompt(c,q,ans,strict){
  const maths=/math/i.test(c.s.name);
  return'You are marking a Year 12 answer.\nQuestion: '+q.q+'\nReference answer: '+q.answer+'\nReference solution: '+q.solution+'\nStudent answer: '+ans+'\n'+
   (maths?'Accept mathematically equivalent forms (simplified or not, reasonable rounding, equal expressions, equivalent intervals). ':'Accept answers that make the same key points in different words. ')+
   'Reply only as JSON: {"correct": true or false, "errorType": "none" or "concept" or "method" or "arithmetic" or "misread" or "incomplete", "note": "at most two sentences. '+(strict?'If wrong, say what kind of error it looks like and roughly where, WITHOUT giving the correct answer or the solution.':'If wrong, explain the likely error kindly and point toward the fix.')+'"}';
}

/* ---------- sessions ---------- */
function mkQs(arr,n,re){
  if(arr&&!Array.isArray(arr)&&Array.isArray(arr.questions))arr=arr.questions;
  if(!Array.isArray(arr))throw{message:'Claude sent back something unexpected. Try again.'};
  const g=['Think about which rule or definition applies first.','Write down what you are given, then pick the method that uses it.','Start with the first step of that method and apply it carefully.'];
  const qs=arr.slice(0,n).filter(o=>o&&o.q&&o.answer).map((o,i)=>({q:String(o.q),answer:String(o.answer),solution:String(o.solution||''),topic:String(o.topic||''),hints:[0,1,2].map(k=>String((o.hints||[])[k]||g[k])),retestOf:re[i]?re[i].id:null,st:{conf:null,text:'',attempts:0,hints:0,credit:0,done:false,void:false,note:'',errorType:'',firstWrong:false,wrong:false,busy:false,err:'',revealed:false}}));
  if(!qs.length)throw{message:'No usable questions came back. Try again.'};
  return qs;
}
async function startLearn(force){

  if(force!==true&&S.lessons[cid]){sess={kind:'learn',ch:c,phase:'lesson',text:S.lessons[cid],qa:[],abort:new AbortController(),retry:startLearn};renderPanel();return;}
  sess={kind:'learn',ch:c,phase:'loading',msg:'Writing your lesson…',text:'',qa:[],abort:new AbortController(),retry:startLearn};renderPanel();
  const me=sess;

    const t=await askText(lessonPrompt(c),x=>{if(sess!==me)return;me.text=x.text;const b=$('#lessonBody');if(b)b.innerHTML=md(x.text);else renderPanel();},me.abort.signal);
    if(sess!==me)return;me.text=t;me.phase='lesson';S.lessons[cid]=t;DIRTY.add(cid);renderPanel();
  }catch(e){if(sess!==me)return;me.err=errText(e);renderPanel();}
}
async function startQuizAI(strict,force){
  const c=findCh(V.sel),cid=c.ch.id;
  const keep=sess&&sess.kind==='learn'?sess:null;
  const re=strict?openMistakes(c.ch.id).slice(0,3):[];
  const me=sess={kind:strict?'revise':'learn',ch:c,phase:'loading',msg:strict?'Building your checkpoint…':'Building practice questions…',qa:[],text:keep?keep.text:'',abort:new AbortController(),retry:()=>startQuizAI(strict)};
  me.practice=!strict;

  try{
    if(force!==true){
      if(!strict&&S.practice[cid]){me.qs=mkQs(S.practice[cid],n,[]);me.i=0;me.phase='q';renderPanel();return;}
      if(strict&&S.bank[cid]){const re2=(S.bank[cid].re||[]).map(i=>S.mistakes.find(m=>m.id===i)).filter(Boolean);me.qs=mkQs(S.bank[cid].arr,n,re2);me.i=0;me.phase='q';renderPanel();return;}
    }
  }catch(e){}

async function submit(){
  const q=sess.qs[sess.i],st=q.st;
  const box=$('#abox');if(box)st.text=box.value;
  if(!st.text.trim()){toast('Type an answer first.');return;}
  if(!q.keys)return submitAI();
  st.attempts++;
  if(q.keys.some(k=>sameAns(k,st.text))){st.note='';st.errorType='none';st.wrong=false;st.err='';st.done=true;st.credit=(st.attempts===1&&st.hints===0)?1:(st.hints<3?.5:0);}
  else{if(st.attempts===1)st.firstWrong=true;st.wrong=true;st.note=errHint(q.keys[0],st.text);st.errorType='method';}
  renderPanel();
}
async function claudeCheck(){
  const q=sess.qs[sess.i],st=q.st,me=sess;
  st.busy=true;st.err='';renderPanel();
  try{
    const r=await askJSON(gradePrompt(sess.ch,q,st.text,STRICT()),me.abort.signal);
    if(sess!==me)return;
    st.busy=false;st.note=String(r.note||'');st.errorType=String(r.errorType||st.errorType||'');
    if(r.correct===true||r.correct==='true'){st.wrong=false;st.done=true;st.credit=(st.attempts<=1&&st.hints===0)?1:(st.hints<3?.5:0);}
  }catch(e){if(sess!==me)return;st.busy=false;st.err=errText(e)+' You can mark this one yourself.';}
  renderPanel();
}
async function submitAI(){
  const q=sess.qs[sess.i],st=q.st,strict=STRICT();
  const box=$('#abox');if(box)st.text=box.value;
  if(!st.text.trim()){toast('Type an answer first.');return;}
  if(norm(st.text)===norm(q.answer)){st.attempts++;st.note='';st.errorType='none';st.wrong=false;st.err='';st.done=true;st.credit=(st.attempts===1&&st.hints===0)?1:(st.hints<3?.5:0);renderPanel();return;}
  st.busy=true;st.err='';st.wrong=false;renderPanel();
  const me=sess;
  try{
    const r=await askJSON(gradePrompt(sess.ch,q,st.text,strict),me.abort.signal);
    if(sess!==me)return;
    st.busy=false;st.attempts++;st.note=String(r.note||'');st.errorType=String(r.errorType||'');
    if(r.correct===true||r.correct==='true'){st.done=true;st.credit=(st.attempts===1&&st.hints===0)?1:(st.hints<3?.5:0);}
    else{if(st.attempts===1)st.firstWrong=true;st.wrong=true;}
  }catch(e){if(sess!==me)return;st.busy=false;st.err=errText(e)+' You can mark this one yourself.';}
  renderPanel();
}
function settleSelf(ok){
  const q=sess.qs[sess.i],st=q.st;st.err='';st.attempts++;
  if(ok){st.done=true;st.credit=(st.attempts===1&&st.hints===0)?1:(st.hints<3?.5:0);}else{if(st.attempts===1)st.firstWrong=true;st.wrong=true;}
}
function nextQ(){
  if(sess.i+1<sess.qs.length){sess.i++;sess.phase='q';}
  else sess.phase=STRICT()?'results':'learndone';
}
function applyRevise(c,sum){
  const id=c.ch.id,p=S.progress[id]||(S.progress[id]={status:'new',attempts:0,history:[],streak:0,due:0}),before=effStatus(id);let fixed=0;
  delete S.bank[id];
  p.attempts=(p.attempts||0)+1;p.history=(p.history||[]).concat([{t:Date.now(),pct:Math.round(sum.score*100),hints:sum.hints,mode:'revise'}]).slice(-12);
  p.risky=sum.cw>0;
  if(sum.score>=.8&&sum.hints<=1){p.status='solid';p.streak=(p.streak||0)+1;p.due=Date.now()+[7,21,60][Math.min(p.streak-1,2)]*DAY;}
  else if(sum.score>=.5){p.status='revise';p.streak=0;p.due=Date.now()+2*DAY;}
  else{p.status='learning';p.streak=0;p.due=0;}
  for(const q of sess.qs){
    if(q.st.void)continue;
    if(q.retestOf){const m=S.mistakes.find(m=>m.id===q.retestOf);if(m&&q.st.credit===1){const d=new Date().toDateString();if(!m.rights.includes(d)){m.rights.push(d);if(m.rights.length===2)fixed++;}}}
    else if(q.st.credit<1)S.mistakes.push({id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),ch:id,qid:q.qid,topic:q.topic,q:q.q,a:q.answer,type:q.st.errorType||'method',conf:q.st.conf,t:Date.now(),rights:[]});
  }
  S.mistakes=S.mistakes.slice(-200);
  S.flash={id:id,t:Date.now(),to:effStatus(id)};
  S.log=S.log.concat([{t:Date.now(),k:'revise',ch:id,pct:Math.round(sum.score*100),before:before,after:effStatus(id),fixed:fixed}]).slice(-300);
}
function applyLearn(c){
  const id=c.ch.id,p=S.progress[id]||(S.progress[id]={status:'new',attempts:0,history:[],streak:0,due:0});
  const before=effStatus(id);
  if(!p.status||p.status==='new')p.status='learning';
  p.learned=Date.now();S.flash={id:id,t:Date.now(),to:effStatus(id)};
  S.log=S.log.concat([{t:Date.now(),k:'learn',ch:id,before:before,after:effStatus(id)}]).slice(-300);
}

async function ask(){

/* ---------- local answer checking ---------- */
function cleanA(s){
  return String(s).toLowerCase().replace(/\$/g,'').replace(/\\(left|right|,|;|!)/g,'').replace(/\\(?:d|t)?frac\{([^{}]*)\}\{([^{}]*)\}/g,'($1)/($2)').replace(/\\(pi|theta|sqrt|ln|sin|cos|tan|cdot|times)/g,'$1').replace(/[{}]/g,'')
   .replace(/\s+/g,'').replace(/[·×]/g,'*').replace(/−/g,'-').replace(/π/g,'pi').replace(/√/g,'sqrt').replace(/²/g,'^2').replace(/³/g,'^3').replace(/θ/g,'theta').replace(/±/g,'+-')
   .replace(/°|degrees|units|square/g,'').replace(/and/g,',').replace(/\.$/,'');
}
function forms(s){
  const c=cleanA(s),out=new Set([c]);
  const m=c.match(/^[a-z]{1,3}(\([a-z0-9]+\))?=(.+)$/);if(m&&c.split('=').length===2)out.add(m[2]);
  if(c.indexOf(',')>0&&!/[()]/.test(c))out.add(c.split(',').sort().join(','));
  [...out].forEach(x=>{if(/^\(.*\)$/.test(x)&&x.indexOf('(',1)<0)out.add(x.slice(1,-1));});
  return out;
}
const numOfA=s=>{s=cleanA(s);let m=s.match(/^(-?\d*\.?\d+)$/);if(m)return{v:parseFloat(m[1]),dp:(m[1].split('.')[1]||'').length,frac:false};m=s.match(/^(-?\d+)\/(\d+)$/);if(m&&+m[2])return{v:+m[1]/+m[2],dp:0,frac:true};return null;};
function sameAns(key,given){
  const kn=numOfA(key),gn=numOfA(given);
  if(kn&&gn){const tol=kn.frac?.00051:kn.dp?0.5*Math.pow(10,-kn.dp)+1e-12:1e-9;return Math.abs(kn.v-gn.v)<=tol;}
  const sq=f=>{const o=new Set();f.forEach(x=>{o.add(x);o.add(x.replace(/\(([a-z0-9.]+)\)/g,'$1'));});return o;};
  const a=sq(forms(key)),b=sq(forms(given));for(const x of a)if(b.has(x))return true;return false;
}

const WG={};

function axes(m,vb){return'<line x1="0" x2="300" y1="'+m.y(0).toFixed(1)+'" y2="'+m.y(0).toFixed(1)+'" stroke="#5d6882" stroke-width="1"/><line y1="0" y2="190" x1="'+m.x(0).toFixed(1)+'" x2="'+m.x(0).toFixed(1)+'" stroke="#5d6882" stroke-width="1"/>';}
function curve(m,f,a,b,vb,col,w){

WG.trigfun={t:'Build $y=a\\sin(b(x-c))+d$',c:[['a','Amplitude a',.5,3,.1,1.5],['b','b',.5,3,.1,1],['c','Shift c',-3,3,.1,0],['d','Midline d',-2,2,.1,0]],draw:v=>{

function errHint(key,given){
  const k=numOfA(key),g=numOfA(given),base='That does not match the answer key. Check the form (exact values, simplified, brackets); if yours is equivalent, tap “I was right”.';
  if(k&&g){
    if(k.v!==0&&Math.abs(g.v+k.v)<1e-9)return'Sign error: your answer is the negative of the key. Recheck the sign on each step.';
    if(k.v!==0&&Math.abs(g.v/k.v-1)<.02)return'Very close: this looks like a rounding difference. Keep full decimals until the last step.';
    if(k.v!==0&&g.v!==0){const r=g.v/k.v;if((Math.abs(r)>=2&&Math.abs(r-Math.round(r))<1e-6)||(Math.abs(1/r)>=2&&Math.abs(1/r-Math.round(1/r))<1e-6))return'Factor error: your answer is a whole-number multiple or fraction of the key. Look for a missed chain-rule factor or a missed division.';}
    return'Wrong value. Redo the working line by line and compare with the worked example in the lesson.';
  }
  const ck=cleanA(key),cg=cleanA(given);
  if(/\+c$/.test(ck)&&!/\+c$/.test(cg)&&sameAns(ck.replace(/\+c$/,''),cg))return'Missing + c: an indefinite integral needs the constant of integration.';
  if(cg==='-'+ck||'-'+cg===ck)return'Sign error: your expression is the negative of the key. Recheck the signs.';
  return base;
}

function pickCheckpoint(cid){
  const ct=CT[cid],p=S.progress[cid]||{},out=[],used=new Set();
  openMistakes(cid).filter(m=>m.qid&&/-q\d+$/.test(m.qid)).slice(0,3).forEach(m=>{const i=+m.qid.split('-q')[1];if(ct.quiz[i]&&!used.has(i)){used.add(i);out.push(qObj(ct.quiz[i],m.qid,cid,m.id));}});
  rot(ct.quiz.length,0,(p.rc||0)+1).forEach(i=>{if(out.length<8&&!used.has(i)){used.add(i);out.push(qObj(ct.quiz[i],cid+'-q'+i,cid));}});
  return out;
}
function startQuiz(strict){
  const c=findCh(V.sel),cid=c.ch.id;
  if(!CT[cid])return startQuizAI(strict);
  sess={kind:strict?'revise':'learn',ch:c,phase:'q',qa:[],text:'',abort:new AbortController(),qs:strict?pickCheckpoint(cid):pickPractice(cid),i:0,retry:()=>startQuiz(strict)};
  renderPanel();
}
function startComet(){
  const c=findCh(V.sel),cid=c.ch.id,ct=CT[cid];
  sess={kind:'comet',ch:c,phase:'q',qa:[],text:'',abort:new AbortController(),qs:ct.comets.map((q,k)=>qObj(q,cid+'-c'+k,cid)),i:0};renderPanel();
}
function examPool(){
  const s=subj(V.subj),l=chaptersOf(s,V.unit).filter(c=>CT[c.id]),k=(S.exams[s.id+V.unit]||{}).n||0,out=[];
  l.forEach(c=>{const ct=CT[c.id];rot(ct.quiz.length,0,k+1).slice(0,2).forEach(i=>out.push(qObj(ct.quiz[i],c.id+'-q'+i,c.id)));});
  return out;
}
function startExam(){
  const qs=examPool();if(!qs.length)return;
  const s=subj(V.subj);
  const tb=document.getElementById('timedbox'),timed=!!(tb&&tb.checked);
  sess={kind:'exam',ch:{s:s,u:V.unit,ch:{id:'exam',title:'Unit exam'},i:0},phase:'q',qa:[],text:'',abort:new AbortController(),qs:qs,i:0};
  if(timed)sess.deadline=Date.now()+qs.length*120000;renderPanel();
}
function openExam(){V.hidden=false;flushSave();endSess();V.sel=null;V.add=false;V.insights=false;V.exam=true;renderPanel();chrome();}
function examHTML(){
  const s=subj(V.subj),key=s.id+V.unit,ex=S.exams[key],l=chaptersOf(s,V.unit),have=l.filter(c=>CT[c.id]),n=examPool().length;
  let h='<div class="top"><div><p class="eyebrow">'+esc(s.name)+' · Unit '+V.unit+'</p><h2>Unit exam station</h2></div><span class="pbtns"><button class="x" data-act="wide" title="Wide reading view" aria-label="Wide reading view">⤢</button><button class="x" data-act="hidepanel" title="Hide panel to see the map" aria-label="Hide panel">–</button><button class="x" data-act="close" aria-label="Close">×</button></span></div>';
  if(!have.length)return h+'<p class="muted">Lessons and question banks for this unit have not been built yet, so there is no exam here.</p>';
  h+='<p class="muted">A mixed, strict exam across every chapter in this unit: '+n+' questions, 2 from each chapter. Confidence rating first, hints cost marks. Questions you miss go into your weak-spot list.</p>'+
   '<div class="stats"><div><b>'+(ex?ex.best+'%':'—')+'</b><span>Best score</span></div><div><b>'+(ex?ex.n:0)+'</b><span>Attempts</span></div></div>'+
   (ex&&ex.hist?'<p class="sub">Recent: '+ex.hist.slice(-5).map(x=>x.pct+'%').join(' · ')+'</p>':'')+
   '<label class="tmr"><input type="checkbox" id="timedbox"> Timed mode: '+(n*2)+' minutes ('+n+' questions, 2 minutes each). When time runs out, unanswered questions score zero.</label><div class="row"><button class="btn" data-act="startexam">Start exam</button></div>';
  return h;
}
function applyExam(){
  const s=subj(V.subj),key=s.id+V.unit,sum=summarize(),pct=Math.round(sum.score*100),ex=S.exams[key]||(S.exams[key]={n:0,best:0,hist:[]});
  ex.n++;ex.best=Math.max(ex.best,pct);ex.hist=(ex.hist||[]).concat([{t:Date.now(),pct:pct}]).slice(-10);
  for(const q of sess.qs){if(q.st.void||q.st.credit>=1)continue;
    if(q.retestOf)continue;
    S.mistakes.push({id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),ch:q.ch,qid:q.qid,topic:q.topic,q:q.q,a:q.answer,type:q.st.errorType||'method',conf:q.st.conf,t:Date.now(),rights:[]});}
  S.mistakes=S.mistakes.slice(-200);
  addXP(40+Math.round(pct/2));
  S.log=S.log.concat([{t:Date.now(),k:'exam',pct:pct}]).slice(-300);
}
function applyPractice(c){
  const sm=summarize(),id=c.ch.id,p=S.progress[id]||(S.progress[id]={status:'new',attempts:0,history:[],streak:0,due:0});
  applyLearn(c);p.pc=(p.pc||0)+1;addXP(10+Math.round(sm.score*10));
}
function applyComet(c){
  let n=0;for(const q of sess.qs){if(q.st.done&&!q.st.revealed&&!q.st.void&&!S.comets[q.qid]){S.comets[q.qid]=Date.now();n++;}}
  addXP(25*n);S.log=S.log.concat([{t:Date.now(),k:'learn',ch:c.ch.id,after:effStatus(c.ch.id)}]).slice(-300);
}
function examResHTML(){
  const sum=summarize(),pct=Math.round(sum.score*100),by={};
  sess.qs.forEach(q=>{if(q.st.void)return;const b=by[q.ch]||(by[q.ch]={n:0,s:0});b.n++;b.s+=q.st.credit;});
  return'<p class="big">'+pct+'%</p><p class="muted">'+(pct>=80?'Strong. You are ready for this unit.':pct>=50?'A solid base with some gaps. The chapters below with low scores are the ones to revisit.':'Plenty to work on. Go back to the weakest chapters below.')+'</p><div class="res">'+
   Object.keys(by).map(id=>{const f=findCh(id);return'<div><span>Ch '+(f?numOf(f.ch,f.i):'')+' · '+esc(f?f.ch.title:id)+'</span><b>'+by[id].s+' / '+by[id].n+'</b></div>';}).join('')+'</div>'+
   '<p class="sub">Hints used: '+sum.hints+'. Confident-but-wrong answers: '+sum.cw+'.</p><div class="row"><button class="btn" data-act="saverev">Save result</button><button class="btn ghost" data-act="back">Discard</button></div>';
}
function renderPanel(){
  const p=$('#panel'),top=p.scrollTop;
  if(V.exam&&!V.insights&&!V.add&&!V.sel){p.innerHTML=(sess&&sess.kind==='exam')?'<div class="top"><div><p class="eyebrow">Unit exam</p><h2>'+esc(subj(V.subj).name)+' · Unit '+V.unit+'</h2></div><span class="pbtns"><button class="x" data-act="wide" title="Wide reading view" aria-label="Wide reading view">⤢</button><button class="x" data-act="hidepanel" title="Hide panel to see the map" aria-label="Hide panel">–</button><button class="x" data-act="close" aria-label="Close">×</button></span></div>'+sessHTML():examHTML();p.classList.add('open');}
  else renderPanel0();
  p.scrollTop=RESET?0:top;RESET=false;panelState();afterRender();
}

/* ---------- design pass 2 ---------- */
let LASTACT=Date.now(),TIMEDIRTY=false;
['pointerdown','keydown','wheel','input','touchstart'].forEach(ev=>addEventListener(ev,()=>{LASTACT=Date.now();},{passive:true}));
function updateClock(){const el=document.getElementById('clock');if(!el||!sess||!sess.deadline)return;const s=Math.max(0,Math.round((sess.deadline-Date.now())/1000));el.textContent='Time left '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');el.classList.toggle('low',s<120);}
setInterval(()=>{
  if(sess&&sess.deadline&&sess.kind==='exam'&&sess.phase!=='results'){
    updateClock();
    if(Date.now()>=sess.deadline){sess.qs.forEach(q=>{if(!q.st.done){q.st.done=true;q.st.credit=0;q.st.note='Time ran out.';}});sess.phase='results';toast('Time is up.');renderPanel();}
  }
  if(!document.hidden&&Date.now()-LASTACT<120000&&(sess||V.sel||V.exam||V.insights)){const k=dayKey(Date.now());S.time=S.time||{};S.time[k]=(S.time[k]||0)+5;TIMEDIRTY=true;}
},5000);
function markSec(id,sid){
  const p=S.progress[id]||(S.progress[id]={status:'new',attempts:0,history:[],streak:0,due:0}),secs=p.secs||(p.secs={}),ct=CT[id];
  if(!secs[sid]){secs[sid]=Date.now();addXP(5);if(!p.status||p.status==='new')p.status='learning';
    S.log=S.log.concat([{t:Date.now(),k:'learn',ch:id,before:'new',after:effStatus(id)}]).slice(-300);
    if(ct.sections.every(s=>secs[s.id])){p.learned=Date.now();addXP(10);toast('Whole chapter read. Now try the practice questions.');}
    UNSAVED=true;chrome();}
  const i=ct.sections.findIndex(s=>s.id===sid);if(i<ct.sections.length-1)sess.sec=i+1;
}
function checkDoneHTML(){
  const ok=sess.qs.filter(q=>q.st.done&&!q.st.revealed&&q.st.credit>0).length,n=sess.qs.length,pass=ok>=2;
  return'<p class="big">'+ok+' of '+n+'</p><p class="muted">'+(pass?'Nice. You can mark this section as understood.':'Not solid yet. Re-read the worked examples, then try again, or move on and come back.')+'</p><div class="row">'+(pass?'<button class="btn" data-act="checkdone">Mark section understood</button><button class="btn ghost" data-act="checkback">Back to lesson</button>':'<button class="btn" data-act="checkback">Back to lesson</button><button class="btn link" data-act="checkdone">Mark understood anyway</button>')+'</div>';
}
function panelState(){
  const p=$('#panel'),open=p.classList.contains('open');
  if(!open)V.hidden=false;
  p.classList.toggle('hid',open&&!!V.hidden);p.classList.toggle('wide',open&&!!V.wide);
  $('#showpanel').hidden=!(open&&V.hidden);
  const w=$('#panel .top .x[data-act="wide"]');if(w)w.textContent=V.wide?'⤡':'⤢';
}
$('#showpanel').addEventListener('click',()=>{V.hidden=false;panelState();});
$('#legBtn').addEventListener('click',()=>{const l=$('#legend'),o=!l.classList.contains('open');l.classList.toggle('open',o);$('#legBtn').setAttribute('aria-expanded',String(o));});
function chapBtn(l,nx){
  const st=nx?effStatus(nx.id):'solid';
  return'<button class="chip" role="listitem" data-chaps="1" aria-expanded="'+(!!V.chaps)+'"><i class="dot" style="--c:'+COL[st]+'"></i><span class="t">Chapters · '+solidCount(l)+'/'+l.length+' solid '+(V.chaps?'▴':'▾')+'</span></button>';
}
function renderChlist(l,nx){
  const el=$('#chlist');el.hidden=!V.chaps;
  if(!V.chaps){el.innerHTML='';return;}
  el.innerHTML=l.map((c,i)=>{
    const st=effStatus(c.id),ct=CT[c.id],p=S.progress[c.id]||{},d=Object.keys(p.secs||{}).length,tot=ct?ct.sections.length:0;
    return'<button class="chr" data-ch="'+c.id+'" aria-current="'+(V.sel===c.id)+'"><i class="dot" style="--c:'+COL[st]+'"></i><span style="flex:1"><b>'+numOf(c,i)+' · '+esc(c.title)+(nx&&nx.id===c.id?' (next)':'')+'</b><small>'+LABEL[st]+(tot?' · '+d+'/'+tot+' sections':' · no lesson yet')+(ct&&ct.hours?' · about '+ct.hours+' h':'')+'</small><span class="mini"><i style="width:'+(tot?Math.round(d/tot*100):0)+'%"></i></span></span></button>';
  }).join('');
}
function todayPick(){
  let due=null,rev=null,nxt=null;
  for(const s of VS())for(const u of UNITS){for(const c of chaptersOf(s,u)){
    const st=effStatus(c.id);
    if(st==='due'&&!due)due={s:s,c:c,why:'Due for review: bring it back before it fades'};
    if(st==='revise'&&!rev)rev={s:s,c:c,why:'Needs revision: you had most of it, close the gaps'};
    if((st==='new'||st==='learning')&&CT[c.id]&&!nxt)nxt={s:s,c:c,why:st==='new'?'Next chapter to start':'Keep going where you left off'};
  }}
  return due||rev||nxt;
}
function todayHTML(){
  const pk=todayPick(),wt=weakTopics(),w=weekInfo();
  if(!pk)return'';
  return'<div class="tdc"><p class="eyebrow">Today</p><b>'+esc(pk.s.name)+' · '+esc(pk.c.title)+'</b><span>'+esc(pk.why)+'</span>'+(wt.length?'<span>'+wt.length+' weak topic'+(wt.length>1?'s':'')+' open</span>':'')+'<button class="btn" data-today="'+pk.s.id+'|'+pk.c.id+'">Start</button></div>';
}
function studyHTML(){
  const T=S.time||{},now=Date.now(),days=[];
  for(let i=83;i>=0;i--)days.push(dayKey(now-i*DAY));
  const ld={};(S.log||[]).forEach(l=>{const k=dayKey(l.t);ld[k]=(ld[k]||0)+300;});
  const mins=d=>Math.round((T[d]?T[d]:(ld[d]||0))/60);
  const total=Object.values(T).reduce((a,b)=>a+b,0)/3600,wk=days.slice(-7).reduce((a,d)=>a+(T[d]||0),0)/3600;
  const plan=Object.values(CT).reduce((a,c)=>a+(c.hours||0),0);
  let cells='';const first=new Date(now-83*DAY).getDay();for(let i=0;i<first;i++)cells+='<i class="hc pad"></i>';
  days.forEach(d=>{const m=mins(d),lv=m===0?0:m<15?1:m<45?2:m<90?3:4;cells+='<i class="hc l'+lv+'" title="'+d+': '+m+' min"></i>';});
  let rows='';
  VS().forEach(s=>{const l=allChapters(s).filter(c=>CT[c.id]);if(!l.length)return;
    rows+='<h4 class="eyebrow" style="margin:12px 0 4px">'+esc(s.name)+'</h4>'+l.map(c=>{const ct=CT[c.id],p=S.progress[c.id]||{},d=Object.keys(p.secs||{}).length,st=effStatus(c.id),f=findCh(c.id);
      return'<button class="cp" data-ch="'+c.id+'"><i class="dot" style="--c:'+COL[st]+'"></i><span class="cpn">'+(f?numOf(f.ch,f.i):'')+' · '+esc(c.title)+'</span><span class="mini"><i style="width:'+Math.round(d/ct.sections.length*100)+'%"></i></span><b>'+d+'/'+ct.sections.length+'</b></button>';}).join('');});
  return'<h4 class="eyebrow" style="margin:18px 0 6px">Study time</h4><div class="stats"><div><b>'+total.toFixed(1)+' h</b><span>Tracked on this page (of about '+plan+' h planned)</span></div><div><b>'+wk.toFixed(1)+' h</b><span>Last 7 days</span></div></div>'+
   '<div class="prog"><i style="width:'+Math.min(100,Math.round(total/Math.max(plan,1)*100))+'%"></i></div><p class="sub">Time counts only while this page is open and you are active.</p>'+
   '<h4 class="eyebrow" style="margin:14px 0 6px">Last 12 weeks</h4><div class="heat" aria-label="Study heat map">'+cells+'</div>'+
   '<h4 class="eyebrow" style="margin:14px 0 4px">Chapter progress (sections understood)</h4>'+rows;
}

/* ---------- boot ---------- */
function start(d){
  d=d||{};
  if(d.view==='subject'&&subj(d.subj)){V.view='subject';V.subj=d.subj;V.unit=d.unit||'3';if(d.sel&&findCh(d.sel))V.sel=d.sel;}
  if(S.flash&&Date.now()-S.flash.t<120000){
    const f=findCh(S.flash.id);
    if(f){V.view='subject';V.subj=f.s.id;V.unit=f.u;V.sel=f.ch.id;toast(f.s.name+' · chapter '+numOf(f.ch,f.i)+' is now: '+LABEL[effStatus(f.ch.id)]);}
  }
  FLASH0=performance.now();
  resize();chrome();renderPanel();
  window.addEventListener('resize',resize);
  if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({view:V.view,subj:V.subj,unit:V.unit,sel:V.sel}));
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
  requestAnimationFrame(frame);
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start(window.claude&&window.claude.hot&&window.claude.hot.data?window.claude.hot.data:{});
})();
</script>
