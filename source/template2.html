ponentials: asymptote $y=k$, intercepts, range. Logs: laws, domain, asymptote $x=h$. Solving: isolate then $\\ln$; $u=e^x$; combine logs and check the domain. Derivatives: $\\frac{d}{dx}e^{f}=f'e^{f}$, $\\frac{d}{dx}\\ln f=\\frac{f'}{f}$. Models: find $N_0$ and $k$, solve, differentiate, interpret."},{"t":"ex","title":"Exam-style extended response (full working)","q":"A hot metal cools as $T(t)=25+75e^{-kt}$ (\u00b0C, $t$ minutes). After 5 minutes it is 55\u00b0C. (a) Show that $k=\\frac15\\ln\\frac52$. (b) Find the rate of cooling at $t=5$. (c) Find when the metal is within 1\u00b0C of room temperature.","s":["**(a) Substitute the data:** $55=25+75e^{-5k}\\Rightarrow75e^{-5k}=30\\Rightarrow e^{-5k}=\\frac{30}{75}=\\frac25$.","**Take logs:** $-5k=\\ln\\frac25$, so $k=-\\frac15\\ln\\frac25=\\frac15\\ln\\frac52$ (using $-\\ln\\frac ab=\\ln\\frac ba$), as required.","**(b) Differentiate:** $T'(t)=-75ke^{-kt}$. At $t=5$, $75e^{-5k}=30$ (from part a), so $T'(5)=-30k=-6\\ln\\frac52\\approx-5.50$.","**Interpret:** the metal is cooling at about 5.5 \u00b0C per minute at $t=5$.","**(c) \"Within 1\u00b0C of room temperature\" means $T=26$:** $25+75e^{-kt}=26\\Rightarrow e^{-kt}=\\frac1{75}$.","**Solve:** $t=\\dfrac{\\ln75}{k}=\\dfrac{\\ln75}{\\frac15\\ln2.5}=\\dfrac{5\\ln75}{\\ln2.5}\\approx\\dfrac{5\\times4.3175}{0.9163}\\approx23.6$ minutes."],"a":"(a) shown; (b) cooling at about $5.5$ \u00b0C/min; (c) after about $23.6$ minutes"},{"t":"ex","title":"Exam-style: equation and tangent combined (full working)","q":"Let $f(x)=e^{2x}-3e^x$. (a) Find the exact $x$-intercept. (b) Find the exact coordinates of the stationary point.","s":["**(a) Set $f(x)=0$ and factorise:** $e^x(e^x-3)=0$.","**Solve each factor:** $e^x=0$ has no solution; $e^x=3$ gives $x=\\ln3$. So the $x$-intercept is $(\\ln3,0)$.","**(b) Differentiate:** $f'(x)=2e^{2x}-3e^x=e^x(2e^x-3)$.","**Set to zero:** $e^x\\neq0$, so $2e^x=3\\Rightarrow e^x=\\frac32\\Rightarrow x=\\ln\\frac32$.","**Find $y$:** $f\\left(\\ln\\frac32\\right)=\\left(\\frac32\\right)^2-3\\left(\\frac32\\right)=\\frac94-\\frac92=-\\frac94$."],"a":"(a) $(\\ln3,0)$; (b) $\\left(\\ln\\frac32,\\,-\\frac94\\right)$"},{"t":"warn","x":"Common lost marks in this chapter: forgetting to reject a log solution outside the domain, treating $\\ln(a+b)$ as $\\ln a+\\ln b$, rounding $k$ too early, and giving a decimal when an exact answer was asked for."}],"checks":[{"topic":"Show that","q":"$55=25+75e^{-5k}$. Find $k$ exactly.","a":"(1/5)ln(5/2)","alt":["(1/5)ln2.5","ln2.5/5","ln(5/2)/5","0.183"],"ad":"$k=\\tfrac15\\ln\\tfrac52\\approx0.183$","sol":"Subtract 25: $75e^{-5k}=30$. || Divide by 75: $e^{-5k}=\\frac25$. || Take logs: $-5k=\\ln\\frac25$. || So $k=-\\frac15\\ln\\frac25=\\frac15\\ln\\frac52\\approx0.183$.","h":["Isolate the exponential.","Take $\\ln$.","$-\\ln\\frac25=\\ln\\frac52$."]},{"topic":"Factorising exponentials","q":"Solve $e^{2x}-3e^x=0$ exactly.","a":"ln3","alt":["x=ln3"],"ad":"$x=\\ln3$","sol":"Factorise out $e^x$: $e^x(e^x-3)=0$. || $e^x=0$ is impossible because exponentials are always positive. || So $e^x=3$. || Therefore $x=\\ln3$.","h":["Take out a common factor.","Can $e^x$ be zero?","Solve the other factor."]},{"topic":"Mixed derivative","q":"Differentiate $y=e^{3x}+\\ln(2x)$.","a":"3e^(3x)+1/x","alt":["3e^(3x)+(1/x)","1/x+3e^(3x)"],"ad":"$3e^{3x}+\\dfrac1x$","sol":"Differentiate term by term. || $\\frac{d}{dx}e^{3x}=3e^{3x}$. || $\\frac{d}{dx}\\ln(2x)=\\frac{2}{2x}=\\frac1x$. || So $\\frac{dy}{dx}=3e^{3x}+\\frac1x$.","h":["Treat each term separately.","Use $\\frac{d}{dx}e^{kx}=ke^{kx}$.","$\\ln(2x)$ has derivative $\\frac1x$."]},{"topic":"Stationary value","q":"Find the minimum value of $f(x)=e^{2x}-4e^x$.","a":"-4","alt":["y=-4"],"ad":"$-4$","sol":"Differentiate: $f'(x)=2e^{2x}-4e^x=2e^x(e^x-2)$. || Set to zero: $e^x=2$, so $x=\\ln2$. || Evaluate: $f(\\ln2)=(e^{\\ln2})^2-4e^{\\ln2}=4-8=-4$. || The sign of $f'$ changes from negative to positive at $x=\\ln2$, so this is the minimum value: $-4$.","h":["Factorise the derivative.","Solve $e^x=2$.","Substitute back using $e^{\\ln2}=2$."]},{"topic":"Model interpretation","q":"A population follows $P=1200e^{0.03t}$. Give the initial population and the continuous growth rate as a percentage.","a":"1200,3%","alt":["1200 and 3%","1200, 3","1200,0.03"],"ad":"Initial population $1200$; growth rate $3\\%$ per unit time","sol":"At $t=0$: $P=1200e^0=1200$. || The coefficient of $t$ in the index is $k=0.03$. || As a percentage, $k=3\\%$. || So the population starts at 1200 and grows continuously at 3% per unit of time.","h":["Substitute $t=0$.","$k$ is the number multiplying $t$.","Convert $0.03$ to a percentage."]}]}],"quiz":[{"topic":"Chain rule with e","q":"Differentiate $y=3e^{5x}$.","a":"15e^(5x)","alt":[],"ad":"$15e^{5x}$","sol":"Identify the power of $e$: it is $5x$, whose derivative is $5$. || Using $\\frac{d}{dx}e^{kx}=ke^{kx}$, $\\frac{d}{dx}e^{5x}=5e^{5x}$. || The constant multiplier 3 stays in front: $3\\times5e^{5x}=15e^{5x}$. || So $\\frac{dy}{dx}=15e^{5x}$.","h":["Which part is the \"inside\" of the exponential?","Differentiate the inside and multiply by the whole exponential.","The constant 3 stays as a multiplier: $3\\times 5\\times e^{5x}$."]},{"topic":"Chain rule with e","q":"Differentiate $y=e^{x^2-3x}$.","a":"(2x-3)e^(x^2-3x)","alt":[],"ad":"$(2x-3)e^{x^2-3x}$","sol":"The power is $f(x)=x^2-3x$. || Differentiate the power: $f'(x)=2x-3$. || Using $\\frac{d}{dx}e^{f(x)}=f'(x)e^{f(x)}$, copy the exponential and multiply by $2x-3$. || So $\\frac{dy}{dx}=(2x-3)e^{x^2-3x}$.","h":["Name the inside function.","Its derivative is $2x-3$.","Multiply it by $e^{x^2-3x}$."]},{"topic":"Log law","q":"Simplify $\\ln 8-\\ln 2$ to a single power of $\\ln 2$ (write the answer as a multiple of $\\ln 2$).","a":"2ln2","alt":["2ln(2)","ln4","ln(4)"],"ad":"$2\\ln 2$","sol":"Use the quotient law: $\\ln8-\\ln2=\\ln\\frac82$. || Simplify: $\\frac82=4$, so this is $\\ln4$. || Write 4 as a power of 2: $\\ln4=\\ln2^2$. || Use the power law: $\\ln2^2=2\\ln2$.","h":["Use $\\ln a-\\ln b=\\ln\\frac ab$.","That gives $\\ln 4$.","Write $4$ as $2^2$."]},{"topic":"Solve in e","q":"Solve $2e^{3x}=14$. Give an exact answer.","a":"(1/3)ln7","alt":["ln(7)/3","ln7/3","(ln7)/3","1/3ln7","(1/3)ln(7)"],"ad":"$x=\\tfrac13\\ln 7$","sol":"Divide both sides by 2 to isolate the exponential: $e^{3x}=7$. || Take natural logs of both sides: $\\ln e^{3x}=\\ln7$, so $3x=\\ln7$. || Divide by 3: $x=\\frac13\\ln7$. || As a check, $\\frac13\\ln7\\approx0.649$ and $2e^{3(0.649)}\\approx14$.","h":["Divide both sides by 2 first.","Take $\\ln$ of both sides.","Divide by 3."]},{"topic":"Quadratic in e^x","q":"Solve $e^{2x}-4e^x-5=0$.","a":"ln5","alt":["x=ln5","ln(5)","x=ln(5)"],"ad":"$x=\\ln 5$","sol":"Notice $e^{2x}=(e^x)^2$ and let $u=e^x$: the equation becomes $u^2-4u-5=0$. || Factorise: two numbers multiplying to $-5$ and adding to $-4$ are $-5$ and $1$, so $(u-5)(u+1)=0$. || So $u=5$ or $u=-1$. Reject $u=-1$ because $e^x$ is always positive. || Solve $e^x=5$: $x=\\ln5$.","h":["Substitute $u=e^x$.","Factorise the quadratic in $u$.","Which root is impossible and why?"]},{"topic":"Log equation","q":"Solve $\\ln(x+1)+\\ln(x-1)=\\ln 8$.","a":"3","alt":["x=3"],"ad":"$x=3$","sol":"Domain first: $x+1>0$ and $x-1>0$, so solutions must satisfy $x>1$. || Combine the left side with the product law: $\\ln\\big((x+1)(x-1)\\big)=\\ln8$. || Equate the insides: $(x+1)(x-1)=8$, so $x^2-1=8$ and $x^2=9$, giving $x=\\pm3$. || Reject $x=-3$ because it makes $\\ln(x-1)$ undefined. So $x=3$.","h":["Combine the left side into one log.","Equate the arguments.","Check each solution in the original domain."]},{"topic":"Differentiate ln","q":"Differentiate $y=\\ln(x^2+1)$.","a":"2x/(x^2+1)","alt":["(2x)/(x^2+1)"],"ad":"$\\dfrac{2x}{x^2+1}$","sol":"The inside of the log is $f(x)=x^2+1$, with derivative $f'(x)=2x$. || Use $\\frac{d}{dx}\\ln f(x)=\\frac{f'(x)}{f(x)}$. || Put the derivative of the inside over the inside. || So $\\frac{dy}{dx}=\\frac{2x}{x^2+1}$.","h":["Use $\\frac{f'}{f}$.","$f=x^2+1$.","$f'=2x$."]},{"topic":"Tangent","q":"Find the gradient of the tangent to $y=e^{2x}+x$ at $x=0$.","a":"3","alt":["m=3"],"ad":"$3$","sol":"Differentiate term by term: $\\frac{d}{dx}e^{2x}=2e^{2x}$ and $\\frac{d}{dx}x=1$. || So $\\frac{dy}{dx}=2e^{2x}+1$. || Substitute $x=0$: $2e^0+1=2(1)+1$. || The gradient of the tangent at $x=0$ is $3$.","h":["Differentiate first.","Differentiate $e^{2x}$ by the chain rule.","Substitute $x=0$."]},{"topic":"Growth model","q":"A population is $P=500e^{0.04t}$. Find $P$ when $t=10$ (nearest whole number).","a":"746","alt":["745.9","746 people"],"ad":"$\\approx 746$","sol":"Substitute $t=10$ into the model: $P=500e^{0.04\\times10}=500e^{0.4}$. || Evaluate the exponential: $e^{0.4}\\approx1.49182$. || Multiply: $500\\times1.49182\\approx745.9$. || Round to the nearest whole number: $P\\approx746$.","h":["Substitute $t=10$.","You need $e^{0.4}$.","Multiply by 500 and round."]},{"topic":"Half-life","q":"A substance decays by $A=A_0e^{-0.1t}$. Find its half-life to 2 decimal places.","a":"6.93","alt":["6.931","10ln2"],"ad":"$10\\ln 2\\approx 6.93$","sol":"At the half-life the amount is half the starting amount: $\\frac12A_0=A_0e^{-0.1t}$. || Cancel $A_0$: $e^{-0.1t}=\\frac12$. || Take logs: $-0.1t=\\ln\\frac12=-\\ln2$. || Solve: $t=\\frac{\\ln2}{0.1}=10\\ln2\\approx6.93$.","h":["Set $A=\\tfrac12A_0$.","Take $\\ln$ of both sides.","Divide by $-0.1$."]},{"topic":"Limit","q":"Evaluate $\\displaystyle\\lim_{x\\to2}\\frac{x^2-4}{x-2}$.","a":"4","alt":[],"ad":"$4$","sol":"Substituting $x=2$ gives $\\frac{0}{0}$, so simplify first. || Factorise the numerator as a difference of two squares: $x^2-4=(x-2)(x+2)$. || Cancel $(x-2)$, allowed because $x\\neq2$ in a limit: the expression becomes $x+2$. || Substitute: $2+2=4$.","h":["Substituting gives $0/0$.","Factorise the numerator.","Cancel and substitute."]},{"topic":"First principles","q":"Using first principles, $f(x)=x^2+3x$ gives $\\frac{f(x+h)-f(x)}{h}=2x+h+3$. Find $f'(x)$.","a":"2x+3","alt":[],"ad":"$2x+3$","sol":"The derivative is the limit of the quotient: $f'(x)=\\lim_{h\\to0}(2x+h+3)$. || As $h\\to0$ the $h$ term vanishes. || What remains is $2x+3$. || So $f'(x)=2x+3$.","h":["What happens to $h$?","It tends to 0.","Remove $h$."]},{"topic":"Exponential through points","q":"$y=ae^{bx}$ passes through $(0,5)$ and $(1,5e^{-3})$. Find $b$.","a":"-3","alt":["b=-3"],"ad":"$b=-3$","sol":"Substitute $(0,5)$: $5=ae^0=a$, so $a=5$. || Substitute $(1,5e^{-3})$: $5e^{-3}=5e^{b}$. || Divide by 5: $e^b=e^{-3}$. || Equal bases mean equal indices, so $b=-3$.","h":["Use $x=0$ first.","$a=5$.","Equate the exponents at $x=1$."]},{"topic":"Change of base","q":"Solve $3^x=20$ to 2 decimal places.","a":"2.73","alt":["2.727"],"ad":"$x=\\frac{\\ln20}{\\ln3}\\approx2.73$","sol":"Take natural logs of both sides: $\\ln3^x=\\ln20$. || Use the power law: $x\\ln3=\\ln20$. || Divide: $x=\\frac{\\ln20}{\\ln3}=\\frac{2.9957}{1.0986}$. || So $x\\approx2.73$.","h":["Take $\\ln$ of both sides.","$x\\ln3=\\ln20$.","Divide and round."]},{"topic":"Stationary","q":"Find the $x$-value of the minimum of $y=e^x-3x$. Give an exact answer.","a":"ln3","alt":["ln(3)","x=ln3"],"ad":"$x=\\ln3$","sol":"Differentiate: $y'=e^x-3$. || Set to zero: $e^x=3$, so $x=\\ln3$. || Second derivative: $y''=e^x$, which is positive for all $x$. || So the stationary point at $x=\\ln3$ is a minimum.","h":["Differentiate.","Set to zero.","Solve with $\\ln$."]},{"topic":"Log equation","q":"Solve $\\log_3x+\\log_3(x-8)=2$.","a":"9","alt":["x=9"],"ad":"$x=9$","sol":"Domain: $x>0$ and $x-8>0$, so $x>8$. || Combine with the product law: $\\log_3\\big(x(x-8)\\big)=2$. || Convert to index form: $x(x-8)=3^2=9$, so $x^2-8x-9=0$, which factorises to $(x-9)(x+1)=0$. || $x=-1$ is outside the domain, so reject it. The answer is $x=9$.","h":["Combine the logs.","Convert to index form.","Check the domain."]},{"topic":"Log derivative","q":"Differentiate $y=\\ln(\\cos x)$ for $0\u003cx\u003c\\frac\\pi2$.","a":"-tanx","alt":["-tan(x)"],"ad":"$-\\tan x$","sol":"The inside is $f(x)=\\cos x$, with derivative $f'(x)=-\\sin x$. || Apply $\\frac{d}{dx}\\ln f=\\frac{f'}{f}$: $\\frac{-\\sin x}{\\cos x}$. || Simplify using $\\frac{\\sin x}{\\cos x}=\\tan x$. || So $\\frac{dy}{dx}=-\\tan x$.","h":["Use $\\frac{f'}f$.","$f'=-\\sin x$.","Simplify."]},{"topic":"Tangent","q":"The tangent to $y=\\ln x$ at $x=1$ has what $y$-intercept?","a":"-1","alt":[],"ad":"$-1$","sol":"The point on the curve is $(1,\\ln1)=(1,0)$. || The gradient is $\\frac{dy}{dx}=\\frac1x=1$ at $x=1$. || Tangent: $y-0=1(x-1)$, so $y=x-1$. || The $y$-intercept (set $x=0$) is $-1$.","h":["Gradient is $\\frac1x$ at $x=1$.","Point is $(1,0)$.","Write $y=mx+c$."]},{"topic":"Cooling","q":"$T=20+60e^{-0.1t}$. Find $T$ when $t=10$ (1 decimal place).","a":"42.1","alt":["42.07"],"ad":"$\\approx42.1$","sol":"Substitute $t=10$: $T=20+60e^{-0.1\\times10}=20+60e^{-1}$. || Evaluate: $e^{-1}\\approx0.36788$, so $60e^{-1}\\approx22.07$. || Add: $20+22.07=42.07$. || To 1 decimal place, $T\\approx42.1$.","h":["Substitute $t=10$.","$e^{-1}\\approx0.3679$.","Multiply and add."]},{"topic":"Doubling","q":"$P=P_0e^{kt}$ triples in 6 years. Find $k$ exactly.","a":"ln3/6","alt":["(ln3)/6","(1/6)ln3","ln(3)/6"],"ad":"$k=\\dfrac{\\ln3}{6}$","sol":"Tripling means $P=3P_0$ when $t=6$: $3P_0=P_0e^{6k}$. || Cancel $P_0$: $e^{6k}=3$. || Take logs: $6k=\\ln3$. || So $k=\\frac{\\ln3}{6}\\approx0.183$.","h":["$3P_0=P_0e^{6k}$.","Cancel $P_0$.","Take $\\ln$."]}],"comets":[{"topic":"Extension: a tangent that passes through the origin","q":"Find the value of $a$ so that the tangent to $y=e^{x}$ at $x=a$ passes through the origin.","a":"1","alt":["a=1"],"ad":"$a=1$","sol":"Find the tangent at $x=a$: the point is $(a,e^a)$ and the gradient is $e^a$ (since $\\frac{d}{dx}e^x=e^x$). || The tangent is $y-e^a=e^a(x-a)$. || For it to pass through the origin, substitute $(0,0)$: $0-e^a=e^a(0-a)$, so $-e^a=-ae^a$. || Divide by $-e^a$ (never zero): $a=1$.","h":["Write the tangent at $x=a$.","Substitute $(0,0)$ into it.","Cancel $e^a$, which is never zero."]},{"topic":"Extension: solving a hidden quadratic","q":"Solve $\\ln(x)^2=\\ln(x^3)-2$ for $x$ given $\\ln(x)^2$ means $(\\ln x)^2$. Give exact answers.","a":"e and e^2","alt":["e,e^2","x=e,x=e^2","e^2,e"],"ad":"$x=e$ or $x=e^2$","sol":"Let $u=\\ln x$. Then $(\\ln x)^2=u^2$ and $\\ln(x^3)=3\\ln x=3u$. || The equation becomes $u^2=3u-2$, i.e. $u^2-3u+2=0$. || Factorise: $(u-1)(u-2)=0$, so $u=1$ or $u=2$. || Convert back: $\\ln x=1\\Rightarrow x=e$ and $\\ln x=2\\Rightarrow x=e^2$. Both are positive, so both are valid.","h":["Let $u=\\ln x$.","Use the log law on $\\ln(x^3)$.","Solve the quadratic in $u$."]},{"topic":"Extension: Where does $e^x$ equal its tangent from the origin?","q":"The line $y=mx$ touches $y=e^x$ exactly once. Find $m$ exactly.","a":"e","alt":["m=e"],"ad":"$m=e$","sol":"If $y=mx$ touches $y=e^x$, it is a tangent to the curve that passes through the origin. || The tangent at $x=a$ is $y=e^ax+e^a(1-a)$, which passes through the origin only if $e^a(1-a)=0$, so $a=1$. || The gradient there is $m=e^a=e^1$. || So $m=e$.","h":["Write the tangent at $x=a$.","Force it through $(0,0)$.","Then $m=e^a$."]}],"cards":[{"type":"def","topic":"Limits","f":"What does $\\lim_{x\\to a}f(x)=L$ mean in words?","b":"As $x$ gets closer and closer to $a$ (from both sides), $f(x)$ gets closer and closer to $L$. The function does not have to equal $L$ at $x=a$."},{"type":"def","topic":"Limits","f":"State the first-principles definition of the derivative.","b":"$$f'(x)=\\lim_{h\\to0}\\frac{f(x+h)-f(x)}{h}$$ It is the limit of the gradient of a chord as the chord shrinks to a point."},{"type":"def","topic":"Limits","f":"When does a two-sided limit fail to exist?","b":"When the left-hand limit and right-hand limit are different (a jump), or when the function grows without bound (a vertical asymptote)."},{"type":"def","topic":"The exponential function","f":"What is special about the number $e$?","b":"It is the base for which the gradient of $y=e^x$ equals its height at every point, so $\\frac{d}{dx}e^x=e^x$. $e\\approx2.718$."},{"type":"def","topic":"The exponential function","f":"For $y=ae^{b(x-h)}+k$, which constant gives the horizontal asymptote?","b":"$k$. The asymptote is $y=k$. ($h$ shifts sideways and does not move the asymptote.)"},{"type":"def","topic":"Differentiation of exponential functions","f":"Differentiate $e^{f(x)}$.","b":"$f'(x)\\,e^{f(x)}$: the derivative of the power, times the original exponential."},{"type":"word","topic":"Differentiation of exponential functions","f":"A population is $P=500e^{0.04t}$ (years). How fast is it growing when $t=10$?","b":"$P'=20e^{0.04t}$, so $P'(10)=20e^{0.4}\\approx29.8$ per year."},{"type":"def","topic":"The logarithmic function","f":"State the three main log laws.","b":"$\\log(xy)=\\log x+\\log y$; $\\log\\frac xy=\\log x-\\log y$; $\\log x^n=n\\log x$."},{"type":"def","topic":"The logarithmic function","f":"Domain, range and asymptote of $y=\\ln x$?","b":"Domain $x>0$, range all real numbers, vertical asymptote $x=0$, passes through $(1,0)$."},{"type":"def","topic":"Solving equations","f":"First step to solve $5e^{2x}=40$?","b":"Isolate the exponential: $e^{2x}=8$, then take $\\ln$: $2x=\\ln 8$, $x=\\frac12\\ln8$."},{"type":"def","topic":"Solving equations","f":"Why must you check solutions of log equations?","b":"Logs are only defined for positive arguments. Any solution making an argument zero or negative must be rejected, and you should say why."},{"type":"def","topic":"Differentiation of logarithmic functions","f":"Differentiate $\\ln f(x)$.","b":"$\\dfrac{f'(x)}{f(x)}$: derivative of the inside over the inside."},{"type":"def","topic":"Differentiation of logarithmic functions","f":"What is $\\frac{d}{dx}\\ln(kx)$ for a constant $k$?","b":"$\\frac1x$. The $k$ cancels: $\\frac{k}{kx}=\\frac1x$."},{"type":"word","topic":"Modelling and solving with exponential and logarithmic functions","f":"A sample halves every 8 years. Find $k$ in $A=A_0e^{-kt}$.","b":"$\\tfrac12=e^{-8k}\\Rightarrow k=\\dfrac{\\ln2}{8}\\approx0.0866$ per year."},{"type":"word","topic":"Modelling and solving with exponential and logarithmic functions","f":"$T=20+60e^{-0.1t}$. What temperature does the object approach and why?","b":"$20$\u00b0C, because $e^{-0.1t}\\to0$ as $t\\to\\infty$. This is room temperature (the horizontal asymptote)."},{"type":"word","topic":"Modelling and solving with exponential and logarithmic functions","f":"A town of 8000 grows 3% per year. Write a continuous model and find when it reaches 12000.","b":"Using $P=8000e^{kt}$ with $e^k=1.03$, $k=\\ln1.03$. $12000=8000e^{kt}\\Rightarrow t=\\dfrac{\\ln1.5}{\\ln1.03}\\approx13.7$ years."},{"type":"word","topic":"Modelling and solving with exponential and logarithmic functions","f":"$A=80e^{-0.2t}$ mg. When is the amount decreasing at 4 mg/h?","b":"$A'=-16e^{-0.2t}=-4\\Rightarrow e^{-0.2t}=\\tfrac14\\Rightarrow t=5\\ln4\\approx6.93$ h."}],"hours":5},"mm3-c02":{"id":"mm3-c02","interactive":"trigfun","summary":"Trigonometric functions are periodic, so they model tides, temperature and anything that repeats. This chapter works in radians, uses the unit circle for exact values, sketches transformed sine and cosine graphs, differentiates them, and models real cycles.","videos":[{"src":"B","title":"Euler's formula with introductory group theory (3Blue1Brown)","url":"https://www.youtube.com/watch?v=mvmuCPvRoWQ","kind":"video"},{"src":"B","title":"Derivative formulas through geometry (3Blue1Brown, ch. 3)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Derivative+formulas+through+geometry+Essence+of+calculus+chapter+3","kind":"search"},{"src":"J","title":"Unit circle and exact values","url":"https://www.youtube.com/results?search_query=Joel+Speranza+unit+circle+exact+values","kind":"search"},{"src":"J","title":"Trig graphs and transformations","url":"https://www.youtube.com/results?search_query=Joel+Speranza+trigonometric+graphs+transformations","kind":"search"},{"src":"J","title":"Differentiating sin and cos","url":"https://www.youtube.com/results?search_query=Joel+Speranza+differentiation+sin+cos","kind":"search"}],"sections":[{"id":"mm3-c02-s1","code":"2.2","title":"The unit circle and radians","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: radians and the unit circle exact values","url":"https://www.youtube.com/results?search_query=Joel+Speranza+radians+and+the+unit+circle+exact+values","kind":"search"}]},{"t":"p","x":"**What this topic is about.** Calculus with trigonometric functions only works in **radians**, and exact values from the unit circle appear in nearly every trig question in the technology-free paper. This topic rebuilds radian measure, the unit circle, exact values, the quadrant signs, symmetry identities, and arc length and sector area, so that later differentiation and modelling are smooth."},{"t":"key","x":"**Radians.** One radian is the angle at the centre of a circle subtended by an arc equal in length to the radius. A full turn is $2\\pi$ radians, so $\\pi\\text{ rad}=180^\\circ$. Degrees to radians: multiply by $\\frac{\\pi}{180}$. Radians to degrees: multiply by $\\frac{180}{\\pi}$."},{"t":"p","x":"**Why radians?** In radians the arc length is simply $s=r\\theta$, and (as you will see in 2.4) $\\frac{d}{dx}\\sin x=\\cos x$ exactly. In degrees every calculus formula picks up an awkward factor of $\\frac{\\pi}{180}$. So in this unit, assume radians unless a degree symbol is shown, and set your calculator to radian mode."},{"t":"key","x":"**The unit circle.** For the point $P$ on a circle of radius 1 at angle $\\theta$ (measured anticlockwise from the positive $x$-axis): $P=(\\cos\\theta,\\sin\\theta)$ and $\\tan\\theta=\\dfrac{\\sin\\theta}{\\cos\\theta}$. Pythagoras on the unit circle gives the identity $\\sin^2\\theta+\\cos^2\\theta=1$."},{"t":"p","x":"**Exact values from two triangles.** Half an equilateral triangle of side 2 has sides $1,\\sqrt3,2$ and angles $\\frac\\pi6$ and $\\frac\\pi3$. Half a unit square has sides $1,1,\\sqrt2$ and angle $\\frac\\pi4$. Reading SOH-CAH-TOA from these gives: $\\sin\\frac\\pi6=\\frac12$, $\\cos\\frac\\pi6=\\frac{\\sqrt3}2$, $\\tan\\frac\\pi6=\\frac1{\\sqrt3}$; $\\sin\\frac\\pi4=\\cos\\frac\\pi4=\\frac{\\sqrt2}2$, $\\tan\\frac\\pi4=1$; $\\sin\\frac\\pi3=\\frac{\\sqrt3}2$, $\\cos\\frac\\pi3=\\frac12$, $\\tan\\frac\\pi3=\\sqrt3$. Also $\\sin0=0$, $\\cos0=1$, $\\sin\\frac\\pi2=1$, $\\cos\\frac\\pi2=0$."},{"t":"p","x":"**Signs in each quadrant (ASTC).** Quadrant 1 ($0$ to $\\frac\\pi2$): **A**ll positive. Quadrant 2 ($\\frac\\pi2$ to $\\pi$): only **S**in positive. Quadrant 3 ($\\pi$ to $\\frac{3\\pi}2$): only **T**an positive. Quadrant 4 ($\\frac{3\\pi}{2}$ to $2\\pi$): only **C**os positive. This follows from the signs of the $x$ and $y$ coordinates."},{"t":"p","x":"**Method for any exact value.** (1) Locate the angle's quadrant. (2) Find the **reference angle**, the acute angle to the $x$-axis: in Q2 it is $\\pi-\\theta$, in Q3 it is $\\theta-\\pi$, in Q4 it is $2\\pi-\\theta$. (3) Write the value for the reference angle. (4) Attach the sign from ASTC. Negative angles go clockwise; angles larger than $2\\pi$ wrap around (subtract $2\\pi$)."},{"t":"ex","title":"Exact values outside the first quadrant (full working)","q":"Find the exact values of $\\sin\\frac{5\\pi}{6}$, $\\cos\\frac{7\\pi}{6}$ and $\\tan\\frac{5\\pi}{3}$.","s":["**$\\frac{5\\pi}6$:** this is between $\\frac\\pi2$ and $\\pi$, so it is in quadrant 2. Reference angle $\\pi-\\frac{5\\pi}6=\\frac\\pi6$. Sine is positive in Q2, so $\\sin\\frac{5\\pi}6=+\\sin\\frac\\pi6=\\frac12$.","**$\\frac{7\\pi}6$:** this is between $\\pi$ and $\\frac{3\\pi}2$, quadrant 3. Reference angle $\\frac{7\\pi}6-\\pi=\\frac\\pi6$. Cosine is negative in Q3, so $\\cos\\frac{7\\pi}6=-\\cos\\frac\\pi6=-\\frac{\\sqrt3}2$.","**$\\frac{5\\pi}3$:** between $\\frac{3\\pi}2$ and $2\\pi$, quadrant 4. Reference angle $2\\pi-\\frac{5\\pi}3=\\frac\\pi3$. Tangent is negative in Q4, so $\\tan\\frac{5\\pi}3=-\\tan\\frac\\pi3=-\\sqrt3$.","**Summary:** each time, find the quadrant, the reference angle, then the sign."],"a":"$\\tfrac12$, $-\\tfrac{\\sqrt3}{2}$, $-\\sqrt3$"},{"t":"ex","title":"Using the Pythagorean identity (full working)","q":"Given $\\sin\\theta=\\frac35$ and $\\frac\\pi2\u003c\\theta\u003c\\pi$, find the exact values of $\\cos\\theta$ and $\\tan\\theta$.","s":["**Use $\\sin^2\\theta+\\cos^2\\theta=1$:** $\\cos^2\\theta=1-\\left(\\frac35\\right)^2=1-\\frac9{25}=\\frac{16}{25}$.","**Take square roots:** $\\cos\\theta=\\pm\\frac45$.","**Choose the sign from the quadrant:** $\\theta$ is in quadrant 2, where cosine is negative, so $\\cos\\theta=-\\frac45$.","**Find tan:** $\\tan\\theta=\\dfrac{\\sin\\theta}{\\cos\\theta}=\\dfrac{3/5}{-4/5}=-\\dfrac34$."],"a":"$\\cos\\theta=-\\frac45$, $\\tan\\theta=-\\frac34$"},{"t":"key","x":"**Symmetry identities.** $\\sin(\\pi-\\theta)=\\sin\\theta$, $\\cos(\\pi-\\theta)=-\\cos\\theta$; $\\sin(\\pi+\\theta)=-\\sin\\theta$, $\\cos(\\pi+\\theta)=-\\cos\\theta$; $\\sin(-\\theta)=-\\sin\\theta$, $\\cos(-\\theta)=\\cos\\theta$; $\\sin\\left(\\frac\\pi2-\\theta\\right)=\\cos\\theta$, $\\cos\\left(\\frac\\pi2-\\theta\\right)=\\sin\\theta$."},{"t":"p","x":"**Arc length and sector area.** For angle $\\theta$ in radians in a circle of radius $r$: arc length $s=r\\theta$ and sector area $A=\\frac12r^2\\theta$. Both come from taking the fraction $\\frac{\\theta}{2\\pi}$ of the full circumference $2\\pi r$ or area $\\pi r^2$."},{"t":"ex","title":"Sector (full working)","q":"A sector has radius 6 cm and angle $\\frac{2\\pi}{3}$. Find the arc length and the area exactly, then the perimeter of the sector.","s":["**Arc length:** $s=r\\theta=6\\times\\frac{2\\pi}3=4\\pi$ cm.","**Area:** $A=\\frac12r^2\\theta=\\frac12\\times36\\times\\frac{2\\pi}3=12\\pi$ cm$^2$.","**Perimeter:** the boundary is the arc plus two radii: $4\\pi+6+6=4\\pi+12$ cm.","**Approximations:** $s\\approx12.57$ cm, $A\\approx37.70$ cm$^2$, perimeter $\\approx24.57$ cm."],"a":"$s=4\\pi$ cm, $A=12\\pi$ cm\u00b2, perimeter $4\\pi+12$ cm"},{"t":"ex","title":"Converting units (full working)","q":"Convert $225^\\circ$ to radians and $\\frac{7\\pi}{12}$ to degrees.","s":["**Degrees to radians:** $225\\times\\frac{\\pi}{180}=\\frac{225\\pi}{180}$.","**Simplify the fraction:** divide top and bottom by 45: $\\frac{5\\pi}{4}$.","**Radians to degrees:** $\\frac{7\\pi}{12}\\times\\frac{180}{\\pi}=\\frac{7\\times180}{12}$.","**Simplify:** $\\frac{1260}{12}=105^\\circ$."],"a":"$\\frac{5\\pi}{4}$ and $105^\\circ$"},{"t":"warn","x":"Calculator in the wrong mode is the most common lost mark in trig. If the question uses $\\pi$ or has no degree symbol, you must be in **radians**. Also, the reference angle is always measured to the **$x$-axis**, never the $y$-axis."},{"t":"p","x":"**Exam tip.** Draw a quick unit circle sketch with the angle marked. It takes ten seconds and prevents sign errors, and examiners can award method marks from it."},{"t":"tb","rec":"1,2,3,4,5,6,7,9,11","ext":"13,14,16,17,19","x":"Exercise 2.2 covers radian conversion, exact values and the unit circle, arc length and sector area.","code":"2.2"}],"checks":[{"topic":"Exact value","q":"Find the exact value of $\\cos\\frac{3\\pi}{4}$.","a":"-sqrt2/2","alt":["-\u221a2/2","-1/sqrt2","-(sqrt2)/2","-1/\u221a2"],"ad":"$-\\tfrac{\\sqrt2}{2}$","sol":"$\\frac{3\\pi}4$ lies between $\\frac\\pi2$ and $\\pi$, so it is in quadrant 2. || The reference angle is $\\pi-\\frac{3\\pi}4=\\frac\\pi4$. || $\\cos\\frac\\pi4=\\frac{\\sqrt2}2$. || Cosine is negative in quadrant 2, so $\\cos\\frac{3\\pi}4=-\\frac{\\sqrt2}2$.","h":["Which quadrant?","Reference angle $\\pi-\\theta$.","Cos is negative in Q2."]},{"topic":"Pythagorean identity","q":"If $\\cos\\theta=-\\frac{5}{13}$ and $\\pi\u003c\\theta\u003c\\frac{3\\pi}{2}$, find $\\sin\\theta$.","a":"-12/13","alt":["-(12/13)"],"ad":"$-\\tfrac{12}{13}$","sol":"Use $\\sin^2\\theta=1-\\cos^2\\theta=1-\\frac{25}{169}=\\frac{144}{169}$. || So $\\sin\\theta=\\pm\\frac{12}{13}$. || $\\theta$ is in quadrant 3, where sine is negative. || Therefore $\\sin\\theta=-\\frac{12}{13}$.","h":["Use $\\sin^2+\\cos^2=1$.","Square root gives $\\pm$.","Choose the sign for quadrant 3."]},{"topic":"Radians","q":"Convert $300^\\circ$ to radians exactly.","a":"5pi/3","alt":["5\u03c0/3","(5pi)/3"],"ad":"$\\dfrac{5\\pi}{3}$","sol":"Multiply by $\\frac{\\pi}{180}$: $300\\times\\frac{\\pi}{180}=\\frac{300\\pi}{180}$. || Divide top and bottom by 60. || This gives $\\frac{5\\pi}{3}$.","h":["Multiply by $\\frac{\\pi}{180}$.","Simplify the fraction.","Divide by 60."]},{"topic":"Sector area","q":"Find the exact area of a sector with radius 4 and angle $\\frac{5\\pi}{8}$.","a":"5pi","alt":["5\u03c0"],"ad":"$5\\pi$","sol":"Use $A=\\frac12r^2\\theta$. || Substitute: $A=\\frac12\\times16\\times\\frac{5\\pi}{8}$. || Simplify: $8\\times\\frac{5\\pi}{8}=5\\pi$. || The area is $5\\pi$ square units.","h":["Sector area formula.","$r^2=16$.","$\\frac12\\times16=8$."]},{"topic":"Symmetry","q":"If $\\sin\\theta=0.4$, find $\\sin(\\pi+\\theta)$ and $\\cos\\left(\\frac\\pi2-\\theta\\right)$.","a":"-0.4,0.4","alt":["-0.4 and 0.4","-2/5,2/5"],"ad":"$-0.4$ and $0.4$","sol":"Adding $\\pi$ moves the point to the opposite side of the circle, so both coordinates change sign: $\\sin(\\pi+\\theta)=-\\sin\\theta=-0.4$. || The complementary-angle identity says $\\cos\\left(\\frac\\pi2-\\theta\\right)=\\sin\\theta$. || So $\\cos\\left(\\frac\\pi2-\\theta\\right)=0.4$. || Answers: $-0.4$ and $0.4$.","h":["What does adding $\\pi$ do on the unit circle?","$\\sin(\\pi+\\theta)=-\\sin\\theta$.","$\\cos\\left(\\frac\\pi2-\\theta\\right)=\\sin\\theta$."]}]},{"id":"mm3-c02-s2","code":"2.3","title":"Trigonometric functions and their graphs","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: trigonometric graphs amplitude period","url":"https://www.youtube.com/results?search_query=Joel+Speranza+trigonometric+graphs+amplitude+period","kind":"search"}]},{"t":"p","x":"**What this topic is about.** Sketching transformed sine, cosine and tangent graphs, reading their features, and solving trig equations over a given domain. Both skills feed directly into modelling (2.5), where a real situation becomes a sine or cosine equation you must solve."},{"t":"key","x":"For $y=a\\sin\\big(b(x-c)\\big)+d$ (and similarly cosine): **amplitude** $|a|$; **period** $\\frac{2\\pi}{|b|}$; **horizontal shift** $c$ units right; **midline** $y=d$; **maximum** $d+|a|$; **minimum** $d-|a|$; **range** $[d-|a|,\\ d+|a|]$. For $y=a\\tan(b(x-c))+d$ the period is $\\frac{\\pi}{|b|}$ and there is no amplitude."},{"t":"p","x":"**Sketching in five key points.** Work out the period and split one period into four equal quarters, starting at $x=c$. A sine graph passes through: midline (start), maximum, midline, minimum, midline (end). A cosine graph passes through: maximum, midline, minimum, midline, maximum. If $a\u003c0$, swap maxima and minima. Plot these five points, join with a smooth wave, then extend or trim to the required domain and label intercepts and endpoints."},{"t":"ex","title":"Reading features (full working)","q":"For $y=3\\sin(2x)+1$, $0\\le x\\le2\\pi$, state the amplitude, period, range and the coordinates of the first maximum.","s":["**Amplitude:** $|a|=3$.","**Period:** $\\frac{2\\pi}{b}=\\frac{2\\pi}{2}=\\pi$.","**Range:** midline $y=1$, so from $1-3=-2$ to $1+3=4$: $[-2,4]$.","**First maximum:** $\\sin(2x)=1$ first when $2x=\\frac\\pi2$, i.e. $x=\\frac\\pi4$. Then $y=3(1)+1=4$.","**State:** the first maximum is $\\left(\\frac\\pi4,4\\right)$, and there are two full cycles on $[0,2\\pi]$."],"a":"Amplitude 3, period $\\pi$, range $[-2,4]$, first maximum $\\left(\\frac\\pi4,4\\right)$"},{"t":"p","x":"**Solving trig equations: the routine.** (1) Rearrange to isolate the trig function, e.g. $\\sin(\\ldots)=k$. (2) If the argument is $bx$ or $b(x-c)$, **transform the domain** first: if $0\\le x\\le2\\pi$ then $0\\le2x\\le4\\pi$. (3) Find the reference angle from the exact value (or inverse trig of $|k|$). (4) Use ASTC to find every angle in the transformed domain with the right sign. (5) Convert back by dividing by $b$ (and adding $c$). (6) Check the count: $\\sin$ and $\\cos$ give two solutions per period."},{"t":"ex","title":"Equation with a doubled argument (full working)","q":"Solve $2\\sin(2x)=\\sqrt3$ for $0\\le x\\le\\pi$.","s":["**Isolate:** $\\sin(2x)=\\frac{\\sqrt3}2$.","**Transform the domain:** if $0\\le x\\le\\pi$ then $0\\le2x\\le2\\pi$.","**Reference angle:** $\\sin\\theta=\\frac{\\sqrt3}2$ gives $\\theta=\\frac\\pi3$.","**Quadrants:** sine is positive in quadrants 1 and 2, so $2x=\\frac\\pi3$ or $2x=\\pi-\\frac\\pi3=\\frac{2\\pi}3$ (both inside $[0,2\\pi]$).","**Divide by 2:** $x=\\frac\\pi6$ or $x=\\frac\\pi3$.","**Check:** $2\\sin\\left(\\frac{\\pi}3\\right)=\\sqrt3$ \u2713 and $2\\sin\\left(\\frac{2\\pi}3\\right)=\\sqrt3$ \u2713."],"a":"$x=\\frac\\pi6,\\ \\frac\\pi3$"},{"t":"ex","title":"Equation with a shift (full working)","q":"Solve $\\sqrt2\\cos\\left(x-\\frac\\pi4\\right)=1$ for $0\\le x\\le2\\pi$.","s":["**Isolate:** $\\cos\\left(x-\\frac\\pi4\\right)=\\frac1{\\sqrt2}$.","**Transform the domain:** subtract $\\frac\\pi4$: $-\\frac\\pi4\\le x-\\frac\\pi4\\le\\frac{7\\pi}4$.","**Reference angle:** $\\cos\\theta=\\frac1{\\sqrt2}$ at $\\theta=\\frac\\pi4$; cosine is positive in Q1 and Q4.","**All angles in $\\left[-\\frac\\pi4,\\frac{7\\pi}4\\right]$:** $-\\frac\\pi4$, $\\frac\\pi4$, $\\frac{7\\pi}4$.","**Add $\\frac\\pi4$:** $x=0,\\ \\frac\\pi2,\\ 2\\pi$."],"a":"$x=0,\\ \\frac\\pi2,\\ 2\\pi$"},{"t":"ex","title":"Quadratic trig equation (full working)","q":"Solve $2\\sin^2x-\\sin x=0$ for $0\\le x\\le2\\pi$.","s":["**Factorise (do not divide by $\\sin x$, which loses solutions):** $\\sin x(2\\sin x-1)=0$.","**Case 1:** $\\sin x=0\\Rightarrow x=0,\\ \\pi,\\ 2\\pi$.","**Case 2:** $\\sin x=\\frac12\\Rightarrow$ reference angle $\\frac\\pi6$, positive in Q1 and Q2: $x=\\frac\\pi6,\\ \\frac{5\\pi}6$.","**Combine in order:** $x=0,\\frac\\pi6,\\frac{5\\pi}6,\\pi,2\\pi$."],"a":"$x=0,\\ \\frac\\pi6,\\ \\frac{5\\pi}6,\\ \\pi,\\ 2\\pi$"},{"t":"ex","title":"Rule from a graph (full working)","q":"A sinusoidal graph has a maximum of 5 at $x=\\frac\\pi6$, a minimum of $-1$, and period $\\pi$. Write a cosine rule for it.","s":["**Midline:** $d=\\frac{\\max+\\min}2=\\frac{5+(-1)}2=2$.","**Amplitude:** $a=\\frac{\\max-\\min}2=\\frac{6}2=3$.","**$b$ from the period:** $\\frac{2\\pi}{b}=\\pi\\Rightarrow b=2$.","**Shift:** a cosine graph starts at a maximum, and this one has its maximum at $x=\\frac\\pi6$, so shift right by $\\frac\\pi6$.","**Rule:** $y=3\\cos\\left(2\\left(x-\\frac\\pi6\\right)\\right)+2$. Check: at $x=\\frac\\pi6$, $y=3\\cos0+2=5$ \u2713."],"a":"$y=3\\cos\\left(2\\left(x-\\frac\\pi6\\right)\\right)+2$"},{"t":"warn","x":"Transform the domain **before** solving. For $\\sin(2x)$ on $0\\le x\\le\\pi$ you must search $0\\le2x\\le2\\pi$. Forgetting this loses half the solutions. Also inside a bracket, $\\sin(2x-\\frac\\pi3)=\\sin\\left(2\\left(x-\\frac\\pi6\\right)\\right)$: the shift is $\\frac\\pi6$, not $\\frac\\pi3$."},{"t":"p","x":"**Exam tip.** List all the solutions of the transformed angle first, then divide. Write them in ascending order, and state how many there are; markers check both."},{"t":"int","name":"trigfun","cap":"Change amplitude, period and shifts and see the equation and key features update."},{"t":"tb","rec":"1,3,6,8,10,12","ext":"13,15,16,17,19","x":"Exercise 2.3 covers graphs of $\\sin$, $\\cos$, $\\tan$ with transformations and solving equations on a domain.","code":"2.3"}],"checks":[{"topic":"Period and range","q":"For $y=4\\cos(3x)-2$, state the period and the range.","a":"2pi/3,[-6,2]","alt":["2\u03c0/3,[-6,2]","2pi/3 and [-6,2]","period 2pi/3, range [-6,2]"],"ad":"Period $\\frac{2\\pi}{3}$; range $[-6,2]$","sol":"Period: $\\frac{2\\pi}{b}=\\frac{2\\pi}{3}$. || The amplitude is 4 and the midline is $y=-2$. || Maximum $-2+4=2$; minimum $-2-4=-6$. || So the range is $[-6,2]$.","h":["Period is $\\frac{2\\pi}{b}$.","Midline is $y=d$.","Add and subtract the amplitude."]},{"topic":"Solve on a domain","q":"Solve $2\\cos x=-1$ for $0\\le x\\le2\\pi$.","a":"2pi/3,4pi/3","alt":["2\u03c0/3,4\u03c0/3","2pi/3 and 4pi/3","x=2pi/3,4pi/3"],"ad":"$x=\\frac{2\\pi}{3},\\ \\frac{4\\pi}{3}$","sol":"Isolate: $\\cos x=-\\frac12$. || Reference angle: $\\cos\\theta=\\frac12$ at $\\theta=\\frac\\pi3$. || Cosine is negative in quadrants 2 and 3: $x=\\pi-\\frac\\pi3=\\frac{2\\pi}3$ and $x=\\pi+\\frac\\pi3=\\frac{4\\pi}3$. || Both lie in $[0,2\\pi]$.","h":["Isolate $\\cos x$.","Reference angle $\\frac\\pi3$.","Cosine negative in Q2 and Q3."]},{"topic":"Doubled argument","q":"Solve $\\sin(2x)=\\frac12$ for $0\\le x\\le\\pi$.","a":"pi/12,5pi/12","alt":["\u03c0/12,5\u03c0/12","pi/12 and 5pi/12","x=pi/12,5pi/12"],"ad":"$x=\\frac{\\pi}{12},\\ \\frac{5\\pi}{12}$","sol":"Transform the domain: $0\\le2x\\le2\\pi$. || Reference angle $\\frac\\pi6$; sine positive in Q1 and Q2: $2x=\\frac\\pi6$ or $2x=\\frac{5\\pi}6$. || These are the only solutions in $[0,2\\pi]$. || Divide by 2: $x=\\frac\\pi{12}$ or $x=\\frac{5\\pi}{12}$.","h":["Change the domain to $0\\le2x\\le2\\pi$.","$\\sin\\theta=\\frac12$ at $\\frac\\pi6$ and $\\frac{5\\pi}6$.","Divide by 2."]},{"topic":"Tan equation","q":"Solve $\\tan x=-1$ for $0\\le x\\le2\\pi$.","a":"3pi/4,7pi/4","alt":["3\u03c0/4,7\u03c0/4","3pi/4 and 7pi/4"],"ad":"$x=\\frac{3\\pi}{4},\\ \\frac{7\\pi}{4}$","sol":"Reference angle: $\\tan\\theta=1$ at $\\theta=\\frac\\pi4$. || Tangent is negative in quadrants 2 and 4. || Q2: $\\pi-\\frac\\pi4=\\frac{3\\pi}4$; Q4: $2\\pi-\\frac\\pi4=\\frac{7\\pi}4$. || Solutions: $x=\\frac{3\\pi}4,\\frac{7\\pi}4$.","h":["Reference angle for $\\tan=1$.","Where is tan negative?","Use $\\pi-\\theta$ and $2\\pi-\\theta$."]},{"topic":"Rule from features","q":"A sine curve has maximum 9, minimum 1 and period $4\\pi$. Find $a$, $b$ and $d$ in $y=a\\sin(bx)+d$ (with $a,b>0$).","a":"a=4,b=1/2,d=5","alt":["4,1/2,5","a=4, b=0.5, d=5","4,0.5,5"],"ad":"$a=4,\\ b=\\frac12,\\ d=5$","sol":"Midline: $d=\\frac{9+1}2=5$. || Amplitude: $a=\\frac{9-1}2=4$. || Period $\\frac{2\\pi}b=4\\pi$, so $b=\\frac{2\\pi}{4\\pi}=\\frac12$. || So $y=4\\sin\\left(\\frac x2\\right)+5$.","h":["Average of max and min.","Half the difference.","Solve $\\frac{2\\pi}{b}=4\\pi$."]}]},{"id":"mm3-c02-s3","code":"2.4","title":"Differentiating trigonometric functions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: differentiating sin and cos","url":"https://www.youtube.com/results?search_query=Joel+Speranza+differentiating+sin+and+cos","kind":"search"},{"src":"B","title":"3Blue1Brown: Derivative formulas through geometry","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Derivative+formulas+through+geometry","kind":"search"}]},{"t":"p","x":"**What this topic is about.** The derivatives of sine, cosine and tangent, and how to combine them with the chain rule (and, briefly, the product rule) to find gradients, tangents, rates of change and stationary points of trig functions. These are essential for trig modelling, kinematics and optimisation later in the unit."},{"t":"key","x":"$$\\frac{d}{dx}\\sin x=\\cos x\\qquad\\frac{d}{dx}\\cos x=-\\sin x\\qquad\\frac{d}{dx}\\tan x=\\sec^2x=\\frac{1}{\\cos^2x}$$ With a linear inside: $\\frac{d}{dx}\\sin(ax+b)=a\\cos(ax+b)$, $\\frac{d}{dx}\\cos(ax+b)=-a\\sin(ax+b)$, $\\frac{d}{dx}\\tan(ax+b)=a\\sec^2(ax+b)$. In general $\\frac{d}{dx}\\sin f(x)=f'(x)\\cos f(x)$ and $\\frac{d}{dx}\\cos f(x)=-f'(x)\\sin f(x)$."},{"t":"p","x":"**Seeing why from the graphs.** Look at the graph of $y=\\sin x$ and estimate its gradient at key points. At $x=0$ it rises most steeply, gradient 1. At $x=\\frac\\pi2$ (the peak) the gradient is 0. At $x=\\pi$ it falls most steeply, gradient $-1$. At $\\frac{3\\pi}2$ (the trough) the gradient is 0 again. Plot those gradients and you get exactly the cosine curve. Doing the same with $\\cos x$ gives $-\\sin x$. This only works in radians, because only then is the gradient of $\\sin x$ at the origin exactly 1."},{"t":"p","x":"**The chain factor.** When the angle is not just $x$, multiply by the derivative of the angle. $\\frac{d}{dx}\\sin(3x)=3\\cos(3x)$; $\\frac{d}{dx}\\cos(x^2)=-2x\\sin(x^2)$; $\\frac{d}{dx}\\sin\\left(\\frac{\\pi t}{6}\\right)=\\frac\\pi6\\cos\\left(\\frac{\\pi t}6\\right)$. Forgetting this factor is the most common error in this topic."},{"t":"p","x":"**Powers of trig functions.** $\\sin^3x$ means $(\\sin x)^3$. Treat it as (something)$^3$: bring the power down, reduce it by one, then multiply by the derivative of the something. $\\frac{d}{dx}\\sin^3x=3\\sin^2x\\cos x$."},{"t":"ex","title":"Chain rule with trig (full working)","q":"Differentiate $y=3\\sin(4x)-\\cos(x^2)$.","s":["**Differentiate term by term.**","**First term, $3\\sin(4x)$:** the angle is $4x$ with derivative 4, and $\\sin$ differentiates to $\\cos$: $3\\times4\\cos(4x)=12\\cos(4x)$.","**Second term, $-\\cos(x^2)$:** the angle is $x^2$ with derivative $2x$, and $\\cos$ differentiates to $-\\sin$: $\\frac{d}{dx}\\cos(x^2)=-2x\\sin(x^2)$.","**Attach the minus sign in front of the second term:** $-(-2x\\sin(x^2))=+2x\\sin(x^2)$.","**Combine:** $\\dfrac{dy}{dx}=12\\cos(4x)+2x\\sin(x^2)$."],"a":"$12\\cos(4x)+2x\\sin(x^2)$"},{"t":"ex","title":"Tangent to a sine curve (full working)","q":"Find the exact equation of the tangent to $y=\\sin x$ at $x=\\frac\\pi3$.","s":["**Point:** $y=\\sin\\frac\\pi3=\\frac{\\sqrt3}2$, so the point is $\\left(\\frac\\pi3,\\frac{\\sqrt3}2\\right)$.","**Derivative:** $\\frac{dy}{dx}=\\cos x$.","**Gradient at the point:** $m=\\cos\\frac\\pi3=\\frac12$.","**Point-gradient form:** $y-\\frac{\\sqrt3}2=\\frac12\\left(x-\\frac\\pi3\\right)$.","**Rearrange to $y=mx+c$:** $y=\\frac12x-\\frac\\pi6+\\frac{\\sqrt3}2$."],"a":"$y=\\frac12x+\\frac{\\sqrt3}{2}-\\frac{\\pi}{6}$"},{"t":"ex","title":"Stationary points of a trig function (full working)","q":"Find the exact coordinates of the stationary points of $y=\\sin x+\\cos x$ for $0\\le x\\le2\\pi$, and their nature.","s":["**Differentiate:** $\\frac{dy}{dx}=\\cos x-\\sin x$.","**Set to zero:** $\\cos x=\\sin x$. Dividing by $\\cos x$ (it is not zero at these points) gives $\\tan x=1$.","**Solve on the domain:** tan is positive in Q1 and Q3, reference angle $\\frac\\pi4$: $x=\\frac\\pi4$ or $x=\\frac{5\\pi}4$.","**$y$-values:** $\\sin\\frac\\pi4+\\cos\\frac\\pi4=\\frac{\\sqrt2}2+\\frac{\\sqrt2}2=\\sqrt2$; $\\sin\\frac{5\\pi}4+\\cos\\frac{5\\pi}4=-\\frac{\\sqrt2}2-\\frac{\\sqrt2}2=-\\sqrt2$.","**Nature with the second derivative:** $y''=-\\sin x-\\cos x=-y$. At $x=\\frac\\pi4$, $y''=-\\sqrt2\u003c0$: maximum. At $x=\\frac{5\\pi}4$, $y''=\\sqrt2>0$: minimum."],"a":"Maximum $\\left(\\frac\\pi4,\\sqrt2\\right)$, minimum $\\left(\\frac{5\\pi}4,-\\sqrt2\\right)$"},{"t":"ex","title":"Worded problem: rate of change of a tide (full working)","q":"Water depth is $D=3+1.5\\sin\\left(\\frac{\\pi t}6\\right)$ m, $t$ hours after midnight. Find how fast the tide is rising at 2 am and at what time it is falling fastest in the first 12 hours.","s":["**Rate of change means $\\frac{dD}{dt}$:** $\\dfrac{dD}{dt}=1.5\\times\\dfrac\\pi6\\cos\\left(\\dfrac{\\pi t}6\\right)=\\dfrac\\pi4\\cos\\left(\\dfrac{\\pi t}6\\right)$.","**At 2 am, $t=2$:** $\\dfrac\\pi4\\cos\\dfrac\\pi3=\\dfrac\\pi4\\times\\dfrac12=\\dfrac\\pi8\\approx0.39$ m/h.","**Interpret:** positive, so the tide is rising at about 0.39 m per hour.","**Falling fastest means $\\frac{dD}{dt}$ is most negative:** this happens when $\\cos\\left(\\frac{\\pi t}6\\right)=-1$.","**Solve:** $\\frac{\\pi t}6=\\pi\\Rightarrow t=6$, i.e. 6 am, when the rate is $-\\frac\\pi4\\approx-0.79$ m/h."],"a":"Rising at $\\frac{\\pi}{8}\\approx0.39$ m/h at 2 am; falling fastest at 6 am ($0.79$ m/h)"},{"t":"warn","x":"$\\frac{d}{dx}\\cos x=-\\sin x$: do not lose the negative. And $\\frac{d}{dx}\\sin(x^2)=2x\\cos(x^2)$, not $\\cos(x^2)$ and not $\\cos(2x)$. The derivative of the angle multiplies the outside."},{"t":"p","x":"**Exam tip.** Check radians: these rules are false in degrees. For tangent lines, give exact answers using $\\pi$ and surds unless told to round."},{"t":"tb","rec":"1,2,4,5,6,9,11,12","ext":"14,15,17,19","x":"Exercise 2.4 differentiates $\\sin$, $\\cos$, $\\tan$ with the chain rule, then finds tangents, normals and stationary points.","code":"2.4"}],"checks":[{"topic":"Derivative","q":"Differentiate $y=2\\cos(3x)$.","a":"-6sin(3x)","alt":["-6sin3x"],"ad":"$-6\\sin(3x)$","sol":"The angle is $3x$, whose derivative is 3. || $\\cos$ differentiates to $-\\sin$. || So $\\frac{d}{dx}\\cos(3x)=-3\\sin(3x)$. || Multiply by the 2: $\\frac{dy}{dx}=-6\\sin(3x)$.","h":["Derivative of $\\cos$ is $-\\sin$.","Multiply by the derivative of $3x$.","Keep the 2."]},{"topic":"Chain rule","q":"Differentiate $y=\\sin(x^2+1)$.","a":"2xcos(x^2+1)","alt":["2x cos(x^2+1)"],"ad":"$2x\\cos(x^2+1)$","sol":"The angle is $x^2+1$, with derivative $2x$. || $\\sin$ differentiates to $\\cos$, keeping the same angle. || Multiply by the derivative of the angle. || So $\\frac{dy}{dx}=2x\\cos(x^2+1)$.","h":["Identify the angle.","Its derivative is $2x$.","$\\frac{d}{dx}\\sin f=f'\\cos f$."]},{"topic":"Gradient","q":"Find the gradient of $y=\\cos(2x)$ at $x=\\frac{\\pi}{4}$.","a":"-2","alt":["m=-2"],"ad":"$-2$","sol":"Differentiate: $\\frac{dy}{dx}=-2\\sin(2x)$. || Substitute $x=\\frac\\pi4$: $-2\\sin\\left(\\frac\\pi2\\right)$. || $\\sin\\frac\\pi2=1$. || So the gradient is $-2$.","h":["Differentiate with the chain factor 2.","Substitute $x=\\frac\\pi4$.","$\\sin\\frac\\pi2=1$."]},{"topic":"Tan derivative","q":"Differentiate $y=\\tan(5x)$.","a":"5sec^2(5x)","alt":["5/cos^2(5x)","5sec\u00b2(5x)"],"ad":"$5\\sec^2(5x)$","sol":"$\\frac{d}{dx}\\tan u=\\sec^2u\\times u'$. || Here $u=5x$, so $u'=5$. || Multiply: $5\\sec^2(5x)$. || Equivalently $\\frac{5}{\\cos^2(5x)}$.","h":["Derivative of $\\tan$ is $\\sec^2$.","Inside derivative is 5.","Multiply."]},{"topic":"Stationary point","q":"Find the first positive $x$ where $y=2\\sin x+x$ has a stationary point. Give an exact value.","a":"2pi/3","alt":["2\u03c0/3","x=2pi/3"],"ad":"$x=\\dfrac{2\\pi}{3}$","sol":"Differentiate: $\\frac{dy}{dx}=2\\cos x+1$. || Set to zero: $\\cos x=-\\frac12$. || Reference angle $\\frac\\pi3$; cosine is negative in Q2 and Q3, so the first positive solution is $x=\\pi-\\frac\\pi3$. || That is $x=\\frac{2\\pi}{3}$.","h":["Differentiate each term.","Solve $\\cos x=-\\frac12$.","The first solution is in quadrant 2."]}]},{"id":"mm3-c02-s4","code":"2.5","title":"Modelling with trigonometric functions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: trigonometric modelling tides","url":"https://www.youtube.com/results?search_query=Joel+Speranza+trigonometric+modelling+tides","kind":"search"}]},{"t":"p","x":"**What this topic is about.** Using sine and cosine to model things that repeat: tides, daylight hours, temperature over a day, Ferris wheels, springs and sound. You build the model from information, use it to answer \"when\" and \"how high\" questions, and use its derivative for rates of change."},{"t":"key","x":"**Building $y=a\\sin(b(t-c))+d$ or $y=a\\cos(b(t-c))+d$ from information:** midline $d=\\dfrac{\\max+\\min}{2}$; amplitude $a=\\dfrac{\\max-\\min}{2}$; $b=\\dfrac{2\\pi}{\\text{period}}$; shift $c$ chosen to match a known point."},{"t":"p","x":"**Choosing sine or cosine to avoid shifts.** Starts at the **top** (high tide at $t=0$): use $+\\cos$. Starts at the **bottom** (boarding a Ferris wheel at its lowest point): use $-\\cos$. Starts at the **middle going up**: use $+\\sin$. Starts at the middle going down: use $-\\sin$. If the known point is not at $t=0$, shift by the time at which that feature occurs."},{"t":"p","x":"**Typical questions and how to answer them.** \"Maximum / minimum value\": $d\\pm|a|$. \"When is it first at its maximum\": solve the trig function $=1$ (or $-1$). \"When is it above a level\": solve the equality, then decide which intervals are above using a sketch. \"Rate of change\": differentiate and substitute; it is largest in size where the graph crosses the midline and zero at maxima and minima."},{"t":"ex","title":"Building a tide model (full working)","q":"Water depth varies between 2 m and 6 m, with high tide at $t=0$ and a period of 12 hours. Find a model and the first time the depth is 5 m.","s":["**Midline:** $d=\\frac{2+6}2=4$.","**Amplitude:** $a=\\frac{6-2}2=2$.","**$b$:** $b=\\frac{2\\pi}{12}=\\frac\\pi6$.","**Choose cosine:** high tide (maximum) at $t=0$ means $+\\cos$ with no shift: $D=2\\cos\\left(\\frac{\\pi t}6\\right)+4$.","**Set $D=5$:** $2\\cos\\left(\\frac{\\pi t}6\\right)+4=5\\Rightarrow\\cos\\left(\\frac{\\pi t}6\\right)=\\frac12$.","**Solve for the first positive time:** $\\frac{\\pi t}6=\\frac\\pi3\\Rightarrow t=2$."],"a":"$D=2\\cos\\left(\\frac{\\pi t}{6}\\right)+4$; first at 5 m after 2 hours"},{"t":"ex","title":"Ferris wheel (full working)","q":"A Ferris wheel of radius 10 m has its lowest point 2 m above the ground and turns once every 40 s. You board at the lowest point. Find the height model and how long you are above 17 m during one turn.","s":["**Midline:** the centre is $2+10=12$ m high, so $d=12$. **Amplitude:** $a=10$. **$b$:** $\\frac{2\\pi}{40}=\\frac\\pi{20}$.","**Start at the bottom:** use $-\\cos$: $h=12-10\\cos\\left(\\frac{\\pi t}{20}\\right)$.","**Set $h=17$:** $-10\\cos\\left(\\frac{\\pi t}{20}\\right)=5\\Rightarrow\\cos\\left(\\frac{\\pi t}{20}\\right)=-\\frac12$.","**Solve in one turn** ($0\\le\\frac{\\pi t}{20}\\le2\\pi$): $\\frac{\\pi t}{20}=\\frac{2\\pi}3$ or $\\frac{4\\pi}3$, so $t=\\frac{40}3\\approx13.3$ s or $t=\\frac{80}3\\approx26.7$ s.","**Interpret:** you are above 17 m between these times (the top of the ride is in the middle), for $\\frac{80}3-\\frac{40}3=\\frac{40}3\\approx13.3$ s."],"a":"$h=12-10\\cos\\left(\\frac{\\pi t}{20}\\right)$; above 17 m for about $13.3$ s per turn"},{"t":"ex","title":"Daylight model with a shift (full working)","q":"A town's daylight varies from 10 h (minimum on day 172) to 14 h, with period 365 days. Write a cosine model and find the daylight on day 80.","s":["**Midline and amplitude:** $d=12$, $a=2$. **$b$:** $\\frac{2\\pi}{365}$.","**The minimum occurs at $t=172$:** a $-\\cos$ graph has its minimum at the start, so shift it right by 172.","**Model:** $L(t)=12-2\\cos\\left(\\frac{2\\pi}{365}(t-172)\\right)$.","**Day 80:** $L(80)=12-2\\cos\\left(\\frac{2\\pi(80-172)}{365}\\right)=12-2\\cos(-1.5837)$.","**Evaluate:** $\\cos(-1.5837)\\approx-0.0129$, so $L\\approx12+0.026\\approx12.03$ h."],"a":"$L(t)=12-2\\cos\\left(\\frac{2\\pi}{365}(t-172)\\right)$; about 12.0 hours on day 80"},{"t":"ex","title":"Rate of change in a model (full working)","q":"The temperature on a summer day is $T=24-6\\cos\\left(\\frac{\\pi(t-4)}{12}\\right)$ \u00b0C, $t$ hours after midnight. Find the maximum temperature and when it occurs, and the rate of change at 10 am.","s":["**Maximum:** when $\\cos(\\ldots)=-1$, $T=24+6=30$\u00b0C.","**When:** $\\frac{\\pi(t-4)}{12}=\\pi\\Rightarrow t-4=12\\Rightarrow t=16$, i.e. 4 pm.","**Differentiate:** $\\frac{dT}{dt}=-6\\times\\left(-\\frac\\pi{12}\\right)\\sin\\left(\\frac{\\pi(t-4)}{12}\\right)=\\frac\\pi2\\sin\\left(\\frac{\\pi(t-4)}{12}\\right)$.","**At 10 am, $t=10$:** $\\frac\\pi2\\sin\\left(\\frac{6\\pi}{12}\\right)=\\frac\\pi2\\sin\\frac\\pi2=\\frac\\pi2\\approx1.57$ \u00b0C/h.","**Interpret:** at 10 am the temperature is rising at its fastest rate, about 1.57\u00b0C per hour (10 am is when the curve crosses its midline going up)."],"a":"Maximum 30\u00b0C at 4 pm; rising at $\\frac{\\pi}{2}\\approx1.57$ \u00b0C/h at 10 am"},{"t":"warn","x":"State the meaning of $t=0$ and the units of the answer. \"$t=13.3$\" is incomplete; \"13.3 seconds after boarding\" earns the communication mark."},{"t":"p","x":"**Exam tip.** In \"evaluate the model\" questions, comment on whether the assumptions are realistic: real tides are not perfectly sinusoidal, and daylight periods are exactly a year but temperatures vary with weather."},{"t":"tb","rec":"1,2,4,6,8,9,12","ext":"13,15,17,20","x":"Exercise 2.5 is context modelling: tides, temperature, Ferris wheels and rates of change.","code":"2.5"}],"checks":[{"topic":"Build a model","q":"Depth has max 5 m, min 1 m, period 12 h, and is at its maximum at $t=0$. Write the model.","a":"D=2cos(pi t/6)+3","alt":["2cos(pit/6)+3","D=2cos((pi/6)t)+3","2cos(\u03c0t/6)+3","3+2cos(pi t/6)"],"ad":"$D=2\\cos\\left(\\frac{\\pi t}{6}\\right)+3$","sol":"Midline $d=\\frac{5+1}2=3$. || Amplitude $a=\\frac{5-1}2=2$. || $b=\\frac{2\\pi}{12}=\\frac\\pi6$. || Maximum at $t=0$ means $+\\cos$ with no shift: $D=2\\cos\\left(\\frac{\\pi t}6\\right)+3$.","h":["Average of max and min.","Half the difference.","A maximum at the start suggests cosine."]},{"topic":"Ferris wheel height","q":"$h=17-15\\cos\\left(\\frac{\\pi t}{30}\\right)$. Find the height at $t=20$ s.","a":"24.5","alt":["24.5 m"],"ad":"$24.5$ m","sol":"Substitute $t=20$: $h=17-15\\cos\\left(\\frac{20\\pi}{30}\\right)=17-15\\cos\\left(\\frac{2\\pi}3\\right)$. || $\\cos\\frac{2\\pi}3=-\\frac12$ (quadrant 2, reference $\\frac\\pi3$). || So $h=17-15\\left(-\\frac12\\right)=17+7.5$. || $h=24.5$ m.","h":["Substitute $t=20$.","Simplify the angle to $\\frac{2\\pi}{3}$.","$\\cos\\frac{2\\pi}3=-\\frac12$."]},{"topic":"When first","q":"For $T=20-5\\cos\\left(\\frac{\\pi t}{12}\\right)$, find when $T$ is first 22.5.","a":"8","alt":["t=8"],"ad":"$t=8$","sol":"Set $20-5\\cos\\left(\\frac{\\pi t}{12}\\right)=22.5$. || Rearrange: $\\cos\\left(\\frac{\\pi t}{12}\\right)=-\\frac12$. || The first positive angle with cosine $-\\frac12$ is $\\frac{2\\pi}3$, so $\\frac{\\pi t}{12}=\\frac{2\\pi}3$. || Solve: $t=8$.","h":["Isolate the cosine.","Find the first angle with $\\cos=-\\frac12$.","Multiply by $\\frac{12}{\\pi}$."]},{"topic":"Rate","q":"For $D=3+2\\sin\\left(\\frac{\\pi t}{6}\\right)$, find $\\frac{dD}{dt}$ at $t=0$ exactly.","a":"pi/3","alt":["\u03c0/3"],"ad":"$\\dfrac{\\pi}{3}$","sol":"Differentiate: $\\frac{dD}{dt}=2\\times\\frac\\pi6\\cos\\left(\\frac{\\pi t}6\\right)=\\frac\\pi3\\cos\\left(\\frac{\\pi t}6\\right)$. || Substitute $t=0$: $\\frac\\pi3\\cos0$. || $\\cos0=1$. || So the rate is $\\frac\\pi3\\approx1.05$ units per hour.","h":["Use the chain factor $\\frac\\pi6$.","Substitute $t=0$.","$\\cos0=1$."]},{"topic":"Max and when","q":"For $h=12-10\\cos\\left(\\frac{\\pi t}{20}\\right)$, find the maximum height and the first time it occurs.","a":"22,20","alt":["22 at t=20","22 and 20","h=22,t=20"],"ad":"Maximum 22 m at $t=20$ s","sol":"The maximum happens when $\\cos\\left(\\frac{\\pi t}{20}\\right)=-1$. || Then $h=12-10(-1)=22$. || $\\frac{\\pi t}{20}=\\pi$ first at $t=20$. || So the maximum height is 22 m, first reached at $t=20$ s.","h":["Which value of cos makes $h$ largest?","$\\cos=-1$ first at angle $\\pi$.","Solve for $t$."]}]},{"id":"mm3-c02-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Exam toolkit for trig.** Radians first: check the mode before any calculation. Exact values must be exact; do not leave $0.866$ when $\\frac{\\sqrt3}{2}$ is asked. Show the quadrant reasoning in equations, and transform the domain before solving any equation with $bx$ inside."},{"t":"p","x":"**Solving routine.** (1) Isolate the trig function. (2) Transform the domain. (3) Reference angle. (4) All quadrants with the right sign. (5) Undo the transformation. (6) Check the number of solutions."},{"t":"p","x":"**Modelling routine.** Max and min give the midline and amplitude; the time between peaks gives the period; a known feature chooses sine or cosine and the shift. Check by substituting a known point. Differentiate for rates, and interpret signs and units."},{"t":"ex","title":"Exam-style: maximum of a combined wave (full working)","q":"Find the maximum value of $f(x)=3\\sin x+4\\cos x$ for $0\\le x\\le\\frac\\pi2$ using calculus.","s":["**Differentiate:** $f'(x)=3\\cos x-4\\sin x$.","**Set to zero:** $3\\cos x=4\\sin x\\Rightarrow\\tan x=\\frac34$.","**Find sin and cos from a right triangle:** opposite 3, adjacent 4, hypotenuse 5, so $\\sin x=\\frac35$, $\\cos x=\\frac45$ (both positive in Q1).","**Evaluate:** $f=3\\left(\\frac35\\right)+4\\left(\\frac45\\right)=\\frac95+\\frac{16}5=5$.","**Check endpoints:** $f(0)=4$, $f\\left(\\frac\\pi2\\right)=3$, both less than 5, so the maximum is 5 at $x=\\tan^{-1}\\frac34\\approx0.644$."],"a":"Maximum value 5"},{"t":"ex","title":"Exam-style: equation from a model (full working)","q":"The height of a spring-mounted mass is $y=10+3\\sin(2\\pi t)$ cm. Find all times in the first second when the height is 11.5 cm, and the velocity at the first of these.","s":["**Set up:** $10+3\\sin(2\\pi t)=11.5\\Rightarrow\\sin(2\\pi t)=\\frac12$.","**Domain:** $0\\le t\\le1$ means $0\\le2\\pi t\\le2\\pi$.","**Solve:** $2\\pi t=\\frac\\pi6$ or $\\frac{5\\pi}6$, so $t=\\frac1{12}$ or $t=\\frac5{12}$ s.","**Velocity:** $\\frac{dy}{dt}=6\\pi\\cos(2\\pi t)$. At $t=\\frac1{12}$: $6\\pi\\cos\\frac\\pi6=6\\pi\\times\\frac{\\sqrt3}2=3\\sqrt3\\pi\\approx16.3$ cm/s."],"a":"$t=\\frac{1}{12}$ s and $\\frac{5}{12}$ s; velocity $3\\sqrt3\\pi\\approx16.3$ cm/s upward"},{"t":"warn","x":"Frequent errors: degrees mode; forgetting the negative in $\\frac{d}{dx}\\cos x$; missing solutions when the argument is $2x$; writing $\\sin^2x$ as $\\sin x^2$ (they are different)."}],"checks":[{"topic":"Combined maximum","q":"Find the maximum value of $y=\\sin x+\\sqrt3\\cos x$ for $0\\le x\\le\\frac{\\pi}{2}$.","a":"2","alt":[],"ad":"$2$","sol":"Differentiate: $y'=\\cos x-\\sqrt3\\sin x$. || Set to zero: $\\tan x=\\frac{1}{\\sqrt3}$, so $x=\\frac\\pi6$. || Evaluate: $\\sin\\frac\\pi6+\\sqrt3\\cos\\frac\\pi6=\\frac12+\\sqrt3\\cdot\\frac{\\sqrt3}2=\\frac12+\\frac32=2$. || The endpoints give $\\sqrt3\\approx1.73$ and $1$, so the maximum is 2.","h":["Differentiate and set to zero.","$\\tan x=\\frac1{\\sqrt3}$.","Evaluate at $x=\\frac\\pi6$."]},{"topic":"Exact value","q":"Evaluate $\\sin\\frac{7\\pi}{6}+\\cos\\frac{5\\pi}{3}$ exactly.","a":"0","alt":[],"ad":"$0$","sol":"$\\frac{7\\pi}6$ is in Q3 with reference $\\frac\\pi6$; sine is negative there, so $\\sin\\frac{7\\pi}6=-\\frac12$. || $\\frac{5\\pi}3$ is in Q4 with reference $\\frac\\pi3$; cosine is positive there, so $\\cos\\frac{5\\pi}3=\\frac12$. || Add: $-\\frac12+\\frac12$. || The value is 0.","h":["Find each quadrant.","Reference angles $\\frac\\pi6$ and $\\frac\\pi3$.","Apply ASTC signs."]},{"topic":"Times","q":"Solve $10+3\\sin(2\\pi t)=8.5$ for $0\\le t\\le1$.","a":"7/12,11/12","alt":["7/12 and 11/12","t=7/12,11/12"],"ad":"$t=\\frac{7}{12},\\ \\frac{11}{12}$","sol":"Isolate: $\\sin(2\\pi t)=-\\frac12$. || Domain: $0\\le2\\pi t\\le2\\pi$. || Sine is negative in Q3 and Q4 with reference $\\frac\\pi6$: $2\\pi t=\\frac{7\\pi}6$ or $\\frac{11\\pi}6$. || Divide by $2\\pi$: $t=\\frac7{12}$ or $t=\\frac{11}{12}$.","h":["Isolate the sine.","Negative sine: Q3 and Q4.","Divide by $2\\pi$."]},{"topic":"Velocity","q":"For $y=10+3\\sin(2\\pi t)$, find the velocity when $t=\\frac12$.","a":"-6pi","alt":["-6\u03c0","-18.85"],"ad":"$-6\\pi\\approx-18.8$ cm/s","sol":"Velocity is $\\frac{dy}{dt}=3\\times2\\pi\\cos(2\\pi t)=6\\pi\\cos(2\\pi t)$. || Substitute $t=\\frac12$: $6\\pi\\cos\\pi$. || $\\cos\\pi=-1$. || So the velocity is $-6\\pi\\approx-18.8$ cm/s (moving down).","h":["Differentiate with the chain factor $2\\pi$.","Substitute $t=\\frac12$.","$\\cos\\pi=-1$."]},{"topic":"Stationary points","q":"How many stationary points does $y=\\sin(2x)$ have for $0\\le x\\le2\\pi$?","a":"4","alt":[],"ad":"$4$","sol":"Differentiate: $y'=2\\cos(2x)$. || Set to zero: $\\cos(2x)=0$ with $0\\le2x\\le4\\pi$. || Solutions: $2x=\\frac\\pi2,\\frac{3\\pi}2,\\frac{5\\pi}2,\\frac{7\\pi}2$. || So $x=\\frac\\pi4,\\frac{3\\pi}4,\\frac{5\\pi}4,\\frac{7\\pi}4$: four stationary points.","h":["Differentiate.","Transform the domain to $[0,4\\pi]$.","Count the solutions of $\\cos\\theta=0$."]}]}],"quiz":[{"topic":"Radians","q":"Convert $150^\\circ$ to radians. Give an exact answer.","a":"5pi/6","alt":["(5pi)/6","5\u03c0/6","5/6pi"],"ad":"$\\dfrac{5\\pi}{6}$","sol":"Convert degrees to radians by multiplying by $\\frac{\\pi}{180}$: $150\\times\\frac{\\pi}{180}=\\frac{150\\pi}{180}$. || Simplify the fraction by dividing top and bottom by 30. || $\\frac{150}{180}=\\frac56$. || So $150^\\circ=\\frac{5\\pi}{6}$.","h":["Multiply by $\\frac{\\pi}{180}$.","Simplify $\\frac{150}{180}$.","$\\frac{150}{180}=\\frac56$."]},{"topic":"Exact value","q":"Find the exact value of $\\cos\\frac{2\\pi}{3}$.","a":"-1/2","alt":["-0.5","-(1/2)"],"ad":"$-\\tfrac12$","sol":"$\\frac{2\\pi}{3}$ is between $\\frac\\pi2$ and $\\pi$, so it is in quadrant 2. || The reference angle is $\\pi-\\frac{2\\pi}3=\\frac\\pi3$, and $\\cos\\frac\\pi3=\\frac12$. || Cosine is negative in quadrant 2. || So $\\cos\\frac{2\\pi}3=-\\frac12$.","h":["Find the reference angle.","Which quadrant is $\\frac{2\\pi}3$ in?","Cosine is negative in quadrant 2."]},{"topic":"Amplitude and period","q":"State the period of $y=4\\cos(3x)-2$ as an exact value.","a":"2pi/3","alt":["(2pi)/3","2\u03c0/3"],"ad":"$\\dfrac{2\\pi}{3}$","sol":"For $y=a\\cos(bx)+d$ the period is $\\frac{2\\pi}{b}$. || Here $b=3$. || So the period is $\\frac{2\\pi}{3}$. || The graph repeats every $\\frac{2\\pi}3$ units.","h":["Period formula.","$b=3$.","Divide $2\\pi$ by 3."]},{"topic":"Range","q":"State the maximum value of $y=4\\cos(3x)-2$.","a":"2","alt":["y=2","max=2"],"ad":"$2$","sol":"The midline is $y=d=-2$ and the amplitude is $|a|=4$. || The maximum is midline plus amplitude. || $-2+4=2$. || So the maximum value is 2.","h":["Midline is $y=-2$.","Amplitude is 4.","Add them."]},{"topic":"Derivative","q":"Differentiate $y=\\sin(5x)$.","a":"5cos(5x)","alt":["5cos5x"],"ad":"$5\\cos(5x)$","sol":"The angle is $5x$, whose derivative is 5. || $\\sin$ differentiates to $\\cos$ with the same angle. || Multiply by the derivative of the angle. || So $\\frac{dy}{dx}=5\\cos(5x)$.","h":["Identify the inside.","Derivative of sin is cos.","Multiply by 5."]},{"topic":"Derivative","q":"Differentiate $y=\\cos(x^2)$.","a":"-2xsin(x^2)","alt":["-2x sin(x^2)","-2xsin(x\u00b2)"],"ad":"$-2x\\sin(x^2)$","sol":"The angle is $x^2$, whose derivative is $2x$. || $\\cos$ differentiates to $-\\sin$ with the same angle. || Multiply by $2x$. || So $\\frac{dy}{dx}=-2x\\sin(x^2)$.","h":["Cosine differentiates to negative sine.","Inside is $x^2$.","Multiply by $2x$."]},{"topic":"Solve","q":"Solve $2\\cos x=1$ for $0\\le x\\le 2\\pi$. List the solutions separated by commas, in order.","a":"pi/3,5pi/3","alt":["pi/3 and 5pi/3","\u03c0/3,5\u03c0/3","x=pi/3,5pi/3"],"ad":"$x=\\frac\\pi3,\\ \\frac{5\\pi}{3}$","sol":"Isolate: $\\cos x=\\frac12$. || The reference angle is $\\frac\\pi3$ (since $\\cos\\frac\\pi3=\\frac12$). || Cosine is positive in quadrants 1 and 4: $x=\\frac\\pi3$ and $x=2\\pi-\\frac\\pi3=\\frac{5\\pi}3$. || Both are in $[0,2\\pi]$: $x=\\frac\\pi3,\\frac{5\\pi}3$.","h":["Isolate $\\cos x$.","Reference angle is $\\frac\\pi3$.","The second solution is $2\\pi-\\frac\\pi3$."]},{"topic":"Identity","q":"If $\\cos\\theta=\\frac{5}{13}$ and $\\theta$ is in quadrant 4, find $\\sin\\theta$.","a":"-12/13","alt":["-(12/13)"],"ad":"$-\\tfrac{12}{13}$","sol":"Use $\\sin^2\\theta=1-\\cos^2\\theta=1-\\frac{25}{169}=\\frac{144}{169}$. || So $\\sin\\theta=\\pm\\frac{12}{13}$. || In quadrant 4, sine (the $y$-coordinate) is negative. || So $\\sin\\theta=-\\frac{12}{13}$.","h":["Use $\\sin^2+\\cos^2=1$.","$\\sin^2\\theta=\\frac{144}{169}$.","Check the sign for quadrant 4."]},{"topic":"Model","q":"A model is $T=8\\sin\\left(\\frac{\\pi t}{12}\\right)+20$. Find the maximum temperature.","a":"28","alt":["28 degrees","T=28"],"ad":"$28$","sol":"The midline is 20 and the amplitude is 8. || The maximum occurs when $\\sin\\left(\\frac{\\pi t}{12}\\right)=1$. || Then $T=8(1)+20$. || Maximum temperature $=28$.","h":["Midline is 20.","Amplitude is 8.","Add them."]},{"topic":"Stationary","q":"Find the first positive $x$ with $\\frac{d}{dx}\\sin x=0$. Give an exact value.","a":"pi/2","alt":["\u03c0/2","x=pi/2"],"ad":"$\\dfrac\\pi2$","sol":"$\\frac{d}{dx}\\sin x=\\cos x$. || Set $\\cos x=0$. || Cosine is zero at $x=\\frac\\pi2,\\frac{3\\pi}2,\\dots$. || The first positive solution is $x=\\frac\\pi2$.","h":["Differentiate.","Set $\\cos x=0$.","Smallest positive solution."]},{"topic":"Sector","q":"Find the arc length of a sector with radius $5$ and angle $\\frac{3\\pi}{5}$.","a":"3pi","alt":["3\u03c0"],"ad":"$3\\pi$","sol":"Arc length in radians is $s=r\\theta$. || Substitute $r=5$, $\\theta=\\frac{3\\pi}5$: $s=5\\times\\frac{3\\pi}{5}$. || The 5s cancel. || $s=3\\pi$ units.","h":["$s=r\\theta$.","Substitute.","Cancel the 5."]},{"topic":"Symmetry","q":"If $\\cos\\theta=\\frac13$, find $\\cos(\\pi-\\theta)$.","a":"-1/3","alt":[],"ad":"$-\\tfrac13$","sol":"Use the symmetry identity $\\cos(\\pi-\\theta)=-\\cos\\theta$ (reflecting across the $y$-axis changes the sign of the $x$-coordinate). || Substitute $\\cos\\theta=\\frac13$. || $\\cos(\\pi-\\theta)=-\\frac13$. || So the answer is $-\\frac13$.","h":["Symmetry identity.","Negative.","Substitute."]},{"topic":"Model","q":"A curve has max $7$ and min $1$. Find its midline value $d$.","a":"4","alt":[],"ad":"$4$","sol":"The midline sits halfway between the maximum and minimum. || $d=\\frac{\\max+\\min}{2}$. || $d=\\frac{7+1}{2}=\\frac82$. || $d=4$.","h":["Average of max and min.","$8\\div2$.","Compute."]},{"topic":"Tan","q":"Solve $\\tan x=\\sqrt3$ for $0\\le x\\le\\pi$.","a":"pi/3","alt":["\u03c0/3"],"ad":"$x=\\frac\\pi3$","sol":"$\\tan\\frac\\pi3=\\sqrt3$, so the reference angle is $\\frac\\pi3$. || Tangent is positive in quadrants 1 and 3, giving $\\frac\\pi3$ and $\\frac{4\\pi}3$. || The domain is $0\\le x\\le\\pi$, so $\\frac{4\\pi}3$ is outside it. || The only solution is $x=\\frac\\pi3$.","h":["$\\tan\\frac\\pi3=\\sqrt3$.","Period is $\\pi$.","Check the domain."]},{"topic":"Trig quadratic","q":"Solve $2\\cos^2x=\\cos x$ for $0\\le x\\le\\frac\\pi2$.","a":"pi/3,pi/2","alt":["pi/3 and pi/2","\u03c0/3,\u03c0/2","x=pi/3,pi/2"],"ad":"$x=\\frac\\pi3,\\ \\frac\\pi2$","sol":"Rearrange and factorise (do not divide by $\\cos x$): $2\\cos^2x-\\cos x=0\\Rightarrow\\cos x(2\\cos x-1)=0$. || Case 1: $\\cos x=0$ gives $x=\\frac\\pi2$ in $\\left[0,\\frac\\pi2\\right]$. || Case 2: $\\cos x=\\frac12$ gives $x=\\frac\\pi3$. || Solutions in order: $x=\\frac\\pi3,\\frac\\pi2$.","h":["Factorise.","Two cases.","Check the domain."]},{"topic":"Derivative","q":"Differentiate $y=x\\cos x$.","a":"cosx-xsinx","alt":["cos(x)-xsin(x)","cos x - x sin x"],"ad":"$\\cos x-x\\sin x$","sol":"This is a product $u\\cdot v$ with $u=x$ and $v=\\cos x$. || $u'=1$ and $v'=-\\sin x$. || Product rule: $u'v+uv'=1\\cdot\\cos x+x(-\\sin x)$. || So $\\frac{dy}{dx}=\\cos x-x\\sin x$.","h":["Product rule.","$u=x$, $v=\\cos x$.","Combine."]},{"topic":"Derivative","q":"Differentiate $y=\\tan(2x)$.","a":"2sec^2(2x)","alt":["2/cos^2(2x)"],"ad":"$2\\sec^2(2x)$","sol":"$\\frac{d}{dx}\\tan u=u'\\sec^2u$. || Here $u=2x$ and $u'=2$. || Multiply: $2\\sec^2(2x)$. || Equivalently $\\frac{2}{\\cos^2(2x)}$.","h":["Inside is $2x$.","Derivative of $\\tan$.","Multiply by 2."]},{"topic":"Ferris wheel","q":"$h=12-10\\cos\\left(\\frac{\\pi t}{20}\\right)$. Find $h$ when $t=20$.","a":"22","alt":[],"ad":"$22$","sol":"Substitute $t=20$: $h=12-10\\cos\\left(\\frac{20\\pi}{20}\\right)=12-10\\cos\\pi$. || $\\cos\\pi=-1$. || So $h=12-10(-1)=12+10$. || $h=22$.","h":["$\\frac{\\pi\\cdot20}{20}=\\pi$.","$\\cos\\pi=-1$.","Compute."]},{"topic":"Gradient","q":"Find the gradient of $y=\\sin(2x)$ at $x=0$.","a":"2","alt":[],"ad":"$2$","sol":"Differentiate: $\\frac{dy}{dx}=2\\cos(2x)$ (chain factor 2). || Substitute $x=0$: $2\\cos0$. || $\\cos0=1$. || The gradient is 2.","h":["Chain rule.","$2\\cos2x$.","$\\cos0=1$."]},{"topic":"Max value","q":"Maximum of $y=5\\cos x+12$?","a":"17","alt":[],"ad":"$17$","sol":"The amplitude is 5 and the midline is 12. || The maximum occurs when $\\cos x=1$. || $y=5(1)+12$. || Maximum $=17$.","h":["Amplitude 5.","Midline 12.","Add."]}],"comets":[{"topic":"Extension: Maximum of a sum","q":"Show that the greatest value of $y=\\sin x+\\cos x$ is $\\sqrt{2}$, by evaluating it at the stationary point $x=\\frac\\pi4$. Enter the value at $x=\\frac\\pi4$ as an exact number.","a":"sqrt2","alt":["sqrt(2)","\u221a2","2^(1/2)"],"ad":"$\\sqrt2$","sol":"Differentiate: $y'=\\cos x-\\sin x$, which is zero when $\\tan x=1$, i.e. $x=\\frac\\pi4$. || Evaluate: $\\sin\\frac\\pi4+\\cos\\frac\\pi4=\\frac{\\sqrt2}2+\\frac{\\sqrt2}2$. || Add: $\\sqrt2$. || The second derivative $-\\sin x-\\cos x=-\\sqrt2\u003c0$ there, confirming it is the maximum, $\\sqrt2$.","h":["Substitute $x=\\frac\\pi4$.","Both exact values equal $\\frac{\\sqrt2}{2}$.","Add."]},{"topic":"Extension: Where is the tide rising fastest?","q":"For $D=2\\cos\\left(\\frac{\\pi t}6\\right)+4$ on $0\\le t\\le12$, find the greatest rate of change of $D$ (a positive number, in m/h). Give it exactly.","a":"pi/3","alt":["\u03c0/3","(pi)/3"],"ad":"$\\dfrac\\pi3$","sol":"Differentiate: $D'=2\\times\\left(-\\frac\\pi6\\right)\\sin\\left(\\frac{\\pi t}6\\right)=-\\frac\\pi3\\sin\\left(\\frac{\\pi t}6\\right)$. || The rate is greatest (most positive) when $\\sin\\left(\\frac{\\pi t}6\\right)=-1$. || Then $D'=-\\frac\\pi3(-1)=\\frac\\pi3$. || This happens at $t=9$ hours, when the water is rising fastest.","h":["Differentiate $D$.","The largest $|\\sin|$ is 1.","Read off the coefficient."]},{"topic":"Extension: Maximum of a combined wave","q":"For $f(x)=3\\sin x+4\\cos x$, the maximum value over all $x$ is?","a":"5","alt":[],"ad":"$5$","sol":"Differentiate: $f'(x)=3\\cos x-4\\sin x=0\\Rightarrow\\tan x=\\frac34$. || With $\\tan x=\\frac34$ in quadrant 1, a 3-4-5 triangle gives $\\sin x=\\frac35$, $\\cos x=\\frac45$. || $f=3\\cdot\\frac35+4\\cdot\\frac45=\\frac{9+16}5=5$. || (In general $a\\sin x+b\\cos x$ has maximum $\\sqrt{a^2+b^2}=\\sqrt{9+16}=5$.)","h":["Find the stationary point.","$\\tan x=\\frac34$.","Use the 3-4-5 triangle."]}],"cards":[{"type":"def","topic":"The unit circle and radians","f":"Convert between degrees and radians.","b":"Radians $=$ degrees $\\times\\frac{\\pi}{180}$. Degrees $=$ radians $\\times\\frac{180}{\\pi}$. $\\pi$ rad $=180^\\circ$."},{"type":"def","topic":"The unit circle and radians","f":"Which trig ratios are positive in each quadrant (ASTC)?","b":"Q1 All, Q2 Sin, Q3 Tan, Q4 Cos."},{"type":"def","topic":"The unit circle and radians","f":"Exact values of $\\sin$, $\\cos$, $\\tan$ at $\\frac\\pi6$.","b":"$\\sin\\frac\\pi6=\\frac12$, $\\cos\\frac\\pi6=\\frac{\\sqrt3}2$, $\\tan\\frac\\pi6=\\frac1{\\sqrt3}=\\frac{\\sqrt3}3$."},{"type":"def","topic":"The unit circle and radians","f":"Exact values at $\\frac\\pi4$.","b":"$\\sin\\frac\\pi4=\\cos\\frac\\pi4=\\frac{\\sqrt2}2$, $\\tan\\frac\\pi4=1$."},{"type":"def","topic":"The unit circle and radians","f":"Arc length and sector area for angle $\\theta$ in radians.","b":"$s=r\\theta$ and $A=\\frac12r^2\\theta$."},{"type":"def","topic":"Trigonometric functions and their graphs","f":"Period of $y=a\\sin(bx)$ and of $y=\\tan(bx)$?","b":"Sine and cosine: $\\frac{2\\pi}{b}$. Tangent: $\\frac{\\pi}{b}$."},{"type":"def","topic":"Trigonometric functions and their graphs","f":"For $y=a\\cos(b(x-c))+d$, what are the max and min?","b":"Max $=d+|a|$, min $=d-|a|$. The midline is $y=d$."},{"type":"def","topic":"Differentiating trigonometric functions","f":"Derivatives of $\\sin(ax)$, $\\cos(ax)$, $\\tan(ax)$.","b":"$a\\cos(ax)$, $-a\\sin(ax)$, $a\\sec^2(ax)$."},{"type":"def","topic":"Differentiating trigonometric functions","f":"Why must you use radians when differentiating trig functions?","b":"The rule $\\frac{d}{dx}\\sin x=\\cos x$ is only true in radians. In degrees an extra factor $\\frac{\\pi}{180}$ appears."},{"type":"word","topic":"Modelling with trigonometric functions","f":"Tide: max 5 m at 3 am, min 1 m at 9 am. Write a model with $t$ in hours after midnight.","b":"Midline 3, amplitude 2, period 12 h so $b=\\frac\\pi6$. Max at $t=3$: $D=3+2\\cos\\left(\\frac\\pi6(t-3)\\right)$."},{"type":"word","topic":"Modelling with trigonometric functions","f":"A Ferris wheel of diameter 30 m, lowest point 2 m, one turn per 60 s, you board at the bottom. Height model?","b":"$h=17-15\\cos\\left(\\frac{\\pi t}{30}\\right)$."},{"type":"word","topic":"Modelling with trigonometric functions","f":"$T=20-5\\cos\\left(\\frac{\\pi t}{12}\\right)$ (\u00b0C, $t$ hours). When is it warmest and how warm?","b":"When $\\cos=-1$: $\\frac{\\pi t}{12}=\\pi$, $t=12$ (midday). $T=25$\u00b0C."},{"type":"word","topic":"Modelling with trigonometric functions","f":"When is $D=3+2\\sin\\left(\\frac{\\pi t}{6}\\right)$ changing fastest?","b":"When $D'=\\frac\\pi3\\cos\\left(\\frac{\\pi t}6\\right)$ is largest in size: at $t=0,6,12$ (the midline crossings). Rate $\\frac\\pi3\\approx1.05$ m/h."}],"hours":4},"mm3-c03":{"id":"mm3-c03","interactive":"tangent","summary":"Three rules (chain, product, quotient) let you differentiate almost any function you will meet. This chapter drills each rule, shows how to combine them, and applies them to tangents, normals, kinematics and optimisation.","videos":[{"src":"B","title":"Visualizing the chain rule and product rule (3Blue1Brown, ch. 4)","url":"https://www.youtube.com/watch?v=YG15m2VwSjA","kind":"video"},{"src":"J","title":"Chain rule","url":"https://www.youtube.com/results?search_query=Joel+Speranza+chain+rule+differentiation","kind":"search"},{"src":"J","title":"Product rule","url":"https://www.youtube.com/results?search_query=Joel+Speranza+product+rule+differentiation","kind":"search"},{"src":"J","title":"Quotient rule","url":"https://www.youtube.com/results?search_query=Joel+Speranza+quotient+rule+differentiation","kind":"search"}],"sections":[{"id":"mm3-c03-s1","code":"3.2","title":"The chain rule","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: chain rule","url":"https://www.youtube.com/results?search_query=Joel+Speranza+chain+rule","kind":"search"},{"src":"B","title":"3Blue1Brown: Visualizing the chain rule and product rule","url":"https://www.youtube.com/watch?v=YG15m2VwSjA","kind":"video"}]},{"t":"p","x":"**What this topic is about.** The chain rule differentiates a **function of a function** (a composite), such as $(3x^2+1)^5$, $\\sqrt{2x-1}$, $e^{\\sin x}$ or $\\ln(\\cos x)$. It is the single most-used rule in calculus: almost every exam derivative uses it somewhere, often combined with the product or quotient rule."},{"t":"key","x":"$$\\text{If } y=f(u) \\text{ and } u=g(x),\\quad\\frac{dy}{dx}=\\frac{dy}{du}\\times\\frac{du}{dx}\\qquad\\text{equivalently}\\qquad\\big[f(g(x))\\big]'=f'\\big(g(x)\\big)\\,g'(x)$$"},{"t":"p","x":"**In words.** Differentiate the outside function, leaving the inside exactly as it is, then multiply by the derivative of the inside. Say it out loud while you work: \"derivative of the outside, inside left alone, times derivative of the inside\"."},{"t":"p","x":"**How to identify the inside and outside.** Imagine calculating the value for a particular $x$. The operation you do **last** is the outside. For $\\sqrt{1+e^{2x}}$ you would calculate $1+e^{2x}$ first and take the square root last, so the outside is the square root and the inside is $1+e^{2x}$. For $\\sin^3x=(\\sin x)^3$ you find $\\sin x$ first and cube it last, so the outside is the cube."},{"t":"p","x":"**Why it works.** Rates multiply. If $y$ changes 5 times as fast as $u$, and $u$ changes 3 times as fast as $x$, then $y$ changes $5\\times3=15$ times as fast as $x$. Leibniz notation makes this look like fractions cancelling: $\\frac{dy}{du}\\cdot\\frac{du}{dx}=\\frac{dy}{dx}$."},{"t":"key","x":"**Common special cases:** $\\frac{d}{dx}(ax+b)^n=na(ax+b)^{n-1}$; $\\frac{d}{dx}\\big(f(x)\\big)^n=n\\big(f(x)\\big)^{n-1}f'(x)$; $\\frac{d}{dx}\\sqrt{f(x)}=\\frac{f'(x)}{2\\sqrt{f(x)}}$; $\\frac{d}{dx}e^{f(x)}=f'(x)e^{f(x)}$; $\\frac{d}{dx}\\ln f(x)=\\frac{f'(x)}{f(x)}$; $\\frac{d}{dx}\\sin f(x)=f'(x)\\cos f(x)$."},{"t":"ex","title":"Chain rule with a power (full working)","q":"Differentiate $y=(3x^2+1)^5$.","s":["**Identify the parts:** outside is $(\\ \\ )^5$; inside is $u=3x^2+1$.","**Rewrite:** $y=u^5$.","**Differentiate each part:** $\\dfrac{dy}{du}=5u^4$ and $\\dfrac{du}{dx}=6x$.","**Multiply:** $\\dfrac{dy}{dx}=5u^4\\times6x=30xu^4$.","**Substitute back for $u$:** $\\dfrac{dy}{dx}=30x(3x^2+1)^4$."],"a":"$30x(3x^2+1)^4$"},{"t":"ex","title":"Chain rule with a root (full working)","q":"Differentiate $y=\\sqrt{2x-1}$ and find the gradient at $x=5$.","s":["**Write the root as a power:** $y=(2x-1)^{1/2}$.","**Outside:** bring the power down and reduce it by 1: $\\frac12(2x-1)^{-1/2}$.","**Inside derivative:** $\\frac{d}{dx}(2x-1)=2$.","**Multiply:** $\\frac{dy}{dx}=\\frac12(2x-1)^{-1/2}\\times2=(2x-1)^{-1/2}=\\dfrac{1}{\\sqrt{2x-1}}$.","**Gradient at $x=5$:** $\\dfrac1{\\sqrt{9}}=\\dfrac13$."],"a":"$\\dfrac{dy}{dx}=\\dfrac{1}{\\sqrt{2x-1}}$; gradient $\\frac13$ at $x=5$"},{"t":"ex","title":"Chain rule applied twice (full working)","q":"Differentiate $y=\\sqrt{1+e^{2x}}$.","s":["**Outside layer:** square root, so write $y=(1+e^{2x})^{1/2}$ and differentiate the outside: $\\frac12(1+e^{2x})^{-1/2}$.","**Middle layer:** the inside is $1+e^{2x}$; its derivative needs the chain rule again: $\\frac{d}{dx}e^{2x}=2e^{2x}$.","**Multiply:** $\\dfrac{dy}{dx}=\\dfrac12(1+e^{2x})^{-1/2}\\times2e^{2x}$.","**Simplify:** the $\\frac12$ and 2 cancel: $\\dfrac{dy}{dx}=\\dfrac{e^{2x}}{\\sqrt{1+e^{2x}}}$."],"a":"$\\dfrac{e^{2x}}{\\sqrt{1+e^{2x}}}$"},{"t":"ex","title":"Powers of trig functions (full working)","q":"Differentiate $y=\\sin^3(2x)$.","s":["**Rewrite to see the layers:** $y=\\big(\\sin(2x)\\big)^3$. There are three layers: cube, sine, and $2x$.","**Outside (cube):** $3\\big(\\sin(2x)\\big)^2$.","**Middle (sine):** $\\frac{d}{dx}\\sin(2x)=\\cos(2x)\\times2$ (with the derivative of $2x$).","**Multiply all factors:** $3\\sin^2(2x)\\times2\\cos(2x)$.","**Simplify:** $6\\sin^2(2x)\\cos(2x)$."],"a":"$6\\sin^2(2x)\\cos(2x)$"},{"t":"ex","title":"Worded problem: related rates (full working)","q":"A circular oil spill has radius $r=2\\sqrt t$ m after $t$ minutes. Use the chain rule to find how fast its area is growing at $t=4$.","s":["**Write the area in terms of $r$:** $A=\\pi r^2$, so $\\dfrac{dA}{dr}=2\\pi r$.","**Rate of change of $r$:** $r=2t^{1/2}\\Rightarrow\\dfrac{dr}{dt}=t^{-1/2}=\\dfrac1{\\sqrt t}$.","**Chain rule:** $\\dfrac{dA}{dt}=\\dfrac{dA}{dr}\\times\\dfrac{dr}{dt}=2\\pi r\\times\\dfrac{1}{\\sqrt t}$.","**At $t=4$:** $r=2\\sqrt4=4$, so $\\dfrac{dA}{dt}=2\\pi(4)\\times\\dfrac12=4\\pi$.","**Interpret:** the area is growing at $4\\pi\\approx12.6$ m$^2$ per minute."],"a":"$4\\pi\\approx12.6$ m\u00b2 per minute"},{"t":"warn","x":"The number-one chain rule error is forgetting to multiply by the derivative of the inside. After every derivative ask \"did I multiply by $u'$?\". Second most common: changing the inside, e.g. writing $5(6x)^4$ instead of $5(3x^2+1)^4$."},{"t":"p","x":"**Exam tip.** For \"show that\" questions, write the substitution $u=\\ldots$, $\\frac{du}{dx}=\\ldots$, $\\frac{dy}{du}=\\ldots$ on separate lines. It makes your method visible even if an arithmetic slip happens later."},{"t":"tb","rec":"1,3,4,7,12","ext":"12,16,17,20","x":"Exercise 3.2 practises chain rule with powers, roots, exponentials, logs and trig, including nested compositions.","code":"3.2"}],"checks":[{"topic":"Power chain","q":"Differentiate $y=(2x^3-5)^4$.","a":"24x^2(2x^3-5)^3","alt":["24x\u00b2(2x\u00b3-5)\u00b3"],"ad":"$24x^2(2x^3-5)^3$","sol":"Let $u=2x^3-5$, so $y=u^4$. || $\\frac{dy}{du}=4u^3$ and $\\frac{du}{dx}=6x^2$. || Multiply: $4u^3\\times6x^2=24x^2u^3$. || Substitute back: $\\frac{dy}{dx}=24x^2(2x^3-5)^3$.","h":["Identify the inside.","Differe
