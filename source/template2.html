<style id="app-style">
:root{
  /* Layout: full-bleed night-sky canvas with a floating top bar, a bottom chip rail and a right-hand drawer for lessons. */
  --bg:#060a14; --panel:#0d1526; --panel2:#142040; --ink:#e9edf7; --mute:#aab5cd; --line:#2e4170;
  --gold:#d9b878; --new:#5d6882; --learn:#8fa8c8; --revise:#c9a86a; --solid:#86bfa6; --risk:#c98585;
  --display:'Unbounded','Trebuchet MS',system-ui,sans-serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
button{font:inherit;color:inherit}
#shell{position:relative;height:100%;overflow:hidden}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#bar{position:absolute;top:0;left:0;right:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;padding:14px 20px;pointer-events:none}
#bar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe2a8,var(--gold) 55%,#b36a12);box-shadow:0 0 14px 2px #ffb45488}
h1{font:700 12px var(--display);letter-spacing:.16em;text-transform:uppercase;margin:0}
#crumbs{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px}
#crumbs .here{color:var(--ink);font-weight:500}
#crumbs .cue{color:var(--mute);font-size:13px}
.crumb{background:none;border:0;padding:2px 0;color:var(--gold);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
#units{display:flex;gap:6px}
#units button{border:1px solid var(--line);background:rgba(13,21,38,.8);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:500;font-size:13px}
#units button small{margin-left:8px;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
#units button[aria-selected="true"]{border-color:var(--gold);background:#2a1f0c}
#insightsBtn{border:1px solid var(--line);background:rgba(13,21,38,.8);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:500;font-size:13px}
#insightsBtn[aria-pressed="true"]{border-color:var(--gold);background:#2a1f0c}
#streak{font-size:13px;color:var(--mute)}
#streak b{color:var(--gold);font-variant-numeric:tabular-nums}
#legend{list-style:none;display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 0 auto;padding:0;font-size:12px;color:var(--mute)}
#legend li{display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.sw.ring{background:none;border:2px solid var(--c)}
.sw.dash{background:none;border:2px dashed var(--c)}
#chips{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 16px 14px;overflow-x:auto;scrollbar-width:thin}
.chip{flex:none;display:flex;gap:8px;align-items:center;max-width:250px;padding:7px 13px;border:1px solid var(--line);background:rgba(13,21,38,.88);border-radius:999px;font-size:13px;font-weight:500;cursor:pointer}
.chip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-current="true"]{border-color:var(--gold)}
.chip.add{border-style:dashed;color:var(--mute)}
.chip:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#panel{position:absolute;top:92px;right:16px;bottom:64px;width:min(500px,calc(100% - 32px));background:rgba(13,21,38,.95);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:18px 20px 24px;overflow:auto;transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .3s}
#panel.open{transform:none;opacity:1;pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;font-size:18px;line-height:1}
.eyebrow{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
#panel h2{font:700 17px/1.3 var(--display);margin:6px 0 12px;text-wrap:balance}
.pill{display:inline-flex;align-items:center;gap:7px;padding:3px 11px;border-radius:999px;border:1px solid var(--c);font-size:12px;font-weight:700;color:var(--c)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}
.stats div{background:var(--panel2);border-radius:12px;padding:10px 12px}
.stats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btn{border:1px solid var(--gold);background:var(--gold);color:#1b1204;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.link{border:0;background:none;color:var(--mute);padding:4px 2px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.btn[disabled]{opacity:.5;cursor:default}
.sub{font-size:13px;color:var(--mute);margin:6px 0}
.muted{color:var(--mute);font-size:14px}
.lesson p,.lesson li{margin:.5em 0}
.lesson h4{font:700 13px var(--display);margin:1.4em 0 .4em;color:var(--gold);letter-spacing:.04em}
.lesson ul{padding-left:1.2em;margin:.4em 0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;background:#0a1224;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.qhead{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.tag{border:1px solid var(--line);border-radius:999px;padding:1px 9px;text-transform:none;letter-spacing:0}
.qtext{white-space:pre-wrap;background:var(--panel2);border-radius:12px;padding:14px;margin:10px 0;font-size:16px}
textarea,input[type=text]{width:100%;background:#09101f;border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:10px 12px;font:inherit}
textarea{min-height:64px;resize:vertical}
.fb{border-radius:12px;padding:10px 14px;margin:10px 0;border:1px solid var(--line);background:var(--panel2)}
.fb.ok{border-color:var(--solid)}
.fb.no{border-color:var(--risk)}
.hint{border-left:3px solid var(--learn);padding:4px 12px;margin:8px 0;background:#0e1a33;border-radius:0 8px 8px 0}
.sol{border-left:3px solid var(--solid);padding:6px 12px;margin:8px 0;white-space:pre-wrap;background:#0d2220;border-radius:0 8px 8px 0}
.res{display:grid;gap:6px;margin:10px 0}
.res div{display:flex;justify-content:space-between;gap:10px;background:var(--panel2);border-radius:10px;padding:8px 12px;font-size:14px}
.big{font:700 34px var(--display);margin:6px 0}
.wk{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;cursor:pointer}
.wk b{display:block;font-size:14px}
.wk span{font-size:12px;color:var(--mute)}
.wk .n{flex:none;font:700 16px var(--display);color:var(--gold)}
.wk .cw{color:var(--risk)}
.qa{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp .9s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:absolute;left:50%;top:70px;transform:translate(-50%,-20px);background:var(--panel2);border:1px solid var(--gold);border-radius:12px;padding:9px 16px;font-size:14px;opacity:0;pointer-events:none;transition:all .4s;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:759px){
  #bar{padding:10px 12px}
  #legend{margin-left:0}
  #panel{top:auto;left:8px;right:8px;width:auto;bottom:56px;max-height:70%;transform:translateY(calc(100% + 80px))}
}
@media (prefers-reduced-motion:reduce){#panel,#toast{transition:none}.spin{animation:none}}

#lvl{font-size:13px;color:var(--mute)}#lvl b{color:var(--gold)}
.tabs{display:flex;gap:6px;margin:14px 0 10px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:500;font-size:13px}.tabs button[aria-selected="true"]{border-color:var(--gold);background:#2a1f0c}
.prog{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:8px 0 2px}.prog i{display:block;height:100%;background:var(--solid)}
.sumbox{background:var(--panel2);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:14px}
.secnav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.sc{border:1px solid var(--line);background:none;border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer}.sc.cur{border-color:var(--gold);color:var(--gold)}.sc.ok{border-color:var(--solid)}
.sech{font:700 15px/1.3 var(--display);margin:10px 0 4px}
.key{background:#241a08;border:1px solid #5a4116;border-radius:12px;padding:10px 14px;margin:10px 0;overflow-x:auto}
.warn{border-left:3px solid var(--risk);background:#2a1315;border-radius:0 10px 10px 0;padding:8px 12px;margin:10px 0;font-size:14px}
.ex{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:12px 0}.exh{color:var(--gold);font-size:13px}.exq{margin:6px 0}.steps{margin:6px 0 6px 1.1em;padding:0}.steps li{margin:.35em 0}.exa{border-top:1px dashed var(--line);margin-top:8px;padding-top:6px}
.tb{background:#0d2220;border:1px solid #1f5a4d;border-radius:12px;padding:10px 14px;margin:12px 0}.tb p{margin:.4em 0;font-size:14px}.tbl{font-size:14px;margin:3px 0}.tbl span{display:inline-block;min-width:96px;color:var(--solid);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tbrow{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline;background:var(--panel2);border-radius:10px;padding:7px 12px;margin:5px 0;font-size:13px}.tbrow b{min-width:64px}.tbrow span{color:var(--mute)}
.vid{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:6px 0}.vid:hover{border-color:var(--gold)}.vid b{display:block;font-size:14px}.vid em{font-style:normal;font-size:12px;color:var(--mute)}.vi{flex:none;width:30px;height:30px;border-radius:50%;background:#2a1f0c;color:var(--gold);display:grid;place-items:center}
.wg{background:#0a1224;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:12px 0}.wgt{font-size:13px;color:var(--gold)}.wg>svg{width:100%;height:auto;background:#060c1a;border-radius:10px;display:block}.ctl{display:grid;gap:4px;margin:8px 0}.ctl label{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px;font-size:12px;color:var(--mute)}.ctl input{width:100%;accent-color:#ffb454}.wgr{font-size:13px;margin:4px 0 0;min-height:2.6em}
.lvlbar{position:relative;background:var(--panel2);border-radius:12px;padding:10px 12px;overflow:hidden;display:flex;justify-content:space-between;gap:10px;font-size:13px}.lvlbar *{position:relative;z-index:1}.lvlbar i{position:absolute;left:0;top:0;bottom:0;background:#3b2a0a;z-index:0}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.badge{border:1px dashed var(--line);border-radius:12px;padding:8px 10px;opacity:.55}.badge.on{border:1px solid var(--gold);opacity:1;background:#241a08}.badge b{display:block;font-size:13px}.badge span{font-size:11px;color:var(--mute)}
mjx-container{color:inherit}mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;max-width:100%;margin:.6em 0!important}

/* design pass 2 */
.pillbtn{border:1px solid var(--line);background:rgba(13,21,38,.85);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:500;font-size:13px}
.pillbtn:hover{border-color:var(--gold)}
#legBtn{margin-left:auto;width:30px;height:30px;padding:0;font-weight:700}
#legend{display:none;position:absolute;top:56px;right:20px;flex-direction:column;gap:9px;margin:0;padding:14px 18px;background:rgba(13,21,38,.97);border:1px solid var(--line);border-radius:14px;z-index:8;font-size:13px;color:var(--ink)}
#legend.open{display:flex}
#lvl{display:none}
#streak{border:1px solid var(--line);background:rgba(13,21,38,.85);border-radius:999px;padding:5px 14px;cursor:pointer;color:var(--ink)}
#streak:hover{border-color:var(--gold)}
#showpanel{position:absolute;right:16px;top:70px;z-index:5}
#panel.hid{transform:translateX(112%);opacity:0;pointer-events:none}
#panel.wide{left:16px;right:16px;width:auto}
#panel.wide{padding-left:max(24px,calc((100% - 880px)/2));padding-right:max(24px,calc((100% - 880px)/2))}
#panel.wide .lesson{font-size:17.5px;line-height:1.7}
.lesson{font-size:16px;line-height:1.65}
.pbtns{display:flex;gap:6px;flex:none}
#chlist{position:absolute;top:58px;left:16px;width:min(380px,calc(100% - 32px));max-height:calc(100% - 150px);overflow:auto;background:rgba(13,21,38,.97);border:1px solid var(--line);border-radius:16px;padding:8px;z-index:7}
.chr,.cp{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px;cursor:pointer}
.chr:hover,.chr[aria-current="true"],.cp:hover{background:var(--panel2)}
.chr b{display:block;font-size:14px}.chr small{display:block;color:var(--mute);font-size:12px;margin:2px 0 5px}
.chr .dot,.cp .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c);margin-top:6px}
.mini{display:block;height:5px;background:var(--panel2);border-radius:9px;overflow:hidden}.mini i{display:block;height:100%;background:var(--solid)}
.cp{align-items:center;padding:6px 8px}.cpn{flex:1;font-size:13px}.cp .mini{width:90px;flex:none}.cp b{font-size:12px;width:34px;text-align:right;color:var(--mute)}.cp .dot{margin-top:0}
#today{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);z-index:4}
.tdc{display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:290px;max-width:380px;background:rgba(13,21,38,.9);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:14px 18px}
.tdc b{font-size:15px}.tdc span{font-size:13px;color:var(--mute)}.tdc .btn{margin-top:8px;padding:8px 18px}
.secnav{position:sticky;top:-18px;z-index:3;background:rgba(13,21,38,.97);padding:8px 0;margin:6px 0}
.sc em{display:none;font-style:normal;margin-left:6px;color:var(--mute)}#panel.wide .sc em{display:inline}
.sc{padding:4px 10px}
.bd{font-style:normal;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:8px;border:1px solid var(--line)}
.bd.direct{color:var(--solid);border-color:var(--solid)}.bd.srch{color:var(--mute)}
.wg>svg{max-height:440px}
.pre{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}.btn.sm{padding:4px 10px;font-size:12px;border-radius:9px}
.fb.ok::before{content:'✓';display:inline-block;margin-right:8px;font-weight:700;color:var(--solid)}
.fb.no::before{content:'✕';display:inline-block;margin-right:8px;font-weight:700;color:var(--risk)}
.clock{font:700 13px var(--display);color:var(--gold);margin-bottom:6px}.clock.low{color:var(--risk)}
.tmr{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--mute);margin:10px 0}.tmr input{margin-top:4px}
.heat{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;gap:3px;overflow-x:auto;margin:6px 0;padding-bottom:4px}
.hc{width:11px;height:11px;border-radius:3px;background:#17223d;display:block}.hc.pad{background:none}.hc.l1{background:#2a4a47}.hc.l2{background:#3e7567}.hc.l3{background:#5aa38a}.hc.l4{background:#86bfa6}
#panel{counter-reset:wk}.wk::before{counter-increment:wk;content:counter(wk);flex:none;width:22px;height:22px;border-radius:50%;background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;font-size:12px;margin-right:10px}
.wk{align-items:center}
@media (max-width:759px){#legBtn{display:none}}
</style>

<div id="shell">
  <canvas id="sky" aria-label="Study map. Planets are chapters; use the list at the bottom to pick one with a keyboard."></canvas>
  <header id="bar">
    <div class="brand"><span class="mark"></span><h1>Study Galaxy</h1></div>
    <nav id="crumbs" aria-label="Where you are"></nav>
    <div id="units" role="tablist" aria-label="Unit"></div>
    <button id="insightsBtn" data-insights="1" aria-pressed="false">Progress and weak spots</button>
    <span id="streak"></span><span id="lvl"></span>
<button id="legBtn" class="pillbtn" aria-expanded="false" aria-controls="legend" title="Colour key" aria-label="Colour key">?</button>
    <ul id="legend" aria-label="Colour key">
      <li><span class="sw" style="--c:var(--new)"></span>Not started</li>
      <li><span class="sw" style="--c:var(--learn)"></span>Learning</li>
      <li><span class="sw" style="--c:var(--revise)"></span>Needs revision</li>
      <li><span class="sw" style="--c:var(--solid)"></span>Solid</li>
      <li><span class="sw ring" style="--c:var(--revise)"></span>Due for review</li>
      <li><span class="sw dash" style="--c:var(--risk)"></span>Confident but wrong</li>
      <li><span class="sw" style="--c:#e8edff;width:5px;height:5px"></span>Moon = section understood</li>
      <li><span class="sw" style="--c:var(--gold);width:12px;height:4px;border-radius:2px"></span>Comet = extension caught</li>
    </ul>
  </header>
  <div id="chips" role="list"></div>
  <div id="chlist" hidden></div>
  <div id="today"></div>
  <button id="showpanel" class="pillbtn" hidden>Show lesson panel</button>
  <aside id="panel" aria-live="polite"></aside>
  <div id="toast" role="status"></div>

<script type="application/json" id="content">{"mm3-c01":{"id":"mm3-c01","interactive":"expfun","summary":"This chapter builds the two functions that run the rest of Unit 3: $e^x$ and its inverse $\\ln x$. You learn what a limit is, why $e$ is special, how to sketch and solve with exponentials and logarithms, how to differentiate them, and how to use them to model growth, decay and cooling.","videos":[{"src":"B","title":"What's so special about Euler's number e? (3Blue1Brown, Essence of calculus ch. 5)","url":"https://www.youtube.com/watch?v=m2MIpDrF7Es","kind":"video"},{"src":"B","title":"The paradox of the derivative (3Blue1Brown, Essence of calculus ch. 2)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+The+paradox+of+the+derivative+Essence+of+calculus+chapter+2","kind":"search"},{"src":"B","title":"Limits, L'Hopital's rule and epsilon delta (3Blue1Brown, ch. 7)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Limits%2C+L%27Hopital%27s+rule%2C+and+epsilon+delta+definitions","kind":"search"},{"src":"J","title":"Limits and derivatives from first principles","url":"https://www.youtube.com/results?search_query=Joel+Speranza+limits+first+principles","kind":"search"},{"src":"J","title":"Exponential functions and their graphs","url":"https://www.youtube.com/results?search_query=Joel+Speranza+exponential+functions+graphs","kind":"search"},{"src":"J","title":"Logarithm laws and solving log equations","url":"https://www.youtube.com/results?search_query=Joel+Speranza+logarithm+laws","kind":"search"},{"src":"J","title":"Differentiating exponential and logarithmic functions","url":"https://www.youtube.com/results?search_query=Joel+Speranza+differentiation+exponential+logarithmic","kind":"search"}],"sections":[{"id":"mm3-c01-s1","code":"1.2","title":"Limits","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: limits and differentiation from first principles","url":"https://www.youtube.com/results?search_query=Joel+Speranza+limits+and+differentiation+from+first+principles","kind":"search"},{"src":"B","title":"3Blue1Brown: The paradox of the derivative","url":"https://www.youtube.com/results?search_query=3Blue1Brown+The+paradox+of+the+derivative","kind":"search"}]},{"t":"p","x":"**What this topic is about.** Calculus is built on one idea: what happens to a quantity as something gets closer and closer to a value, without necessarily reaching it. That idea is a **limit**. In this topic you learn to evaluate limits by substitution, by simplifying, and by estimating with tables, and then you use a limit to define the derivative. Every derivative rule in Units 3 and 4 is built on the first-principles definition you meet here."},{"t":"key","x":"$$\\lim_{x\\to a}f(x)=L$$ means: as $x$ gets as close as we like to $a$ (from both sides, but $x\\neq a$), the values of $f(x)$ get as close as we like to $L$."},{"t":"p","x":"**The limit is about the approach, not the arrival.** A limit can exist even when $f(a)$ is undefined. For example, $f(x)=\\dfrac{x^2-9}{x-3}$ is undefined at $x=3$ (it gives $\\frac00$), but for every other $x$ it equals $x+3$. As $x$ approaches 3, $f(x)$ approaches 6. The graph is the straight line $y=x+3$ with a single hole at $(3,6)$, and the limit is the height of that hole."},{"t":"p","x":"**Method 1: direct substitution.** If the function is a polynomial, an exponential, or any function with no gap or jump at $x=a$ (a continuous function), the limit is simply $f(a)$. Always try substitution first. For example $\\lim_{x\\to2}(3x^2-x+1)=3(4)-2+1=11$."},{"t":"p","x":"**Method 2: simplify first.** If substitution gives $\\frac00$, this is called an **indeterminate form**. It does not mean the answer is 0, and it does not mean the limit does not exist. It means the expression must be rewritten. The common moves are: factorise and cancel a common factor; expand brackets and simplify; or rationalise a surd by multiplying by its conjugate. After simplifying, substitute again."},{"t":"p","x":"**Method 3: estimate numerically.** Make a table of $f(x)$ for values of $x$ approaching $a$ from below (e.g. 2.9, 2.99, 2.999) and from above (3.1, 3.01, 3.001). If both columns settle on the same number, that is the limit. This is how you find limits that cannot be simplified by hand, such as $\\lim_{h\\to0}\\frac{e^h-1}{h}=1$, which is the key fact behind the derivative of $e^x$."},{"t":"p","x":"**One-sided limits.** $\\lim_{x\\to a^-}f(x)$ is the value approached from the left and $\\lim_{x\\to a^+}f(x)$ from the right. The ordinary (two-sided) limit exists only if these agree. A **hybrid (piecewise) function** often has different rules either side of a point, so check both sides separately."},{"t":"ex","title":"Limit by factorising (full working)","q":"Evaluate $\\displaystyle\\lim_{x\\to 3}\\frac{x^2-9}{x-3}$.","s":["**Try substitution first.** At $x=3$ the numerator is $3^2-9=0$ and the denominator is $3-3=0$, giving $\\frac00$. This is indeterminate, so we must simplify.","**Factorise the numerator** as a difference of two squares: $x^2-9=(x-3)(x+3)$.","**Rewrite the expression:** $\\dfrac{(x-3)(x+3)}{x-3}$.","**Cancel the common factor.** Because a limit only looks at $x$ close to 3 and never at $x=3$ itself, $x-3\\neq0$, so cancelling is allowed: the expression equals $x+3$.","**Substitute now that the problem is removed:** $\\lim_{x\\to3}(x+3)=3+3=6$.","**Communicate the answer:** $\\displaystyle\\lim_{x\\to3}\\frac{x^2-9}{x-3}=6$."],"a":"$6$"},{"t":"ex","title":"Limit by rationalising a surd (full working)","q":"Evaluate $\\displaystyle\\lim_{x\\to 4}\\frac{\\sqrt x-2}{x-4}$.","s":["**Substitute:** numerator $\\sqrt4-2=0$, denominator $4-4=0$. We have $\\frac00$, so simplify.","**Spot the difference of two squares in the denominator.** Since $(\\sqrt x)^2=x$, we can write $x-4=(\\sqrt x)^2-2^2=(\\sqrt x-2)(\\sqrt x+2)$.","**Rewrite:** $\\dfrac{\\sqrt x-2}{(\\sqrt x-2)(\\sqrt x+2)}$.","**Cancel** $\\sqrt x-2$ (non-zero for $x$ near but not equal to 4) to get $\\dfrac{1}{\\sqrt x+2}$.","**Substitute** $x=4$: $\\dfrac{1}{\\sqrt4+2}=\\dfrac1{2+2}=\\dfrac14$."],"a":"$\\dfrac14$"},{"t":"p","x":"**The derivative as a limit.** The gradient of a straight line through two points on a curve (a **chord** or secant) is $\\dfrac{f(x+h)-f(x)}{(x+h)-x}=\\dfrac{f(x+h)-f(x)}{h}$. As $h\\to0$, the second point slides towards the first and the chord turns into the **tangent**. The limit of the chord gradient is the gradient of the tangent, which we call the derivative."},{"t":"key","x":"$$f'(x)=\\lim_{h\\to0}\\frac{f(x+h)-f(x)}{h}$$ This is **differentiation from first principles**. Exam questions say \"use first principles\" when they want to see this whole process, not the shortcut rules."},{"t":"p","x":"**How to set out a first-principles proof for full marks.** (1) Write the definition. (2) Substitute $f(x+h)$ and $f(x)$ carefully, with brackets. (3) Expand and simplify the numerator: every term without an $h$ should cancel. (4) Factorise $h$ out of the numerator and cancel it with the denominator (allowed because $h\\neq0$). (5) Only now let $h\\to0$. (6) State the result. Never let $h\\to0$ while the $h$ is still in the denominator; that produces $\\frac00$ again."},{"t":"ex","title":"First principles for a quadratic (full working)","q":"Use first principles to find the derivative of $f(x)=2x^2-3x$.","s":["**Write the definition:** $f'(x)=\\displaystyle\\lim_{h\\to0}\\frac{f(x+h)-f(x)}{h}$.","**Find $f(x+h)$** by replacing every $x$ with $(x+h)$: $f(x+h)=2(x+h)^2-3(x+h)=2(x^2+2xh+h^2)-3x-3h=2x^2+4xh+2h^2-3x-3h$.","**Subtract $f(x)$:** $f(x+h)-f(x)=(2x^2+4xh+2h^2-3x-3h)-(2x^2-3x)=4xh+2h^2-3h$. The terms without $h$ cancel, which is a good check.","**Divide by $h$:** $\\dfrac{4xh+2h^2-3h}{h}=\\dfrac{h(4x+2h-3)}{h}=4x+2h-3$ (cancelling is allowed since $h\\neq0$).","**Take the limit:** as $h\\to0$, $4x+2h-3\\to4x-3$.","**State the result:** $f'(x)=4x-3$."],"a":"$f'(x)=4x-3$"},{"t":"ex","title":"First principles with a reciprocal (full working)","q":"Use first principles to show that if $f(x)=\\dfrac1x$ then $f'(x)=-\\dfrac1{x^2}$.","s":["**Definition:** $f'(x)=\\displaystyle\\lim_{h\\to0}\\frac{\\frac1{x+h}-\\frac1x}{h}$.","**Combine the fractions in the numerator** over a common denominator $x(x+h)$: $\\dfrac1{x+h}-\\dfrac1x=\\dfrac{x-(x+h)}{x(x+h)}=\\dfrac{-h}{x(x+h)}$.","**Divide by $h$:** dividing by $h$ is the same as multiplying by $\\frac1h$, so $\\dfrac{-h}{x(x+h)}\\cdot\\dfrac1h=\\dfrac{-1}{x(x+h)}$.","**Take the limit:** as $h\\to0$, $x+h\\to x$, so the expression tends to $\\dfrac{-1}{x\\cdot x}=-\\dfrac{1}{x^2}$.","**Conclude:** $f'(x)=-\\dfrac1{x^2}$, as required."],"a":"Shown: $f'(x)=-\\frac{1}{x^2}$"},{"t":"p","x":"**Continuity and differentiability.** A function is **continuous** at $x=a$ if $\\lim_{x\\to a}f(x)$ exists and equals $f(a)$: no holes, jumps or asymptotes there. It is **differentiable** at $a$ if the first-principles limit exists, which also requires the gradient from the left to match the gradient from the right. A sharp corner (like $y=|x|$ at $x=0$, where the left gradient is $-1$ and the right gradient is $+1$) is continuous but **not** differentiable. Every differentiable function is continuous, but not the other way round."},{"t":"warn","x":"Three classic errors: (1) writing $\\frac00=0$; (2) letting $h\\to0$ before cancelling the $h$ in the denominator; (3) forgetting brackets when finding $f(x+h)$, e.g. writing $2x^2+h$ instead of $2(x+h)^2$."},{"t":"p","x":"**Exam tip.** In \"show that\" first-principles questions, every algebraic line is worth marks. Write the limit symbol on every line until the step where $h$ actually goes to 0, and finish with a clear statement of the result."},{"t":"tb","rec":"1,2,3,5,8","ext":"11,13","x":"Textbook Exercise 1.2 practises evaluating limits by substitution and factorising, then differentiating from first principles, then estimating limits with technology.","code":"1.2"},{"t":"int","name":"tangent","cap":"Move the point and shrink the gap $h$: the blue secant gradient closes in on the green tangent gradient. That is the definition of the derivative."}],"checks":[{"topic":"Limit by substitution","q":"Evaluate $\\displaystyle\\lim_{x\\to2}(x^3-4x+1)$.","a":"1","alt":[],"ad":"$1$","sol":"Check whether direct substitution works: the function is a polynomial, so it is continuous everywhere and the limit is just its value at $x=2$. || Substitute: $2^3-4(2)+1=8-8+1$. || Simplify: $8-8+1=1$. || So $\\lim_{x\\to2}(x^3-4x+1)=1$.","h":["Is the function continuous at $x=2$?","Polynomials can be evaluated directly.","Substitute $x=2$."]},{"topic":"Limit by factorising","q":"Evaluate $\\displaystyle\\lim_{x\\to5}\\frac{x^2-3x-10}{x-5}$.","a":"7","alt":[],"ad":"$7$","sol":"Substituting $x=5$ gives $\\frac{25-15-10}{0}=\\frac00$, which is indeterminate, so simplify first. || Factorise the numerator: we need two numbers that multiply to $-10$ and add to $-3$, which are $-5$ and $2$, so $x^2-3x-10=(x-5)(x+2)$. || The expression becomes $\\frac{(x-5)(x+2)}{x-5}$. For $x\\neq5$ we can cancel $x-5$, leaving $x+2$. || Now substitute: $\\lim_{x\\to5}(x+2)=5+2=7$.","h":["What happens when you substitute $x=5$?","Factorise the quadratic on top.","Cancel $(x-5)$ and then substitute."]},{"topic":"Limit with a surd","q":"Evaluate $\\displaystyle\\lim_{x\\to9}\\frac{x-9}{\\sqrt x-3}$.","a":"6","alt":[],"ad":"$6$","sol":"Substituting gives $\\frac{0}{0}$, so simplify. || Write the numerator as a difference of two squares: $x-9=(\\sqrt x)^2-3^2=(\\sqrt x-3)(\\sqrt x+3)$. || The expression becomes $\\frac{(\\sqrt x-3)(\\sqrt x+3)}{\\sqrt x-3}=\\sqrt x+3$ for $x\\neq9$. || Substitute $x=9$: $\\sqrt9+3=3+3=6$.","h":["Substitution gives $\\frac00$.","Treat $x$ as $(\\sqrt x)^2$.","Factorise $x-9$ as a difference of two squares."]},{"topic":"First principles","q":"Use first principles to find $f'(x)$ for $f(x)=x^2+5x$.","a":"2x+5","alt":[],"ad":"$2x+5$","sol":"Start from the definition $f'(x)=\\lim_{h\\to0}\\frac{f(x+h)-f(x)}{h}$. || Find $f(x+h)=(x+h)^2+5(x+h)=x^2+2xh+h^2+5x+5h$. || Subtract $f(x)=x^2+5x$: $f(x+h)-f(x)=2xh+h^2+5h$ (all terms without $h$ cancel). || Factorise and divide by $h$: $\\frac{h(2x+h+5)}{h}=2x+h+5$. || Let $h\\to0$: the $h$ term vanishes, giving $f'(x)=2x+5$.","h":["Write the first-principles definition.","Expand $(x+h)^2+5(x+h)$ carefully.","Cancel $h$ before letting $h\\to0$."]},{"topic":"Derivative from a simplified quotient","q":"For $f(x)=3x^2$, the first-principles quotient simplifies to $\\frac{f(x+h)-f(x)}{h}=6x+3h$. Find $f'(2)$.","a":"12","alt":[],"ad":"$12$","sol":"The derivative is the limit of the quotient as $h\\to0$: $f'(x)=\\lim_{h\\to0}(6x+3h)$. || As $h\\to0$, $3h\\to0$, so $f'(x)=6x$. || Substitute $x=2$: $f'(2)=6(2)=12$. || This means the tangent to $y=3x^2$ at $x=2$ has gradient 12.","h":["What happens to $3h$ as $h\\to0$?","Find $f'(x)$ first.","Then substitute $x=2$."]}]},{"id":"mm3-c01-s2","code":"1.3","title":"The exponential function","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: exponential functions and graphs","url":"https://www.youtube.com/results?search_query=Joel+Speranza+exponential+functions+and+graphs","kind":"search"},{"src":"B","title":"3Blue1Brown: What is special about Euler's number e","url":"https://www.youtube.com/watch?v=m2MIpDrF7Es","kind":"video"}]},{"t":"p","x":"**What this topic is about.** Exponential functions describe anything that grows or shrinks by a fixed **factor** in each equal time step: populations, bank balances, radioactive material, cooling coffee. In this topic you learn the shape and features of $y=a^x$ and especially $y=e^x$, how transformations move the graph, and how to find intercepts, asymptotes, domain and range."},{"t":"key","x":"An **exponential function** has the variable in the index: $y=a^x$, with base $a>0$ and $a\\neq1$. Every graph $y=a^x$ passes through $(0,1)$, has horizontal asymptote $y=0$, domain $\\mathbb R$ and range $(0,\\infty)$."},{"t":"p","x":"**Growth or decay?** If $a>1$, $y=a^x$ increases: each step of 1 in $x$ multiplies $y$ by $a$, so it grows faster and faster. If $0\u003ca\u003c1$, it decreases towards 0: this is decay. Note that $\\left(\\frac12\\right)^x=2^{-x}$, so a decaying exponential is a reflection of a growing one in the $y$-axis."},{"t":"p","x":"**Why $e$ is the natural base.** The gradient of $y=a^x$ at any point is a constant multiple of the height: $\\frac{d}{dx}a^x=k\\,a^x$. For $a=2$, $k\\approx0.693$; for $a=3$, $k\\approx1.099$. There is exactly one base between 2 and 3 for which $k=1$, so that **the gradient equals the height at every point**. That base is Euler's number $e\\approx2.71828$. It can also be defined as $e=\\lim_{n\\to\\infty}\\left(1+\\frac1n\\right)^n$. Because its derivative is itself, $e^x$ is the exponential used in calculus."},{"t":"key","x":"**Transformations of $y=ae^{b(x-h)}+k$:** $a$ dilates vertically by factor $|a|$ (and reflects in the $x$-axis if $a\u003c0$); $b$ dilates horizontally by factor $\\frac1{|b|}$ (and reflects in the $y$-axis if $b\u003c0$); $h$ translates $h$ units right; $k$ translates $k$ units up. **The horizontal asymptote is $y=k$.**"},{"t":"p","x":"**A reliable method for sketching.** (1) State the asymptote $y=k$ and draw it dashed. (2) Find the $y$-intercept by substituting $x=0$. (3) Find any $x$-intercept by setting $y=0$ and solving (it exists only if $-\\frac{k}{a}>0$). (4) Decide whether the graph is above or below the asymptote (sign of $a$) and whether it rises or falls (signs of $a$ and $b$). (5) Plot one more point if needed and draw a smooth curve that approaches but never touches the asymptote. (6) State the range, which depends on the asymptote and on which side the graph is."},{"t":"ex","title":"Sketching a transformed exponential (full working)","q":"For $y=2e^{-x}+1$, state the asymptote, the $y$-intercept, any $x$-intercept and the range, and describe the shape.","s":["**Asymptote.** The vertical translation is $k=1$, so the horizontal asymptote is $y=1$. As $x\\to\\infty$, $e^{-x}\\to0$, so $y\\to1$.","**$y$-intercept.** Substitute $x=0$: $y=2e^0+1=2(1)+1=3$. The point is $(0,3)$.","**$x$-intercept.** Set $y=0$: $2e^{-x}+1=0\\Rightarrow e^{-x}=-\\tfrac12$. An exponential is always positive, so there is no solution and no $x$-intercept.","**Shape.** $a=2>0$ so the graph lies above the asymptote. The $-x$ means the graph of $e^x$ is reflected in the $y$-axis, so it decreases from left to right.","**Range.** The graph is always above $y=1$ and never reaches it, so the range is $(1,\\infty)$, i.e. $y>1$. The domain is all real $x$."],"a":"Asymptote $y=1$; $y$-intercept $(0,3)$; no $x$-intercept; decreasing; range $(1,\\infty)$."},{"t":"ex","title":"Finding an $x$-intercept (full working)","q":"Find the exact $x$-intercept of $y=3e^{2x}-12$.","s":["**Set $y=0$:** $3e^{2x}-12=0$.","**Isolate the exponential:** add 12 and divide by 3 to get $e^{2x}=4$.","**Take the natural log of both sides:** $\\ln(e^{2x})=\\ln4$, and since $\\ln$ undoes $e$, $2x=\\ln4$.","**Solve for $x$:** $x=\\tfrac12\\ln4$. Using log laws this simplifies: $\\tfrac12\\ln4=\\ln4^{1/2}=\\ln2$.","**State the point:** the $x$-intercept is $(\\ln2,0)$, approximately $(0.693,0)$."],"a":"$(\\ln 2,\\,0)$"},{"t":"ex","title":"Finding the rule from features (full working)","q":"A graph of the form $y=ae^{x}+k$ has horizontal asymptote $y=-2$ and passes through $(0,3)$. Find $a$ and $k$.","s":["**Use the asymptote.** For $y=ae^x+k$ the asymptote is $y=k$, so $k=-2$.","**Use the point.** Substitute $x=0$, $y=3$: $3=ae^0-2=a-2$.","**Solve:** $a=5$.","**Check with a second feature:** as $x\\to-\\infty$, $5e^x\\to0$ so $y\\to-2$, matching the asymptote."],"a":"$y=5e^x-2$"},{"t":"ex","title":"Using index laws to simplify (full working)","q":"Simplify $\\dfrac{e^{3x}\\times e^{x-2}}{e^{2x}}$.","s":["**Multiply the top using $e^m\\times e^n=e^{m+n}$:** $e^{3x}\\times e^{x-2}=e^{3x+x-2}=e^{4x-2}$.","**Divide using $\\frac{e^m}{e^n}=e^{m-n}$:** $\\dfrac{e^{4x-2}}{e^{2x}}=e^{4x-2-2x}$.","**Simplify the index:** $4x-2-2x=2x-2$."],"a":"$e^{2x-2}$"},{"t":"warn","x":"$e^{x+2}$ is not $e^x+2$. The first is a horizontal shift (left 2); the second is a vertical shift (up 2) and changes the asymptote. Likewise $e^x\\cdot e^y=e^{x+y}$, but $e^x+e^y$ cannot be combined."},{"t":"p","x":"**Exam tip.** When asked for the range, use interval notation or an inequality and match the side of the asymptote: for $y=-2e^x+5$ the graph is **below** $y=5$, so the range is $(-\\infty,5)$."},{"t":"int","name":"expfun","cap":"Slide $a$ and watch the gradient of $y=a^x$ at $x=0$. When $a=e$ the gradient equals the height."},{"t":"tb","rec":"1,3,4,7,11,12","ext":"13,15,16,18","x":"Exercise 1.3 covers sketching $y=a^x$ and $y=e^x$ with transformations, then finding intercepts and domain and range.","code":"1.3"}],"checks":[{"topic":"Asymptote and intercept","q":"For $y=4e^{x}-8$, find the horizontal asymptote and the exact $x$-intercept.","a":"y=-8, x=ln2","alt":["y=-8,ln2","asymptote y=-8, x=ln2","-8,ln2"],"ad":"Asymptote $y=-8$; $x$-intercept $(\\ln2,0)$","sol":"The rule has the form $y=ae^x+k$ with $k=-8$, so the horizontal asymptote is $y=-8$. || For the $x$-intercept set $y=0$: $4e^x-8=0$, so $4e^x=8$ and $e^x=2$. || Take natural logs: $x=\\ln2$. || So the asymptote is $y=-8$ and the graph crosses the $x$-axis at $(\\ln2,0)\\approx(0.693,0)$.","h":["The asymptote is $y=k$.","Set $y=0$ and isolate $e^x$.","Take $\\ln$ of both sides."]},{"topic":"Range","q":"State the range of $y=-3e^{2x}+1$.","a":"y\u003c1","alt":["(-inf,1)","(-\u221e,1)","y\u003c1"],"ad":"$(-\\infty,1)$, i.e. $y\u003c1$","sol":"The asymptote is $y=k=1$. || Because $e^{2x}>0$ for all $x$, the term $-3e^{2x}$ is always negative. || So $y=1+(\\text{a negative number})$ is always less than 1, and it can be as negative as we like as $x$ grows. || The range is $(-\\infty,1)$, meaning $y\u003c1$.","h":["Find the asymptote first.","What sign is $-3e^{2x}$?","Is the graph above or below the asymptote?"]},{"topic":"Rule from features","q":"$y=ae^{x}+k$ has asymptote $y=3$ and $y$-intercept $(0,7)$. Find $a$.","a":"4","alt":["a=4"],"ad":"$a=4$","sol":"The asymptote gives $k=3$. || At $x=0$: $y=ae^0+3=a+3$. || The $y$-intercept is 7, so $a+3=7$. || Therefore $a=4$ and the rule is $y=4e^x+3$.","h":["The asymptote tells you $k$.","$e^0=1$.","Solve $a+k=7$."]},{"topic":"Index laws","q":"Simplify $\\dfrac{(e^{x})^3\\,e^{2}}{e^{x+1}}$.","a":"e^(2x+1)","alt":["e^(1+2x)"],"ad":"$e^{2x+1}$","sol":"Use the power law: $(e^x)^3=e^{3x}$. || Multiply: $e^{3x}\\times e^2=e^{3x+2}$. || Divide by subtracting indices: $\\frac{e^{3x+2}}{e^{x+1}}=e^{3x+2-(x+1)}$. || Simplify the index carefully with brackets: $3x+2-x-1=2x+1$, so the answer is $e^{2x+1}$.","h":["$(e^m)^n=e^{mn}$.","Add indices when multiplying.","Subtract the whole index $x+1$ when dividing."]},{"topic":"Exact intercept","q":"Find the exact $x$-intercept of $y=e^{3x}-5$.","a":"(1/3)ln5","alt":["ln5/3","ln(5)/3","x=(1/3)ln5","1/3ln5"],"ad":"$x=\\tfrac13\\ln5$","sol":"Set $y=0$: $e^{3x}-5=0$, so $e^{3x}=5$. || Take natural logs of both sides: $3x=\\ln5$. || Divide by 3: $x=\\frac13\\ln5\\approx0.536$. || The $x$-intercept is $\\left(\\frac13\\ln5,\\,0\\right)$.","h":["Set $y=0$.","Isolate the exponential.","Take $\\ln$ and divide by 3."]}]},{"id":"mm3-c01-s3","code":"1.4","title":"Differentiation of exponential functions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: differentiating e^x","url":"https://www.youtube.com/results?search_query=Joel+Speranza+differentiating+e%5Ex","kind":"search"},{"src":"B","title":"3Blue1Brown: What is special about Euler's number e","url":"https://www.youtube.com/watch?v=m2MIpDrF7Es","kind":"video"}]},{"t":"p","x":"**What this topic is about.** You now learn the derivative of $e^x$ and of $e$ raised to any function, and use them to find gradients, tangents, rates of change and stationary points. These skills appear in almost every calculus question in the Methods external exam, often combined with other rules later in the unit."},{"t":"key","x":"$$\\frac{d}{dx}\\left(e^x\\right)=e^x\\qquad\\frac{d}{dx}\\left(e^{kx}\\right)=ke^{kx}\\qquad\\frac{d}{dx}\\left(e^{f(x)}\\right)=f'(x)\\,e^{f(x)}$$"},{"t":"p","x":"**Why $\\frac{d}{dx}e^x=e^x$.** From first principles, $\\frac{e^{x+h}-e^x}{h}=e^x\\cdot\\frac{e^h-1}{h}$. The limit of $\\frac{e^h-1}{h}$ as $h\\to0$ is exactly 1 (this is what makes $e$ special), so the derivative is $e^x\\times1=e^x$. Geometrically: at every point on $y=e^x$ the tangent's gradient equals the point's height."},{"t":"p","x":"**The general rule in words.** To differentiate $e^{\\text{something}}$: copy the exponential exactly as it is, then multiply by the derivative of the power (\"the something\"). For example $e^{x^2}$: the power $x^2$ has derivative $2x$, so $\\frac{d}{dx}e^{x^2}=2xe^{x^2}$. This is a special case of the chain rule you will formalise in topic 3."},{"t":"p","x":"**Constants.** A constant multiplier stays: $\\frac{d}{dx}5e^{3x}=5\\times3e^{3x}=15e^{3x}$. A constant added disappears: $\\frac{d}{dx}(e^{x}+7)=e^x$. Each term in a sum is differentiated separately."},{"t":"p","x":"**Three standard applications.** (1) **Gradient at a point:** find $\\frac{dy}{dx}$, then substitute the $x$-value. (2) **Tangent line:** find the point and the gradient, then use $y-y_1=m(x-x_1)$. (3) **Stationary points:** solve $\\frac{dy}{dx}=0$. Remember $e^{\\text{anything}}>0$, so an equation like $e^{2x}=0$ has **no** solution; stationary points come from other factors or terms."},{"t":"ex","title":"Differentiating a sum of exponentials (full working)","q":"Differentiate $y=5e^{4x}-e^{-x^2}+3$.","s":["**Differentiate term by term.** The derivative of a sum is the sum of the derivatives.","**First term, $5e^{4x}$:** the power is $4x$, whose derivative is $4$. Copy the exponential and multiply: $5\\times4e^{4x}=20e^{4x}$.","**Second term, $-e^{-x^2}$:** the power is $-x^2$, whose derivative is $-2x$. So $\\frac{d}{dx}e^{-x^2}=-2xe^{-x^2}$, and with the minus sign in front the term contributes $-(-2xe^{-x^2})=+2xe^{-x^2}$.","**Third term, $3$:** a constant has derivative $0$.","**Combine:** $\\dfrac{dy}{dx}=20e^{4x}+2xe^{-x^2}$."],"a":"$\\dfrac{dy}{dx}=20e^{4x}+2xe^{-x^2}$"},{"t":"ex","title":"Equation of a tangent (full working)","q":"Find the equation of the tangent to $y=e^{2x}+x$ at the point where $x=0$.","s":["**Find the point.** Substitute $x=0$ into the curve: $y=e^0+0=1$. The point is $(0,1)$.","**Find the derivative.** $\\dfrac{dy}{dx}=2e^{2x}+1$.","**Find the gradient at the point.** At $x=0$: $m=2e^0+1=2+1=3$.","**Use the point-gradient form** $y-y_1=m(x-x_1)$: $y-1=3(x-0)$.","**Rearrange:** $y=3x+1$."],"a":"$y=3x+1$"},{"t":"ex","title":"Stationary point of an exponential function (full working)","q":"Find the coordinates of the stationary point of $y=e^x-2x$ and determine its nature.","s":["**Differentiate:** $\\dfrac{dy}{dx}=e^x-2$.","**Set the derivative to zero:** $e^x-2=0\\Rightarrow e^x=2$.","**Solve using natural logs:** $x=\\ln2$.","**Find the $y$-coordinate:** $y=e^{\\ln2}-2\\ln2=2-2\\ln2$ (since $e^{\\ln2}=2$). This is about $0.614$.","**Determine the nature with a sign test.** At $x=0$ (left of $\\ln2\\approx0.69$): $\\frac{dy}{dx}=1-2=-1\u003c0$. At $x=1$ (right): $\\frac{dy}{dx}=e-2\\approx0.72>0$. The gradient goes from negative to positive, so the curve goes down then up.","**Conclude:** a local minimum at $(\\ln2,\\ 2-2\\ln2)$."],"a":"Local minimum at $\\left(\\ln2,\\ 2-2\\ln2\\right)\\approx(0.693,0.614)$"},{"t":"ex","title":"Worded problem: rate of growth (full working)","q":"A bacteria culture has $N=200e^{0.3t}$ cells after $t$ hours. (a) Find the rate of growth when $t=5$. (b) Find when the culture is growing at 1000 cells per hour.","s":["**Interpret \"rate of growth\".** This means $\\frac{dN}{dt}$, the derivative of $N$ with respect to $t$.","**Differentiate:** $\\dfrac{dN}{dt}=200\\times0.3e^{0.3t}=60e^{0.3t}$.","**(a) Substitute $t=5$:** $\\dfrac{dN}{dt}=60e^{1.5}\\approx60\\times4.4817\\approx268.9$.","**Interpret with units:** after 5 hours the culture is growing at about 269 cells per hour.","**(b) Set the rate equal to 1000:** $60e^{0.3t}=1000\\Rightarrow e^{0.3t}=\\frac{1000}{60}=\\frac{50}{3}$.","**Solve with logs:** $0.3t=\\ln\\frac{50}3$, so $t=\\dfrac{\\ln(50/3)}{0.3}\\approx\\dfrac{2.813}{0.3}\\approx9.38$.","**Interpret:** the growth rate reaches 1000 cells per hour after about 9.4 hours."],"a":"(a) about $269$ cells/h; (b) after about $9.4$ hours"},{"t":"p","x":"**Reading the derivative of $Ae^{kt}$.** Since $\\frac{d}{dt}Ae^{kt}=kAe^{kt}$, the rate of change is $k$ times the current amount. That is what \"the rate of growth is proportional to the size\" means, and it is the defining property of exponential growth ($k>0$) and decay ($k\u003c0$)."},{"t":"warn","x":"Do not use the power rule on $e^x$: $\\frac{d}{dx}e^{3x}$ is $3e^{3x}$, **not** $3xe^{3x-1}$. The variable is in the index, not the base. Also remember the chain factor: $\\frac{d}{dx}e^{x^2}\\neq e^{x^2}$."},{"t":"p","x":"**Exam tip.** When a question says \"show that the rate of change is proportional to $N$\", differentiate and then write the derivative in terms of $N$: e.g. $\\frac{dN}{dt}=60e^{0.3t}=0.3\\times200e^{0.3t}=0.3N$."},{"t":"tb","rec":"1,2,5,6,7,10","ext":"13,16,17,19,20","x":"Exercise 1.4 starts with direct derivatives of $e^{f(x)}$, then tangents and stationary points.","code":"1.4"}],"checks":[{"topic":"Derivative of e","q":"Differentiate $y=4e^{-3x}$.","a":"-12e^(-3x)","alt":["-12e^-3x"],"ad":"$-12e^{-3x}$","sol":"The power is $-3x$, whose derivative is $-3$. || Copy the exponential and multiply by the derivative of the power: $\\frac{d}{dx}e^{-3x}=-3e^{-3x}$. || Keep the constant multiplier 4: $4\\times(-3e^{-3x})=-12e^{-3x}$. || So $\\frac{dy}{dx}=-12e^{-3x}$.","h":["What is the derivative of the power $-3x$?","$\\frac{d}{dx}e^{kx}=ke^{kx}$.","Multiply by the 4 at the front."]},{"topic":"Chain with e","q":"Differentiate $y=e^{x^2+2x}$.","a":"(2x+2)e^(x^2+2x)","alt":["2(x+1)e^(x^2+2x)","(2x+2)e^(x^2+2x)"],"ad":"$(2x+2)e^{x^2+2x}$","sol":"The power is $x^2+2x$. || Its derivative is $2x+2$. || Using $\\frac{d}{dx}e^{f(x)}=f'(x)e^{f(x)}$, multiply the unchanged exponential by $2x+2$. || So $\\frac{dy}{dx}=(2x+2)e^{x^2+2x}=2(x+1)e^{x^2+2x}$.","h":["Identify the power.","Differentiate the power.","Multiply it by the original exponential."]},{"topic":"Gradient at a point","q":"Find the gradient of $y=3e^{2x}-x$ at $x=0$.","a":"5","alt":["m=5"],"ad":"$5$","sol":"Differentiate each term: $\\frac{d}{dx}3e^{2x}=6e^{2x}$ and $\\frac{d}{dx}(-x)=-1$. || So $\\frac{dy}{dx}=6e^{2x}-1$. || Substitute $x=0$: $6e^0-1=6-1=5$. || The gradient at $x=0$ is 5.","h":["Differentiate term by term.","$e^0=1$.","Substitute $x=0$ into the derivative."]},{"topic":"Stationary point","q":"Find the exact $x$-coordinate of the stationary point of $y=e^{2x}-4x$.","a":"(1/2)ln2","alt":["ln2/2","ln(2)/2","1/2ln2","x=(1/2)ln2"],"ad":"$x=\\tfrac12\\ln2$","sol":"Differentiate: $\\frac{dy}{dx}=2e^{2x}-4$. || Stationary points occur where $\\frac{dy}{dx}=0$: $2e^{2x}-4=0$, so $e^{2x}=2$. || Take natural logs: $2x=\\ln2$. || Divide by 2: $x=\\frac12\\ln2\\approx0.347$.","h":["Differentiate.","Set the derivative equal to 0.","Isolate $e^{2x}$ then take $\\ln$."]},{"topic":"Rate of change","q":"A population is $P=800e^{0.05t}$ ($t$ in years). Find the rate of growth when $t=10$, to the nearest whole number.","a":"66","alt":["65.9","66 per year"],"ad":"$\\approx66$ per year","sol":"The rate of growth is $\\frac{dP}{dt}$. || Differentiate: $\\frac{dP}{dt}=800\\times0.05e^{0.05t}=40e^{0.05t}$. || Substitute $t=10$: $40e^{0.5}\\approx40\\times1.6487=65.95$. || So the population is growing at about 66 per year when $t=10$.","h":["Rate of growth means $\\frac{dP}{dt}$.","$\\frac{d}{dt}e^{0.05t}=0.05e^{0.05t}$.","Substitute $t=10$."]}]},{"id":"mm3-c01-s4","code":"1.5","title":"The logarithmic function","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: logarithm laws and the natural logarithm","url":"https://www.youtube.com/results?search_query=Joel+Speranza+logarithm+laws+and+the+natural+logarithm","kind":"search"}]},{"t":"p","x":"**What this topic is about.** Logarithms are the inverse of exponentials: they answer \"what power?\". You need them to solve exponential equations, to model data and to differentiate later. In this topic you learn what a log means, the log laws, the natural log $\\ln x$ and the graph of $y=\\ln x$ with its transformations."},{"t":"key","x":"$$\\log_a x=y\\iff a^y=x\\qquad(a>0,\\ a\\neq1,\\ x>0)$$ The **natural logarithm** is $\\ln x=\\log_e x$, so $\\ln(e^x)=x$ and $e^{\\ln x}=x$."},{"t":"p","x":"**Reading a log.** $\\log_2 8$ asks \"2 to what power gives 8?\" The answer is 3. $\\log_{10}0.01$ asks \"10 to what power gives 0.01?\" The answer is $-2$. $\\ln e^5=5$ because $e$ to the power 5 is $e^5$. Two values worth memorising: $\\log_a1=0$ (since $a^0=1$) and $\\log_aa=1$."},{"t":"key","x":"**Log laws** (any base $a$, with $x,y>0$): $\\log_a(xy)=\\log_ax+\\log_ay$; $\\log_a\\left(\\frac xy\\right)=\\log_ax-\\log_ay$; $\\log_a(x^n)=n\\log_ax$; $\\log_a\\left(\\frac1x\\right)=-\\log_ax$. **Change of base:** $\\log_ax=\\dfrac{\\ln x}{\\ln a}$."},{"t":"p","x":"**Where the laws come from.** Each log law is an index law in disguise. If $x=a^m$ and $y=a^n$ then $xy=a^{m+n}$, so $\\log_a(xy)=m+n=\\log_ax+\\log_ay$. The power law comes from $(a^m)^n=a^{mn}$. If you forget a law, rebuild it from the matching index law."},{"t":"p","x":"**The graph of $y=\\ln x$.** Because $\\ln$ is the inverse of $e^x$, its graph is the reflection of $y=e^x$ in the line $y=x$. The features swap: $e^x$ has domain $\\mathbb R$, range $(0,\\infty)$, asymptote $y=0$ and passes through $(0,1)$; so $\\ln x$ has domain $(0,\\infty)$, range $\\mathbb R$, **vertical** asymptote $x=0$ and passes through $(1,0)$. It increases forever but more and more slowly."},{"t":"p","x":"**Transformations of $y=a\\ln(b(x-h))+k$.** The vertical asymptote is $x=h$ (where the inside equals 0). The domain is where the inside is positive. Find the $x$-intercept by setting $y=0$, isolating the log, and converting to index form."},{"t":"ex","title":"Simplifying with log laws (full working)","q":"Write $2\\ln3+\\ln5-\\ln15$ as a single logarithm and simplify.","s":["**Use the power law on the first term:** $2\\ln3=\\ln3^2=\\ln9$.","**Combine the sum with the product law:** $\\ln9+\\ln5=\\ln(9\\times5)=\\ln45$.","**Combine the difference with the quotient law:** $\\ln45-\\ln15=\\ln\\frac{45}{15}$.","**Simplify the fraction:** $\\frac{45}{15}=3$, so the expression equals $\\ln3$."],"a":"$\\ln3$"},{"t":"ex","title":"Expanding a logarithm (full working)","q":"Write $\\ln\\left(\\dfrac{x^3\\sqrt y}{e^2}\\right)$ in terms of $\\ln x$ and $\\ln y$.","s":["**Split the quotient:** $\\ln(x^3\\sqrt y)-\\ln(e^2)$.","**Split the product:** $\\ln(x^3)+\\ln(\\sqrt y)-\\ln(e^2)$.","**Write the root as a power:** $\\sqrt y=y^{1/2}$.","**Bring powers down with the power law:** $3\\ln x+\\tfrac12\\ln y-2\\ln e$.","**Use $\\ln e=1$:** the result is $3\\ln x+\\tfrac12\\ln y-2$."],"a":"$3\\ln x+\\tfrac12\\ln y-2$"},{"t":"ex","title":"Features of a transformed log graph (full working)","q":"For $y=\\ln(x-2)+1$, state the domain, the asymptote and the exact $x$-intercept.","s":["**Domain:** the log needs a positive input, so $x-2>0$, i.e. $x>2$.","**Asymptote:** the vertical asymptote is where the inside equals 0: $x=2$.","**$x$-intercept: set $y=0$:** $\\ln(x-2)+1=0\\Rightarrow\\ln(x-2)=-1$.","**Convert to index form:** $x-2=e^{-1}$.","**Solve:** $x=2+e^{-1}\\approx2.37$. This is inside the domain, so it is valid."],"a":"Domain $x>2$; asymptote $x=2$; $x$-intercept $\\left(2+e^{-1},\\,0\\right)$"},{"t":"ex","title":"Change of base (full working)","q":"Evaluate $\\log_2 10$ correct to 3 decimal places, and solve $2^x=10$.","s":["**Use change of base:** $\\log_210=\\dfrac{\\ln10}{\\ln2}$.","**Evaluate:** $\\dfrac{2.302585}{0.693147}\\approx3.322$.","**Connect to the equation:** $2^x=10$ means \"2 to what power gives 10?\", which is exactly $\\log_210$.","**So** $x=\\log_210\\approx3.322$."],"a":"$\\log_210\\approx3.322$; $x\\approx3.322$"},{"t":"warn","x":"$\\ln(x+y)$ is **not** $\\ln x+\\ln y$, and $(\\ln x)(\\ln y)$ is **not** $\\ln(xy)$. Also $\\ln x^2=2\\ln x$, but $(\\ln x)^2$ is different: it means $\\ln x$ times $\\ln x$."},{"t":"p","x":"**Exam tip.** Show every log law you use on a separate line. Examiners award a mark for each correctly applied law in \"show that\" or simplification questions."},{"t":"int","name":"logfun","cap":"Move the point on $y=e^x$ and watch its mirror image on $y=\\ln x$ across the line $y=x$."},{"t":"tb","rec":"1,2,3,6,10,12","ext":"13,15,17,20","x":"Exercise 1.5 covers index and log laws, then graphs of $y=\\ln x$ and its transformations.","code":"1.5"}],"checks":[{"topic":"Evaluate a log","q":"Find the exact value of $\\log_3 81-\\log_2\\frac18$.","a":"7","alt":[],"ad":"$7$","sol":"$\\log_381$ asks \"3 to what power is 81?\" Since $3^4=81$, $\\log_381=4$. || $\\log_2\\frac18$ asks \"2 to what power is $\\frac18$?\" Since $2^{-3}=\\frac18$, $\\log_2\\frac18=-3$. || Subtract: $4-(-3)=7$. || So the value is 7.","h":["Turn each log into a \"what power?\" question.","$81=3^4$.","$\\frac18=2^{-3}$."]},{"topic":"Single log","q":"Write $3\\ln2+\\ln5-\\ln4$ as a single logarithm.","a":"ln10","alt":["ln(10)"],"ad":"$\\ln10$","sol":"Power law: $3\\ln2=\\ln2^3=\\ln8$. || Product law: $\\ln8+\\ln5=\\ln40$. || Quotient law: $\\ln40-\\ln4=\\ln\\frac{40}{4}$. || Simplify: $\\ln10$.","h":["Use the power law first.","Then combine the sum.","Then the difference."]},{"topic":"Expand","q":"Express $\\ln\\left(\\dfrac{x^2}{\\sqrt y}\\right)$ in terms of $\\ln x$ and $\\ln y$.","a":"2lnx-(1/2)lny","alt":["2ln(x)-(1/2)ln(y)","2lnx-lny/2","2lnx-0.5lny"],"ad":"$2\\ln x-\\tfrac12\\ln y$","sol":"Quotient law: $\\ln(x^2)-\\ln(\\sqrt y)$. || Write $\\sqrt y=y^{1/2}$. || Power law on each term: $2\\ln x-\\frac12\\ln y$. || That is the expanded form.","h":["Split the quotient into a difference.","$\\sqrt y=y^{1/2}$.","Bring the powers down."]},{"topic":"Log graph","q":"For $y=\\ln(x+3)$, state the equation of the asymptote and the exact $x$-intercept.","a":"x=-3, x=-2","alt":["x=-3,-2","-3,-2","asymptote x=-3, intercept -2"],"ad":"Asymptote $x=-3$; $x$-intercept $(-2,0)$","sol":"The vertical asymptote is where the inside is zero: $x+3=0$, so $x=-3$. || For the $x$-intercept set $y=0$: $\\ln(x+3)=0$. || In index form $x+3=e^0=1$. || So $x=-2$, giving the point $(-2,0)$.","h":["Where is the inside of the log zero?","$\\ln(\\text{something})=0$ means something $=1$.","Solve $x+3=1$."]},{"topic":"Change of base","q":"Solve $5^x=40$, correct to 2 decimal places.","a":"2.29","alt":["x=2.29","2.292"],"ad":"$x=\\dfrac{\\ln40}{\\ln5}\\approx2.29$","sol":"Take natural logs of both sides: $\\ln5^x=\\ln40$. || Use the power law: $x\\ln5=\\ln40$. || Divide: $x=\\frac{\\ln40}{\\ln5}=\\frac{3.6889}{1.6094}$. || So $x\\approx2.29$.","h":["Take $\\ln$ of both sides.","Bring the power down.","Divide by $\\ln5$."]}]},{"id":"mm3-c01-s5","code":"1.6","title":"Solving equations","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: solving exponential and logarithmic equations","url":"https://www.youtube.com/results?search_query=Joel+Speranza+solving+exponential+and+logarithmic+equations","kind":"search"}]},{"t":"p","x":"**What this topic is about.** Solving equations where the unknown is in an index or inside a logarithm. These equations appear inside nearly every modelling question (\"when does the population reach 5000?\"), so the techniques must become automatic. The two key facts are that $\\ln$ undoes $e$, and $e$ undoes $\\ln$: $\\ln(e^A)=A$ and $e^{\\ln B}=B$."},{"t":"p","x":"**Type 1: a single exponential.** Isolate the exponential term on one side (move other terms, divide by coefficients), then take $\\ln$ of both sides. Example: $3e^{2x}=18\\Rightarrow e^{2x}=6\\Rightarrow2x=\\ln6\\Rightarrow x=\\frac12\\ln6$. If the isolated exponential equals a negative number or zero, there is **no solution**, because $e^{\\text{anything}}>0$."},{"t":"p","x":"**Type 2: different bases or exponentials on both sides.** Take $\\ln$ of both sides and use the power law to bring the indices down, then collect the $x$ terms. Example: $3^{2x}=5^{x+1}\\Rightarrow2x\\ln3=(x+1)\\ln5\\Rightarrow x(2\\ln3-\\ln5)=\\ln5\\Rightarrow x=\\frac{\\ln5}{2\\ln3-\\ln5}$."},{"t":"p","x":"**Type 3: a quadratic in disguise.** If you see $e^{2x}$ together with $e^x$, notice $e^{2x}=(e^x)^2$. Substitute $u=e^x$ to get a quadratic in $u$, solve it, then solve $e^x=u$ for each root. Reject any $u\\le0$, because $e^x$ is always positive."},{"t":"p","x":"**Type 4: log equations.** Use the log laws to combine everything into a single log on each side (or one log equal to a number). Then either equate the insides ($\\ln A=\\ln B\\Rightarrow A=B$) or convert to index form ($\\ln A=c\\Rightarrow A=e^c$). **Always check the domain**: every log in the **original** equation needs a positive input. Reject any solution that breaks this and say why."},{"t":"ex","title":"Single exponential (full working)","q":"Solve $5e^{0.4x}-2=18$ exactly.","s":["**Isolate the exponential term:** add 2 to both sides: $5e^{0.4x}=20$.","**Divide by the coefficient:** $e^{0.4x}=4$.","**Take natural logs of both sides:** $\\ln(e^{0.4x})=\\ln4$, and since $\\ln$ undoes $e$, $0.4x=\\ln4$.","**Solve for $x$:** $x=\\dfrac{\\ln4}{0.4}=\\dfrac52\\ln4$.","**Simplify if possible:** $\\frac52\\ln4=\\frac52\\ln2^2=5\\ln2\\approx3.47$."],"a":"$x=5\\ln2$"},{"t":"ex","title":"Quadratic in $e^x$ (full working)","q":"Solve $e^{2x}-5e^x+6=0$.","s":["**Recognise the structure:** $e^{2x}=(e^x)^2$, so this is a quadratic in $e^x$.","**Substitute $u=e^x$:** $u^2-5u+6=0$.","**Factorise:** two numbers that multiply to 6 and add to $-5$ are $-2$ and $-3$, so $(u-2)(u-3)=0$, giving $u=2$ or $u=3$.","**Check validity:** both values are positive, so both are possible values of $e^x$.","**Back-substitute and solve:** $e^x=2\\Rightarrow x=\\ln2$; $e^x=3\\Rightarrow x=\\ln3$."],"a":"$x=\\ln2$ or $x=\\ln3$"},{"t":"ex","title":"Log equation with a domain check (full working)","q":"Solve $\\ln x+\\ln(x-2)=\\ln3$.","s":["**State the domain of the original equation:** $\\ln x$ needs $x>0$ and $\\ln(x-2)$ needs $x>2$. So any solution must satisfy $x>2$.","**Combine the left side using the product law:** $\\ln\\big(x(x-2)\\big)=\\ln3$.","**Equate the insides** (since $\\ln$ is one-to-one): $x(x-2)=3$.","**Rearrange to a quadratic:** $x^2-2x-3=0$.","**Factorise:** $(x-3)(x+1)=0$, so $x=3$ or $x=-1$.","**Apply the domain check:** $x=-1$ fails $x>2$ (it would make $\\ln x$ undefined), so reject it. $x=3$ satisfies $x>2$.","**State the answer:** $x=3$."],"a":"$x=3$"},{"t":"ex","title":"Log equal to a number (full working)","q":"Solve $2\\ln x-\\ln(x+2)=\\ln3$.","s":["**Domain:** need $x>0$ and $x>-2$, so $x>0$.","**Power law:** $2\\ln x=\\ln x^2$, so the equation is $\\ln x^2-\\ln(x+2)=\\ln3$.","**Quotient law:** $\\ln\\dfrac{x^2}{x+2}=\\ln3$.","**Equate insides:** $\\dfrac{x^2}{x+2}=3\\Rightarrow x^2=3x+6\\Rightarrow x^2-3x-6=0$.","**Quadratic formula:** $x=\\dfrac{3\\pm\\sqrt{9+24}}{2}=\\dfrac{3\\pm\\sqrt{33}}2$, giving $x\\approx4.37$ or $x\\approx-1.37$.","**Domain check:** $-1.37\u003c0$ makes $\\ln x$ undefined, so reject it."],"a":"$x=\\dfrac{3+\\sqrt{33}}{2}\\approx4.37$"},{"t":"ex","title":"Different bases (full working)","q":"Solve $2^{x+1}=3^x$, giving an exact answer and a decimal to 3 places.","s":["**Take natural logs of both sides:** $\\ln2^{x+1}=\\ln3^x$.","**Power law:** $(x+1)\\ln2=x\\ln3$.","**Expand:** $x\\ln2+\\ln2=x\\ln3$.","**Collect $x$ terms on one side:** $\\ln2=x\\ln3-x\\ln2=x(\\ln3-\\ln2)$.","**Solve:** $x=\\dfrac{\\ln2}{\\ln3-\\ln2}=\\dfrac{\\ln2}{\\ln1.5}\\approx1.710$."],"a":"$x=\\dfrac{\\ln2}{\\ln3-\\ln2}\\approx1.710$"},{"t":"warn","x":"Rejecting a solution is part of the answer and earns a mark. Write the reason in words, for example \"reject $x=-1$ because $\\ln(-1)$ is undefined\". Also, never \"cancel\" logs term by term: $\\ln x+\\ln(x-2)=\\ln3$ does **not** give $x+x-2=3$."},{"t":"p","x":"**Exam tip.** In the technology-free paper, leave answers in exact form ($\\ln$, fractions, surds) unless told otherwise. In the technology-active paper, use your CAS `solve` to check, but still show the setup lines."},{"t":"tb","rec":"1,4,6,8,11,12","ext":"14,16,17,19,20","x":"Exercise 1.6 mixes equations in $e$, quadratics in $e^x$, and log equations with domain checks. Technology is used for equations that cannot be solved by hand.","code":"1.6"}],"checks":[{"topic":"Single exponential","q":"Solve $4e^{2x}=36$ exactly.","a":"ln3","alt":["x=ln3","(1/2)ln9","ln(3)"],"ad":"$x=\\ln3$","sol":"Divide both sides by 4: $e^{2x}=9$. || Take natural logs: $2x=\\ln9$. || Divide by 2: $x=\\frac12\\ln9$. || Simplify using the power law: $\\frac12\\ln9=\\ln9^{1/2}=\\ln3$.","h":["Divide by 4 first.","Take $\\ln$ of both sides.","$\\frac12\\ln9=\\ln3$."]},{"topic":"Quadratic in e^x","q":"Solve $e^{2x}-7e^x+12=0$.","a":"ln3,ln4","alt":["ln3 and ln4","x=ln3,x=ln4","ln4,ln3","ln3,2ln2"],"ad":"$x=\\ln3$ or $x=\\ln4$","sol":"Let $u=e^x$, so $e^{2x}=u^2$ and the equation becomes $u^2-7u+12=0$. || Factorise: $(u-3)(u-4)=0$, so $u=3$ or $u=4$. || Both are positive so both are valid values of $e^x$. || Solve: $e^x=3\\Rightarrow x=\\ln3$ and $e^x=4\\Rightarrow x=\\ln4$.","h":["Let $u=e^x$.","Factorise the quadratic in $u$.","Take $\\ln$ of each positive root."]},{"topic":"Rejecting a root","q":"Solve $e^{2x}-2e^x-8=0$.","a":"ln4","alt":["x=ln4","2ln2"],"ad":"$x=\\ln4$","sol":"Let $u=e^x$: $u^2-2u-8=0$. || Factorise: $(u-4)(u+2)=0$, so $u=4$ or $u=-2$. || Reject $u=-2$ because $e^x$ is always positive. || So $e^x=4$, giving $x=\\ln4$.","h":["Substitute $u=e^x$.","One root is negative.","$e^x$ can never be negative."]},{"topic":"Log equation","q":"Solve $\\ln(x+3)+\\ln(x-3)=\\ln16$.","a":"5","alt":["x=5"],"ad":"$x=5$","sol":"Domain: need $x+3>0$ and $x-3>0$, so $x>3$. || Product law: $\\ln\\big((x+3)(x-3)\\big)=\\ln16$, so $x^2-9=16$. || Then $x^2=25$, giving $x=\\pm5$. || Reject $x=-5$ because it makes $\\ln(x-3)$ undefined; the answer is $x=5$.","h":["Combine the logs on the left.","Use the difference of two squares.","Check each answer against the domain."]},{"topic":"Different bases","q":"Solve $3^{x}=7$, giving an exact answer.","a":"ln7/ln3","alt":["(ln7)/(ln3)","log3(7)","ln(7)/ln(3)"],"ad":"$x=\\dfrac{\\ln7}{\\ln3}\\approx1.771$","sol":"Take natural logs of both sides: $\\ln3^x=\\ln7$. || Power law: $x\\ln3=\\ln7$. || Divide by $\\ln3$: $x=\\frac{\\ln7}{\\ln3}$. || As a decimal, $x\\approx1.771$.","h":["Take $\\ln$ of both sides.","Bring $x$ down.","Divide by $\\ln3$."]}]},{"id":"mm3-c01-s6","code":"1.7","title":"Differentiation of logarithmic functions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: differentiating ln x","url":"https://www.youtube.com/results?search_query=Joel+Speranza+differentiating+ln+x","kind":"search"}]},{"t":"p","x":"**What this topic is about.** The derivative of the natural logarithm, and how to use it with the chain rule and log laws. You will use $\\frac{d}{dx}\\ln x=\\frac1x$ constantly: in tangents, stationary points, rates of change, and later as the reason $\\int\\frac1x\\,dx=\\ln|x|$."},{"t":"key","x":"$$\\frac{d}{dx}\\ln x=\\frac1x\\ (x>0)\\qquad\\frac{d}{dx}\\ln(kx)=\\frac1x\\qquad\\frac{d}{dx}\\ln\\big(f(x)\\big)=\\frac{f'(x)}{f(x)}$$"},{"t":"p","x":"**Why $\\frac{d}{dx}\\ln x=\\frac1x$.** If $y=\\ln x$ then $x=e^y$. Differentiating $x=e^y$ with respect to $y$ gives $\\frac{dx}{dy}=e^y=x$. Flipping, $\\frac{dy}{dx}=\\frac1x$. Geometrically, the graph of $\\ln x$ is steep near $x=0$ and flattens as $x$ grows, exactly as $\\frac1x$ suggests."},{"t":"p","x":"**The rule in words.** To differentiate $\\ln(\\text{something})$: write the derivative of the something on top, and the something itself underneath. So $\\frac{d}{dx}\\ln(3x+1)=\\frac{3}{3x+1}$ and $\\frac{d}{dx}\\ln(x^2+4)=\\frac{2x}{x^2+4}$."},{"t":"p","x":"**Why $\\frac{d}{dx}\\ln(kx)=\\frac1x$.** By the log law, $\\ln(kx)=\\ln k+\\ln x$, and $\\ln k$ is a constant with derivative 0. So multiplying the inside by a constant never changes the derivative. This is a frequent multiple-choice trap."},{"t":"p","x":"**Simplify first, then differentiate.** Log laws can turn a hard derivative into an easy one. $\\ln(x^5)=5\\ln x$, so its derivative is $\\frac5x$. $\\ln\\sqrt{2x+1}=\\frac12\\ln(2x+1)$, with derivative $\\frac12\\cdot\\frac{2}{2x+1}=\\frac1{2x+1}$. $\\ln\\frac{x+1}{x-1}=\\ln(x+1)-\\ln(x-1)$, with derivative $\\frac1{x+1}-\\frac1{x-1}$."},{"t":"ex","title":"Chain rule with ln (full working)","q":"Differentiate $y=\\ln(x^2+3x)$.","s":["**Identify the inside:** $f(x)=x^2+3x$.","**Differentiate the inside:** $f'(x)=2x+3$.","**Apply $\\frac{d}{dx}\\ln f(x)=\\frac{f'(x)}{f(x)}$:** $\\dfrac{dy}{dx}=\\dfrac{2x+3}{x^2+3x}$.","**Check for simplification:** the numerator and denominator have no common factor, so this is the final answer."],"a":"$\\dfrac{2x+3}{x^2+3x}$"},{"t":"ex","title":"Using log laws first (full working)","q":"Differentiate $y=\\ln\\left((2x+1)^3\\right)$ in two ways and show they agree.","s":["**Method 1, chain rule directly:** inside $f=(2x+1)^3$, $f'=3(2x+1)^2\\times2=6(2x+1)^2$.","**So** $\\dfrac{dy}{dx}=\\dfrac{6(2x+1)^2}{(2x+1)^3}=\\dfrac{6}{2x+1}$.","**Method 2, log law first:** $y=3\\ln(2x+1)$.","**Differentiate:** $\\dfrac{dy}{dx}=3\\times\\dfrac{2}{2x+1}=\\dfrac{6}{2x+1}$.","**Compare:** both give $\\frac{6}{2x+1}$; method 2 is shorter and less error-prone."],"a":"$\\dfrac{6}{2x+1}$"},{"t":"ex","title":"Stationary point of a log function (full working)","q":"Find the stationary point of $y=x-2\\ln x$ ($x>0$) and determine its nature.","s":["**Differentiate:** $\\dfrac{dy}{dx}=1-\\dfrac2x$.","**Set equal to zero:** $1-\\dfrac2x=0\\Rightarrow\\dfrac2x=1\\Rightarrow x=2$. This is in the domain $x>0$.","**Find $y$:** $y=2-2\\ln2\\approx0.614$.","**Second derivative:** $\\dfrac{d^2y}{dx^2}=\\dfrac{2}{x^2}$, which at $x=2$ is $\\frac24=\\frac12>0$.","**Conclude:** positive second derivative means concave up, so a local minimum."],"a":"Local minimum at $\\left(2,\\ 2-2\\ln2\\right)$"},{"t":"ex","title":"Tangent to a log curve (full working)","q":"Find the equation of the tangent to $y=\\ln x$ at $x=e$, and show it passes through the origin.","s":["**Point:** $y=\\ln e=1$, so the point is $(e,1)$.","**Derivative:** $\\dfrac{dy}{dx}=\\dfrac1x$, so at $x=e$ the gradient is $m=\\dfrac1e$.","**Point-gradient form:** $y-1=\\dfrac1e(x-e)$.","**Simplify:** $y-1=\\dfrac xe-1\\Rightarrow y=\\dfrac xe$.","**Check the origin:** at $x=0$, $y=0$, so the tangent passes through $(0,0)$."],"a":"$y=\\dfrac{x}{e}$"},{"t":"warn","x":"$\\frac{d}{dx}\\ln(3x)$ is $\\frac1x$, **not** $\\frac1{3x}$. And $\\frac{d}{dx}\\ln(x^2+1)$ is $\\frac{2x}{x^2+1}$, **not** $\\frac{1}{x^2+1}$: always multiply by (put on top) the derivative of the inside."},{"t":"p","x":"**Exam tip.** If a question involves $\\ln$ of a product, quotient or power, write the log-law expansion as a separate line before differentiating. It shows the marker your method and reduces algebra errors."},{"t":"tb","rec":"1,4,6,10,11","ext":"14,16,17,19","x":"Exercise 1.7 practises $\\ln f(x)$ derivatives, tangents to log curves, and using log laws first.","code":"1.7"}],"checks":[{"topic":"Derivative of ln","q":"Differentiate $y=\\ln(5x-2)$.","a":"5/(5x-2)","alt":[],"ad":"$\\dfrac{5}{5x-2}$","sol":"The inside is $f(x)=5x-2$. || Its derivative is $f'(x)=5$. || Apply $\\frac{d}{dx}\\ln f=\\frac{f'}{f}$. || So $\\frac{dy}{dx}=\\frac{5}{5x-2}$.","h":["What is the inside?","Differentiate the inside.","Derivative of inside over the inside."]},{"topic":"ln of kx","q":"Differentiate $y=\\ln(7x)$.","a":"1/x","alt":[],"ad":"$\\dfrac1x$","sol":"Use the log law: $\\ln(7x)=\\ln7+\\ln x$. || $\\ln7$ is a constant, so its derivative is 0. || The derivative of $\\ln x$ is $\\frac1x$. || So $\\frac{dy}{dx}=\\frac1x$ (the 7 has no effect).","h":["Split with the product law.","Constants differentiate to 0.","$\\frac{d}{dx}\\ln x=\\frac1x$."]},{"topic":"Log laws first","q":"Differentiate $y=\\ln\\left(\\dfrac{x^4}{x+1}\\right)$.","a":"4/x-1/(x+1)","alt":["4/x - 1/(x+1)","(3x+4)/(x(x+1))"],"ad":"$\\dfrac4x-\\dfrac{1}{x+1}$","sol":"Expand with log laws: $y=\\ln x^4-\\ln(x+1)=4\\ln x-\\ln(x+1)$. || Differentiate the first term: $\\frac{4}{x}$. || Differentiate the second: $\\frac{1}{x+1}$. || So $\\frac{dy}{dx}=\\frac4x-\\frac1{x+1}$, which combines to $\\frac{3x+4}{x(x+1)}$.","h":["Use the quotient law to split the log.","Use the power law on $\\ln x^4$.","Differentiate each part."]},{"topic":"Gradient at a point","q":"Find the gradient of $y=\\ln(x^2+1)$ at $x=1$.","a":"1","alt":["m=1"],"ad":"$1$","sol":"Differentiate: $\\frac{dy}{dx}=\\frac{2x}{x^2+1}$. || Substitute $x=1$: $\\frac{2(1)}{1+1}$. || Simplify: $\\frac22=1$. || The gradient is 1.","h":["Use $\\frac{f'}{f}$.","The inside derivative is $2x$.","Substitute $x=1$."]},{"topic":"Stationary point","q":"Find the $x$-coordinate of the stationary point of $y=x-3\\ln x$.","a":"3","alt":["x=3"],"ad":"$x=3$","sol":"Differentiate: $\\frac{dy}{dx}=1-\\frac3x$. || Set to zero: $1-\\frac3x=0$. || So $\\frac3x=1$, giving $x=3$. || This is in the domain $x>0$, so it is valid.","h":["Differentiate each term.","Set the derivative to 0.","Solve for $x$."]}]},{"id":"mm3-c01-s7","code":"1.8","title":"Modelling and solving with exponential and logarithmic functions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: exponential growth and decay modelling","url":"https://www.youtube.com/results?search_query=Joel+Speranza+exponential+growth+and+decay+modelling","kind":"search"}]},{"t":"p","x":"**What this topic is about.** Putting everything together to model real situations: population growth, radioactive decay, drug concentration, cooling and compound growth. Modelling questions are usually long, multi-part and worth many marks in the exam, so a clear, labelled method matters as much as correct algebra."},{"t":"key","x":"**Growth and decay model:** $N=N_0e^{kt}$, where $N_0$ is the initial amount ($t=0$) and $k$ is the continuous growth rate ($k>0$ growth, $k\u003c0$ decay). Its rate of change is $\\frac{dN}{dt}=kN$."},{"t":"key","x":"**Half-life and doubling time:** half-life $t_{1/2}=\\dfrac{\\ln2}{|k|}$ (decay); doubling time $=\\dfrac{\\ln2}{k}$ (growth). **Limited growth / cooling:** $T=T_\\infty+Ae^{-kt}$ approaches the long-term value $T_\\infty$."},{"t":"p","x":"**A five-step modelling routine.** (1) **Define** the variables and units in words (\"$t$ is time in hours after 9 am\"). (2) **Find the parameters** from the given information: substitute $t=0$ to get the starting value, then a second data point to find $k$. Keep $k$ exact (as a log) until the end. (3) **Answer the question**: substitute for \"find the value\", set equal and solve for \"when\", differentiate for \"how fast\". (4) **Interpret** with units and context. (5) **Comment** on validity if asked: exponential growth cannot continue forever."},{"t":"p","x":"**Finding $k$ from two facts.** If $N=50$ at $t=0$ and $N=80$ at $t=4$: substituting gives $80=50e^{4k}$. Divide by 50: $e^{4k}=1.6$. Take logs: $4k=\\ln1.6$, so $k=\\frac14\\ln1.6\\approx0.1175$. Using the ratio of two values like this always removes $N_0$."},{"t":"p","x":"**Interpreting the sign of the derivative.** For decay, $\\frac{dN}{dt}\u003c0$. When a question asks \"at what rate is it decreasing?\", give the size (positive number) with the word \"decreasing\", or give the negative derivative and explain the sign. Both earn marks if clearly communicated."},{"t":"ex","title":"Worked model: radioactive decay (full working)","q":"A radioactive sample has a half-life of 6 hours and starts at 120 mg. (a) Find $k$ in $A=120e^{-kt}$. (b) How much remains after one day? (c) How fast is it decaying at that time?","s":["**(a) Use the half-life:** after 6 hours, $A=60$, so $60=120e^{-6k}$.","**Simplify:** $e^{-6k}=\\frac12$.","**Take logs:** $-6k=\\ln\\frac12=-\\ln2$, so $k=\\dfrac{\\ln2}{6}\\approx0.1155$.","**(b) Substitute $t=24$:** $A=120e^{-24k}=120e^{-4\\ln2}=120\\times2^{-4}=120\\times\\frac1{16}=7.5$ mg. (One day is four half-lives: $120\\to60\\to30\\to15\\to7.5$, a quick check.)","**(c) Differentiate:** $\\dfrac{dA}{dt}=-kA$.","**Substitute $t=24$:** $\\dfrac{dA}{dt}=-\\dfrac{\\ln2}{6}\\times7.5\\approx-0.866$ mg/h.","**Interpret:** after one day the sample is decaying at about 0.87 mg per hour."],"a":"(a) $k=\\frac{\\ln2}{6}$; (b) $7.5$ mg; (c) decreasing at about $0.87$ mg/h"},{"t":"ex","title":"Worked model: Newton's law of cooling (full working)","q":"Coffee cools according to $T=22+68e^{-kt}$ (\u00b0C, $t$ minutes). After 5 minutes it is 70\u00b0C. (a) Find $k$. (b) When does it reach 55\u00b0C? (c) How fast is it cooling then? (d) What temperature does it approach?","s":["**(a) Substitute the data point** $t=5$, $T=70$: $70=22+68e^{-5k}$.","**Isolate the exponential:** $68e^{-5k}=48\\Rightarrow e^{-5k}=\\frac{48}{68}=\\frac{12}{17}$.","**Take logs:** $-5k=\\ln\\frac{12}{17}$, so $k=-\\frac15\\ln\\frac{12}{17}=\\frac15\\ln\\frac{17}{12}\\approx0.0697$.","**(b) Set $T=55$:** $55=22+68e^{-kt}\\Rightarrow e^{-kt}=\\frac{33}{68}\\Rightarrow t=\\dfrac{\\ln(68/33)}{k}\\approx\\dfrac{0.7230}{0.0697}\\approx10.4$ minutes.","**(c) Differentiate:** $\\dfrac{dT}{dt}=-68ke^{-kt}$. Note $68e^{-kt}=T-22$, so $\\dfrac{dT}{dt}=-k(T-22)$.","**Substitute $T=55$:** $\\dfrac{dT}{dt}=-0.0697\\times33\\approx-2.30$ \u00b0C/min, so it is cooling at about 2.3 \u00b0C per minute.","**(d) Long term:** as $t\\to\\infty$, $e^{-kt}\\to0$, so $T\\to22$\u00b0C (room temperature, the horizontal asymptote)."],"a":"(a) $k\\approx0.0697$; (b) about $10.4$ min; (c) about $2.3$ \u00b0C/min; (d) $22$\u00b0C"},{"t":"ex","title":"Worked model: finding the model from data (full working)","q":"A town had 8000 people in 2020 and 9200 in 2025. Assuming $P=P_0e^{kt}$ with $t$ in years after 2020, find the model and predict when the population reaches 12 000.","s":["**Starting value:** at $t=0$, $P=8000$, so $P_0=8000$.","**Second data point:** at $t=5$, $9200=8000e^{5k}\\Rightarrow e^{5k}=1.15$.","**Solve for $k$:** $5k=\\ln1.15\\Rightarrow k=\\frac15\\ln1.15\\approx0.02795$.","**Model:** $P=8000e^{0.02795t}$.","**Set $P=12000$:** $12000=8000e^{kt}\\Rightarrow e^{kt}=1.5\\Rightarrow t=\\dfrac{\\ln1.5}{k}\\approx\\dfrac{0.4055}{0.02795}\\approx14.5$.","**Interpret:** about 14.5 years after 2020, i.e. during 2034 (mid-2034).","**Comment on validity:** this assumes the growth rate stays constant; housing, jobs and services would limit growth, so predictions far ahead are less reliable."],"a":"$P=8000e^{0.02795t}$; reaches 12 000 in about 2034"},{"t":"ex","title":"Worked model: drug concentration (full working)","q":"A drug amount in the body is $A=80e^{-0.2t}$ mg after $t$ hours. Find (a) the amount after 3 hours, (b) when it falls to 10 mg, (c) when it is decreasing at 4 mg/h.","s":["**(a) Substitute $t=3$:** $A=80e^{-0.6}\\approx80\\times0.5488\\approx43.9$ mg.","**(b) Set $A=10$:** $80e^{-0.2t}=10\\Rightarrow e^{-0.2t}=\\frac18$.","**Take logs:** $-0.2t=\\ln\\frac18=-\\ln8\\Rightarrow t=5\\ln8\\approx10.4$ hours.","**(c) Differentiate:** $\\dfrac{dA}{dt}=80\\times(-0.2)e^{-0.2t}=-16e^{-0.2t}$.","**\"Decreasing at 4 mg/h\" means $\\frac{dA}{dt}=-4$:** $-16e^{-0.2t}=-4\\Rightarrow e^{-0.2t}=\\frac14$.","**Solve:** $-0.2t=-\\ln4\\Rightarrow t=5\\ln4\\approx6.93$ hours."],"a":"(a) $43.9$ mg; (b) $5\\ln8\\approx10.4$ h; (c) $5\\ln4\\approx6.93$ h"},{"t":"warn","x":"Do not round $k$ early. Rounding $k=0.0697$ to $0.07$ in the cooling example changes the time in (b) noticeably. Store $k$ exactly (e.g. $\\frac15\\ln\\frac{17}{12}$) or keep it in your calculator memory."},{"t":"p","x":"**Exam tip: evaluating a model.** Typical marks: one for a limitation tied to the context (\"the population cannot grow forever because of limited resources\"), one for a suggested improvement (\"collect more data points\" or \"use a model that levels off, such as a limited growth model\")."},{"t":"tb","rec":"1,3,5,7,10,12","ext":"13,16,17,19","x":"Exercise 1.8 is word-problem modelling: growth, decay, half-life, rates and tangents to log curves.","code":"1.8"}],"checks":[{"topic":"Half-life","q":"A substance decays as $A=A_0e^{-0.05t}$ ($t$ in years). Find its exact half-life.","a":"20ln2","alt":["ln2/0.05","13.86","13.9"],"ad":"$20\\ln2\\approx13.9$ years","sol":"At the half-life $A=\\frac12A_0$, so $\\frac12A_0=A_0e^{-0.05t}$. || Cancel $A_0$: $e^{-0.05t}=\\frac12$. || Take logs: $-0.05t=\\ln\\frac12=-\\ln2$. || So $t=\\frac{\\ln2}{0.05}=20\\ln2\\approx13.9$ years.","h":["Set $A=\\frac12A_0$.","Cancel $A_0$.","Take $\\ln$ and divide by $-0.05$."]},{"topic":"Finding k","q":"A colony grows from 500 to 800 in 3 days, following $N=500e^{kt}$. Find $k$ exactly.","a":"(1/3)ln1.6","alt":["ln(1.6)/3","ln1.6/3","(1/3)ln(8/5)","0.157"],"ad":"$k=\\tfrac13\\ln1.6\\approx0.157$","sol":"Substitute $t=3$, $N=800$: $800=500e^{3k}$. || Divide by 500: $e^{3k}=1.6$. || Take logs: $3k=\\ln1.6$. || So $k=\\frac13\\ln1.6\\approx0.157$ per day.","h":["Substitute the second data point.","Divide by 500.","Take $\\ln$, then divide by 3."]},{"topic":"When does it reach","q":"$P=2000e^{0.06t}$. Find when $P=5000$, to 1 decimal place.","a":"15.3","alt":["t=15.3","15.27"],"ad":"$t=\\dfrac{\\ln2.5}{0.06}\\approx15.3$","sol":"Set $2000e^{0.06t}=5000$. || Divide: $e^{0.06t}=2.5$. || Take logs: $0.06t=\\ln2.5\\approx0.9163$. || So $t\\approx15.3$.","h":["Set $P=5000$.","Isolate the exponential.","Take $\\ln$ and divide by $0.06$."]},{"topic":"Cooling","q":"$T=20+70e^{-0.1t}$. Find the rate of cooling when $t=10$, to 2 decimal places (give the size).","a":"2.58","alt":["-2.58","2.575"],"ad":"$\\approx2.58$ \u00b0C per minute (decreasing)","sol":"Differentiate: $\\frac{dT}{dt}=70\\times(-0.1)e^{-0.1t}=-7e^{-0.1t}$. || Substitute $t=10$: $-7e^{-1}$. || Evaluate: $-7\\times0.3679\\approx-2.575$. || So it is cooling at about 2.58 \u00b0C per minute.","h":["Differentiate the exponential term only.","Substitute $t=10$.","Give the size of the rate."]},{"topic":"Long-term value","q":"For $T=18+60e^{-0.2t}$, state the initial temperature and the long-term temperature.","a":"78,18","alt":["78 and 18","initial 78, long term 18","78\u00b0C,18\u00b0C"],"ad":"Initial $78$\u00b0C; long term $18$\u00b0C","sol":"Initial value: substitute $t=0$: $T=18+60e^0=18+60=78$. || Long term: as $t\\to\\infty$, $e^{-0.2t}\\to0$. || So $T\\to18+0=18$. || The temperature starts at 78\u00b0C and approaches 18\u00b0C.","h":["Substitute $t=0$.","What happens to $e^{-0.2t}$ as $t$ grows?","The constant term is the long-term value."]}]},{"id":"mm3-c01-s8","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**What the exam rewards.** Marks are given for the correct method, accurate answers and clear communication. Write the rule you are using (\"by the quotient law\", \"using $\\frac{d}{dx}e^{f(x)}=f'(x)e^{f(x)}$\"), show substitutions, and give exact answers unless told to round. On the technology-active paper, still write the equation you are solving before using CAS."},{"t":"p","x":"**Command words.** *Determine / find / calculate*: show working to a result. *Show that*: you must reach exactly the stated result, so every line must follow from the last; never work backwards from the answer. *Hence*: you must use the previous part. *Evaluate the reasonableness of the model*: comment on accuracy, assumptions and limitations in context."},{"t":"p","x":"**Checklist for this chapter.** Limits: substitute, simplify ($\\frac00$), estimate. First principles: definition, expand, cancel $h$, then $h\\to0$. Ex
