_query=Joel+Speranza+antidifferentiation+integration","kind":"search"},{"src":"J","title":"Integrating exponentials and trig","url":"https://www.youtube.com/results?search_query=Joel+Speranza+integration+exponential+trigonometric","kind":"search"}],"sections":[{"id":"mm3-c05-s1","code":"5.2","title":"Anti-differentiation of rational functions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: anti-differentiation powers of x","url":"https://www.youtube.com/results?search_query=Joel+Speranza+anti-differentiation+powers+of+x","kind":"search"}]},{"t":"p","x":"**What this topic is about.** Anti-differentiation reverses differentiation: given a derivative, find the original function. It is the foundation of integration, which gives areas, total change, displacement from velocity and much of Unit 4. This first topic covers powers of $x$ (including negative and fractional powers) and $\\frac1{ax+b}$-type terms."},{"t":"key","x":"$$\\int x^n\\,dx=\\frac{x^{n+1}}{n+1}+c\\quad(n\\neq-1)\\qquad\\int\\frac1x\\,dx=\\ln|x|+c\\qquad\\int(ax+b)^n\\,dx=\\frac{(ax+b)^{n+1}}{a(n+1)}+c$$"},{"t":"p","x":"**Why $+c$?** The derivative of any constant is zero, so $x^2$, $x^2+5$ and $x^2-17$ all have derivative $2x$. An antiderivative is therefore a whole **family** of functions, $x^2+c$, each a vertical shift of the others. Omitting $+c$ from an indefinite integral loses a mark."},{"t":"p","x":"**The power rule in words.** Add one to the power, then divide by the new power. Check by differentiating: $\\frac{d}{dx}\\frac{x^{n+1}}{n+1}=\\frac{(n+1)x^n}{n+1}=x^n$ \u2713. The rule fails when $n=-1$ (it would divide by zero), which is why $\\int x^{-1}dx=\\ln|x|$ is a separate rule."},{"t":"p","x":"**Preparing the integrand.** You can only integrate term by term once the expression is a **sum of powers**. So: (1) rewrite roots as fractional powers ($\\sqrt x=x^{1/2}$, $\\sqrt[3]{x^2}=x^{2/3}$); (2) rewrite $\\frac1{x^k}$ as $x^{-k}$; (3) expand brackets; (4) split fractions with a single-term denominator ($\\frac{x^2+3}{x}=x+3x^{-1}$). There is no product or quotient rule for integration at this level, so never integrate factors separately."},{"t":"p","x":"**Linear insides.** If the inside is linear ($ax+b$), integrate as if it were $x$ and then **divide by $a$**, because differentiating would multiply by $a$. So $\\int(2x+1)^3dx=\\frac{(2x+1)^4}{4\\times2}+c=\\frac{(2x+1)^4}{8}+c$."},{"t":"ex","title":"Integrating a sum of powers (full working)","q":"Find $\\displaystyle\\int\\left(4x^3-\\frac{2}{x^2}+\\sqrt x\\right)dx$.","s":["**Rewrite every term as a power of $x$:** $4x^3-2x^{-2}+x^{1/2}$.","**Integrate $4x^3$:** add 1 to the power and divide: $4\\cdot\\frac{x^4}{4}=x^4$.","**Integrate $-2x^{-2}$:** the new power is $-1$: $-2\\cdot\\frac{x^{-1}}{-1}=2x^{-1}$.","**Integrate $x^{1/2}$:** the new power is $\\frac32$: $\\frac{x^{3/2}}{3/2}=\\frac23x^{3/2}$.","**Combine and add $c$:** $x^4+2x^{-1}+\\frac23x^{3/2}+c=x^4+\\dfrac2x+\\dfrac23x^{3/2}+c$.","**Check by differentiating:** $4x^3-2x^{-2}+x^{1/2}$ \u2713."],"a":"$x^4+\\dfrac2x+\\dfrac23x^{3/2}+c$"},{"t":"ex","title":"Expanding before integrating (full working)","q":"Find $\\displaystyle\\int\\frac{(x+2)^2}{x^4}\\,dx$.","s":["**Expand the numerator:** $(x+2)^2=x^2+4x+4$.","**Split the fraction:** $\\dfrac{x^2}{x^4}+\\dfrac{4x}{x^4}+\\dfrac4{x^4}=x^{-2}+4x^{-3}+4x^{-4}$.","**Integrate each term:** $\\dfrac{x^{-1}}{-1}+4\\cdot\\dfrac{x^{-2}}{-2}+4\\cdot\\dfrac{x^{-3}}{-3}$.","**Simplify:** $-x^{-1}-2x^{-2}-\\frac43x^{-3}+c$.","**Write with positive powers:** $-\\dfrac1x-\\dfrac2{x^2}-\\dfrac{4}{3x^3}+c$."],"a":"$-\\dfrac1x-\\dfrac2{x^2}-\\dfrac{4}{3x^3}+c$"},{"t":"ex","title":"Linear inside (full working)","q":"Find $\\displaystyle\\int(3x-1)^4\\,dx$ and $\\displaystyle\\int\\frac{5}{2x+3}\\,dx$.","s":["**First integral:** treat $3x-1$ like $x$: raise the power to 5 and divide by 5 to get $\\frac{(3x-1)^5}{5}$.","**Divide by the inner coefficient 3:** $\\dfrac{(3x-1)^5}{15}+c$. Check: differentiating gives $\\frac{5(3x-1)^4\\cdot3}{15}=(3x-1)^4$ \u2713.","**Second integral:** $\\int\\frac1{ax+b}dx=\\frac1a\\ln|ax+b|$, so $\\int\\frac{5}{2x+3}dx=5\\cdot\\frac12\\ln|2x+3|+c$.","**Simplify:** $\\dfrac52\\ln|2x+3|+c$."],"a":"$\\dfrac{(3x-1)^5}{15}+c$ and $\\dfrac52\\ln|2x+3|+c$"},{"t":"ex","title":"Finding a function from its derivative (full working)","q":"$f'(x)=6x^2-4$ and the graph of $f$ passes through $(1,5)$. Find $f(x)$.","s":["**Anti-differentiate:** $f(x)=\\int(6x^2-4)\\,dx=2x^3-4x+c$.","**Use the point:** $f(1)=5\\Rightarrow2-4+c=5$.","**Solve for $c$:** $c=7$.","**Write the function:** $f(x)=2x^3-4x+7$."],"a":"$f(x)=2x^3-4x+7$"},{"t":"warn","x":"There is no product rule for anti-differentiation: $\\int x(x+1)\\,dx$ is **not** $\\frac{x^2}2\\cdot\\frac{(x+1)^2}2$. Expand first: $\\int(x^2+x)\\,dx=\\frac{x^3}3+\\frac{x^2}2+c$. Also $\\int\\frac1x\\,dx$ is $\\ln|x|$, not $\\frac{x^0}{0}$."},{"t":"p","x":"**Exam tip.** Show the rewritten integrand (powers of $x$) as its own line. It earns a method mark and makes the integration almost automatic."},{"t":"tb","rec":"1,2,4,7,8,12","ext":"13,15,16,17,19","x":"Exercise 5.2 integrates polynomials, powers and $\\frac1{ax+b}$ forms.","code":"5.2"}],"checks":[{"topic":"Powers","q":"Find $\\displaystyle\\int(9x^2-4x+5)\\,dx$.","a":"3x^3-2x^2+5x+c","alt":["3x\u00b3-2x\u00b2+5x+c"],"ad":"$3x^3-2x^2+5x+c$","sol":"Integrate term by term, adding 1 to each power and dividing. || $\\int9x^2dx=9\\cdot\\frac{x^3}3=3x^3$. || $\\int(-4x)dx=-4\\cdot\\frac{x^2}2=-2x^2$, and $\\int5\\,dx=5x$. || So the answer is $3x^3-2x^2+5x+c$.","h":["Add 1 to each power.","Divide by the new power.","Remember $+c$."]},{"topic":"Negative and fractional powers","q":"Find $\\displaystyle\\int\\left(\\frac{3}{x^2}+\\sqrt{x}\\right)dx$.","a":"-3/x+(2/3)x^(3/2)+c","alt":["-3/x+2/3x^(3/2)+c","(2/3)x^(3/2)-3/x+c","-3x^(-1)+(2/3)x^(3/2)+c"],"ad":"$-\\dfrac3x+\\dfrac23x^{3/2}+c$","sol":"Rewrite: $3x^{-2}+x^{1/2}$. || $\\int3x^{-2}dx=3\\cdot\\frac{x^{-1}}{-1}=-3x^{-1}$. || $\\int x^{1/2}dx=\\frac{x^{3/2}}{3/2}=\\frac23x^{3/2}$. || Answer: $-\\frac3x+\\frac23x^{3/2}+c$.","h":["Write as powers of $x$.","$-2+1=-1$ and $\\frac12+1=\\frac32$.","Divide by the new powers."]},{"topic":"Linear inside","q":"Find $\\displaystyle\\int(4x+1)^3\\,dx$.","a":"(4x+1)^4/16+c","alt":["(1/16)(4x+1)^4+c","1/16(4x+1)^4+c"],"ad":"$\\dfrac{(4x+1)^4}{16}+c$","sol":"Raise the power: $\\frac{(4x+1)^4}{4}$. || Divide by the inner coefficient 4. || $\\frac{(4x+1)^4}{4\\times4}=\\frac{(4x+1)^4}{16}$. || Add $c$: $\\frac{(4x+1)^4}{16}+c$.","h":["Integrate as if the bracket were $x$.","Then divide by 4.","Add $c$."]},{"topic":"Reciprocal","q":"Find $\\displaystyle\\int\\frac{6}{3x-2}\\,dx$.","a":"2ln|3x-2|+c","alt":["2ln(3x-2)+c","2ln|3x-2|+c"],"ad":"$2\\ln|3x-2|+c$","sol":"Use $\\int\\frac{1}{ax+b}dx=\\frac1a\\ln|ax+b|+c$. || With $a=3$: $\\int\\frac{6}{3x-2}dx=6\\cdot\\frac13\\ln|3x-2|$. || Simplify: $2\\ln|3x-2|$. || Add $c$.","h":["It is a $\\frac1{ax+b}$ form.","Divide by $a=3$.","$6\\times\\frac13=2$."]},{"topic":"Initial condition","q":"$f'(x)=3x^2+2x$ and $f(1)=4$. Find $f(x)$.","a":"x^3+x^2+2","alt":["f(x)=x^3+x^2+2"],"ad":"$f(x)=x^3+x^2+2$","sol":"Anti-differentiate: $f(x)=x^3+x^2+c$. || Use $f(1)=4$: $1+1+c=4$. || So $c=2$. || $f(x)=x^3+x^2+2$.","h":["Integrate each term.","Substitute $x=1$.","Solve for $c$."]}]},{"id":"mm3-c05-s2","code":"5.3","title":"Anti-differentiation of exponential functions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: integrating e^x","url":"https://www.youtube.com/results?search_query=Joel+Speranza+integrating+e%5Ex","kind":"search"}]},{"t":"p","x":"**What this topic is about.** Anti-differentiating exponential functions. Because $\\frac{d}{dx}e^x=e^x$, the exponential is its own antiderivative, and with a linear power you divide by the coefficient. These integrals appear in growth and decay problems and in area questions."},{"t":"key","x":"$$\\int e^x\\,dx=e^x+c\\qquad\\int e^{kx}\\,dx=\\frac1ke^{kx}+c\\qquad\\int e^{ax+b}\\,dx=\\frac1ae^{ax+b}+c$$"},{"t":"p","x":"**Why divide by $a$?** Differentiating $e^{ax+b}$ multiplies by $a$ (chain rule). To undo that, the antiderivative must contain $\\frac1a$. Always check: $\\frac{d}{dx}\\frac14e^{4x}=\\frac14\\cdot4e^{4x}=e^{4x}$ \u2713."},{"t":"p","x":"**Non-linear powers.** The simple rule only works when the power is linear. $\\int e^{x^2}dx$ cannot be done with these methods. However, if the derivative of the power appears as a factor, you can reverse the chain rule: $\\int2xe^{x^2}dx=e^{x^2}+c$, because $\\frac{d}{dx}e^{x^2}=2xe^{x^2}$. Adjust constants as needed: $\\int xe^{x^2}dx=\\frac12e^{x^2}+c$."},{"t":"p","x":"**Simplify with index laws first.** $\\int\\frac{e^{2x}+1}{e^x}dx=\\int(e^x+e^{-x})dx=e^x-e^{-x}+c$. Dividing each term by $e^x$ first turns a quotient into a sum of simple exponentials."},{"t":"ex","title":"Exponentials with coefficients (full working)","q":"Find $\\displaystyle\\int\\left(6e^{2x}+e^{-x}-4\\right)dx$.","s":["**First term:** $\\int6e^{2x}dx=6\\times\\frac12e^{2x}=3e^{2x}$.","**Second term:** $\\int e^{-x}dx=\\frac{1}{-1}e^{-x}=-e^{-x}$.","**Third term:** $\\int-4\\,dx=-4x$.","**Combine:** $3e^{2x}-e^{-x}-4x+c$.","**Check:** $\\frac{d}{dx}(3e^{2x}-e^{-x}-4x)=6e^{2x}+e^{-x}-4$ \u2713."],"a":"$3e^{2x}-e^{-x}-4x+c$"},{"t":"ex","title":"Simplifying with index laws (full working)","q":"Find $\\displaystyle\\int\\frac{e^{3x}+2}{e^{x}}\\,dx$.","s":["**Split the fraction:** $\\dfrac{e^{3x}}{e^x}+\\dfrac{2}{e^x}$.","**Index laws:** $e^{3x-x}+2e^{-x}=e^{2x}+2e^{-x}$.","**Integrate:** $\\frac12e^{2x}+2\\cdot\\frac{1}{-1}e^{-x}$.","**Simplify:** $\\frac12e^{2x}-2e^{-x}+c$."],"a":"$\\tfrac12e^{2x}-2e^{-x}+c$"},{"t":"ex","title":"Reverse chain rule (full working)","q":"Find $\\displaystyle\\int xe^{x^2}\\,dx$.","s":["**Guess a function whose derivative contains $e^{x^2}$:** try $e^{x^2}$.","**Differentiate the guess:** $\\frac{d}{dx}e^{x^2}=2xe^{x^2}$.","**Compare with the integrand:** we want $xe^{x^2}$, which is half of $2xe^{x^2}$.","**Adjust the constant:** $\\int xe^{x^2}dx=\\frac12e^{x^2}+c$."],"a":"$\\tfrac12e^{x^2}+c$"},{"t":"ex","title":"Worded problem: from a growth rate (full working)","q":"A colony grows at $\\frac{dN}{dt}=60e^{0.3t}$ cells per hour, and $N(0)=200$. Find $N(t)$ and the number of cells after 4 hours.","s":["**Anti-differentiate:** $N=\\int60e^{0.3t}dt=60\\times\\frac{1}{0.3}e^{0.3t}+c=200e^{0.3t}+c$.","**Use $N(0)=200$:** $200e^0+c=200\\Rightarrow c=0$.","**Model:** $N(t)=200e^{0.3t}$.","**After 4 hours:** $N(4)=200e^{1.2}\\approx200\\times3.3201\\approx664$ cells."],"a":"$N(t)=200e^{0.3t}$; about 664 cells after 4 hours"},{"t":"warn","x":"$\\int e^{4x}dx$ is $\\frac14e^{4x}+c$, not $4e^{4x}+c$ (that is the derivative), and not $\\frac{e^{4x+1}}{4x+1}$ (the power rule does not apply to exponentials)."},{"t":"p","x":"**Exam tip.** For \"find the function\" questions, state the value of $c$ on its own line before writing the final function."},{"t":"tb","rec":"1,3,5,9,11,12","ext":"13,15,16,17,20","x":"Exercise 5.3 integrates $e^{ax+b}$ and uses initial conditions.","code":"5.3"}],"checks":[{"topic":"Exponential","q":"Find $\\displaystyle\\int e^{5x}\\,dx$.","a":"(1/5)e^(5x)+c","alt":["e^(5x)/5+c","1/5e^(5x)+c","0.2e^(5x)+c"],"ad":"$\\tfrac15e^{5x}+c$","sol":"Use $\\int e^{kx}dx=\\frac1ke^{kx}+c$. || Here $k=5$. || So $\\int e^{5x}dx=\\frac15e^{5x}+c$. || Check: $\\frac{d}{dx}\\frac15e^{5x}=e^{5x}$.","h":["Divide by the coefficient of $x$.","$k=5$.","Add $c$."]},{"topic":"Negative power","q":"Find $\\displaystyle\\int4e^{-2x}\\,dx$.","a":"-2e^(-2x)+c","alt":["-2e^-2x+c"],"ad":"$-2e^{-2x}+c$","sol":"$\\int e^{-2x}dx=\\frac{1}{-2}e^{-2x}$. || Multiply by 4: $4\\times\\left(-\\frac12\\right)e^{-2x}=-2e^{-2x}$. || Add $c$. || Answer: $-2e^{-2x}+c$.","h":["Divide by $-2$.","Multiply by 4.","Watch the sign."]},{"topic":"Index laws","q":"Find $\\displaystyle\\int\\frac{e^{2x}-1}{e^{x}}\\,dx$.","a":"e^x+e^(-x)+c","alt":["e^x+e^-x+c"],"ad":"$e^x+e^{-x}+c$","sol":"Split and simplify: $\\frac{e^{2x}}{e^x}-\\frac1{e^x}=e^x-e^{-x}$. || $\\int e^x\\,dx=e^x$. || $\\int(-e^{-x})\\,dx=-\\frac{1}{-1}e^{-x}=e^{-x}$. || Answer: $e^x+e^{-x}+c$.","h":["Divide each term by $e^x$.","$\\frac1{e^x}=e^{-x}$.","Integrate each term."]},{"topic":"Reverse chain","q":"Find $\\displaystyle\\int3x^2e^{x^3}\\,dx$.","a":"e^(x^3)+c","alt":["e^x^3+c"],"ad":"$e^{x^3}+c$","sol":"Guess $e^{x^3}$. || Its derivative is $3x^2e^{x^3}$ (chain rule). || That is exactly the integrand. || So the answer is $e^{x^3}+c$.","h":["Try $e^{x^3}$.","Differentiate your guess.","Compare with the integrand."]},{"topic":"Initial value","q":"$\\frac{dy}{dx}=2e^{2x}$ and $y(0)=5$. Find $y$.","a":"e^(2x)+4","alt":["y=e^(2x)+4"],"ad":"$y=e^{2x}+4$","sol":"Integrate: $y=2\\cdot\\frac12e^{2x}+c=e^{2x}+c$. || Use $y(0)=5$: $e^0+c=5$, so $1+c=5$. || $c=4$. || $y=e^{2x}+4$.","h":["Integrate.","Substitute $x=0$.","$e^0=1$."]}]},{"id":"mm3-c05-s3","code":"5.4","title":"Anti-differentiation of logarithmic functions (via $\\frac1x$)","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: integrating 1/x and f prime over f","url":"https://www.youtube.com/results?search_query=Joel+Speranza+integrating+1%2Fx+and+f+prime+over+f","kind":"search"}]},{"t":"p","x":"**What this topic is about.** Integrals whose answer is a natural logarithm. They come from reversing $\\frac{d}{dx}\\ln|f(x)|=\\frac{f'(x)}{f(x)}$, and they appear whenever a fraction's numerator is (a multiple of) the derivative of its denominator."},{"t":"key","x":"$$\\int\\frac1x\\,dx=\\ln|x|+c\\qquad\\int\\frac{1}{ax+b}\\,dx=\\frac1a\\ln|ax+b|+c\\qquad\\int\\frac{f'(x)}{f(x)}\\,dx=\\ln|f(x)|+c$$"},{"t":"p","x":"**Why the absolute value?** $\\ln x$ is only defined for $x>0$, but $\\frac1x$ exists for negative $x$ too. Since $\\frac{d}{dx}\\ln(-x)=\\frac{-1}{-x}=\\frac1x$, the antiderivative of $\\frac1x$ for $x\u003c0$ is $\\ln(-x)$. Writing $\\ln|x|$ covers both. If the question states $x>0$ (or the inside is always positive, like $x^2+1$), you may drop the bars."},{"t":"p","x":"**Recognising $\\frac{f'}{f}$.** Differentiate the denominator and compare it with the numerator. If they match exactly, the answer is $\\ln|\\text{denominator}|+c$. If they differ by a constant factor, adjust: $\\int\\frac{x}{x^2+5}dx$: the derivative of $x^2+5$ is $2x$, and the numerator is $\\frac12$ of that, so the answer is $\\frac12\\ln(x^2+5)+c$."},{"t":"p","x":"**When it is not a log.** If the numerator is not a constant multiple of the derivative of the denominator, the answer is not simply a log. For example $\\int\\frac{x^2+1}{x}dx$ should be split: $\\int\\left(x+\\frac1x\\right)dx=\\frac{x^2}2+\\ln|x|+c$."},{"t":"ex","title":"Recognising $\\frac{f'}{f}$ (full working)","q":"Find $\\displaystyle\\int\\frac{2x}{x^2+1}\\,dx$.","s":["**Differentiate the denominator:** $\\frac{d}{dx}(x^2+1)=2x$.","**Compare with the numerator:** it is exactly $2x$, so the integrand is $\\frac{f'(x)}{f(x)}$ with $f(x)=x^2+1$.","**Apply the rule:** $\\int\\frac{f'}{f}dx=\\ln|f|+c$.","**Simplify the absolute value:** $x^2+1>0$ always, so $\\ln(x^2+1)+c$."],"a":"$\\ln(x^2+1)+c$"},{"t":"ex","title":"Adjusting a constant (full working)","q":"Find $\\displaystyle\\int\\frac{6x^2}{x^3+1}\\,dx$ for $x>-1$.","s":["**Derivative of the denominator:** $\\frac{d}{dx}(x^3+1)=3x^2$.","**Compare:** $6x^2=2\\times3x^2$, so the integrand is $2\\times\\frac{f'}{f}$.","**Integrate:** $2\\ln|x^3+1|+c$.","**Domain:** for $x>-1$, $x^3+1>0$, so write $2\\ln(x^3+1)+c$."],"a":"$2\\ln(x^3+1)+c$"},{"t":"ex","title":"Splitting a fraction (full working)","q":"Find $\\displaystyle\\int\\frac{x^2+3x+2}{x}\\,dx$ for $x>0$.","s":["**The numerator is not a multiple of the derivative of $x$ (which is 1)**, so split instead.","**Divide each term by $x$:** $x+3+\\dfrac2x$.","**Integrate each term:** $\\dfrac{x^2}{2}+3x+2\\ln x$.","**Add $c$:** $\\dfrac{x^2}2+3x+2\\ln x+c$ (no absolute value needed since $x>0$)."],"a":"$\\dfrac{x^2}{2}+3x+2\\ln x+c$"},{"t":"ex","title":"Definite integral with a log (full working)","q":"Evaluate $\\displaystyle\\int_1^e\\frac{3}{x}\\,dx$ exactly.","s":["**Antiderivative:** $3\\ln|x|$.","**Substitute the limits:** $\\left[3\\ln x\\right]_1^e=3\\ln e-3\\ln1$.","**Use $\\ln e=1$ and $\\ln1=0$:** $3(1)-3(0)$.","**Result:** $3$."],"a":"$3$"},{"t":"warn","x":"$\\int\\frac{1}{x^2}dx$ is **not** $\\ln(x^2)$: here the numerator is not the derivative of $x^2$. Rewrite as $x^{-2}$ and use the power rule: $-\\frac1x+c$."},{"t":"p","x":"**Exam tip.** Write \"since the numerator is the derivative of the denominator\" as your justification line. It shows the marker why a log appears."},{"t":"tb","rec":"1,4,5,8,11,12","ext":"13,15,16,19,20","x":"Exercise 5.4 uses $\\int\\frac1{ax+b}$ and $\\frac{f'}{f}$ forms.","code":"5.4"}],"checks":[{"topic":"Basic log","q":"Find $\\displaystyle\\int\\frac{5}{x}\\,dx$ for $x>0$.","a":"5lnx+c","alt":["5ln(x)+c","5ln|x|+c"],"ad":"$5\\ln x+c$","sol":"Take the constant out: $5\\int\\frac1x\\,dx$. || $\\int\\frac1x\\,dx=\\ln|x|$. || Since $x>0$, $|x|=x$. || Answer: $5\\ln x+c$.","h":["Constants come out.","$\\int\\frac1x=\\ln|x|$.","$x>0$."]},{"topic":"f prime over f","q":"Find $\\displaystyle\\int\\frac{3x^2}{x^3+4}\\,dx$ for $x>0$.","a":"ln(x^3+4)+c","alt":["ln|x^3+4|+c"],"ad":"$\\ln(x^3+4)+c$","sol":"Differentiate the denominator: $3x^2$. || It equals the numerator exactly. || So the integral is $\\ln|x^3+4|+c$. || For $x>0$ the inside is positive: $\\ln(x^3+4)+c$.","h":["Differentiate the bottom.","Compare with the top.","Use $\\ln|f|$."]},{"topic":"Adjust constant","q":"Find $\\displaystyle\\int\\frac{x}{x^2+9}\\,dx$.","a":"(1/2)ln(x^2+9)+c","alt":["1/2ln(x^2+9)+c","ln(x^2+9)/2+c"],"ad":"$\\tfrac12\\ln(x^2+9)+c$","sol":"The derivative of $x^2+9$ is $2x$. || The numerator $x$ is half of $2x$. || So the integral is $\\frac12\\ln(x^2+9)+c$. || No absolute value is needed because $x^2+9>0$.","h":["Differentiate the denominator.","The numerator is half of that.","Multiply the log by $\\frac12$."]},{"topic":"Split","q":"Find $\\displaystyle\\int\\frac{2x+1}{x}\\,dx$ for $x>0$.","a":"2x+lnx+c","alt":["2x+ln(x)+c","lnx+2x+c"],"ad":"$2x+\\ln x+c$","sol":"Split: $\\frac{2x}{x}+\\frac1x=2+\\frac1x$. || $\\int2\\,dx=2x$. || $\\int\\frac1x\\,dx=\\ln x$ (for $x>0$). || Answer: $2x+\\ln x+c$.","h":["Divide each term by $x$.","Integrate 2 and $\\frac1x$.","Add $c$."]},{"topic":"Definite","q":"Evaluate $\\displaystyle\\int_0^1\\frac{2}{2x+1}\\,dx$ exactly.","a":"ln3","alt":["ln(3)"],"ad":"$\\ln3$","sol":"The derivative of $2x+1$ is 2, the numerator, so the antiderivative is $\\ln|2x+1|$. || Evaluate: $\\ln3-\\ln1$. || $\\ln1=0$. || The integral equals $\\ln3$.","h":["Numerator is the derivative of the denominator.","Substitute 1 and 0.","$\\ln1=0$."]}]},{"id":"mm3-c05-s4","code":"5.5","title":"Anti-differentiation of trigonometric functions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: integrating sin and cos","url":"https://www.youtube.com/results?search_query=Joel+Speranza+integrating+sin+and+cos","kind":"search"}]},{"t":"p","x":"**What this topic is about.** Anti-differentiating sine and cosine (with linear angles). These integrals model periodic quantities: total water flow over a tidal cycle, displacement of an oscillating object, and areas under trig curves."},{"t":"key","x":"$$\\int\\sin x\\,dx=-\\cos x+c\\qquad\\int\\cos x\\,dx=\\sin x+c$$ $$\\int\\sin(ax+b)\\,dx=-\\frac1a\\cos(ax+b)+c\\qquad\\int\\cos(ax+b)\\,dx=\\frac1a\\sin(ax+b)+c$$"},{"t":"p","x":"**Getting the signs right.** Differentiation cycles $\\sin\\to\\cos\\to-\\sin\\to-\\cos\\to\\sin$. Integration goes the opposite way: $\\int\\cos=\\sin$ and $\\int\\sin=-\\cos$. A quick sanity check: the area under $\\sin x$ from $0$ to $\\pi$ is clearly positive, and $[-\\cos x]_0^\\pi=1-(-1)=2>0$, confirming the minus sign is needed."},{"t":"p","x":"**Linear angle: divide by the coefficient.** Just as with exponentials, differentiating $\\sin(ax+b)$ multiplies by $a$, so integrating divides by $a$. For angles like $\\frac{\\pi t}{6}$, dividing by $\\frac\\pi6$ means multiplying by $\\frac6\\pi$."},{"t":"p","x":"**Using identities first.** Some integrands need rewriting: $\\sin x\\cos x=\\frac12\\sin2x$; $\\int\\sec^2x\\,dx=\\tan x+c$ (from $\\frac{d}{dx}\\tan x=\\sec^2x$)."},{"t":"ex","title":"Integrating trig with linear angles (full working)","q":"Find $\\displaystyle\\int\\left(3\\cos2x-\\sin\\frac x2\\right)dx$.","s":["**First term:** $\\int\\cos2x\\,dx=\\frac12\\sin2x$, so $3\\times\\frac12\\sin2x=\\frac32\\sin2x$.","**Second term:** $\\int\\sin\\frac x2dx=-\\frac{1}{1/2}\\cos\\frac x2=-2\\cos\\frac x2$.","**Attach the minus sign in front of the second term:** $-(-2\\cos\\frac x2)=+2\\cos\\frac x2$.","**Combine:** $\\frac32\\sin2x+2\\cos\\frac x2+c$.","**Check:** $\\frac{d}{dx}$ gives $3\\cos2x-\\sin\\frac x2$ \u2713."],"a":"$\\tfrac32\\sin2x+2\\cos\\tfrac x2+c$"},{"t":"ex","title":"Definite trig integral (full working)","q":"Evaluate $\\displaystyle\\int_0^{\\pi/4}\\cos(2x)\\,dx$.","s":["**Antiderivative:** $\\frac12\\sin(2x)$.","**Substitute limits:** $\\left[\\frac12\\sin2x\\right]_0^{\\pi/4}=\\frac12\\sin\\frac\\pi2-\\frac12\\sin0$.","**Exact values:** $\\sin\\frac\\pi2=1$, $\\sin0=0$.","**Result:** $\\frac12$."],"a":"$\\tfrac12$"},{"t":"ex","title":"Using a double-angle identity (full working)","q":"Find $\\displaystyle\\int\\sin x\\cos x\\,dx$.","s":["**Recall** $\\sin2x=2\\sin x\\cos x$, so $\\sin x\\cos x=\\frac12\\sin2x$.","**Rewrite the integral:** $\\int\\frac12\\sin2x\\,dx$.","**Integrate:** $\\frac12\\times\\left(-\\frac12\\cos2x\\right)=-\\frac14\\cos2x$.","**Add $c$:** $-\\frac14\\cos2x+c$. (Another valid form is $\\frac12\\sin^2x+c$; the two differ only by a constant.)"],"a":"$-\\tfrac14\\cos2x+c$"},{"t":"ex","title":"Worded problem: total flow (full working)","q":"Water flows into a tank at $r(t)=5+2\\sin\\left(\\frac{\\pi t}{6}\\right)$ L/min. How much flows in during the first 6 minutes?","s":["**Total amount is the integral of the rate:** $\\int_0^6\\left(5+2\\sin\\frac{\\pi t}6\\right)dt$.","**Antiderivative:** $5t-2\\times\\frac6\\pi\\cos\\frac{\\pi t}6=5t-\\frac{12}\\pi\\cos\\frac{\\pi t}6$.","**Upper limit $t=6$:** $30-\\frac{12}\\pi\\cos\\pi=30+\\frac{12}\\pi$.","**Lower limit $t=0$:** $0-\\frac{12}\\pi\\cos0=-\\frac{12}\\pi$.","**Subtract:** $30+\\frac{12}\\pi-\\left(-\\frac{12}\\pi\\right)=30+\\frac{24}\\pi\\approx37.6$ L."],"a":"$30+\\frac{24}{\\pi}\\approx37.6$ litres"},{"t":"warn","x":"The most common sign error: $\\int\\sin x\\,dx=-\\cos x$, not $\\cos x$. And with $\\sin(3x)$, divide by 3; do not multiply."},{"t":"p","x":"**Exam tip.** In technology-free papers, write the exact values used ($\\cos\\pi=-1$) as you substitute limits; it earns the evaluation mark even if arithmetic slips later."},{"t":"tb","rec":"1,3,6,9,10,12","ext":"14,16,17,18,20","x":"Exercise 5.5 integrates $\\sin$ and $\\cos$ with linear arguments.","code":"5.5"}],"checks":[{"topic":"Cosine","q":"Find $\\displaystyle\\int\\cos(4x)\\,dx$.","a":"(1/4)sin(4x)+c","alt":["sin(4x)/4+c","1/4sin(4x)+c"],"ad":"$\\tfrac14\\sin(4x)+c$","sol":"$\\int\\cos(ax)dx=\\frac1a\\sin(ax)$. || Here $a=4$. || So the answer is $\\frac14\\sin(4x)$. || Add $c$.","h":["$\\int\\cos=\\sin$.","Divide by 4.","Add $c$."]},{"topic":"Sine","q":"Find $\\displaystyle\\int6\\sin(3x)\\,dx$.","a":"-2cos(3x)+c","alt":["-2cos3x+c"],"ad":"$-2\\cos(3x)+c$","sol":"$\\int\\sin(3x)dx=-\\frac13\\cos(3x)$. || Multiply by 6: $6\\times\\left(-\\frac13\\right)\\cos(3x)$. || $=-2\\cos(3x)$. || Add $c$.","h":["$\\int\\sin=-\\cos$.","Divide by 3.","Multiply by 6."]},{"topic":"Definite","q":"Evaluate $\\displaystyle\\int_0^{\\pi/2}\\sin x\\,dx$.","a":"1","alt":[],"ad":"$1$","sol":"Antiderivative: $-\\cos x$. || $\\left[-\\cos x\\right]_0^{\\pi/2}=-\\cos\\frac\\pi2-(-\\cos0)$. || $=0+1$. || The integral equals 1.","h":["$\\int\\sin x=-\\cos x$.","$\\cos\\frac\\pi2=0$, $\\cos0=1$.","Upper minus lower."]},{"topic":"Mixed","q":"Find $\\displaystyle\\int(\\sin2x+4\\cos x)\\,dx$.","a":"-(1/2)cos2x+4sinx+c","alt":["-cos(2x)/2+4sin(x)+c","4sinx-(1/2)cos2x+c","-1/2cos2x+4sinx+c"],"ad":"$-\\tfrac12\\cos2x+4\\sin x+c$","sol":"$\\int\\sin2x\\,dx=-\\frac12\\cos2x$. || $\\int4\\cos x\\,dx=4\\sin x$. || Add them. || $-\\frac12\\cos2x+4\\sin x+c$.","h":["Integrate each term.","Divide by 2 in the first.","$\\int\\cos x=\\sin x$."]},{"topic":"Identity","q":"Evaluate $\\displaystyle\\int_0^{\\pi/2}\\sin x\\cos x\\,dx$.","a":"1/2","alt":["0.5"],"ad":"$\\tfrac12$","sol":"Rewrite: $\\sin x\\cos x=\\frac12\\sin2x$. || Antiderivative: $-\\frac14\\cos2x$. || $\\left[-\\frac14\\cos2x\\right]_0^{\\pi/2}=-\\frac14\\cos\\pi+\\frac14\\cos0=\\frac14+\\frac14$. || The integral equals $\\frac12$.","h":["Use $\\sin2x=2\\sin x\\cos x$.","Integrate $\\frac12\\sin2x$.","$\\cos\\pi=-1$."]}]},{"id":"mm3-c05-s5","code":"5.6","title":"Further integration and initial conditions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: definite integrals and area","url":"https://www.youtube.com/results?search_query=Joel+Speranza+definite+integrals+and+area","kind":"search"},{"src":"B","title":"3Blue1Brown: Integration and the fundamental theorem of calculus","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Integration+and+the+fundamental+theorem+of+calculus","kind":"search"}]},{"t":"p","x":"**What this topic is about.** Using initial conditions to find the exact function, and evaluating **definite integrals**, which give a number rather than a family of functions. Definite integrals measure total change and area, and they connect anti-differentiation to geometry (the fundamental theorem of calculus)."},{"t":"key","x":"**Definite integral:** $\\displaystyle\\int_a^bf(x)\\,dx=\\big[F(x)\\big]_a^b=F(b)-F(a)$, where $F$ is any antiderivative of $f$. No $+c$ is needed (it cancels). **Total change:** $\\displaystyle\\int_a^bf'(x)\\,dx=f(b)-f(a)$."},{"t":"p","x":"**Signed area.** If $f(x)\\ge0$ on $[a,b]$, $\\int_a^bf(x)\\,dx$ is the area between the curve and the $x$-axis. Area **below** the axis is counted as **negative**. So for the total (geometric) area of a region that crosses the axis, find the $x$-intercepts, integrate each piece separately, and add the absolute values."},{"t":"key","x":"**Area between two curves:** if $f(x)\\ge g(x)$ on $[a,b]$, the area between them is $\\displaystyle\\int_a^b\\big(f(x)-g(x)\\big)\\,dx$ (top minus bottom). Find where they intersect to get the limits."},{"t":"p","x":"**Setting out a definite integral for full marks.** (1) Write the antiderivative in square brackets with the limits. (2) Substitute the upper limit, then subtract the substitution of the lower limit, using brackets. (3) Evaluate exactly. (4) For areas, state the answer with \"square units\" and make it positive."},{"t":"ex","title":"Initial condition (full working)","q":"$f'(x)=6x^2-4x+1$ and $f(2)=10$. Find $f(x)$ and $f(0)$.","s":["**Anti-differentiate:** $f(x)=2x^3-2x^2+x+c$.","**Use the condition $f(2)=10$:** $2(8)-2(4)+2+c=10\\Rightarrow16-8+2+c=10$.","**Solve:** $10+c=10\\Rightarrow c=0$.","**Function:** $f(x)=2x^3-2x^2+x$, so $f(0)=0$."],"a":"$f(x)=2x^3-2x^2+x$; $f(0)=0$"},{"t":"ex","title":"Definite integral (full working)","q":"Evaluate $\\displaystyle\\int_1^3\\left(3x^2-2x\\right)dx$.","s":["**Antiderivative:** $x^3-x^2$.","**Bracket notation:** $\\left[x^3-x^2\\right]_1^3$.","**Upper limit:** $27-9=18$.","**Lower limit:** $1-1=0$.","**Subtract:** $18-0=18$."],"a":"$18$"},{"t":"ex","title":"Area that crosses the axis (full working)","q":"Find the total area between $y=x^2-4$ and the $x$-axis for $0\\le x\\le3$.","s":["**Find where the curve crosses the axis:** $x^2-4=0\\Rightarrow x=2$ (in the interval). The curve is below the axis on $[0,2]$ and above on $[2,3]$.","**First piece:** $\\int_0^2(x^2-4)dx=\\left[\\frac{x^3}3-4x\\right]_0^2=\\frac83-8=-\\frac{16}3$ (negative because it is below the axis).","**Second piece:** $\\int_2^3(x^2-4)dx=\\left[\\frac{x^3}3-4x\\right]_2^3=(9-12)-\\left(\\frac83-8\\right)=-3+\\frac{16}3=\\frac73$.","**Add the sizes:** total area $=\\frac{16}3+\\frac73=\\frac{23}3$ square units.","**Compare:** the plain integral $\\int_0^3$ would give $-\\frac{16}3+\\frac73=-3$, which is not an area."],"a":"$\\frac{23}{3}$ square units"},{"t":"ex","title":"Area between two curves (full working)","q":"Find the area enclosed between $y=x$ and $y=x^2$.","s":["**Intersections:** $x^2=x\\Rightarrow x(x-1)=0\\Rightarrow x=0,1$.","**Which is on top?** At $x=\\frac12$: $y=x$ gives $0.5$, $y=x^2$ gives $0.25$. So $y=x$ is above on $[0,1]$.","**Integrate top minus bottom:** $\\int_0^1(x-x^2)dx=\\left[\\frac{x^2}2-\\frac{x^3}3\\right]_0^1$.","**Evaluate:** $\\frac12-\\frac13=\\frac16$."],"a":"$\\frac16$ square units"},{"t":"warn","x":"A definite integral is a **signed** area. Never report a negative number as an area, and never integrate straight across an $x$-intercept when the question asks for total area."},{"t":"p","x":"**Exam tip.** A quick sketch showing which parts are above and below the axis earns method marks and prevents the most common area error."},{"t":"tb","rec":"1,5,6,9,10,11,12","ext":"13,15,16,17,19","x":"Exercise 5.6 uses definite integrals, areas and initial-condition problems.","code":"5.6"},{"t":"int","name":"riemann","cap":"Add rectangles and watch the estimate close in on the exact integral. A definite integral is the limit of such sums."}],"checks":[{"topic":"Initial condition","q":"$f'(x)=4x^3-2$ and $f(1)=5$. Find $f(x)$.","a":"x^4-2x+6","alt":["f(x)=x^4-2x+6"],"ad":"$f(x)=x^4-2x+6$","sol":"Anti-differentiate: $f(x)=x^4-2x+c$. || Use $f(1)=5$: $1-2+c=5$. || So $c=6$. || $f(x)=x^4-2x+6$.","h":["Integrate each term.","Substitute $x=1$.","Solve for $c$."]},{"topic":"Definite","q":"Evaluate $\\displaystyle\\int_0^2(x^3+1)\\,dx$.","a":"6","alt":[],"ad":"$6$","sol":"Antiderivative: $\\frac{x^4}4+x$. || Upper limit: $\\frac{16}4+2=6$. || Lower limit: $0$. || Integral $=6-0=6$.","h":["Integrate.","Substitute 2 and 0.","Upper minus lower."]},{"topic":"Exponential definite","q":"Evaluate $\\displaystyle\\int_0^{\\ln2}e^{x}\\,dx$.","a":"1","alt":[],"ad":"$1$","sol":"Antiderivative: $e^x$. || $\\left[e^x\\right]_0^{\\ln2}=e^{\\ln2}-e^0$. || $=2-1$. || The integral equals 1.","h":["$\\int e^x=e^x$.","$e^{\\ln2}=2$.","$e^0=1$."]},{"topic":"Area crossing axis","q":"Find the total area between $y=x-1$ and the $x$-axis for $0\\le x\\le2$.","a":"1","alt":[],"ad":"$1$ square unit","sol":"The line crosses the axis at $x=1$. || $\\int_0^1(x-1)dx=\\left[\\frac{x^2}2-x\\right]_0^1=-\\frac12$ (below the axis). || $\\int_1^2(x-1)dx=\\left[\\frac{x^2}2-x\\right]_1^2=0-\\left(-\\frac12\\right)=\\frac12$. || Total area $=\\frac12+\\frac12=1$.","h":["Where does the line cross the axis?","Integrate each piece.","Add the sizes."]},{"topic":"Between curves","q":"Find the area between $y=4-x^2$ and $y=0$.","a":"32/3","alt":["10.67","10.667"],"ad":"$\\dfrac{32}{3}$ square units","sol":"The curve meets $y=0$ at $x=\\pm2$, and it is above the axis between them. || Area $=\\int_{-2}^2(4-x^2)dx=\\left[4x-\\frac{x^3}3\\right]_{-2}^2$. || Upper: $8-\\frac83=\\frac{16}3$. Lower: $-8+\\frac83=-\\frac{16}3$. || Area $=\\frac{16}3-\\left(-\\frac{16}3\\right)=\\frac{32}3$.","h":["Find the $x$-intercepts.","Integrate between them.","Subtract carefully with brackets."]}]},{"id":"mm3-c05-s6","code":"5.7","title":"Applications: motion and rates","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: integration kinematics velocity to position","url":"https://www.youtube.com/results?search_query=Joel+Speranza+integration+kinematics+velocity+to+position","kind":"search"}]},{"t":"p","x":"**What this topic is about.** Using integration to go from rates back to amounts: from acceleration to velocity to displacement in kinematics, and from a rate of flow, growth or production to a total. These are the reverse of the derivative applications in topic 3."},{"t":"key","x":"**Kinematics in reverse:** $v=\\int a\\,dt$ and $x=\\int v\\,dt$, each with a constant found from an initial condition. **Displacement** from $t=a$ to $t=b$ is $\\int_a^bv\\,dt$. **Distance travelled** is $\\int_a^b|v|\\,dt$: split at times where $v=0$ and add the sizes."},{"t":"p","x":"**Displacement versus distance.** Displacement is the net change in position (it can be zero if the particle returns to its start). Distance is the total path length. If the particle turns around (velocity changes sign), they differ."},{"t":"p","x":"**Rates to totals.** If $R(t)$ is a rate (litres per minute, people per hour), the total over $[a,b]$ is $\\int_a^bR(t)\\,dt$. The amount at time $t$ is the starting amount plus the total change."},{"t":"ex","title":"From acceleration to position (full working)","q":"A car starts from rest at the origin with acceleration $a=6-2t$ m/s$^2$. Find its velocity and position after 3 seconds.","s":["**Velocity:** $v=\\int(6-2t)dt=6t-t^2+c_1$. From rest: $v(0)=0\\Rightarrow c_1=0$, so $v=6t-t^2$.","**At $t=3$:** $v=18-9=9$ m/s.","**Position:** $x=\\int(6t-t^2)dt=3t^2-\\frac{t^3}3+c_2$. At the origin: $x(0)=0\\Rightarrow c_2=0$.","**At $t=3$:** $x=27-9=18$ m."],"a":"$9$ m/s and $18$ m from the start"},{"t":"ex","title":"Displacement and distance (full working)","q":"A particle has $v=t^2-4t+3$ m/s for $0\\le t\\le3$. Find the displacement and the distance travelled.","s":["**Where does it turn?** $v=(t-1)(t-3)=0$ at $t=1$ and $t=3$. $v>0$ on $(0,1)$, $v\u003c0$ on $(1,3)$.","**Antiderivative:** $F(t)=\\frac{t^3}3-2t^2+3t$.","**Displacement:** $F(3)-F(0)=(9-18+9)-0=0$ m. The particle ends where it started.","**First part:** $F(1)-F(0)=\\frac13-2+3=\\frac43$ m forward.","**Second part:** $F(3)-F(1)=0-\\frac43=-\\frac43$ m (backward).","**Distance:** $\\frac43+\\frac43=\\frac83\\approx2.67$ m."],"a":"Displacement $0$ m; distance $\\frac{8}{3}$ m"},{"t":"ex","title":"Worded problem: water in a tank (full working)","q":"Water flows into a tank at $\\frac{dV}{dt}=20+4t$ L/min. The tank holds 50 L at $t=0$. Find $V(t)$, the volume after 10 minutes, and how much flowed in.","s":["**Anti-differentiate:** $V=20t+2t^2+c$.","**Initial condition:** $V(0)=50\\Rightarrow c=50$, so $V=20t+2t^2+50$.","**After 10 minutes:** $V(10)=200+200+50=450$ L.","**Amount that flowed in:** $\\int_0^{10}(20+4t)dt=\\left[20t+2t^2\\right]_0^{10}=400$ L (which matches $450-50$)."],"a":"$V=20t+2t^2+50$; 450 L after 10 min; 400 L flowed in"},{"t":"ex","title":"Worded problem: total from a decaying rate (full working)","q":"Oil leaks from a tank at $R(t)=12e^{-0.2t}$ L/h. How much leaks in the first 5 hours?","s":["**Total leaked:** $\\int_0^5 12e^{-0.2t}dt$.","**Antiderivative:** $12\\times\\frac{1}{-0.2}e^{-0.2t}=-60e^{-0.2t}$.","**Evaluate:** $\\left[-60e^{-0.2t}\\right]_0^5=-60e^{-1}-(-60)=60-60e^{-1}$.","**Approximate:** $60(1-0.3679)\\approx37.9$ L."],"a":"$60-60e^{-1}\\approx37.9$ litres"},{"t":"warn","x":"If velocity changes sign, $\\int v\\,dt$ gives displacement, not distance. Always check for turning points before answering a distance question."},{"t":"p","x":"**Exam tip.** Label each constant of integration separately ($c_1$, $c_2$) and find each one immediately using its own initial condition."},{"t":"tb","rec":"1,3,5,6,9,12","ext":"14,16,17,20","x":"Exercise 5.7 links rate of change to total change, and velocity to position.","code":"5.7"}],"checks":[{"topic":"Velocity","q":"A particle starts from rest with $a=4t$ m/s\u00b2. Find its velocity at $t=3$.","a":"18","alt":["18 m/s"],"ad":"$18$ m/s","sol":"$v=\\int4t\\,dt=2t^2+c$. || From rest: $v(0)=0$, so $c=0$. || $v=2t^2$. || At $t=3$: $v=18$ m/s.","h":["Integrate $a$.","Use $v(0)=0$.","Substitute $t=3$."]},{"topic":"Position","q":"$v=3t^2-2$ and $x(0)=4$. Find $x(2)$.","a":"8","alt":[],"ad":"$8$","sol":"$x=\\int(3t^2-2)dt=t^3-2t+c$. || $x(0)=4$ gives $c=4$. || $x=t^3-2t+4$. || $x(2)=8-4+4=8$.","h":["Integrate $v$.","Use $x(0)=4$.","Substitute $t=2$."]},{"topic":"Distance","q":"$v=2t-4$ for $0\\le t\\le3$. Find the distance travelled.","a":"5","alt":[],"ad":"$5$ m","sol":"$v=0$ at $t=2$ (backwards before, forwards after). || $\\int_0^2(2t-4)dt=[t^2-4t]_0^2=-4$, so 4 m backward. || $\\int_2^3(2t-4)dt=[t^2-4t]_2^3=-3-(-4)=1$, so 1 m forward. || Distance $=4+1=5$ m.","h":["When is $v=0$?","Integrate each piece.","Add the sizes."]},{"topic":"Total from rate","q":"A pump moves water at $R(t)=30-2t$ L/min. How much is pumped in the first 5 minutes?","a":"125","alt":["125 L"],"ad":"$125$ L","sol":"Total $=\\int_0^5(30-2t)dt$. || Antiderivative: $30t-t^2$. || Evaluate: $150-25=125$. || So 125 litres are pumped.","h":["Integrate the rate.","Upper minus lower.","$30(5)-25$."]},{"topic":"Displacement","q":"$v=6-3t$ for $0\\le t\\le4$. Find the displacement.","a":"0","alt":["0 m"],"ad":"$0$ m","sol":"Displacement $=\\int_0^4(6-3t)dt$. || Antiderivative: $6t-\\frac32t^2$. || At $t=4$: $24-24=0$; at $t=0$: $0$. || Displacement $=0$ m (it returns to its start).","h":["Integrate $v$ over $[0,4]$.","Evaluate.","Upper minus lower."]}]},{"id":"mm3-c05-s7","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Check by differentiating.** Every antiderivative can be verified in seconds. If differentiating your answer does not give back the integrand, find the mistake before moving on."},{"t":"p","x":"**Presentation.** Indefinite integrals need $+c$. Definite integrals show the bracket with limits and both substitutions. Areas are positive and include units. When the question says exact, leave $e$, $\\ln$ and $\\pi$ unevaluated."},{"t":"ex","title":"Exam-style: area under a sine curve (full working)","q":"Find the exact total area between $y=\\sin x$ and the $x$-axis for $0\\le x\\le2\\pi$.","s":["**Sign of $\\sin x$:** positive on $(0,\\pi)$, negative on $(\\pi,2\\pi)$.","**First piece:** $\\int_0^\\pi\\sin x\\,dx=[-\\cos x]_0^\\pi=1-(-1)=2$.","**Second piece:** $\\int_\\pi^{2\\pi}\\sin x\\,dx=[-\\cos x]_\\pi^{2\\pi}=-1-1=-2$.","**Total area:** $2+|-2|=4$ square units (the plain integral over $[0,2\\pi]$ would wrongly give 0)."],"a":"$4$ square units"},{"t":"ex","title":"Exam-style: function from a mixed derivative (full working)","q":"$f'(x)=\\dfrac1x+e^x$ for $x>0$ and $f(1)=e$. Find $f(e)$ exactly.","s":["**Anti-differentiate:** $f(x)=\\ln x+e^x+c$ (no absolute value since $x>0$).","**Use $f(1)=e$:** $\\ln1+e+c=e\\Rightarrow0+e+c=e\\Rightarrow c=0$.","**Function:** $f(x)=\\ln x+e^x$.","**Evaluate:** $f(e)=\\ln e+e^e=1+e^e$."],"a":"$f(e)=1+e^e$"},{"t":"warn","x":"Lost marks: missing $+c$; integrating across an axis crossing for area; dividing instead of multiplying (or vice versa) by the inner coefficient."}],"checks":[{"topic":"Sine area","q":"Find the area under $y=\\sin x$ from $0$ to $\\pi$.","a":"2","alt":[],"ad":"$2$","sol":"$\\int_0^\\pi\\sin x\\,dx=[-\\cos x]_0^\\pi$. || $=-\\cos\\pi-(-\\cos0)$. || $=1+1$. || Area $=2$.","h":["$\\int\\sin x=-\\cos x$.","$\\cos\\pi=-1$.","Upper minus lower."]},{"topic":"Find f","q":"$f'(x)=e^{x}+2x$ and $f(0)=3$. Find $f(1)$.","a":"e+3","alt":["3+e","5.718"],"ad":"$e+3$","sol":"$f(x)=e^x+x^2+c$. || $f(0)=1+0+c=3$, so $c=2$. || $f(x)=e^x+x^2+2$. || $f(1)=e+1+2=e+3$.","h":["Integrate.","$e^0=1$.","Substitute $x=1$."]},{"topic":"Average value","q":"Find the average value of $f(x)=x^2$ on $[0,3]$ using $\\frac{1}{b-a}\\int_a^bf(x)\\,dx$.","a":"3","alt":[],"ad":"$3$","sol":"$\\int_0^3x^2dx=\\left[\\frac{x^3}3\\right]_0^3=9$. || $b-a=3$. || Average $=\\frac{1}{3}\\times9$. || $=3$.","h":["Integrate $x^2$.","Divide by the interval length.","$9\\div3$."]},{"topic":"Exact definite","q":"Evaluate $\\displaystyle\\int_0^1(e^{2x}+1)\\,dx$ exactly.","a":"(e^2+1)/2","alt":["(1/2)(e^2+1)","e^2/2+1/2","(e^2-1)/2+1"],"ad":"$\\dfrac{e^2+1}{2}$","sol":"Antiderivative: $\\frac12e^{2x}+x$. || Upper: $\\frac12e^2+1$. Lower: $\\frac12$. || Subtract: $\\frac12e^2+1-\\frac12=\\frac12e^2+\\frac12$. || $=\\frac{e^2+1}{2}$.","h":["$\\int e^{2x}=\\frac12e^{2x}$.","Substitute 1 and 0.","Simplify."]},{"topic":"Log area","q":"Find the area under $y=\\frac{1}{x}$ from $x=1$ to $x=e^2$.","a":"2","alt":[],"ad":"$2$","sol":"$\\int_1^{e^2}\\frac1x\\,dx=[\\ln x]_1^{e^2}$. || $=\\ln e^2-\\ln1$. || $=2-0$. || Area $=2$.","h":["$\\int\\frac1x=\\ln x$.","$\\ln e^2=2$.","$\\ln1=0$."]}]}],"quiz":[{"topic":"Powers","q":"Find $\\int(6x^2-4x)\\,dx$ (include $+c$).","a":"2x^3-2x^2+c","alt":["2x\u00b3-2x\u00b2+c"],"ad":"$2x^3-2x^2+c$","sol":"Integrate term by term, adding 1 to each power and dividing by the new power. || $\\int6x^2dx=6\\cdot\\frac{x^3}3=2x^3$. || $\\int(-4x)dx=-4\\cdot\\frac{x^2}2=-2x^2$. || Answer: $2x^3-2x^2+c$.","h":["Add 1 to each power.","Divide by the new power.","Add $c$."]},{"topic":"Exponential","q":"Find $\\int e^{4x}\\,dx$ (include $+c$).","a":"(1/4)e^(4x)+c","alt":["e^(4x)/4+c","1/4e^(4x)+c"],"ad":"$\\tfrac14e^{4x}+c$","sol":"Use $\\int e^{kx}dx=\\frac1ke^{kx}+c$. || Here $k=4$. || So $\\int e^{4x}dx=\\frac14e^{4x}+c$. || Check: $\\frac{d}{dx}\\frac14e^{4x}=e^{4x}$ \u2713.","h":["Differentiating $e^{4x}$ gives $4e^{4x}$.","So divide by 4.","Add $c$."]},{"topic":"Reciprocal","q":"Find $\\int\\frac{3}{x}\\,dx$ for $x>0$ (include $+c$).","a":"3ln(x)+c","alt":["3lnx+c","3ln|x|+c"],"ad":"$3\\ln x+c$","sol":"Take the constant out: $3\\int\\frac1x\\,dx$. || $\\int\\frac1x\\,dx=\\ln|x|$. || Since $x>0$, $|x|=x$. || Answer: $3\\ln x+c$.","h":["Constants come out.","$\\int\\frac1x=\\ln x$.","Include $c$."]},{"topic":"Trig","q":"Find $\\int\\cos(3x)\\,dx$ (include $+c$).","a":"(1/3)sin(3x)+c","alt":["sin(3x)/3+c","1/3sin(3x)+c"],"ad":"$\\tfrac13\\sin(3x)+c$","sol":"$\\int\\cos(ax)dx=\\frac1a\\sin(ax)+c$. || Here $a=3$. || So $\\int\\cos(3x)dx=\\frac13\\sin(3x)$. || Add $c$.","h":["$\\int\\cos=\\sin$.","Divide by the coefficient.","Add $c$."]},{"topic":"Trig","q":"Find $\\int\\sin(2x)\\,dx$ (include $+c$).","a":"-(1/2)cos(2x)+c","alt":["-cos(2x)/2+c","-1/2cos(2x)+c"],"ad":"$-\\tfrac12\\cos(2x)+c$","sol":"$\\int\\sin(ax)dx=-\\frac1a\\cos(ax)+c$. || Here $a=2$. || So $\\int\\sin(2x)dx=-\\frac12\\cos(2x)$. || Add $c$.","h":["$\\int\\sin=-\\cos$.","Divide by 2.","Add $c$."]},{"topic":"Initial condition","q":"$f'(x)=4x-1$, $f(0)=3$. Find $f(2)$.","a":"9","alt":["f(2)=9"],"ad":"$9$","sol":"Anti-differentiate: $f(x)=2x^2-x+c$. || Use $f(0)=3$: $0-0+c=3$, so $c=3$. || $f(x)=2x^2-x+3$. || $f(2)=8-2+3=9$.","h":["Integrate.","$c=3$.","Substitute $x=2$."]},{"topic":"Definite","q":"Evaluate $\\int_0^2(3x^2)\\,dx$.","a":"8","alt":["8."],"ad":"$8$","sol":"Antiderivative of $3x^2$ is $x^3$. || $\\left[x^3\\right]_0^2=2^3-0^3$. || $=8-0$. || The integral equals 8.","h":["Antiderivative of $3x^2$.","Evaluate at 2 and 0.","Subtract."]},{"topic":"Definite","q":"Evaluate $\\int_0^1e^{2x}\\,dx$. Give an exact answer.","a":"(e^2-1)/2","alt":["(1/2)(e^2-1)","(e^2-1)/2.","e^2/2-1/2"],"ad":"$\\dfrac{e^2-1}{2}$","sol":"Antiderivative: $\\frac12e^{2x}$. || $\\left[\\frac12e^{2x}\\right]_0^1=\\frac12e^2-\\frac12e^0$. || $e^0=1$. || $=\\frac12(e^2-1)=\\frac{e^2-1}{2}$.","h":["Antiderivative $\\frac12e^{2x}$.","Evaluate at 1 and 0.","Subtract."]},{"topic":"Motion","q":"$v=2t+1$ and $x(0)=0$. Find $x(3)$.","a":"12","alt":["x=12"],"ad":"$12$","sol":"Position is the integral of velocity: $x=\\int(2t+1)dt=t^2+t+c$. || $x(0)=0$ gives $c=0$. || $x=t^2+t$. || $x(3)=9+3=12$.","h":["Integrate $v$.","$c=0$.","Substitute."]},{"topic":"Recognise","q":"Find $\\int\\frac{2x}{x^2+3}\\,dx$ (include $+c$).","a":"ln(x^2+3)+c","alt":["ln|x^2+3|+c"],"ad":"$\\ln(x^2+3)+c$","sol":"Differentiate the denominator: $\\frac{d}{dx}(x^2+3)=2x$. || That equals the numerator, so the integrand is $\\frac{f'}{f}$. || $\\int\\frac{f'}{f}dx=\\ln|f|+c$. || Since $x^2+3>0$: $\\ln(x^2+3)+c$.","h":["Differentiate $x^2+3$.","Compare with numerator.","Use $\\frac{f'}{f}$."]},{"topic":"Power","q":"Find $\\int\\left(4x^3-6x\\right)dx$.","a":"x^4-3x^2+c","alt":[],"ad":"$x^4-3x^2+c$","sol":"Integrate each term: $\\int4x^3dx=x^4$. || $\\int(-6x)dx=-6\\cdot\\frac{x^2}2=-3x^2$. || Combine. || $x^4-3x^2+c$.","h":["$x^{n+1}/(n+1)$.","Each term.","Add $c$."]},{"topic":"Exponential","q":"$\\int 5e^{5x}dx$.","a":"e^(5x)+c","alt":[],"ad":"$e^{5x}+c$","sol":"$\\int e^{5x}dx=\\frac15e^{5x}$. || Multiply by 5: $5\\times\\frac15e^{5x}=e^{5x}$. || Add $c$. || $e^{5x}+c$ (check: $\\frac{d}{dx}e^{5x}=5e^{5x}$ \u2713).","h":["Inner derivative 5.","$5\\div5=1$.","Add $c$."]},{"topic":"Log","q":"$\\int\\frac{3}{x}dx$ for $x>0$.","a":"3lnx+c","alt":["3ln(x)+c"],"ad":"$3\\ln x+c$","sol":"$3\\int\\frac1x\\,dx$. || $=3\\ln|x|$. || For $x>0$, $|x|=x$. || $3\\ln x+c$.","h":["Constant multiple.","$\\ln x$.","Add $c$."]},{"topic":"Reverse chain","q":"$\\int\\frac{e^x}{e^x+1}dx$.","a":"ln(e^x+1)+c","alt":[],"ad":"$\\ln(e^x+1)+c$","sol":"The derivative of the denominator $e^x+1$ is $e^x$. || That is the numerator, so the integrand is $\\frac{f'}{f}$. || $\\int\\frac{f'}{f}dx=\\ln|f|$. || $e^x+1>0$, so the answer is $\\ln(e^x+1)+c$.","h":["$f'/f$.","$f=e^x+1$.","Add $c$."]},{"topic":"Definite","q":"$\\int_0^1 3x^2dx$.","a":"1","alt":[],"ad":"$1$","sol":"Antiderivative of $3x^2$ is $x^3$. || $\\left[x^3\\right]_0^1=1-0$. || $=1$. || The integral equals 1.","h":["Antiderivative.","$x^3$.","Substitute."]},{"topic":"Definite","q":"$\\int_0^{\\pi}\\sin x\\,dx$.","a":"2","alt":[],"ad":"$2$","sol":"Antiderivative: $-\\cos x$. || $\\left[-\\cos x\\right]_0^\\pi=-\\cos\\pi-(-\\cos0)$. || $=-(-1)+1=1+1$. || The integral equals 2.","h":["$-\\cos x$.","At $\\pi$: $1$.","At $0$: $-1$."]},{"topic":"Area","q":"Area under $y=e^x$ from $0$ to $\\ln3$.","a":"2","alt":[],"ad":"$2$","sol":"Area $=\\int_0^{\\ln3}e^xdx$ (the curve is above the axis). || $=\\left[e^x\\right]_0^{\\ln3}=e^{\\ln3}-e^0$. || $=3-1$. || Area $=2$.","h":["Antiderivative.","$e^{\\ln3}=3$.","Subtract."]},{"topic":"Initial value","q":"$f'(x)=4x$, $f(0)=3$. Find $f(2)$.","a":"11","alt":[],"ad":"$11$","sol":"$f(x)=\\int4x\\,dx=2x^2+c$. || $f(0)=3$ gives $c=3$. || $f(x)=2x^2+3$. || $f(2)=8+3=11$.","h":["Integrate.","$c=3$.","Substitute."]},{"topic":"Between curves","q":"Area between $y=x$ and $y=x^2$ from $0$ to $1$ (exact).","a":"1/6","alt":[],"ad":"$\\frac16$","sol":"The curves meet where $x^2=x$: $x=0$ and $x=1$. On $[0,1]$, $y=x$ is on top. || Area $=\\int_0^1(x-x^2)dx$. || $=\\left[\\frac{x^2}2-\\frac{x^3}3\\right]_0^1=\\frac12-\\frac13$. || $=\\frac16$.","h":["Which is on top?","Integrate difference.","Evaluate."]},{"topic":"Velocity","q":"$v=2t$, $x(0)=1$. Find $x(3)$.","a":"10","alt":[],"ad":"$10$","sol":"$x=\\int2t\\,dt=t^2+c$. || $x(0)=1$ gives $c=1$. || $x=t^2+1$. || $x(3)=9+1=10$.","h":["Integrate.","$c=1$.","Substitute."]}],"comets":[{"topic":"Extension: Area under a curve between roots","q":"Find the exact area enclosed between $y=\\sin x$ and the $x$-axis for $0\\le x\\le2\\pi$.","a":"4","alt":["4 units^2","4 square units"],"ad":"$4$","sol":"$\\sin x\\ge0$ on $[0,\\pi]$ and $\\le0$ on $[\\pi,2\\pi]$, so split there. || $\\int_0^\\pi\\sin x\\,dx=[-\\cos x]_0^\\pi=2$. || $\\int_\\pi^{2\\pi}\\sin x\\,dx=[-\\cos x]_\\pi^{2\\pi}=-1-1=-2$, an area of 2 below the axis. || Total area $=2+2=4$ (not 0).","h":["Where does $\\sin x$ cross the axis?","Split the integral at $\\pi$.","Take the area, not the signed value."]},{"topic":"Extension: Find the function","q":"$f'(x)=\\dfrac{1}{x}+e^{x}$, $f(1)=e$. Find $f(e)$ in exact form.","a":"e^e+1","alt":["1+e^e"],"ad":"$e^{e}+1$","sol":"Anti-differentiate: $f(x)=\\ln x+e^x+c$. || $f(1)=\\ln1+e+c=e$, so $c=0$. || $f(x)=\\ln x+e^x$. || $f(e)=\\ln e+e^e=1+e^e$.","h":["Integrate.","Use $f(1)=e$ to get $c$.","Substitute $x=e$."]},{"topic":"Extension: Average value","q":"The average value of $f(x)=x^2$ on $[0,3]$ is?","a":"3","alt":[],"ad":"$3$","sol":"Average value $=\\frac{1}{b-a}\\int_a^bf(x)\\,dx$. || $\\int_0^3x^2dx=\\left[\\frac{x^3}{3}\\right]_0^3=9$. || Divide by the interval length 3. || Average $=3$.","h":["$\\frac1{b-a}\\int f$.","$\\int_0^3x^2=9$.","Divide by 3."]}],"cards":[{"type":"def","topic":"Anti-differentiation of rational functions","f":"Why do indefinite integrals need $+c$?","b":"Constants differentiate to 0, so infinitely many functions share the same derivative. $+c$ represents all of them."},{"type":"def","topic":"Anti-differentiation of rational functions","f":"$\\int(ax+b)^n\\,dx$ for $n\neq-1$?","b":"$\\dfrac{(ax+b)^{n+1}}{a(n+1)}+c$"},{"type":"def","topic":"Anti-differentiation of exponential functions","f":"$\\int e^{ax+b}\\,dx$?","b":"$\\frac1a e^{ax+b}+c$"},{"type":"word","topic":"Anti-differentiation of exponential functions","f":"$\\frac{dN}{dt}=60e^{0.3t}$ and $N(0)=200$. Find $N(t)$.","b":"$N=200e^{0.3t}+c$; $N(0)=200+c=200$ so $c=0$: $N=200e^{0.3t}$."},{"type":"def","topic":"Anti-differentiation of logarithmic functions (via $\\frac1x$)","f":"$\\int\\frac{f'(x)}{f(x)}\\,dx$?","b":"$\\ln|f(x)|+c$"},{"type":"def","topic":"Anti-differentiation of logarithmic functions (via $\\frac1x$)","f":"$\\int\\frac{1}{ax+b}\\,dx$?","b":"$\\frac1a\\ln|ax+b|+c$"},{"type":"def","topic":"Anti-differentiation of trigonometric functions","f":"$\\int\\sin(ax)\\,dx$ and $\\int\\cos(ax)\\,dx$?","b":"$-\\frac1a\\cos(ax)+c$ and $\\frac1a\\sin(ax)+c$"},{"type":"def","topic":"Further integration and initial conditions","f":"What does $\\int_a^b f'(x)\\,dx$ measure?","b":"The total change in $f$ from $x=a$ to $x=b$: $f(b)-f(a)$."},{"type":"word","topic":"Further integration and initial conditions","f":"Water enters at $r(t)=20+4t$ L/min. How much enters in the first 10 min?","b":"$\\int_0^{10}(20+4t)\\,dt=[20t+2t^2]_0^{10}=400$ L."},{"type":"def","topic":"Applications: motion and rates","f":"Displacement vs distance from a velocity function?","b":"Displacement $=\\int_a^bv\\,dt$. Distance $=\\int_a^b|v|\\,dt$: split where $v=0$ and add the sizes."},{"type":"word","topic":"Applications: motion and rates","f":"$v=t^2-4t+3$ on $[0,3]$. Displacement and distance?","b":"Displacement $0$; distance $\\frac83$ m (split at $t=1$)."},{"type":"word","topic":"Applications: motion and rates","f":"From rest, $a=6-2t$. Velocity at $t=3$?","b":"$v=6t-t^2$, so $v(3)=9$ m/s."}],"hours":4.5},"mm3-c06":{"id":"mm3-c06","interactive":"discrete","summary":"A discrete random variable takes countable values, each with a probability. This chapter builds probability distributions, then summarises them with the expected value, variance and standard deviation, and models real situations such as games and fair prices.","videos":[{"src":"J","title":"Discrete random variables and probability distributions","url":"https://www.youtube.com/results?search_query=Joel+Speranza+discrete+random+variables","kind":"search"},{"src":"J","title":"Expected value and variance","url":"https://www.youtube.com/results?search_query=Joel+Speranza+expected+value+variance+discrete","kind":"search"},{"src":"B","title":"Binomial distributions, probabilities of probabilities (3Blue1Brown)","url":"https://www.youtube.com/watch?v=8idr1WZ1A7Q","kind":"video"}],"sections":[{"id":"mm3-c06-s1","code":"6.2","title":"Discrete random variables","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: discrete random variables probability distribution","url":"https://www.youtube.com/results?search_query=Joel+Speranza+discrete+random+variables+probability+distribution","kind":"search"}]},{"t":"p","x":"**What this topic is about.** A random variable turns the outcome of a chance process into a number, so we can calculate with it. This topic covers **discrete** random variables (which take separate, countable values), how to build and check a probability distribution, and how to calculate probabilities, including cumulative and conditional ones."},{"t":"key","x":"A **discrete random variable** $X$ takes countable values $x_1,x_2,\\dots$ with probabilities $P(X=x)$. A **probability distribution** is valid when (1) $0\\le P(X=x)\\le1$ for every $x$, and (2) $\\sum P(X=x)=1$."},{"t":"p","x":"**Notation.** Capital $X$ is the random variable (the rule); lowercase $x$ is a particular value it can take. $P(X=2)$ means \"the probability that $X$ equals 2\". A distribution can be given as a table, a rule (such as $P(X=x)=\\frac{x}{10}$), or a graph (a column graph of probabilities)."},{"t":"p","x":"**Building a distribution.** (1) List every possible value of $X$. (2) Find the probability of each, using equally likely outcomes, a tree diagram or a table of outcomes. (3) Check the probabilities add to 1. For two dice, a $6\\times6$ grid of the 36 equally likely outcomes is the quickest way to get the distribution of the sum, difference or maximum."},{"t":"p","x":"**Cumulative probabilities and complements.** $P(X\\le k)$ adds the probabilities of every value up to $k$. \"At least 3\" is $P(X\\ge3)=1-P(X\\le2)$; \"more than 3\" is $P(X>3)=P(X\\ge4)$; \"fewer than 3\" is $P(X\u003c3)=P(X\\le2)$. Translate the words into an inequality before adding."},{"t":"key","x":"**Conditional probability:** $P(A\\mid B)=\\dfrac{P(A\\cap B)}{P(B)}$. With random variables, e.g. $P(X\\ge2\\mid X\\ge1)=\\dfrac{P(X\\ge2)}{P(X\\ge1)}$, because \"$X\\ge2$ and $X\\ge1$\" is just \"$X\\ge2$\"."},{"t":"ex","title":"Finding an unknown constant (full working)","q":"$X$ has $P(X=x)=kx$ for $x=1,2,3,4$. Find $k$, then $P(X\\ge3)$ and $P(X\u003c3)$.","s":["**List the probabilities in terms of $k$:** $P(X=1)=k$, $P(X=2)=2k$, $P(X=3)=3k$, $P(X=4)=4k$.","**Use the sum-to-1 condition:** $k+2k+3k+4k=1\\Rightarrow10k=1\\Rightarrow k=\\frac1{10}$.","**Check validity:** the probabilities are $0.1,0.2,0.3,0.4$, all between 0 and 1. \u2713","**$P(X\\ge3)$:** $P(X=3)+P(X=4)=0.3+0.4=0.7$.","**$P(X\u003c3)$:** $P(X=1)+P(X=2)=0.1+0.2=0.3$ (or $1-0.7$)."],"a":"$k=\\frac1{10}$; $P(X\\ge3)=0.7$; $P(X\u003c3)=0.3$"},{"t":"ex","title":"Distribution from two dice (full working)","q":"Two fair dice are rolled and $X$ is the larger of the two numbers. Find the distribution of $X$ and $P(X\\le3)$.","s":["**Cumulative idea:** $X\\le k$ means both dice show at most $k$. Each die does this with probability $\\frac k6$, so $P(X\\le k)=\\left(\\frac k6\\right)^2=\\frac{k^2}{36}$.","**Individual probabilities:** $P(X=k)=P(X\\le k)-P(X\\le k-1)=\\frac{k^2-(k-1)^2}{36}=\\frac{2k-1}{36}$.","**List them:** $x=1,2,3,4,5,6$ with probabilities $\\frac1{36},\\frac3{36},\\frac5{36},\\frac7{36},\\frac9{36},\\frac{11}{36}$.","**Check the sum:** $\\frac{1+3+5+7+9+11}{36}=\\frac{36}{36}=1$ \u2713.","**$P(X\\le3)$:** $\\frac{1+3+5}{36}=\\frac9{36}=\\frac14$."],"a":"$P(X=k)=\\frac{2k-1}{36}$; $P(X\\le3)=\\frac14$"},{"t":"ex","title":"Conditional probability (full working)","q":"$X$ takes values $0,1,2,3$ with probabilities $0.1,0.3,0.4,0.2$. Find $P(X\\ge2\\mid X\\ge1)$.","s":["**Formula:** $P(X\\ge2\\mid X\\ge1)=\\dfrac{P(X\\ge2\\text{ and }X\\ge1)}{P(X\\ge1)}$.","**Simplify the intersection:** if $X\\ge2$ then automatically $X\\ge1$, so the top is $P(X\\ge2)=0.4+0.2=0.6$.","**Bottom:** $P(X\\ge1)=1-P(X=0)=0.9$.","**Divide:** $\\dfrac{0.6}{0.9}=\\dfrac23$."],"a":"$\\frac23$"},{"t":"ex","title":"Checking validity (full working)","q":"Is $P(X=x)=\\frac{x^2}{30}$ for $x=1,2,3,4$ a valid probability distribution?","s":["**Compute each probability:** $\\frac1{30},\\frac4{30},\\frac9{30},\\frac{16}{30}$.","**Condition 1:** each is between 0 and 1 \u2713.","**Condition 2:** $\\frac{1+4+9+16}{30}=\\frac{30}{30}=1$ \u2713.","**Conclude:** both conditions hold, so it is valid."],"a":"Yes, it is valid"},{"t":"warn","x":"A distribution must sum to exactly 1. If yours does not, recheck before going on; every later answer (mean, variance) depends on it. Also be careful with \"at least\" ($\\ge$) versus \"more than\" ($>$)."},{"t":"p","x":"**Exam tip.** Show the sum-to-1 equation explicitly when finding an unknown; it is usually the method mark."},{"t":"tb","rec":"1,2,4,5,6,7,8,11,12","ext":"13,15,16,18,20","x":"Exercise 6.2 builds distributions from experiments, finds unknown constants and cumulative probabilities.","code":"6.2"}],"checks":[{"topic":"Unknown","q":"$P(X=x)$ for $x=0,1,2,3$ is $0.15,\\ k,\\ 0.35,\\ 0.2$. Find $k$.","a":"0.3","alt":["k=0.3"],"ad":"$k=0.3$","sol":"The probabilities must add to 1: $0.15+k+0.35+0.2=1$. || Add the known values: $0.7+k=1$. || So $k=0.3$. || Check: all values are between 0 and 1.","h":["Probabilities sum to 1.","Add the known ones.","Subtract from 1."]},{"topic":"Rule","q":"$P(X=x)=\\frac{x}{10}$ for $x=1,2,3,4$. Find $P(X>2)$.","a":"0.7","alt":["7/10"],"ad":"$0.7$","sol":"$X>2$ means $X=3$ or $X=4$. || $P(X=3)=\\frac3{10}$, $P(X=4)=\\frac4{10}$. || Add: $\\frac7{10}$. || $P(X>2)=0.7$.","h":["\"More than 2\" means 3 or 4.","Use the rule for each.","Add."]},{"topic":"Complement","q":"$P(X=0)=0.25$ for a random variable taking values $0,1,2,\\dots$. Find $P(X\\ge1)$.","a":"0.75","alt":["3/4"],"ad":"$0.75$","sol":"\"At least 1\" is everything except 0. || $P(X\\ge1)=1-P(X=0)$. || $=1-0.25$. || $=0.75$.","h":["Use the complement.","Everything except $X=0$.","$1-0.25$."]},{"topic":"Conditional","q":"$X$ takes $1,2,3,4$ with probabilities $0.1,0.2,0.3,0.4$. Find $P(X=4\\mid X\\ge3)$.","a":"4/7","alt":["0.571","0.5714"],"ad":"$\\dfrac{4}{7}$","sol":"$P(X=4\\mid X\\ge3)=\\frac{P(X=4)}{P(X\\ge3)}$ because $X=4$ is inside $X\\ge3$. || $P(X=4)=0.4$. || $P(X\\ge3)=0.3+0.4=0.7$. || $\\frac{0.4}{0.7}=\\frac47$.","h":["Use $P(A\\mid B)=\\frac{P(A\\cap B)}{P(B)}$.","The intersection is just $X=4$.","Divide."]},{"topic":"Dice","q":"Two fair dice are rolled and $S$ is their sum. Find $P(S=7)$.","a":"1/6","alt":["6/36","0.1667"],"ad":"$\\dfrac16$","sol":"There are 36 equally likely outcomes. || Sums of 7: (1,6),(2,5),(3,4),(4,3),(5,2),(6,1), which is 6 outcomes. || $P(S=7)=\\frac6{36}$. || $=\\frac16$.","h":["Count all outcomes.","List pairs adding to 7.","Divide."]}]},{"id":"mm3-c06-s2","code":"6.3","title":"Expected value","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: expected value discrete random variable","url":"https://www.youtube.com/results?search_query=Joel+Speranza+expected+value+discrete+random+variable","kind":"search"}]},{"t":"p","x":"**What this topic is about.** The **expected value** (mean) of a random variable is its long-run average. It is used to compare options, set fair prices for games and insurance, and summarise a distribution with one number."},{"t":"key","x":"$$E(X)=\\mu=\\sum x\\,P(X=x)\\qquad E(aX+b)=aE(X)+b\\qquad E\\big(g(X)\\big)=\\sum g(x)P(X=x)$$"},{"t":"p","x":"**Meaning.** Multiply each value by its probability and add. If you repeated the experiment many times and averaged the results, you would get close to $E(X)$. It does not have to be a value $X$ can take: the mean of a fair die is 3.5. Think of it as the balance point of the probability graph."},{"t":"p","x":"**Linear changes.** If every value is multiplied by $a$ and then $b$ is added (e.g. converting to dollars and adding a fee), the mean changes in the same way: $E(aX+b)=aE(X)+b$. This saves recalculating the whole table."},{"t":"p","x":"**Fair games and net gain.** In money questions, define $X$ as the **net** gain (winnings minus the cost to play). A game is **fair** when $E(\\text{net gain})=0$. If $E\u003c0$ the player loses on average (the house profits)."},{"t":"ex","title":"Expected value from a table (full working)","q":"$X$ takes values $0,1,2$ with probabilities $0.2,0.5,0.3$. Find $E(X)$ and $E(3X+1)$.","s":["**Multiply each value by its probability:** $0\\times0.2=0$, $1\\times0.5=0.5$, $2\\times0.3=0.6$.","**Add:** $E(X)=0+0.5+0.6=1.1$.","**Linear rule:** $E(3X+1)=3E(X)+1$.","**Substitute:** $3(1.1)+1=4.3$."],"a":"$E(X)=1.1$; $E(3X+1)=4.3$"},{"t":"ex","title":"Fair game (full working)","q":"You pay \\$2 to roll a fair die. You win \\$6 for a six and nothing otherwise. Is the game fair? What prize would make it fair?","s":["**Define the net gain $G$:** a six gives $6-2=+4$ (probability $\\frac16$); otherwise $-2$ (probability $\\frac56$).","**Expected net gain:** $E(G)=4\\times\\frac16+(-2)\\times\\frac56=\\frac46-\\frac{10}6=-1$.","**Interpret:** on average you lose \\$1 per game, so it is not fair.","**Fair prize $w$:** need $(w-2)\\frac16-2\\cdot\\frac56=0\\Rightarrow\\frac{w-2}{6}=\\frac{10}6\\Rightarrow w-2=10\\Rightarrow w=12$."],"a":"Not fair ($E=-\\$1$); a \\$12 prize makes it fair"},{"t":"ex","title":"Finding unknowns from the mean (full working)","q":"$X$ takes values $1,2,3$ with $P(X=1)=a$, $P(X=2)=b$, $P(X=3)=0.3$, and $E(X)=2.1$. Find $a$ and $b$.","s":["**Sum to 1:** $a+b+0.3=1\\Rightarrow a+b=0.7$.","**Mean equation:** $1a+2b+3(0.3)=2.1\\Rightarrow a+2b=1.2$.","**Subtract the first equation from the second:** $b=0.5$.","**Back-substitute:** $a=0.7-0.5=0.2$."],"a":"$a=0.2$, $b=0.5$"},{"t":"ex","title":"Worded problem: insurance (full working)","q":"A \\$300 policy has a 0.2% chance of a \\$50 000 claim, a 1% chance of a \\$5000 claim, and otherwise no claim. Find the insurer's expected profit per policy.","s":["**Define profit $P$ and list outcomes:** no claim $+300$ (prob $0.988$); small claim $300-5000=-4700$ (prob $0.01$); large claim $300-50000=-49700$ (prob $0.002$).","**Check probabilities:** $0.988+0.01+0.002=1$ \u2713.","**Expected profit:** $300(0.988)-4700(0.01)-49700(0.002)$.","**Evaluate:** $296.4-47-99.4=150$."],"a":"\\$150 per policy on average"},{"t":"warn","x":"Remember to subtract the cost to play when finding expected **net** gain, and do not confuse $E(X)$ with the most likely value."},{"t":"p","x":"**Exam tip.** Present expected-value calculations as a table with a row for $x$, a row for $P(X=x)$, and a row for $xP(X=x)$, then sum the last row."},{"t":"tb","rec":"1,3,5,8,11,12","ext":"13,15,17,19,20","x":"Exercise 6.3 computes expected value and applies it to games and decisions.","code":"6.3"}],"checks":[{"topic":"Mean","q":"$X=1,2,3$ with $P=0.2,0.5,0.3$. Find $E(X)$.","a":"2.1","alt":[],"ad":"$2.1$","sol":"Multiply each value by its probability: $1(0.2)=0.2$, $2(0.5)=1$, $3(0.3)=0.9$. || Add: $0.2+1+0.9$. || $=2.1$. || So $E(X)=2.1$.","h":["$\\sum xP(X=x)$.","Three products.","Add them."]},{"topic":"Linear","q":"$E(X)=4$. Find $E(5X-3)$.","a":"17","alt":[],"ad":"$17$","sol":"Use $E(aX+b)=aE(X)+b$. || $a=5$, $b=-3$. || $5(4)-3$. || $=17$.","h":["Linear rule.","Multiply by 5.","Subtract 3."]},{"topic":"Fair game","q":"A game costs \\$4. You win \\$10 with probability $p$, otherwise nothing. Find $p$ so the game is fair.","a":"0.4","alt":["2/5"],"ad":"$p=0.4$","sol":"Net gain: $+6$ with probability $p$, $-4$ with probability $1-p$. || Fair means $6p-4(1-p)=0$. || $10p=4$. || $p=0.4$.","h":["Use net gains.","Set expected net gain to 0.","Solve for $p$."]},{"topic":"Unknown from mean","q":"$X=0,1,2$ with $P=0.3,\\ a,\\ b$ and $E(X)=1.1$. Find $b$.","a":"0.4","alt":["b=0.4"],"ad":"$b=0.4$","sol":"Sum: $0.3+a+b=1$, so $a+b=0.7$. || Mean: $0(0.3)+a+2b=1.1$, so $a+2b=1.1$. || Subtract: $b=0.4$. || (Then $a=0.3$.)","h":["Write two equations.","Sum to 1 and the mean.","Subtract."]},{"topic":"Expected net","q":"Pay \\$5; win \\$20 with probability 0.2, otherwise nothing. Find the expected net gain.","a":"-1","alt":["-$1","-1 dollar"],"ad":"$-\\$1$","sol":"Net gains: $+15$ with probability 0.2; $-5$ with probability 0.8. || $E=15(0.2)+(-5)(0.8)$. || $=3-4$. || $=-\\$1$ per game.","h":["Subtract the cost.","Weight by probabilities.","Add."]}]},{"id":"mm3-c06-s3","code":"6.4","title":"Variance and standard deviation","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: variance and standard deviation discrete random variable","url":"https://www.youtube.com/results?search_query=Joel+Speranza+variance+and+standard+deviation+discrete+random+variable","kind":"search"}]},{"t":"p","x":"**What this topic is about.** Variance and standard deviation measure the **spread** of a distribution: how far values typically are from the mean. Two options can have the same mean but very different risk, and variance is how we measure that difference."},{"t":"key","x":"$$\\operatorname{Var}(X)=E\\big[(X-\\mu)^2\\big]=E(X^2)-\\big[E(X)\\big]^2\\qquad\\sigma=\\operatorname{SD}(X)=\\sqrt{\\operatorname{Var}(X)}$$ $$\\operatorname{Var}(aX+b)=a^2\\operatorname{Var}(X)\\qquad\\operatorname{SD}(aX+b)=|a|\\,\\sigma$$"},{"t":"p","x":"**What variance means.** Variance is the average **squared** distance from the mean. Squaring makes every distance positive and weights large deviations more. The standard deviation undoes the squaring so it is in the same units as $X$. A useful rule of thumb: most of the probability lies within about two standard deviations of the mean."},{"t":"p","x":"**The computational formula.** $E(X^2)=\\sum x^2P(X=x)$ (square the values, not the probabilities). Then $\\operatorname{Var}(X)=E(X^2)-\\mu^2$. This is usually faster than the definition."},{"t":"p","x":"**Why adding a constant does not change spread.** Adding $b$ shifts every value by the same amount, so distances from the mean are unchanged. Multiplying by $a$ stretches every distance by $|a|$, so the variance (squared distances) is multiplied by $a^2$."},{"t":"ex","title":"Variance with a table (full working)","q":"$X$ takes values $0,1,2$ with probabilities $0.25,0.5,0.25$. Find $\\operatorname{Var}(X)$, $\\sigma$ and $\\operatorname{Var}(3X-2)$.","s":["**Mean:** $\\mu=0(0.25)+1(0.5)+2(0.25)=1$.","**$E(X^2)$:** square the values: $0^2(0.25)+1^2(0.5)+2^2(0.25)=0+0.5+1=1.5$.","**Variance:** $1.5-1^2=0.5$.","**Standard deviation:** $\\sigma=\\sqrt{0.5}\\approx0.707$.","**Transformed variance:** $\\operatorname{Var}(3X-2)=3^2\\times0.5=4.5$ (the $-2$ has no effect)."],"a":"$\\operatorname{Var}(X)=0.5$, $\\sigma\\approx0.707$, $\\operatorname{Var}(3X-2)=4.5$"},{"t":"ex","title":"Variance of a die (full working)","q":"Find the variance and standard deviation of the score on a fair six-sided die.","s":["**Mean:** $\\mu=\\frac{1+2+3+4+5+6}6=3.5$.","**$E(X^2)$:** $\\frac{1+4+9+16+25+36}6=\\frac{91}6\\approx15.17$.","**Variance:** $\\frac{91}6-3.5^2=\\frac{91}6-\\frac{49}4=\\frac{182-147}{12}=\\frac{35}{12}\\approx2.92$.","**SD:** $\\sqrt{35/12}\\approx1.71$."],"a":"$\\operatorname{Var}=\\frac{35}{12}\\approx2.92$, $\\sigma\\approx1.71$"},{"t":"ex","title":"Using variance rules (full working)","q":"A game's winnings $W$ have $E(W)=3$ and $\\operatorname{Var}(W)=4$. A player's profit is $P=5W-8$. Find $E(P)$ and $\\sigma(P)$.","s":["**Mean:** $E(P)=5E(W)-8=15-8=7$.","**Variance:** $\\operatorname{Var}(P)=5^2\\operatorname{Var}(W)=25\\times4=100$.","**SD:** $\\sigma(P)=\\sqrt{100}=10$ (or $|5|\\times\\sqrt4=10$).","**Interpret:** the player gains \\$7 per game on average, with a typical spread of \\$10."],"a":"$E(P)=7$, $\\sigma(P)=10$"},{"t":"ex","title":"Working backwards (full working)","q":"$X$ has mean 3 and variance 2. Find $E(X^2)$.","s":["**Rearrange the formula:** $\\operatorname{Var}(X)=E(X^2)-\\mu^2\\Rightarrow E(X^2)=\\operatorname{Var}(X)+\\mu^2$.","**Substitute:** $E(X^2)=2+3^2$.","**Evaluate:** $2+9=11$.","**Check:** $11-9=2$ \u2713."],"a":"$E(X^2)=11$"},{"t":"warn","x":"$E(X^2)\\neq\\big(E(X)\\big)^2$; the difference between them is the variance. And $\\operatorname{Var}(3X)=9\\operatorname{Var}(X)$, not $3\\operatorname{Var}(X)$."},{"t":"p","x":"**Exam tip.** Add an $x^2P(X=x)$ row to your table. Then $E(X)$ and $E(X^2)$ come from the same table, and the variance is one line."},{"t":"tb","rec":"1,2,4,5,7,9,10","ext":"13,15,16,18,19","x":"Exercise 6.4 practises variance, standard deviation and their linear transformations.","code":"6.4"}],"checks":[{"topic":"Variance","q":"$X=0,1$ with $P=0.6,0.4$. Find $\\operatorname{Var}(X)$.","a":"0.24","alt":[],"ad":"$0.24$","sol":"$E(X)=0(0.6)+1(0.4)=0.4$. || $E(X^2)=0^2(0.6)+1^2(0.4)=0.4$. || $\\operatorname{Var}=0.4-0.4^2=0.4-0.16$. || $=0.24$.","h":["Find $E(X)$.","Find $E(X^2)$.","Subtract $\\mu^2$."]},{"topic":"Variance rule","q":"$\\operatorname{Var}(X)=9$. Find $\\operatorname{Var}(2X+7)$.","a":"36","alt":[],"ad":"$36$","sol":"$\\operatorname{Var}(aX+b)=a^2\\operatorname{Var}(X)$. || $a=2$, so $a^2=4$. || The $+7$ has no effect. || $4\\times9=36$.","h":["Square the multiplier.","Ignore the added constant.","Multiply."]},{"topic":"SD rule","q":"$\\operatorname{Var}(X)=16$. Find $\\operatorname{SD}(3X)$.","a":"12","alt":[],"ad":"$12$","sol":"$\\operatorname{SD}(X)=\\sqrt{16}=4$. || $\\operatorname{SD}(aX)=|a|\\operatorname{SD}(X)$. || $3\\times4$. || $=12$.","h":["Find $\\sigma$ first.","Multiply by $|a|$.","$3\\times4$."]},{"topic":"From E(X^2)","q":"$E(X)=2$ and $E(X^2)=7$. Find $\\operatorname{Var}(X)$.","a":"3","alt":[],"ad":"$3$","sol":"$\\operatorname{Var}(X)=E(X^2)-[E(X)]^2$. || $=7-2^2$. || $=7-4$. || $=3$.","h":["Use the computational formula.","Square the mean.","Subtract."]},{"topic":"Table variance","q":"$X=1,2,3$ with $P=0.2,0.5,0.3$. Find $\\operatorname{Var}(X)$.","a":"0.49","alt":[],"ad":"$0.49$","sol":"$E(X)=0.2+1+0.9=2.1$. || $E(X^2)=1(0.2)+4(0.5)+9(0.3)=0.2+2+2.7=4.9$. || $\\operatorname{Var}=4.9-2.1^2=4.9-4.41$. || $=0.49$.","h":["Compute the mean.","Square values, not probabilities.","Subtract $\\mu^2$."]}]},{"id":"mm3-c06-s4","code":"6.5","title":"Modelling with discrete random variables","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: expected value decisions and fair games","url":"https://www.youtube.com/results?search_query=Joel+Speranza+expected+value+decisions+and+fair+games","kind":"search"}]},{"t":"p","x":"**What this topic is about.** Using discrete random variables to make decisions in context: pricing games, comparing investments, insurance, quality control. The mathematics is the mean and SD; the marks come from defining variables clearly, building the right distribution, and interpreting results in context."},{"t":"p","x":"**Modelling routine.** (1) Define $X$ in words, with units (\"$X$ is the profit in dollars from one ticket\"). (2) List its values and probabilities in a table; check they sum to 1. (3) Calculate $E(X)$ and, if risk matters, $\\sigma$. (4) Interpret: \"on average the business makes \\$150 per policy\". (5) Recommend: choose the option with the better mean, or the lower SD for a cautious decision-maker, and justify with numbers."},{"t":"p","x":"**Same mean, different risk.** Investment A returning \\$100 or \\$300 equally likely and investment B returning \\$0 or \\$400 equally likely both average \\$200. But B's outcomes are further from the mean, so its SD is larger and it is riskier. A good answer states both numbers and links the choice to the person's attitude to risk."},{"t":"ex","title":"Comparing investments (full working)","q":"Investment A returns \\$100 or \\$300 with equal probability. Investment B returns \\$0 or \\$400 with equal probability. Compare them.","s":["**Means:** $E(A)=\\frac{100+300}2=200$; $E(B)=\\frac{0+400}2=200$.","**Variance of A:** $E(A^2)=\\frac{10000+90000}2=50000$, so $\\operatorname{Var}(A)=50000-200^2=10000$ and $\\sigma_A=100$.","**Variance of B:** $E(B^2)=\\frac{0+160000}2=80000$, so $\\operatorname{Var}(B)=80000-40000=40000$ and $\\sigma_B=200$.","**Compare:** equal expected returns, but B's spread is double A's.","**Recommend:** a cautious investor should choose A (lower risk for the same average return)."],"a":"Both average \\$200; A has $\\sigma=100$, B has $\\sigma=200$; A is less risky"},{"t":"ex","title":"Raffle (full working)","q":"A raffle sells 500 tickets at \\$2 each. There is one \\$400 prize and two \\$50 prizes. Find the expected net gain per ticket.","s":["**Define $G$ (net gain):** win \\$400: $G=398$, probability $\\frac1{500}$; win \\$50: $G=48$, probability $\\frac2{500}$; no prize: $G=-2$, probability $\\frac{497}{500}$.","**Check:** $\\frac{1+2+497}{500}=1$ \u2713.","**Expected value:** $398\\cdot\\frac1{500}+48\\cdot\\frac2{500}-2\\cdot\\frac{497}{500}=\\frac{398+96-994}{500}$.","**Evaluate:** $\\frac{-500}{500}=-1$."],"a":"$-\\$1$ per ticket (the organisers raise \\$1 per ticket on average)"},{"t":"ex","title":"Quality control (full working)","q":"A machine produces 0, 1 or 2 faulty parts per hour with probabilities 0.7, 0.2, 0.1. Each faulty part costs \\$15. Find the expected hourly cost and its standard deviation.","s":["**Mean number of faults:** $E(F)=0(0.7)+1(0.2)+2(0.1)=0.4$.","**$E(F^2)$:** $0+1(0.2)+4(0.1)=0.6$, so $\\operatorname{Var}(F)=0.6-0.16=0.44$.","**Cost $C=15F$:** $E(C)=15\\times0.4=\\$6$ per hour.","**SD:** $\\operatorname{SD}(C)=15\\sqrt{0.44}\\approx15\\times0.663\\approx\\$9.95$."],"a":"Expected cost \\$6 per hour, SD about \\$9.95"},{"t":"ex","title":"Choosing a price (full working)","q":"A stall's game pays \\$10 with probability 0.15, \\$2 with probability 0.3, and nothing otherwise. What should it charge so the stall expects to make \\$1 per play?","s":["**Expected payout:** $10(0.15)+2(0.3)+0(0.55)=1.5+0.6=2.1$.","**Stall's profit per play:** price minus payout; expected profit $=c-2.1$.","**Set equal to \\$1:** $c-2.1=1$.","**Solve:** $c=3.1$, i.e. \\$3.10 per play."],"a":"Charge \\$3.10"},{"t":"warn","x":"Always define the random variable in words before calculating, and keep track of whether you are working with winnings or net gain."},{"t":"p","x":"**Exam tip.** End with a recommendation that refers to your numbers: \"Option A is better for a cautious investor because it has the same mean (\\$200) but half the standard deviation.\""},{"t":"tb","rec":"1,2,5,6,7,10,12","ext":"14,15,17","x":"Exercise 6.5 is context modelling with decisions and expected profit.","code":"6.5"}],"checks":[{"topic":"Raffle","q":"1000 tickets at \\$1; one prize of \\$300. Expected net gain per ticket?","a":"-0.7","alt":["-$0.70","-0.70"],"ad":"$-\\$0.70$","sol":"Net gains: $299$ with probability $\\frac1{1000}$; $-1$ with probability $\\frac{999}{1000}$. || $E=\\frac{299}{1000}-\\frac{999}{1000}$. || $=\\frac{-700}{1000}$. || $=-\\$0.70$.","h":["Subtract the ticket cost.","Two outcomes.","Weight and add."]},{"topic":"Risk","q":"Options have equal means; SDs are \\$40 and \\$90. Which is less risky?","a":"40","alt":["the one with SD $40","first","SD 40"],"ad":"The option with SD \\$40","sol":"Risk is measured by spread. || A smaller SD means outcomes stay closer to the mean. || \\$40 \u003c \\$90. || So the \\$40 option is less risky.","h":["What does SD measure?","Smaller spread means less uncertainty.","Compare."]},{"topic":"Cost","q":"Faults per hour $F$ have mean 0.4. Each costs \\$15. Expected hourly cost?","a":"6","alt":["$6"],"ad":"\\$6","sol":"Cost $C=15F$. || $E(C)=15E(F)$. || $=15\\times0.4$. || $=\\$6$.","h":["Write cost in terms of $F$.","Linear rule for means.","Multiply."]},{"topic":"Price","q":"A game pays \\$8 with probability 0.25, otherwise nothing. What price gives zero expected profit for the stall?","a":"2","alt":["$2"],"ad":"\\$2","sol":"Expected payout $=8(0.25)=2$. || Zero profit means price equals expected payout. || So the price is \\$2. || At \\$2 the game is fair.","h":["Find the expected payout.","Set price $=$ payout.","$8\\times0.25$."]},{"topic":"Spread","q":"A return is \\$0 or \\$400, each with probability 0.5. Find its SD.","a":"200","alt":["$200"],"ad":"\\$200","sol":"Mean: 200. || $E(X^2)=\\frac{0+160000}{2}=80000$. || $\\operatorname{Var}=80000-40000=40000$. || SD $=\\sqrt{40000}=200$.","h":["Mean first.","$E(X^2)$.","Square root of the variance."]}]},{"id":"mm3-c06-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Checklist.** Valid distribution (0 to 1, sum 1). $E(X)=\\sum xP$. $\\operatorname{Var}=E(X^2)-\\mu^2$. Linear rules: $E(aX+b)=aE(X)+b$, $\\operatorname{Var}(aX+b)=a^2\\operatorname{Var}(X)$. Conditional: $P(A\\mid B)=\\frac{P(A\\cap B)}{P(B)}$. Always interpret with units."},{"t":"ex","title":"Exam-style: unknowns and spread (full working)","q":"$X=1,2,3$ with $P=a,\\ 2a,\\ a+0.2$, and $E(X)=2.2$. Find $a$ and $\\operatorname{Var}(X)$.","s":["**Sum to 1:** $a+2a+a+0.2=1\\Rightarrow4a=0.8\\Rightarrow a=0.2$. Probabilities: $0.2,0.4,0.4$.","**Check the mean:** $1(0.2)+2(0.4)+3(0.4)=0.2+0.8+1.2=2.2$ \u2713 (consistent with the given mean).","**$E(X^2)$:** $1(0.2)+4(0.4)+9(0.4)=0.2+1.6+3.6=5.4$.","**Variance:** $5.4-2.2^2=5.4-4.84=0.56$."],"a":"$a=0.2$, $\\operatorname{Var}(X)=0.56$"},{"t":"ex","title":"Exam-style: transformation in context (full working)","q":"The number of calls $N$ per hour has mean 6 and SD 2. Staff are paid \\$20 per hour plus \\$3 per call. Find the mean and SD of the hourly cost.","s":["**Cost:** $C=3N+20$.","**Mean:** $E(C)=3(6)+20=38$.","**SD:** $\\operatorname{SD}(C)=|3|\\times2=6$ (the \\$20 does not affect spread).","**Interpret:** the hourly cost averages \\$38 with a typical spread of \\$6."],"a":"Mean \\$38, SD \\$6"}],"checks":[{"topic":"Combined","q":"$X$ has $E(X)=5$, $\\operatorname{Var}(X)=4$. Find $E(2X+1)$ and $\\operatorname{SD}(2X+1)$.","a":"11,4","alt":["11 and 4","E=11, SD=4"],"ad":"$E=11$, $\\operatorname{SD}=4$","sol":"$E(2X+1)=2(5)+1=11$. || $\\operatorname{SD}(X)=\\sqrt4=2$. || $\\operatorname{SD}(2X+1)=2\\times2=4$. || Answers: 11 and 4.","h":["Linear rule for the mean.","$\\sigma=2$.","Multiply SD by $|a|$."]},{"topic":"Valid","q":"Is $P(X=x)=\\frac{x}{15}$ for $x=1,\\dots,5$ valid?","a":"yes","alt":["Yes"],"ad":"Yes","sol":"Probabilities: $\\frac1{15},\\frac2{15},\\frac3{15},\\frac4{15},\\frac5{15}$, all between 0 and 1. || Sum: $\\frac{1+2+3+4+5}{15}=\\frac{15}{15}$. || $=1$. || Both conditions hold: valid.","h":["Check each is between 0 and 1.","Add them.","Sum must be 1."]},{"topic":"Back from variance","q":"$X$ has mean 4 and variance 3. Find $E(X^2)$.","a":"19","alt":[],"ad":"$19$","sol":"$E(X^2)=\\operatorname{Var}(X)+[E(X)]^2$. || $=3+16$. || $=19$. || Check: $19-16=3$.","h":["Rearrange the variance formula.","Square the mean.","Add."]},{"topic":"Conditional","q":"$X=0,1,2$ with $P=0.5,0.3,0.2$. Find $P(X=2\\mid X\\neq0)$.","a":"0.4","alt":["2/5"],"ad":"$0.4$","sol":"$P(X\\neq0)=0.3+0.2=0.5$. || $P(X=2\\text{ and }X\\neq0)=P(X=2)=0.2$. || $\\frac{0.2}{0.5}$. || $=0.4$.","h":["Find $P(X\\neq0)$.","The intersection is $X=2$.","Divide."]},{"topic":"Hourly cost","q":"$N$ has SD 3. Cost is $C=4N+50$. Find $\\operatorname{SD}(C)$.","a":"12","alt":["$12"],"ad":"$12$","sol":"Adding 50 does not change spread. || Multiplying by 4 multiplies the SD by 4. || $4\\times3$. || $\\operatorname{SD}(C)=12$.","h":["Ignore the added constant.","Multiply SD by 4.","$4\\times3$."]}]}],"quiz":[{"topic":"Valid distribution","q":"$P(X=x)=\\frac{x}{15}$ for $x=1,\\dots,5$. Is this a valid distribution? (yes or no)","a":"yes","alt":["Yes"],"ad":"yes","sol":"Each probability $\\frac{x}{15}$ is between 0 and 1 for $x=1,\\dots,5$. || Their sum is $\\frac{1+2+3+4+5}{15}=\\frac{15}{15}=1$. || Both conditions for a valid distribution hold. || So yes, it is valid.","h":["Add the probabilities.","$1+2+3+4+5=15$.","Compare with 1."]},{"topic":"Unknown","q":"$P(X=x)$: $0.1,\\ k,\\ 0.4,\\ 0.2$. Find $k$.","a":"0.3","alt":[".3","3/10"],"ad":"$0.3$","sol":"Probabilities must add to 1: $0.1+k+0.4+0.2=1$. || The known values add to $0.7$. || So $k=1-0.7$. || $k=0.3$.","h":["They sum to 1.","Add the known.","Subtract from 1."]},{"topic":"Expected value","q":"$X=1,2,3$ with $P=0.5,0.3,0.2$. Find $E(X)$.","a":"1.7","alt":["1.70"],"ad":"$1.7$","sol":"$E(X)=\\sum xP(X=x)$. || $1(0.5)+2(0.3)+3(0.2)=0.5+0.6+0.6$. || Add. || $E(X)=1.7$.","h":["$\\sum xP(x)$.","$1(0.5)+2(0.3)+3(0.2)$.","Add."]},{"topic":"Linear","q":"$E(X)=4$. Find $E(5X-3)$.","a":"17","alt":["17."],"ad":"$17$","sol":"Use $E(aX+b)=aE(X)+b$. || $E(5X-3)=5E(X)-3$. || $=5(4)-3$. || $=17$.","h":["$E(aX+b)=aE(X)+b$.","$a=5$, $b=-3$.","Compute."]},{"topic":"Variance","q":"$\\operatorname{Var}(X)=9$. Find $\\operatorname{Var}(2X+7)$.","a":"36","alt":["36."],"ad":"$36$","sol":"$\\operatorname{Var}(aX+b)=a^2\\operatorname{Var}(X)$. || $a=2$, so multiply by $4$. || The $+7$ does not change the spread. || $4\\times9=36$.","h":["Constants added do not change spread.","Multiply by $a^2$.","$4\\times9$."]},{"topic":"Standard deviation","q":"$\\operatorname{Var}(X)=16$. Find $\\sigma(3X)$.","a":"12","alt":["12."],"ad":"$12$","sol":"$\\sigma(X)=\\sqrt{16}=4$. || $\\sigma(aX)=|a|\\sigma(X)$. || $3\\times4$. || $=12$.","h":["Find $\\sigma$
