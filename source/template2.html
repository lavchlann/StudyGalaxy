=\\frac{3\\sqrt3}2-\\frac{3\\sqrt3}2=0$.","h":["$\\cos\\frac\\pi6=\\frac{\\sqrt3}2$.","Cube it.","Substitute."]},{"topic":"Basis","q":"In the proof of $\\sum_{i=1}^n i=\\frac{n(n+1)}2$, what is the value of the right side when $n=1$?","a":"1","alt":[],"ad":"$1$","sol":"$\\frac{1\\cdot2}2$.","h":["Substitute.","$1\\cdot2$.","Divide."]},{"topic":"Sum","q":"$1+2+\\dots+10$.","a":"55","alt":[],"ad":"$55$","sol":"$\\frac{10\\cdot11}2$.","h":["Formula.","$10\\cdot11$.","Halve."]},{"topic":"Step","q":"If $S_k=k^2$, what is $S_{k+1}$ in expanded form?","a":"k^2+2k+1","alt":[],"ad":"$k^2+2k+1$","sol":"$(k+1)^2$.","h":["Substitute.","Expand.","Simplify."]},{"topic":"Divisibility","q":"If $7^k-1=6m$, then $7^{k+1}-1=7(6m)+6=6(\\ ?)$. Enter the expression in $m$.","a":"7m+1","alt":[],"ad":"$7m+1$","sol":"$7\\cdot6m+6=6(7m+1)$.","h":["Rewrite.","Factor 6.","Finish."]},{"topic":"Identity","q":"$\\cos^2\\theta-\\sin^2\\theta=\\cos\\ ?\\,\\theta$. Enter the number.","a":"2","alt":[],"ad":"$2$","sol":"Double angle.","h":["Identity.","Double.","2."]},{"topic":"Principle","q":"Induction proves a statement for all integers $n\\ge$ what, given basis $n=1$?","a":"1","alt":[],"ad":"$1$","sol":"Basis starts the chain.","h":["Basis.","$n=1$.","All $n\\ge1$."]},{"topic":"Sum","q":"$1^2+2^2+3^2$.","a":"14","alt":[],"ad":"$14$","sol":"$1+4+9$.","h":["Squares.","Add.","14."]},{"topic":"Divisible","q":"$n^2+n$ for $n=3$ is divisible by?","a":"12","alt":[],"ad":"$12$ (and by $2$)","sol":"$9+3=12$.","h":["Compute.","12.","Done."]},{"topic":"Counterexample","q":"Is $2^n>n^2$ true for $n=3$? Yes or no.","a":"no","alt":["No"],"ad":"No","sol":"$8>9$ is false.","h":["$2^3$.","$3^2$.","Compare."]},{"topic":"Sum","q":"$\\sum_{i=1}^{4}(2i-1)$.","a":"16","alt":[],"ad":"$16$","sol":"$1+3+5+7$.","h":["Terms.","Add.","16."]}],"comets":[{"topic":"Extension: Prove an inequality","q":"For which smallest integer $n\\ge1$ is $2^n>n^2$ true for all $n$ from there on? (Check $n=1,\\dots,5$.)","a":"5","alt":["n=5"],"ad":"$n=5$","sol":"$n=1:2>1$ \u2713; $n=2:4>4$ \u2717; $n=3:8>9$ \u2717; $n=4:16>16$ \u2717; $n=5:32>25$ \u2713 and it holds for all $n\\ge5$ by induction.","h":["Test small values.","Watch for equality.","First $n$ after which it always holds."]},{"topic":"Extension: Double angle with De Moivre","q":"Use $(\\cos\\theta+i\\sin\\theta)^2$ to find $\\sin2\\theta$ in terms of $\\sin\\theta$ and $\\cos\\theta$.","a":"2sin(theta)cos(theta)","alt":["2sin\u03b8cos\u03b8","2sin(x)cos(x)","2sinthetacostheta","2 sin theta cos theta"],"ad":"$2\\sin\\theta\\cos\\theta$","sol":"Imaginary part of $c^2+2ics-s^2$ is $2cs$.","h":["Expand the square.","Imaginary part.","Compare with $\\sin2\\theta$."]},{"topic":"Extension: Inequality","q":"For which smallest integer $n$ does $2^n>n^2$ hold for all larger $n$ too?","a":"5","alt":[],"ad":"$5$","sol":"$n=5$: $32>25$; $n=3$ and $4$ fail ($8\u003c9$, $16=16$).","h":["Test small $n$.","$n=4$ ties.","$n=5$ works."]}],"hours":3},"ms3-c03":{"id":"ms3-c03","interactive":"vec3d","summary":"Vectors describe quantities with direction in two and three dimensions. This chapter extends 2D vectors to 3D, uses the dot product for angles and projections, proves geometric results, writes lines in vector, parametric and Cartesian form, uses the cross product, and finds planes and distances.","videos":[{"src":"B","title":"Dot products and duality (3Blue1Brown, linear algebra ch. 9)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Dot+products+and+duality+essence+of+linear+algebra+chapter+9","kind":"search"},{"src":"B","title":"Cross products (3Blue1Brown, linear algebra ch. 10)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Cross+products+essence+of+linear+algebra+chapter+10","kind":"search"},{"src":"B","title":"Vectors, what even are they? (3Blue1Brown, linear algebra ch. 1)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Vectors+what+even+are+they+essence+of+linear+algebra+chapter+1","kind":"search"},{"src":"J","title":"Vectors in 3D","url":"https://www.youtube.com/results?search_query=Joel+Speranza+vectors+three+dimensions","kind":"search"},{"src":"J","title":"Dot product and angle between vectors","url":"https://www.youtube.com/results?search_query=Joel+Speranza+dot+product+vectors+angle","kind":"search"},{"src":"J","title":"Cross product","url":"https://www.youtube.com/results?search_query=Joel+Speranza+cross+product+vectors","kind":"search"},{"src":"J","title":"Vector equation of a line and plane","url":"https://www.youtube.com/results?search_query=Joel+Speranza+vector+equation+line+plane","kind":"search"}],"sections":[{"id":"ms3-c03-s1","code":"3.2","title":"Vectors in three dimensions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: vectors in three dimensions","url":"https://www.youtube.com/results?search_query=Joel+Speranza+vectors+in+three+dimensions","kind":"search"},{"src":"B","title":"3Blue1Brown: Vectors, what even are they","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Vectors+what+even+are+they+essence+of+linear+algebra","kind":"search"}]},{"t":"p","x":"A 3D vector is $\\mathbf v=a\\mathbf i+b\\mathbf j+c\\mathbf k=\\begin{pmatrix}a\\\\b\\\\c\\end{pmatrix}$. Its **magnitude** is $|\\mathbf v|=\\sqrt{a^2+b^2+c^2}$ and a **unit vector** is $\\hat{\\mathbf v}=\\frac{\\mathbf v}{|\\mathbf v|}$. The vector from $A$ to $B$ is $\\overrightarrow{AB}=\\mathbf b-\\mathbf a$."},{"t":"ex","title":"Vector between points","q":"$A(1,2,3)$ and $B(4,-2,5)$. Find $\\overrightarrow{AB}$, $|\\overrightarrow{AB}|$ and a unit vector in its direction.","s":["$\\overrightarrow{AB}=\\begin{pmatrix}3\\\\-4\\\\2\\end{pmatrix}$.","$|\\overrightarrow{AB}|=\\sqrt{9+16+4}=\\sqrt{29}$."],"a":"$\\overrightarrow{AB}=3\\mathbf i-4\\mathbf j+2\\mathbf k$, $|\\overrightarrow{AB}|=\\sqrt{29}$, $\\hat{\\mathbf u}=\\frac1{\\sqrt{29}}(3,-4,2)$."},{"t":"warn","x":"$\\overrightarrow{AB}=\\mathbf b-\\mathbf a$ (end minus start). Reversing the order gives $\\overrightarrow{BA}$, which points the other way."},{"t":"tb","rec":"1,2,4,5,7,8,10,11,12","ext":"13,15,16,18,20","x":"Exercise 3.2 uses components, magnitude, unit vectors and linear combinations in 3D.","code":"3.2"},{"t":"ex","title":"Magnitude and unit vector","q":"$\\mathbf a=2\\mathbf i-2\\mathbf j+\\mathbf k$. Find $|\\mathbf a|$ and $\\hat{\\mathbf a}$.","s":["$|\\mathbf a|=\\sqrt{4+4+1}=3$."],"a":"$3$ and $\\frac13(2\\mathbf i-2\\mathbf j+\\mathbf k)$"}]},{"id":"ms3-c03-s2","code":"3.3","title":"Vector algebra and the dot product","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: dot product of vectors","url":"https://www.youtube.com/results?search_query=Joel+Speranza+dot+product+of+vectors","kind":"search"},{"src":"B","title":"3Blue1Brown: Dot products and duality","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Dot+products+and+duality","kind":"search"}]},{"t":"key","x":"$$\\mathbf a\\cdot\\mathbf b=a_1b_1+a_2b_2+a_3b_3=|\\mathbf a||\\mathbf b|\\cos\\theta$$"},{"t":"p","x":"Two vectors are **perpendicular** exactly when $\\mathbf a\\cdot\\mathbf b=0$ and **parallel** when one is a scalar multiple of the other. The **scalar projection** of $\\mathbf a$ on $\\mathbf b$ is $\\frac{\\mathbf a\\cdot\\mathbf b}{|\\mathbf b|}$ and the **vector projection** is $\\frac{\\mathbf a\\cdot\\mathbf b}{|\\mathbf b|^2}\\mathbf b$. Also $\\mathbf a\\cdot\\mathbf a=|\\mathbf a|^2$."},{"t":"ex","title":"Angle between vectors","q":"Find the angle between $\\mathbf a=(1,2,2)$ and $\\mathbf b=(2,-1,2)$.","s":["$\\mathbf a\\cdot\\mathbf b=2-2+4=4$; $|\\mathbf a|=3$; $|\\mathbf b|=3$.","$\\cos\\theta=\\frac49$, so $\\theta=\\cos^{-1}\\frac49\\approx63.6^\\circ$."],"a":"$\\approx63.6^\\circ$"},{"t":"ex","title":"Perpendicular","q":"Find $t$ so that $(t,2,-1)\\perp(3,1,t)$.","s":["$3t+2-t=0\\Rightarrow2t=-2\\Rightarrow t=-1$."],"a":"$t=-1$"},{"t":"warn","x":"The dot product gives a **number**, not a vector. Never write $\\mathbf a\\cdot\\mathbf b=\\mathbf c$."},{"t":"int","name":"vec3d","cap":"Rotate two vectors in 3D and read off $\\mathbf a\\cdot\\mathbf b$, the angle and the projection."},{"t":"tb","rec":"2,3,5,6,7,8,10,11","ext":"13,15,17,20","x":"Exercise 3.3 uses the dot product for angles, perpendicularity and projections.","code":"3.3"},{"t":"ex","title":"Angle","q":"Angle between $\\mathbf a=(1,2,2)$ and $\\mathbf b=(2,0,1)$.","s":["$\\mathbf a\\cdot\\mathbf b=2+0+2=4$; $|\\mathbf a|=3$; $|\\mathbf b|=\\sqrt5$.","$\\cos\\theta=\\frac4{3\\sqrt5}$, $\\theta\\approx0.93$ rad ($53.4^\\circ$)."],"a":"about $53.4^\\circ$"},{"t":"ex","title":"Perpendicular","q":"Find $t$ so that $(t,2,-1)\\perp(3,1,t)$.","s":["Dot product $=3t+2-t=2t+2=0$."],"a":"$t=-1$"}]},{"id":"ms3-c03-s3","code":"3.4","title":"Vector proofs in geometry","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: vector proofs in geometry","url":"https://www.youtube.com/results?search_query=Joel+Speranza+vector+proofs+in+geometry","kind":"search"}]},{"t":"p","x":"Choose position vectors for key points, express the sides as vector differences, and use the dot product (perpendicular) or scalar multiples (parallel). Classic results: the diagonals of a rhombus are perpendicular; the angle in a semicircle is $90^\\circ$; the midpoint of $AB$ has position vector $\\frac12(\\mathbf a+\\mathbf b)$."},{"t":"ex","title":"Angle in a semicircle","q":"$AB$ is a diameter of a circle with centre $O$, and $P$ is on the circle. Show $\\angle APB=90^\\circ$.","s":["Let $\\overrightarrow{OA}=\\mathbf a$, $\\overrightarrow{OB}=-\\mathbf a$, $\\overrightarrow{OP}=\\mathbf p$ with $|\\mathbf p|=|\\mathbf a|$.","$\\overrightarrow{PA}\\cdot\\overrightarrow{PB}=(\\mathbf a-\\mathbf p)\\cdot(-\\mathbf a-\\mathbf p)=-|\\mathbf a|^2+|\\mathbf p|^2=0$."],"a":"Perpendicular, so $\\angle APB=90^\\circ$."},{"t":"tb","rec":"1,3,5,6,7,8,9,10,11","ext":"13,17,20","x":"Exercise 3.4 proves geometric properties using vector methods.","code":"3.4"},{"t":"ex","title":"Collinear points","q":"Show $A(1,2,3)$, $B(3,6,7)$, $C(4,8,9)$ are collinear.","s":["$\\vec{AB}=(2,4,4)$, $\\vec{AC}=(3,6,6)$.","$\\vec{AC}=\\frac32\\vec{AB}$, so they are parallel and share $A$."],"a":"Collinear."}]},{"id":"ms3-c03-s4","code":"3.5","title":"Vector, parametric and Cartesian equations","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: vector equation of a line in 3D","url":"https://www.youtube.com/results?search_query=Joel+Speranza+vector+equation+of+a+line+in+3D","kind":"search"}]},{"t":"p","x":"A **line** through point $\\mathbf a$ with direction $\\mathbf d$ is $\\mathbf r=\\mathbf a+\\lambda\\mathbf d$. In 3D, eliminating $\\lambda$ gives the Cartesian form $\\frac{x-x_0}{d_1}=\\frac{y-y_0}{d_2}=\\frac{z-z_0}{d_3}$. Two lines in 3D can be **parallel**, **intersecting**, or **skew** (neither). To test: equate components, solve two equations, and check the third."},{"t":"ex","title":"Do the lines meet?","q":"$L_1:\\ \\mathbf r=(1,0,2)+\\lambda(1,1,1)$ and $L_2:\\ \\mathbf r=(0,1,3)+\\mu(2,1,0)$.","s":["$1+\\lambda=2\\mu$, $\\lambda=1+\\mu$, $2+\\lambda=3$.","Third: $\\lambda=1$, then $\\mu=0$; first: $2=0$? \u2717."],"a":"They do not intersect and are not parallel, so they are skew."},{"t":"tb","rec":"1,4,5,7,9,10,12,15","ext":"16,17,18,20,23","x":"Exercise 3.5 writes lines in all three forms and tests intersection, skewness and parallelism.","code":"3.5"},{"t":"ex","title":"Line through two points","q":"Vector equation of the line through $(1,0,2)$ and $(3,2,1)$.","s":["Direction $(2,2,-1)$."],"a":"$\\mathbf r=(1,0,2)+\\lambda(2,2,-1)$"},{"t":"ex","title":"Intersection","q":"Do $\\mathbf r=(0,0,0)+s(1,1,1)$ and $\\mathbf r=(1,0,0)+t(0,1,1)$ intersect?","s":["$s=1$ (x), $s=t$ (y), $s=t$ (z): $t=1$, consistent."],"a":"Yes, at $(1,1,1)$."}]},{"id":"ms3-c03-s5","code":"3.6","title":"The cross product","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: cross product","url":"https://www.youtube.com/results?search_query=Joel+Speranza+cross+product","kind":"search"},{"src":"B","title":"3Blue1Brown: Cross products","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Cross+products+essence+of+linear+algebra","kind":"search"}]},{"t":"key","x":"$$\\mathbf a\\times\\mathbf b=\\begin{pmatrix}a_2b_3-a_3b_2\\\\a_3b_1-a_1b_3\\\\a_1b_2-a_2b_1\\end{pmatrix},\\qquad|\\mathbf a\\times\\mathbf b|=|\\mathbf a||\\mathbf b|\\sin\\theta$$"},{"t":"p","x":"The result is **perpendicular to both** $\\mathbf a$ and $\\mathbf b$ (right-hand rule), so it is a **normal** to the plane they span. $|\\mathbf a\\times\\mathbf b|$ is the **area of the parallelogram**; half of it is the area of the triangle. Order matters: $\\mathbf b\\times\\mathbf a=-\\mathbf a\\times\\mathbf b$."},{"t":"ex","title":"Cross product and area","q":"$\\mathbf a=(1,2,3)$, $\\mathbf b=(0,1,4)$. Find $\\mathbf a\\times\\mathbf b$ and the triangle area.","s":["$(2\\cdot4-3\\cdot1,\\ 3\\cdot0-1\\cdot4,\\ 1\\cdot1-2\\cdot0)=(5,-4,1)$.","$|\\mathbf a\\times\\mathbf b|=\\sqrt{25+16+1}=\\sqrt{42}$, so the triangle area is $\\frac{\\sqrt{42}}{2}$."],"a":"$(5,-4,1)$; area $\\frac{\\sqrt{42}}2$"},{"t":"tb","rec":"1,2,5,6,8,9","ext":"13,16,17,19","x":"Exercise 3.6 computes cross products, areas and normals, and the scalar triple product.","code":"3.6"},{"t":"ex","title":"Cross product","q":"$(1,2,3)\\times(0,1,4)$.","s":["$(2\\cdot4-3\\cdot1,\\ 3\\cdot0-1\\cdot4,\\ 1\\cdot1-2\\cdot0)$."],"a":"$(5,\\,-4,\\,1)$"},{"t":"ex","title":"Triangle area","q":"Area of the triangle with $\\vec{AB}=(1,1,0)$, $\\vec{AC}=(0,1,1)$.","s":["Cross $=(1,-1,1)$, magnitude $\\sqrt3$."],"a":"$\\frac{\\sqrt3}2$"}]},{"id":"ms3-c03-s6","code":"3.7","title":"Applications: planes and distances","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: vector equation of a plane","url":"https://www.youtube.com/results?search_query=Joel+Speranza+vector+equation+of+a+plane","kind":"search"}]},{"t":"p","x":"A plane with normal $\\mathbf n=(a,b,c)$ through $\\mathbf p_0$ has equation $\\mathbf n\\cdot\\mathbf r=\\mathbf n\\cdot\\mathbf p_0$, which expands to $ax+by+cz=d$. Get a normal from a cross product of two vectors in the plane. A line is parallel to the plane when its direction is perpendicular to $\\mathbf n$."},{"t":"ex","title":"Equation of a plane","q":"Find the plane through $A(1,0,0)$, $B(0,2,0)$, $C(0,0,3)$.","s":["$\\overrightarrow{AB}=(-1,2,0)$, $\\overrightarrow{AC}=(-1,0,3)$. Cross: $(6,3,2)$.","Plane: $6x+3y+2z=6\\cdot1=6$."],"a":"$6x+3y+2z=6$"},{"t":"tb","rec":"1,2,4,5,6,7,9","ext":"12,13,15,17,21","x":"Exercise 3.7 applies vectors to planes, intersections and shortest distances.","code":"3.7"},{"t":"ex","title":"Plane","q":"Plane through $(1,0,0)$ with normal $(2,1,-1)$.","s":["$2x+y-z=2$."],"a":"$2x+y-z=2$"}]},{"id":"ms3-c03-s7","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Plan.** Angle or perpendicular: dot product. Area, normal to a plane, or perpendicular to two directions: cross product. Line questions: write $\\mathbf r=\\mathbf a+\\lambda\\mathbf d$ and equate components. Always state both **vector** and **parametric** form if asked."},{"t":"p","x":"**Notation.** Vectors are bold or underlined in writing. Do not mix up $|\\mathbf a|$ (scalar) and $\\mathbf a$ (vector). Write final angles in degrees or radians as the question asks."}]}],"quiz":[{"topic":"Magnitude","q":"Find $|(2,-3,6)|$.","a":"7","alt":["7."],"ad":"$7$","sol":"$\\sqrt{4+9+36}=7$.","h":["Sum of squares.","$4+9+36=49$.","Square root."]},{"topic":"Between points","q":"$A(1,1,1)$, $B(3,4,1)$. Find $|\\overrightarrow{AB}|$ exactly.","a":"sqrt13","alt":["sqrt(13)","\u221a13"],"ad":"$\\sqrt{13}$","sol":"$(2,3,0)$, $\\sqrt{4+9}=\\sqrt{13}$.","h":["$B-A$.","$(2,3,0)$.","Magnitude."]},{"topic":"Dot product","q":"Find $(1,2,3)\\cdot(4,-1,2)$.","a":"8","alt":["8."],"ad":"$8$","sol":"$4-2+6=8$.","h":["Multiply matching components.","$4,-2,6$.","Add."]},{"topic":"Perpendicular","q":"Find $k$ so that $(k,3,1)\\perp(2,1,-5)$.","a":"1","alt":["k=1"],"ad":"$k=1$","sol":"$2k+3-5=0\\Rightarrow k=1$.","h":["Dot product is 0.","$2k+3-5=0$.","Solve."]},{"topic":"Angle","q":"Find the angle between $(1,0,0)$ and $(1,1,0)$ in degrees.","a":"45","alt":["45 degrees","45\u00b0"],"ad":"$45^\\circ$","sol":"$\\cos\\theta=\\frac{1}{\\sqrt2}$.","h":["Dot product $=1$.","Magnitudes $1$ and $\\sqrt2$.","$\\cos^{-1}\\frac1{\\sqrt2}$."]},{"topic":"Cross","q":"Find $(1,0,0)\\times(0,1,0)$ as a vector $(x,y,z)$.","a":"(0,0,1)","alt":["0,0,1","k"],"ad":"$(0,0,1)=\\mathbf k$","sol":"$\\mathbf i\\times\\mathbf j=\\mathbf k$.","h":["Use the formula.","Only the last component is non-zero.","$1\\cdot1-0\\cdot0$."]},{"topic":"Area","q":"Find the area of the parallelogram spanned by $(3,0,0)$ and $(0,4,0)$.","a":"12","alt":["12."],"ad":"$12$","sol":"$|\\mathbf a\\times\\mathbf b|=|(0,0,12)|=12$.","h":["Cross product.","$(0,0,12)$.","Magnitude."]},{"topic":"Plane","q":"A plane has normal $(2,1,-1)$ and passes through $(1,1,1)$. Find $d$ in $2x+y-z=d$.","a":"2","alt":["d=2"],"ad":"$d=2$","sol":"$2+1-1=2$.","h":["Substitute the point.","$2(1)+1-1$.","Compute."]},{"topic":"Projection","q":"Find the scalar projection of $(3,4,0)$ onto $(1,0,0)$.","a":"3","alt":["3."],"ad":"$3$","sol":"$\\frac{3}{1}=3$.","h":["$\\frac{\\mathbf a\\cdot\\mathbf b}{|\\mathbf b|}$.","$\\mathbf a\\cdot\\mathbf b=3$.","$|\\mathbf b|=1$."]},{"topic":"Lines","q":"Lines $\\mathbf r=(0,0,0)+\\lambda(1,2,3)$ and $\\mathbf r=(1,1,1)+\\mu(2,4,6)$ are (parallel, intersecting or skew)?","a":"parallel","alt":["Parallel"],"ad":"parallel","sol":"Directions are multiples. Check: $(1,1,1)$ is not on line 1 (needs $(t,2t,3t)$), so they are parallel and distinct.","h":["Compare directions.","$(2,4,6)=2(1,2,3)$.","Same direction."]},{"topic":"Magnitude","q":"$|(2,3,6)|$.","a":"7","alt":[],"ad":"$7$","sol":"$\\sqrt{4+9+36}$.","h":["Square each.","Sum 49.","Root."]},{"topic":"Dot","q":"$(1,2,3)\\cdot(4,-5,6)$.","a":"12","alt":[],"ad":"$12$","sol":"$4-10+18$.","h":["Multiply parts.","Add.","12."]},{"topic":"Perpendicular","q":"$(2,k,1)\\cdot(1,2,-4)=0$. Find $k$.","a":"1","alt":[],"ad":"$k=1$","sol":"$2+2k-4=0$.","h":["Dot.","Set zero.","Solve."]},{"topic":"Cross","q":"$\\mathbf i\\times\\mathbf j$ equals which of $\\mathbf i,\\mathbf j,\\mathbf k$?","a":"k","alt":["K","k"],"ad":"$\\mathbf k$","sol":"Right hand rule.","h":["Right hand.","Perpendicular to both.","Axis."]},{"topic":"Area","q":"Area of the parallelogram with sides $(3,0,0)$ and $(0,2,0)$.","a":"6","alt":[],"ad":"$6$","sol":"$|(0,0,6)|$.","h":["Cross.","$(0,0,6)$.","Magnitude."]},{"topic":"Line","q":"Direction of the line through $(1,1,1)$ and $(2,3,5)$: enter its third component.","a":"4","alt":[],"ad":"$4$","sol":"$(1,2,4)$.","h":["Subtract.","$5-1$.","4."]},{"topic":"Plane","q":"Normal $(1,2,3)$ through the origin: value of the constant $d$ in $x+2y+3z=d$.","a":"0","alt":[],"ad":"$0$","sol":"Origin satisfies it.","h":["Substitute $(0,0,0)$.","$0$.","Done."]},{"topic":"Unit","q":"$|\\hat{\\mathbf a}|$ for any non-zero $\\mathbf a$.","a":"1","alt":[],"ad":"$1$","sol":"Unit vector.","h":["Definition.","Length.","1."]},{"topic":"Projection","q":"Scalar projection of $(3,4,0)$ onto $(1,0,0)$.","a":"3","alt":[],"ad":"$3$","sol":"$\\frac{\\mathbf a\\cdot\\mathbf b}{|\\mathbf b|}$.","h":["Dot.","$3$.","Divide by 1."]},{"topic":"Angle","q":"$\\cos\\theta$ for $(1,0,0)$ and $(1,1,0)$. Exact.","a":"sqrt2/2","alt":["1/sqrt2","sqrt(2)/2","\u221a2/2"],"ad":"$\\frac{\\sqrt2}2$","sol":"$\\frac{1}{\\sqrt2}$.","h":["Dot.","Magnitudes.","Divide."]}],"comets":[{"topic":"Extension: Shortest distance idea","q":"$|\\mathbf a\\times\\mathbf b|$ gives the area of a parallelogram. Find $|(1,1,0)\\times(0,1,1)|$ exactly.","a":"sqrt3","alt":["sqrt(3)","\u221a3"],"ad":"$\\sqrt3$","sol":"$(1,-1,1)$, magnitude $\\sqrt3$.","h":["Compute the cross product.","$(1\\cdot1-0,\\ 0-1\\cdot1,\\ 1-0)$.","Magnitude."]},{"topic":"Extension: Triple product","q":"Find the volume of the parallelepiped with edges $(1,0,0)$, $(0,2,0)$, $(0,0,3)$.","a":"6","alt":["6."],"ad":"$6$","sol":"$|\\mathbf a\\cdot(\\mathbf b\\times\\mathbf c)|=|(1,0,0)\\cdot(6,0,0)|=6$.","h":["Triple product.","$\\mathbf b\\times\\mathbf c=(6,0,0)$.","Dot with $\\mathbf a$."]},{"topic":"Extension: Distance point to plane","q":"Distance from the origin to the plane $2x-y+2z=9$.","a":"3","alt":[],"ad":"$3$","sol":"$\\frac{|9|}{\\sqrt{4+1+4}}=3$.","h":["Normal $(2,-1,2)$.","Magnitude 3.","Divide."]}],"hours":5},"ms3-c04":{"id":"ms3-c04","interactive":"none","summary":"Vector calculus describes motion in a plane or space. Position, velocity and acceleration are vectors of functions of time. This chapter covers position vectors for circles and ellipses, collisions, differentiating and integrating vectors, straight-line motion, and applications including projectiles and circular motion.","videos":[{"src":"B","title":"Derivative formulas through geometry (3Blue1Brown, ch. 3)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Derivative+formulas+through+geometry+Essence+of+calculus+chapter+3","kind":"search"},{"src":"J","title":"Vector calculus: position, velocity, acceleration","url":"https://www.youtube.com/results?search_query=Joel+Speranza+vector+calculus+position+velocity+acceleration","kind":"search"},{"src":"J","title":"Projectile motion with vectors","url":"https://www.youtube.com/results?search_query=Joel+Speranza+projectile+motion+vector+calculus","kind":"search"},{"src":"J","title":"Circular motion with vectors","url":"https://www.youtube.com/results?search_query=Joel+Speranza+circular+motion+vectors+specialist","kind":"search"}],"sections":[{"id":"ms3-c04-s1","code":"4.2","title":"Position vectors as functions of time","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: position vector parametric equations","url":"https://www.youtube.com/results?search_query=Joel+Speranza+position+vector+parametric+equations","kind":"search"}]},{"t":"p","x":"A **position vector** $\\mathbf r(t)=x(t)\\mathbf i+y(t)\\mathbf j$ traces a **path**. To find the Cartesian equation, eliminate $t$. Circle: $\\mathbf r=(a\\cos t,\\ a\\sin t)$ gives $x^2+y^2=a^2$. Ellipse: $\\mathbf r=(a\\cos t,\\ b\\sin t)$ gives $\\frac{x^2}{a^2}+\\frac{y^2}{b^2}=1$. Hyperbola: $\\mathbf r=(a\\sec t,\\ b\\tan t)$ gives $\\frac{x^2}{a^2}-\\frac{y^2}{b^2}=1$."},{"t":"ex","title":"Eliminating the parameter","q":"Find the Cartesian equation of $\\mathbf r(t)=(2\\cos t+1,\\ 3\\sin t-2)$.","s":["$\\cos t=\\frac{x-1}2$, $\\sin t=\\frac{y+2}3$.","$\\sin^2t+\\cos^2t=1\\Rightarrow\\frac{(x-1)^2}4+\\frac{(y+2)^2}9=1$."],"a":"Ellipse centred at $(1,-2)$ with semi-axes 2 and 3."},{"t":"warn","x":"Use $\\sin^2t+\\cos^2t=1$ on the isolated terms, not on the coefficients. Isolate $\\cos t$ and $\\sin t$ first."},{"t":"tb","rec":"1,3,6,7,8,9,11,12,13,14","ext":"15,16,21,22,24","x":"Exercise 4.2 sketches paths, eliminates $t$ and finds direction of motion.","code":"4.2"},{"t":"ex","title":"Circle parametric","q":"Convert $\\mathbf r=(3\\cos t,\\ 3\\sin t)$ to Cartesian.","s":["$x^2+y^2=9\\cos^2t+9\\sin^2t=9$."],"a":"$x^2+y^2=9$"}]},{"id":"ms3-c04-s2","code":"4.3","title":"Collisions","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: vectors collision","url":"https://www.youtube.com/results?search_query=Joel+Speranza+vectors+collision","kind":"search"}]},{"t":"p","x":"Two particles with position vectors $\\mathbf r_1(t)$ and $\\mathbf r_2(t)$ **collide** at time $t$ when $\\mathbf r_1(t)=\\mathbf r_2(t)$ for the **same** $t$. Two paths can cross without a collision if the particles arrive at the intersection at different times. Equate $\\mathbf i$ and $\\mathbf j$ components and solve; the **same** $t$ must satisfy both."},{"t":"ex","title":"Collision?","q":"$\\mathbf r_1=(2t,\\ t^2)$, $\\mathbf r_2=(t+2,\\ 4)$. Do they collide?","s":["$2t=t+2\\Rightarrow t=2$. $t^2=4\\Rightarrow t=\\pm2$.","$t=2$ satisfies both."],"a":"Collision at $t=2$, at position $(4,4)$."},{"t":"tb","rec":"1,2,3,4,5,9,11","ext":"12,14,15","x":"Exercise 4.3 tests for collisions and closest approach.","code":"4.3"},{"t":"ex","title":"Collision","q":"$\\mathbf r_1=(t,\\,2t)$ and $\\mathbf r_2=(4-t,\\,3)$. Do they meet?","s":["$t=4-t\\Rightarrow t=2$ and $2t=3\\Rightarrow t=1.5$.","Times differ, so the paths cross but the objects do not collide."],"a":"No collision."}]},{"id":"ms3-c04-s3","code":"4.4","title":"Differentiating and integrating vectors","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: differentiating and integrating vectors","url":"https://www.youtube.com/results?search_query=Joel+Speranza+differentiating+and+integrating+vectors","kind":"search"}]},{"t":"key","x":"$$\\mathbf v(t)=\\mathbf r'(t)=(x'(t),\\,y'(t)),\\qquad\\mathbf a(t)=\\mathbf v'(t)=(x''(t),\\,y''(t))$$"},{"t":"p","x":"Differentiate and integrate **component by component**. **Speed** is $|\\mathbf v|=\\sqrt{x'^2+y'^2}$. To integrate, add a **vector** constant, found from an initial condition: $\\mathbf r(t)=\\int\\mathbf v\\,dt+\\mathbf c$."},{"t":"ex","title":"From acceleration to position","q":"$\\mathbf a=(0,-10)$, $\\mathbf v(0)=(6,8)$, $\\mathbf r(0)=(0,0)$. Find $\\mathbf r(t)$.","s":["$\\mathbf v=(6,\\ -10t+8)$.","$\\mathbf r=(6t,\\ -5t^2+8t)$."],"a":"$\\mathbf r(t)=(6t,\\ 8t-5t^2)$"},{"t":"tb","rec":"1,2,3,5,7,10,14","ext":"15,18,19,20","x":"Exercise 4.4 differentiates and integrates vector functions, including finding speed.","code":"4.4"},{"t":"ex","title":"Differentiate","q":"$\\mathbf r=(t^2,\\ e^{t})$. Find $\\dot{\\mathbf r}$ and $\\ddot{\\mathbf r}$.","s":["$\\dot{\\mathbf r}=(2t,e^t)$; $\\ddot{\\mathbf r}=(2,e^t)$."],"a":"As above."},{"t":"ex","title":"Integrate","q":"$\\mathbf v=(2t,\\,3)$, $\\mathbf r(0)=(1,0)$.","s":["$\\mathbf r=(t^2+1,\\ 3t)$."],"a":"$\\mathbf r=(t^2+1,\\ 3t)$"}]},{"id":"ms3-c04-s4","code":"4.5","title":"Straight-line (rectilinear) motion","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: rectilinear motion calculus","url":"https://www.youtube.com/results?search_query=Joel+Speranza+rectilinear+motion+calculus","kind":"search"}]},{"t":"p","x":"On a line, $x(t)$ is position, $v=\\frac{dx}{dt}$, $a=\\frac{dv}{dt}=v\\frac{dv}{dx}$. The particle is **at rest** when $v=0$. **Displacement** is $x(b)-x(a)$; **distance** needs $\\int|v|\\,dt$. **Speeding up** when $v$ and $a$ have the same sign."},{"t":"ex","title":"Rectilinear","q":"$x=t^3-6t^2+9t$. Find when the particle is at rest, and its acceleration then.","s":["$v=3t^2-12t+9=3(t-1)(t-3)=0$, so $t=1$ or $3$.","$a=6t-12$: $a(1)=-6$, $a(3)=6$."],"a":"At rest at $t=1$ (a $=-6$) and $t=3$ ($a=6$)."},{"t":"tb","rec":"2,4,6,10,14","ext":"15,17,19","x":"Exercise 4.5 uses calculus for straight-line motion, including speed and distance.","code":"4.5"},{"t":"ex","title":"Speed","q":"Speed at $t=1$ for $\\mathbf r=(t^2,\\ t^3)$.","s":["$\\dot{\\mathbf r}=(2t,3t^2)=(2,3)$.","Speed $=\\sqrt{13}$."],"a":"$\\sqrt{13}$"}]},{"id":"ms3-c04-s5","code":"4.6","title":"Applications: projectiles and circular motion","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: projectile motion with vectors","url":"https://www.youtube.com/results?search_query=Joel+Speranza+projectile+motion+with+vectors","kind":"search"}]},{"t":"p","x":"**Projectile:** $\\mathbf a=(0,-g)$, so with launch speed $u$ at angle $\\alpha$, $\\mathbf r=(ut\\cos\\alpha,\\ ut\\sin\\alpha-\\frac12gt^2)$. The **flight time** is when $y=0$ again; the **range** is $x$ at that time. **Circular motion:** $\\mathbf r=(R\\cos\\omega t,\\ R\\sin\\omega t)$; speed is $R\\omega$ (constant), and acceleration points to the centre with magnitude $R\\omega^2$."},{"t":"ex","title":"Projectile","q":"A ball is launched at $20\\text{ m/s}$ at $30^\\circ$ with $g=10$. Find the time of flight.","s":["$y=20t\\sin30^\\circ-5t^2=10t-5t^2=0\\Rightarrow t=2$."],"a":"$2$ seconds"},{"t":"tb","rec":"1,2,4,7,9,11,12","ext":"13,15,16,19","x":"Exercise 4.6 applies vector calculus to projectiles and circular motion.","code":"4.6"},{"t":"ex","title":"Projectile","q":"Launch at $20$ m/s at $30^\\circ$. Position $(20\\cos30^\\circ\\,t,\\ 20\\sin30^\\circ\\,t-5t^2)$. When does it land?","s":["$10t-5t^2=0\\Rightarrow t=2$."],"a":"$t=2$ s"}]},{"id":"ms3-c04-s6","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Eliminate the parameter** by solving one equation for $t$ and substituting, or by using an identity like $\\cos^2+\\sin^2=1$. State the domain implied by the parameter range."},{"t":"p","x":"**Rates.** Velocity is $\\dot{\\mathbf r}$, speed is $|\\dot{\\mathbf r}|$, acceleration is $\\ddot{\\mathbf r}$. Speed is a scalar; velocity is a vector."}]}],"quiz":[{"topic":"Path","q":"$\\mathbf r=(3\\cos t,\\ 3\\sin t)$ traces which Cartesian curve? Give $x^2+y^2=$ ?","a":"9","alt":["x^2+y^2=9","9."],"ad":"$x^2+y^2=9$","sol":"$\\cos^2+\\sin^2=1$ so $x^2+y^2=9$.","h":["$x=3\\cos t$.","Square and add.","$9(\\cos^2t+\\sin^2t)$."]},{"topic":"Velocity","q":"$\\mathbf r=(t^2,\\ 3t)$. Find $\\mathbf v(2)$ as $(x,y)$.","a":"(4,3)","alt":["4,3"],"ad":"$(4,3)$","sol":"$\\mathbf v=(2t,3)$; $\\mathbf v(2)=(4,3)$.","h":["Differentiate each component.","$(2t,3)$.","Substitute $t=2$."]},{"topic":"Speed","q":"$\\mathbf v=(4,3)$. Find the speed.","a":"5","alt":["5."],"ad":"$5$","sol":"$\\sqrt{16+9}=5$.","h":["Magnitude.","$16+9$.","Root."]},{"topic":"Acceleration","q":"$\\mathbf r=(t^3,\\ 2t^2)$. Find $\\mathbf a(1)$.","a":"(6,4)","alt":["6,4"],"ad":"$(6,4)$","sol":"$\\mathbf v=(3t^2,4t)$, $\\mathbf a=(6t,4)$, $\\mathbf a(1)=(6,4)$.","h":["Differentiate twice.","$(6t,4)$.","Substitute."]},{"topic":"Integrate","q":"$\\mathbf v=(2t,\\ 6t^2)$ and $\\mathbf r(0)=(1,0)$. Find $\\mathbf r(1)$.","a":"(2,2)","alt":["2,2"],"ad":"$(2,2)$","sol":"$\\mathbf r=(t^2+1,\\ 2t^3)$; $\\mathbf r(1)=(2,2)$.","h":["Integrate each component.","Add the constant vector.","Substitute."]},{"topic":"Collision","q":"$\\mathbf r_1=(t,\\ 2t)$ and $\\mathbf r_2=(3-t,\\ 3)$. At what $t$ do they collide?","a":"1.5","alt":["3/2","t=1.5"],"ad":"$t=\\tfrac32$","sol":"$t=3-t\\Rightarrow t=1.5$; $2t=3\\Rightarrow t=1.5$ \u2713.","h":["Equate $\\mathbf i$.","$t=1.5$.","Check $\\mathbf j$."]},{"topic":"Rest","q":"$x=t^2-4t$. When is the particle at rest?","a":"2","alt":["t=2"],"ad":"$t=2$","sol":"$v=2t-4=0$.","h":["Differentiate.","Set to 0.","Solve."]},{"topic":"Projectile","q":"Time of flight for $y=15t-5t^2$ (positive time when $y=0$).","a":"3","alt":["3 s","t=3"],"ad":"$3$","sol":"$5t(3-t)=0\\Rightarrow t=3$.","h":["Set $y=0$.","Factor $5t$.","Take the positive root."]},{"topic":"Circular","q":"$\\mathbf r=(5\\cos2t,\\ 5\\sin2t)$. Find the speed.","a":"10","alt":["10."],"ad":"$10$","sol":"Speed $=R\\omega=5\\times2=10$.","h":["$R=5$.","$\\omega=2$.","Multiply."]},{"topic":"Displacement","q":"$v=2t$ on $0\\le t\\le3$. Find the displacement.","a":"9","alt":["9."],"ad":"$9$","sol":"$\\int_0^32t\\,dt=9$.","h":["Integrate $v$.","$[t^2]_0^3$.","Evaluate."]},{"topic":"Derivative","q":"$\\mathbf r=(t^3,\\,2t)$. $\\dot{\\mathbf r}$ at $t=1$: enter the first component.","a":"3","alt":[],"ad":"$3$","sol":"$3t^2$.","h":["Differentiate.","$3t^2$.","At 1."]},{"topic":"Speed","q":"$\\dot{\\mathbf r}=(3,4)$. Speed?","a":"5","alt":[],"ad":"$5$","sol":"$\\sqrt{9+16}$.","h":["Magnitude.","$\\sqrt{25}$.","5."]},{"topic":"Integrate","q":"$\\mathbf v=(4t,0)$, $\\mathbf r(0)=(0,0)$. $x(2)$?","a":"8","alt":[],"ad":"$8$","sol":"$x=2t^2$.","h":["Integrate.","$2t^2$.","At 2."]},{"topic":"Acceleration","q":"$\\mathbf r=(t^2,t^2)$. Magnitude of acceleration?","a":"2sqrt2","alt":["2\u221a2","sqrt8"],"ad":"$2\\sqrt2$","sol":"$\\ddot{\\mathbf r}=(2,2)$.","h":["Differentiate twice.","$(2,2)$.","Magnitude."]},{"topic":"Eliminate","q":"$x=t$, $y=t^2$. Write $y$ in terms of $x$: enter the power.","a":"2","alt":[],"ad":"$y=x^2$","sol":"Substitute.","h":["$x=t$.","$y=x^2$.","Power 2."]},{"topic":"Time","q":"Projectile height $10t-5t^2$. Maximum height?","a":"5","alt":[],"ad":"$5$","sol":"At $t=1$: $10-5=5$.","h":["Vertex.","$t=1$.","Substitute."]},{"topic":"Stationary","q":"$\\mathbf v=(t-2,\\ t-2)$ is zero when $t=$?","a":"2","alt":[],"ad":"$2$","sol":"Both components vanish.","h":["Set zero.","$t-2=0$.","2."]},{"topic":"Distance","q":"Position $(3t,4t)$. Distance from origin at $t=2$?","a":"10","alt":[],"ad":"$10$","sol":"$(6,8)$, length $10$.","h":["Position.","$(6,8)$.","Magnitude."]},{"topic":"Direction","q":"$\\mathbf v=(0,5)$. Is the object moving in the $x$ or $y$ direction?","a":"y","alt":["Y"],"ad":"$y$","sol":"Only $y$ changes.","h":["Components.","$x$ speed zero.","$y$."]},{"topic":"Constant","q":"If $\\ddot{\\mathbf r}=(0,-10)$ and the initial velocity is $(5,0)$, the $x$-component of velocity at $t=3$?","a":"5","alt":[],"ad":"$5$","sol":"No horizontal acceleration.","h":["$\\ddot x=0$.","Constant.","5."]}],"comets":[{"topic":"Extension: Closest approach idea","q":"$\\mathbf r_1=(t,0)$, $\\mathbf r_2=(0,t-2)$. Find the squared distance $d^2$ in terms of $t$, then find the minimum value of $d^2$.","a":"2","alt":["2."],"ad":"$d^2_{\\min}=2$","sol":"$d^2=t^2+(t-2)^2=2t^2-4t+4$, minimum at $t=1$ is $2$.","h":["Distance formula.","Expand.","Minimise the quadratic."]},{"topic":"Extension: Speed maximum","q":"$\\mathbf r=(\\cos t,\\ 2\\sin t)$. Find the maximum speed.","a":"2","alt":["2."],"ad":"$2$","sol":"$\\mathbf v=(-\\sin t,\\ 2\\cos t)$, $|\\mathbf v|^2=\\sin^2t+4\\cos^2t=1+3\\cos^2t$, max $4$ so speed $2$.","h":["Differentiate.","Square the speed.","Use $\\cos^2t\\le1$."]},{"topic":"Extension: Maximum range","q":"For speed $v$ at angle $\\theta$ with $g=10$, the range is $\\frac{v^2\\sin2\\theta}{10}$. For $v=20$, the maximum range is?","a":"40","alt":[],"ad":"$40$ m at $45^\\circ$","sol":"$\\sin2\\theta=1$: $\\frac{400}{10}$.","h":["Maximise $\\sin2\\theta$.","It is 1.","Compute."]}],"hours":4},"ms3-c05":{"id":"ms3-c05","interactive":"matrix","summary":"Matrices store and transform data. This chapter covers matrix algebra, determinants and inverses, solving systems by Gaussian elimination, the three solution cases, dominance and Leslie matrices, and applications such as Markov chains and cryptography.","videos":[{"src":"B","title":"Linear transformations and matrices (3Blue1Brown, ch. 3)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Linear+transformations+and+matrices+essence+of+linear+algebra+chapter+3","kind":"search"},{"src":"B","title":"Matrix multiplication as composition (3Blue1Brown, ch. 4)","url":"https://www.youtube.com/results?search_query=3Blue1Brown+Matrix+multiplication+as+composition+essence+of+linear+algebra+chapter+4","kind":"search"},{"src":"B","title":"The determinant (3Blue1Brown, ch. 6)","url":"https://www.youtube.com/watch?v=Ip3X9LOh2dk","kind":"video"},{"src":"B","title":"Inverse matrices, column space and null space (3Blue1Brown, ch. 7)","url":"https://www.youtube.com/watch?v=uQhTuRlWMxw","kind":"video"},{"src":"J","title":"Matrix operations","url":"https://www.youtube.com/results?search_query=Joel+Speranza+matrices+operations","kind":"search"},{"src":"J","title":"Gaussian elimination","url":"https://www.youtube.com/results?search_query=Joel+Speranza+Gaussian+elimination","kind":"search"},{"src":"J","title":"Leslie matrices and Markov chains","url":"https://www.youtube.com/results?search_query=Joel+Speranza+Leslie+matrix+Markov+chain","kind":"search"}],"sections":[{"id":"ms3-c05-s1","code":"5.2","title":"Matrix algebra, determinants and inverses","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: matrix inverse and determinant","url":"https://www.youtube.com/results?search_query=Joel+Speranza+matrix+inverse+and+determinant","kind":"search"},{"src":"B","title":"3Blue1Brown: The determinant","url":"https://www.youtube.com/watch?v=Ip3X9LOh2dk","kind":"video"}]},{"t":"p","x":"**Addition** is entry by entry (same size). **Scalar multiple** scales every entry. **Product** $AB$ requires columns of $A$ = rows of $B$; entry $(i,j)$ is row $i$ of $A$ dotted with column $j$ of $B$. Multiplication is **not commutative**: $AB\\ne BA$ in general."},{"t":"key","x":"For $A=\\begin{pmatrix}a&b\\\\c&d\\end{pmatrix}$: $\\det A=ad-bc$ and $A^{-1}=\\dfrac{1}{ad-bc}\\begin{pmatrix}d&-b\\\\-c&a\\end{pmatrix}$ when $\\det A\\ne0$. For any invertible matrices, $(AB)^{-1}=B^{-1}A^{-1}$."},{"t":"ex","title":"Inverse","q":"Find the inverse of $A=\\begin{pmatrix}2&1\\\\5&3\\end{pmatrix}$.","s":["$\\det A=6-5=1$.","$A^{-1}=\\begin{pmatrix}3&-1\\\\-5&2\\end{pmatrix}$."],"a":"$A^{-1}=\\begin{pmatrix}3&-1\\\\-5&2\\end{pmatrix}$"},{"t":"ex","title":"Solving $AX=B$","q":"Solve $A\\mathbf x=\\begin{pmatrix}4\\\\9\\end{pmatrix}$ for $A$ above.","s":["$\\mathbf x=A^{-1}\\mathbf b=\\begin{pmatrix}3(4)-9\\\\-5(4)+2(9)\\end{pmatrix}=\\begin{pmatrix}3\\\\-2\\end{pmatrix}$."],"a":"$x=3,\\ y=-2$"},{"t":"warn","x":"Multiply by the inverse on the **same side** on both sides. If $AX=B$ then $X=A^{-1}B$, not $BA^{-1}$."},{"t":"int","name":"matrix","cap":"Apply a 2x2 matrix to a unit square and watch the area scale by the determinant."},{"t":"tb","rec":"1,2,3,5,7,9,10,11,16","ext":"18,19,21,23","x":"Exercise 5.2 covers matrix arithmetic, determinants, inverses and matrix equations.","code":"5.2"},{"t":"ex","title":"Inverse","q":"Inverse of $\\begin{pmatrix}2&1\\\\5&3\\end{pmatrix}$.","s":["$\\det=6-5=1$.","$\\frac1{1}\\begin{pmatrix}3&-1\\\\-5&2\\end{pmatrix}$."],"a":"$\\begin{pmatrix}3&-1\\\\-5&2\\end{pmatrix}$"},{"t":"int","name":"matrix","cap":"Drag the four entries: the green and blue arrows show where the two basis vectors land; the determinant is the area scale factor."}]},{"id":"ms3-c05-s2","code":"5.3","title":"Gaussian elimination","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: Gaussian elimination","url":"https://www.youtube.com/results?search_query=Joel+Speranza+Gaussian+elimination","kind":"search"}]},{"t":"p","x":"Write the system as an **augmented matrix** and use row operations (swap rows, scale a row, add a multiple of one row to another) to reach **row echelon form**, then **back-substitute**. Keep track of each operation, for example $R_2\\to R_2-2R_1$."},{"t":"ex","title":"Solving a 3\u00d73 system","q":"Solve $x+y+z=6$, $2y+5z=-4$, $2x+5y-z=27$.","s":["Eliminate $x$ from row 3: $R_3\\to R_3-2R_1$: $3y-3z=15\\Rightarrow y-z=5$.","Now $2y+5z=-4$ and $y-z=5$. $2(5+z)+5z=-4\\Rightarrow7z=-14\\Rightarrow z=-2$.","$y=3$, $x=6-3+2=5$."],"a":"$(x,y,z)=(5,3,-2)$"},{"t":"tb","rec":"4,5,6,9,12","ext":"13,16","x":"Exercise 5.3 solves systems by elimination and with technology.","code":"5.3"},{"t":"ex","title":"Gaussian elimination","q":"$x+y=3$, $2x-y=0$.","s":["Add the equations: $3x=3\\Rightarrow x=1$, then $y=2$."],"a":"$x=1,\\ y=2$"}]},{"id":"ms3-c05-s3","code":"5.4","title":"The three cases","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: systems of equations number of solutions parameter","url":"https://www.youtube.com/results?search_query=Joel+Speranza+systems+of+equations+number+of+solutions+parameter","kind":"search"},{"src":"B","title":"3Blue1Brown: Inverse matrices, column space and null space","url":"https://www.youtube.com/watch?v=uQhTuRlWMxw","kind":"video"}]},{"t":"p","x":"A system of linear equations has **one** solution, **no** solution, or **infinitely many**. After elimination, a row $0=k$ with $k\\ne0$ means **no solution** (inconsistent). A row $0=0$ leaves a free variable: let it be a parameter $t$ to describe the **infinite** solution set. For a square system, $\\det A=0$ means it is **not** the unique case."},{"t":"ex","title":"Parameter","q":"$x+y+z=3$ and $x-y+z=1$. Describe all solutions.","s":["Adding: $2x+2z=4$, so $x=2-z$. Subtracting: $2y=2$, so $y=1$.","Let $z=t$: $x=2-t$."],"a":"$(2-t,\\ 1,\\ t)$, a line of solutions."},{"t":"ex","title":"Finding the parameter","q":"For what $k$ does $x+2y=3$, $2x+4y=k$ have no solution?","s":["Second $-2\\times$ first: $0=k-6$."],"a":"No solution when $k\\ne6$; infinitely many when $k=6$."},{"t":"tb","rec":"1,2,3","ext":"5,8,10,12,15,17,22","x":"Exercise 5.4 classifies systems with parameters.","code":"5.4"},{"t":"ex","title":"Parameter","q":"For which $k$ does $x+y=1$, $2x+2y=k$ have no solution?","s":["Parallel lines unless $k=2$."],"a":"$k\\ne2$"}]},{"id":"ms3-c05-s4","code":"5.5","title":"Dominance and Leslie matrices","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: Leslie matrices","url":"https://www.youtube.com/results?search_query=Joel+Speranza+Leslie+matrices","kind":"search"}]},{"t":"p","x":"A **dominance matrix** has entry $1$ if $i$ beats $j$ (else $0$). One-step dominance counts direct wins; $A+A^2$ counts one- and two-step wins. A **Leslie matrix** models age-structured populations: the top row holds **fertility** rates and the sub-diagonal holds **survival** rates. If $\\mathbf x_n$ is the population vector, $\\mathbf x_{n+1}=L\\mathbf x_n$ and $\\mathbf x_n=L^n\\mathbf x_0$."},{"t":"ex","title":"Leslie matrix","q":"$L=\\begin{pmatrix}0&2\\\\0.5&0\\end{pmatrix}$ and $\\mathbf x_0=\\begin{pmatrix}100\\\\40\\end{pmatrix}$. Find $\\mathbf x_1$.","s":["$\\mathbf x_1=\\begin{pmatrix}0(100)+2(40)\\\\0.5(100)+0\\end{pmatrix}=\\begin{pmatrix}80\\\\50\\end{pmatrix}$."],"a":"$\\begin{pmatrix}80\\\\50\\end{pmatrix}$"},{"t":"tb","rec":"1,3,6,7","ext":"9,11,13,14","x":"Exercise 5.5 builds dominance and Leslie matrices and iterates them.","code":"5.5"},{"t":"ex","title":"Leslie matrix","q":"$L=\\begin{pmatrix}0&2\\\\0.5&0\\end{pmatrix}$, population $(10,\\ 6)$ next generation.","s":["$(0\\cdot10+2\\cdot6,\\ 0.5\\cdot10+0)=(12,\\ 5)$."],"a":"$(12,\\ 5)$"}]},{"id":"ms3-c05-s5","code":"5.6","title":"Applications","blocks":[{"t":"vid","items":[{"src":"J","title":"Joel Speranza: Markov chains transition matrix","url":"https://www.youtube.com/results?search_query=Joel+Speranza+Markov+chains+transition+matrix","kind":"search"}]},{"t":"p","x":"A **transition matrix** $T$ (columns sum to 1) takes a state vector forward: $\\mathbf s_{n+1}=T\\mathbf s_n$. The **steady state** satisfies $T\\mathbf s=\\mathbf s$ with entries summing to 1. Matrices also encode and decode messages: encode with $E$, decode with $E^{-1}$."},{"t":"ex","title":"Steady state","q":"$T=\\begin{pmatrix}0.8&0.3\\\\0.2&0.7\\end{pmatrix}$. Find the steady state.","s":["$0.8s_1+0.3s_2=s_1\\Rightarrow0.3s_2=0.2s_1\\Rightarrow s_1=1.5s_2$, with $s_1+s_2=1$.","$s_2=0.4$, $s_1=0.6$."],"a":"$\\begin{pmatrix}0.6\\\\0.4\\end{pmatrix}$"},{"t":"tb","rec":"1,3,4,5","ext":"9,11,13,15,18","x":"Exercise 5.6 applies matrices to Markov chains, cryptography and networks.","code":"5.6"},{"t":"ex","title":"Steady state","q":"Transition matrix $\\begin{pmatrix}0.9&0.2\\\\0.1&0.8\\end{pmatrix}$. Find the steady state.","s":["$0.1a=0.2b\\Rightarrow a=2b$; with $a+b=1$, $b=\\frac13$."],"a":"$\\left(\\frac23,\\ \\frac13\\right)$"}]},{"id":"ms3-c05-s6","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Check inverses.** Multiply $AA^{-1}$ and confirm you get $I$. A singular matrix has $\\det=0$ and no inverse. Remember $(AB)^{-1}=B^{-1}A^{-1}$ and $(AB)^T=B^TA^T$."},{"t":"p","x":"**Markov chains.** Columns sum to 1. State vector next step $=T\\mathbf s$. Steady state solves $T\\mathbf s=\\mathbf s$ with components summing to 1."}]}],"quiz":[{"topic":"Determinant","q":"Find $\\det\\begin{pmatrix}3&1\\\\2&4\\end{pmatrix}$.","a":"10","alt":["10."],"ad":"$10$","sol":"$12-2=10$.","h":["$ad-bc$.","$3\\cdot4-1\\cdot2$.","Compute."]},{"topic":"Product","q":"If $A=\\begin{pmatrix}1&2\\\\0&1\\end{pmatrix}$ and $B=\\begin{pmatrix}1&0\\\\3&1\\end{pmatrix}$, find the top-left entry of $AB$.","a":"7","alt":["7."],"ad":"$7$","sol":"$1\\cdot1+2\\cdot3=7$.","h":["Row 1 of $A$ times column 1 of $B$.","$(1,2)\\cdot(1,3)$.","Add."]},{"topic":"Inverse","q":"Find the inverse of $\\begin{pmatrix}1&2\\\\1&3\\end{pmatrix}$. Give the entries row by row as (a,b;c,d).","a":"(3,-2;-1,1)","alt":["3,-2;-1,1","(3,-2,-1,1)","3,-2,-1,1"],"ad":"$\\begin{pmatrix}3&-2\\\\-1&1\\end{pmatrix}$","sol":"$\\det=3-2=1$, so the inverse is $\\begin{pmatrix}3&-2\\\\-1&1\\end{pmatrix}$.","h":["Find the determinant.","Swap $a,d$ and negate $b,c$.","Divide by the determinant (here 1)."]},{"topic":"Singular","q":"For which $k$ is $\\begin{pmatrix}1&2\\\\3&k\\end{pmatrix}$ not invertible?","a":"6","alt":["k=6"],"ad":"$k=6$","sol":"$k-6=0$.","h":["Determinant is 0.","$k-6$.","Solve."]},{"topic":"Solve","q":"$\\begin{pmatrix}2&0\\\\0&5\\end{pmatrix}\\mathbf x=\\begin{pmatrix}6\\\\10\\end{pmatrix}$. Find $\\mathbf x$ as $(x,y)$.","a":"(3,2)","alt":["3,2"],"ad":"$(3,2)$","sol":"$x=3$, $y=2$.","h":["Each row separately.","$2x=6$.","$5y=10$."]},{"topic":"Cases","q":"$x+y=2$ and $2x+2y=5$ has how many solutions? (none, one, or infinite)","a":"none","alt":["no solution","0"],"ad":"none","sol":"Second $-2\\times$ first gives $0=1$.","h":["Eliminate.","$0=1$.","Contradiction."]},{"topic":"Cases","q":"$x+y=2$ and $2x+2y=4$ has how many solutions? (none, one, or infinite)","a":"infinite","alt":["infinitely many"],"ad":"infinite","sol":"Second equation is double the first.","h":["Is one a multiple of the other?","Yes.","A free parameter."]},{"topic":"Leslie","q":"$L=\\begin{pmatrix}1&3\\\\0.4&0\\end{pmatrix}$, $\\mathbf x_0=\\begin{pmatrix}10\\\\20\\end{pmatrix}$. Find the first entry of $\\mathbf x_1$.","a":"70","alt":["70."],"ad":"$70$","sol":"$1(10)+3(20)=70$.","h":["Row 1 times $\\mathbf x_0$.","$10+60$.","Add."]},{"topic":"Steady state","q":"$T=\\begin{pmatrix}0.9&0.2\\\\0.1&0.8\\end{pmatrix}$. Find the first entry of the steady state (exact fraction).","a":"2/3","alt":["0.667","0.6667"],"ad":"$\\tfrac23$","sol":"$0.1s_1=0.2s_2$, so $s_1=2s_2$; with sum 1, $s_1=\\frac23$.","h":["$0.9s_1+0.2s_2=s_1$.","$s_1=2s_2$.","$s_1+s_2=1$."]},{"topic":"Properties","q":"True or false: $AB=BA$ for all square matrices.","a":"false","alt":["False"],"ad":"false","sol":"Matrix multiplication is not commutative.","h":["Try a small example.","Order matters.","Not always."]},{"topic":"Determinant","q":"$\\begin{vmatrix}3&1\\\\4&2\\end{vmatrix}$.","a":"2","alt":[],"ad":"$2$","sol":"$6-4$.","h":["$ad-bc$.","$3\\cdot2-1\\cdot4$.","Compute."]},{"topic":"Inverse","q":"Determinant of $\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}$.","a":"-2","alt":[],"ad":"$-2$","sol":"$4-6$.","h":["$ad-bc$.","$4-6$.","$-2$."]},{"topic":"Product","q":"$\\begin{pmatrix}1&0\\\\0&2\\end{pmatrix}\\begin{pmatrix}3\\\\4\\end{pmatrix}$: second component.","a":"8","alt":[],"ad":"$8$","sol":"$2\\cdot4$.","h":["Row 2.","$0\\cdot3+2\\cdot4$.","8."]},{"topic":"Singular","q":"For which $k$ is $\\begin{pmatrix}1&2\\\\3&k\\end{pmatrix}$ singular?","a":"6","alt":[],"ad":"$k=6$","sol":"$k-6=0$.","h":["det.","$k-6$.","Set zero."]},{"topic":"Solve","q":"$2x=6$ in matrix form: $x=?$","a":"3","alt":[],"ad":"$3$","sol":"Divide.","h":["Divide.","$6/2$.","3."]},{"topic":"Markov","q":"Each column of a transition matrix sums to?","a":"1","alt":[],"ad":"$1$","sol":"Probabilities.","h":["Probabilities.","Total.","1."]},{"topic":"Steady","q":"$\\begin{pmatrix}0.5&0.5\\\\0.5&0.5\\end{pmatrix}$ steady state first component.","a":"0.5","alt":["1/2"],"ad":"$0.5$","sol":"Symmetric.","h":["Equal.","Sum 1.","0.5."]},{"topic":"Leslie","q":"$L=\\begin{pmatrix}1&1\\\\1&0\\end{pmatrix}$ applied to $(2,1)$: first component.","a":"3","alt":[],"ad":"$3$","sol":"$2+1$.","h":["Row 1.","$1\\cdot2+1\\cdot1$.","3."]},{"topic":"Trace","q":"Trace of $\\begin{pmatrix}2&5\\\\7&3\\end{pmatrix}$.","a":"5","alt":[],"ad":"$5$","sol":"$2+3$.","h":["Diagonal.","Add.","5."]},{"topic":"Reflect","q":"Image of $(2,3)$ under $\\begin{pmatrix}1&0\\\\0&-1\\end{pmatrix}$: second component.","a":"-3","alt":[],"ad":"$-3$","sol":"Reflect in the $x$-axis.","h":["Multiply.","Row 2.","$-3$."]}],"comets":[{"topic":"Extension: Eigen idea","q":"$A=\\begin{pmatrix}2&0\\\\0&3\\end{pmatrix}$. Find $A\\begin{pmatrix}1\\\\0\\end{pmatrix}$ and say what scalar it multiplies the vector by.","a":"2","alt":["2."],"ad":"$2$","sol":"$A(1,0)^T=(2,0)^T=2(1,0)^T$.","h":["Multiply.","Compare to the original.","A scalar multiple."]},{"topic":"Extension: Parameter problem","q":"For what value of $k$ does $x+y+z=1,\\ x+2y+3z=2,\\ x+3y+kz=3$ have infinitely many solutions?","a":"5","alt":["k=5"],"ad":"$k=5$","sol":"$R_2-R_1$: $y+2z=1$; $R_3-R_1$: $2y+(k-1)z=2$. Then $R_3-2R_2$: $(k-5)z=0$. Infinite when $k=5$.","h":["Eliminate $x$.","Then eliminate $y$.","Look for $0=0$."]},{"topic":"Extension: Eigen idea","q":"For $\\begin{pmatrix}2&0\\\\0&3\\end{pmatrix}$, what is the larger scale factor along an axis?","a":"3","alt":[],"ad":"$3$","sol":"Diagonal entries.","h":["Axes.","Diagonal.","Larger is 3."]}],"hours":4},"ph3-c01":{"id":"ph3-c01","interactive":"projectile","summary":"A projectile is any object moving only under gravity. The key idea is that horizontal and vertical motion are independent: horizontally the velocity is constant, vertically the acceleration is $9.8\\ \\text{m s}^{-2}$ downward. This chapter covers splitting a velocity into components, horizontal launches, angled launches, and launches from a height.","videos":[{"src":"F","title":"Projectile motion, horizontal and angled launches","url":"https://www.youtube.com/results?search_query=Flipping+Physics+projectile+motion+physics","kind":"search"},{"src":"K","title":"Two-dimensional projectile motion","url":"https://www.youtube.com/results?search_query=Khan+Academy+two+dimensional+projectile+motion","kind":"search"},{"src":"V","title":"Veritasium: Which ball wins the race on a curved track?","url":"https://www.youtube.com/results?search_query=Veritasium+monkey+and+the+hunter+projectile","kind":"search"}],"sections":[{"id":"ph3-c01-s1","code":"1.1","title":"Components and independence","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: projectile motion components independence","url":"https://www.youtube.com/results?search_query=Flipping+Physics+projectile+motion+components+independence","kind":"search"}]},{"t":"p","x":"**Split every vector into two perpendicular parts.** A velocity $v$ at angle $\\theta$ above the horizontal has components $v_x=v\\cos\\theta$ and $v_y=v\\sin\\theta$. Gravity acts only downward, so it changes $v_y$ and never touches $v_x$. This is the whole chapter in one sentence: the two directions are independent and are linked only by **time**."},{"t":"key","x":"$$v_x=v\\cos\\theta,\\qquad v_y=v\\sin\\theta,\\qquad a_x=0,\\qquad a_y=-g=-9.8\\ \\text{m s}^{-2}$$"},{"t":"p","x":"**Kinematic equations for constant acceleration** (used separately in each direction): $v=u+at$, $s=ut+\\tfrac12at^2$, $v^2=u^2+2as$, $s=\\tfrac12(u+v)t$. Choose **up as positive** and keep your signs consistent. Time $t$ is the same in both directions, so it is the number you solve for in one direction and substitute into the other."},{"t":"ex","title":"Components","q":"A ball is thrown at $20\\ \\text{m s}^{-1}$ at $30^\\circ$ above the horizontal. Find its velocity components.","s":["$v_x=20\\cos30^\\circ=17.3\\ \\text{m s}^{-1}$.","$v_y=20\\sin30^\\circ=10.0\\ \\text{m s}^{-1}$ (upward)."],"a":"$17.3\\ \\text{m s}^{-1}$ horizontally and $10.0\\ \\text{m s}^{-1}$ vertically."},{"t":"warn","x":"In the absence of air resistance the **horizontal velocity never changes** and the acceleration is $9.8\\ \\text{m s}^{-2}$ downward **at every point**, including the very top of the flight where the vertical velocity is zero."},{"t":"int","name":"projectile","cap":"Change the launch speed, angle and height. Watch the range, time and maximum height change, and see that $45^\\circ$ gives the longest range from level ground."}]},{"id":"ph3-c01-s2","code":"1.2","title":"Horizontal launches","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: horizontal projectile launch","url":"https://www.youtube.com/results?search_query=Flipping+Physics+horizontal+projectile+launch","kind":"search"}]},{"t":"p","x":"When an object leaves a table or cliff **horizontally**, $u_y=0$. The fall time depends only on the height: $h=\\tfrac12gt^2$ so $t=\\sqrt{2h/g}$. The horizontal distance is then $x=v_xt$. An object dropped and one thrown horizontally from the same height **land at the same time**."},{"t":"ex","title":"Horizontal launch","q":"A ball is kicked horizontally at $12\\ \\text{m s}^{-1}$ from the edge of a $20\\ \\text{m}$ cliff. Find the time of flight, horizontal range, and impact speed.","s":["$t=\\sqrt{2(20)/9.8}=2.02\\ \\text{s}$.","Range $=12\\times2.02=24.2\\ \\text{m}$.","$v_y=gt=19.8\\ \\text{m s}^{-1}$ downward, so $v=\\sqrt{12^2+19.8^2}=23.2\\ \\text{m s}^{-1}$ at $\\tan^{-1}(19.8/12)=58.8^\\circ$ below the horizontal."],"a":"$2.02\\ \\text{s}$, $24.2\\ \\text{m}$, and $23.2\\ \\text{m s}^{-1}$ at $58.8^\\circ$ below horizontal."},{"t":"p","x":"**Impact speed uses Pythagoras and impact angle uses inverse tan** of the final components. State the angle relative to the horizontal and the direction (below horizontal) so the examiner can award the mark."}]},{"id":"ph3-c01-s3","code":"1.3","title":"Angled launches on level ground","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: projectile motion angled launch level ground","url":"https://www.youtube.com/results?search_query=Flipping+Physics+projectile+motion+angled+launch+level+ground","kind":"search"}]},{"t":"p","x":"For a launch at angle $\\theta$ from and back to the same height: time of flight $T=\\dfrac{2v\\sin\\theta}{g}$, maximum height $H=\\dfrac{v^2\\sin^2\\theta}{2g}$, range $R=\\dfrac{v^2\\sin2\\theta}{g}$. These are quick checks, but in an exam **derive from the kinematic equations** unless the question is routine. At the top, $v_y=0$."},{"t":"ex","title":"Angled launch","q":"A ball is launched at $25\\ \\text{m s}^{-1}$ at $40^\\circ$ above the horizontal from level ground. Find the time of flight, maximum height and range.","s":["$v_y=25\\sin40^\\circ=16.07$, $v_x=25\\cos40^\\circ=19.15$.","$T=\\frac{2(16.07)}{9.8}=3.28\\ \\text{s}$; $H=\\frac{16.07^2}{2(9.8)}=13.2\\ \\text{m}$.","$R=19.15\\times3.28=62.8\\ \\text{m}$."],"a":"$3.28\\ \\text{s}$, $13.2\\ \\text{m}$, $62.8\\ \\text{m}$."},{"t":"key","x":"**Complementary angles** ($\\theta$ and $90^\\circ-\\theta$) give the **same range** on level ground, because $\\sin2\\theta=\\sin(180^\\circ-2\\theta)$. The maximum range is at $45^\\circ$."}]},{"id":"ph3-c01-s4","code":"1.4","title":"Launches from a height","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: projectile launched from a height","url":"https://www.youtube.com/results?search_query=Flipping+Physics+projectile+launched+from+a+height","kind":"search"}]},{"t":"p","x":"If the landing point is **not** at the launch height, use $s_y=u_yt+\\tfrac12a_yt^2$ with $s_y$ equal to the net vertical displacement. This gives a quadratic in $t$; choose the physically sensible (positive) root."},{"t":"ex","title":"From a height","q":"A ball is thrown at $15\\ \\text{m s}^{-1}$ at $30^\\circ$ above the horizontal from a $10\\ \\text{m}$ high balcony. Find the time to reach the ground and the horizontal distance travelled.","s":["$u_y=7.5$, $u_x=12.99$. Taking up as positive, $s_y=-10$: $-10=7.5t-4.9t^2$.","$4.9t^2-7.5t-10=0\\Rightarrow t=\\dfrac{7.5+\\sqrt{56.25+196}}{9.8}=2.39\\ \\text{s}$.","$x=12.99\\times2.39=31.0\\ \\text{m}$."],"a":"$2.39\\ \\text{s}$ and $31.0\\ \\text{m}$."},{"t":"warn","x":"Discard the negative root of the quadratic: it corresponds to a time before launch."}]},{"id":"ph3-c01-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Method that earns marks.** (1) Draw the path and label components. (2) Choose up as positive. (3) Write the equation with symbols, then substitute with units. (4) Solve for time in the direction where you know most, then use it in the other. (5) Give answers to 2 or 3 significant figures with units."},{"t":"p","x":"**Air resistance** is ignored unless stated. If asked how air resistance changes the path, say the range and maximum height decrease and the path becomes asymmetric (steeper descent)."},{"t":"p","x":"**Common errors.** Using $g=+9.8$ for upward motion; mixing degrees and radians; applying $R=v^2\\sin2\\theta/g$ when the landing height differs; forgetting that $v_x$ is constant."}]}],"quiz":[{"topic":"Component","q":"A ball is thrown at $20\\ \\text{m s}^{-1}$ at $30^\\circ$ above the horizontal. Find its horizontal velocity component in $\\text{m s}^{-1}$ (1 decimal place).","a":"17.3","alt":[],"ad":"$17.3\\ \\text{m s}^{-1}$","sol":"$v_x=20\\cos30^\\circ=17.3$.","h":["Horizontal uses cosine.","$v_x=v\\cos\\theta$.","Substitute $20\\cos30^\\circ$."]},{"topic":"Fall time","q":"An object is dropped from rest from $45\\ \\text{m}$. Find the time to fall (seconds, 2 decimal places, $g=9.8$).","a":"3.03","alt":[],"ad":"$3.03\\ \\text{s}$","sol":"$t=\\sqrt{2(45)/9.8}=3.03\\ \\text{s}$.","h":["Use $s=\\frac12gt^2$.","$t=\\sqrt{2h/g}$.","Substitute."]},{"topic":"Horizontal range","q":"A ball is rolled horizontally off a $5.0\\ \\text{m}$ high table at $8.0\\ \\text{m s}^{-1}$. Find the horizontal distance travelled (metres, 1 decimal place).","a":"8.1","alt":[],"ad":"$8.1\\ \\text{m}$","sol":"$t=\\sqrt{2(5)/9.8}=1.01\\ \\text{s}$; $x=8.0\\times1.01=8.1\\ \\text{m}$.","h":["Find the fall time first.","$t=1.01$ s.","$x=v_xt$."]},{"topic":"Maximum height","q":"A projectile has initial vertical velocity $14.7\\ \\text{m s}^{-1}$. Find its maximum height above the launch point (metres, 1 decimal place).","a":"11.0","alt":["11"],"ad":"$11.0\\ \\text{m}$","sol":"$H=\\frac{14.7^2}{2(9.8)}=11.0$.","h":["At the top $v_y=0$.","$v^2=u^2+2as$.","$H=u^2/(2g)$."]},{"topic":"Time of flight","q":"Initial vertical velocity is $14.7\\ \\text{m s}^{-1}$ and the projectile lands at the launch height. Find the time of flight (seconds).","a":"3.0","alt":["3","3.00"],"ad":"$3.0\\ \\text{s}$","sol":"$T=\\frac{2(14.7)}{9.8}=3.0$.","h":["Up time equals down time.","$t_{up}=u_y/g$.","Double it."]},{"topic":"Best angle","q":"For a given launch speed on level ground, what launch angle (degrees) gives the maximum range?","a":"45","alt":[],"ad":"$45^\\circ$","sol":"$R=v^2\\sin2\\theta/g$ is maximum when $\\sin2\\theta=1$.","h":["Range depends on $\\sin2\\theta$.","The maximum of sine is 1.","$2\\theta=90^\\circ$."]},{"topic":"Top of flight","q":"What is the magnitude of the acceleration of a projectile at the very top of its path ($\\text{m s}^{-2}$, no air resistance)?","a":"9.8","alt":[],"ad":"$9.8\\ \\text{m s}^{-2}$ downward","sol":"Gravity acts throughout the flight.","h":["Is gravity switched off at the top?","Only the vertical velocity is zero.","Acceleration is $g$."]},{"topic":"Landing speed","q":"A ball is dropped from $20\\ \\text{m}$. Find its speed just before landing ($\\text{m s}^{-1}$, 1 decimal place).","a":"19.8","alt":[],"ad":"$19.8\\ \\text{m s}^{-1}$","sol":"$v=\\sqrt{2gh}=\\sqrt{2(9.8)(20)}=19.8$.","h":["$v^2=u^2+2as$.","$u=0$.","$v=\\sqrt{2gh}$."]},{"topic":"Range","q":"Find the range of a projectile launched at $20\\ \\text{m s}^{-1}$ at $30^\\circ$ from level ground (metres, 1 decimal place).","a":"35.3","alt":["35.4","35.35"],"ad":"$35.3\\ \\text{m}$","sol":"$R=\\frac{400\\sin60^\\circ}{9.8}=35.3$.","h":["$R=v^2\\sin2\\theta/g$.","$\\sin60^\\circ=0.866$.","Divide by 9.8."]},{"topic":"Vertical velocity","q":"An object falls from rest for $2.0\\ \\text{s}$. Find its speed at that time ($\\text{m s}^{-1}$).","a":"19.6","alt":["20"],"ad":"$19.6\\ \\text{m s}^{-1}$","sol":"$v=gt=9.8\\times2.0$.","h":["$v=u+at$.","$u=0$.","Multiply by 2.0."]}],"comets":[{"topic":"Extension: Complementary launch","q":"A ball is launched at $20\\ \\text{m s}^{-1}$ at $60^\\circ$ from level ground. Find its range in metres (1 decimal place).","a":"35.3","alt":["35.4","35.35"],"ad":"$35.3\\ \\text{m}$","sol":"$R=\\frac{400\\sin120^\\circ}{9.8}=35.3$, the same as at $30^\\circ$.","h":["$\\sin120^\\circ=\\sin60^\\circ$.","Complementary angles give equal ranges.","Compute."]},{"topic":"Extension: Maximum height","q":"Find the maximum height of a $20\\ \\text{m s}^{-1}$ projectile launched at $30^\\circ$ from level ground (metres, 1 decimal place).","a":"5.1","alt":[],"ad":"$5.1\\ \\text{m}$","sol":"$v_y=10$; $H=\\frac{100}{19.6}=5.1$.","h":["$v_y=20\\sin30^\\circ$.","$H=v_y^2/2g$.","$100/19.6$."]}],"hours":3.5},"ph3-c02":{"id":"ph3-c02","interactive":"incline","summary":"Forces on a slope are solved by splitting weight into a component along the slope and a component into it. This chapter covers free-body diagrams, Newton's second law, components on an incline, normal force, and static and kinetic friction.","videos":[{"src":"F","title":"Inclined planes and friction","url":"https://www.youtube.com/results?search_query=Flipping+Physics+inclined+plane+physics+friction+Newton+second+law","kind":"search"},{"src":"K","title":"Forces on inclined planes","url":"https://www.youtube.com/results?search_query=Khan+Academy+forces+on+inclined+planes","kind":"search"},{"src":"V","title":"Veritasium: Friction","url":"https://www.youtube.com/results?search_query=Veritasium+friction","kind":"search"}],"sections":[{"id":"ph3-c02-s1","code":"2.1","title":"Free-body diagrams and Newton's laws","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: free body diagrams Newton laws","url":"https://www.youtube.com/results?search_query=Flipping+Physics+free+body+diagrams+Newton+laws","kind":"search"}]},{"t":"p","x":"**Newton's second law:** $\\Sigma F=ma$. The net force is the vector sum of all forces. A **free-body diagram** shows only the forces acting **on** the object: weight $mg$ (down), normal force $N$ (perpendicular to the surface), friction $f$ (along the surface), applied forces and tension. **Constant velocity** means $\\Sigma F=0$, not \"no forces\"."},{"t":"key","x":"$$\\Sigma F=ma,\\qquad W=mg,\\qquad f_k=\\mu_kN,\\qquad f_s\\le\\mu_sN$$"},{"t":"ex","title":"Resultant force","q":"A $3.0\\ \\text{kg}$ trolley is pushed with a net force of $12\\ \\text{N}$. Find its acceleration.","s":["$a=\\frac{\\Sigma F}{m}=\\frac{12}{3.0}=4.0\\ \\text{m s}^{-2}$."],"a":"$4.0\\ \\text{m s}^{-2}$"},{"t":"warn","x":"Weight and normal force are **not** a Newton's third-law pair. A third-law pair acts on **different objects**: the Earth pulls the block down, and the block pulls the Earth up."}]},{"id":"ph3-c02-s2","code":"2.2","title":"Forces on a slope","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: forces on an inclined plane","url":"https://www.youtube.com/results?search_query=Flipping+Physics+forces+on+an+inclined+plane","kind":"search"}]},{"t":"p","x":"On a slope of angle $\\theta$, choose axes **along** and **perpendicular** to the surface. The weight splits into $mg\\sin\\theta$ (down the slope) and $mg\\cos\\theta$ (into the slope). With no acceleration perpendicular to the surface, $N=mg\\cos\\theta$. Down the slope, the net force is $mg\\sin\\theta-f$."},{"t":"key","x":"$$F_{\\parallel}=mg\\sin\\theta,\\qquad F_{\\perp}=mg\\cos\\theta=N$$"},{"t":"ex","title":"Frictionless slope","q":"A $5.0\\ \\text{kg}$ block sits on a frictionless $30^\\circ$ slope. Find its acceleration and the normal force.","s":["$a=g\\sin30^\\circ=4.9\\ \\text{m s}^{-2}$ down the slope.","$N=mg\\cos30^\\circ=5.0(9.8)(0.866)=42.4\\ \\text{N}$."],"a":"$4.9\\ \\text{m s}^{-2}$ down the slope and $42.4\\ \\text{N}$."},{"t":"int","name":"incline","cap":"Change the slope angle and the friction coefficient. The block slides only when the down-slope component beats the maximum friction."},{"t":"warn","x":"The normal force on a slope is **less than** $mg$ (it equals $mg\\cos\\theta$). Using $N=mg$ on a slope is one of the most common errors."}]},{"id":"ph3-c02-s3","code":"2.3","title":"Friction","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: friction coefficient physics","url":"https://www.youtube.com/results?search_query=Flipping+Physics+friction+coefficient+physics","kind":"search"}]},{"t":"p","x":"**Static friction** adjusts up to a maximum $\\mu_sN$ to stop sliding. **Kinetic friction** acts on a sliding object and equals $\\mu_kN$ in the direction opposing motion. A block just on the point of sliding on a slope has $\\tan\\theta=\\mu_s$."},{"t":"ex","title":"Sliding with friction","q":"A block slides down a $30^\\circ$ slope with $\\mu_k=0.30$. Find its acceleration.","s":["$mg\\sin\\theta-\\mu_kmg\\cos\\theta=ma$.","$a=9.8(\\sin30^\\circ-0.30\\cos30^\\circ)=9.8(0.500-0.260)=2.35\\ \\text{m s}^{-2}$."],"a":"$2.35\\ \\text{m s}^{-2}$ down the slope."},{"t":"ex","title":"Critical angle","q":"A block is on a slope with $\\mu_s=0.60$. Find the greatest angle before it slides.","s":["$\\tan\\theta=\\mu_s=0.60$."],"a":"$\\theta=31.0^\\circ$"},{"t":"ex","title":"Pushed up a slope at constant speed","q":"A $2.0\\ \\text{kg}$ block is pushed up a $20^\\circ$ slope at constant speed with $\\mu_k=0.20$. Find the force parallel to the slope.","s":["$F=mg\\sin\\theta+\\mu_kmg\\cos\\theta=19.6(0.342+0.2\\times0.940)=10.4\\ \\text{N}$."],"a":"$10.4\\ \\text{N}$ up the slope."}]},{"id":"ph3-c02-s4","code":"2.4","title":"Pulleys and connected objects","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: pulleys Atwood machine connected objects","url":"https://www.youtube.com/results?search_query=Flipping+Physics+pulleys+Atwood+machine+connected+objects","kind":"search"}]},{"t":"p","x":"Treat the system as one object when the string is taut and does not stretch, so both masses share the same acceleration. For two masses over a light pulley, $a=\\dfrac{(m_1-m_2)g}{m_1+m_2}$. Then use one mass alone to find the tension."},{"t":"ex","title":"Atwood machine","q":"Masses of $5.0\\ \\text{kg}$ and $3.0\\ \\text{kg}$ hang from a light string over a pulley. Find the acceleration and the tension.","s":["$a=\\frac{(5.0-3.0)(9.8)}{8.0}=2.45\\ \\text{m s}^{-2}$.","For the lighter mass, $T-mg=ma\\Rightarrow T=3.0(9.8+2.45)=36.8\\ \\text{N}$."],"a":"$2.45\\ \\text{m s}^{-2}$ and $36.8\\ \\text{N}$."}]},{"id":"ph3-c02-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Always draw the free-body diagram.** Label every force with its name and direction, show the axes along and perpendicular to the slope, and write $\\Sigma F=ma$ for each axis. A correct diagram earns marks even if the arithmetic goes wrong."},{"t":"p","x":"**Units and figures.** Forces in newtons, acceleration in $\\text{m s}^{-2}$, 2 or 3 significant figures. Do not round until the final line."}]}],"quiz":[{"topic":"Normal","q":"A $10\\ \\text{kg}$ object rests on level ground. Find the normal force (N).","a":"98","alt":[],"ad":"$98\\ \\text{N}$","sol":"$N=mg=10(9.8)$.","h":["On level ground $N=mg$.","$10\\times9.8$.","Compute."]},{"topic":"Slope component","q":"A $4.0\\ \\text{kg}$ block is on a $20^\\circ$ slope. Find the component of its weight down the slope (N, 1 decimal place).","a":"13.4","alt":[],"ad":"$13.4\\ \\text{N}$","sol":"$mg\\sin20^\\circ=39.2(0.342)=13.4$.","h":["Along the slope uses sine.","$mg=39.2$.","$39.2\\sin20^\\circ$."]},{"topic":"Slope normal","q":"A $4.0\\ \\text{kg}$ block is on a $20^\\circ$ slope. Find the normal force (N, 1 decimal place).","a":"36.8","alt":[],"ad":"$36.8\\ \\text{N}$","sol":"$mg\\cos20^\\circ=39.2(0.940)=36.8$.","h":["Perpendicular uses cosine.","$mg=39.2$.","$39.2\\cos20^\\circ$."]},{"topic":"Frictionless acceleration","q":"Find the acceleration of a block on a frictionless $40^\\circ$ slope ($\\text{m s}^{-2}$, 2 decimal places).","a":"6.30","alt":["6.3"],"ad":"$6.30\\ \\text{m s}^{-2}$","sol":"$a=g\\sin40^\\circ=9.8(0.643)=6.30$.","h":["Mass cancels.","$a=g\\sin\\theta$.","$9.8\\sin40^\\circ$."]},{"topic":"Friction force","q":"$N=40\\ \\text{N}$ and $\\mu_k=0.25$. Find the kinetic friction (N).","a":"10","alt":["10.0"],"ad":"$10\\ \\text{N}$","sol":"$f=\\mu N=0.25\\times40$.","h":["$f=\\mu N$.","$0.25\\times40$.","Compute."]},{"topic":"Constant speed","q":"A block slides down a $20^\\circ$ slope at constant speed. Find $\\mu_k$ (2 decimal places).","a":"0.36","alt":[],"ad":"$0.36$","sol":"Net force zero: $mg\\sin\\theta=\\mu mg\\cos\\theta$, so $\\mu=\\tan20^\\circ=0.364$.","h":["Constant speed means zero net force.","$\\sin\\theta=\\mu\\cos\\theta$.","$\\mu=\\tan\\theta$."]},{"topic":"Critical angle","q":"A block just begins to slide when the slope is $\\theta$ and $\\mu_s=1.0$. Find $\\theta$ (degrees).","a":"45","alt":[],"ad":"$45^\\circ$","sol":"$\\tan\\theta=1.0$.","h":["$\\tan\\theta=\\mu_s$.","$\\tan^{-1}1$.","Compute."]},{"topic":"With friction","q":"Find the acceleration of a block on a $30^\\circ$ slope with $\\mu_k=0.20$ ($\\text{m s}^{-2}$, 2 decimal places).","a":"3.20","alt":["3.2"],"ad":"$3.20\\ \\text{m s}^{-2}$","sol":"$a=9.8(0.5-0.2\\cos30^\\circ)=9.8(0.327)=3.20$.","h":["$a=g(\\sin\\theta-\\mu\\cos\\theta)$.","$\\cos30^\\circ=0.866$.","Compute."]},{"topic":"Weight","q":"Find the weight of a $3.0\\ \\text{kg}$ object (N).","a":"29.4","alt":["29"],"ad":"$29.4\\ \\text{N}$","sol":"$W=mg=3.0(9.8)$.","h":["$W=mg$.","$3.0\\times9.8$.","Compute."]},{"topic":"Newton's second law","q":"Net force $12\\ \\text{N}$ acts on $3.0\\ \\text{kg}$. Find $a$ ($\\text{m s}^{-2}$).","a":"4.0","alt":["4"],"ad":"$4.0\\ \\text{m s}^{-2}$","sol":"$a=F/m$.","h":["$a=F/m$.","$12/3$.","Compute."]}],"comets":[{"topic":"Extension: Atwood","q":"Masses of $5.0\\ \\text{kg}$ and $3.0\\ \\text{kg}$ hang over a light pulley. Find the acceleration ($\\text{m s}^{-2}$, 2 decimal places).","a":"2.45","alt":[],"ad":"$2.45\\ \\text{m s}^{-2}$","sol":"$a=\\frac{(5-3)(9.8)}{8}=2.45$.","h":["Treat the system as one object.","Net driving force $(m_1-m_2)g$.","Total mass $8$ kg."]}],"hours":3},"ph3-c03":{"id":"ph3-c03","interactive":"none","summary":"Objects moving in a circle accelerate toward the centre even at constant speed. This chapter covers uniform circular motion, centripetal acceleration and force, horizontal circles including flat and banked curves, and vertical circles.","videos":[{"src":"F","title":"Centripetal acceleration and force","url":"https://www.youtube.com/results?search_query=Flipping+Physics+centripetal+force+circular+motion+physics","kind":"search"},{"src":"K","title":"Uniform circular motion","url":"https://www.youtube.com/results?search_query=Khan+Academy+uniform+circular+motion+centripetal+acceleration","kind":"search"},{"src":"V","title":"Veritasium: Why does the water stay in the bucket","url":"https://www.youtube.com/results?search_query=Veritasium+centrifugal+force","kind":"search"}],"sections":[{"id":"ph3-c03-s1","code":"3.1","title":"Uniform circular motion","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: uniform circular motion","url":"https://www.youtube.com/results?search_query=Flipping+Physics+uniform+circular+motion","kind":"search"}]},{"t":"p","x":"In **uniform circular motion** the speed is constant but the **direction changes**, so the velocity changes and the object **accelerates toward the centre**. For a radius $r$ and period $T$ (time for one revolution): $v=\\dfrac{2\\pi r}{T}=2\\pi rf$ where $f=\\frac1T$ is the frequency in hertz. Angular speed $\\omega=\\dfrac{2\\pi}{T}$ in $\\text{rad s}^{-1}$ and $v=\\omega r$."},{"t":"key","x":"$$v=\\frac{2\\pi r}{T},\\qquad a_c=\\frac{v^2}{r}=\\frac{4\\pi^2r}{T^2}=\\omega^2r$$"},{"t":"ex","title":"Speed and acceleration","q":"A stone on a $0.80\\ \\text{m}$ string is whirled at $2.0$ revolutions per second. Find its speed and centripetal acceleration.","s":["$T=0.50\\ \\text{s}$; $v=\\frac{2\\pi(0.80)}{0.50}=10.1\\ \\text{m s}^{-1}$.","$a_c=\\frac{v^2}{r}=\\frac{10.05^2}{0.80}=126\\ \\text{m s}^{-2}$."],"a":"$10.1\\ \\text{m s}^{-1}$ and $126\\ \\text{m s}^{-2}$ toward the centre."},{"t":"warn","x":"\"Centrifugal force\" is not a real force on the object. The object would move in a straight line at a tangent if the inward force vanished. Always name the real force providing the centripetal force (tension, friction, normal force, gravity)."}]},{"id":"ph3-c03-s2","code":"3.2","title":"Centripetal force","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: centripetal force","url":"https://www.youtube.com/results?search_query=Flipping+Physics+centripetal+force","kind":"search"}]},{"t":"p","x":"**Centripetal force** is the **net** force toward the centre: $F_c=ma_c=\\dfrac{mv^2}{r}$. It is not a new force; it is the resultant of the real forces. On a flat curve it is **friction**; on a string it is **tension**; for a planet it is **gravity**."},{"t":"ex","title":"Car on a flat curve","q":"A $1200\\ \\text{kg}$ car goes around a flat curve of radius $50\\ \\text{m}$ at $15\\ \\text{m s}^{-1}$. Find the friction force needed and the minimum coefficient of friction.","s":["$F=\\frac{mv^2}{r}=\\frac{1200(225)}{50}=5400\\ \\text{N}$.","$\\mu mg=\\frac{mv^2}{r}\\Rightarrow\\mu=\\frac{v^2}{rg}=\\frac{225}{50(9.8)}=0.46$."],"a":"$5400\\ \\text{N}$ and $\\mu\\ge0.46$."}]},{"id":"ph3-c03-s3","code":"3.3","title":"Banked curves and horizontal circles","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: banked curves circular motion","url":"https://www.youtube.com/results?search_query=Flipping+Physics+banked+curves+circular+motion","kind":"search"}]},{"t":"p","x":"On a **frictionless banked curve**, the horizontal component of the normal force provides the centripetal force: $N\\sin\\theta=\\frac{mv^2}{r}$ and $N\\cos\\theta=mg$. Dividing gives $\\tan\\theta=\\dfrac{v^2}{rg}$. The same method works for a conical pendulum (tension has horizontal and vertical components)."},{"t":"ex","title":"Banked road","q":"At what angle should a frictionless curve of radius $80\\ \\text{m}$ be banked for $20\\ \\text{m s}^{-1}$?","s":["$\\tan\\theta=\\frac{v^2}{rg}=\\frac{400}{80(9.8)}=0.510$."],"a":"$\\theta=27.0^\\circ$"},{"t":"p","x":"**Method:** resolve forces vertically (no acceleration) and horizontally toward the centre ($F=mv^2/r$), then combine."}]},{"id":"ph3-c03-s4","code":"3.4","title":"Vertical circles","blocks":[{"t":"vid","items":[{"src":"F","title":"Flipping Physics: vertical circle circular motion","url":"https://www.youtube.com/results?search_query=Flipping+Physics+vertical+circle+circular+motion","kind":"search"}]},{"t":"p","x":"In a vertical circle, speed changes and the net inward force changes with position. **Top:** $T+mg=\\frac{mv^2}{r}$. **Bottom:** $T-mg=\\frac{mv^2}{r}$. The minimum speed at the top for a string to stay taut is when $T=0$: $v_{\\min}=\\sqrt{gr}$. On a hill or bridge, $mg-N=\\frac{mv^2}{r}$ at the top, so you feel lighter."},{"t":"ex","title":"Bottom of a swing","q":"A $2.0\\ \\text{kg}$ mass moves at $3.0\\ \\text{m s}^{-1}$ at the bottom of a vertical circle of radius $1.5\\ \\text{m}$. Find the tension.","s":["$T-mg=\\frac{mv^2}{r}$, so $T=2.0\\left(9.8+\\frac{9.0}{1.5}\\right)=31.6\\ \\text{N}$."],"a":"$31.6\\ \\text{N}$"},{"t":"ex","title":"Minimum speed","q":"Find the minimum speed at the top of a vertical circle of radius $0.50\\ \\text{m}$.","s":["$T=0\\Rightarrow mg=\\frac{mv^2}{r}\\Rightarrow v=\\sqrt{gr}=\\sqrt{4.9}=2.21\\ \\text{m s}^{-1}$."],"a":"$2.21\\ \\text{m s}^{-1}$"}]},{"id":"ph3-c03-s5","code":"X","title":"Exam toolkit","blocks":[{"t":"p","x":"**Say which force.** Examiners want the real force supplying the centripetal force, and its direction toward the centre. \"Centripetal force\" alone as a labelled arrow on a free-body diagram is usually wrong."},{"t":"p","x":"**Check your signs.** Take the direction toward the centre as positive for circular-motion equations. At the top of a circle gravity points toward the centre; at the bottom it points away."}]}],"quiz":[{"topic":"Speed","q":"A stone moves in a circle of radius $2.0\\ \\text{m}$ with period $4.0\\ \\text{s}$. Find its speed ($\\text{m s}^{-1}$, 2 decimal places).","a":"3.14","alt":[],"ad":"$3.14\\ \\text{m s}^{-1}$","sol":"$v=\\frac{2\\pi(2.0)}{4.0}=3.14$.","h":["$v=2\\pi r/T$.","$2\\pi\\times2.0=12.57$.","Divide by 4.0."]},{"topic":"Acceleration","q":"$v=6.0\\ \\text{m s}^{-1}$ and $r=3.0\\ \\text{m}$. Find the centripetal acceleration ($\\text{m s}^{-2}$).","a":"12","alt":["12.0"],"ad":"$12\\ \\text{m s}^{-2}$","sol":"$a=v^2/r=36/3.0$.","h":["$a=v^2/r$.","$36\\div3$.","Compute."]},{"topic":"Force","q":"A $0.50\\ \\text{kg}$ mass moves at $4.0\\ \\text{m s}^{-1}$ on a radius of $2.0\\ \\text{m}$. Find the centripetal force (N).","a":"4.0","alt":["4"],"ad":"$4.0\\ \\text{N}$","sol":"$F=mv^2/r=0.50(16)/2.0$.","h":["$F=mv^2/r$.","$16/2$.","Multiply by 0.50."]},{"topic":"Period","q":"A motor turns at $5.0\\ \\text{Hz}$. Find the period (s).","a":"0.20","alt":["0.2"],"ad":"$0.20\\ \\text{s}$","sol":"$T=1/f$.","h":["$T=1/f$.","$1/5.0$.","Compute."]},{"topic":"Minimum speed","q":"Find the minimum speed at the top of a vertical circle of radius $2.5\\ \\text{m}$ ($\\text{m s}^{-1}$, 2 decimal places).","a":"4.95","alt":[],"ad":"$4.95\\ \\text{m s}^{-1}$","sol":"$v=\\sqrt{gr}=\\sqrt{24.5}=4.95$.","h":["Tension is zero at the minimum.","$mg=mv^2/r$.","$v=\\sqrt{gr}$."]},{"topic":"Banking","q":"A frictionless curve of radius $50\\ \\text{m}$ is designed for $14\\ \\text{m s}^{-1}$. Find the banking angle (degrees, 1 decimal place).","a":"21.8","alt":[],"ad":"$21.8^\\circ$","sol":"$\\tan\\theta=\\frac{196}{490}=0.40$, $\\theta=21.8^\\circ$.","h":["$\\tan\\theta=v^2/rg$.","$196/490$.","$\\tan^{-1}0.40$."]},{"topic":"Accelerating?","q":"A satellite orbits at constant speed in a circle. Is it accelerating? Answer yes or no.","a":"yes","alt":["Yes"],"ad":"Yes","sol":"Direction of velocity changes, so acceleration is non-zero toward the centre.","h":["Acceleration is change in velocity.","Velocity is a vector.","Direction changes."]},{"topic":"Bottom tension","q":"$m=2.0\\ \\text{kg}$, $v=3.0\\ \\text{m s}^{-1}$, $r=1.5\\ \\text{m}$ at the bottom of a vertical circle. Find the tension (N, 1 decimal place).","a":"31.6","alt":[],"ad":"$31.6\\ \\text{N}$","sol":"$T=m(g+v^2/r)=2.0(9.8+6.0)$.","h":["Tension minus weight gives centripetal force.","$T=mg+mv^2/r$.","Substitute."]},{"topic":"Hill","q":"A $1000\\ \\text{kg}$ car crosses the top of a hill of radius $40\\ \\text{m}$ at $10\\ \\text{m s}^{-1}$. Find the normal force (N).","a":"7300","alt":[],"ad":"$7300\\ \\text{N}$","sol":"$N=m(g-v^2/r)=1000(9.8-2.5)=7300$.","h":["Weight minus normal gives the inward force.","$mg-N=mv^2/r$.","Substitute."]},{"topic":"Angular speed","q":"A wheel turns at $60\\ \\text{rpm}$. Find $\\omega$ ($\\text{rad s}^{-1}$, 2 decimal places).","a":"6.28","alt":[],"ad":"$6.28\\ \\text{rad s}^{-1}$","sol":"$f=1\\ \\text{Hz}$, $\\omega=2\\pi f$.","h":["Convert to revolutions per second.","$\\omega=2\\pi f$.","$2\\pi\\times1$."]}],"comets":[{"topic":"Extension: Lifting off","q":"A car crosses the top of a hill of radius $40\\ \\text{m}$. At what speed does the normal force become zero ($\\text{m s}^{-1}$, 1 decimal place)?","a":"19.8","alt":[],"ad":"$19.8\\ \\text{m s}^{-1}$","sol":"$N=0\\Rightarrow mg=\\frac{mv^2}{r}\\Rightarrow v=\\sqrt{gr}=\\sqrt{392}=19.8$.","h":["Set $N=0$.","$mg=mv^2/r$.","$v=\\sqrt{gr}$."]},{"topic":"Extension: Flat curve limit","q":"The maximum speed on a flat curve of radius $40\\ \\text{m}$ with $\\mu=0.50$ is?","a":"14","alt":["14.0"],"ad":"$14\\ \\text{m s}^{-1}$","sol":"$\\mu mg=\\frac{mv^2}{r}\\Rightarrow v=\\sqrt{\\mu gr}=\\sqrt{196}=14$.","h":["Friction provides the inward force.","$\\mu g=v^2/r$.","$v=\\sqrt{\\mu gr}$."]}],"hours":4},"ph3-c04":{"id":"ph3-c04","interactive":"orbit","summary":"Every mass attracts every other mass. This chapter covers Newton's law of universal gravitation, gravitational field strength and the inverse-square law, orbital speed and period, Kepler's laws, geostationary satellites and apparent weightlessness.","videos":[{"src":"F","title":"Newton's law of universal gravitation","url":"https://www.youtube.com/results?search_query=Flipping+Physics+Newton+law+of+gravitation+physics+orbits","kind":"search"},{"src":"K","title":"Orbits and Kepler's laws","url":"https://www.youtube.com/results?search_query=Khan+Academy+Kepler+laws+orbits+physics","kind":"search"},{"src":"V","title":"Veritasi
